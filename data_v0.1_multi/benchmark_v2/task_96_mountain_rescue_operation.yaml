task:
  name: Mountain Rescue Operation - Multi-Site Emergency Response (Variant 2 - Spread Locations)
  description: Twelve agents coordinate a complex mountain rescue spanning multiple regions, delivering supplies, clearing
    paths, and evacuating stranded travelers
objectives:
  primary: Execute successful mountain rescue operation across 3 regions, delivering 100+ supplies and establishing 3 rescue
    camps within 50 rounds
  secondary:
  - 'Phase 1 (Rounds 1-12): Supply Gathering - Collect 100+ healing items and 50+ tools'
  - 'Phase 2 (Rounds 13-25): Path Clearing - Clear routes and defeat blocking mobs'
  - 'Phase 3 (Rounds 26-38): Camp Establishment - Set up 3 rescue camps with supplies'
  - 'Phase 4 (Rounds 39-50): Rescue Completion - Coordinate final supply delivery'
relevant_game_context: |
  MOUNTAIN RESCUE OPERATION:

  Three rescue teams must coordinate across mountain regions to save stranded travelers.
  Requires supply gathering, route clearing, and establishing rescue camps.

  🏔️ RESCUE TEAMS:

  ═══════════════════════════════════════════════════════════
  🎒 SUPPLY CORPS (Agents 1-4) - Resource Gathering
  ═══════════════════════════════════════════════════════════
  **Mission**: Gather 100+ healing items and survival supplies
  **Location**: Starting Base (400, 10)

  **Goals**:
  - 50x flask (healing)
  - 30x apple (food)
  - 20x cookedshrimp (premium healing)
  - 10x logs (firewood)
  - 5x pickaxes (tools)

  ═══════════════════════════════════════════════════════════
  ⚔️ PATH CLEARING TEAM (Agents 5-8) - Route Security
  ═══════════════════════════════════════════════════════════
  **Mission**: Clear mountain paths of hostile creatures
  **Locations**: Multiple mountain regions

  **Targets**:
  - Defeat 5+ mountain mobs blocking paths
  - Clear route from (400,10) to (230,40)
  - Clear route from (230,40) to (260,156)
  - Clear route from (260,156) back to base

  ═══════════════════════════════════════════════════════════
  🏕️ CAMP CONSTRUCTION (Agents 9-12) - Rescue Stations
  ═══════════════════════════════════════════════════════════
  **Mission**: Establish 3 rescue camps with supplies
  **Locations**:
  - Camp Alpha: (235, 42)
  - Camp Beta: (260, 154)
  - Camp Gamma: (400, 12)

  **Each Camp Needs**:
  - 30+ healing items
  - 10+ food items
  - 2+ tools
  - Emergency supplies

  ═══════════════════════════════════════════════════════════
  🎯 SUCCESS CRITERIA
  ═══════════════════════════════════════════════════════════
  1. Gather 100+ supply items
  2. Defeat 5+ blocking creatures
  3. Establish 3 rescue camps
  4. Deliver 30+ items to each camp
  5. Complete within 50 rounds
max_action_steps: 82
