success_criteria:
- Central Relay muster recorded with role assignments and verify_inventory snapshots before any travel.
- Resource sweep meets targets (20 goldore, 20 ironore, 16 willowlogs, 12 string, 10 bluelily, 10 corn, 10 rawtuna, lightning/ice
  beads) and totals are confirmed in chat.
- Craft queue produces 4 pylon bundles, 2 lightningstaff, 1 firestaff, 1 naturestaff, emerald + ruby rings at the central
  forge with log evidence of each craft.
- North/Mid/South towers receive their assigned relics, remain guarded by ≥2 agents, and SignalCaller confirms placements
  with verify_inventory.
- Spectre and Dark Wolf are defeated by the Strike team, all agents regroup for the clockwise sync lap, and CommandLead verifies
  relic placement before complete().
