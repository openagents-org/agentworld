task:
  name: Stormspire Barrier Reboot - Continental Skyshield Reactivation (Variant 2 - Spread Locations)
  description: Ten specialists relight the Stormspire barrier network by synchronizing three relay towers, charging them with
    crafted relics, and repelling roaming elites within 55 rounds.
objectives:
  primary: Craft the Storm Relic set (4 goldbar pylons, 2 lightningstaff, 1 firestaff, 1 naturestaff, 2 enchanted rings),
    install them at the North/Mid/South towers ((320,120), (350,300), (380,520)), and defeat the Spectre (230,30) plus Dark
    Wolf (1016,682) to seal the grid.
  secondary:
  - 'Phase 1: Muster at Central Relay (350,300), assign three tower squads (North, Mid, South) plus a roaming Strike pair;
    log the formation before splitting.'
  - 'Phase 2: Resource sweep — Mountain cell mines 20 goldore + 20 ironore, Coastal cell harvests 16 willowlogs + 12 string,
    Marsh cell gathers 10 bluelily + 10 corn, Arctic cell fishes 10 rawtuna + hunts ice mobs for beads.'
  - 'Phase 3: Forge & Alchemy — Smelt 10 goldbar + 10 ironbar, craft 4 pylons (use goldbar), 2 lightningstaff, 1 firestaff,
    1 naturestaff, 2 rings (emerald + ruby) while rotating crafters through the same forge to avoid queue deadlock.'
  - 'Phase 4: Tower activation — Move in convoys to each tower, plant one lightningstaff + ring at North, pylons + firestaff
    at Mid, pylons + naturestaff at South; SignalCaller verifies installs with inventory screenshots.'
  - 'Phase 5: Strike missions — Roaming pair eliminates Spectre (230,30) and Dark Wolf (1016,682) using crafted gear, then
    all squads regroup at Mid tower to run clockwise barrier sync before complete().'
relevant_game_context: |
  STAGING & COMMS
  - Keep everyone within 4 tiles at (350,300) until roles are declared. Use call signs [NORTH], [MID], [SOUTH], [STRIKE], [LOGI]. CommandLead keeps the checklist and timestamps.
  - Before any team departs, broadcast verify_inventory results for tools and food so CommandLead can confirm no one leaves understocked.

  RESOURCE PATHING
  - Mountain cell operates near (238,48); harvest_resource for logs if pickaxe repairs needed. Mine gold/iron there, but do NOT craft until ore totals broadcast.
  - Coastal cell collects willowlogs at (175,635) and string from shoreline plants. Marsh cell forages 10 bluelily + 10 corn around (400,520) for alchemy rations.
  - Arctic cell (250,150) fishes rawtuna (healing) and farms Ice Guardians/Mimics for lightningbead/icebead drops. Always travel in pairs for bead runs.

  CRAFTING QUEUE
  - Use the forge at (350,300) for all smelting/crafting to centralize verification. Sequence suggestion: smelt bars → craft gold ring (Smithing) and silver ring upgrades → craft_item Crafting beryl/ruby components → upgrade to emerald/ruby rings.
  - Staff pipeline: craft_item Crafting staff for blanks, then use lightningbead/firebead/naturebead to upgrade. Announce each craft with bead counts so others know remaining stock.
  - Pylons are role-played as goldbar + logs bundles; represent them with stacks of goldbar + logs in Quartermaster inventory (4 sets) and describe placement in chat.

  TOWER INSTALLATION
  - Travel as convoys (minimum 3 agents). Upon arrival, plant relics by transferring required items to the designated tower captain, who immediately announces "Tower X armed" along with verify_inventory showing the handoff.
  - Towers must stay staffed: at least two guardians remain within 3 tiles after placement until final sync. If a guardian leaves, call "Tower destabilized" and pause progression.

  STRIKE PROTOCOL
  - Strike pair (StormStriker + ShadowArcher) escorts by SignalCaller for heals. Before attacking Spectre/Dark Wolf, run HP>80% check, confirm weapons, then use attack_mob on the called ID. Report loot, especially extra beads/logs; deliver to CommandLead.
  - After both elites fall, everyone regroups at Mid tower. Run clockwise lap: Mid → North → South → Mid while chanting barrier status. complete() only after CommandLead confirms all relics remain placed, towers staffed, and elites defeated.
max_action_steps: 80
