task:
  name: Legendary Equipment Forge - Ultimate Gear Creation (Variant 2 - Spread Locations)
  description: 'Nine master craftsmen unite to create the ultimate equipment set: legendary golden items, magical staffs,
    and complete combat gear'
objectives:
  primary: 'Forge legendary equipment set: 5+ golden items, 4+ magical staffs, 6+ elite weapons/armor for complete legendary
    arsenal'
  secondary:
  - 'Conquest 1 (Rounds 1-18): Massive Resource Gathering - Mine 100+ ores, gather magical components'
  - 'Conquest 2 (Rounds 19-32): Industrial Smelting - Produce 80+ bars from ores'
  - 'Conquest 3 (Rounds 33-48): Legendary Crafting - Forge all legendary items'
  - 'Conquest 4 (Rounds 49-54): Arsenal Exhibition - Display complete legendary set'
relevant_game_context: |
  LEGENDARY GOAL
  - Nine specialists must gather huge material quotas (49 gold ore, 20 iron ore, 69 coal, logs, strings, hilts, 8 beads) and craft 15 legendary items (5 golden pieces, 4 elemental staffs, 6 elite weapons/tools) within ~54 rounds. Miners and hunters work remotely while the forge duo at (528,384) handles smelting and crafting.

  ROADMAP
  1. R1-18 Extraction: Gold team splits the 49-ore requirement; Iron/Coal team digs 20 iron + 69 coal; component hunters secure beads/strings/logs/hilts. Everyone reports tallies frequently.
  2. R19-28 Caravan: all gatherers march to the forge (≤32-tile hops). Transfer ores/coal to Master_Smelter; hand beads/string/logs/hilts to the Legendary Crafter. Verify inventories after each handoff.
  3. R29-48 Production: Master_Smelter smelts 49 gold bars and 20 iron bars (announce milestones every ~10 bars). The crafter then builds in phases: golden sword/bow/boots/rings, crafts sticks/staffs for elemental upgrades, and forges heavy swords, pickaxes, and battle axes.
  4. R49-54 Exhibition: list the final arsenal, confirm counts per category (golden items, staffs, elite weapons), and deliver the completion summary.

  EXECUTION NOTES
  - If observe_environment isn’t available, sweep the mining/plains grids manually; rely on harvest_resource and verify_inventory for confirmation.
  - Keep a shared checklist (“Gold 30/49”, “Beads special 3/4”) so the forge knows when each material stream is ready.
  - Transfers only succeed within ~10 tiles—announce both send and receive events to avoid missing materials.
max_action_steps: 77
