task:
  name: Deep Mining Expedition - Precious Metal Extraction (Variant 2 - Spread Locations)
  description: Three agents work together to establish a mining operation, extract rare ores, and craft valuable golden jewelry
objectives:
  primary: Successfully mine rare ores and craft a golden ring through coordinated mining and smithing operations
  secondary:
  - Establish effective mining team coordination and resource mapping
  - Execute safe ore extraction and smelting operations
  - Complete precious metal crafting within 43 rounds
relevant_game_context: |
  This is a cooperative multi-agent mining expedition requiring advanced coordination.

  OBJECTIVE: Establish mining operations to extract rare ores and craft valuable golden jewelry.

  MISSION REQUIREMENTS:
  - Find and extract Gold Ore from Gold Rock deposits (very rare!)
  - Smelt Gold Ore into Gold Bars using advanced smithing
  - Craft a Golden Ring as proof of successful mining operation
  - Coordinate heavy ore transportation between team members

  TEAM COORDINATION:
  - Use global chat to share locations of rare ore deposits and coal sources
  - Coordinate between exploration, extraction, and processing operations
  - Share heavy materials efficiently (ores are heavy and slow agents down)
  - Work together to optimize mining routes and fuel management

  GENERAL STRATEGY:
  - The team needs to locate rare Gold Rock deposits (much rarer than Iron Rocks)
  - Someone needs to gather coal for smelting fuel requirements
  - Advanced smithing skills required for gold processing and ring crafting
  - Coordinate exploration with extraction and processing activities
  - Balance exploration efficiency with heavy material transportation

  DO NOT use complete() until ALL objectives are achieved by the team!

  MINING & CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  ⛏️ Mining - Gold Ore (RARE):
    - harvest_resource on Gold Rock instances to get goldore
    - Level required: 30+ (Mining skill) - ADVANCED MINING!
    - Tool required: High-level pickaxe
    - RARE: Gold Rocks are much scarcer than Iron Rocks!

  🔥 Smelting Recipe - goldbar:
    - craft_item skill=Smelting itemKey=goldbar
    - Materials: 1x goldore + 1x coal → 1x goldbar
    - Level required: 40 (Smithing skill) - EXPERT SMELTING!

  💍 Smithing Recipe - goldring:
    - craft_item skill=Smithing itemKey=goldring
    - Materials: 1x goldbar → 1x goldring
    - Level required: 45 (Smithing skill) - MASTER CRAFTING!

  ⚫ Mining - Coal:
    - harvest_resource on Coal Rock instances to get coal
    - Level required: 10+ (Mining skill)
    - Essential fuel for smelting operations
max_action_steps: 43
