task:
  name: Royal Banquet Preparation - Gourmet Multi-Course Feast (Variant 2 - Spread Locations)
  description: Eight culinary specialists coordinate to prepare an elaborate royal banquet with 12+ gourmet dishes, rare ingredients,
    and exquisite presentation
objectives:
  primary: 'Prepare a complete royal banquet: 8+ cooked dishes, 4+ specialty items, 60+ rare ingredients for the royal feast'
  secondary:
  - 'Course 1 (Rounds 1-15): Rare Ingredient Gathering - Hunt, fish, and forage premium ingredients'
  - 'Course 2 (Rounds 16-28): Ingredient Processing - Transport and prepare ingredients'
  - 'Course 3 (Rounds 29-45): Gourmet Cooking - Create all banquet dishes'
  - 'Course 4 (Rounds 46-53): Banquet Assembly - Present complete feast'
relevant_game_context: |
  BANQUET OVERVIEW
  - Eight chefs split into hunting, fishing, foraging, and kitchen crews to deliver by Round 53: 8 cooked dishes (corn stew ×2, cooked beef, tuna sushi, cooked shrimp ×2, cooked chicken, jellyfish smoothie) plus 4 decorative gifts (2 beryl pendants, 2 silver rings) using at least 60 premium ingredients.

  WORKFLOW
  1. R1-15 Gathering
     • Hunters near (350,250) farm chickens/cows for meat.
     • Fishers on the eastern coast (~900,400) net tuna, shrimp, jellyfish.
     • Foragers in the western forest (~250,350) collect corn, mushrooms, herbs, beryl, string.
     • Kitchen duo at (528,384) monitors chat and checks starting bowls/iron bars.
  2. R16-28 Delivery
     • All gatherers march toward the royal kitchen in ≤32-tile hops and transfer ingredients via transfer_items (meat/veg → Head_Chef, gems/strings → Decorator). After each transfer, both parties verify_inventory and log totals.
  3. R29-45 Cooking & Crafting
     • Head_Chef cooks the eight dishes consecutively once ingredients arrive; mention each completion (“Corn stew 1/2”).
     • Decorator uses the supplied beryl/string/iron bars to craft pendants and silver rings (smelt extra iron if needed).
  4. R46-53 Assembly
     • Team reviews inventories, plates the courses, and records a final menu summary before complete().

  EXECUTION NOTES
  - Without observe_environment, sweep the suggested coordinate bands manually; rely on harvest_resource/attack_entity results and verify_inventory counts.
  - Healing: hunters/fishers should eat apples/flasks when HP < 70% so ingredient loss is avoided.
  - Keep a rolling checklist in chat ("Seafood 5/8", "Decor 1/4") so the kitchen knows when to start each dish.

  COMPLETION CHECK
  - Final message must list all cooked dishes and decorative pieces with the carrier. Only call complete() after the feast inventory is confirmed and everyone is at the kitchen.
max_action_steps: 75
