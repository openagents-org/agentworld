task:
  name: Multi-Biome Resource Caravan - Continental Trading Route (Variant 2 - Spread Locations)
  description: Eight traders establish trading routes across 6 biomes, gathering unique resources from each region and creating
    diverse collection
objectives:
  primary: Establish continental trading route visiting 6 biomes, gather 80+ unique resources, craft 12+ regional specialty
    items
  secondary:
  - 'Route 1 (Rounds 1-13): Forest & Plains - Lumber and herbs'
  - 'Route 2 (Rounds 14-26): Mountains & Coast - Ores and seafood'
  - 'Route 3 (Rounds 27-40): Desert & Ice - Exotic materials'
  - 'Route 4 (Rounds 41-52): Return & Processing - Craft regional items'
relevant_game_context: |
  CARAVAN OVERVIEW
  - Eight traders must visit six biomes (forest, plains, mountains, coast, desert, ice), collect ≥80 total resources (≈15 per fertile biome, 10 per harsh biome), then craft ≥12 regional goods back at the hub by Round 52.

  ROUTE PLAN
  1. R1-13 Forest + Plains: start at (350,250), swing west to (250,350) for logs/herbs, then back through the plains for animal/plant goods. Track subtotals (“Forest 12/15”).
  2. R14-26 Mountains + Coast: push north-east to (230,38) for ores/coal, then march to (900,400) for seafood/shells. Use ≤32-tile moves and keep caravan leaders posting coordinates.
  3. R27-40 Desert + Ice: head south to (400,680) for cacti/desert drops, then north to the ice ridge (~259,151) for ice logs/palm logs. Maintain HP with flasks; avoid optional bosses.
  4. R41-52 Return & Craft: converge on the central hub (528,384), hand off materials to the crafting duo, and produce the regional specialties (smelted goods, cooked dishes, artisan crafts). Summaries should mention which biome each item represents.

  EXECUTION NOTES
  - If observe_environment isn’t callable, rely on systematic sweeping (e.g., forest grid laps) and harvest_resource feedback plus verify_inventory counts.
  - Use chat threads to record travel checkpoints (“Route 2 hop 3: (300,120)”), resource totals, and pending needs (“Need 3 more desert mats”).
  - Crafting can start as soon as the caravan reaches the hub; prioritize items tied to scarce materials so later substitutions are easier.

  COMPLETION CHECK
  - Before complete(), list the six biomes visited, resource totals per region, and the 12 crafted items with their biome themes.
max_action_steps: 83
