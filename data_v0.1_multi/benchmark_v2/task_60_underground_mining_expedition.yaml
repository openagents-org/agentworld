task:
  name: Underground Mining Expedition - Comprehensive Ore Extraction & Processing (Variant 2 - Spread Locations)
  description: Seven specialized miners coordinate a massive underground expedition to extract and process multiple ore types,
    creating a complete metallurgy operation
objectives:
  primary: Execute a comprehensive mining operation extracting 80+ ores across 4 types, smelt 60+ bars, and craft 10+ metal
    items including tools, weapons, and jewelry
  secondary:
  - 'Phase 1 (Rounds 1-15): Deep Mining Operations - Extract iron, gold, coal, and special ores'
  - 'Phase 2 (Rounds 16-28): Ore Transportation - Travel to central smeltery with all materials'
  - 'Phase 3 (Rounds 29-43): Mass Smelting - Convert all ores to refined bars'
  - 'Phase 4 (Rounds 44-52): Metalwork Production - Craft complete metallurgy collection'
relevant_game_context: |
  EXPEDITION HIGHLIGHTS
  - Seven miners must clear 80+ ore (25 iron, 20 gold, 30 coal, 5 special), smelt 60+ bars, and craft at least ten metal goods (tools, weapons, jewelry) before Round 52. Mining squads work the northern range (~230–240, 38–50) while the smelter duo holds the central hub (528,384).

  PHASE PLAN
  1. R1-15 Mining: iron team hits 25 ore, gold team 20, Coal_Baron 30, gathering counts in chat and verifying inventories after each stint.
  2. R16-28 Transport: all miners march south-east toward the central smeltery in ≤32-tile hops, announcing positions. Once within 5 tiles, transfer ores/coal via transfer_items to Master_Smelter; special ores stay with Metalsmith until needed.
  3. R29-43 Smelting: Master_Smelter runs craft_item(Smelting, ironbar/goldbar) until quotas met while Metalsmith tracks inventory milestones (“Iron bars 12/25”). Use sticks/logs ferried from earlier runs to keep tool handles ready.
  4. R44-52 Production: Metalsmith crafts pickaxe, axe, bucket, heavy sword, gold/ silver rings, and any bonus gear; report each completion before the final verification.

  EXECUTION NOTES
  - If observe_environment cannot be called, sweep the slope grid manually and rely on harvest_resource feedback plus verify_inventory counts.
  - Keep ore handoffs orderly: iron/gold/coal → Master_Smelter only; special ores/logs → Metalsmith. Both sender and receiver must confirm in chat.
  - Smelting volume is high; post progress every 5 bars so crafters know when they can begin.

  COMPLETION CHECK
  - Final inventories must show ≥25 iron bars, ≥20 gold bars converted into the requested tool/weapon/jewelry set (at least 10 finished items). Summarize ore totals, smelting counts, and crafted goods before calling complete().
max_action_steps: 91
