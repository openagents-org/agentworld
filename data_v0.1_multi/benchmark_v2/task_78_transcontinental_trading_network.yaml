task:
  name: Transcontinental Trading Network - Multi-Region Resource Exchange (Variant 2 - Spread Locations)
  description: Ten agents scattered across different regions must gather region-specific resources, establish trade routes,
    and consolidate materials to craft diverse items requiring cross-continental cooperation
objectives:
  primary: Establish a transcontinental trading network where 10 agents gather region-specific resources, travel to consolidation
    hubs, exchange materials, and craft 5 different items requiring materials from 6+ regions
  secondary:
  - 'Phase 1: Regional Resource Gathering (Each agent gathers from their assigned region)'
  - 'Phase 2: Travel to Regional Hubs (Agents consolidate at 3 meeting points)'
  - 'Phase 3: Inter-Hub Trading (Exchange materials between hubs)'
  - 'Phase 4: Final Consolidation (All agents meet at central crafting location)'
  - 'Phase 5: Coordinated Crafting (Produce Golden Bow, Beryl Pendant, Golden Ring, Silver Ring, Magic Staff)'
  - Complete all phases within 77 rounds with full team coordination
relevant_game_context: |
  SUPPLY CHAIN PLAN
  - Ten agents harvest unique materials from distant regions, regroup at three hubs (forest 400,100; mountain 250,50; coastal 500,400), relay goods to a central point (400,250), and craft five cross-regional items (golden bow, beryl pendant, golden ring, silver ring, magic staff) within ~50 rounds.

  PHASE ROADMAP
  1. R1-10 Gathering: each agent harvests their quota (logs, ores, gems, fish, berries) using observe_environment + harvest_resource and reports progress in chat.
  2. R11-18 Travel to hubs: agents march to their assigned hub, announce positions every few hops, and wait until local teammates arrive.
  3. R19-28 Inter-hub trade: consolidate materials per hub, smelt bars at the mountain hub, then send a representative from each hub to the central point carrying logs/bars/gems.
  4. R29-35 Final consolidation: all agents travel to (400,250), transfer everything to ForestGatherer (logs) and GoldMiner (bars/gems), and verify inventories before crafting.
  5. R36-45 Crafting: GoldMiner crafts golden bow, golden ring, silver ring; ForestGatherer crafts beryl pendant and magic staff (forge beads from blueberries first). After each item, run verify_inventory and log “Item X/5 complete”.

  EXECUTION NOTES
  - Use transfer_items + verify_inventory for every handoff; never rely on chat-only promises.
  - Maintain a running manifest in chat (“Logs 25, Iron bars 10, Gold bars 8, Beryl 5, Blueberries 10”) so crafters know readiness.
  - Keep move_character hops ≤32 tiles and announce detours if nodes are empty; swap tasks if someone finishes early.
  - Only call complete() once all five crafts are verified and a final summary confirms every phase was executed.
max_action_steps: 77
