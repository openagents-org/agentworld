success_criteria:
- 'Phase 1: All 10 agents successfully gather assigned resources from their regions'
- ForestGatherer gathers 5x Oak logs, IceGatherer gathers 5x Ice Oak logs
- DesertGatherer gathers 5x Palm logs, VolcanicGatherer gathers 5x Bloodwood logs
- PlainsGatherer gathers 5x Willow logs
- MountainMiner mines 10x iron ore + 10x coal
- GoldMiner mines 8x gold ore + 8x coal
- GemMiner mines 5x beryl gems
- CoastalFisher catches 8x fish (Tuna or Shrimp)
- Forager forages 10x Blueberries
- 'Phase 2: All agents successfully travel to assigned regional hubs'
- Forest Hub agents (4 total), Mountain Hub agents (3 total), Coastal Hub agents (3 total) arrive and regroup
- 'Phase 3: Smelting completed - GoldMiner creates 10x ironbar and 8x goldbar'
- 'Phase 3: Materials consolidated at each hub before inter-hub trading'
- 'Phase 3: Representatives travel between hubs to Central Point'
- 'Phase 4: All 10 agents travel to Central Point (400, 250)'
- 'Phase 4: Materials consolidated with designated crafters (ForestGatherer has logs, GoldMiner has bars/gems)'
- 'Phase 5: Golden Bow crafted from 4x goldbar + 1x logs'
- 'Phase 5: Beryl Pendant crafted from 2x berylgem + 1x logs'
- 'Phase 5: Golden Ring crafted from 2x goldbar'
- 'Phase 5: Silver Ring crafted from 2x ironbar'
- 'Phase 5: Beads crafted from 3x blueberry, then Magic Staff crafted from 2x logs + 1x beads'
- All 5 items verified in crafter inventories (GoldMiner has 3 items, ForestGatherer has 2 items)
- Team uses chat extensively throughout all phases for coordination
- Team demonstrates long-distance travel coordination (up to 320 tiles)
- Team demonstrates material trading and transfer operations
- Transcontinental trading network established and all objectives completed within 50 rounds
