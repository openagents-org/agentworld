task:
  name: Resource Protection Mission - Guardian Team Defense (Variant 2 - Spread Locations)
  description: Three agents work together where one guardian protects two collectors from threats while they gather resources
objectives:
  primary: Successfully protect collectors while they gather 5x logs and 3x blueberry under combat conditions
  secondary:
  - Establish effective team communication for threat alerts
  - Guardian successfully defends team from hostile creatures
  - Complete resource gathering without casualties within 37 rounds
relevant_game_context: "This is a cooperative multi-agent protection scenario requiring tactical coordination.\n\nOBJECTIVE:\
  \ Successfully gather required resources while protecting the team from environmental threats.\n\nMISSION REQUIREMENTS:\n\
  - Collect 5x logs and 3x blueberry while under potential threat\n- Keep all team members alive throughout the mission\n\
  - Use teamwork to balance resource gathering with security\n\nTEAM COORDINATION:\n- Establish communication protocols for\
  \ threat detection and warnings\n- Coordinate movements between protection and resource gathering\n- Share information about\
  \ resource locations and environmental dangers\n- Work together to ensure both safety and mission success\n\nGENERAL STRATEGY:\n\
  - The team has complementary roles in combat, lumberjacking, and mining\n- Environmental threats may appear and must be\
  \ dealt with appropriately\n- Resource gathering requires moving to specific locations and materials\n- Balance efficiency\
  \ with safety - casualties will cause mission failure\n- Use global chat for real-time coordination and threat alerts\n\n\
  DO NOT use complete() until ALL objectives are achieved safely!\n\nCOMBAT MECHANICS (CRITICAL KNOWLEDGE):\n\U0001F3F9 Combat\
  \ - Attack threats:\n  - Use observe_environment to detect hostile creatures\n  - Use attack command on hostile targets\n\
  \  - Use bow for ranged combat advantage\n\n\U0001FAB5 Lumberjacking - logs:\n  - harvest_resource on oak tree instances\
  \ to get logs\n  - Level required: 1+ (Lumberjacking skill)\n  - Target: 5x logs total\n  - IMPORTANT: Look for \"Oak\"\
  \ trees, NOT \"Willow\" trees!\n\n\U0001FAD0 Foraging - blueberry:\n  - harvest_resource on blueberry instances\n  - Level\
  \ required: 1+ (Foraging skill)  \n  - Target: 3x blueberry total\n  - IMPORTANT: Look for \"Blueberry\" bushes, NOT rocks\
  \ or trees!\n"
max_action_steps: 37
