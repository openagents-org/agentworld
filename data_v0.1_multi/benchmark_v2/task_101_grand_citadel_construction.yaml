task:
  name: Grand Citadel Construction - Wilderness Fortress (Variant 2 - Spread Locations)
  description: A massive 20-agent operation to establish a fortress in the dangerous Wilderness. Teams must coordinate resource
    gathering, construction, and defense against high-level threats.
objectives:
  primary: Construct the Citadel Foundation by gathering resources, processing materials, and securing the perimeter.
  secondary:
  - 'Resource Team: Gather 40 Logs and 40 Iron Ore'
  - 'Construction Team: Smelt 40 Iron Bars and consolidate construction materials'
  - 'Defense Team: Defeat 5 High-Level Mimics (Level 84) to secure the area'
  - Consolidate all final materials (40 Iron Bars, 40 Logs) into the Site Foreman's inventory (Builder_1)
relevant_game_context: |
  🏰 OPERATION CITADEL COMMAND

  Teams and Roles:
  1. RESOURCE TEAM (Agents 1-8):
     - Primary Goal: Gather raw materials.
     - Targets: Oak Trees (Logs) and Iron Deposits (Iron Ore).
     - Warning: Do not engage combat unless attacked. Flee to Defense Team if targeted.

  2. CONSTRUCTION TEAM (Agents 9-14):
     - Primary Goal: Process materials and Logistics.
     - Task: Receive Iron Ore from Resource Team -> Smelt into Iron Bars.
     - Task: Consolidate all Logs and Iron Bars with Builder_1 (Site Foreman).
     - Location: Establish a safe 'Smithing Zone' behind the Defense Team.

  3. DEFENSE TEAM (Agents 15-20):
     - Primary Goal: Perimeter Defense.
     - Task: Patrol the immediate area (Radius 5 tiles).
     - Task: Intercept and eliminate Mimics (Level 84).
     - Strategy: Focus fire! Do not fight 1v1. Use 'attack_mob' on the same target.

  COORDINTATION PROTOCOLS:
  - 📦 TRANSFERS: Resource Team must frequently drop off materials to Construction Team to stay light and safe.
  - ⚔️ COMBAT: Defense Team must announce targets ("Attacking Mimic ID 123").
  - 📊 REPORTING: Builder_1 must announce total consolidated materials every 5 rounds.

  CRITICAL SUCCESS PATH:
  1. Rounds 1-15: Resource gathering and Perimeter setup.
  2. Rounds 16-35: Smelting operations and Defensive skirmishes.
  3. Rounds 36-50: Final consolidation and verification.
  4. Rounds 51-55: Final headcount and complete().

  ⚠️ DANGER: This is a High-Level Wilderness (Region 4-7). Mobs are Level 84.
  - Resource/Construction agents: STAY BEHIND THE GUARDS.
  - Guards: Keep HP > 60%. Use food/flasks liberally.
limitations:
  max_action_steps: 55
