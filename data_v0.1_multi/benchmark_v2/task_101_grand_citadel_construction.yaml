success_criteria:
- Resource Team gathers at least 40 Logs total
- Resource Team gathers at least 40 Iron Ore total
- Construction Team smells at least 40 Iron Bars (using Coal provided + gathered Ore)
- Defense Team defeats at least 5 Level 84 Mimics
- Citadel_Builder_1 (Foreman) holds 40 Iron Bars and 40 Logs at the end
- All 20 agents survive the operation
- Team communicates coordinates of threats and resource deposits
