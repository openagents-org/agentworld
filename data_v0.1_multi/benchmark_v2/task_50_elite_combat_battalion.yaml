success_criteria:
- TankCommander successfully leads all combat engagements
- 'Battalion successfully completes Phase 1: Formation & Preparation'
- Battalion successfully defeats Goblin (Tier 1 Enemy)
- Team uses chat tool to coordinate all combat actions
- Battalion successfully defeats Skeleton (Tier 2 Enemy)
- DamageDealer successfully maximizes damage output across all fights
- MagicArtillery provides effective magical support in all engagements
- Battalion successfully defeats Ogre (Tier 3 Enemy)
- CombatMedic successfully supports team throughout campaign
- Battalion successfully defeats Spectre (Tier 4 Elite Enemy)
- TacticalCoordinator successfully coordinates all combat operations
- Team uses actual tools (attack_entity, move_character) instead of just talking
- All warriors maintain coordination within 5-10 tiles throughout campaign
- At least 4 out of 5 warriors survive entire combat campaign
- Battalion completes progressive combat campaign within 35 rounds
- Team demonstrates elite five-warrior combat coordination
- All four enemy tiers are defeated in sequence
- Team confirms completion together before calling complete()
