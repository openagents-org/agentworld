task:
  name: Elite Combat Battalion - Five-Warrior Progressive Combat Campaign (Variant 2 - Spread Locations)
  description: Five combat specialists work together to defeat multiple enemies in sequence, starting with weaker foes and
    progressing to higher-level threats
objectives:
  primary: Form an elite combat battalion of five warriors to defeat multiple enemies in progressive difficulty sequence
  secondary:
  - Coordinate five-warrior formation and combat preparation
  - Execute coordinated combat against multiple enemy types
  - Progress through increasing difficulty tiers of encounters
  - Complete entire combat campaign within 50 rounds
relevant_game_context: |
  CAMPAIGN SUMMARY
  - Five warriors fight a four-tier gauntlet: Goblin → Skeleton → Ogre → Spectre. Each tier must be cleared in order within 35 rounds while keeping the squad together around (400,300).
  - Roles: TankCommander soaks hits, DamageDealer & MagicArtillery provide DPS, CombatMedic keeps HP above 50%, TacticalCoordinator calls targets and positioning.

  COMBAT LOOP
  1. Formation (R1-5): assemble within 5 tiles, report HP/healing stocks, scout mobs array for nearby targets.
  2. Tier fights (R6-35): move_character to the reported coordinates, announce target instance ID, then all agents attack_entity/attack_mob the same ID on the coordinator’s count. Heal between fights before advancing.
     • Goblin & Skeleton near the forest spawn; Ogre around (300,150); Spectre in darker zones—spread 3-4 tiles to dodge AoE.
  3. After each kill post “Tier X clear – HP summary” and confirm everyone is alive before hunting the next enemy.

  EXECUTION RULES
  - Always cite the exact targetInstance from observation before attacking; never invent IDs.
  - Focus fire: no new targets until the current one dies. If two warriors drop below 30% HP, retreat, heal with flasks/apples, and re-engage.
  - CombatMedic calls out healing actions; all agents announce when HP crosses critical thresholds or when using items.

  COMPLETION CHECKLIST
  - Chat log shows four tier confirmations and final positions.
  - Spectre must be defeated last; only then may TacticalCoordinator call complete() with a status summary including remaining HP and loot distribution.
max_action_steps: 50
