task:
  name: Cooperative Topaz Ring Crafting - Luxury Jewelry (Variant 2 - Spread Locations)
  description: Three agents work together to create a topaz ring through precious gem mining, gold smelting, and luxury jewelry
    crafting
objectives:
  primary: Create a topaz ring by combining topaz gem with gold ring base
  secondary:
  - Coordinate precious gem mining and gold metallurgy
  - Execute luxury material transfers with high value items
  - Complete premium jewelry crafting within 39 rounds
relevant_game_context: |
  This is a cooperative multi-agent luxury jewelry scenario requiring precious materials.

  OBJECTIVE: Create a topaz ring by combining precious topaz gem with luxury gold ring base.

  TEAM COORDINATION:
  - Use global chat to share locations of precious and valuable resources
  - Coordinate specialized gem mining and gold metallurgy operations
  - Handle valuable materials with appropriate care during transfers
  - Work together to complete premium luxury jewelry crafting

  GENERAL STRATEGY:
  - The team needs to locate and extract precious gemstones and gold materials
  - Someone needs to process gold ore into luxury ring base components
  - Final jewelry assembly requires combining precious materials with expertise
  - Coordinate timing and resource management for high-value materials
  - Each agent has specialized skills for different aspects of luxury crafting

  DO NOT use complete() until ALL objectives are achieved by the team!

  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  💎 Mining - topaz:
    - harvest_resource on topaz deposits to get topaz
    - Level required: 15+ (Mining skill) - MID LEVEL

  🟨 Smelting Recipe - goldbar:
    - craft_item skill=Smelting itemKey=goldbar
    - Materials: 1x goldore + 1x coal → 1x goldbar
    - Level required: 20 (uses Smithing skill level)

  🟨 Smithing Recipe - goldring:
    - craft_item skill=Smithing itemKey=goldring
    - Materials: 2x goldbar → 1x goldring
    - Level required: 1 (Smithing skill)

  💍 Crafting Recipe - topaz ring:
    - craft_item skill=Crafting itemKey=topazring
    - Materials: 1x topaz + 1x goldring → 1x topaz ring
    - Level required: 5 (Crafting skill)
max_action_steps: 39
