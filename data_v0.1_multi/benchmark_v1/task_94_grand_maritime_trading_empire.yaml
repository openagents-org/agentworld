task:
  name: Grand Maritime Trading Empire - Ocean Commerce & Fleet Operations (Variant 1)
  description: Twenty agents establish a comprehensive maritime trading empire including fishing fleets, merchant vessels,
    shipbuilding operations, and international trade routes
objectives:
  primary: Establish a fully operational maritime trading empire with 3 fishing fleets, 50+ trade goods, and active commerce
    routes within 60 rounds
  secondary:
  - 'Phase 1 (Rounds 1-15): Fleet Formation - Establish fishing operations and gather seafood (30+ fish)'
  - 'Phase 2 (Rounds 16-30): Shipyard Construction - Gather materials and craft maritime equipment (20+ tools/weapons)'
  - 'Phase 3 (Rounds 31-45): Trade Goods Production - Craft jewelry, weapons, and food for trade (30+ items)'
  - 'Phase 4 (Rounds 46-60): Commerce Routes - Distribute goods and establish trading posts'
relevant_game_context: |
  GRAND MARITIME TRADING EMPIRE OVERVIEW:

  Twenty seafaring agents must build the realm's greatest trading empire from fishing to commerce.

  🌊 EMPIRE STRUCTURE:

  ═══════════════════════════════════════════════════════════
  🎣 FISHING FLEET DIVISION (Agents 1-5) - Seafood Operations
  ═══════════════════════════════════════════════════════════

  **Mission**: Establish 3 fishing fleets harvesting diverse marine resources
  **Starting Location**: Coastal Region (580, 750)

  **Team Composition**:
  - Agent 1 (Fleet Admiral): Coordinate all fishing operations
  - Agent 2 (Shrimp Trawler): Specialize in shrimp harvesting
  - Agent 3 (Deep Sea Fisher): Hunt jellyfish and rare catches
  - Agent 4 (Crab Captain): Focus on crab fishing spots
  - Agent 5 (Processing Chief): Organize catch distribution

  **Fishing Goals**:
  - 18x rawshrimp from coastal fishing spots
  - 11x jellyfish from deep water locations
  - 6x crab from special fishing areas
  - Total 30+ raw seafood items

  **Strategy**:
  - Scout coastal regions: observe_environment radius=48
  - Use harvest_resource on fishSpots
  - Coordinate via chat: "[Fleet] Admiral: 10/30 fish collected"
  - Transfer catches to Processing Chief

  ═══════════════════════════════════════════════════════════
  ⚒️ SHIPYARD CONSTRUCTION (Agents 6-10) - Maritime Equipment
  ═══════════════════════════════════════════════════════════

  **Mission**: Build shipyard and craft maritime tools/weapons
  **Starting Location**: Forest (380, 20) and Mountains (230, 40)

  **Team Composition**:
  - Agent 6 (Timber Baron): Harvest 30+ logs for construction
  - Agent 7 (Ore Overseer): Mine 20+ ironore, 15+ coal
  - Agent 8 (Forge Master): Smelt 20+ ironbar
  - Agent 9 (Shipwright): Craft axes, swords, tools (10+ items)
  - Agent 10 (Armorer): Craft additional equipment (10+ items)

  **Production Goals**:
  - 34x logs → craft sticks, tools, handles
  - 27x ironbar → craft 5+ swords, 3+ axes, 2+ pickaxes
  - Total 20+ maritime tools and weapons

  **Crafting Sequence**:
  1. Agent 6: Harvest Oak trees at (380, 20)
  2. Agent 7: Mine at mountains (230, 40)
  3. Agent 8: Smelt ore: craft_item skill=Smelting itemKey=ironbar
  4. Agent 9: Craft tools: craft_item skill=Smithing
  5. Agent 10: Craft weapons for ship defense

  ═══════════════════════════════════════════════════════════
  💎 TRADE GOODS WORKSHOP (Agents 11-15) - Luxury Commerce
  ═══════════════════════════════════════════════════════════

  **Mission**: Craft high-value trade goods (jewelry, enchantments, food)
  **Starting Location**: Various hunting/crafting areas

  **Team Composition**:
  - Agent 11 (Gem Prospector): Hunt for emeralds, rubies, topaz (5+ gems)
  - Agent 12 (Bead Merchant): Collect magical beads from wizards (5+ beads)
  - Agent 13 (Artisan Jeweler): Craft rings and pendants (8+ jewelry)
  - Agent 14 (Culinary Trader): Cook seafood delicacies (12+ cooked foods)
  - Agent 15 (Staff Enchanter): Craft magical staves (3+ staves)

  **Trade Goods Goals**:
  - 6x emerald rings/pendants (emerald + ring/string)
  - 3x ruby rings (ruby + gold ring)
  - 14x cooked seafood (cookedshrimp, jellyfishsmoothie)
  - 3x magical staves (staff + beads)
  - Total 30+ valuable trade items

  **Workflow**:
  1. Agent 11: Hunt mobs for gem drops
  2. Agent 12: Hunt Wizard (350, 250) for beads
  3. Agent 13: Craft jewelry using gems and metal rings
  4. Agent 14: Cook seafood from Fleet Division
  5. Agent 15: Craft staves using beads and sticks

  ═══════════════════════════════════════════════════════════
  🏪 MERCHANT GUILD (Agents 16-20) - Commerce & Distribution
  ═══════════════════════════════════════════════════════════

  **Mission**: Establish trading posts and distribute goods
  **Starting Location**: Central hub (400, 15)

  **Team Composition**:
  - Agent 16 (Trade Master): Coordinate all commerce operations
  - Agent 17 (Northern Envoy): Establish mountain trading post
  - Agent 18 (Southern Delegate): Set up coastal trading post
  - Agent 19 (Western Agent): Create forest trading post
  - Agent 20 (Inventory Keeper): Track all empire goods

  **Distribution Goals**:
  - Collect goods from all divisions
  - Establish 3+ trading posts across regions
  - Distribute 50+ total items across empire
  - Verify final inventory for victory

  **Trading Post Locations**:
  - Northern Post: (235, 45) - Mountain region
  - Southern Post: (585, 752) - Coastal region
  - Western Post: (385, 25) - Forest region

  **Coordination Protocol**:
  - Format: "[Merchant] Trade Master: Received 10 items from Fleet Division"
  - Track inventory: verify_inventory for all goods
  - Move goods between posts: transfer_items
  - Report every 5 rounds: "Commerce update: X/50 goods distributed"

  ═══════════════════════════════════════════════════════════
  🎯 SUCCESS CRITERIA (ALL MUST BE MET)
  ═══════════════════════════════════════════════════════════

  1. **Fishing Fleet**: 30+ seafood items harvested (shrimp, jellyfish, crab)
  2. **Shipyard**: 20+ tools/weapons crafted (axes, swords, pickaxes)
  3. **Trade Goods**: 30+ luxury items (jewelry, cooked food, staves)
  4. **Total Production**: 80+ items across all divisions
  5. **Trading Posts**: 3+ posts established in different regions
  6. **Distribution**: Goods distributed to all posts
  7. **Communication**: All divisions report regularly
  8. **Empire Completion**: Within 60 rounds

  DO NOT call complete() until maritime empire is fully operational!

  **Victory Announcement**:
  "MARITIME EMPIRE ESTABLISHED! Fishing: X seafood | Shipyard: Y tools | Trade: Z goods | Posts: W locations | EMPIRE OPERATIONAL"
