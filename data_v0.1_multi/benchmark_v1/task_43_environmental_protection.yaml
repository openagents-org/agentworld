task:
  name: Environmental Protection - Ecosystem Conservation and Habitat Restoration (Variant 1)
  description: Three agents work together to establish environmental protection programs, conserve ecosystems, and restore
    natural habitats
objectives:
  primary: Successfully establish environmental protection programs, conserve ecosystems effectively, and restore natural
    habitats
  secondary:
  - Establish environmental coordination and ecosystem conservation preparation
  - Execute coordinated habitat restoration and environmental protection operations
  - Complete environmental protection program within 36 rounds
relevant_game_context: |
  This is a cooperative multi-agent environmental protection scenario requiring ecosystem conservation and habitat restoration coordination.

  OBJECTIVE: Establish environmental protection programs, conserve ecosystems effectively, and restore natural habitats.

  MISSION REQUIREMENTS:
  - Establish environmental operations in suitable areas for ecosystem conservation and habitat protection
  - Coordinate conservation programs and habitat restoration services for environmental preservation
  - Provide environmental assistance and ecosystem protection using available resources and conservation methods
  - Develop sustainable environmental systems for ongoing ecosystem preservation

  TEAM COORDINATION:
  - Use global chat for complex environmental coordination and conservation program management
  - Coordinate between ecosystem conservation, habitat restoration, and environmental protection delivery
  - Share environmental knowledge and provide support during conservation operations
  - Work together to handle complex environmental challenges and coordinate ecosystem protection

  GENERAL STRATEGY:
  - This requires environmental coordination skills and conservation management expertise
  - Conservation programs need efficient resource utilization and coordinated environmental action
  - Environmental services require coordinated protection and mutual ecosystem support
  - Habitat restoration needs strategic planning and environmental coordination
  - Balance immediate conservation needs with long-term environmental sustainability

  DO NOT use complete() until ALL objectives are achieved by the team!

  ENVIRONMENTAL PROTECTION OPERATIONS (CRITICAL KNOWLEDGE):
  🌱 Environmental Conservation Planning:
    - Use observe_environment to scout areas suitable for environmental operations and ecosystem conservation
    - Establish conservation coordination positions for environmental service delivery and habitat management
    - Navigate conservation areas while maintaining team safety and environmental effectiveness
    - Coordinate environmental activities to optimize conservation effectiveness and ecosystem protection

  🌳 Ecosystem Conservation Coordination:
    - Use available resources for environmental programs and habitat restoration projects
    - Focus on efficient resource utilization for conservation operations and environmental service delivery
    - Coordinate conservation activities to maximize environmental effectiveness and ecosystem preservation success
    - Practice conservation techniques and environmental coordination methods

  🦋 Habitat Restoration Management:
    - Use available skills for environmental coordination and conservation assistance
    - Coordinate environmental resource sharing and distribution among team members
    - Focus on sustainable conservation practices and environmental resource conservation
    - Balance immediate conservation needs with long-term environmental planning

  🌿 Environmental Protection Operations:
    - Use observe_environment to identify conservation needs and environmental opportunities
    - Coordinate habitat restoration assistance and environmental program management
    - Practice team conservation strategies using available resources and environmental skills
    - Execute coordinated environmental operations and provide mutual conservation support

  🌍 Environmental Coordination Strategy:
    - Use coordinated conservation techniques for effective ecosystem protection
    - Practice efficient environmental management and conservation resource coordination
    - Focus on developing conservation capabilities through team coordination
    - Use sustainable approaches during environmental and conservation operations
