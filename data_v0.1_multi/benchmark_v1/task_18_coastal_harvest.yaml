task:
  name: Coastal Harvest Mission - Seaside Team Protection (Variant 1)
  description: Three agents work together where one guardian protects two collectors gathering coastal resources from sea
    creatures and threats
objectives:
  primary: Successfully protect collectors while they gather 9x rawshrimp and 4x icelogs under coastal threat conditions
  secondary:
  - Establish effective team communication for threat alerts
  - Guardian successfully defends team from hostile sea creatures
  - Complete coastal resource gathering without casualties within 25 rounds
relevant_game_context: "This is a cooperative multi-agent coastal protection scenario requiring tactical coordination.\n\n\
  OBJECTIVE: Successfully gather required coastal resources while protecting the team from sea creature threats.\n\nMISSION\
  \ REQUIREMENTS:\n- Collect 6x rawshrimp and 3x icelogs while under potential sea creature threat\n- Keep all team members\
  \ alive throughout the mission\n- Use teamwork to balance resource gathering with coastal security\n\nTEAM COORDINATION:\n\
  - Establish communication protocols for sea creature detection and warnings\n- Coordinate movements between protection and\
  \ coastal resource gathering\n- Share information about resource locations and environmental dangers\n- Work together to\
  \ ensure both safety and mission success\n\nGENERAL STRATEGY:\n- The team has complementary roles in combat, fishing, and\
  \ lumberjacking\n- Sea creature threats may appear and must be dealt with appropriately\n- Coastal resource gathering requires\
  \ moving to specific locations near water\n- Balance efficiency with safety - casualties will cause mission failure\n- Use\
  \ global chat for real-time coordination and threat alerts\n\nDO NOT use complete() until ALL objectives are achieved safely!\n\
  \nCOMBAT MECHANICS (CRITICAL KNOWLEDGE):\n\U0001F3F9 Combat - Attack threats:\n  - Use observe_environment to detect hostile\
  \ sea creatures\n  - Use attack command on hostile targets\n  - Use bow for ranged combat advantage\n\n\U0001F3A3 Fishing\
  \ - rawshrimp:\n  - harvest_resource on shrimp fishing spots to get rawshrimp\n  - Level required: 1+ (Fishing skill)\n\
  \  - Target: 6x rawshrimp total\n  - IMPORTANT: Look for \"Shrimp\" fishing spots near water!\n\n❄️ Lumberjacking - icelogs:\n\
  \  - harvest_resource on ice oak tree instances to get icelogs\n  - Level required: 10+ (Lumberjacking skill)  \n  - Target:\
  \ 3x icelogs total\n  - IMPORTANT: Look for \"Ice Oak\" trees, NOT regular oak trees!\n"
max_action_steps: 25
