task:
  name: Grand Festival Preparation - Multi-Skill Celebration Event (Variant 1)
  description: Ten specialized agents coordinate to prepare a grand festival celebration by fishing, hunting, foraging, cooking,
    smithing, fletching, and crafting diverse items for the event
objectives:
  primary: Prepare a complete festival celebration where 10 agents gather diverse resources, cook multiple dishes, craft competition
    prizes, and create decorative items - demonstrating coordination across all skill types
  secondary:
  - 'Phase 1: Resource Expedition (Fishing, hunting, foraging, mining, lumberjacking across multiple regions)'
  - 'Phase 2: Material Processing (Cooking dishes, smelting bars for crafting)'
  - 'Phase 3: Prize Crafting (Smith crafts competition prizes, Fletcher crafts archery equipment)'
  - 'Phase 4: Decoration Creation (Crafter makes decorative items for festival)'
  - 'Phase 5: Festival Setup (All agents consolidate items at festival grounds)'
  - Complete within 45 rounds with all festival items ready
relevant_game_context: |
  FESTIVAL PLAN
  - Ten specialists gather seafood, meats, produce, ores, gems, and logs; cooks turn them into feast dishes, smith/fletcher craft competition prizes, decorator builds showpieces, and everyone meets at the plaza (450,300) with a complete inventory within 50 rounds.

  PHASE SUMMARY
  1. R1-15 Resource expedition: fishers catch shrimp/tuna, hunter collects 10 meat, foragers gather fruits/veg, smith/decorator mine ores/gems, fletcher cuts logs. Announce progress in chat and verify_inventory after each quota.
  2. R16-28 Processing: gatherers travel to the cooking hub (~400,300) to hand ingredients to cooks; smith smelts 10 iron + 5 gold bars. Cooks prepare seafood dishes, stew, cooked meat, and smoothies while reporting counts.
  3. R29-37 Prizes: fletcher crafts a wooden bow (plus arrows if feathers exist); smith forges three silver rings and one golden ring.
  4. R38-44 Decorations: decorator uses gems/logs/berries to craft pendants and a magic staff. Transfer materials via transfer_items with verify_inventory confirmations.
  5. R45-50 Festival setup: all ten agents travel to (450,300), list their items (foods, prizes, decor), and confirm the checklist before calling complete().

  EXECUTION NOTES
  - Use chat to track “Food/Prizes/Decor” progress, e.g., “Seafood 6/10, Rings 2/4”.
  - Transfers require both sender and receiver to verify inventories immediately.
  - Substitute ingredients if a resource is missing, but ensure minimum counts (≥8 cooked dishes, ≥3 prizes, ≥2 decorations) before final verification.
max_action_steps: 64
