task:
  name: World Resource Survey - Continental Exploration & Mapping (Variant 1)
  description: Sixteen agents conduct comprehensive survey of all major regions, documenting resources, creatures, and establishing
    observation posts
objectives:
  primary: Complete world resource survey covering 8+ major regions with 100+ documented findings and 6+ observation posts
    within 60 rounds
  secondary:
  - 'Phase 1 (Rounds 1-15): Team Formation - Organize 4 survey teams and plan routes'
  - 'Phase 2 (Rounds 16-35): Continental Exploration - Survey 8+ major biomes'
  - 'Phase 3 (Rounds 36-50): Resource Documentation - Catalog 100+ findings'
  - 'Phase 4 (Rounds 51-60): Report Compilation - Establish posts and finalize survey'
relevant_game_context: |
  WORLD RESOURCE SURVEY OVERVIEW:

  Sixteen explorers must document the entire known world's resources and creatures.

  🗺️ SURVEY REGIONS:

  ═══════════════════════════════════════════════════════════
  🌲 TEAM ALPHA (Agents 1-4) - Forest & Plains Survey
  ═══════════════════════════════════════════════════════════
  **Regions**:
  - Forest Region (380, 20)
  - Central Plains (400, 300)

  **Document**:
  - Tree types and locations (10+ trees)
  - Plains creatures (5+ mob types)
  - Herb and plant resources (10+ items)

  **Establish**: 2 observation posts

  ═══════════════════════════════════════════════════════════
  ⛰️ TEAM BETA (Agents 5-8) - Mountain & Ice Survey
  ═══════════════════════════════════════════════════════════
  **Regions**:
  - Mountain Range (230, 40)
  - Ice Caverns (260, 154)

  **Document**:
  - Ore deposit locations (15+ rocks)
  - Mountain creatures (5+ mob types)
  - Ice region resources (10+ items)

  **Establish**: 2 observation posts

  ═══════════════════════════════════════════════════════════
  🌊 TEAM GAMMA (Agents 9-12) - Coastal & Ocean Survey
  ═══════════════════════════════════════════════════════════
  **Regions**:
  - Coastal Region (580, 750)
  - Underwater Areas

  **Document**:
  - Fishing spots (10+ locations)
  - Marine creatures (5+ types)
  - Coastal resources (10+ items)

  **Establish**: 1 observation post

  ═══════════════════════════════════════════════════════════
  🏜️ TEAM DELTA (Agents 13-16) - Desert & Volcanic Survey
  ═══════════════════════════════════════════════════════════
  **Regions**:
  - Desert Plains (400, 680)
  - Volcanic Border regions

  **Document**:
  - Desert creatures (5+ types)
  - Special minerals (10+ finds)
  - Heat zone resources (10+ items)

  **Establish**: 1 observation post

  ═══════════════════════════════════════════════════════════
  📋 SURVEY PROTOCOL
  ═══════════════════════════════════════════════════════════

  **Phase 1: Team Formation (Rounds 1-15)**
  - Organize into 4 specialized teams
  - Plan exploration routes
  - Gather survey equipment
  - Initial reconnaissance

  **Phase 2: Continental Exploration (Rounds 16-35)**
  - Each team explores assigned regions
  - Use observe_environment extensively
  - Photograph (document) all findings
  - Report via global chat every 5 rounds

  **Phase 3: Resource Documentation (Rounds 36-50)**
  - Catalog all trees, rocks, fishing spots
  - Document all mob types and locations
  - Collect sample resources (1-2 of each type)
  - Cross-reference findings between teams

  **Phase 4: Report Compilation (Rounds 51-60)**
  - Establish observation posts at key locations
  - Compile comprehensive findings list
  - Share knowledge across all teams
  - Final survey verification

  **Documentation Requirements**:
  - Format: "[Team X] Region Y: Found Z at (coordinates)"
  - Example: "[Alpha] Forest: Oak Tree at (385, 22)"
  - Minimum 100 total documented findings
  - Each team must document 25+ unique findings

  **Observation Posts**:
  - Forest Post: (385, 25)
  - Mountain Post: (235, 45)
  - Ice Post: (260, 156)
  - Coastal Post: (585, 752)
  - Desert Post: (405, 685)
  - Central Post: (400, 15)

  ═══════════════════════════════════════════════════════════
  🎯 SUCCESS CRITERIA
  ═══════════════════════════════════════════════════════════
  1. Survey 8+ major regions
  2. Document 100+ unique findings
  3. Catalog 20+ mob types
  4. Catalog 30+ resource nodes
  5. Catalog 20+ tree types
  6. Establish 6+ observation posts
  7. All teams report continuously
  8. Complete within 60 rounds
max_action_steps: 55
