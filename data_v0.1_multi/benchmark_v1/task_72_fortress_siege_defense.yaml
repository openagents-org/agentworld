task:
  name: Fortress Siege Defense - Multi-Wave Boss Assault (Variant 1)
  description: Seven defenders prepare fortifications and withstand 4 waves of increasingly difficult boss attacks
objectives:
  primary: Defend a fortress against 4 progressive enemy waves over 52 rounds with preparation phases between each assault
  secondary:
  - 'Phase 1 (Rounds 1-10): Fortress Preparation - Build defenses and craft siege equipment'
  - 'Phase 2 (Rounds 11-18): First Wave - Repel Goblin assault (Level 10-15)'
  - 'Phase 3 (Rounds 19-28): Reinforcement - Upgrade defenses and equipment for harder waves'
  - 'Phase 4 (Rounds 29-36): Second Wave - Survive Skeleton invasion (Level 18-25)'
  - 'Phase 5 (Rounds 37-44): Final Preparation - Craft elite equipment for ultimate waves'
  - 'Phase 6 (Rounds 45-48): Third Wave - Defeat Ogre siege (Level 28-35)'
  - 'Phase 7 (Rounds 49-52): Fourth Wave - Survive Death Knight final assault (Level 35-42)'
relevant_game_context: |
  DEFENSE OVERVIEW
  - Seven defenders must hold the fortress at (~355,305) through four escalating waves (goblins → skeletons → ogres → death knight) with preparation breaks between phases. Each break is used to gather materials, craft upgrades, restock healing, and restore HP to ≥85% before the next assault.

  PHASE QUICK GUIDE
  1. R1-10 Setup: assign roles (frontline, ranged, support, commander), gather logs/ore/coal nearby, craft heavy swords, bows, pickaxes, arrows, and stock ~80 heals. Establish formation before Wave 1.
  2. R11-18 Wave 1 (Goblins L10-15): detect via observe_environment (or manual scouting), verify HP, then focus-fire each goblin using attack_mob while staying in formation. Heal back to ≥90% afterward.
  3. R19-28 Reinforcement: regroup, gather extra iron/coal/gold, craft axes, silver/gold rings, and more arrows; redistribute gear so every role is upgraded before skeletons.
  4. R29-36 Wave 2 (Skeletons L18-25): return to formation at full HP, detect the approach, then burn down each skeleton together, healing immediately between fights.
  5. R37-44 Final prep: mine/gather for elite gear, craft golden or enhanced weapons, stock ≥100 heals, finalize tactics for ogres/death knight.
  6. R45-48 Wave 3 (Ogres L28-35): same focus-fire tactics but announce stun/knockback events and keep support ready to heal frontline instantly.
  7. R49-52 Wave 4 (Death Knight L35-42): ensure every agent is full HP with best equipment, call out ability timings in chat, and only declare victory once the commander confirms all defenders still stand.

  EXECUTION NOTES
  - Without observe_environment, station scouts on the walls and watch the coordinate bands manually.
  - After every transfer/craft, run verify_inventory and post a quick status (“Arrows 70+, Rings equipped”).
  - Keep formation references in chat so re-positioning after gathering phases stays consistent.
max_action_steps: 57
