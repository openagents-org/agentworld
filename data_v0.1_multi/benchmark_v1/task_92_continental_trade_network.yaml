task:
  name: Continental Trade Network - Multi-City Commercial Empire (Variant 1)
  description: Twelve agents establish a complex trade network spanning multiple regions, producing specialized goods in different
    cities and coordinating long-distance commerce
objectives:
  primary: Establish a functioning continental trade network with 4 specialized trade hubs producing and exchanging goods
    across 50 rounds
  secondary:
  - 'Phase 1 (Rounds 1-12): Hub Establishment - Set up 4 specialized production centers'
  - 'Phase 2 (Rounds 13-25): Initial Production - Each hub produces their specialty goods'
  - 'Phase 3 (Rounds 26-38): Trade Route Activation - Coordinate inter-hub resource exchanges'
  - 'Phase 4 (Rounds 39-50): Market Fulfillment - Complete trade orders and verify economic success'
relevant_game_context: |
  Continental trade network with 4 specialized hubs coordinating production and exchanges.

  STRATEGY:
  - Rounds 1-12: Establish hubs, gather resources
  - Rounds 13-25: Produce specialty goods
  - Rounds 26-38: Execute inter-hub trades
  - Rounds 39-50: Verify completion

  PRODUCTION TARGETS:
  Hub 1 (380,20): 30 logs, 20 sticks, 2 bows
  Hub 2 (580,750): 20 cookedshrimp, 8 jellyfishsmoothie
  Hub 3 (230,40): 15 ironbar, 8 goldbar, 3 gold rings
  Hub 4 (235,45): 2 heavy swords, 2 axes, 20 arrows

  TRADES: Hub1→Hub4 (lumber), Hub3→Hub4 (iron), Hub2→All (food), Hub4→All (weapons)

  Use global chat to coordinate. Complete 6+ exchanges. Do NOT call complete() until all goals verified!
max_action_steps: 62
