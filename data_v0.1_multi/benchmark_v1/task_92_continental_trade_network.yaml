success_criteria:
- Hub 1 successfully produces 30+ logs through coordinated harvesting
- Hub 1 crafts 20+ sticks and 2+ wooden bows for export
- Hub 2 catches 25+ rawshrimp and 10+ jellyfish
- Hub 2 cooks 20+ cookedshrimp and 8+ jellyfishsmoothie
- Hub 3 mines 15+ ironore and 10+ goldore
- Hub 3 smelts 15+ ironbar and 8+ goldbar
- Hub 3 crafts 3+ gold rings and 2+ silver rings
- Hub 4 crafts 2+ heavy swords and 2+ axes
- Hub 4 crafts 20+ arrows from imported materials
- 'Successful trade: Hub 1 exports lumber to Hub 4'
- 'Successful trade: Hub 3 exports iron bars to Hub 4'
- 'Successful trade: Hub 2 distributes food to all hubs'
- 'Successful trade: Hub 4 distributes weapons to other hubs'
- At least 6 documented inter-hub exchanges completed
- Each hub receives goods from minimum 2 other hubs
- All twelve agents coordinate using global chat throughout
- Regular status updates from all hubs during all phases
- Continental trade network fully established within 50 rounds
