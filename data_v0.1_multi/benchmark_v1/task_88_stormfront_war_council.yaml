success_criteria:
- All ten agents attend the initial council, publish squad assignments, and record gathered intel.
- Logistics team documents the required raw materials (18 ironore, 12 coal, 10 logs, 6 string, 4 lightningbeads) with verify_inventory
  before crafting.
- Forged items (3 heavy swords, 2 axes, 2 pickaxes, 2 lightningstaff, 30 food items) are produced and assigned to carriers,
  with transfers logged.
- Each boss (Water Guardian, Ogre Guardian, Ice Guardian) is defeated with HP >80% threshold respected before engagement and
  post-battle regroup logged.
- Campaign concludes at (350,300) with loot summary and confirmation that no crafted weapon/staff is missing before complete().
