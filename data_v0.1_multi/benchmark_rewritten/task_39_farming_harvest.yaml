# AgentWorld Multi-Agent Task Configuration

task:
  name: "Farming Harvest - Crop Collection"
  description: "Three agents work together to harvest crops from farming areas"

# Task objectives
objectives:
  primary: "Harvest 4x corn, 4x tomato, and 3x peach from farming regions"
  secondary:
    - "Locate and harvest corn from farm fields"
    - "Gather tomatoes and peaches"
    - "Complete harvest within 28 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent farming scenario.

  OBJECTIVE: Harvest various crops from agricultural areas.

  HARVEST TARGETS:
  - 4x corn (Level 5 foraging)
  - 4x tomato (Level 15 foraging)
  - 3x peach (Level 5 foraging)

  CROP LOCATIONS:
  - Corn: Farm areas and plains
  - Tomato: Garden areas
  - Peach: Orchard areas near forests

  TEAM COORDINATION:
  - Each agent focuses on different crop types
  - Share locations of crop spawns via chat
  - Transfer items if needed for consolidation

  DO NOT use complete() until all crops are harvested!

# Limitations
max_action_steps: 28

