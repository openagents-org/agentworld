# AgentWorld Multi-Agent Task Configuration

task:
  name: "Mining Operation - Ore Extraction and Smelting"
  description: "Seven miners extract ore and smelt bars for tool production"

# Task objectives
objectives:
  primary: "Mine ore, smelt 6x ironbar, and craft 1x Pickaxe and 1x Silver Ring"
  secondary:
    - "Extract iron ore"
    - "Mine coal for smelting"
    - "Smelt bars and craft items"
    - "Complete within 40 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent mining and smithing scenario.

  OBJECTIVE: Extract ore and produce metal goods.

  PRODUCTION TARGETS:
  - 6x ironbar (smelted from 6x ironore + 6x coal)
  - 1x Pickaxe (5x ironbar + 1x logs)
  - 1x Silver Ring (2x ironbar)

  TOTAL MATERIALS NEEDED:
  - 7x iron ore (6 for bars, 1 extra)
  - 7x coal (for smelting)
  - 1x logs (for pickaxe handle)

  TEAM ROLES:
  - Iron Miners: Extract iron ore
  - Coal Miners: Mine coal
  - Smelter: Smelt ore to bars
  - Smith: Craft pickaxe and ring

  DO NOT use complete() until all items are crafted!

# Limitations
max_action_steps: 40

