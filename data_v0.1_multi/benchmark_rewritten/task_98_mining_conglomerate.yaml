# AgentWorld Multi-Agent Task Configuration

task:
  name: "Mining Conglomerate - Industrial Mining"
  description: "Fifteen agents mine ore and craft metal products"

# Task objectives
objectives:
  primary: "Mine 8x ironore, 6x coal, smelt 6x ironbar, and craft 2x Heavy Sword"
  secondary:
    - "Mine iron ore"
    - "Mine coal"
    - "Smelt bars"
    - "Craft heavy swords"
    - "Complete within 50 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent mining scenario.

  OBJECTIVE: Mine ores, smelt bars, and craft weapons.

  PRODUCTION TARGETS:
  - 8x ironore (from mountain)
  - 6x coal (from mountain)
  - 6x ironbar (smelted)
  - 2x Heavy Sword (2x ironbar + hilt2)

  MATERIALS PROVIDED:
  - Hilts provided to smith
  - Some coal provided to smelters

  LOCATIONS:
  - Mountain Mining: Around (230, 40)

  DO NOT use complete() until all objectives are met!

# Limitations
max_action_steps: 50

