# AgentWorld Multi-Agent Task Configuration

task:
  name: "Dungeon Expedition - Boss Hunt"
  description: "Seven adventurers explore dungeons and defeat bosses"

# Task objectives
objectives:
  primary: "Defeat the Iron Ogre at (238, 48), the Ogre Guardian at (291, 644), and craft 2x Heavy Sword"
  secondary:
    - "Prepare combat equipment"
    - "Defeat dungeon bosses"
    - "Complete within 45 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent dungeon expedition scenario.

  OBJECTIVE: Defeat dungeon bosses and craft weapons.

  TARGET BOSSES:
  - Iron Ogre (Level 25): Located at (238, 48)
  - Ogre Guardian (Level 32): Located at (291, 644)

  PRODUCTION TARGETS:
  - 2x Heavy Sword (2x ironbar + 1x hilt2 each)

  MATERIALS PROVIDED:
  - Iron bars and hilts provided to smiths

  TEAM ROLES:
  - Tanks: Draw aggro and take damage
  - DPS: Deal damage to bosses
  - Rangers: Ranged support
  - Support: Healing and crafting

  DO NOT use complete() until bosses are defeated and swords are crafted!

# Limitations
max_action_steps: 45

