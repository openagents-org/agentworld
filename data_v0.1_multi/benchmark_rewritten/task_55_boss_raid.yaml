# AgentWorld Multi-Agent Task Configuration

task:
  name: "Boss Raid - Wizard and Spectre Hunt"
  description: "Five agents raid multiple bosses in coordinated combat"

# Task objectives
objectives:
  primary: "Defeat the Ancient Wizard at (163, 339) and the Hermit Crab Warrior at (224, 359)"
  secondary:
    - "Prepare team with equipment"
    - "Execute coordinated boss attacks"
    - "Complete raid within 45 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent boss raid scenario.

  OBJECTIVE: Defeat two dangerous bosses in sequence.

  TARGET BOSSES:
  - Ancient Wizard (Level 10): Located at magical region (163, 339)
  - Hermit Crab Warrior (Level 30): Located at coastal region (224, 359)

  COMBAT STRATEGY:
  - Ancient Wizard: Magic attacks, spread out to avoid AoE
  - Hermit Crab Warrior: Heavy armor, use crush damage

  RAID ORDER:
  1. First defeat Ancient Wizard (easier target)
  2. Then move to Hermit Crab Warrior location
  3. Coordinate attacks on Hermit Crab Warrior

  TEAM ROLES:
  - Tank: Draw aggro
  - DPS: Deal damage
  - Mage: Magic support
  - Archer: Ranged damage
  - Healer: Keep team alive

  DO NOT use complete() until both bosses are defeated!

# Limitations
max_action_steps: 45

