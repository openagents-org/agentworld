# AgentWorld Multi-Agent Task Configuration

task:
  name: "Resource Caravan - Multi-Region Gathering"
  description: "Eight traders gather resources from different regions"

# Task objectives
objectives:
  primary: "Collect 6x logs from forest, 5x coal from mountain, and craft 1x Pickaxe"
  secondary:
    - "Gather logs from forest region"
    - "Mine coal from mountain region"
    - "Craft a pickaxe from materials"
    - "Complete within 40 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent resource gathering scenario.

  OBJECTIVE: Gather resources from multiple regions and craft a tool.

  PRODUCTION TARGETS:
  - 6x logs (from forest)
  - 5x coal (from mountain)
  - 1x Pickaxe (5x ironbar + 1x logs)

  REGION LOCATIONS:
  - Forest: Around (388, 10) - lumber resources
  - Mountain: Around (230, 40) - mining resources

  TEAM ROLES:
  - Lumberjacks: Gather logs from forest
  - Miners: Extract coal from mountains
  - Crafter: Assemble pickaxe

  DO NOT use complete() until all objectives are met!

# Limitations
max_action_steps: 40

