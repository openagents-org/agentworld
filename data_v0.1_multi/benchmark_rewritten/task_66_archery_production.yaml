# AgentWorld Multi-Agent Task Configuration

task:
  name: "Archery Production - Golden Bow Forge"
  description: "Six agents produce a legendary golden bow and arrows"

# Task objectives
objectives:
  primary: "Craft 1x Golden Bow and 20x Arrows"
  secondary:
    - "Mine gold ore and smelt gold bars"
    - "Gather logs and strings"
    - "Collect feathers for arrows"
    - "Complete within 45 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent archery production scenario.

  OBJECTIVE: Forge a legendary golden bow and produce arrows.

  PRODUCTION TARGETS:
  - 1x Golden Bow (15x goldbar + 10x string + 2x logs)
  - 20x Arrows (20x stick + 20x feather)

  MATERIAL REQUIREMENTS:
  - 15x goldbar (from mining and smelting gold)
  - 10x string (for bow)
  - 4x logs (2 for bow, 2+ for sticks)
  - 20x feather (from hunting birds)

  CRAFTING RECIPES:
  - 15x goldbar + 10x string + 2x logs -> 1x Golden Bow (Level 32 Fletching)
  - 1x logs -> 4x stick
  - 20x stick + 20x feather -> 20x Arrow

  TEAM ROLES:
  - Miners: Mine gold ore
  - Smelters: Smelt gold bars
  - Hunters: Collect feathers from birds
  - Fletchers: Craft bow and arrows

  DO NOT use complete() until all archery items are ready!

# Limitations
max_action_steps: 45

