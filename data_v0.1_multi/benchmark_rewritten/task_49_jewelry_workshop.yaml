# AgentWorld Multi-Agent Task Configuration

task:
  name: "Jewelry Workshop - Ring Collection"
  description: "Five agents work together to craft 2x Gold Rings and 2x Silver Rings"

# Task objectives
objectives:
  primary: "Craft 2x Gold Rings and 2x Silver Rings through coordinated mining and smithing"
  secondary:
    - "Mine gold ore and iron ore with coal"
    - "Smelt bars for ring crafting"
    - "Complete jewelry within 42 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent jewelry crafting scenario.

  OBJECTIVE: Create a collection of precious rings.

  PRODUCTION TARGETS:
  - 2x Gold Ring (2x goldbar each = 4x goldbar total)
  - 2x Silver Ring (2x ironbar each = 4x ironbar total)

  MATERIAL REQUIREMENTS:
  - 4x goldore + 4x coal → 4x goldbar → 2x goldring
  - 4x ironore + 4x coal → 4x ironbar → 2x silverring

  RESOURCE LOCATIONS:
  - Gold rocks: Mining area around (555, 545) (Level 25 mining)
  - Iron rocks: Mining area around (555, 545) (Level 20 mining)
  - Coal rocks: Mining area around (555, 545) (Level 1 mining)

  TEAM ROLES:
  - Gold Miners: Extract gold ore
  - Iron/Coal Miners: Extract iron and coal
  - Smiths: Smelt and craft rings

  DO NOT use complete() until all rings are crafted!

# Limitations
max_action_steps: 42

