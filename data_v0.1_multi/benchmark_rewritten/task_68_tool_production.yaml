# AgentWorld Multi-Agent Task Configuration

task:
  name: "Tool Production - Smithing Workshop"
  description: "Seven smiths mine ore and craft tools and weapons"

# Task objectives
objectives:
  primary: "Mine ore, smelt bars, and craft 2x Pickaxe, 2x Axe, and 1x Heavy Sword"
  secondary:
    - "Mine iron ore and coal"
    - "Smelt iron bars"
    - "Craft tools and weapons"
    - "Complete within 45 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent smithing scenario.

  OBJECTIVE: Produce tools and a weapon.

  PRODUCTION TARGETS:
  - 2x Pickaxe (5x ironbar + 1x logs each = 10x ironbar, 2x logs)
  - 2x Axe (3x ironbar + 1x logs each = 6x ironbar, 2x logs)
  - 1x Heavy Sword (2x ironbar + 1x hilt2)

  TOTAL IRON NEEDED: 18x ironbar
  - Requires 18x ironore + 18x coal for smelting

  TEAM ROLES:
  - Iron Miners: Extract iron ore
  - Coal Miners: Mine coal
  - Lumberjack: Harvest logs for handles
  - Smelter: Smelt ore to bars
  - Smith: Craft tools and weapons

  DO NOT use complete() until all items are crafted!

# Limitations
max_action_steps: 45

