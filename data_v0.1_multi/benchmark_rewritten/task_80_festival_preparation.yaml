# AgentWorld Multi-Agent Task Configuration

task:
  name: "Festival Preparation - Cooking and Crafting"
  description: "Ten agents prepare food and crafts for a festival"

# Task objectives
objectives:
  primary: "Cook 4x Cooked Shrimp, 3x Tuna Sushi, and craft 2x Silver Ring"
  secondary:
    - "Fish for seafood"
    - "Cook festival dishes"
    - "Craft jewelry prizes"
    - "Complete within 42 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent festival preparation scenario.

  OBJECTIVE: Prepare food and prizes for the festival.

  PRODUCTION TARGETS:
  - 4x Cooked Shrimp (cook 4x rawshrimp)
  - 3x Tuna Sushi (cook 3x rawtuna)
  - 2x Silver Ring (2x ironbar each)

  GATHERING REQUIREMENTS:
  - 4x rawshrimp (fishing)
  - 3x rawtuna (fishing)
  - 4x ironbar (provided to crafter)

  TEAM ROLES:
  - Fishers: Catch seafood
  - Cooks: Prepare dishes
  - Crafter: Make rings

  DO NOT use complete() until all items are ready!

# Limitations
max_action_steps: 42

