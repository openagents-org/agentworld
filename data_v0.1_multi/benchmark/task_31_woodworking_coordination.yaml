# AgentWorld Multi-Agent Task Configuration

task:
  name: "Advanced Woodworking and Equipment Crafting Coordination"
  description: "Three agents work together to establish coordinated resource gathering, advanced crafting, and equipment enhancement operations"

# Task objectives
objectives:
  primary: "Establish coordinated resource gathering and advanced crafting operations using available game resources"
  secondary: # checkpoints
    - "Execute coordinated wood harvesting and resource collection operations"
    - "Establish advanced crafting coordination and equipment enhancement procedures"
    - "Complete resource gathering and crafting operations within 30 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent advanced crafting scenario using realistic game resources.
  
  OBJECTIVE: Create advanced equipment and coordinate resource gathering using available game materials.
  
  MISSION REQUIREMENTS:
  - Harvest wood resources from trees (Willow, Pine, Snowoak available in area)
  - Craft advanced wooden components and tools
  - Create multiple pieces of equipment for the team
  - Coordinate between harvesting, crafting, and equipment distribution
  
  TEAM COORDINATION:
  - Use global chat to share resource locations and harvesting progress
  - Coordinate between resource gathering and crafting operations
  - Share materials and provide support for equipment creation
  - Work together to handle resource scarcity and optimize efficiency
  
  GENERAL STRATEGY:
  - The team needs to locate and harvest available tree resources efficiently
  - Advanced crafting requires coordination and material sharing
  - Equipment creation requires proper skill levels and materials
  - Balance harvesting efficiency with team coordination
  - Coordinate material distribution with equipment needs
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  RESOURCE GATHERING (CRITICAL KNOWLEDGE):
  🌲 Wood Harvesting:
    - harvest_resource on tree instances to get wood materials
    - Level required: 15+ (Lumberjacking skill)
    - Tool required: Axe for wood harvesting
    - Look for "Willow Tree", "Pine Tree", or "Snowoak Tree" instances
  
  🔨 Crafting - wooden items:
    - craft_item skill=Crafting itemKey=<wooden_item>
    - Materials: wood materials → crafted items
    - Level required: 20+ (Crafting skill)
    - IMPORTANT: Focus on items that exist in the game
  
  ⚔️ Equipment Enhancement:
    - Use available game mechanics for equipment improvement
    - Level required: 25+ (appropriate skill)
    - Materials: base equipment + enhancement materials
    - CRITICAL: Focus on realistic equipment upgrades
  
  🛠️ Advanced Equipment Creation:
    - Create multiple useful items for team equipment upgrade
    - Coordinate item types based on team needs
    - Balance resource investment with practical equipment needs

# Limitations
max_action_steps: 30

