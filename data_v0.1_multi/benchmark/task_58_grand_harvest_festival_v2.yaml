# AgentWorld Multi-Agent Task Configuration

task:
  name: "Grand Harvest Festival - Extended 8-Agent Culinary Extravaganza"
  description: "Eight agents coordinate to prepare for a grand festival by gathering ingredients, cooking dishes, crafting decorations, and delivering everything to the festival grounds"

# Task objectives
objectives:
  primary: "Prepare and deliver a complete festival package: 7x cooked dishes, 4x decorative jewelry, 3x tools, and 70+ gathered resources to Central Festival Grounds"
  secondary:
    - "Phase 1 (Rounds 1-18): Resource Gathering Spree - Collect ingredients from multiple biomes"
    - "Phase 2 (Rounds 19-35): Culinary Production - Cook 7 different festival dishes"
    - "Phase 3 (Rounds 36-48): Decorative Crafting - Create festival decorations and gifts"
    - "Phase 4 (Rounds 49-58): Grand Festival Assembly - Deliver all items to festival grounds"

# Context and guidance for agents
relevant_game_context: |
  FESTIVAL SNAPSHOT
  - In 58 rounds eight agents must gather 70+ raw ingredients, cook 7 dishes (2x tomato stew, 2x corn stew, cooked chicken, cooked shrimp, jellyfish smoothie), craft 4 jewelry gifts (2x beryl pendant, silver ring, topaz ring), and 3 tools (bucket, wooden bow, axe), then deliver everything to the central grounds (528,384).

  ROLES & ROUTES
  - Foragers (Agents 1-2) sweep the western forest belt (~250,350) for tomatoes, corn, onions, mushrooms, fruit, beads/beryl; report totals every few items and walk east toward the hub once they hit ≈50 gathers.
  - Fisher (Agent 3) patrols the eastern coast (~900,400) fishing shrimp/jellyfish.
  - Hunter (Agent 4) hunts low-level birds for chicken meat, before trekking west to the hub.
  - Hub quartet (Agents 5-8) stay near (528,384) ready to receive transfers: Agent 5 cooks, Agent 6 crafts jewelry, Agent 7 handles tools, Agent 8 coordinates logistics.

  PHASE FLOW
  1. R1-18 Gather: field teams farm materials in parallel; hub logs progress and double-checks starting bowls/strings/hilts.
  2. R19-35 Deliver & Cook: all gatherers converge on the hub using ≤32-tile moves, transfer via transfer_items with verify_inventory confirmations, then Head_Chef cooks the seven dishes.
  3. R36-48 Craft Decor & Tools: Jeweler turns beryl+string into pendants and irons/gold into rings. Artisan crafts bucket (3 iron bars), wooden bow (log+string), and axe.
  4. R49-58 Assembly: everyone states their final inventory, loads items for delivery, and one agent summarizes totals before complete().

  EXECUTION TIPS
  - Keep a running checklist in chat ("Veg 40/50", "Seafood ready", "Jewelry 3/4").
  - Use transfer_items only within ~10 tiles and acknowledge both send/receive sides.
# Limitations
max_action_steps: 58

