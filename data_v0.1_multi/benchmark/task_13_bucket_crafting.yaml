# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cooperative Bucket Crafting - Utility Container Production"
  description: "Three agents work together to create a bucket through extensive wood gathering, processing, and advanced crafting"

# Task objectives
objectives:
  primary: "Create a utility bucket through coordinated large-scale wood processing and crafting"
  secondary: # checkpoints
    - "Execute large-scale lumber operations"
    - "Coordinate extensive wood processing for container crafting"
    - "Complete utility container production within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent utility crafting scenario requiring extensive wood materials.
  
  CRITICAL SUCCESS REQUIREMENTS:
  1. lumber_harvester_agent MUST collect large quantities of logs from trees
  2. wood_processor_agent MUST verify and organize wood materials
  3. container_crafter_agent MUST craft bucket from 5x logs using advanced crafting
  4. container_crafter_agent MUST display the bucket and declare completion
  
  LOCATION STRATEGY:
  - Multiple forest areas for extensive logging operations
  - Central wood processing facility for material organization
  - Advanced crafting station for bucket construction
  - Communicate lumber operations through global chat
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  🪵 Lumberjacking - logs:
    - harvest_resource on oak tree instances to get logs
    - Level required: 1+ (Lumberjacking skill)
  
  🪣 Crafting Recipe - bucket:
    - craft_item skill=Crafting itemKey=bucket
    - Materials: 5x logs → 1x bucket
    - Level required: 10 (Crafting skill) - ADVANCED CRAFTING!

# Limitations
max_action_steps: 25

# Agent configurations
agent_1:
  username: "lumber_harvester_agent"
  new_character: true
  role: "Mass Lumber Harvester"
  
  location:
    x: 126
    y: 23
  
  skill_levels:
    lumberjacking: 30
    strength: 35
    health: 30
  
  inventory_items:
    - item: "flask"
      count: 15
    - item: "apple"
      count: 20
  
  equipped_items:
    - item: "axe"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Mass lumber harvester responsible for large-scale wood collection
    
    🪵 CRITICAL MASS LOGGING MISSION - HARVEST 5+ LOGS!
    
    ABSOLUTE PRIORITIES:
    1. Find and cut multiple oak trees for logs
    2. Execute large-scale logging operations
    3. Collect 5+ logs for bucket crafting
    4. Transfer logs to wood_processor_agent
    
    MASS LOGGING STRATEGY:
    1. observe_environment to find oak trees in current area
    2. harvest_resource on multiple oak tree instances to get logs
    3. Target: Collect 5-6x logs for bucket + backup
    4. If insufficient trees in area, move to additional forest locations:
       - move_character(x=150, y=50) for forest expansion area
       - move_character(x=100, y=70) for additional tree area
       - move_character(x=180, y=30) for lumber zone
    5. Continue logging until sufficient logs collected
    6. Check inventory frequently during mass harvesting
    7. Use global chat every 3-4 actions to report logging progress
    8. Once you have 5+ logs, coordinate with wood_processor_agent
    9. Move to wood processing facility for log transfer
    10. transfer_items to give logs to wood_processor_agent
    11. Wait for wood_processor_agent to confirm log receipt
    12. Support team until bucket crafting is complete
    
    MASS LOGGING REQUIREMENTS:
    - Lumberjacking skill for tree cutting (you have 30)
    - 5+ logs required for bucket crafting
    - Efficient forest area coverage
    
    ERROR PREVENTION:
    - Count logs carefully during collection
    - Move systematically through forest areas
    - Verify axe equipped for all tree cutting
    - REMEMBER: Bucket needs 5 logs - substantial lumber operation!

agent_2:
  username: "wood_processor_agent"
  new_character: true
  role: "Wood Processing Coordinator"
  
  location:
    x: 183
    y: 312
  
  skill_levels:
    lumberjacking: 20
    crafting: 15      # Wood processing knowledge
    strength: 25
    health: 25
  
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "axe"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Wood processing coordinator responsible for material organization
    
    🌳 CRITICAL WOOD PROCESSING MISSION - ORGANIZE LUMBER MATERIALS!
    
    ABSOLUTE PRIORITIES:
    1. Coordinate with lumber_harvester_agent for log collection
    2. Verify and organize wood materials for bucket crafting
    3. Quality control lumber for container construction
    4. Transfer processed logs to container_crafter_agent
    
    WOOD PROCESSING STRATEGY:
    1. send global chat message announcing wood processing facility readiness
    2. Coordinate with lumber_harvester_agent for log transfer
    3. observe_environment to verify logs received
    4. Conduct quality inspection of lumber materials
    5. Verify count: Ensure 5x logs minimum for bucket crafting
    6. Organize logs for efficient container crafting transfer
    7. Use global chat to report wood processing completion
    8. Coordinate with container_crafter_agent for material transfer
    9. Move to crafting facility for processed log transfer
    10. transfer_items to give logs to container_crafter_agent
    11. Wait for container_crafter_agent to confirm receipt
    12. Support team until bucket crafting is complete
    
    WOOD PROCESSING REQUIREMENTS:
    - Quality control of lumber materials
    - 5x logs minimum for bucket crafting
    - Efficient material organization
    
    ERROR PREVENTION:
    - Verify exact log count before transfer
    - Check quality of lumber materials
    - Coordinate timing with both harvester and crafter
    - REMEMBER: Container crafter needs exactly 5 logs!

agent_3:
  username: "container_crafter_agent"
  new_character: true
  role: "Advanced Container Craftsperson"
  
  location:
    x: 136
    y: 25
  
  skill_levels:
    crafting: 25      # Required for bucket crafting (level 10+)
    lumberjacking: 15 # Wood material knowledge
    strength: 25
    health: 25
  
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Advanced container craftsperson responsible for bucket construction
    
    🪣 PRIORITY ACTIONS:
    1. Coordinate with wood_processor_agent for processed lumber
    2. Execute advanced bucket crafting techniques
    3. Quality control and container testing
    4. Display finished bucket and declare completion
    
    CONTAINER CRAFTING COORDINATION:
    1. send global chat message announcing advanced container crafting facility readiness
    2. Wait for wood_processor_agent to report lumber processing completion
    3. Coordinate meetup for processed log transfer
    4. Move to agreed location to receive processed logs
    5. observe_environment to verify logs received
    
    CRITICAL CONTAINER CRAFTING STEPS:
    6. BEFORE crafting, use observe_environment to CHECK YOUR INVENTORY
    7. VERIFY you have 5x logs in your inventory
    8. ONLY AFTER verifying materials, use craft_item:
       📋 RECIPE: craft_item skill=Crafting itemKey=bucket (5x logs → 1x bucket)
    9. WAIT for craft_item result - confirm "Successfully crafted" message
    10. observe_environment to verify bucket in inventory
    11. Use global chat to announce successful bucket construction
    12. Display bucket for team verification
    13. complete() ONLY after successful bucket creation
    
    CONTAINER CRAFTING REQUIREMENTS:
    ✅ 5x logs (from wood_processor_agent) - LARGE QUANTITY
    ✅ Crafting skill level 10+ (you have level 25) - ADVANCED!
    
    ERROR PREVENTION:
    - Verify exact log count before crafting
    - Check advanced crafting skill requirements
    - Handle container construction with precision
    - REMEMBER: Bucket requires advanced crafting skills!

# Success criteria for multi-agent task
success_criteria:
  - "lumber_harvester_agent successfully harvests and transfers 5+ logs"
  - "wood_processor_agent successfully organizes and transfers processed logs"
  - "container_crafter_agent receives logs and crafts bucket"
  - "container_crafter_agent successfully creates utility bucket"
  - "All agents coordinate large-scale lumber operations effectively"
  - "Advanced utility container production completes within time limit"
