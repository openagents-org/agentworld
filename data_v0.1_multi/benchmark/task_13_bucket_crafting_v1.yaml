# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Only 2 agents, one already has logs

task:
  name: "Cooperative Bucket Crafting - Utility Container Production"
  description: "Two agents work together to create a bucket through wood processing and advanced crafting"

# Task objectives
objectives:
  primary: "Create a utility bucket through coordinated wood processing and crafting"
  secondary: # checkpoints
    - "Coordinate lumber operations"
    - "Execute container crafting"
    - "Complete utility container production within 20 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent utility crafting scenario.

  OBJECTIVE: Create a utility bucket through coordinated wood processing and advanced container crafting.

  TEAM COORDINATION:
  - Use global chat to coordinate lumber and crafting operations
  - Share wood materials for advanced crafting requirements
  - Work together to complete utility container production chain

  GENERAL STRATEGY:
  - lumber_harvester_agent already has some logs
  - Gather additional logs if needed
  - Transfer logs to container_crafter_agent for bucket crafting
  - Bucket crafting requires 5x logs and advanced crafting skills

  DO NOT use complete() until ALL objectives are achieved by the team!

  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  🪵 Lumberjacking - logs:
    - harvest_resource on oak tree instances to get logs
    - Level required: 1+ (Lumberjacking skill)

  🪣 Crafting Recipe - bucket:
    - craft_item skill=Crafting itemKey=bucket
    - Materials: 5x logs → 1x bucket
    - Level required: 10 (Crafting skill) - ADVANCED CRAFTING!

# Limitations
max_action_steps: 20

# Agent configurations
