task:
  name: "Legendary Golden Tribute - The Royal Commission"
  description: "A high-stakes industrial operation to produce a set of legendary golden armaments for the King's Guard within a strict timeframe."

objectives:
  primary: "Produce 5 Golden Bows and 1 Golden Sword, then present them to the Royal Tribute Master."
  secondary:
    - "Miners: Mine 100 Gold Ore from the rocky deposits"
    - "Hunters: Provide 50 String and 10 Logs (Scout the area or use supplies)"
    - "Smiths: Smelt 100 Gold Bars (using Coal + Gold Ore)"
    - "Smiths: Craft 5 Golden Bows (15 Gold Bars + 10 String + 2 Logs each)"
    - "Smiths: Craft 1 Golden Sword (15 Gold Bars + 1 Hilt)"
    - "Tribute Master (Smith_1): Hold all 6 Legendary Items at the end"

relevant_game_context: |
  👑 THE ROYAL DECREE
  
  The King demands a tribute of Golden Weaponry.
  You are stationed at the Golden Peaks (Region 2-0).
  
  PRODUCTION CHAIN:
  1. MINING TEAM (Agents 1-10):
     - Target: Gold Deposits (Level 25 Mining).
     - Goal: 100 Gold Ore total.
     - Action: Drop Ore at the Smelter (Smith_1's location) every 10 rounds.
  
  2. HUNTER TEAM (Agents 11-15):
     - You carry the rare 'String' needed for bowstrings.
     - You must also harvest 'Oak Trees' for the Bow staves (Logs).
     - Goal: Transfer 50 String and 10 Logs to the Smiths.
     - Support: Protect the miners from Vultures if needed.
  
  3. SMITH TEAM (Agents 16-20):
     - You hold the Coal (Fuel).
     - Task 1: Smelt Gold Ore -> Gold Bars.
     - Task 2: Craft the Items.
       - Golden Bow: 15 Gold Bars, 10 String, 2 Logs. (Requires Fletching Lvl 32)
       - Golden Sword: 15 Gold Bars, 1 Hilt. (Requires Smithing Lvl 62)
     - Note: Smith_1 is the designated "Tribute Master". Consolidate final items with them.
  
  DEADLOCK PREVENTION:
  - Miners must NOT hoard ore. Transfer it!
  - Smiths must share Gold Bars if one smith has the skills/recipe.
  - Designate ONE crafter for Bows and ONE for Swords if skills differ, or all work together.
  - CHECK SKILLS:
    - Smith_1 has High Smithing (Sword).
    - Smith_2 has High Fletching (Bows).
  
  LIMITATIONS:
  - Time is short. 55 Rounds.
  - Gold Ore mining is slow. 10 Miners x 10 Ore each = 100. Perfect efficiency required.

limitations:
  max_action_steps: 55

