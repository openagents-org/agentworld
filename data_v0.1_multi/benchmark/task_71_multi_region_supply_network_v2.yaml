# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Extended 10-agent 6-region supply empire

task:
  name: "Multi-Region Supply Network - Continental Trade Empire"
  description: "Ten agents establish a complex supply empire spanning 6 regions with specialized teams and massive production"

# Task objectives
objectives:
  primary: "Create a functioning 6-region supply empire with specialized gathering teams, logistics, and industrial crafting over 65 rounds"
  secondary:
    - "Phase 1 (Rounds 1-10): Network Planning - Scout all regions and establish base camps"
    - "Phase 2 (Rounds 11-24): Specialized Gathering - Teams gather region-specific materials simultaneously"
    - "Phase 3 (Rounds 25-38): Transport Operations - Coordinate multi-wave material transfers"
    - "Phase 4 (Rounds 39-52): Mass Production - Craft advanced equipment using all resources"
    - "Phase 5 (Rounds 53-65): Distribution & Validation - Deliver goods and validate network"

# Relevant game context
relevant_game_context: |
  NETWORK GOAL
  - Ten agents run a six-region supply empire over ~65 rounds: forest logs/sticks, mountain ores (iron/coal/gold), coast feathers/strings/food, plains herbs, desert materials, plus a central hub that smelts/crafts and redistributes.

  PHASE OVERVIEW
  1. R1-10 Planning: assign teams (Forest, Mountain, Coast, Plains, Desert, Hub), scout all regions, set chat protocols.
  2. R11-24 Gathering: each team hits quotas (forest 60 logs + 120 sticks, mountains 50 iron/50 coal/25 gold, coast 40 feathers + 40 string + 80 food, etc.).
  3. R25-38 Transport: execute five delivery waves. After each arrival, transfer via transfer_items.
  4. R39-52 Production: hub crafters smelt bars, craft weapons/bows/staffs/rings, package shipments.
  5. R53-65 Distribution: deliver finished goods to all regions, validate network.

  EXECUTION NOTES
  - Keep a running logistics board in chat ("Mountain 40/50 iron") so the hub can time smelting.
  - Transfers only work within ~10 tiles; both sender and receiver must confirm.
# Limitations
max_action_steps: 65

