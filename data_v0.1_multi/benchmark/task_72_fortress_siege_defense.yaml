# AgentWorld Multi-Agent Task Configuration

task:
  name: "Fortress Siege Defense - Multi-Wave Boss Assault"
  description: "Seven defenders prepare fortifications and withstand 4 waves of increasingly difficult boss attacks"

# Task objectives
objectives:
  primary: "Defend a fortress against 4 progressive enemy waves over 52 rounds with preparation phases between each assault"
  secondary:
    - "Phase 1 (Rounds 1-10): Fortress Preparation - Build defenses and craft siege equipment"
    - "Phase 2 (Rounds 11-18): First Wave - Repel Goblin assault (Level 10-15)"
    - "Phase 3 (Rounds 19-28): Reinforcement - Upgrade defenses and equipment for harder waves"
    - "Phase 4 (Rounds 29-36): Second Wave - Survive Skeleton invasion (Level 18-25)"
    - "Phase 5 (Rounds 37-44): Final Preparation - Craft elite equipment for ultimate waves"
    - "Phase 6 (Rounds 45-48): Third Wave - Defeat Ogre siege (Level 28-35)"
    - "Phase 7 (Rounds 49-52): Fourth Wave - Survive Death Knight final assault (Level 35-42)"

# Relevant game context
relevant_game_context: |
  This is an epic fortress defense requiring strategic preparation, progressive equipment upgrades, and coordinated wave defense.

  🚨 CRITICAL AWARENESS - SIEGE DEFENSE:
  - ALWAYS use verify_inventory to check HP before each wave
  - ALWAYS use chat to coordinate defense formations
  - Use observe_environment radius=64 to detect incoming enemy waves
  - Use attack_mob for combat (system handles battles)
  - NEVER engage wave if team average HP < 85%
  - Team must maintain defensive formation (specific positions)
  - Each wave harder than previous - preparation phases MANDATORY
  - Defenders cannot flee - must hold fortress position

  📍 FORTRESS LOCATION: (350-365, 300-310) - Defensive stronghold position

  🎯 SIEGE STRUCTURE: Survive all 7 phases over 52 rounds

  ═══════════════════════════════════════════════════════════════
  PHASE 1 - FORTRESS PREPARATION (Rounds 1-10)
  ═══════════════════════════════════════════════════════════════

  🎯 MANDATORY Objectives:
    - Establish defensive positions at fortress (350-365, 300-310)
    - Assign defender roles: 2x Frontline, 2x Ranged, 2x Support, 1x Commander
    - Gather defensive materials: 20+ logs, 30+ iron ore, 30+ coal
    - Craft siege equipment: 4x Heavy Swords, 2x Bows, 3x Pickaxes
    - Create defensive supplies: 80+ healing items, 40+ arrows
    - Build psychological readiness - team motivation critical
    - Establish fallback positions and emergency protocols

  📋 DEFENDER ROLE ASSIGNMENTS:

  **Frontline Defenders (2 agents: DefenderGuard1, DefenderGuard2)**
  - Position: Front of fortress (352-355, 302-305)
  - Role: First contact with enemy waves, tank damage
  - Equipment priority: Heavy armor, shields, strong weapons
  - Skills: Defense 40+, Health 50+, Strength 35+
  - Responsibility: Hold the line, protect ranged units

  **Ranged Attackers (2 agents: DefenderArcher1, DefenderArcher2)**
  - Position: Mid-fortress (358-360, 305-307)
  - Role: Ranged damage, kiting, archer support
  - Equipment priority: Bows, arrows, mobility
  - Skills: Accuracy 40+, Archery 35+, Fletching 30+
  - Responsibility: Ranged attacks, arrow management

  **Support Specialists (2 agents: DefenderMedic, DefenderSmith)**
  - Position: Rear-fortress (362-365, 307-310)
  - Role: Equipment crafting, supply management, backup combat
  - Equipment priority: Crafting tools, backup weapons
  - Skills: Crafting 40+, Smithing 35+, Magic 30+
  - Responsibility: Craft mid-siege, distribute supplies, emergency combat

  **Commander (1 agent: DefenderCommander)**
  - Position: Central-fortress (357, 305) - command post
  - Role: Coordinate all operations, strategic decisions
  - Equipment priority: Balanced loadout, communication priority
  - Skills: Balanced stats, Leadership (via chat coordination)
  - Responsibility: Call wave attacks, coordinate formations, manage resources

  🌲 HOW TO GATHER DEFENSIVE MATERIALS (Rounds 1-6):

  A) Logs (Target: 20+ for fortifications and crafting):
     - Travel together to nearby forest (around 250, 350)
     - DefenderGuard1 and DefenderSmith focus on logging
     - Use harvest_resource targetInstance=<tree_instance>
     - Gather quickly and return to fortress (2-3 rounds)
     - Chat: "Logs: X/20 gathered. Returning to fortress."

  B) Iron Ore and Coal (Target: 30+ each for weapons/armor):
     - Travel to mountain area (230, 38)
     - ALL defenders help mine (strength in numbers)
     - Use observe_environment to find rock nodes
     - DefenderGuard1, DefenderGuard2, DefenderSmith prioritize mining
     - Takes 3-4 rounds to gather sufficient ore
     - Chat: "Ores: X/30 iron, Y/30 coal. Mining complete."

  C) Additional Supplies:
     - Hunt nearby creatures for food/healing items
     - Forage plants around fortress area
     - Collect feathers from birds/bats for arrows
     - Target: 60+ healing items from gathering
     - Chat: "Supplies: X healing items, Y feathers collected."

  ⚔️ HOW TO CRAFT SIEGE EQUIPMENT (Rounds 7-9):

  A) Smelt Iron Bars (30+ needed):
     - DefenderSmith and DefenderMedic handle smelting
     - Function: craft_item skill=Crafting itemKey=ironbar
     - Recipe: 1x ironore + 1x coal → 1x ironbar
     - Craft 30 times to create 30 bars
     - Chat: "Smelting: X/30 iron bars complete."

  B) Heavy Swords (4x for frontline and backup):
     - Function: craft_item skill=Smithing itemKey=sword2
     - Recipe: 2x ironbar + 1x hilt2 → 1x Heavy Sword
     - DefenderSmith crafts all 4 swords (some agents have hilts in starting inventory)
     - Distribute: 2 to frontline, 1 to commander, 1 to support
     - Chat: "Weapons: 4/4 Heavy Swords forged!"

  C) Wooden Bows (2x for archers):
     - Function: craft_item skill=Fletching itemKey=woodenbow
     - Recipe: 1x logs + 1x string → 1x Wooden Bow
     - DefenderArcher1 and DefenderArcher2 have string in inventory
     - Each crafter makes 1 bow
     - Chat: "Ranged: 2/2 Bows complete!"

  D) Pickaxes (3x for utility and backup weapons):
     - Function: craft_item skill=Smithing itemKey=pickaxe
     - Recipe: 5x ironbar + 1x logs → 1x Pickaxe
     - Good backup weapons, also useful for emergency mining
     - Craft 3 for support roles
     - Chat: "Utility: 3/3 Pickaxes crafted!"

  E) Arrows (40+ for siege):
     - First craft sticks from logs:
       * Function: craft_item skill=Fletching itemKey=stick
       * Recipe: 1x logs → 4x sticks
       * Need 10 logs to make 40 sticks
     - Then craft arrows:
       * Function: craft_item skill=Fletching itemKey=arrow
       * Recipe: 10x stick + 10x feather → 10x arrows
       * Craft 4 times to make 40 arrows
     - Distribute to archers (20 each)
     - Chat: "Ammunition: 40/40 arrows ready!"

  🛡️ HOW TO ESTABLISH DEFENSIVE FORMATION (Round 10):

  Fortress Layout (coordinate positions):

  ```
  Enemy approach →
              Front Line (352-355, 302-305)
              [DefenderGuard1] [DefenderGuard2]
                        ↓
              Middle (357-360, 305-307)
           [DefenderCommander] [DefenderArcher1] [DefenderArcher2]
                        ↓
              Rear (362-365, 307-310)
              [DefenderMedic] [DefenderSmith]
  ```

  - Each defender moves to designated position
  - Use observe_environment to verify formation
  - Confirm positions via chat: "Agent X: Position (A,B). Formation: Ready."
  - DefenderCommander verifies all positions
  - Chat: "FORTRESS FORMATION ESTABLISHED! All defenders in position! Wave 1 incoming!"

  ⏱️ TIME ALLOCATION:
    - Rounds 1-6: Gather materials (logs, ores, supplies)
    - Rounds 7-9: Craft equipment (bars, weapons, bows, arrows)
    - Round 10: Establish formation, distribute equipment, final prep

  ═══════════════════════════════════════════════════════════════
  PHASE 2 - FIRST WAVE: GOBLIN ASSAULT (Rounds 11-18)
  ═══════════════════════════════════════════════════════════════

  🎯 Objectives:
    - Detect incoming goblin wave (Level 10-15)
    - Maintain defensive formation
    - Coordinate simultaneous attacks
    - Defeat 2-3 goblins without breaking formation
    - Assess team performance and equipment effectiveness
    - Prepare for reinforcement phase

  👺 HOW TO DETECT INCOMING WAVE:
    - DefenderCommander uses observe_environment radius=64
    - Look for goblin mobs approaching fortress area
    - Goblins spawn around (350, 250) and approach fortress
    - Chat: "WAVE 1 DETECTED! Goblins spotted at (X,Y). Level: 10-15. Count: 2-3."
    - All defenders prepare for combat

  🛡️ HOW TO ENGAGE FIRST WAVE (Defensive Formation):

    Round 11: Detection and Ready Check
    - DefenderCommander: observe_environment radius=64
    - Identify goblin positions and count
    - ALL defenders: verify_inventory to check HP
    - Requirement: ALL HP > 85%
    - DefenderCommander: "Wave 1 Ready Check. All agents report HP."
    - Each agent: "Agent X: HP Y/Z. Position maintained. READY!"

    Round 12-13: First Goblin Engagement
    - Goblins approach fortress (they move toward defenders)
    - Wait until goblin within 20 tiles of front line
    - DefenderCommander calls attack: "ENGAGE GOBLIN 1! Target: [instance]"
    - Attack sequence (ALL attack SAME goblin):
      * DefenderGuard1: attack_mob targetInstance=<goblin1>
      * DefenderGuard2: attack_mob targetInstance=<goblin1>
      * DefenderCommander: attack_mob targetInstance=<goblin1>
      * DefenderArcher1: attack_mob targetInstance=<goblin1>
      * DefenderArcher2: attack_mob targetInstance=<goblin1>
      * DefenderMedic: attack_mob targetInstance=<goblin1>
      * DefenderSmith: attack_mob targetInstance=<goblin1>
    - Focus fire = fast kill = less damage taken
    - Chat: "Goblin 1 defeated! Team HP: [list all agents]"

    Round 14-15: Second Goblin Engagement (if 2+ goblins)
    - Repeat focused attack on second goblin
    - Maintain formation positions
    - DefenderCommander: "ENGAGE GOBLIN 2! Target: [instance]"
    - All agents attack same target again
    - Chat: "Goblin 2 defeated! Wave 1 progress: 2/3"

    Round 16-17: Final Goblin Engagement (if 3 goblins)
    - Third goblin engagement with same tactics
    - All agents attack simultaneously
    - Chat: "Goblin 3 defeated! WAVE 1 COMPLETE!"

    Round 18: Post-Wave Recovery
    - All agents verify_inventory to check HP
    - Distribute healing items if any agent below 80%
    - Heal to full HP (100%) before Phase 3
    - Collect loot from defeated goblins
    - DefenderCommander: "Wave 1 aftermath: All agents HP > 80%: YES/NO"
    - If any injured: "Healing Agent X to full HP. Using Y items."
    - Final status: "WAVE 1 SURVIVED! All defenders ready for reinforcement phase."

  ⏱️ TIME ALLOCATION:
    - Round 11: Wave detection and ready check
    - Rounds 12-17: Combat (2-3 goblins, ~2 rounds each)
    - Round 18: Recovery and preparation for Phase 3

  ═══════════════════════════════════════════════════════════════
  PHASE 3 - REINFORCEMENT (Rounds 19-28)
  ═══════════════════════════════════════════════════════════════

  🎯 MANDATORY Objectives:
    - Recover from Wave 1 combat
    - Gather additional materials: 15+ iron ore, 15+ coal, 10+ gold ore
    - Craft enhanced equipment: 3x Axes, 5x Silver Rings
    - Create more arrows: 30+ additional
    - Stock healing supplies: 100+ total across team
    - Upgrade defender loadouts for Wave 2
    - Reinforce fortress formation

  ❤️ HOW TO RECOVER AND ASSESS (Rounds 19-20):
    - All agents check equipment durability (verify_inventory)
    - Count remaining healing items (should be 60+)
    - Check arrow counts (archers should have 15+ each)
    - Identify weak points from Wave 1:
      * Did any agent take heavy damage?
      * Did formation hold?
      * Were attacks coordinated?
    - DefenderCommander: "Wave 1 assessment complete. Proceeding to reinforcement gathering."

  ⛏️ HOW TO GATHER REINFORCEMENT MATERIALS (Rounds 21-24):
    A) Additional Iron and Coal (15+ each):
       - Team travels together to mountains (230, 38)
       - Faster gathering with full team (3-4 agents mine)
       - Use observe_environment to find nodes
       - Quick extraction: 2-3 rounds
       - Chat: "Reinforcement ores: X/15 iron, Y/15 coal gathered."

    B) Gold Ore (10+ for premium equipment):
       - Search mountain area for gold rock
       - Requires Mining 25+ (DefenderGuard1, DefenderGuard2 can mine)
       - Target: 10 gold ore for silver/gold rings
       - Chat: "Premium ores: X/10 gold collected."

    C) Additional Supplies:
       - Hunt creatures near fortress for food
       - Gather more feathers for arrows (need 30 more)
       - Forage healing plants
       - Target: 40+ additional healing items
       - Chat: "Supplies: X healing items, Y feathers acquired."

  🔨 HOW TO CRAFT ENHANCED EQUIPMENT (Rounds 25-27):
    A) Smelt Additional Bars:
       - Iron bars: 15 (from 15 iron ore + 15 coal)
       - Gold bars: 10 (from 10 gold ore + remaining coal)
       - Function: craft_item skill=Crafting itemKey=ironbar
       - Function: craft_item skill=Crafting itemKey=goldbar
       - DefenderSmith and DefenderMedic work together
       - Chat: "Bars: 15 iron, 10 gold smelted."

    B) Axes (3x for enhanced melee):
       - Function: craft_item skill=Smithing itemKey=axe
       - Recipe: 3x ironbar + 1x logs → 1x Axe
       - Craft 3 axes (9 iron bars + 3 logs)
       - Distribute to support and commander for better weapons
       - Chat: "Enhanced weapons: 3/3 Axes crafted!"

    C) Silver Rings (5x for defense boost):
       - Function: craft_item skill=Smithing itemKey=silverring
       - Recipe: 2x ironbar → 1x silverring
       - Craft 5 rings (10 iron bars)
       - Distribute to all frontline and key defenders
       - Provides crucial defense boost for harder waves
       - Chat: "Defense: 5/5 Silver Rings ready!"

    D) Gold Rings (2x for premium defense):
       - Function: craft_item skill=Smithing itemKey=goldring
       - Recipe: 2x goldbar → 1x goldring
       - Craft 2 rings (4 gold bars)
       - Give to DefenderGuard1 and DefenderGuard2 (frontline priority)
       - Chat: "Premium: 2/2 Gold Rings forged!"

    E) Additional Arrows (30+):
       - Craft more sticks from logs
       - Function: craft_item skill=Fletching itemKey=arrow
       - Recipe: 10x stick + 10x feather → 10x arrows
       - Craft 3 times for 30 arrows
       - Distribute to archers (15 each)
       - Total arrows now: 70+ (40 from Phase 1 + 30 now)
       - Chat: "Ammunition reinforced: 30 arrows added. Total: 70+!"

  📦 HOW TO DISTRIBUTE ENHANCED EQUIPMENT (Round 28):
    - DefenderGuard1: Gold Ring (equip)
    - DefenderGuard2: Gold Ring (equip)
    - DefenderArcher1: Silver Ring (equip), 15 arrows
    - DefenderArcher2: Silver Ring (equip), 15 arrows
    - DefenderCommander: Silver Ring (equip), Axe (equip)
    - DefenderMedic: Silver Ring (equip), Axe (backup)
    - DefenderSmith: Silver Ring (equip), Axe (equip)
    - All agents use equip_item and verify_inventory
    - Chat: "Agent X: Enhanced equipment equipped. Defense: +[ring], Weapon: [weapon]. READY!"
    - DefenderCommander: "Reinforcement complete! All defenders upgraded for Wave 2!"

  ⏱️ TIME ALLOCATION:
    - Rounds 19-20: Recovery and assessment
    - Rounds 21-24: Gather reinforcement materials
    - Rounds 25-27: Craft enhanced equipment
    - Round 28: Distribute equipment, prepare for Wave 2

  ═══════════════════════════════════════════════════════════════
  PHASE 4 - SECOND WAVE: SKELETON INVASION (Rounds 29-36)
  ═══════════════════════════════════════════════════════════════

  🎯 Objectives:
    - Return to fortress formation
    - Detect and engage skeleton wave (Level 18-25)
    - Defeat 2-3 skeletons using enhanced equipment
    - Maintain formation discipline
    - Manage healing resources carefully
    - Prepare for final preparation phase

  💀 HOW TO ENGAGE SECOND WAVE (Enhanced Tactics):

    Round 29: Return to Formation
    - All defenders return to fortress positions
    - Verify formation (same as Phase 1)
    - ALL agents verify_inventory for HP check
    - Requirement: ALL HP = 100% before wave engagement
    - Use healing items if needed to reach full HP
    - Chat: "Formation restored. All agents 100% HP. Awaiting Wave 2."

    Round 30: Detection
    - DefenderCommander: observe_environment radius=64
    - Skeletons spawn from dark areas (around 200, 100)
    - Approach fortress from north/northwest
    - Level 18-25 (MUCH tougher than goblins!)
    - Chat: "WAVE 2 DETECTED! Skeletons at (X,Y). Level: 18-25. Count: 2-3. STEEL YOURSELVES!"

    Rounds 31-32: First Skeleton Engagement
    - CRITICAL: ALL agents must attack SAME skeleton
    - Skeletons have high HP and defense
    - Pre-combat: DefenderCommander: "Ready check. All agents HP: 100%? Confirm."
    - Each agent confirms ready
    - DefenderCommander: "ENGAGE SKELETON 1! Focus fire! Target: [instance]"
    - Attack sequence (ALL agents attack same target):
      * All 7 agents use: attack_mob targetInstance=<skeleton1>
    - Battle takes 1-2 rounds (skeletons are tough!)
    - Post-combat: Check all agent HP
    - If any agent below 75%, use healing items immediately
    - Chat: "Skeleton 1 defeated! Team HP: [list all]. Healing if needed."

    Rounds 33-34: Second Skeleton Engagement
    - Heal any injured agents to 85%+ before engaging next
    - DefenderCommander: "Healing check. All above 85%? Proceeding."
    - Engage second skeleton with same tactics
    - ALL agents focus fire same target
    - Post-combat healing if needed
    - Chat: "Skeleton 2 down! Wave 2: 2/3 defeated. Status check."

    Rounds 35-36: Final Skeleton Engagement and Recovery
    - Third skeleton engagement (if 3 skeletons)
    - Same focused attack tactics
    - Post-combat: MAJOR recovery phase
    - All agents heal to 90%+ HP
    - Distribute healing items from reserves
    - Collect loot from skeletons
    - DefenderCommander: "WAVE 2 SURVIVED! Casualties: NONE. All defenders intact!"
    - "Healing status: All agents > 90% HP. Remaining healing items: X"
    - "Preparing for final equipment phase before ultimate waves!"

  ⏱️ TIME ALLOCATION:
    - Round 29: Return to formation, heal to 100%
    - Round 30: Wave detection and readiness
    - Rounds 31-36: Combat with 3 skeletons (2 rounds each)

