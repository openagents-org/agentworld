  PHASE 6 - THIRD WAVE: OGRE SIEGE (Rounds 45-48)
  ═══════════════════════════════════════════════════════════════

  🎯 Objectives:
    - Engage ogre wave (Level 28-35)
    - Maintain formation against heavy assault
    - Defeat 1-2 ogres using elite equipment
    - Manage healing carefully (Wave 4 still coming!)
    - Demonstrate mastery of siege defense tactics

  👹 HOW TO ENGAGE THIRD WAVE (Elite Defense):

    Round 45: Detection and Ultimate Ready Check
    - DefenderCommander: observe_environment radius=64
    - Ogres approach from mountains (around 230, 38)
    - Level 28-35 (EXTREMELY tough, high HP/defense!)
    - Chat: "WAVE 3 DETECTED! Ogre siege incoming! Level: 28-35. Count: 1-2."
    - "This is our greatest test before the final wave. HOLD THE LINE!"
    - ALL agents verify_inventory:
      * HP must be 100%
      * Each agent must have 12+ healing items
      * All equipment verified
    - Each agent reports: "Agent X: HP 100%, Healing: Y items, Equipment: [list]. READY FOR GLORY!"

    Round 46: First Ogre Engagement
    - CRITICAL: Ogres do MASSIVE damage
    - Absolute coordination required
    - DefenderCommander: "ALL AGENTS! FOCUS FIRE OGRE 1! MAXIMUM DAMAGE!"
    - Attack sequence (ALL 7 agents attack same ogre):
      * DefenderGuard1: attack_mob targetInstance=<ogre1>
      * DefenderGuard2: attack_mob targetInstance=<ogre1>
      * DefenderArcher1: attack_mob targetInstance=<ogre1>
      * DefenderArcher2: attack_mob targetInstance=<ogre1>
      * DefenderCommander: attack_mob targetInstance=<ogre1>
      * DefenderMedic: attack_mob targetInstance=<ogre1>
      * DefenderSmith: attack_mob targetInstance=<ogre1>
    - Battle takes 2-3 rounds (ogres are tanky!)
    - After combat, IMMEDIATELY check HP status
    - Heal any agent below 80% to full HP
    - Chat: "Ogre 1 defeated! Team HP: [full status list]"

    Round 47-48: Second Ogre Engagement (if 2 ogres) or Recovery
    - If 2 ogres:
      * Heal all agents to 90%+ before engaging
      * Repeat focused attack tactics
      * Post-combat: Heal to 85%+
    - If only 1 ogre:
      * Use rounds 47-48 for major recovery
      * Heal ALL agents to 100%
      * Redistribute remaining healing items
      * Prepare mentally for Wave 4
    - DefenderCommander: "WAVE 3 SURVIVED! Ogre siege repelled!"
    - "Casualties: NONE! All defenders standing!"
    - "Healing status: All agents > 85% HP. Healing items: X remaining."
    - "FINAL WAVE INCOMING! Death Knight assault! THIS IS IT!"

  ⏱️ TIME ALLOCATION:
    - Round 45: Detection and ultimate ready check
    - Rounds 46-48: Ogre combat and recovery (2-3 rounds)

