  ═══════════════════════════════════════════════════════════════
  SIEGE DEFENSE COORDINATION PRINCIPLES
  ═══════════════════════════════════════════════════════════════

  💬 COMMUNICATION REQUIREMENTS:
  - DefenderCommander directs all operations via chat
  - All defenders report status before each wave
  - Constant formation discipline reminders
  - Motivational speeches before difficult waves
  - Celebration of victories to maintain morale
  - Clear and immediate damage reports post-combat

  🤝 TACTICAL COORDINATION:
  - Maintain formation at ALL times (position discipline critical)
  - Focus fire = all agents attack same target always
  - Healing priority: Frontline > Ranged > Support
  - Never engage wave if team HP < 85%
  - Equipment upgrades between waves MANDATORY
  - Preparation phases as important as combat phases

  📊 PROGRESSIVE DIFFICULTY SCALING:
  - Wave 1 (Goblins 10-15): Tutorial difficulty, basic tactics
  - Wave 2 (Skeletons 18-25): Moderate challenge, need enhanced equipment
  - Wave 3 (Ogres 28-35): Hard difficulty, elite equipment required
  - Wave 4 (Death Knight 35-42): Ultimate challenge, perfect execution

  🚨 COMPLETION REQUIREMENTS - STRICT 7-PHASE SIEGE:

  DO NOT use complete() until ALL requirements met:

  PHASE COMPLETION CHECKLIST:
  ✓ Phase 1: Fortress prepared (equipment crafted, formation established)
  ✓ Phase 2: Wave 1 defeated (Goblins repelled, all defenders survived)
  ✓ Phase 3: Reinforcement completed (enhanced equipment, supplies restocked)
  ✓ Phase 4: Wave 2 defeated (Skeletons eliminated, formation held)
  ✓ Phase 5: Final preparation (elite equipment, maximum supplies)
  ✓ Phase 6: Wave 3 defeated (Ogre siege survived)
  ✓ Phase 7: Wave 4 defeated (Death Knight destroyed, fortress defended!)
  ✓ All 4 waves defeated in proper sequence
  ✓ All 7 defenders survived with HP > 0
  ✓ Completed in 50-52 rounds (preparation phases NOT skipped!)

  MINIMUM ACCEPTABLE COMPLETION (If Issues):
  ✓ At least 6 phases completed
  ✓ At least 3 waves defeated (must include Wave 1, 2, and 3 or 4)
  ✓ At least 6 defenders survived
  ✓ Equipment progression demonstrated (basic → enhanced → elite)
  ✓ Siege takes 45+ rounds minimum

  ⚠️ CRITICAL: DO NOT RUSH TO COMPLETION!
  - Preparation phases are MANDATORY for success
  - Each wave requires proper equipment for tier
  - Skipping reinforcement phases = likely failure on later waves
  - Completing in 25 rounds = FAILURE (no progressive difficulty demonstrated)

  VERIFICATION PROCESS (Round 52):
  ✓ DefenderCommander: "Siege summary: 4/4 waves defeated. All defenders survived."
  ✓ Each defender: "Agent X: Final HP Y/Z. Equipment: [list]. Fortress defended!"
  ✓ Wave victory log: "Goblins ✓, Skeletons ✓, Ogres ✓, Death Knight ✓"
  ✓ Equipment evolution: "Phase 1 [basic] → Phase 3 [enhanced] → Phase 5 [elite]"
  ✓ Zero casualties: "7/7 defenders standing. TOTAL VICTORY!"

  THEN DefenderCommander calls complete() with full siege summary

