success_criteria:
  - "Construction Corps successfully gathers 100+ logs from oak forest operations"
  - "Stone Mason successfully mines 50+ ironore and 50+ coal"
  - "Smelting Master successfully smelts 50+ ironbar"
  - "Armory Division crafts 5+ heavy swords for defenders"
  - "Armory Division crafts 3+ axes and 2+ pickaxes"
  - "Archery Corps produces 50+ arrows from gathered materials"
  - "Archery Corps crafts 2+ wooden bows"
  - "Defense Battalion receives complete equipment loadout"
  - "All defenders equipped with weapons, armor, and 25+ healing items"
  - "Team stockpiles 100+ total healing items for fortress"
  - "Defense drill successfully executed with coordinated tactics"
  - "All five teams communicate effectively throughout all phases"
  - "Materials transferred efficiently between teams"
  - "Commander demonstrates tactical coordination in Phase 4"
  - "Fortress defense system fully operational within 55 rounds"
