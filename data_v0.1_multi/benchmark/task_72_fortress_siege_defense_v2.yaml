# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Extended 9-agent 6-wave defense campaign

task:
  name: "Fortress Siege Defense - Ultimate Defense Campaign"
  description: "Nine defenders prepare fortifications and withstand 6 waves of increasingly difficult enemy assaults"

# Task objectives
objectives:
  primary: "Defend a fortress against 6 progressive enemy waves over 65 rounds with preparation phases between each assault"
  secondary:
    - "Phase 1 (Rounds 1-10): Fortress Preparation - Build defenses and craft siege equipment"
    - "Phase 2 (Rounds 11-18): Wave 1 - Repel Goblin scout assault (Level 10-15)"
    - "Phase 3 (Rounds 19-26): Reinforcement 1 - Upgrade defenses"
    - "Phase 4 (Rounds 27-34): Wave 2 - Survive Skeleton invasion (Level 18-25)"
    - "Phase 5 (Rounds 35-42): Reinforcement 2 - Craft elite equipment"
    - "Phase 6 (Rounds 43-48): Wave 3 - Defeat Ogre siege (Level 28-35)"
    - "Phase 7 (Rounds 49-54): Final Preparation - Maximum readiness"
    - "Phase 8 (Rounds 55-58): Wave 4 - Survive Spectre assault (Level 35-40)"
    - "Phase 9 (Rounds 59-62): Wave 5 - Defeat Ogre Lord (Level 40-45)"
    - "Phase 10 (Rounds 63-65): Wave 6 - Survive Death Knight final assault (Level 45-50)"

# Relevant game context
relevant_game_context: |
  DEFENSE OVERVIEW
  - Nine defenders must hold the fortress at (~355,305) through six escalating waves with preparation breaks between phases.

  PHASE QUICK GUIDE
  1. R1-10 Setup: assign roles (3 frontline, 2 ranged, 1 support, 2 smiths, 1 commander), gather logs/ore/coal, craft heavy swords, bows, pickaxes, arrows, stock ~80 heals.
  2. R11-18 Wave 1 (Goblins L10-15): verify HP, focus-fire each goblin. Heal to >=90% afterward.
  3. R19-26 Reinforcement 1: gather extra materials, craft axes, silver rings, more arrows.
  4. R27-34 Wave 2 (Skeletons L18-25): return to formation at full HP, burn down each skeleton.
  5. R35-42 Reinforcement 2: mine gold, craft golden gear, stock heals to 100+.
  6. R43-48 Wave 3 (Ogres L28-35): same tactics, announce knockbacks, support heals instantly.
  7. R49-54 Final prep: maximize all equipment, healing to 120+.
  8. R55-58 Wave 4 (Spectres L35-40): maintain formation, coordinate attacks.
  9. R59-62 Wave 5 (Ogre Lord L40-45): focus-fire boss, all defenders support.
  10. R63-65 Wave 6 (Death Knight L45-50): full HP, best gear, call out ability timings.

  EXECUTION NOTES
  - After every transfer/craft, run verify_inventory.
  - Keep formation references in chat.
# Limitations
max_action_steps: 65

