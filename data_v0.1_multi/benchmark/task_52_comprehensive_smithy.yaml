# AgentWorld Multi-Agent Task Configuration

task:
  name: "Comprehensive Smithy Operations - Five-Smith Complete Metalworking Pipeline"
  description: "Five specialized smiths work together to establish a complete metalworking operation from raw ore extraction through advanced equipment production and distribution"

# Task objectives
objectives:
  primary: "Establish a comprehensive five-smith metalworking operation producing complete equipment sets for entire team"
  secondary: # checkpoints
    - "Coordinate five-smith specialization and role assignment"
    - "Execute complete ore-to-equipment production pipeline"
    - "Produce diverse equipment types: tools, weapons, and accessories"
    - "Distribute complete equipment sets to all team members within 35 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  OVERVIEW
  - Five smiths split the ore→bar→equipment pipeline. MasterMiner feeds ores, SmeltingMaster turns them into bars, ToolForge builds pickaxes/axes, WeaponForge crafts heavy swords, JewelryArtisan handles rings. Target output in 35 rounds: 2 pickaxes, 2 axes, 2 sword2, and 4 rings (silver or gold).

  FLOW BY ROLE
  1. MasterMiner (230,38): harvest_resource iron/coal (≥15 each) plus optional gold, reporting totals in chat. When ready, travel to the smelter’s hut (260,184) and transfer the entire haul.
  2. SmeltingMaster: craft_item(Smelting, ironbar) until ~24 bars exist; smelt goldbar if ore arrived. Hand out bars in batches: 10→ToolForge, 6 more→ToolForge after pickaxes, 4→WeaponForge, 4→JewelryArtisan (+gold bars if available).
  3. ToolForge: gather a few logs, craft two pickaxes (5 bars + log each) then two axes (3 bars + log each). Confirm outputs before requesting more bars.
  4. WeaponForge: already has two hilt2; combine with 4 ironbars to forge two sword2.
  5. JewelryArtisan: turn 4 ironbars into two silverrings, plus optional goldrings if gold bars arrived. Extra bars can become more silverrings to reach four total.

  COORDINATION NOTES
  - Transfers must occur within ~10 tiles using transfer_items; both sides run verify_inventory and acknowledge via chat.
  - Every craft or smelt should be announced (“SmeltingMaster: iron bars 6/24”). Keep a running checklist of produced items so all divisions know when they are done.
  - If gold ore is missing, state it early and substitute the jewelry quota with additional silverrings.

  COMPLETION CHECK
  - Inventory review shows: 2 pickaxes, 2 axes, 2 sword2, and ≥4 rings. Each role states “Division complete – holding X”.
  - Final chat message summarizes total equipment before any agent calls complete().
# Limitations
max_action_steps: 35

