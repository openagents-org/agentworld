# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Craft construction tools (pickaxe and axe)

task:
  name: "Construction Engineering - Tool Crafting"
  description: "Three agents gather materials and craft a pickaxe and axe for construction"

# Task objectives
objectives:
  primary: "Gather materials and craft 1x pickaxe and 1x axe"
  secondary: # checkpoints
    - "Coordinate mining, smelting, and crafting"
    - "Complete tool crafting within 30 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a construction tool production scenario.

  OBJECTIVE: Craft essential construction tools.

  MISSION REQUIREMENTS:
  - Mine iron ore and coal
  - Smelt iron bars
  - Gather logs for tool handles
  - Craft 1x pickaxe (5 ironbar + 1 logs)
  - Craft 1x axe (3 ironbar + 1 logs)

  TEAM COORDINATION:
  - Miner gathers iron ore and coal
  - Lumberjack gathers logs
  - Smith smelts and crafts tools

  CRAFTING RECIPES:
  🔥 Smelting - ironbar:
    - craft_item skill=Smelting itemKey=ironbar
    - Materials: 1x ironore + 1x coal → 1x ironbar
    - Need 8x ironbar total

  🔨 Smithing - pickaxe:
    - Materials: 5x ironbar + 1x logs → 1x pickaxe

  🔨 Smithing - axe:
    - Materials: 3x ironbar + 1x logs → 1x axe

  DO NOT use complete() until tools are crafted!

# Limitations
max_action_steps: 30

