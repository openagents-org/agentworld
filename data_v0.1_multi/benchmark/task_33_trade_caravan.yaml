# AgentWorld Multi-Agent Task Configuration

task:
  name: "Trade Caravan Management - Multi-Region Commerce and Resource Exchange"
  description: "Three agents work together to establish trade routes, transport valuable goods, and manage commercial exchanges across multiple regions"

# Task objectives
objectives:
  primary: "Successfully establish multi-region trade operations, transport valuable goods safely, and complete profitable commercial exchanges"
  secondary: # checkpoints
    - "Establish secure trade route coordination and cargo management systems"
    - "Execute safe long-distance transportation and commercial negotiations"
    - "Complete profitable trade caravan operations within 35 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent commercial operation requiring logistics coordination and resource management.
  
  OBJECTIVE: Establish profitable trade routes, transport valuable goods safely, and manage commercial exchanges.
  
  MISSION REQUIREMENTS:
  - Transport valuable goods between Forest (150,50), Coastal (500,700), and Desert (800,300) regions
  - Manage cargo inventory and ensure safe transportation of trade goods
  - Complete profitable exchanges with different regional markets
  - Coordinate protection against bandits and environmental hazards during transport
  
  TEAM COORDINATION:
  - Use global chat to coordinate trade route timing and cargo status
  - Coordinate between cargo management, route security, and commercial negotiations
  - Share transportation duties and provide escort protection for valuable goods
  - Work together to optimize trade efficiency and profit margins
  
  GENERAL STRATEGY:
  - The team needs to coordinate complex multi-region logistics operations
  - Long-distance transportation requires careful route planning and hazard management
  - Different regions have varying supply and demand for specific trade goods
  - Cargo protection requires combat readiness and strategic escort coordination
  - Balance transportation speed with cargo security and profit optimization
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  TRADE CARAVAN OPERATIONS (CRITICAL KNOWLEDGE):
  📦 Cargo Management:
    - Coordinate inventory space for maximum cargo capacity
    - Balance valuable goods with essential supplies for long journeys
    - Track cargo values and regional price differences
    - Manage weight limits and transportation efficiency
  
  🛣️ Route Planning:
    - Plan efficient paths between Forest (150,50), Coastal (500,700), Desert (800,300)
    - Account for environmental hazards and travel time between regions
    - Coordinate rest stops and resupply points during long journeys
    - Use warp points and fast travel when available and safe
  
  💰 Trade Goods (High Value Items):
    - Forest Region: Wood products, herbs, leather goods
    - Coastal Region: Fish, pearls, maritime equipment
    - Desert Region: Gems, metals, exotic spices
    - Transport goods from surplus regions to demand regions
  
  ⚔️ Caravan Security:
    - Maintain combat readiness for bandit encounters during transport
    - Coordinate escort positions and protective formations
    - Use defensive equipment and protective magic during vulnerable transport
    - Plan emergency procedures for cargo protection
  
  🏪 Commercial Exchange:
    - Negotiate favorable trade terms in each regional market
    - Maximize profit margins through strategic buying and selling
    - Build relationships with regional traders for future operations
    - Document successful trade patterns for operational optimization

# Limitations
max_action_steps: 35

