# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cooperative Topaz Ring Crafting - Luxury Jewelry"
  description: "Three agents work together to create a topaz ring through precious gem mining, gold smelting, and luxury jewelry crafting"

# Task objectives
objectives:
  primary: "Create a topaz ring by combining topaz gem with gold ring base"
  secondary: # checkpoints
    - "Coordinate precious gem mining and gold metallurgy"
    - "Execute luxury material transfers with high value items"
    - "Complete premium jewelry crafting within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent luxury jewelry scenario requiring precious materials.
  
  CRITICAL SUCCESS REQUIREMENTS:
  1. gem_miner_agent MUST find and mine topaz deposits (moderate-level mining)
  2. gold_smith_agent MUST create gold ring base from gold materials
  3. luxury_jeweler_agent MUST combine topaz + gold ring into topaz ring
  4. luxury_jeweler_agent MUST equip the ring and declare completion
  
  LOCATION STRATEGY:
  - Look for topaz deposits in mid-level mining areas
  - Find gold ore for luxury ring base creation
  - Premium jewelry crafting location for final assembly
  - Communicate precious resource locations through global chat
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  💎 Mining - topaz:
    - harvest_resource on topaz deposits to get topaz
    - Level required: 15+ (Mining skill) - MID LEVEL
  
  🟨 Smelting Recipe - goldbar:
    - craft_item skill=Smelting itemKey=goldbar
    - Materials: 1x goldore + 1x coal → 1x goldbar
    - Level required: 20 (uses Smithing skill level)
  
  🟨 Smithing Recipe - goldring:
    - craft_item skill=Smithing itemKey=goldring
    - Materials: 2x goldbar → 1x goldring
    - Level required: 1 (Smithing skill)
  
  💍 Crafting Recipe - topaz ring:
    - craft_item skill=Crafting itemKey=topazring
    - Materials: 1x topaz + 1x goldring → 1x topaz ring
    - Level required: 5 (Crafting skill)

# Limitations
max_action_steps: 25

# Agent configurations
agent_1:
  username: "gem_miner_agent"
  new_character: true
  role: "Topaz Gem Miner"
  
  location:
    x: 745
    y: 579
  
  skill_levels:
    mining: 30        # Required for topaz mining (level 15+)
    strength: 30
    health: 25
  
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "pickaxe"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Topaz gem miner responsible for precious gem extraction
    
    💎 CRITICAL TOPAZ MINING MISSION - EXTRACT TOPAZ GEMS!
    
    ABSOLUTE PRIORITIES:
    1. Find topaz deposits in mid-level mining areas
    2. Mine topaz gem for luxury ring crafting
    3. Secure at least 1x topaz for ring production
    4. Transfer topaz to luxury_jeweler_agent safely
    
    TOPAZ MINING STRATEGY:
    1. observe_environment to search for topaz deposits
    2. Look for "topaz" deposit instances (level 15 requirement)
    3. If not visible, move to mid-level mining areas:
       - move_character(x=350, y=550) for gem-rich mountain area
       - move_character(x=450, y=450) for precious stone area
       - move_character(x=500, y=600) for topaz mining zone
    4. harvest_resource on topaz deposit instances to get topaz
    5. Check inventory after each mining attempt
    6. Use global chat every 2-3 actions to report topaz search progress
    7. Once you secure 1x topaz, immediately coordinate with luxury_jeweler_agent
    8. Move to secure meetup location for topaz transfer
    9. transfer_items to give topaz to luxury_jeweler_agent (PRECIOUS!)
    10. Wait for luxury_jeweler_agent to confirm topaz receipt
    11. Support team until topaz ring is complete
    
    TOPAZ MINING REQUIREMENTS:
    - Mining skill level 15+ (you have 30) ✅
    - Mid-level gem mining capability
    - Careful handling of precious stones
    - Secure transfer procedures
    
    ERROR PREVENTION:
    - Verify mining skill meets topaz requirements
    - Check inventory carefully after mining attempts
    - Handle topaz transfer with care - VALUABLE GEM
    - REMEMBER: Topaz is precious - handle accordingly!

agent_2:
  username: "gold_smith_agent"
  new_character: true
  role: "Gold Ring Smith"
  
  location:
    x: 250
    y: 350
  
  skill_levels:
    smithing: 25      # For gold ring creation
    mining: 20        # For gold ore extraction
    strength: 25
    health: 25
  
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
    - item: "goldore"
      count: 2
    - item: "coal"
      count: 2
  
  equipped_items:
    - item: "pickaxe"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Gold smith responsible for creating luxury gold ring base
    
    🟨 CRITICAL GOLD SMITHING MISSION - CREATE GOLD RING BASE!
    
    ABSOLUTE PRIORITIES:
    1. Smelt gold ore and coal into gold bars
    2. Forge gold bars into gold ring base
    3. Transfer gold ring to luxury_jeweler_agent
    4. Support topaz ring assembly process
    
    GOLD SMITHING STRATEGY:
    1. observe_environment to verify starting materials (goldore, coal)
    2. Smelt gold materials into gold bars:
       📋 SMELTING: craft_item skill=Smelting itemKey=goldbar (1x goldore + 1x coal → 1x goldbar)
    3. Repeat smelting to create 2x goldbar total
    4. Forge gold ring base:
       📋 SMITHING: craft_item skill=Smithing itemKey=goldring (2x goldbar → 1x goldring)
    5. observe_environment to verify gold ring created
    6. Use global chat to report gold ring completion
    7. Coordinate with luxury_jeweler_agent for ring base transfer
    8. Move to agreed meetup location
    9. transfer_items to give gold ring to luxury_jeweler_agent
    10. Wait for luxury_jeweler_agent to confirm receipt
    11. Support team until topaz ring assembly is complete
    
    GOLD PRODUCTION REQUIREMENTS:
    - 2x goldore + 2x coal (you start with these)
    - Smithing skill level 1+ for ring (you have 25)
    - Precision crafting for luxury base
    
    ERROR PREVENTION:
    - Verify each gold smelting operation success
    - Check inventory after each crafting step
    - Handle gold ring transfer carefully - VALUABLE
    - Coordinate timing with gem miner progress

agent_3:
  username: "luxury_jeweler_agent"
  new_character: true
  role: "Luxury Jewelry Master"
  
  location:
    x: 749
    y: 621
  
  skill_levels:
    crafting: 25      # Required for topaz ring assembly (level 5+)
    smithing: 15      # Luxury metalwork knowledge
    mining: 10        # Gem knowledge
    strength: 20
    health: 25
  
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Luxury jewelry master responsible for topaz ring assembly
    
    💍 PRIORITY ACTIONS:
    1. Coordinate with both gem_miner_agent and gold_smith_agent
    2. Collect topaz and gold ring components
    3. Assemble topaz ring with luxury crafting techniques
    4. Final quality control and luxury ring equipping
    
    LUXURY JEWELRY COORDINATION:
    1. send global chat message announcing luxury jewelry assembly readiness
    2. Monitor progress from both gem_miner_agent and gold_smith_agent
    3. Coordinate material collection from both agents
    4. First collect gold ring from gold_smith_agent
    5. Then collect topaz from gem_miner_agent (HANDLE WITH EXTREME CARE!)
    6. Verify both luxury components before assembly
    
    CRITICAL LUXURY ASSEMBLY STEPS:
    7. observe_environment to CHECK YOUR INVENTORY before crafting
    8. VERIFY you have BOTH 1x topaz AND 1x goldring
    9. ONLY AFTER verifying materials, use craft_item:
       📋 RECIPE: craft_item skill=Crafting itemKey=topazring (1x topaz + 1x goldring → 1x topaz ring)
    10. WAIT for craft_item result - confirm "Successfully crafted" message
    11. observe_environment to verify topaz ring in inventory
    12. equip_item to equip the topaz ring
    13. observe_environment to verify ring is equipped
    14. Use global chat to declare "Luxury topaz ring crafted and equipped successfully!"
    15. complete() ONLY after successful ring creation and equipping
    
    LUXURY COMPONENT REQUIREMENTS:
    ✅ 1x topaz (from gem_miner_agent) - PRECIOUS GEM
    ✅ 1x goldring (from gold_smith_agent) - GOLD BASE
    ✅ Crafting skill level 5+ (you have level 25)
    
    ERROR PREVENTION:
    - Handle topaz with extreme care - IRREPLACEABLE PRECIOUS GEM
    - Verify all luxury transfers completed successfully
    - Double-check inventory before luxury crafting
    - Coordinate timing carefully with both agents

# Success criteria for multi-agent task
success_criteria:
  - "gem_miner_agent successfully mines and transfers topaz"
  - "gold_smith_agent successfully creates and transfers gold ring base"
  - "luxury_jeweler_agent receives both components and crafts topaz ring"
  - "luxury_jeweler_agent successfully equips the topaz ring"
  - "All agents handle precious materials with appropriate luxury care"
  - "Premium jewelry production completes within time limit"
