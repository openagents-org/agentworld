  Underground Mining Expedition: COMPLETE ✓
  Central Smeltery now fully operational with complete metallurgy capabilities!"

  🚨 CRITICAL COMPLETION REQUIREMENTS:

  DO NOT use complete() unless ALL verified:
  ✓ 75+ ores mined (25 iron, 20 gold, 30 coal minimum)
  ✓ 45+ bars smelted (25 iron, 20 gold minimum)
  ✓ 10+ items crafted (tools, weapons, jewelry)
  ✓ All mining teams participated in extraction
  ✓ Perfect ore transportation and consolidation
  ✓ Expedition completed in 50-52 rounds

  ⚠️ DEADLOCK PREVENTION:

  1. **Ore Depletion**: If ores not sufficient
     - Mountains have abundant ores
     - Move to different mountain locations
     - Rocks respawn after time
     - Use observe_environment radius=32-64

  2. **Travel Issues**: If agents can't reach smeltery
     - Calculate moves: 450 / 32 = 15 moves
     - Start travel at Round 16
     - Travel as convoy for safety
     - Chat positions frequently

  3. **Missing Materials**: If lack hilts or logs
     - Check all starting inventories
     - Some miners may start with logs
     - Can adapt: craft more rings instead of swords
     - Logs from mining agents who have them

  4. **Smelting Volume**: If 45 bars seems daunting
     - Master_Smelter has 15 rounds (29-43)
     - Can smelt 3-4 per round
     - 15 rounds × 3 = 45 bars achievable!
     - Focus and consistency required

  📡 COMMUNICATION PROTOCOL:

  - Miners: Report every 5 ores collected
  - Convoy: Report position every 2 moves
  - Smelter: Report every 5 bars smelted
  - Metalsmith: Report each item crafted
  - Use format: "[Role]: [Status] X/Y"
  - Minimum: Every 3-4 rounds

  🎯 SUCCESS METRICS:

  Primary:
  ✓ 10+ metal items crafted

  Secondary:
  ✓ 75+ ores mined
  ✓ 45+ bars smelted
  ✓ Completed in 50-52 rounds

  Tertiary:
  ✓ Perfect mining coordination
  ✓ Efficient smelting operations
  ✓ Diverse item creation

