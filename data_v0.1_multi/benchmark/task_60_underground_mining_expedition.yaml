  EXPEDITION STATISTICS:
  ═══════════════════════════════════════════════════════════
  - Total rounds: 52
  - Total ores extracted: 75
  - Total bars smelted: 45
  - Total items crafted: 10
  - Mining agents: 5
  - Processing agents: 2
  - Distance traveled: 2,500+ tiles (all agents)
  - Regions covered: Northern Mountains, Central Plains
  - Failed actions: 0
