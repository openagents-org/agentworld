# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Extended 12-agent quad-shrine stabilization

task:
  name: "Elemental Nexus Stabilization - Grand Quad-Shrine Containment"
  description: "Twelve elemental specialists gather rare resources, craft pylons, and defend four shrines to seal planar rifts within 65 rounds"

# Task objectives
objectives:
  primary: "Stabilize the Ice, Stone, Tidal, and Desert conduits by supplying each shrine with its catalyst set and defeating their guardians"
  secondary:
    - "Phase 1 (Rounds 1-12): Meet at Magical Nexus, assign four squads, audit tools"
    - "Phase 2 (Rounds 13-28): Harvest elemental materials from four biomes"
    - "Phase 3 (Rounds 29-42): Craft 30 iron bars, 8 pickaxes, 8 silver rings, four elemental staffs"
    - "Phase 4 (Rounds 43-55): Deploy to all four shrines and activate pylons"
    - "Phase 5 (Rounds 56-65): Re-sync at Nexus, verify conduit inventories"

# Relevant game context
relevant_game_context: |
  MISSION OUTLINE
  - Twelve specialists seal four elemental shrines within 65 rounds.
  - Shrines: Ice (259,151), Stone (238,48), Tidal (197,633), Desert (720,150).
  - Phase 1: meet at nexus, assign Ice/Stone/Tidal/Desert squads (3 agents each).
  - Phase 2: each squad harvests their biome materials.
  - Phase 3: smelt 30+ iron bars, forge tools and rings, craft four elemental staffs.
  - Phase 4: deploy squads to shrines, defeat guardians, activate pylons.
  - Phase 5: regroup at nexus for final verification.

  EXECUTION NOTES
  - Each squad must carry its catalyst kit before leaving the nexus.
  - Transfers require both sides to verify_inventory.
# Limitations
max_action_steps: 65

