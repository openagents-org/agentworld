# AgentWorld Multi-Agent Task Configuration

task:
  name: "Ancient Ruins Exploration - Archaeological Treasure Discovery"
  description: "Three agents work together to explore dangerous ancient ruins, defeat guardian creatures, and recover legendary artifacts"

# Task objectives
objectives:
  primary: "Successfully explore ancient ruins, defeat Golden Golem and Big Baby Spooder, and recover ancient treasures"
  secondary: # checkpoints
    - "Establish ruins exploration coordination and creature threat assessment"
    - "Execute safe artifact recovery and guardian combat operations"
    - "Complete archaeological expedition within 35 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent archaeological expedition requiring advanced combat and exploration coordination.
  
  OBJECTIVE: Explore dangerous ancient ruins to defeat guardian creatures and recover legendary artifacts.
  
  MISSION REQUIREMENTS:
  - Navigate to Ancient Ruins region (Region 7-6: coordinates 769-784, 657-676)
  - Defeat Golden Golem (Level 0) and Big Baby Spooder (Level 45) guardian creatures
  - Explore ruins architecture and locate hidden treasure chambers
  - Recover ancient artifacts and archaeological treasures from ruins
  
  TEAM COORDINATION:
  - Use global chat to share ruins entrance locations and guardian creature positions
  - Coordinate between exploration, combat, and treasure recovery operations
  - Share combat responsibilities based on creature threat levels
  - Work together to solve ruins puzzles and navigate ancient architecture
  
  GENERAL STRATEGY:
  - The team needs to locate Ancient Ruins region in the southeastern area
  - Combat coordination essential for defeating both guardian creatures
  - Golden Golem may be easier (Level 0) but could have special mechanics
  - Big Baby Spooder (Level 45) requires coordinated high-level combat
  - Balance exploration speed with thorough treasure searching
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  ANCIENT RUINS EXPLORATION & COMBAT (CRITICAL KNOWLEDGE):
  🏛️ Ruins Navigation:
    - Use move_to action to reach Ancient Ruins region (coordinates ~775, 665)
    - Ancient Ruins biome contains unique architecture and hidden passages
    - Look for stone structures, ancient pillars, and weathered monuments
  
  🥇 Combat - Golden Golem:
    - Use observe_environment to locate Golden Golem at coordinates (784, 676)
    - Despite Level 0, may have special defensive properties or mechanics
    - Coordinate physical attacks and magic to test weaknesses
    - Expect unique combat patterns from ancient guardian creature
  
  🕷️ Combat - Big Baby Spooder:
    - Use observe_environment to locate Big Baby Spooder at coordinates (769, 657)
    - Level 45 creature requiring coordinated high-level combat
    - Expect web attacks, poison damage, and high mobility
    - Use ranged attacks and positioning to avoid spider abilities
  
  💎 Treasure Recovery:
    - Use observe_environment to locate treasure chests and artifact locations
    - Ancient ruins may contain multiple hidden treasure chambers
    - Look for archaeological artifacts, ancient weapons, and rare materials
    - Some treasures may be protected by additional puzzles or mechanisms
  
  🏺 Archaeological Exploration:
    - Explore thoroughly for hidden passages and secret chambers
    - Ancient ruins architecture may contain clues to treasure locations
    - Document findings through global chat for team coordination

