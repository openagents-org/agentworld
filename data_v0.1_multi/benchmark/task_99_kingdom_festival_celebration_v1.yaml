# VARIANT: Easy version - reduced targets and more time

task:
  name: "Kingdom Festival Celebration - Multi-Guild Coordination Spectacular (Easy)"
  description: "Twelve agents from different guilds coordinate to prepare a simplified kingdom festival, featuring combat exhibitions, culinary treats, and artisan showcases"

# Task objectives
objectives:
  primary: "Successfully prepare and execute kingdom festival with 3 exhibition arenas, 35+ prepared items, and coordinated performances within 70 rounds"
  secondary:
    - "Phase 1 (Rounds 1-18): Guild Assembly - Organize 3 guild teams and gather initial resources"
    - "Phase 2 (Rounds 19-36): Preparation Stage - Craft exhibition items and train performers"
    - "Phase 3 (Rounds 37-54): Arena Construction - Set up 3 festival exhibition areas"
    - "Phase 4 (Rounds 55-70): Grand Festival - Execute coordinated celebration and performances"

# Relevant game context (Hint)
relevant_game_context: |
  KINGDOM FESTIVAL CELEBRATION OVERVIEW (EASY MODE):

  Twelve guild members unite to create a simplified festival celebration.

  FESTIVAL STRUCTURE:

  WARRIORS GUILD (Agents 1-4) - Combat Exhibition Arena

  **Mission**: Prepare combat demonstrations and defeat exhibition monsters
  **Starting Location**: Various combat zones

  **Team Composition**:
  - Agent 1 (Champion Gladiator): Lead combat demonstrations
  - Agent 2 (Berserker Warrior): Power attack specialist
  - Agent 3 (Swift Duelist): Speed combat performer
  - Agent 4 (Combat Coordinator): Organize exhibition matches

  **Combat Exhibition Goals**:
  - Defeat 3+ different monster types for demonstrations
  - Gather 6+ combat trophies (mob drops)
  - Coordinate 2+ synchronized combat performances

  CULINARY GUILD (Agents 5-8) - Grand Feast Preparation

  **Mission**: Prepare 18+ gourmet dishes for festival feast
  **Starting Location**: Coastal (580, 750) and Forest regions

  **Team Composition**:
  - Agent 5 (Master Chef): Oversee all cooking operations
  - Agent 6 (Fishing Specialist): Catch 10+ seafood
  - Agent 7 (Game Hunter): Hunt 6+ meat items
  - Agent 8 (Feast Coordinator): Organize banquet setup

  **Feast Menu Goals** (18+ total dishes):
  - 6x cooked shrimp
  - 4x jellyfish smoothie
  - 4x cooked chicken
  - 4x cooked beef

  ARTISANS GUILD (Agents 9-12) - Craftsmanship Exhibition

  **Mission**: Create 12+ masterwork items for artisan showcase
  **Starting Location**: Mountain (230, 40) and crafting areas

  **Team Composition**:
  - Agent 9 (Smithing Grandmaster): Craft weapons and armor
  - Agent 10 (Mining Prodigy): Extract ores and minerals
  - Agent 11 (Jewelry Artisan): Create ornamental pieces
  - Agent 12 (Exhibition Curator): Organize artisan displays

  **Masterwork Goals** (12+ items):
  - 3x Heavy Swords
  - 2x Golden Rings
  - 3x Silver Rings
  - 4x Axes

  SUCCESS CRITERIA:
  1. Warriors Guild: Defeat 3+ different monster types
  2. Culinary Guild: Prepare 18+ cooked dishes
  3. Artisans Guild: Craft 12+ masterwork items
  4. Total Items: 35+ festival items (trophies + food + crafts)
  5. Exhibition Areas: 3 areas established and stocked
  6. Festival Completion: Within 70 rounds

# Limitations
max_action_steps: 70

