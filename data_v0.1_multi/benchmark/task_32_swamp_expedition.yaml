# AgentWorld Multi-Agent Task Configuration

task:
  name: "Swamp Expedition - Toxic Marsh Survival and Rare Herb Collection"
  description: "Three agents work together to survive dangerous toxic swamps, defeat marsh creatures, and collect rare alchemical herbs"

# Task objectives
objectives:
  primary: "Successfully navigate toxic swamplands, defeat Swamp Trolls, and harvest rare poisonous herbs for advanced alchemy"
  secondary: # checkpoints
    - "Establish toxic environment survival coordination and marsh navigation"
    - "Execute safe swamp creature combat and rare herb harvesting"
    - "Complete toxic marsh expedition within 32 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent toxic environment survival expedition requiring environmental resistance.
  
  OBJECTIVE: Survive dangerous toxic swamps, defeat powerful marsh creatures, and harvest rare alchemical materials.
  
  MISSION REQUIREMENTS:
  - Navigate to Swamp/Marsh region (Region 3-2: coordinates 400-450, 600-650)
  - Defeat multiple Swamp Trolls (Level 28) in coordinated combat
  - Harvest rare Poisonous Mushrooms and Swamp Herbs for alchemy
  - Survive continuous poison damage and toxic environmental effects
  
  TEAM COORDINATION:
  - Use global chat to share safe paths and creature locations in the marsh
  - Coordinate between poison resistance, combat, and resource harvesting
  - Share antidotes and provide mutual protection against toxic effects
  - Work together to navigate treacherous swamp terrain safely
  
  GENERAL STRATEGY:
  - The team needs to reach southern swamp regions while managing poison damage
  - Multiple Swamp Trolls (Level 28) require coordinated medium-level combat
  - Rare herbs are found only in the most toxic areas of the swamp
  - Toxic damage requires constant health management and antidote usage
  - Balance combat engagement with herb harvesting and poison survival
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  SWAMP SURVIVAL & COMBAT (CRITICAL KNOWLEDGE):
  ☠️ Environmental Hazards:
    - Poison overlay type causes continuous toxic damage
    - Use healing items and antidotes frequently to counter poison effects
    - Swamps have reduced movement speed and visibility
    - Coordinate movement carefully to avoid toxic pools
  
  🧌 Combat - Swamp Trolls:
    - Use observe_environment to locate Swamp Trolls at (425,625) and (435,640)
    - Level 28 creatures with poison attacks and regeneration abilities
    - Expect toxic breath attacks that cause lingering poison damage
    - Use fire-based weapons/magic to prevent regeneration
    - Coordinate burst damage to overcome troll healing
  
  🍄 Herbalism - Poisonous Materials:
    - harvest_resource on Poisonous Mushroom instances to get poisonmushroom
    - harvest_resource on Swamp Herb instances to get swampherb
    - Level required: 15+ (Herbalism skill)
    - RARE: Toxic plants only found in most dangerous swamp areas
  
  🧪 Poison Resistance:
    - Maintain high health levels to counter toxic damage
    - Use antidotes and healing potions regularly
    - Stay close to teammates for mutual support
    - Plan efficient routes to minimize poison exposure time
  
  ⚔️ Combat Strategy:
    - Use ranged attacks when possible to avoid poison melee damage
    - Coordinate healing rotations to maintain team health
    - Focus fire on one troll at a time to prevent regeneration
    - Use fire magic to counter troll healing abilities

# Limitations
max_action_steps: 32

