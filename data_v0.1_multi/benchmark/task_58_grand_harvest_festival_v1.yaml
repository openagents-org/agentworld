# AgentWorld Multi-Agent Task Configuration

task:
  name: "Grand Harvest Festival - Simplified 4-Agent Preparation"
  description: "Four agents coordinate to prepare for a festival by gathering ingredients, cooking dishes, and crafting decorations"

# Task objectives
objectives:
  primary: "Prepare and deliver a festival package: 3x cooked dishes, 2x decorative jewelry, and 30+ gathered resources to Central Festival Grounds"
  secondary:
    - "Phase 1 (Rounds 1-12): Resource Gathering Spree - Collect ingredients from multiple biomes"
    - "Phase 2 (Rounds 13-25): Culinary Production - Cook 3 different festival dishes"
    - "Phase 3 (Rounds 26-35): Decorative Crafting - Create festival decorations"
    - "Phase 4 (Rounds 36-42): Grand Festival Assembly - Deliver all items to festival grounds"

# Context and guidance for agents
relevant_game_context: |
  FESTIVAL SNAPSHOT
  - In 42 rounds four agents must gather 30+ raw ingredients, cook 3 dishes (tomato stew, corn stew, cooked chicken), craft 2 jewelry gifts (beryl pendant, silver ring), then deliver everything to the central grounds (528,384).

  ROLES & ROUTES
  - Forager (Agent 1) sweeps the western forest belt (~250,350) for tomatoes, corn, onions, mushrooms, fruit, beads/beryl; report totals every few items and walk east toward the hub once they hit ≈25 gathers.
  - Hunter (Agent 2) hunts low-level birds for chicken meat near (~350,250), before trekking west to the hub.
  - Hub duo (Agents 3-4) stay near (528,384) ready to receive transfers: Agent 3 cooks, Agent 4 crafts jewelry.

  PHASE FLOW
  1. R1-12 Gather: field teams farm materials in parallel; hub logs progress.
  2. R13-25 Deliver & Cook: all gatherers converge on the hub using ≤32-tile moves, transfer via transfer_items with verify_inventory confirmations, then Head_Chef cooks the three dishes back-to-back.
  3. R26-35 Craft Decor: Jeweler turns beryl+string into pendant and iron into ring.
  4. R36-42 Assembly: everyone states their final inventory, loads items for delivery, and one agent summarizes totals before complete().

  EXECUTION TIPS
  - Keep a running checklist in chat ("Veg 20/30", "Meat ready", "Jewelry 1/2").
# Limitations
max_action_steps: 42

