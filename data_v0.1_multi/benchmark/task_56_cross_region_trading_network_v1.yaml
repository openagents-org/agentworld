# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cross-Region Trading Network - Simplified 5-Agent Trade Route"
  description: "Five agents establish a trading network across different regions, gathering unique resources and consolidating them for crafting"

# Task objectives
objectives:
  primary: "Establish a cross-region trading network to gather resources from 4 different biomes and craft 2x Golden Rings, 1x Lightning Staff, and 1x Heavy Sword"
  secondary:
    - "Phase 1 (Rounds 1-12): Regional Resource Gathering - Each team gathers biome-specific resources"
    - "Phase 2 (Rounds 13-25): Cross-Region Travel & Trading - Consolidate materials with designated crafters"
    - "Phase 3 (Rounds 26-38): Collaborative Crafting - Create intermediate and final items"
    - "Phase 4 (Rounds 39-45): Final Assembly & Verification - Complete all crafting objectives"

# Context and guidance for agents
relevant_game_context: |
  GOAL SNAPSHOT
  - Five agents operate in three pods: Forest (logs), Mountain (gold ore + coal), and a central crafting duo. After gathering, everyone meets at (528,384) to smelt/craft: 2 gold rings, 1 lightning staff, and 1 heavy sword within ~45 rounds.

  PHASE OUTLINE
  1. R1-12 Gather
     • Forest agent harvests 10 logs and converts some to sticks if time permits.
     • Mountain pair mines ≥6 gold ore and ≥8 coal (iron can be added later if no bars exist).
  2. R13-25 Travel + Transfers
     • Pods hop ≤32 tiles per move toward the hub, posting coordinates after each hop.
     • Transfer order: Forest → Crafter_Magic (logs), Mountain → Crafter_Gold (ore/coal). Each transfer uses transfer_items with verify_inventory confirmations logged in chat.
  3. R26-38 Crafting
     • Crafter_Gold smelts goldbar (goldore+coal) then crafts 2 goldrings and, once ironbars exist, a sword2 (Heavy Sword).
     • Crafter_Magic turns logs into sticks, crafts 1 staff, then upgrades it with lightningbead into 1 lightningstaff.
  4. R39-45 Verification
     • Both crafters list their finished items, distribute them if desired, and summarize the campaign before calling complete().

  EXECUTION NOTES
  - When observe_environment is missing, sweep the listed coordinate bands manually and rely on harvest_resource/attack_entity success plus inventory checks for feedback.
  - Keep one chat thread for resource totals ("Forest logs 8/10", "Gold bars 3/4") so the hub knows when to expect deliveries.

  COMPLETION CHECKLIST
  - Verified inventories show: 2 goldrings, 1 lightningstaff, 1 heavy sword (or the iron + hilt needed if the sword was crafted last-minute).
  - Each pod states its final contribution via chat, then the designated leader calls complete() with a short phase summary.
# Limitations
max_action_steps: 45

