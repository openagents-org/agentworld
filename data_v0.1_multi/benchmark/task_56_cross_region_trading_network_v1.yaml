# Success criteria for multi-agent task
success_criteria:
  - "Phase 1: Forest agent gathers 10+ logs from Western Forest region"
  - "Phase 1: Mountain Team mines 6+ gold ore and 8+ coal from Northern Mountains"
  - "Phase 2: All teams travel to Central Hub (528, 384)"
  - "Phase 2: Teams execute sequential transfer protocol without deadlocks"
  - "Phase 2: Crafter_Gold receives 6 gold ore, 8 coal, maintains 1 hilt2"
  - "Phase 2: Crafter_Magic receives 10 logs, beads, 1 lightningbead"
  - "Phase 3: Crafter_Gold smelts 4+ gold bars from gold ore and coal"
  - "Phase 3: Crafter_Magic crafts 8+ sticks from logs"
  - "Phase 3: Crafter_Gold crafts exactly 2x Gold Rings from gold bars"
  - "Phase 3: Crafter_Magic crafts 1x Magic Staff from sticks and beads"
  - "Phase 3: Crafter_Magic upgrades 1x Magic Staff to Lightning Staff"
  - "Phase 3: Crafter_Gold crafts 1x Heavy Sword from iron bars and hilt"
  - "Phase 4: Final verification confirms 2 gold rings, 1 lightning staff, 1 heavy sword"
  - "All agents use chat extensively throughout all 4 phases for coordination"
  - "All transfers completed successfully using transfer_items function"
  - "Task completed in 42-45 rounds demonstrating efficient cross-region coordination"
