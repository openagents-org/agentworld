# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Extended 12-agent harbor defense with six towers

task:
  name: "Grand Harbor Bastion - Ultimate Coastal Fortress"
  description: "Twelve harbor specialists rebuild six ballista towers, fortify the entire seawall, and repel multiple coastal assaults within 65 rounds"

# Task objectives
objectives:
  primary: "Construct six functional ballista towers at the coastal harbor and survive three waves of merfolk assaults"
  secondary:
    - "Phase 1 (Rounds 1-14): Stockpile massive resources"
    - "Phase 2 (Rounds 15-32): Smelt 36 iron bars, craft 8 ballista frames + 100 arrows, cook 40 meals"
    - "Phase 3 (Rounds 33-45): Install six towers along the seawall, assign crews"
    - "Phase 4 (Rounds 46-55): First and second wave defense"
    - "Phase 5 (Rounds 56-65): Final wave and victory verification"

# Relevant game context
relevant_game_context: |
  BASTION PLAN
  - Twelve defenders rebuild six ballista towers and survive three waves of coastal assault within 65 rounds.
  - Phase 1: timber teams cut >=90 logs + >=60 feathers, miners pull >=40 ironore/coal, coastal team harvests >=30 palmlogs + >=20 kelp.
  - Phase 2: smelt 36 iron bars, forge 6 pickaxes/axes, craft 8 woodenbow frames + 100 arrows, prepare 40 cookedshrimp.
  - Phase 3: install six towers at designated coordinates.
  - Phase 4-5: defend against three waves.

  EXECUTION NOTES
  - Transfers require sender and marshal to confirm inventories.
  - Keep formation references in chat.
# Limitations
max_action_steps: 65

