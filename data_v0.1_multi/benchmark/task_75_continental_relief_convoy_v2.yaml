# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Extended 12-agent relief convoy with multiple destinations

task:
  name: "Continental Relief Convoy - Grand Multi-Region Aid Campaign"
  description: "Twelve specialists assemble supplies and deliver them to three refugee destinations over ~62 rounds"

# Task objectives
objectives:
  primary: "Deliver consolidated supplies to three coastal refugee sites after executing a five-phase convoy plan in 60-62 rounds"
  secondary:
    - "Phase 1 (Rounds 1-14): Stage at central farm and gather massive resources"
    - "Phase 2 (Rounds 15-30): Smelt 45 iron bars, craft repair tools, cook 45 meals, bundle aid kits"
    - "Phase 3 (Rounds 31-44): Split into three convoy teams heading to different destinations"
    - "Phase 4 (Rounds 45-55): Each convoy reaches its destination and delivers supplies"
    - "Phase 5 (Rounds 56-62): All teams regroup at central point for final summary"

# Relevant game context
relevant_game_context: |
  MISSION FLOW (~62 ROUNDS)
  - Phase 1: gather massive quotas — >=45 iron + >=45 coal, >=60 logs + >=60 feathers, >=30 rawshrimp, >=80 berries.
  - Phase 2: smelt 45+ iron bars, forge pickaxes/axes/buckets; Cooks prepare 45 cookedshrimp; Rangers craft 90 arrows.
  - Phase 3: split into North/East/South convoy teams, each with 4 agents.
  - Phase 4: convoys reach their destinations and deliver aid crates.
  - Phase 5: all agents regroup for final status report.

  EXECUTION NOTES
  - Three destinations: North pier, East harbor, South beach.
  - Each convoy needs at least one escort, one medic, one quartermaster role.
  - Transfers only count when both agents confirm via verify_inventory.
# Limitations
max_action_steps: 62

