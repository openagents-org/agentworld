  - "All twelve agents meet and confirm three convoy team assignments before Round 8"
  - "ChiefQuartermaster verifies stockpile of >=60 logs, >=45 ironbar, >=80 blueberries, >=45 cookedshrimp"
  - "Engineers craft >=45 ironbar plus 4 pickaxe, 4 axe, and 4 bucket"
  - "Rangers craft and consolidate >=90 arrows for escorts"
  - "All three convoys successfully reach their destinations"
  - "Each destination receives >=15 cookedshrimp, >=10 flasks, >=10 ironbar, >=30 arrows"
  - "All agents regroup for final summary with HP >25%"
  - "Mission completes between Rounds 60-62"
