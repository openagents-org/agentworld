# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Simplified 5-agent potion brewing

task:
  name: "Alchemist Guild - Focused Potion Brewing"
  description: "Five alchemists gather herbs, hunt for ingredients, and brew diverse potions and consumables"

# Task objectives
objectives:
  primary: "Brew potion collection: 6+ different consumables including healing, food, and specialty items"
  secondary:
    - "Gathering (Rounds 1-15): Collect herbs, hunt animals, fish for ingredients"
    - "Preparation (Rounds 16-28): Process and consolidate ingredients"
    - "Brewing (Rounds 29-40): Cook and craft all consumables"
    - "Guild Hall (Rounds 41-44): Display potion collection"

# Context and guidance for agents
relevant_game_context: |
  GUILD OVERVIEW
  - Five alchemists must present ≥6 consumables (stews, cooked meats, smoothie) by Round 44. One herbalist forages vegetables, one hunter collects meat, one fisher gathers seafood, and the Master Brewer at (528,384) handles all cooking.

  TIMELINE
  1. R1-15 Gathering: each team works its region, announcing ingredient counts.
  2. R16-28 Delivery: all gatherers move toward the guild hall, then transfer ingredients to the Master Brewer.
  3. R29-40 Brewing: the Master Brewer cooks the menu—tomato stew, cooked chicken ×2, cooked shrimp, jellyfish smoothie.
  4. R41-44 Exhibition: list the finished dishes, confirm total ≥6.

  EXECUTION NOTES
  - Keep per-team checklists in chat so the brewer knows when to begin cooking.
  - If certain ingredients refuse to drop, announce substitutions early.
# Limitations
max_action_steps: 44

