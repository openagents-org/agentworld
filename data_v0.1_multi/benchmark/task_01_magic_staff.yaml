# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cooperative Magic Staff Crafting - Wizard Equipment Preparation"
  description: "Three agents work together to gather materials and craft a magical staff for spellcasting"

# Task objectives
objectives:
  primary: "Prepare wizard_agent with crafted magic staff for magical combat"
  secondary: # checkpoints
    - "Establish effective team communication through global chat"
    - "Ensure safe material transfer between agents"
    - "Complete all steps within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent scenario where teamwork is essential.
  
  CRITICAL SUCCESS REQUIREMENTS:
  1. lumberjack_agent MUST find and cut oak trees to get logs (wood material)
  2. woodworker_agent MUST craft logs into sticks (4x stick from 1x logs)
  3. woodworker_agent MUST transfer sticks to wizard_agent via trade/inventory
  4. wizard_agent MUST wait for materials, then craft "staff" (magic staff)
  5. wizard_agent MUST equip the magic staff
  6. wizard_agent MUST declare readiness for magical combat in global chat
  
  LOCATION STRATEGY:
  - Look for oak trees (any forest area) for logs - wood cutting
  - Look for magic beads if available for enhanced staff crafting
  - Move directly to target coordinates for efficient navigation
  - Communicate locations and progress through global chat
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  🪵 Lumberjacking - logs:
    - harvest_resource on oak tree instances to get logs
    - Level required: 1+ (Lumberjacking skill)
  
  🪄 Fletching Recipe - stick:
    - craft_item skill=Fletching itemKey=stick
    - Materials: 1x logs → 4x stick
    - Level required: 1 (Fletching skill)
  
  ⚡ Crafting Recipe - staff:
    - craft_item skill=Crafting itemKey=staff
    - Materials: 5x stick + 1x bead → 1x staff
    - Level required: 1 (Crafting skill)

# Limitations
max_action_steps: 25

# Agent configurations
agent_1:
  username: "lumberjack_agent"
  new_character: true
  role: "Wood Gatherer"
  
  # Starting location - forest area for tree cutting
  location:
    x: 126
    y: 23
  
  # Skills focused on lumberjacking
  skill_levels:
    lumberjacking: 25
    strength: 25
    health: 25
  
  # Lumberjacking equipment and basic supplies
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "axe"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  # Specific task instructions
  task_instructions: |
    YOUR ROLE: Wood gatherer responsible for cutting trees to get logs
    
    🪵 CRITICAL LUMBERJACKING MISSION - YOU ARE A LUMBERJACK!
    
    ABSOLUTE PRIORITIES:
    1. Find oak trees in your environment using observe_environment
    2. Look for "Oak" tree instances specifically
    3. Use harvest_resource on oak tree instances to get logs
    4. Gather at least 2 logs (1 for sticks, 1 backup)
    5. Use global chat to report progress and coordinate with team
    
    LUMBERJACKING STRATEGY:
    1. YOUR FIRST ACTION: observe_environment to find oak trees in current area
    2. PRIORITY: Look for OAK TREES specifically (difficulty 10, level 1 requirement)
       - Oak Tree instances produce regular "logs" needed for stick crafting
       - AVOID Pine Trees (difficulty 80, produces icepinelogs - wrong type!)
       - AVOID Willow Trees (difficulty 160, produces willowlogs - wrong type!)
    3. If no oak trees visible, move to nearby forest areas and repeat observation:
       - move_character(x=150, y=50) for potential forest area nearby
       - move_character(x=100, y=70) for potential forest area nearby
       - move_character(x=180, y=30) for potential forest area nearby
    4. When you find OAK trees, harvest them immediately for logs
    5. Check inventory regularly to confirm logs obtained
    6. Use global chat every 2-3 actions to report progress
    7. Once you have logs (minimum 1), coordinate transfer with woodworker_agent
    8. Wait for woodworker_agent to request transfer and coordinate meetup location
    9. Move to woodworker_agent's location or agreed meetup point
    10. Use transfer_items to give logs to woodworker_agent safely
    11. WAIT for woodworker_agent to confirm they received materials before completing
    12. Do NOT use complete() until wizard_agent successfully crafts and equips the staff
    
    ERROR PREVENTION:
    - Always verify targetInstance IDs exist in current environment
    - Never repeat failed harvest attempts on same resource
    - Use move_character directly to target coordinates
    - REMEMBER: Oak trees give logs, logs are needed for stick crafting!

agent_2:
  username: "woodworker_agent"
  new_character: true
  role: "Stick Crafter"
  
  # Starting location - central area for coordination
  location:
    x: 183
    y: 312
  
  # Skills focused on fletching and crafting
  skill_levels:
    fletching: 15      # Required for stick crafting
    crafting: 10       # Additional crafting capability
    strength: 20
    health: 20
  
  # Basic supplies
  inventory_items:
    - item: "flask"
      count: 8
    - item: "apple"
      count: 12
  
  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  # Specific task instructions
  task_instructions: |
    YOUR ROLE: Stick crafter responsible for converting logs into sticks
    
    🪄 CRITICAL FLETCHING MISSION - CRAFT STICKS FROM LOGS!
    
    ABSOLUTE PRIORITIES:
    1. Coordinate with lumberjack_agent to receive logs
    2. Use Fletching skill to craft logs into sticks
    3. Transfer finished sticks to wizard_agent for staff crafting
    4. Ensure quality control and proper material flow
    
    FLETCHING STRATEGY:
    1. YOUR FIRST ACTION: send global chat message announcing readiness to receive logs
    2. Wait for lumberjack_agent to report log collection progress
    3. Coordinate meetup location for log transfer
    4. Move to agreed location to receive logs from lumberjack_agent
    5. Use observe_environment to verify logs received in inventory
    6. Once you have logs, craft them into sticks:
       📋 RECIPE: craft_item skill=Fletching itemKey=stick (1x logs → 4x stick)
    7. Use observe_environment to verify sticks are in your inventory after crafting
    8. Use global chat to report successful stick crafting
    9. Coordinate with wizard_agent for stick transfer and meetup location
    10. Move to wizard_agent's location for transfer
    11. Use transfer_items to give sticks to wizard_agent safely
    12. WAIT for wizard_agent to confirm they received sticks before completing
    13. Do NOT use complete() until wizard_agent successfully crafts and equips the staff
    
    MOVEMENT RULES:
    - Move efficiently between lumberjack and wizard agents
    - Coordinate locations through global chat
    - Focus on being the material processing hub
    
    ERROR PREVENTION:
    - Verify you have Fletching level 1+ before attempting stick crafting
    - Always check inventory contents before and after crafting
    - Confirm materials in inventory before attempting transfers
    - REMEMBER: logs → sticks via Fletching, sticks needed for staff!

agent_3:
  username: "wizard_agent"
  new_character: true
  role: "Master Wizard"
  
  # Starting location - magical area
  location:
    x: 242
    y: 336
  
  # Skills focused on crafting and magic
  skill_levels:
    crafting: 15       # Required for staff crafting
    magic: 25
    health: 25
    strength: 15
  
  # Magical supplies and basic gear
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
    - item: "bead"
      count: 1
  
  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  # Specific task instructions
  task_instructions: |
    YOUR ROLE: Master wizard waiting for materials to craft magic staff
    
    ⚡ PRIORITY ACTIONS:
    1. Use global chat to announce readiness and location for material coordination
    2. Wait actively for woodworker_agent to complete stick crafting
    3. Coordinate meetup location for stick transfer
    4. Receive materials from woodworker_agent via transfer_items:
       ✅ From woodworker_agent: need 5x stick
       ✅ You already have: 1x bead (magic component)
    
    CRITICAL VERIFICATION STEPS (DO NOT SKIP!):
    5. BEFORE claiming to have materials, use observe_environment to CHECK YOUR INVENTORY!
    6. VERIFY you have BOTH 5x stick AND 1x bead in your inventory before proceeding
    7. ONLY AFTER verifying materials, use craft_item tool:
       📋 RECIPE: craft_item skill=Crafting itemKey=staff (5x stick + 1x bead → 1x staff)
    8. WAIT for craft_item result - do NOT claim success until you see "Successfully crafted" message
    9. Use observe_environment again to verify staff is in your inventory
    10. Use equip_item to equip the magic staff
    11. Use observe_environment to verify staff is equipped
    12. ONLY THEN use global chat to declare "Ready for magical combat with magic staff!"
    13. Use complete() ONLY after ALL above steps are verified successful
    
    ⚠️ NEVER SAY YOU'VE DONE SOMETHING WITHOUT USING THE ACTUAL TOOL!
    
    MATERIAL REQUIREMENTS CHECKLIST:
    ✅ 5x stick (from woodworker_agent)
    ✅ 1x bead (you start with this)
    ✅ Crafting skill level 1+ (you have level 15)
    
    ERROR PREVENTION:
    - Move directly to agents without distance concerns
    - Check inventory before and after all transfers
    - Verify materials present before attempting crafting
    - Confirm equipment changes in observation after equipping staff
    - Stay in communication range for coordination

# Success criteria for multi-agent task
success_criteria:
  - "lumberjack_agent successfully gathers and transfers logs to woodworker_agent"
  - "woodworker_agent successfully crafts sticks and transfers to wizard_agent"
  - "wizard_agent receives materials and crafts a magic staff"
  - "wizard_agent successfully equips the magic staff"
  - "All agents use global chat for coordination throughout the process"
  - "wizard_agent declares readiness for magical combat"
