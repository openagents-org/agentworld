# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cooperative Magic Staff Crafting - Wizard Equipment Preparation"
  description: "Three agents work together to gather materials and craft a magical staff for spellcasting"

# Task objectives
objectives:
  primary: "Prepare wizard_agent with crafted magic staff for magical combat"
  secondary: # checkpoints
    - "Establish effective team communication through global chat"
    - "Ensure safe material transfer between agents"
    - "Complete all steps within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent scenario where teamwork is essential.
  
  HINT:
  1. lumberjack_agent MUST find and cut oak trees to get logs (wood material)
  2. woodworker_agent MUST craft logs into sticks (4x stick from 1x logs)
  3. woodworker_agent MUST transfer sticks to wizard_agent via trade/inventory
  4. wizard_agent MUST wait for materials, then craft "staff" (magic staff)
  5. wizard_agent MUST equip the magic staff
  6. wizard_agent MUST declare readiness for magical combat in global chat
  
  LOCATION STRATEGY:
  - Look for oak trees (any forest area) for logs - wood cutting
  - Look for magic beads if available for enhanced staff crafting
  - Move directly to target coordinates for efficient navigation
  - Communicate locations and progress through global chat
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  🪵 Lumberjacking - logs:
    - harvest_resource on oak tree instances to get logs
    - Level required: 1+ (Lumberjacking skill)
  
  🪄 Fletching Recipe - stick:
    - craft_item skill=Fletching itemKey=stick
    - Materials: 1x logs → 4x stick
    - Level required: 1 (Fletching skill)
  
  ⚡ Crafting Recipe - staff:
    - craft_item skill=Crafting itemKey=staff
    - Materials: 5x stick + 1x bead → 1x staff
    - Level required: 1 (Crafting skill)

# Limitations
max_action_steps: 25

# Agent configurations
agent_1:
  username: "lumberjack_agent"
  new_character: true
  
  # Starting location - forest area for tree cutting
  location:
    x: 126
    y: 23
  
  # Skills focused on lumberjacking
  skill_levels:
    lumberjacking: 25
    strength: 25
    health: 25
  
  # Lumberjacking equipment and basic supplies
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "axe"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0


agent_2:
  username: "woodworker_agent"
  new_character: true
  
  # Starting location - central area for coordination
  location:
    x: 183
    y: 312
  
  # Skills focused on fletching and crafting
  skill_levels:
    fletching: 15      # Required for stick crafting
    crafting: 10       # Additional crafting capability
    strength: 20
    health: 20
  
  # Basic supplies
  inventory_items:
    - item: "flask"
      count: 8
    - item: "apple"
      count: 12
  
  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0


agent_3:
  username: "wizard_agent"
  new_character: true
  
  # Starting location - magical area
  location:
    x: 242
    y: 336
  
  # Skills focused on crafting and magic
  skill_levels:
    crafting: 15       # Required for staff crafting
    magic: 25
    health: 25
    strength: 15
  
  # Magical supplies and basic gear
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
    - item: "bead"
      count: 1
  
  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0


# Success criteria for multi-agent task
success_criteria:
  - "lumberjack_agent successfully gathers and transfers logs to woodworker_agent"
  - "woodworker_agent successfully crafts sticks and transfers to wizard_agent"
  - "wizard_agent receives materials and crafts a magic staff"
  - "wizard_agent successfully equips the magic staff"
  - "All agents use global chat for coordination throughout the process"
  - "wizard_agent declares readiness for magical combat"
