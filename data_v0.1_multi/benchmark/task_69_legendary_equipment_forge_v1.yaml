# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Simplified 5-agent legendary crafting

task:
  name: "Legendary Equipment Forge - Core Gear Creation"
  description: "Five master craftsmen unite to create legendary equipment: golden items and elite weapons"

# Task objectives
objectives:
  primary: "Forge legendary equipment: 3+ golden items, 4+ elite weapons for core legendary arsenal"
  secondary:
    - "Conquest 1 (Rounds 1-14): Resource Gathering - Mine 40+ ores, gather components"
    - "Conquest 2 (Rounds 15-26): Industrial Smelting - Produce 35+ bars from ores"
    - "Conquest 3 (Rounds 27-38): Legendary Crafting - Forge all legendary items"
    - "Conquest 4 (Rounds 39-42): Arsenal Display - Verify complete legendary set"

# Context and guidance for agents
relevant_game_context: |
  LEGENDARY GOAL
  - Five specialists must gather materials (25 gold ore, 10 iron ore, 35 coal, logs, strings, hilts) and craft 7 legendary items (3 golden pieces, 4 elite weapons/tools) within ~42 rounds. Miners work remotely while the forge master at (528,384) handles smelting and crafting.

  ROADMAP
  1. R1-14 Extraction: Gold miner collects 25 gold ore; Iron/Coal miner digs 10 iron + 35 coal; component gatherer secures strings/logs/hilts.
  2. R15-22 Caravan: all gatherers march to the forge (<=32-tile hops). Transfer ores/coal to forge master.
  3. R23-38 Production: Forge master smelts 25 gold bars and 10 iron bars, then crafts golden sword/bow/ring and elite weapons.
  4. R39-42 Exhibition: list the final arsenal and confirm counts.

  EXECUTION NOTES
  - Keep a shared checklist ("Gold 15/25", "Coal 30/35") so the forge knows when each material stream is ready.
  - Transfers only succeed within ~10 tiles.
# Limitations
max_action_steps: 42

