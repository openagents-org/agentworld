# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Extended 8-agent jewelry empire

task:
  name: "Enchanted Jewelry Workshop - Grand Gemstone Empire"
  description: "Eight jewelry artisans gather rare gems, craft base jewelry, and create 20+ enchanted pieces"

# Task objectives
objectives:
  primary: "Create complete jewelry collection: 20+ pieces including 8 rings, 7 pendants, 5 base items"
  secondary:
    - "Gem Hunt (Rounds 1-18): Hunt mobs and forage for 30+ gemstones"
    - "Metal Works (Rounds 19-35): Mine and smelt metals for base jewelry"
    - "Crafting (Rounds 36-52): Create all jewelry pieces"
    - "Exhibition (Rounds 53-58): Display complete collection"

# Context and guidance for agents
relevant_game_context: |
  WORKSHOP SNAPSHOT
  - Eight artisans must finish 20 jewelry pieces (8 rings, 7 pendants, 5 base pieces) by Round 58. Gem hunters operate near (350,250), foragers in the western forest, metalsmiths mine in the mountains, and the Master Jewelers assemble everything at (528,384).

  GAME PLAN
  1. R1-18 Gem Hunt: Agents 1-2 farm goblins/skeletons for rubies/emeralds/topaz; Agents 3-4 forage beryl and string; Agents 5-6 mine gold/iron + coal.
  2. R19-35 Delivery & Smelting: all gatherers converge on the hub, hand over materials via transfer_items. Metal team smelts 12 gold bars and 15 iron bars.
  3. R36-52 Crafting: Master Jewelers craft base rings then upgrades with gemstones; pendants consume beryl/emerald/ruby + string.
  4. R53-58 Exhibition: verify_inventory shows at least 20 finished pieces.

  EXECUTION NOTES
  - Transfer only within ~10 tiles and require both sender/receiver confirmations.
  - Keep per-team checklists in chat so the jewelers know when materials are ready.
# Limitations
max_action_steps: 58

