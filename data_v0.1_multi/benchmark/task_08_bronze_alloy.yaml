agent_3:
  username: "alloy_smith_agent"
  new_character: true
  role: "Bronze Alloy Master"
  
  location:
    x: 242
    y: 336
  
  skill_levels:
    smithing: 25      # Required for bronze alloy smelting (level 5+)
    mining: 15        # Basic ore knowledge
    strength: 25
    health: 25
  
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Bronze alloy master responsible for advanced metallurgy
    
    🥉 PRIORITY ACTIONS:
    1. Coordinate with both copper_miner_agent and tin_miner_agent
    2. Collect copper and tin ores for alloy production
    3. Execute bronze alloy smelting operations
    4. Quality control and alloy verification
    
    ALLOY PRODUCTION COORDINATION:
    1. send global chat message announcing alloy smelting facility readiness
    2. Monitor progress from both copper_miner_agent and tin_miner_agent
    3. Coordinate material collection from both miners
    4. First collect copperore from copper_miner_agent
    5. Then collect tinore from tin_miner_agent
    6. Verify both ore types before alloy production
    
    CRITICAL ALLOY SMELTING STEPS:
    7. observe_environment to CHECK YOUR INVENTORY before smelting
    8. VERIFY you have BOTH 1x copperore AND 1x tinore (minimum)
    9. ONLY AFTER verifying materials, use craft_item:
       📋 RECIPE: craft_item skill=Smelting itemKey=bronzebar (1x copperore + 1x tinore → 1x bronzebar)
    10. WAIT for craft_item result - IMPORTANT: Bronze has 70% success chance!
    11. If smelting fails, try again with backup materials
    12. observe_environment to verify bronzebar created in inventory
    13. Use global chat to announce successful bronze alloy creation
    14. Display bronze bar in inventory for team verification
    15. complete() ONLY after successful bronze bar creation
    
    ALLOY REQUIREMENTS:
    ✅ 1x copperore (from copper_miner_agent)
    ✅ 1x tinore (from tin_miner_agent)
    ✅ Smithing skill level 5+ (you have level 25)
    ⚠️ 70% success chance - may need multiple attempts!
    
    ERROR PREVENTION:
    - Verify both ore types received before smelting
    - Prepare for potential smelting failures
    - Have backup materials available
    - REMEMBER: Bronze alloy is more challenging than basic smelting!

# Success criteria for multi-agent task
success_criteria:
  - "copper_miner_agent successfully mines and transfers copper ore"
  - "tin_miner_agent successfully mines and transfers tin ore"
  - "alloy_smith_agent receives both ores and creates bronze bar"
  - "Bronze alloy production demonstrates advanced metallurgy success"
  - "All agents coordinate specialized ore extraction effectively"
  - "Advanced alloy production completes within time limit"
