# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cooperative Bronze Alloy Creation - Advanced Metallurgy"
  description: "Three agents work together to create bronze bars through specialized ore mining and alloy smelting"

# Task objectives
objectives:
  primary: "Create bronze bars through coordinated copper and tin mining with alloy smelting"
  secondary: # checkpoints
    - "Coordinate specialized ore extraction operations"
    - "Execute advanced alloy metallurgy techniques"
    - "Complete bronze production within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent advanced metallurgy scenario requiring specialized ore mining.
  
  CRITICAL SUCCESS REQUIREMENTS:
  1. copper_miner_agent MUST find and mine copper ore deposits
  2. tin_miner_agent MUST find and mine tin ore deposits
  3. alloy_smith_agent MUST combine copper and tin ores into bronze bars
  4. alloy_smith_agent MUST demonstrate bronze bar creation success
  
  LOCATION STRATEGY:
  - Search for copper ore deposits in mining areas
  - Find tin ore deposits in different mining locations
  - Central alloy smelting facility for bronze production
  - Communicate specialized ore locations through global chat
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  ⛏️ Mining - copper ore:
    - harvest_resource on copper rock instances to get copperore
    - Level required: 1+ (Mining skill)
  
  ⛏️ Mining - tin ore:
    - harvest_resource on tin rock instances to get tinore
    - Level required: 1+ (Mining skill)
  
  🥉 Smelting Recipe - bronzebar:
    - craft_item skill=Smelting itemKey=bronzebar
    - Materials: 1x copperore + 1x tinore → 1x bronzebar
    - Level required: 5 (uses Smithing skill level)
    - Success chance: 70% - CHALLENGING!

# Limitations
max_action_steps: 25

# Agent configurations
agent_1:
  username: "copper_miner_agent"
  new_character: true
  role: "Copper Ore Specialist"
  
  location:
    x: 126
    y: 23
  
  skill_levels:
    mining: 25
    strength: 30
    health: 25
  
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "pickaxe"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Copper ore specialist responsible for copper extraction
    
    🟠 CRITICAL COPPER MINING MISSION - EXTRACT COPPER ORE!
    
    ABSOLUTE PRIORITIES:
    1. Find copper ore deposits in mining areas
    2. Extract copper ore for bronze alloy production
    3. Secure multiple copper ore units for backup
    4. Transfer copper ore to alloy_smith_agent
    
    COPPER MINING STRATEGY:
    1. observe_environment to search for copper rock deposits
    2. Look for "copper" rock instances specifically (level 1 requirement)
    3. If not visible, move to different copper mining areas:
       - move_character(x=100, y=500) for copper-rich mountain area
       - move_character(x=200, y=400) for basic mining area
       - move_character(x=250, y=350) for mineral deposits
    4. harvest_resource on copper rock instances to get copperore
    5. Target: Collect 2-3x copperore for bronze production + backup
    6. Check inventory after each mining attempt
    7. Use global chat every 2-3 actions to report copper mining progress
    8. Once you have sufficient copper ore, coordinate with alloy_smith_agent
    9. Move to agreed meetup location for copper ore transfer
    10. transfer_items to give copperore to alloy_smith_agent
    11. Wait for alloy_smith_agent to confirm receipt
    12. Support team until bronze bar creation is complete
    
    COPPER MINING REQUIREMENTS:
    - Mining skill level 1+ (you have 25) ✅
    - Pickaxe tool equipped ✅
    - Basic level ore mining
    - Focus on copper-specific deposits
    
    ERROR PREVENTION:
    - Verify pickaxe equipped before mining
    - Look specifically for copper-colored rock deposits
    - Check inventory after each mining operation
    - REMEMBER: Copper ore → bronze alloy component

