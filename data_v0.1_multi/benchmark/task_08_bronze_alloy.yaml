# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cooperative Bronze Alloy Creation - Advanced Metallurgy"
  description: "Three agents work together to create bronze bars through specialized ore mining and alloy smelting"

# Task objectives
objectives:
  primary: "Create bronze bars through coordinated copper and tin mining with alloy smelting"
  secondary: # checkpoints
    - "Coordinate specialized ore extraction operations"
    - "Execute advanced alloy metallurgy techniques"
    - "Complete bronze production within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent advanced metallurgy scenario requiring specialized ore mining.
  
  HINT:
  1. copper_miner_agent MUST find and mine copper ore deposits
  2. tin_miner_agent MUST find and mine tin ore deposits
  3. alloy_smith_agent MUST combine copper and tin ores into bronze bars
  4. alloy_smith_agent MUST demonstrate bronze bar creation success
  
  LOCATION STRATEGY:
  - Search for copper ore deposits in mining areas
  - Find tin ore deposits in different mining locations
  - Central alloy smelting facility for bronze production
  - Communicate specialized ore locations through global chat
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  ⛏️ Mining - copper ore:
    - harvest_resource on copper rock instances to get copperore
    - Level required: 1+ (Mining skill)
  
  ⛏️ Mining - tin ore:
    - harvest_resource on tin rock instances to get tinore
    - Level required: 1+ (Mining skill)
  
  🥉 Smelting Recipe - bronzebar:
    - craft_item skill=Smelting itemKey=bronzebar
    - Materials: 1x copperore + 1x tinore → 1x bronzebar
    - Level required: 5 (uses Smithing skill level)
    - Success chance: 70% - CHALLENGING!

# Limitations
max_action_steps: 25

