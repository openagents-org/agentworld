# AgentWorld Multi-Agent Task Configuration

task:
  name: "Planar War Campaign - Multi-Dimensional Battle and Reality Conquest"
  description: "Three agents work together to wage war across multiple dimensional planes, defeat Planar Overlords, and establish dimensional dominance"

# Task objectives
objectives:
  primary: "Successfully wage war across multiple dimensional planes, defeat Planar Overlords, and establish dimensional dominance"
  secondary: # checkpoints
    - "Establish multi-dimensional warfare coordination and planar invasion strategies"
    - "Execute coordinated Planar Overlord combat across multiple reality layers"
    - "Complete planar war campaign within 42 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is the ultimate cooperative multi-dimensional warfare scenario requiring mastery of all combat and magical systems.
  
  OBJECTIVE: Wage war across multiple dimensional planes, defeat Planar Overlords, and establish dimensional dominance.
  
  MISSION REQUIREMENTS:
  - Navigate between Material Plane (1300,900), Elemental Plane (1400,1000), and Astral Plane (1500,1100)
  - Defeat Planar Overlords: Void Lord (Level 75), Elemental Titan (Level 80), Astral Emperor (Level 85)
  - Establish dimensional beacons to maintain control over conquered planes
  - Coordinate massive multi-dimensional warfare with reality-altering consequences
  
  TEAM COORDINATION:
  - Use global chat for complex multi-dimensional warfare coordination
  - Coordinate between planar travel, legendary combat, and dimensional conquest
  - Share legendary equipment and provide maximum combat support across planes
  - Work together to handle the most challenging encounters in all of AgentWorld
  
  GENERAL STRATEGY:
  - This is the ultimate test requiring perfect coordination and legendary skills
  - Multiple Planar Overlords (Level 75-85) represent the highest combat challenge
  - Multi-dimensional warfare requires mastery of all magical and combat systems
  - Reality-altering effects require adaptive strategies and perfect timing
  - Balance aggressive conquest with strategic dimensional control
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  PLANAR WARFARE MASTERY (CRITICAL KNOWLEDGE):
  🌌 Multi-Dimensional Travel:
    - Use planar_shift action to travel between dimensional planes
    - Requires master-level magic (50+) and dimensional anchoring
    - Each plane has unique physics and environmental challenges
    - Coordinate planar transitions to maintain team cohesion
  
  👑 Combat - Planar Overlords:
    - Void Lord (Level 75) at Material Plane (1300,900): Reality manipulation, void attacks
    - Elemental Titan (Level 80) at Elemental Plane (1400,1000): All elemental mastery, massive size
    - Astral Emperor (Level 85) at Astral Plane (1500,1100): Mind control, astral projection, highest level
    - Each requires unique strategies and maximum team coordination
  
  🏰 Dimensional Beacon Establishment:
    - Use establish_beacon action after defeating each Planar Overlord
    - Requires dimensional crystals and reality anchoring magic
    - Beacons maintain dimensional control and prevent planar rebellion
    - Coordinate beacon placement for maximum dimensional coverage
  
  ⚔️ Legendary Combat Strategy:
    - Each Overlord has multiple combat phases and reality-altering abilities
    - Use environmental advantages specific to each dimensional plane
    - Coordinate legendary equipment sharing for optimal matchups
    - Plan complex retreat and regrouping strategies across planes
  
  🔮 Reality Warfare:
    - Combat affects the fundamental nature of reality itself
    - Use reality-stabilization magic to prevent dimensional collapse
    - Coordinate massive magical energies without destroying planes
    - Balance conquest objectives with dimensional preservation

# Limitations
max_action_steps: 42

