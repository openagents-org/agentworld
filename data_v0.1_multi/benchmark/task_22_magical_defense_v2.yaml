# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Craft fire staff instead of lightning staff, different gem

task:
  name: "Magical Academy Defense - Fire Staff & Frost Elemental Battle"
  description: "Three agents work together to craft a fire staff using ruby gems and defeat a Frost Elemental"

# Task objectives
objectives:
  primary: "Craft a Fire Staff and successfully defeat a Frost Elemental in coordinated magical combat"
  secondary: # checkpoints
    - "Establish magical team coordination and resource gathering"
    - "Execute fire staff crafting with ruby gem"
    - "Complete elemental battle victory within 35 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent magical defense scenario requiring fire magic crafting.

  OBJECTIVE: Create a fire staff and defeat a Frost Elemental through team coordination.

  MISSION REQUIREMENTS:
  - Gather logs and craft sticks for staff base
  - Mine ruby gems for fire enchantment
  - Craft a Fire Staff using advanced fletching
  - Locate and defeat a Frost Elemental using fire advantage

  TEAM COORDINATION:
  - Use global chat to coordinate crafting and combat
  - Share materials between gatherer and crafter
  - Coordinate fire-based attacks for elemental advantage

  CRAFTING RECIPES:
  🪵 Lumberjacking - logs:
    - harvest_resource on Oak Tree instances to get logs
    - Level required: 1+ (Lumberjacking skill)

  🪄 Fletching Recipe - stick:
    - craft_item skill=Fletching itemKey=stick
    - Materials: 1x logs → 4x stick

  💎 Mining - Ruby (RARE GEMS):
    - harvest_resource on Ruby Rock instances to get ruby
    - Level required: 20+ (Mining skill)

  🔥 Fletching Recipe - firestaff:
    - craft_item skill=Fletching itemKey=firestaff
    - Materials: 4x stick + 1x ruby → 1x firestaff
    - Level required: 30 (Fletching skill)

  DO NOT use complete() until Frost Elemental is defeated!

# Limitations
max_action_steps: 35

