# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Extended 10-agent 6-biome caravan

task:
  name: "Multi-Biome Resource Caravan - Grand Continental Trading Empire"
  description: "Ten traders establish trading routes across 6 biomes, gathering unique resources and creating diverse collections"

# Task objectives
objectives:
  primary: "Establish continental trading route visiting 6 biomes, gather 120+ unique resources, craft 18+ regional specialty items"
  secondary:
    - "Route 1 (Rounds 1-15): Forest & Plains - Lumber and herbs"
    - "Route 2 (Rounds 16-30): Mountains & Coast - Ores and seafood"
    - "Route 3 (Rounds 31-45): Desert & Ice - Exotic materials"
    - "Route 4 (Rounds 46-60): Return & Processing - Craft regional items"

# Context and guidance for agents
relevant_game_context: |
  CARAVAN OVERVIEW
  - Ten traders must visit six biomes (forest, plains, mountains, coast, desert, ice), collect ≥120 total resources (≈20 per fertile biome, 15 per harsh biome), then craft ≥18 regional goods back at the hub by Round 60.

  ROUTE PLAN
  1. R1-15 Forest + Plains: start at (350,250), swing west to (250,350) for logs/herbs, then through the plains.
  2. R16-30 Mountains + Coast: push to (230,38) for ores/coal, then march to (900,400) for seafood.
  3. R31-45 Desert + Ice: head south to (400,680) for desert drops, then north to the ice ridge (~259,151).
  4. R46-60 Return & Craft: converge on the central hub (528,384), produce regional specialties.

  EXECUTION NOTES
  - Use chat threads to record travel checkpoints and resource totals.
  - Crafting can start as soon as the caravan reaches the hub.
# Limitations
max_action_steps: 60

