# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Craft silver ring and one gem ring

task:
  name: "Grand Jewelry Workshop - Gem Ring Creation"
  description: "Three agents smelt bars, craft 1x silver ring, and enhance to 1x emerald ring"

# Task objectives
objectives:
  primary: "Craft 1x silver ring and 1x emerald ring (ring1)"
  secondary: # checkpoints
    - "Coordinate smelting, ring crafting, and gem enhancement"
    - "Complete jewelry production within 30 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a gem ring creation scenario.

  OBJECTIVE: Create 1x silver ring and 1x emerald ring.

  MISSION REQUIREMENTS:
  - Smelt iron bars
  - Craft 2x silver rings
  - Enhance 1 silver ring with emerald to create ring1

  TEAM COORDINATION:
  - Smelter converts ore to bars
  - Ring crafter makes silver rings
  - Jeweler enhances with gem

  STARTING RESOURCES:
  - Miner has 3x ironore + 4x coal
  - Smelter has 2x ironore + 3x coal
  - Jeweler has 1x emerald

  CRAFTING:
  🔥 ironbar: 1x ironore + 1x coal
  💍 silverring: from ironbar
  💎 ring1: 1x emerald + 1x silverring → 1x emerald ring

  DO NOT use complete() until both rings are crafted!

# Limitations
max_action_steps: 30

