# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Gather wood and cook food

task:
  name: "Survival Expedition - Campsite Establishment"
  description: "Three agents gather 4x logs and cook 3x cooked shrimp for survival"

# Task objectives
objectives:
  primary: "Gather 4x logs and cook 3x shrimp for campsite"
  secondary: # checkpoints
    - "Coordinate wood and food gathering"
    - "Complete campsite setup within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a survival scenario with resource gathering and cooking.

  OBJECTIVE: Establish a campsite with wood and cooked food.

  MISSION REQUIREMENTS:
  - Gather 4x logs from oak trees
  - Catch raw shrimp from fishing spots
  - Cook 3x cooked shrimp

  TEAM COORDINATION:
  - Lumberjack gathers wood
  - Fisher catches shrimp
  - Chef cooks the food

  CRAFTING RECIPES:
  🌲 Lumberjacking - logs:
    - harvest_resource on Oak Tree instances
    - Target: 4x logs total

  🎣 Fishing - rawshrimp:
    - harvest_resource on shrimp fishing spots

  🍤 Cooking - cookedshrimp:
    - craft_item skill=Cooking itemKey=cookedshrimp
    - Materials: 1x rawshrimp → 1x cookedshrimp
    - Target: 3x cookedshrimp total

  DO NOT use complete() until objectives are achieved!

# Limitations
max_action_steps: 25

