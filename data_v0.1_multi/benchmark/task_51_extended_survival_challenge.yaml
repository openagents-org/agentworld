# AgentWorld Multi-Agent Task Configuration

task:
  name: "Extended Survival Challenge - Multi-Phase Resource Management and Combat"
  description: "Three agents undertake an extended survival challenge requiring resource gathering, equipment crafting, combat encounters, and long-term coordination over 50 rounds"

# Task objectives
objectives:
  primary: "Complete an extended survival challenge with multiple phases of resource gathering, crafting, and combat over 50 rounds"
  secondary: # checkpoints
    - "Execute Phase 1: Initial resource gathering and base equipment"
    - "Execute Phase 2: Advanced resource acquisition and tool upgrades"
    - "Execute Phase 3: Combat preparation and enemy encounters"
    - "Execute Phase 4: Final equipment enhancement and boss challenge"
    - "Complete all survival phases within 50 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  FOUR-PHASE SURVIVAL PLAN (50 ROUNDS)
  1. Phase 1 (R1-12) – Forest camp: harvest ≥4 logs, craft sticks, build a magic staff (5 sticks + SurvivalLeader’s bead) and stock food. Stay within 10 tiles around (388,4) so transfers via transfer_items are easy.
  2. Phase 2 (R13-25) – Mountain mining: travel to (230,38), mine ≥10 ironore and ≥10 coal, consolidate with CraftingExpert, smelt 8 ironbars, and craft pickaxe (5 bars + log) plus axe (3 bars + log). Grab extra logs before leaving.
  3. Phase 3 (R26-38) – Combat prep: craft a heavy sword (2 bars + hilt2), hunt low-level mobs (rats/bats/crabs) using attack_mob to rehearse coordination, and restock healing items between fights.
  4. Phase 4 (R39-50) – Boss run: scout for a goblin/skeleton/ogre boss, ensure everyone >80% HP, then execute a coordinated attack_mob call and confirm victory.

  COORDINATION RULES
  - After every gather/craft/transfer, announce inventory via chat and run verify_inventory when receiving materials.
  - Travel as a group when switching regions; SurvivalLeader calls waypoints, CombatSpecialist escorts.
  - CraftingExpert handles all smelting/smithing; other agents funnel materials via transfer_items.
  - Use attack_mob for combat to guarantee auto-loot and clear combat logs.

  COMPLETION CHECKLIST
  - Crafted items verified in order: magic staff → pickaxe + axe → heavy sword.
  - Boss defeated during Phase 4 with chat confirmation (“Boss down, HP summary…”).
  - All three agents alive and standing together when complete() is called.
# Limitations
max_action_steps: 50

