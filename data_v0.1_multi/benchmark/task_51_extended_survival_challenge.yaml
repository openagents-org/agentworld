  - "Magic Staff is crafted during Phase 1"
  - "Team successfully completes Phase 2: Resource Expansion (Rounds 13-25)"
  - "Pickaxe and Axe are crafted during Phase 2"
  - "CraftingExpert successfully produces all required equipment"
