# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Extended 12-agent grand festival preparation

task:
  name: "Grand Festival Preparation - Ultimate Celebration Empire"
  description: "Twelve specialized agents coordinate to prepare a grand festival with multiple food stations, diverse prizes, and elaborate decorations"

# Task objectives
objectives:
  primary: "Prepare an ultimate festival where 12 agents gather diverse resources, cook multiple dishes, craft competition prizes, and create decorative items"
  secondary:
    - "Phase 1 (Rounds 1-18): Resource Expedition across multiple regions"
    - "Phase 2 (Rounds 19-32): Material Processing and Cooking multiple dishes"
    - "Phase 3 (Rounds 33-44): Prize Crafting and Decoration Creation"
    - "Phase 4 (Rounds 45-55): Festival Setup and Verification"

# Relevant game context
relevant_game_context: |
  FESTIVAL PLAN
  - Twelve specialists gather seafood, meats, produce, ores, gems, and logs; cooks prepare feast dishes, smith/fletcher craft competition prizes, decorator builds showpieces, everyone meets at the plaza (450,300) within 55 rounds.
  - Phase 1: fishers catch 15 shrimp + 10 tuna, hunters collect 15 meat, foragers gather fruits/veg, smith/decorator mine ores/gems, fletcher cuts logs.
  - Phase 2: transfer ingredients; cooks prepare 20+ dishes; smith smelts 15 iron + 8 gold bars.
  - Phase 3: fletcher crafts 2 wooden bows + arrows; smith forges 5 silver rings and 2 golden rings; decorator crafts pendants and magic staff.
  - Phase 4: all agents travel to festival grounds and verify items.

  EXECUTION NOTES
  - Use chat to track progress.
  - Transfers require verify_inventory.
# Limitations
max_action_steps: 55

