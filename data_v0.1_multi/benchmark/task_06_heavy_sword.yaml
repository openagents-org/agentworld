# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cooperative Heavy Sword Forging - Warrior Weapon Crafting"
  description: "Three agents work together to create a heavy sword through mining, smelting, and advanced smithing"

# Task objectives
objectives:
  primary: "Forge a heavy sword through coordinated material processing and weapon smithing"
  secondary: # checkpoints
    - "Coordinate complex multi-step metallurgy operations"
    - "Execute precise component crafting for weapon assembly"
    - "Complete warrior weapon forging within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent weapon crafting scenario requiring advanced metallurgy and smithing.
  
  CRITICAL SUCCESS REQUIREMENTS:
  1. miner_agent MUST mine iron ore and coal for smelting operations
  2. smelter_agent MUST create iron bars and forge sword hilt component
  3. weapon_smith_agent MUST assemble heavy sword from iron bars and hilt
  4. weapon_smith_agent MUST equip the heavy sword and declare completion
  
  LOCATION STRATEGY:
  - Find iron and coal deposits for smelting materials
  - Coordinate smelting operations for iron bar production
  - Central smithing facility for weapon assembly
  - Communicate metallurgy progress through global chat
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  ⛏️ Mining - iron ore and coal:
    - harvest_resource on iron rock instances to get ironore (level 10+)
    - harvest_resource on coal deposits to get coal (level 1+)
  
  🔥 Smelting Recipe - ironbar:
    - craft_item skill=Smelting itemKey=ironbar
    - Materials: 1x ironore + 1x coal → 1x ironbar
    - Level required: 20 (uses Smithing skill level)
  
  🔨 Smithing Recipe - hilt2:
    - craft_item skill=Smithing itemKey=hilt2
    - Materials: 1x ironbar + 1x logs → 1x hilt2
    - Level required: 1 (Smithing skill)
  
  ⚔️ Smithing Recipe - sword2 (heavy sword):
    - craft_item skill=Smithing itemKey=sword2
    - Materials: 2x ironbar + 1x hilt2 → 1x heavy sword
    - Level required: 1 (Smithing skill)

# Limitations
max_action_steps: 25

# Agent configurations
agent_1:
  username: "miner_agent"
  new_character: true
  role: "Resource Extractor"
  
  location:
    x: 229
    y: 37
  
  skill_levels:
    mining: 25
    lumberjacking: 15   # For logs if needed
    strength: 30
    health: 25
  
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "pickaxe"
      count: 1
      enchant: 0
    - item: "axe"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Resource extractor responsible for gathering smelting materials and wood
    
    ⛏️ CRITICAL EXTRACTION MISSION - GATHER WEAPON MATERIALS!
    
    ABSOLUTE PRIORITIES:
    1. Mine iron ore for steel production
    2. Mine coal for smelting fuel
    3. Cut oak trees for hilt wood
    4. Transfer all materials to smelter_agent
    
    EXTRACTION STRATEGY:
    1. observe_environment to find iron rocks, coal deposits, and oak trees
    2. PRIORITY ORDER: Iron rocks → Coal deposits → Oak trees
    3. Mine iron ore: harvest_resource on iron rock instances (level 10 requirement)
    4. Mine coal: harvest_resource on coal deposit instances (level 1 requirement)
    5. Cut logs: harvest_resource on oak tree instances (level 1 requirement)
    6. TARGET MATERIALS: 3x ironore + 3x coal + 1x logs
    7. If resources not visible, move to different areas:
       - move_character(x=150, y=450) for mining area
       - move_character(x=250, y=350) for coal deposits
       - move_character(x=126, y=23) for oak trees
    8. Check inventory after each extraction
    9. Use global chat to report extraction progress
    10. Once materials collected, coordinate with smelter_agent
    11. Move to agreed meetup location for material transfer
    12. transfer_items to give all materials to smelter_agent
    13. Wait for confirmation and support until sword completion
    
    MATERIAL REQUIREMENTS:
    - 3x ironore (for 3x ironbar total)
    - 3x coal (smelting fuel)
    - 1x logs (for hilt crafting)
    
    ERROR PREVENTION:
    - Verify correct tools equipped for each resource type
    - Check skill levels before attempting extraction
    - REMEMBER: Iron + Coal → bars, Logs → hilt component

agent_2:
  username: "smelter_agent"
  new_character: true
  role: "Component Forger"
  
  location:
    x: 233
    y: 175
  
  skill_levels:
    smithing: 25      # For smelting and hilt crafting
    strength: 25
    health: 20
  
  inventory_items:
    - item: "flask"
      count: 8
    - item: "apple"
      count: 12
  
  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Component forger responsible for creating sword components
    
    🔥 CRITICAL FORGING MISSION - CREATE SWORD COMPONENTS!
    
    ABSOLUTE PRIORITIES:
    1. Receive raw materials from miner_agent
    2. Smelt iron bars from ore and coal
    3. Forge sword hilt from iron bar and logs
    4. Transfer components to weapon_smith_agent
    
    COMPONENT FORGING STRATEGY:
    1. send global chat message announcing readiness for materials
    2. Coordinate with miner_agent for material transfer
    3. observe_environment to verify materials received
    4. Smelt iron bars (need 3 total):
       📋 SMELTING: craft_item skill=Smelting itemKey=ironbar (1x ironore + 1x coal → 1x ironbar)
    5. Repeat smelting 3 times for 3x ironbar
    6. Forge sword hilt:
       📋 SMITHING: craft_item skill=Smithing itemKey=hilt2 (1x ironbar + 1x logs → 1x hilt2)
    7. observe_environment to verify components created
    8. FINAL COMPONENTS: 2x ironbar + 1x hilt2
    9. Use global chat to report component completion
    10. Coordinate with weapon_smith_agent for component transfer
    11. Move to weapon smith location
    12. transfer_items to give components to weapon_smith_agent
    13. Wait for confirmation and support until sword completion
    
    COMPONENT REQUIREMENTS:
    - 3x ironore + 3x coal → 3x ironbar
    - 1x ironbar + 1x logs → 1x hilt2
    - Final output: 2x ironbar + 1x hilt2
    
    ERROR PREVENTION:
    - Verify each smelting operation success
    - Check inventory carefully between steps
    - Ensure correct component counts before transfer

agent_3:
  username: "weapon_smith_agent"
  new_character: true
  role: "Master Weapon Smith"
  
  location:
    x: 259
    y: 184
  
  skill_levels:
    smithing: 30      # For heavy sword crafting
    strength: 35
    health: 25
    defense: 25
  
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Master weapon smith responsible for heavy sword assembly
    
    ⚔️ PRIORITY ACTIONS:
    1. Coordinate with smelter_agent to receive sword components
    2. Assemble heavy sword from iron bars and hilt
    3. Quality control and weapon testing
    4. Equip the sword and declare completion
    
    WEAPON ASSEMBLY COORDINATION:
    1. send global chat message announcing weapon smithing readiness
    2. Wait for smelter_agent to report component completion
    3. Coordinate meetup for component transfer
    4. Move to agreed location to receive components
    5. observe_environment to verify components received
    
    CRITICAL ASSEMBLY STEPS:
    6. BEFORE crafting, use observe_environment to CHECK YOUR INVENTORY
    7. VERIFY you have 2x ironbar AND 1x hilt2
    8. ONLY AFTER verifying components, use craft_item:
       📋 RECIPE: craft_item skill=Smithing itemKey=sword2 (2x ironbar + 1x hilt2 → 1x heavy sword)
    9. WAIT for craft_item result - confirm "Successfully crafted" message
    10. observe_environment to verify heavy sword in inventory
    11. equip_item to equip the heavy sword
    12. observe_environment to verify sword is equipped
    13. Use global chat to declare "Heavy sword forged and equipped successfully!"
    14. complete() ONLY after successful sword creation and equipping
    
    COMPONENT REQUIREMENTS:
    ✅ 2x ironbar (from smelter_agent)
    ✅ 1x hilt2 (from smelter_agent)
    ✅ Smithing skill level 1+ (you have level 30)
    
    ERROR PREVENTION:
    - Verify all component transfers completed
    - Check inventory before attempting crafting
    - Confirm weapon equipping after assembly
    - Coordinate timing with component forger

# Success criteria for multi-agent task
success_criteria:
  - "miner_agent successfully extracts and transfers all required materials"
  - "smelter_agent successfully creates sword components and transfers to smith"
  - "weapon_smith_agent receives components and forges heavy sword"
  - "weapon_smith_agent successfully equips the heavy sword"
  - "All agents coordinate complex metallurgy operations effectively"
  - "Advanced weapon crafting completes within time limit"
