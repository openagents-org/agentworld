# AgentWorld Multi-Agent Task Configuration

task:
  name: "Grand Archery Competition - Arrow & Bow Production"
  description: "Six archery specialists mass-produce arrows, craft bows, and prepare for grand competition"

# Task objectives
objectives:
  primary: "Produce archery arsenal: 50+ arrows, 5+ bows, all supporting equipment"
  secondary:
    - "Materials (Rounds 1-15): Gather feathers, logs, strings, ores"
    - "Production (Rounds 16-35): Craft sticks, strings, base items"
    - "Assembly (Rounds 36-47): Mass arrow production, bow crafting"
    - "Competition (Rounds 48-50): Display complete archery arsenal"

# Context and guidance for agents
relevant_game_context: |
  COMPETITION OVERVIEW
  - Produce ≥50 arrows and ≥5 bows for the grand event by Round 50. Two hunters collect feathers, two lumberjacks harvest logs, and the hub pair (Arrow_Crafter + Bow_Crafter) converts everything into sticks/arrows/bows.

  TIMELINE
  1. R1-15 Gathering: Feather teams hunt chickens/birds near (350,250) until the shared feather tally hits 50+. Lumberjacks log the western forest (~250,350) for at least 15 logs while confirming whether extra string or logs are needed.
  2. R16-28 Delivery: All gatherers march to the hub (528,384) in ≤32-tile hops, announcing positions. Transfer logs + feathers to Arrow_Crafter; strings/logs destined for bows go to Bow_Crafter. Run verify_inventory after every transfer.
  3. R29-45 Production: Arrow_Crafter turns logs → sticks (craft_item Fletching stick) then crafts arrows in 10-piece batches until 50+ arrows exist, reporting progress per batch. Bow_Crafter uses string/logs to craft wooden bows (and optional golden bows if gold bars happen to exist).
  4. R46-50 Verification: Publish final counts (“Arrows 50+, Bows 5+”), stage them for the competition, then call complete().

  EXECUTION NOTES
  - Without observe_environment, sweep the hunting/forest grids manually; rely on harvest_resource/attack_entity feedback to confirm success.
  - Keep a running group checklist (“Feathers 35/50”, “Logs 10/15”) to synchronize harvesting efforts.
  - If string shortages appear, assign one lumberjack to hunt spiders or forage vines mid-way and announce when the quota is reached.
# Limitations
max_action_steps: 50

