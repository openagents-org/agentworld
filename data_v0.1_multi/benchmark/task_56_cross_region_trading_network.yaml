# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cross-Region Trading Network - Multi-Biome Resource Consolidation"
  description: "Seven agents establish a trading network across five different regions, gathering unique resources and consolidating them for advanced crafting"

# Task objectives
objectives:
  primary: "Establish a cross-region trading network to gather resources from 5 different biomes and craft 3x Golden Rings, 2x Lightning Staffs, and 1x Heavy Sword"
  secondary:
    - "Phase 1 (Rounds 1-15): Regional Resource Gathering - Each team gathers biome-specific resources"
    - "Phase 2 (Rounds 16-30): Cross-Region Travel & Trading - Consolidate materials with designated crafters"
    - "Phase 3 (Rounds 31-45): Collaborative Crafting - Create intermediate and final items"
    - "Phase 4 (Rounds 46-52): Final Assembly & Verification - Complete all crafting objectives"

# Context and guidance for agents
relevant_game_context: |
  GOAL SNAPSHOT
  - Seven agents operate in three pods: Forest (logs), Mountain (gold ore + coal), Coast (beads + lightningbeads), and a central crafting duo. After gathering, everyone meets at (528,384) to smelt/craft: 3 gold rings, 2 lightning staffs, and 1 heavy sword within ~50 rounds.

  PHASE OUTLINE
  1. R1-15 Gather
     • Forest pair harvest 15 logs and convert some to sticks if time permits.
     • Mountain pair mine ≥8 gold ore and ≥10 coal (iron can be added later if no bars exist).
     • Coastal runner forages 5 beads and hunts until 2 lightningbeads drop (starts patrolling 860–940,360–440).
  2. R16-30 Travel + Transfers
     • Pods hop ≤32 tiles per move toward the hub, posting coordinates after each hop.
     • Transfer order: Forest → Crafter_Magic (logs), Mountain → Crafter_Gold (ore/coal), Coast → Crafter_Magic (beads). Each transfer uses transfer_items with verify_inventory confirmations logged in chat.
  3. R31-45 Crafting
     • Crafter_Gold smelts goldbar (goldore+coal) then crafts 3 goldrings and, once ironbars exist, a sword2 (Heavy Sword). If no ironbars are available, send a miner back for a quick 2‑ore/2‑coal run.
     • Crafter_Magic turns logs into sticks, crafts 2 staffs (5 sticks + bead each), then upgrades them with lightningbeads into 2 lightningstaffs.
  4. R46-52 Verification
     • Both crafters list their finished items, distribute them if desired, and summarize the campaign before calling complete().

  EXECUTION NOTES
  - When observe_environment is missing, sweep the listed coordinate bands manually and rely on harvest_resource/attack_entity success plus inventory checks for feedback.
  - Keep one chat thread for resource totals (“Forest logs 12/15”, “Gold bars 4/6”) so the hub knows when to expect deliveries.
  - If lightningbeads prove stubborn, log every attempt; one bead is acceptable for minimum success, but try for two.

  COMPLETION CHECKLIST
  - Verified inventories show: 3 goldrings, 2 lightningstaffs, 1 heavy sword (or the iron + hilt needed if the sword was crafted last-minute).
  - Each pod states its final contribution via chat, then the designated leader calls complete() with a short phase summary.
# Limitations
max_action_steps: 52

