# Success criteria for multi-agent task
success_criteria:
  - "Phase 1: Forest Team gathers 15+ logs from Western Forest region"
  - "Phase 1: Mountain Team mines 8+ gold ore and 10+ coal from Northern Mountains"
  - "Phase 1: Coastal Team forages 5+ beads and obtains 2+ lightningbead from Eastern Coast"
  - "Phase 2: All teams travel to Central Hub (528, 384) covering 1000+ total tiles"
  - "Phase 2: Teams execute sequential transfer protocol without deadlocks"
  - "Phase 2: Crafter_Gold receives 8 gold ore, 10 coal, maintains 2 hilt2"
  - "Phase 2: Crafter_Magic receives 15 logs, 5 beads, 2 lightningbead"
  - "Phase 3: Crafter_Gold smelts 6+ gold bars from gold ore and coal"
  - "Phase 3: Crafter_Magic crafts 12+ sticks from logs"
  - "Phase 3: Crafter_Gold crafts exactly 3x Gold Rings from gold bars"
  - "Phase 3: Crafter_Magic crafts 2x Magic Staffs from sticks and beads"
  - "Phase 3: Crafter_Magic upgrades 2x Magic Staffs to Lightning Staffs"
  - "Phase 3: Crafter_Gold crafts 1x Heavy Sword from iron bars and hilt"
  - "Phase 4: Final verification confirms 3 gold rings, 2 lightning staffs, 1 heavy sword"
  - "All agents use chat extensively throughout all 4 phases for coordination"
  - "All transfers completed successfully using transfer_items function"
  - "Task completed in 48-52 rounds demonstrating efficient cross-region coordination"
  - "Trading network successfully established across 5 different biomes"
