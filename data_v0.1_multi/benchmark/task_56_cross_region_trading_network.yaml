# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cross-Region Trading Network - Multi-Biome Resource Consolidation"
  description: "Seven agents establish a trading network across five different regions, gathering unique resources and consolidating them for advanced crafting"

# Task objectives
objectives:
  primary: "Establish a cross-region trading network to gather resources from 5 different biomes and craft 3x Golden Rings, 2x Lightning Staffs, and 1x Heavy Sword"
  secondary:
    - "Phase 1 (Rounds 1-15): Regional Resource Gathering - Each team gathers biome-specific resources"
    - "Phase 2 (Rounds 16-30): Cross-Region Travel & Trading - Consolidate materials with designated crafters"
    - "Phase 3 (Rounds 31-45): Collaborative Crafting - Create intermediate and final items"
    - "Phase 4 (Rounds 46-52): Final Assembly & Verification - Complete all crafting objectives"

# Context and guidance for agents
relevant_game_context: |
  This is an advanced multi-region coordination task requiring strategic resource gathering, long-distance travel, and complex trading chains.

  🚨 CRITICAL AWARENESS - CROSS-REGION COORDINATION:
  - ALWAYS use chat to coordinate movements and resource status
  - ALWAYS verify inventory before and after transfers using verify_inventory
  - Prefer verify_inventory and check_inventory_status to confirm what you carry
  - TOOLING REALITY: observe_environment may be an internal helper and not exposed as a callable tool. If unavailable, navigate using move_character and the waypoints below, and use harvest_resource/attack_entity directly when targets are visible. Rely on tool responses and inventory checks to guide next steps
  - If a tool returns “Unknown tool”, adapt immediately using the exposed tools: move_character, harvest_resource, attack_entity, craft_item, transfer_items, chat, verify_inventory, check_inventory_status, sleep
  - Maximum movement per action: 32 tiles (plan multi-step journeys)
  - Teams are spread across 5 different biomes - coordination is essential
  - This task requires 50+ rounds - pace yourselves and plan carefully

  🔁 RELIABLE HARVEST PROCEDURE (distance/sync safe):
  - Move to one of the four adjacent tiles around the target resource (x±1,y) or (x,y±1)
  - After moving, wait briefly (1–2s) if needed, then call harvest_resource(targetInstance=…)
  - If you get “Too far from resource”, step onto the exact resource tile and retry once
  - If still failing, switch to a nearby resource and report via chat

  🛠️ EXPOSED TOOLS QUICK REFERENCE:
  - move_character(x,y): ≤32‑tile steps for travel
  - harvest_resource(targetInstance): trees/rocks/plants/fish; auto‑move nearby
  - attack_entity(targetInstance): auto‑moves adjacent, fights, then moves to loot tile
  - craft_item(skill,itemKey[,count]): crafting/smelting/fletching
  - transfer_items(targetPlayer,itemKey,count): send items to exact username
  - chat(message): global team coordination
  - verify_inventory(required_items) / check_inventory_status(): validate inventory
  - sleep(seconds): 1–2s pauses to ensure server position sync when needed

  🎯 OVERALL OBJECTIVE:
  Team must gather resources from 5 different biomes and craft:
  - 3x Gold Rings (requires 6x goldbar total)
  - 2x Lightning Staffs (requires 2x staff, 2x lightningbead)
  - 1x Heavy Sword (requires 2x ironbar, 1x hilt2)

  📍 AGENT ASSIGNMENTS & STARTING LOCATIONS:

  **FOREST TEAM (Agents 1-2)**: Western Forest Region (250, 350)
  - Objective: Gather 15+ logs from Oak Trees
  - Resources: Oak Trees abundant in this region
  - Role: Lumber suppliers for stick crafting

  **MOUNTAIN TEAM (Agents 3-4)**: Northern Mountains (230, 38)
  - Objective: Mine 8+ gold ore and 10+ coal
  - Resources: Gold deposits and coal rocks
  - Role: Gold ore suppliers for gold bar smelting

  **COASTAL TEAM (Agent 5)**: Eastern Coast (900, 400)
  - Objective: Forage 5+ beads, hunt for 2+ lightningbead
  - Resources: Magical items from beach mobs
  - Role: Magic component supplier

  **CRAFTING HUB (Agents 6-7)**: Central Kingdom (528, 384)
  - Objective: Receive all materials and coordinate crafting
  - Resources: Central location for consolidation
  - Role: Master crafters and coordinators

  🧭 WAYPOINT NAVIGATION (useful when scans aren’t available):
  - Spawn region to Forest start: from (~250,180) move north to (~250,350), staying within 32‑tile hops
  - Spawn region to Mountain start: from (~250,180) move NE to (~230,40)
  - Spawn region to Coastal start: from (~250,180) move east in hops toward (~900,400)
  - All teams to Hub: converge to (528,384) in ≤32‑tile steps, sharing position via chat each hop
  - Confirm progress with check_inventory_status and team chat

  ✅ START-OF-PHASE CHECKS (Rounds 1–2):
  - Everyone: check_inventory_status and share coordinates in chat
  - Mountain_Miner_1: confirm ironbar count (starts with 3); do NOT spend unless Heavy Sword path is ready
  - Crafter_Gold: confirm hilt2 (2x) present
  - Forest team: confirm axes equipped; if unequipped, plan movement/harvest first then re-check

  ═══════════════════════════════════════════════════════════
  PHASE 1: REGIONAL RESOURCE GATHERING (Rounds 1-15)
  ═══════════════════════════════════════════════════════════

  🎯 OBJECTIVES:
  - Forest Team: Gather 15+ logs
  - Mountain Team: Mine 8+ gold ore, 10+ coal
  - Coastal Team: Gather 5+ beads, hunt for lightningbead
  - Crafting Hub: Prepare for receiving materials, verify starting inventory

  🪓 FOREST TEAM INSTRUCTIONS (Agents 1-2):

  1. Starting position: (250, 350) - Western Forest
  2. If observe_environment is unavailable, spread out slightly and look for trees by moving in a grid; once tree instances are visible, follow the reliable harvest procedure
  3. Each agent should harvest 7-8 logs using harvest_resource
  4. Use chat frequently: "Forest Team: Harvested X/15 logs"
  5. Once 15+ logs collected, prepare for Phase 2 transfer
  6. Stay together within 10 tiles for coordination
  7. Use sleep(1–2s) after long moves before harvesting to avoid sync errors

  Example harvest:
  - Agent 1: observe_environment → find Oak Tree instance → harvest_resource targetInstance=<tree_id>
  - Agent 2: Do same for different trees
  - Repeat until 15+ logs total

  ⛏️ MOUNTAIN TEAM INSTRUCTIONS (Agents 3-4):

  1. Starting position: (230, 38) - Northern Mountains
  2. If observe_environment is unavailable, sweep the slopes between (~220–280, 20–80) and mine any gold/coal rocks you see; use the reliable harvest procedure to avoid distance errors
  3. Gold ore requires Mining 25+: Agent 3 focuses on gold (8+ ore)
  4. Coal requires Mining 1+: Agent 4 focuses on coal (10+ ore)
  5. Use chat: "Mountain Team: Gold X/8, Coal Y/10"
  6. Critical: Both agents must gather before Phase 2 travel
  7. Use sleep(1–2s) after long moves before harvesting to avoid sync errors

  Mining process:
  - Use observe_environment to locate "gold rock" or "coal rock"
  - Use harvest_resource targetInstance=<rock_id>
  - Each rock may yield 1-3 ore
  - Continue until quotas met

  🏖️ COASTAL TEAM INSTRUCTIONS (Agent 5):

  1. Starting position: (900, 400) - Eastern Coast
  2. If observe_environment is unavailable, patrol along the shoreline band (~860–940, 360–440) to find foraging spots and low‑level mobs
  3. Forage 5+ beads from plants/spots using harvest_resource
  4. Then hunt low-level mobs (crabs, rats) for lightningbead drops
  5. Need 2+ lightningbead minimum (may require 10+ mob kills)
  6. Use chat: "Coastal Team: Beads X/5, Lightning Beads Y/2"
  7. This agent works solo - extra communication important
  8. Combat tips: move adjacent, optionally sleep(1s), then attack_entity; after combat, if loot isn’t in inventory, try moving onto the mob tile or continue hunting

  Hunting strategy:
  - observe_environment radius=32 to find mobs (crab, rat level 1-5)
  - attack_entity targetInstance=<mob_id>
  - Check drops after each kill
  - Heal using starting apples/flasks when HP < 70%

  🏛️ CRAFTING HUB INSTRUCTIONS (Agents 6-7):

  1. Starting position: (528, 384) - Central Kingdom
  2. Rounds 1-15: Stay at hub, monitor chat communications
  3. Use verify_inventory to check starting materials
  4. Agent 6 should verify: Has hilt2? (needed for Heavy Sword)
  5. Agent 7 should prepare crafting skill levels
  6. Coordinate via chat: "Hub ready. Waiting for materials from all teams."
  7. Track incoming resources via chat updates

  ⏱️ PHASE 1 TIME ALLOCATION:
  - Rounds 1-5: Teams locate and start gathering resources
  - Rounds 6-12: Continue gathering, reach quotas
  - Rounds 13-15: Teams verify totals, prepare for Phase 2

  ═══════════════════════════════════════════════════════════
  PHASE 2: CROSS-REGION TRAVEL & TRADING (Rounds 16-30)
  ═══════════════════════════════════════════════════════════

  🎯 OBJECTIVES:
  - All gathering teams travel to Central Hub (528, 384)
  - Transfer all gathered materials to Crafting Hub agents
  - Verify all transfers completed successfully
  - Begin smelting gold bars

  🗺️ TRAVEL COORDINATION:

  **Forest Team (250, 350) → Hub (528, 384)**:
  - Distance: ~325 tiles
  - Required moves: 11+ actions (32 tiles per move maximum)
  - Route: Move east and slightly south
  - Agents 1-2: move_character x=282 y=350 (first move)
  - Continue: move_character x=314 y=360, then x=346 y=367, etc.
  - Use chat each move: "Forest Team at (X,Y), carrying 15 logs"

  **Mountain Team (230, 38) → Hub (528, 384)**:
  - Distance: ~450 tiles
  - Required moves: 15+ actions
  - Route: Move south-east toward center
  - Agents 3-4: move_character x=262 y=70 (first move)
  - Continue incrementally, chat position each move
  - Use chat: "Mountain Team at (X,Y), carrying 8 gold ore, 10 coal"

  **Coastal Team (900, 400) → Hub (528, 384)**:
  - Distance: ~372 tiles
  - Required moves: 12+ actions
  - Route: Move west toward center
  - Agent 5: move_character x=868 y=392 (first move)
  - Continue westward, update position frequently
  - Use chat: "Coastal Team at (X,Y), carrying 5 beads, 2 lightning beads"

  🔄 TRANSFER PROTOCOL (CRITICAL - AVOID DEADLOCK):

  1. **Arrival Confirmation**:
     - Each team announces arrival: "X Team arrived at Hub!"
     - If observe_environment is unavailable, visually confirm proximity by sharing positions in chat and moving within 5 tiles of the hub marker
     - All agents must be within 5 tiles for transfers

  2. **Material Consolidation Plan**:
     - Agent 6 (Crafter_Gold): Receives all gold ore, coal, and 1 hilt2
     - Agent 7 (Crafter_Magic): Receives all logs, beads, lightning beads
     - This division prevents crafting conflicts

  3. **Transfer Sequence** (MUST FOLLOW THIS ORDER):

     Round 16-18: Forest Team transfers
     - Agent 1: transfer_items targetPlayer=Crafter_Magic itemKey=logs count=8
     - Agent 2: transfer_items targetPlayer=Crafter_Magic itemKey=logs count=7
     - Crafter_Magic: verify_inventory (confirm 15 logs received)
     - Chat confirmation: "Logs transferred: 15/15 ✓"
     (Use exact usernames and correct itemKey spellings: logs, goldore, coal, bead, lightningbead)

     Round 19-21: Mountain Team transfers
     - Agent 3: transfer_items targetPlayer=Crafter_Gold itemKey=goldore count=8
     - Agent 4: transfer_items targetPlayer=Crafter_Gold itemKey=coal count=10
     - Crafter_Gold: verify_inventory (confirm receipt)
     - Chat confirmation: "Gold ore transferred: 8/8 ✓, Coal: 10/10 ✓"

     Round 22-24: Coastal Team transfers
     - Agent 5: transfer_items targetPlayer=Crafter_Magic itemKey=bead count=5
     - Agent 5: transfer_items targetPlayer=Crafter_Magic itemKey=lightningbead count=2
     - Crafter_Magic: verify_inventory (confirm receipt)
     - Chat confirmation: "Beads transferred: 5/5 ✓, Lightning: 2/2 ✓"

  4. **Verification Round** (Round 25):
     - Crafter_Gold: verify_inventory
       Expected: 8+ goldore, 10+ coal, 1+ hilt2
     - Crafter_Magic: verify_inventory
       Expected: 15+ logs, 5+ bead, 2+ lightningbead
     - Both agents chat: "Materials verified. Ready for Phase 3 crafting."

  ⏱️ PHASE 2 TIME ALLOCATION:
  - Rounds 16-20: Travel to hub
  - Rounds 21-28: Execute transfers in sequence
  - Rounds 29-30: Verify all materials, prepare crafting

  ⏱️ EXECUTION SAFETY (keep scope, improve reliability):
  - If a harvest attempt fails twice due to distance, reposition one tile and retry; otherwise switch target and report in chat
  - Keep transfers strictly ordered; if a transfer fails, immediately verify_inventory on both sender and receiver and retry once before escalating in chat
  - By Round 40, prioritize crafting the required final items with whatever valid inputs are consolidated; defer optional buffers

  🔑 CRAFTING ITEM KEYS (recap):
  - Smelting: goldbar (from goldore + coal)
  - Rings: goldring (from goldbar x2)
  - Sticks: stick (from logs via Fletching)
  - Staffs: staff (from sticks + bead)
  - Upgrades: lightningstaff (from staff + lightningbead)
  - Heavy Sword: sword2 (from ironbar x2 + hilt2)

  ═══════════════════════════════════════════════════════════
  PHASE 3: COLLABORATIVE CRAFTING (Rounds 31-45)
  ═══════════════════════════════════════════════════════════

  🎯 OBJECTIVES:
  - Smelt 8x gold bars from gold ore
  - Craft intermediate items: 3x gold rings, 2x magic staffs
  - Craft final items: 2x lightning staffs, 1x heavy sword
  - Verify all crafting objectives completed

  🔥 SMELTING OPERATIONS (Agent 6 - Crafter_Gold):

  Rounds 31-34: Smelt Gold Bars
  - Recipe: 1x goldore + 1x coal → 1x goldbar
  - Required: 8x goldbar total (for 4x gold rings, but we only need 3)
  - Actually need: 6x goldbar for 3x gold rings

  Process:
  1. verify_inventory (confirm have 8 goldore, 10 coal)
  2. craft_item skill=Smelting itemKey=goldbar
     - This uses 1 goldore + 1 coal → makes 1 goldbar
  3. Repeat 6 times (or 8 for buffer)
  4. After each craft, chat: "Smelted X/6 gold bars"
  5. verify_inventory (confirm have 6+ goldbar)

  🪄 STICK CRAFTING (Agent 7 - Crafter_Magic):

  Rounds 31-34: Create Sticks from Logs
  - Recipe: 1x logs → 4x sticks (using Fletching)
  - Need: 10x sticks for 2x magic staffs (5 sticks each)
  - Must craft 3 times: 3 logs → 12 sticks

  Process:
  1. verify_inventory (confirm have 15+ logs)
  2. craft_item skill=Fletching itemKey=stick
     - This uses 1 log → makes 4 sticks
  3. Repeat 3 times
  4. Chat: "Crafted X/12 sticks"
  5. verify_inventory (confirm have 12+ sticks)

  💍 GOLD RING CRAFTING (Agent 6):

  Rounds 35-37: Craft Gold Rings
  - Recipe: 2x goldbar → 1x goldring (using Smithing)
  - Need: 3x gold rings
  - Must craft 3 times: 6 goldbar → 3 gold rings

  Process:
  1. verify_inventory (confirm have 6+ goldbar)
  2. craft_item skill=Smithing itemKey=goldring
  3. Repeat 3 times
  4. Chat: "Crafted X/3 gold rings"
  5. verify_inventory (confirm have 3 gold rings)

  🔮 MAGIC STAFF CRAFTING (Agent 7):

  Rounds 35-37: Craft Base Magic Staffs
  - Recipe: 5x stick + 1x bead → 1x staff (using Crafting)
  - Need: 2x magic staffs (for lightning staff upgrades)
  - Must craft 2 times: 10 sticks + 2 beads → 2 staffs

  Process:
  1. verify_inventory (confirm have 10+ sticks, 5+ beads)
  2. craft_item skill=Crafting itemKey=staff
  3. Repeat 2 times
  4. Chat: "Crafted X/2 magic staffs"
  5. verify_inventory (confirm have 2 staffs)

  ⚡ LIGHTNING STAFF UPGRADES (Agent 7):

  Rounds 38-40: Upgrade to Lightning Staffs
  - Recipe: 1x staff + 1x lightningbead → 1x lightningstaff (Crafting lvl 10)
  - Need: 2x lightning staffs
  - Must craft 2 times

  Process:
  1. verify_inventory (confirm have 2 staffs, 2 lightningbead)
  2. craft_item skill=Crafting itemKey=lightningstaff
  3. Repeat 2 times
  4. Chat: "Crafted X/2 lightning staffs ⚡"
  5. verify_inventory (confirm have 2 lightning staffs)

  ⚔️ HEAVY SWORD CRAFTING (Agent 6):

  Rounds 38-40: Craft Heavy Sword
  - Recipe: 2x ironbar + 1x hilt2 → 1x sword2 (Heavy Sword)
  - Problem: Need 2x ironbar but we didn't gather iron!
  - Solution: Check starting inventory - some agents start with iron

  Process:
  1. ALL agents check inventory for ironbar
  2. If no ironbar in team, must mine iron ore:
     - Agent 3 or 4: Travel back to mountains (230, 38)
     - Mine 2+ iron ore + 2+ coal
     - Travel back to hub
     - Transfer to Crafter_Gold
     - Crafter_Gold: Smelt iron bars
  3. Once have 2 ironbar:
     - craft_item skill=Smithing itemKey=sword2
  4. verify_inventory (confirm have 1 heavy sword)
  5. Chat: "Heavy Sword crafted! ⚔️"

  ⏱️ PHASE 3 TIME ALLOCATION:
  - Rounds 31-34: Smelting and stick crafting
  - Rounds 35-37: Ring and staff crafting
  - Rounds 38-42: Lightning staff and heavy sword
  - Rounds 43-45: Handle any iron gathering if needed

  ═══════════════════════════════════════════════════════════
  PHASE 4: FINAL VERIFICATION (Rounds 46-52)
  ═══════════════════════════════════════════════════════════

  🎯 OBJECTIVES:
  - Verify all crafting objectives completed
  - Distribute final items among team
  - Complete comprehensive team summary
  - Celebrate successful cross-region trading network

  ✅ VERIFICATION CHECKLIST:

  Round 46-47: Inventory Verification
  - Crafter_Gold: verify_inventory
    Must have: 3x goldring, 1x sword2 (Heavy Sword)
  - Crafter_Magic: verify_inventory
    Must have: 2x lightningstaff

  Round 48-49: Team Communication
  - Each agent reports final contribution:
    * Agent 1-2: "Forest Team: Delivered 15 logs ✓"
    * Agent 3-4: "Mountain Team: Delivered 8 gold ore, 10 coal ✓"
    * Agent 5: "Coastal Team: Delivered 5 beads, 2 lightning beads ✓"
    * Agent 6: "Crafter_Gold: Made 3 gold rings, 1 heavy sword ✓"
    * Agent 7: "Crafter_Magic: Made 2 lightning staffs ✓"

  Round 50-51: Distribution (Optional)
  - Transfer final items to requesting agents
  - Example: Lightning staffs to magic users
  - Gold rings to anyone who wants them
  - Heavy sword to warrior

  Round 52: Task Completion
  - Designated leader (Agent 6 or 7) uses complete():

  complete response="Cross-region trading network successfully established!

  PHASE SUMMARY:
  - Phase 1: All teams gathered biome-specific resources (15 logs, 8 gold ore, 10 coal, 5 beads, 2 lightning beads)
  - Phase 2: Teams traveled from 5 different regions to Central Hub, executed perfect transfer sequence
  - Phase 3: Crafted all objectives - 3x Gold Rings, 2x Lightning Staffs, 1x Heavy Sword
  - Phase 4: Verified success, distributed items

  FINAL ITEMS CRAFTED:
  ✓ 3x Gold Ring (6 gold bars used)
  ✓ 2x Lightning Staff (2 staffs upgraded)
  ✓ 1x Heavy Sword (2 iron bars + hilt)

  Total rounds: 52
  Total distance traveled: 1000+ tiles across 5 regions
  Total items crafted: 6 items (plus intermediates: 6 gold bars, 12 sticks, 2 staffs)

  Team coordination: Excellent - no deadlocks, perfect material consolidation!
  Cross-region trading network: OPERATIONAL ✓"

  🚨 CRITICAL SUCCESS CRITERIA:

  DO NOT use complete() unless ALL requirements met:
  ✓ All 3 gold rings crafted (verify_inventory confirms)
  ✓ Both 2 lightning staffs crafted (verify_inventory confirms)
  ✓ 1 heavy sword crafted (verify_inventory confirms)
  ✓ All agents communicated throughout all 4 phases
  ✓ No agents lost or separated permanently
  ✓ Task completed in 48-52 rounds (not rushed, not too slow)

  ⚠️ DEADLOCK PREVENTION:

  1. **Travel Deadlock**: If agent stuck during travel
     - Use observe_environment to check surroundings
     - Try alternate route (move around obstacles)
     - Ask other agents for location confirmation

  2. **Transfer Deadlock**: If transfers fail
     - Verify both agents within 5 tiles using observe_environment
     - Confirm receiver name matches exactly (case-sensitive)
     - Use verify_inventory to check sender has items
     - Re-attempt transfer with correct parameters

  3. **Crafting Deadlock**: If crafting fails
     - verify_inventory to check materials present
     - Check skill level requirements (may need higher level)
     - Verify exact itemKey spelling
     - Check if recipe requires different materials

  4. **Communication Deadlock**: If team loses coordination
     - Every agent should chat status every 3-5 rounds
     - Use standardized format: "[Team] at (X,Y): status"
     - If no response from agent, continue without them
     - Other agents can compensate by gathering more

  🎯 COORDINATION STRATEGY:

  - Use chat CONSTANTLY (minimum every 3 rounds)
  - Always verify_inventory before claiming to have items
  - Stay within 5 tiles when doing transfers
  - Plan travel routes before moving (calculate distance)
  - Crafters should confirm receipt before senders leave
  - If something fails, communicate and adapt - don't give up!

  📊 SUCCESS METRICS:
  - Primary: All 6 final items crafted (3 rings, 2 staffs, 1 sword)
  - Secondary: Completed in 48-52 rounds
  - Tertiary: All 7 agents survive and participate
  - Bonus: Perfect transfer execution (no failed transfers)

# Limitations
