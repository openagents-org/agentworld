# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Already has jellyfish and bowl, just need to combine

task:
  name: "Cooperative Jellyfish Smoothie - Quick Exotic Beverage"
  description: "Two agents work together to create a jellyfish smoothie with pre-gathered materials"

# Task objectives
objectives:
  primary: "Create a jellyfish smoothie through coordinated beverage preparation"
  secondary: # checkpoints
    - "Transfer materials to beverage specialist"
    - "Complete exotic beverage creation within 15 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a simplified cooperative multi-agent exotic beverage creation scenario.

  OBJECTIVE: Create a jellyfish smoothie using pre-gathered materials.

  CRITICAL: Materials are already available!
  - marine_fisher_agent has 1x jellyfish
  - container_maker_agent has 1x bowlsmall

  TEAM COORDINATION:
  - Transfer jellyfish and bowl to beverage_specialist_agent
  - beverage_specialist_agent crafts the smoothie

  CRAFTING RECIPE:
  🎐 Cooking Recipe - jellyfishsmoothie:
    - craft_item skill=Cooking itemKey=jellyfishsmoothie
    - Materials: 1x jellyfish + 1x bowlsmall → 1x jellyfishsmoothie
    - Level required: 10 (Cooking skill) - ADVANCED COOKING!

  DO NOT use complete() until jellyfishsmoothie is created!

# Limitations
max_action_steps: 15

