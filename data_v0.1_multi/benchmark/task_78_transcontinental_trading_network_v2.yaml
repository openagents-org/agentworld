# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Extended 12-agent transcontinental trading empire

task:
  name: "Transcontinental Trading Network - Grand Continental Trade Empire"
  description: "Twelve agents establish a massive trading network across 8 regions, craft 8 diverse items requiring materials from all regions"

# Task objectives
objectives:
  primary: "Establish a transcontinental trading empire where 12 agents gather resources from 8 regions, consolidate at multiple hubs, and craft 8 cross-regional items"
  secondary:
    - "Phase 1 (Rounds 1-15): Regional Resource Gathering across 8 biomes"
    - "Phase 2 (Rounds 16-26): Travel to 3 Regional Hubs"
    - "Phase 3 (Rounds 27-38): Inter-Hub Trading and Smelting"
    - "Phase 4 (Rounds 39-50): Final Consolidation at Central Point"
    - "Phase 5 (Rounds 51-62): Coordinated Crafting of 8 items"

# Relevant game context
relevant_game_context: |
  SUPPLY CHAIN PLAN
  - Twelve agents harvest materials from eight regions, regroup at three hubs, relay goods to central point (400,250), and craft eight cross-regional items within ~62 rounds.
  - Regions: Forest, Mountain, Coast, Ice, Desert, Plains, Volcano, Swamp.
  - Items to craft: Golden Bow, 2x Golden Ring, 2x Silver Ring, Beryl Pendant, Magic Staff, Wooden Bow.

  EXECUTION NOTES
  - Use transfer_items + verify_inventory for every handoff.
  - Maintain running manifest in chat.
  - Three hubs coordinate before final consolidation.
# Limitations
max_action_steps: 62

