# AgentWorld Multi-Agent Task Configuration

task:
  name: "Grand Mining Expedition - Five-Team Advanced Ore Processing"
  description: "Five agents work together to establish a complete mining and smelting operation, producing advanced metal equipment through coordinated resource gathering and crafting"

# Task objectives
objectives:
  primary: "Establish a complete mining-to-crafting pipeline with five specialized agents to produce advanced metal equipment"
  secondary: # checkpoints
    - "Coordinate five-agent mining expedition across multiple ore types"
    - "Execute advanced smelting operations with proper fuel management"
    - "Complete coordinated crafting of multiple equipment pieces"
    - "Achieve all objectives within 50 rounds with five-agent coordination"

# Relevant game context (Hint)
relevant_game_context: |
  This is a large-scale cooperative multi-agent mining and crafting scenario requiring complex five-agent coordination.
  
  GRAND OBJECTIVE: Work together as a team of 5 agents to establish a complete mining operation:
  1. Mine iron ore and coal from different locations
  2. Smelt iron bars through coordinated fuel management
  3. Craft multiple equipment pieces (pickaxe, axe, heavy sword)
  4. Distribute equipment among team members for enhanced capabilities
  
  🚨 CRITICAL AWARENESS: Check your actual inventory state before making claims!
  - Use verify_inventory to see what you really have in your inventory
  - Use check_inventory_status frequently to track your current materials
  - DO NOT assume you have materials that aren't verified
  - DO NOT claim transfers happened without actually using transfer_items tool
  - DO NOT just talk about helping - USE THE ACTUAL TOOLS to help!
  
  📋 REQUIRED MATERIALS FOR SUCCESS (TOTAL):
  - EXACTLY 10x ironore needed (mine from Iron Rock instances)
  - EXACTLY 10x coal needed (mine from Coal Rock instances, used as smelting fuel)
  - EXACTLY 3x logs needed (harvest from Oak Trees for tool handles)
  - EXACTLY 10x ironbar needed (smelt from ironore + coal)
  - EXACTLY 1x hilt2 needed (Agent 4 starts with this)
  
  🧮 MATERIAL MATH (CRITICAL - READ CAREFULLY):
  For 1 pickaxe + 1 axe + 1 heavy sword, you need:
  - 10x ironore + 10x coal → smelt 10 times → 10x ironbar
  - 5x ironbar + 1x logs → 1x pickaxe (Agent 4 crafts)
  - 3x ironbar + 1x logs → 1x axe (Agent 4 crafts)
  - 2x ironbar + 1x hilt2 → 1x heavy sword (Agent 4 crafts)
  - Final result: 1x pickaxe + 1x axe + 1x heavy sword
  
  FIVE-AGENT COORDINATION REQUIREMENTS:
  - 📍 STAY CLOSE: Work within 10 tiles of each other for easy transfers
  - 💬 Use global chat (NOT local send_chat_message) to communicate with ALL team members
  - 🔧 USE TOOLS, NOT JUST WORDS: When someone needs items, USE transfer_items immediately
  - ✅ Verify inventory before and after every transfer with verify_inventory
  - 🎯 Be flexible: adapt roles and help wherever needed
  - 🤝 Team must actively transfer items, not just talk about it
  
  MINING OPERATIONS:
  ⛏️ Mining - Iron Ore:
    - harvest_resource on Iron Rock instances to get ironore
    - Level required: 10+ (Mining skill)
    - Tool required: Pickaxe (MUST be equipped)
    - Iron rocks found in mountain regions - look for "Iron Rock" in your observations
    - NOTE: Nisoc Rocks produce nisocore, NOT ironore - find the correct rock type
    - If no Iron Rocks visible at starting location, explore nearby mountain areas
  
  ⛏️ Mining - Coal:
    - harvest_resource on Coal Rock instances to get coal
    - Level required: 1+ (Mining skill)
    - Tool required: Pickaxe (MUST be equipped)
    - Coal rocks commonly found in mountain regions
    - Multiple pieces needed for smelting all iron ore
  
  SMELTING OPERATIONS:
  🔥 Smelting Recipe - ironbar:
    - craft_item skill=Smelting itemKey=ironbar (NO count parameter!)
    - Materials: 1x ironore + 1x coal → 1x ironbar (automatically)
    - Level required: 20 (uses Smithing skill level)
    - Need to produce 10x iron bars total for all equipment
    - Craft syntax: craft_item(skill="Smelting", itemKey="ironbar")
  
  CRAFTING OPERATIONS:
  🔨 Smithing Recipe - pickaxe:
    - craft_item skill=Smithing itemKey=pickaxe (NO count parameter!)
    - Materials: 5x ironbar + 1x logs → 1x pickaxe (automatically)
    - Level required: 5 (Smithing skill)
    - Craft syntax: craft_item(skill="Smithing", itemKey="pickaxe")
  
  🔨 Smithing Recipe - axe:
    - craft_item skill=Smithing itemKey=axe (NO count parameter!)
    - Materials: 3x ironbar + 1x logs → 1x axe (automatically)
    - Level required: 3 (Smithing skill)
    - Craft syntax: craft_item(skill="Smithing", itemKey="axe")
  
  🔨 Smithing Recipe - sword2 (Heavy Sword):
    - craft_item skill=Smithing itemKey=sword2 (NO count parameter!)
    - Materials: 2x ironbar + 1x hilt2 → 1x heavy sword (automatically)
    - Level required: 1 (Smithing skill)
    - Craft syntax: craft_item(skill="Smithing", itemKey="sword2")
  
  🚨 CRITICAL CRAFT SYNTAX:
  - DO NOT use count parameter in any craft_item calls!
  - Recipes automatically consume the correct materials and produce items
  - Wrong: craft_item(skill="Smelting", itemKey="ironbar", count=10)
  - Right: craft_item(skill="Smelting", itemKey="ironbar")
  - If you need 10 ironbars, call craft_item 10 times
  
  🪵 Lumberjacking - logs:
    - harvest_resource on Oak Tree or Oak2 Tree instances to get logs
    - Level required: 1+ (Lumberjacking skill)
    - Tool required: Axe (MUST be equipped)
    - Need 3x logs for tool handles (pickaxe, axe, and sword handle requirements)
    - Look for "Oak", "Oak2", "Oak3", "Oak5" tree types near spawn
    - If one tree doesn't drop logs, try a different tree nearby
    - After calling harvest_resource, the process may take a few seconds to complete
    - Check your inventory after harvest to confirm logs were collected
    - If repeated harvest attempts yield no logs, move to a new tree or confirm with teammates whether the current tree is depleted, and keep a record of exhausted trees to avoid looping
  
  💎 Starting inventory resources (CHECK YOUR INVENTORY):
    - IronMinerAlpha (Agent1): 3x ironore + 2x coal (head start on mining!)
    - CoalMinerBeta (Agent2): 5x coal + 1x logs (fuel specialist!)
    - MasterSmelterGamma (Agent3): 3x ironore + 3x coal (ready to smelt!)
    - EquipmentCrafterDelta (Agent4): 1x hilt2 (needed for heavy sword!)
    - LogisticsCoordinatorEpsilon (Agent5): (gathers logs from scratch)
    - Total starting resources: 6x ironore + 10x coal + 1x logs + 1x hilt2
  
  FIVE-AGENT TEAM ORGANIZATION (Suggested Roles - Be Flexible!):
  - Agent 1 (IronMinerAlpha): Mine iron ore, transfer to smelter
  - Agent 2 (CoalMinerBeta): Mine coal, gather logs, transfer to smelter
  - Agent 3 (MasterSmelterGamma): Collect ore+coal, smelt ironbar, transfer to crafter
  - Agent 4 (EquipmentCrafterDelta): Receive ironbar+logs, craft all equipment
  - Agent 5 (LogisticsCoordinatorEpsilon): Gather logs, coordinate transfers between agents
  
  🚨 KEY INSIGHT: You don't need to gather ALL resources before smelting!
  - Strategy: Start smelting as soon as you have some ore and coal
  - As soon as Agent3 has 5x ironbar + Agent4 has 1x logs → craft pickaxe immediately
  - Continue mining and smelting while Agent4 works on equipment
  - Parallel work = faster completion!
  
  🤝 AFTER YOU FINISH YOUR PERSONAL TASK:
  - DON'T just sit idle or call complete()!
  - Help your teammates: gather more resources, transfer materials, coordinate logistics
  - Example: After Agent1 mines enough iron, help Agent2 mine coal or help Agent5 gather logs
  - Example: After Agent3 smelts 5 bars, keep smelting more for the next equipment
  - Team wins together - no one succeeds alone!
  
  🤝 CRITICAL COORDINATION & ITEM TRANSFERS:
  - 📦 USE transfer_items TOOL to actually move items between agents!
    * Syntax: transfer_items(targetPlayer="EquipmentCrafterDelta", itemKey="ironbar", count=5)
    * Transfer TO the player who NEEDS the items, not FROM
    * Example: If Agent4 needs ironbar, Agent3 should call transfer_items to Agent4
  - 💬 Announce in global chat AFTER every action: "I now have: X ironore, Y coal, Z ironbar"
  - 📍 Move close to each other (within 10 tiles) before transferring items
  - ✅ Always verify_inventory before claiming to have or need items
  - 🔄 Confirm transfers: "Received 5x ironbar from MasterSmelterGamma - confirmed!"
  - 🎯 TRACK TEAM PROGRESS: Regularly check what's been completed:
    * "Team status: Pickaxe ✓, Axe ✓, Heavy Sword ✗ (in progress)"
    * Share this status in chat so everyone knows what's left to do
  
  ⚠️ REALITY CHECK RULES - EXTREMELY IMPORTANT:
  - ALWAYS use verify_inventory before claiming to have items
  - NEVER claim to have done something without actually using the tool
  - NEVER assume other agents sent you items unless you verify your inventory
  - If someone needs items and you have them: USE transfer_items immediately, don't just talk!
  - Use actual game tools (harvest_resource, transfer_items, craft_item) instead of just chatting
  - ACTIONS > WORDS: One transfer_items call is worth 100 chat messages!
  
  🔄 STATUS SHARING PROTOCOL:
  - After EVERY action, announce in chat: "I now have: X ironore, Y coal, Z ironbar, W logs"
  - When sending transfers, announce: "Transferring 5x ironbar to EquipmentCrafterDelta now"
  - When receiving transfers, confirm: "Confirmed received: 5x ironbar from MasterSmelterGamma"
  - Before crafting, announce: "Ready to craft pickaxe, I have: 5 ironbar + 1 logs"
  - Track team totals: "Team status: 8/10 ironore mined, 6/10 ironbar smelted"
  
  MINING & CRAFTING RESOURCE REQUIREMENTS:
  - Iron ore: 10x pieces (for smelting into bars)
  - Coal: 10x pieces (for smelting fuel - 1 coal per ironbar)
  - Logs: 3x pieces (1 for pickaxe, 1 for axe, 1 extra for backup)
  - Iron bars: 10x pieces (5 for pickaxe, 3 for axe, 2 for heavy sword)
  - Hilt2: 1x piece (Agent4 already HAS this!)
  
  🚨 COMPLETION REQUIREMENTS:
  - DO NOT use complete() until you verify ALL required equipment exists
  - Required final equipment (minimum):
    * 1x pickaxe - must be crafted by Agent4
    * 1x axe - must be crafted by Agent4
    * 1x heavy sword (sword2) - must be crafted by Agent4
  - DO NOT complete if crafting fails - troubleshoot and retry together
  - DO NOT complete if team is scattered - coordinate first
  - Only complete when verified: team has produced all required equipment
  - If you encounter errors or obstacles, work together to solve them!
  
  💡 WORKFLOW EXAMPLE (Follow This Pattern!):
  1. ALL AGENTS: Use check_inventory_status to verify starting resources
  2. Agent1: Mine 4x more ironore (already has 3x, need 7x total to contribute)
  3. Agent2 & Agent5: harvest_resource on Oak Tree (need 2x more logs, Agent2 already has 1x)
  4. Agent1 & Agent3: Move close to each other
  5. Agent1: transfer_items to Agent3 (send ironore)
  6. Agent2: transfer_items to Agent3 (send coal if needed)
  7. Agent3: Verify has 10x ironore + 10x coal (should already have enough coal!)
  8. Agent3: craft_item skill=Smelting itemKey=ironbar (repeat 10 times for 10x ironbar) ✅
  9. Agent2 & Agent5: transfer_items to Agent4 (send total 3x logs)
  10. Agent3: Move close to Agent4
  11. Agent3: transfer_items to Agent4 (send 10x ironbar)
  12. Agent4: Verify has 10x ironbar + 3x logs + 1x hilt2
  13. Agent4: craft_item skill=Smithing itemKey=pickaxe (uses 5 ironbar + 1 logs) ✅
  14. Agent4: craft_item skill=Smithing itemKey=axe (uses 3 ironbar + 1 logs) ✅
  15. Agent4: craft_item skill=Smithing itemKey=sword2 (uses 2 ironbar + 1 hilt2) ✅
  16. SUCCESS! Team has: 1 pickaxe + 1 axe + 1 heavy sword
  
  🎯 KEY OPTIMIZATION: Team already starts with 10x coal - focus on getting ironore and logs!
  
  Remember: Adapt this workflow as needed, but ALWAYS use the actual tools!

