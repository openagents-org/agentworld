# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cooperative Lightning Staff Enhancement - Advanced Magic Crafting"
  description: "Three agents work together to create an enhanced lightning staff through basic staff crafting and magical enhancement"

# Task objectives
objectives:
  primary: "Create a lightning staff through coordinated magic staff creation and elemental enhancement"
  secondary: # checkpoints
    - "Coordinate basic magic staff production and enhancement materials"
    - "Execute advanced magical enhancement techniques"
    - "Complete high-level magic weapon crafting within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent advanced magic crafting scenario requiring elemental materials.
  
  CRITICAL SUCCESS REQUIREMENTS:
  1. staff_crafter_agent MUST create basic magic staff from sticks and bead
  2. elemental_gatherer_agent MUST find lightning bead for enhancement
  3. magic_enhancer_agent MUST upgrade basic staff to lightning staff
  4. magic_enhancer_agent MUST equip the lightning staff and declare completion
  
  LOCATION STRATEGY:
  - Forest areas for staff base materials
  - Magical areas for elemental lightning beads
  - Advanced enchantment facility for staff enhancement
  - Communicate magical resource locations through global chat
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  🪄 Fletching Recipe - stick:
    - craft_item skill=Fletching itemKey=stick
    - Materials: 1x logs → 4x stick
    - Level required: 1 (Fletching skill)
  
  ⚡ Crafting Recipe - staff:
    - craft_item skill=Crafting itemKey=staff
    - Materials: 5x stick + 1x bead → 1x staff
    - Level required: 1 (Crafting skill)
  
  ⚡ Crafting Recipe - lightningstaff:
    - craft_item skill=Crafting itemKey=lightningstaff
    - Materials: 1x staff + 1x lightningbead → 1x lightningstaff
    - Level required: 10 (Crafting skill) - ADVANCED!

# Limitations
max_action_steps: 25

# Agent configurations
agent_1:
  username: "staff_crafter_agent"
  new_character: true
  role: "Basic Staff Creator"
  
  location:
    x: 126
    y: 23
  
  skill_levels:
    lumberjacking: 20
    fletching: 15
    crafting: 15      # For basic staff creation
    strength: 25
    health: 25
  
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
    - item: "bead"
      count: 1
  
  equipped_items:
    - item: "axe"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Basic staff creator responsible for magic staff foundation
    
    ⚡ CRITICAL STAFF CREATION MISSION - CREATE BASIC MAGIC STAFF!
    
    ABSOLUTE PRIORITIES:
    1. Find and cut oak trees to get logs
    2. Craft logs into sticks for staff construction
    3. Craft basic magic staff from sticks and bead
    4. Transfer magic staff to magic_enhancer_agent
    
    STAFF CREATION STRATEGY:
    1. observe_environment to find oak trees
    2. harvest_resource on oak tree instances to get logs
    3. Collect at least 2x logs for sufficient stick production
    4. Craft sticks from logs:
       📋 FLETCHING: craft_item skill=Fletching itemKey=stick (1x logs → 4x stick)
    5. Repeat if needed to get 5x stick total
    6. Craft basic magic staff:
       📋 CRAFTING: craft_item skill=Crafting itemKey=staff (5x stick + 1x bead → 1x staff)
    7. observe_environment to verify staff created
    8. Use global chat to report basic staff completion
    9. Coordinate with magic_enhancer_agent for staff transfer
    10. Move to agreed meetup location
    11. transfer_items to give staff to magic_enhancer_agent
    12. Wait for magic_enhancer_agent to confirm staff receipt
    13. Support team until lightning staff enhancement is complete
    
    STAFF CREATION REQUIREMENTS:
    - Lumberjacking skill for logs (you have 20)
    - Fletching skill for sticks (you have 15)
    - Crafting skill level 1+ for staff (you have 15)
    - 1x bead (you start with this)
    
    ERROR PREVENTION:
    - Verify each crafting step completion
    - Check inventory after each operation
    - Handle staff transfer carefully - FOUNDATION FOR ENHANCEMENT
    - REMEMBER: Logs → sticks → basic staff sequence

agent_2:
  username: "elemental_gatherer_agent"
  new_character: true
  role: "Lightning Bead Collector"
  
  location:
    x: 745
    y: 579
  
  skill_levels:
    foraging: 25      # For magical material search
    magic: 20         # Elemental affinity
    strength: 20
    health: 25
  
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Elemental gatherer responsible for lightning bead collection
    
    ⚡ CRITICAL ELEMENTAL GATHERING MISSION - FIND LIGHTNING BEAD!
    
    ABSOLUTE PRIORITIES:
    1. Search for lightning bead in magical areas
    2. Collect lightning bead for staff enhancement
    3. Secure elemental enhancement material
    4. Transfer lightning bead to magic_enhancer_agent
    
    ELEMENTAL GATHERING STRATEGY:
    1. observe_environment to search for lightning bead or magical sources
    2. Look for "lightningbead" instances or magical creatures
    3. If not visible, move to different magical areas:
       - move_character(x=550, y=550) for magical forest area
       - move_character(x=650, y=450) for elemental zone
       - move_character(x=700, y=600) for storm area
    4. Use any applicable methods to obtain lightning bead:
       - harvest_resource if found as collectible
       - Check for magical creatures that might drop lightning beads
       - Look for elemental altars or magical deposits
    5. Target: Secure 1x lightningbead for staff enhancement
    6. Check inventory after each search attempt
    7. Use global chat every 2-3 actions to report elemental search progress
    8. Once you have lightning bead, coordinate with magic_enhancer_agent
    9. Move to enhancement location for bead transfer
    10. transfer_items to give lightningbead to magic_enhancer_agent (MAGICAL!)
    11. Wait for magic_enhancer_agent to confirm bead receipt
    12. Support team until lightning staff enhancement is complete
    
    ELEMENTAL REQUIREMENTS:
    - Magical affinity for elemental materials
    - 1x lightningbead (elemental enhancement component)
    - Careful handling of magical materials
    
    ERROR PREVENTION:
    - Search systematically through magical areas
    - Handle lightning bead with magical care
    - Check inventory after magical operations
    - REMEMBER: Lightning bead is rare elemental material!

