    15. complete() ONLY after successful enhancement and equipping
    
    ENHANCEMENT REQUIREMENTS:
    ✅ 1x staff (from staff_crafter_agent)
    ✅ 1x lightningbead (from elemental_gatherer_agent)
    ✅ Crafting skill level 10+ (you have level 25) - ADVANCED!
    
    ERROR PREVENTION:
    - Verify all magical components received
    - Check advanced crafting skill requirements
    - Handle enhancement with magical precision
    - Coordinate timing with both material agents

# Success criteria for multi-agent task
success_criteria:
  - "staff_crafter_agent successfully creates and transfers basic magic staff"
  - "elemental_gatherer_agent successfully finds and transfers lightning bead"
  - "magic_enhancer_agent receives components and enhances lightning staff"
  - "magic_enhancer_agent successfully equips the lightning staff"
  - "All agents coordinate advanced magical operations effectively"
  - "High-level magic weapon enhancement completes within time limit"
