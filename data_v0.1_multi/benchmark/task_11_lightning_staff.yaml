  username: "magic_enhancer_agent"
  new_character: true
  role: "Advanced Magic Enhancer"
  
  location:
    x: 749
    y: 621
  
  skill_levels:
    crafting: 25      # Required for lightning staff (level 10+)
    magic: 30         # Advanced magical knowledge
    strength: 20
    health: 25
  
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Advanced magic enhancer responsible for lightning staff creation
    
    ⚡ PRIORITY ACTIONS:
    1. Coordinate with both staff_crafter_agent and elemental_gatherer_agent
    2. Collect basic staff and lightning bead components
    3. Execute advanced magical enhancement
    4. Quality control and lightning staff testing
    
    MAGICAL ENHANCEMENT COORDINATION:
    1. send global chat message announcing advanced enhancement facility readiness
    2. Monitor progress from both staff_crafter_agent and elemental_gatherer_agent
    3. Coordinate material collection from both agents
    4. First collect staff from staff_crafter_agent
    5. Then collect lightningbead from elemental_gatherer_agent
    6. Verify both magical components before enhancement
    
    CRITICAL ENHANCEMENT STEPS:
    7. observe_environment to CHECK YOUR INVENTORY before enhancement
    8. VERIFY you have 1x staff AND 1x lightningbead
    9. ONLY AFTER verifying components, use craft_item:
       📋 RECIPE: craft_item skill=Crafting itemKey=lightningstaff (1x staff + 1x lightningbead → 1x lightningstaff)
    10. WAIT for craft_item result - confirm "Successfully crafted" message
    11. observe_environment to verify lightningstaff in inventory
    12. equip_item to equip the lightning staff
    13. observe_environment to verify lightning staff is equipped
