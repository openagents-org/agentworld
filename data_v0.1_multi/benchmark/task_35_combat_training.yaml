# AgentWorld Multi-Agent Task Configuration

task:
  name: "Strategic Combat Training - Advanced Team Coordination and Skill Development"
  description: "Three agents work together to practice advanced combat techniques, coordinate tactical maneuvers, and develop team fighting skills"

# Task objectives
objectives:
  primary: "Successfully execute advanced combat training, coordinate tactical maneuvers, and demonstrate team fighting proficiency"
  secondary: # checkpoints
    - "Establish combat formation coordination and tactical positioning"
    - "Execute coordinated combat training exercises against available creatures"
    - "Complete strategic combat training within 33 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent strategic combat training scenario requiring tactical coordination and skill development.
  
  OBJECTIVE: Execute advanced combat training, coordinate tactical maneuvers, and develop team fighting proficiency.
  
  MISSION REQUIREMENTS:
  - Establish training operations in suitable combat areas
  - Practice coordinated combat techniques against available creatures
  - Develop tactical formations and combat coordination
  - Demonstrate advanced team fighting capabilities
  
  TEAM COORDINATION:
  - Use global chat to coordinate combat formations and tactical positions
  - Coordinate between different combat roles and tactical responsibilities
  - Share combat experience and provide mutual support during training
  - Work together to execute complex tactical maneuvers
  
  GENERAL STRATEGY:
  - The team needs to coordinate tactical combat training exercises
  - Available creatures provide opportunities for combat skill development
  - Combat training requires coordination between different fighting styles
  - Team coordination is essential for advanced tactical maneuvers
  - Balance individual skill development with team coordination objectives
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  STRATEGIC COMBAT TRAINING (CRITICAL KNOWLEDGE):
  🎯 Combat Formation:
    - Use observe_environment to scout training areas and locate available creatures
    - Establish tactical positions for coordinated combat exercises
    - Practice different formation patterns for various combat scenarios
    - Coordinate movement and positioning for optimal team effectiveness
  
  ⚔️ Combat Training - Available Creatures:
    - Use observe_environment to locate creatures in the training area
    - Focus on creatures like Wolves (Level 55) or Worker Ants (Level 46) for training
    - Practice coordinated attacks and defensive maneuvers
    - Use appropriate weapons and magic combinations for different creature types
    - Coordinate timing and targeting for maximum training effectiveness
  
  🛡️ Tactical Coordination:
    - Practice switching between offensive and defensive formations
    - Coordinate combat roles between different team members
    - Use magical abilities strategically to support team combat
    - Plan tactical movements and positioning during combat encounters
  
  📈 Skill Development:
    - Focus on improving individual combat skills through practice
    - Coordinate training exercises to develop team synergy
    - Practice using different weapon and magic combinations
    - Develop tactical communication and coordination skills
  
  🎖️ Training Objectives:
    - Successfully execute coordinated combat maneuvers
    - Demonstrate effective tactical positioning and formation control
    - Complete multiple combat training exercises with team coordination
    - Show improvement in individual and team combat effectiveness

