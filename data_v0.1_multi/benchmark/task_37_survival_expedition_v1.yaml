      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0

# Success criteria
success_criteria:
  - "Team gathers at least 5x apple total"
  - "Team gathers at least 3x blueberry total"
  - "All agents survive the expedition"
