# AgentWorld Multi-Agent Task Configuration
# VARIANT: Easy version - reduced targets and more time

task:
  name: "Mining Conglomerate Expansion - Multi-Site Industrial Mining (Easy)"
  description: "Ten miners establish a simplified mining operation with 2 excavation sites, smelting operations, and product distribution"

# Task objectives
objectives:
  primary: "Establish mining conglomerate operating 2 mine sites, producing 50+ bars and 10+ finished products within 65 rounds"
  secondary:
    - "Phase 1 (Rounds 1-18): Mine Establishment - Open 2 excavation sites"
    - "Phase 2 (Rounds 19-38): Mass Extraction - Mine 60+ ores across all sites"
    - "Phase 3 (Rounds 39-52): Industrial Smelting - Produce 50+ metal bars"
    - "Phase 4 (Rounds 53-65): Manufacturing - Craft 10+ metal products"

# Relevant game context (Hint)
relevant_game_context: |
  MINING CONGLOMERATE OVERVIEW (EASY MODE):

  Ten mining professionals must establish a simplified mining operation.

  MINING DIVISIONS:

  EXCAVATION TEAMS

  **Site Alpha (Agents 1-3)**: Iron Mine at (230, 38)
  - Goal: 30+ ironore

  **Site Beta (Agents 4-6)**: Coal Mine at (235, 40)
  - Goal: 40+ coal (fuel)

  SMELTING OPERATIONS (Agents 7-8)
  **Mission**: Smelt 50+ bars

  **Production**:
  - 30+ ironbar
  - 20+ other bars

  MANUFACTURING (Agents 9-10)
  **Mission**: Craft 10+ metal products

  **Products**:
  - 3+ heavy swords
  - 3+ axes
  - 4+ other items

  SUCCESS CRITERIA:
  1. Mine 60+ total ores
  2. Smelt 50+ metal bars
  3. Craft 10+ finished products
  4. 2 mine sites operational
  5. Complete within 65 rounds

# Limitations
max_action_steps: 65

