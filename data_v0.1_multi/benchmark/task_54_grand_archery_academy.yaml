# AgentWorld Multi-Agent Task Configuration

task:
  name: "Grand Archery Academy - Five-Archer Equipment and Training Program"
  description: "Five archery specialists work together to gather materials, craft archery equipment, and complete coordinated training exercises"

# Task objectives
objectives:
  primary: "Establish a complete archery academy with five archers producing bows, arrows, and conducting coordinated training"
  secondary: # checkpoints
    - "Coordinate five-archer material gathering operations"
    - "Execute bow and arrow production pipeline"
    - "Complete archery training exercises with coordinated shooting"
    - "Achieve all archery objectives within 35 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  TARGET OUTPUT
  - In 35 rounds produce at least 3 wooden bows and ~30 arrows, then hand them out so all five archers are equipped and ready for a short training shoot. The team already holds 23 feathers and 3 strings, so the main work is chopping logs, crafting sticks, and coordinating handoffs.

  SIMPLE PLAN
  1. WoodGatheringSpecialist harvests 8 logs near (250,350), converts most into sticks via craft_item(Fletching, stick), keeps 3 logs reserved for bows.
  2. BowCraftsman receives 3 logs + 3 strings (already owned) through transfer_items and crafts three woodenbows.
  3. ArrowFletcher gathers 30 sticks + pooled feathers (transfer from FeatherHunter + MasterInstructor) and runs craft_item(Fletching, arrow) until ~30 arrows exist.
  4. FeatherHunter only needs to top up feathers if extras are desired—attack_mob bats near the clearing if so.
  5. MasterInstructor coordinates distribution and optional live-fire practice on a low-level mob using attack_mob once everyone is armed.

  COORDINATION RULES
  - Stay within ~10 tiles when transferring; both sides verify_inventory and report in chat.
  - Track totals after every craft (“Sticks 24/30”, “Arrows batch 2 complete”).
  - If feathers stay at 23, two arrow batches (20 arrows) are acceptable; log clearly if the team stops below 30.

  COMPLETION CHECKLIST
  - Bow inventory shows ≥3 new woodenbows, ArrowFletcher reports total arrows made, and every archer states their equipped bow/arrow count.
  - Training message logged (“All five archers fired on target X”). Only then may MasterInstructor call complete().
# Limitations
max_action_steps: 35

