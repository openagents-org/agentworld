# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cooperative Beryl Pendant Crafting - Elegant Jewelry"
  description: "Three agents work together to create a beryl pendant through foraging, gem mining, and jewelry crafting"

# Task objectives
objectives:
  primary: "Create a beryl pendant by combining beryl gem with crafted string"
  secondary: # checkpoints
    - "Coordinate foraging and mining operations"
    - "Execute safe transfers of delicate materials"
    - "Complete elegant jewelry crafting within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent jewelry crafting scenario requiring both foraging and mining skills.
  
  CRITICAL SUCCESS REQUIREMENTS:
  1. forager_agent MUST find and collect blue lily flowers for string
  2. gem_miner_agent MUST find and mine beryl deposits
  3. jeweler_agent MUST craft string from blue lily
  4. jeweler_agent MUST combine beryl + string into beryl pendant
  5. jeweler_agent MUST equip the pendant and declare completion
  
  LOCATION STRATEGY:
  - Look for blue lily flowers in foraging areas
  - Find beryl deposits in basic mining areas
  - Central crafting location for jewelry assembly
  - Communicate resource locations through global chat
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  🌸 Foraging - bluelily:
    - harvest_resource on bluelily instances to get bluelily
    - Level required: 10+ (Foraging skill)
  
  💎 Mining - beryl:
    - harvest_resource on beryl deposits to get beryl
    - Level required: 1+ (Mining skill)
  
  🧵 Crafting Recipe - string:
    - craft_item skill=Crafting itemKey=string
    - Materials: 1x bluelily → 1x string
    - Level required: 1 (Crafting skill)
  
  📿 Crafting Recipe - beryl pendant:
    - craft_item skill=Crafting itemKey=berylpendant
    - Materials: 1x beryl + 1x string → 1x beryl pendant
    - Level required: 1 (Crafting skill)

# Limitations
max_action_steps: 25

# Agent configurations
agent_1:
  username: "forager_agent"
  new_character: true
  role: "Blue Lily Collector"
  
  location:
    x: 142
    y: 327
  
  skill_levels:
    foraging: 20      # Required for blue lily collection
    strength: 20
    health: 25
  
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Forager responsible for collecting blue lily flowers for string crafting
    
    🌸 CRITICAL FORAGING MISSION - COLLECT BLUE LILY!
    
    ABSOLUTE PRIORITIES:
    1. Find blue lily flowers in foraging areas
    2. Collect blue lily for string production
    3. Secure at least 1x bluelily for pendant crafting
    4. Transfer blue lily to jeweler_agent
    
    FORAGING STRATEGY:
    1. observe_environment to search for bluelily flowers
    2. Look for "bluelily" instances specifically (level 10 requirement)
    3. If not visible, move to different foraging areas:
       - move_character(x=550, y=350) for flower meadow area
       - move_character(x=650, y=450) for garden area
       - move_character(x=500, y=500) for wild flower area
    4. harvest_resource on bluelily instances to get bluelily
    5. Check inventory after each foraging attempt
    6. Use global chat every 2-3 actions to report foraging progress
    7. Once you have 1+ bluelily, coordinate with jeweler_agent
    8. Move to agreed meetup location for blue lily transfer
    9. transfer_items to give bluelily to jeweler_agent
    10. Wait for jeweler_agent to confirm receipt
    11. Support team until beryl pendant is complete
    
    FORAGING REQUIREMENTS:
    - Foraging skill level 10+ (you have 20) ✅
    - No tools required for foraging
    - Look for blue colored flower instances
    - Handle delicate flowers carefully
    
    ERROR PREVENTION:
    - Verify foraging skill meets blue lily requirements
    - Check inventory after each foraging attempt
    - Move systematically through potential flower areas
    - REMEMBER: Blue lily flowers → string material

agent_2:
  username: "gem_miner_agent"
  new_character: true
  role: "Beryl Miner"
  
  location:
    x: 216
    y: 315
  
  skill_levels:
    mining: 25        # Required for beryl mining
    strength: 30
    health: 25
  
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "pickaxe"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Gem miner responsible for extracting beryl stones
    
    💎 CRITICAL GEM MINING MISSION - EXTRACT BERYL!
    
    ABSOLUTE PRIORITIES:
    1. Find beryl deposits in mining areas
    2. Mine beryl gem for pendant crafting
    3. Secure at least 1x beryl for jewelry
    4. Transfer beryl to jeweler_agent
    
    MINING STRATEGY:
    1. observe_environment to search for beryl deposits
    2. Look for "beryl" deposit instances (level 1 requirement - accessible!)
    3. If not visible, move to different mining areas:
       - move_character(x=150, y=450) for basic mining area
       - move_character(x=250, y=350) for gem deposit area
       - move_character(x=300, y=500) for mineral zone
    4. harvest_resource on beryl deposit instances to get beryl
    5. Check inventory after each mining attempt
    6. Use global chat to report beryl mining progress
    7. Once you have 1+ beryl, coordinate with jeweler_agent
    8. Move to agreed meetup location for beryl transfer
    9. transfer_items to give beryl to jeweler_agent
    10. Wait for jeweler_agent to confirm beryl receipt
    11. Support team until beryl pendant is complete
    
    BERYL MINING REQUIREMENTS:
    - Mining skill level 1+ (you have 25) ✅
    - Pickaxe tool equipped ✅
    - Basic level gem mining
    - Careful handling of gem materials
    
    ERROR PREVENTION:
    - Verify pickaxe is equipped before mining
    - Check inventory after each mining operation
    - Look for beryl-specific deposits
    - REMEMBER: Beryl is a basic level gem - should be findable

agent_3:
  username: "jeweler_agent"
  new_character: true
  role: "Pendant Craftsperson"
  
  location:
    x: 242
    y: 336
  
  skill_levels:
    crafting: 25      # Required for string and pendant crafting
    foraging: 10      # Backup foraging knowledge
    mining: 5         # Basic gem knowledge
    strength: 20
    health: 25
  
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Jewelry craftsperson responsible for pendant assembly
    
    📿 PRIORITY ACTIONS:
    1. Coordinate with both forager_agent and gem_miner_agent
    2. Collect blue lily and beryl components
    3. Craft string from blue lily flowers
    4. Assemble beryl pendant with crafted string
    5. Final quality control and pendant equipping
    
    PENDANT CRAFTING COORDINATION:
    1. send global chat message announcing pendant crafting readiness
    2. Monitor progress from both forager_agent and gem_miner_agent
    3. Coordinate material collection from both agents
    4. First collect bluelily from forager_agent
    5. Then collect beryl from gem_miner_agent
    6. Process materials in correct sequence
    
    CRITICAL CRAFTING STEPS:
    7. observe_environment to verify bluelily received
    8. Craft string from blue lily:
       📋 RECIPE: craft_item skill=Crafting itemKey=string (1x bluelily → 1x string)
    9. observe_environment to verify string created
    10. Verify beryl is in inventory
    11. Craft beryl pendant:
        📋 RECIPE: craft_item skill=Crafting itemKey=berylpendant (1x beryl + 1x string → 1x beryl pendant)
    12. WAIT for craft_item results - confirm "Successfully crafted" messages
    13. observe_environment to verify beryl pendant in inventory
    14. equip_item to equip the beryl pendant
    15. observe_environment to verify pendant is equipped
    16. Use global chat to declare "Beryl pendant crafted and equipped successfully!"
    17. complete() ONLY after successful pendant creation and equipping
    
    COMPONENT REQUIREMENTS:
    ✅ 1x bluelily (from forager_agent) → converts to string
    ✅ 1x beryl (from gem_miner_agent)
    ✅ Crafting skill level 1+ (you have level 25)
    
    ERROR PREVENTION:
    - Process materials in correct order (string first)
    - Verify each crafting step completion
    - Check inventory carefully between steps
    - Coordinate timing with both resource gatherers

# Success criteria for multi-agent task
success_criteria:
  - "forager_agent successfully collects and transfers blue lily"
  - "gem_miner_agent successfully mines and transfers beryl"
  - "jeweler_agent receives materials and crafts string"
  - "jeweler_agent successfully crafts and equips beryl pendant"
  - "All agents coordinate material gathering and crafting efficiently"
  - "Elegant jewelry production completes within time limit"
