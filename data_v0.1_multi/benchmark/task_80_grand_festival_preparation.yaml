# Success criteria for multi-agent task
success_criteria:
  - "Phase 1: FestivalFisher1 catches 10x Shrimp from coastal fishing spots"
  - "Phase 1: FestivalFisher2 catches 8x Tuna from coastal fishing spots"
  - "Phase 1: FestivalHunter hunts animals and collects 10x meat"
  - "Phase 1: FestivalForager1 forages 8x Blueberries and 5x Peaches"
  - "Phase 1: FestivalForager2 forages 8x Tomatoes and 5x Corn"
  - "Phase 1: FestivalSmith mines 10x iron ore, 5x gold ore, 15x coal"
  - "Phase 1: FestivalDecorator mines 5x beryl gems and 3x topaz gems"
  - "Phase 1: FestivalFletcher gathers 8x logs from Oak Trees"
  - "Phase 2: All gatherers travel to Cooking Hub and transfer resources to cooks"
  - "Phase 2: FestivalCook1 receives fish and cooks 10x Cooked Shrimp, 8x Cooked Tuna"
  - "Phase 2: FestivalCook2 receives meat and vegetables, cooks dishes including Stew"
  - "Phase 2: FestivalSmith smelts 10x iron bars and 5x gold bars"
  - "Phase 3: FestivalFletcher crafts 1x Wooden Bow for archery competition"
  - "Phase 3: FestivalSmith crafts 3x Silver Rings and 1x Golden Ring as competition prizes"
  - "Phase 4: FestivalDecorator crafts 1x Beryl Pendant, 1x Topaz Pendant, 1x Magic Staff"
  - "Phase 4: Material transfers coordinated for decoration crafting"
  - "Phase 5: All 10 agents travel to Festival Grounds at (450, 300)"
  - "Phase 5: Complete festival inventory verified (foods, prizes, decorations)"
  - "Team demonstrates coordination across all skill types: Fishing, Hunting, Foraging, Mining, Lumberjacking, Cooking, Smelting, Smithing, Fletching, Crafting"
  - "At least 10+ cooked food items created for feast"
  - "At least 4 competition prizes crafted (3 silver rings + 1 golden ring minimum)"
  - "At least 3 decorative items created (2 pendants + 1 staff)"
  - "Team uses chat extensively throughout all phases for coordination"
  - "Team demonstrates resource logistics and material transfers"
  - "Grand Festival Preparation completed within 50 rounds with all items ready"
