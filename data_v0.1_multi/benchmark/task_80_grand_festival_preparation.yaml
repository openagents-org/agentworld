# AgentWorld Multi-Agent Task Configuration

task:
  name: "Grand Festival Preparation - Multi-Skill Celebration Event"
  description: "Ten specialized agents coordinate to prepare a grand festival celebration by fishing, hunting, foraging, cooking, smithing, fletching, and crafting diverse items for the event"

# Task objectives
objectives:
  primary: "Prepare a complete festival celebration where 10 agents gather diverse resources, cook multiple dishes, craft competition prizes, and create decorative items - demonstrating coordination across all skill types"
  secondary:
    - "Phase 1: Resource Expedition (Fishing, hunting, foraging, mining, lumberjacking across multiple regions)"
    - "Phase 2: Material Processing (Cooking dishes, smelting bars for crafting)"
    - "Phase 3: Prize Crafting (Smith crafts competition prizes, Fletcher crafts archery equipment)"
    - "Phase 4: Decoration Creation (Crafter makes decorative items for festival)"
    - "Phase 5: Festival Setup (All agents consolidate items at festival grounds)"
    - "Complete within 50 rounds with all festival items ready"

# Context and guidance for agents
relevant_game_context: |
  Team objective: Prepare a grand festival by gathering diverse resources and creating feast foods, competition prizes, and decorative items.

  🚨 CRITICAL AWARENESS - FESTIVAL PREPARATION:
  - ALWAYS use verify_inventory before and after transfers
  - ALWAYS use chat to announce progress on assigned tasks
  - Use transfer_items to consolidate materials with crafters/cooks
  - DO NOT craft until materials are verified
  - Track team progress: "X/Y items complete for festival"

  📍 STARTING LOCATIONS & ROLE ASSIGNMENTS:

  Agent 1 (FestivalFisher1): Start (550, 450) - Coastal Fisher
    → Catch 10x Shrimp from coastal fishing spots
    → Role: Seafood provider

  Agent 2 (FestivalFisher2): Start (548, 448) - Coastal Fisher
    → Catch 8x Tuna from coastal fishing spots
    → Role: Premium seafood provider

  Agent 3 (FestivalHunter): Start (400, 350) - Plains Hunter
    → Hunt animals for 10x meat (from various creatures)
    → Role: Meat provider for feast

  Agent 4 (FestivalForager1): Start (402, 352) - Forager
    → Forage 8x Blueberries and 5x Peaches
    → Role: Fruit and ingredient provider

  Agent 5 (FestivalForager2): Start (404, 354) - Forager
    → Forage 8x Tomatoes and 5x Corn
    → Role: Vegetable provider for stew

  Agent 6 (FestivalCook1): Start (400, 300) - Master Cook
    → Cook seafood dishes (Shrimp, Tuna, Jellyfish Smoothie)
    → Role: Seafood chef

  Agent 7 (FestivalCook2): Start (402, 302) - Master Cook
    → Cook feast dishes (Stew, Cooked Meat)
    → Role: Main course chef

  Agent 8 (FestivalSmith): Start (230, 38) - Blacksmith
    → Mine ores, smelt bars, craft prize rings
    → Role: Competition prize maker

  Agent 9 (FestivalFletcher): Start (388, 3) - Fletcher
    → Gather logs, craft bow and arrows for archery competition
    → Role: Archery competition equipment maker

  Agent 10 (FestivalDecorator): Start (238, 48) - Decorator/Crafter
    → Mine gems, gather materials, craft decorative items
    → Role: Festival decoration creator

  📊 PHASE 1 - RESOURCE EXPEDITION (Rounds 1-15):

  🎯 MANDATORY Objectives:
  - Each agent gathers assigned resources from their region
  - Use appropriate tools and skills for gathering
  - Communicate progress constantly
  - Prepare for travel to processing locations

  🎣 HOW TO FISH (FestivalFisher1, FestivalFisher2):
  FestivalFisher1 - Shrimp:
  1. Start at coastal area (550, 450)
  2. Use observe_environment radius=32 to find Shrimp fishing spots
  3. Use harvest_resource targetInstance=<fishing_spot_instance>
  4. Catch 10x Shrimp
  5. Chat: "Caught shrimp #X. Total: Y/10"

  FestivalFisher2 - Tuna:
  1. Start at coastal area (548, 448)
  2. Use observe_environment radius=32 to find Tuna fishing spots
  3. Use harvest_resource targetInstance=<fishing_spot_instance>
  4. Catch 8x Tuna
  5. Chat: "Caught tuna #X. Total: Y/8"

  🏹 HOW TO HUNT (FestivalHunter):
  1. Start at plains (400, 350)
  2. Use observe_environment radius=32 to find animals (chickens, cows, deer, etc.)
  3. Use attack_entity targetInstance=<animal_instance> to hunt
  4. Auto-loot provides meat drops
  5. Hunt until you have 10x meat (any type)
  6. Chat: "Hunted animal. Meat collected: X/10"

  🌿 HOW TO FORAGE (FestivalForager1, FestivalForager2):
  FestivalForager1 - Fruits:
  1. Start at (402, 352)
  2. Use observe_environment radius=32 to find Blueberry and Peach plants
  3. Use harvest_resource targetInstance=<plant_instance>
  4. Gather 8x Blueberries and 5x Peaches
  5. Chat: "Foraged: X blueberries, Y peaches"

  FestivalForager2 - Vegetables:
  1. Start at (404, 354)
  2. Use observe_environment radius=32 to find Tomato and Corn plants
  3. Use harvest_resource targetInstance=<plant_instance>
  4. Gather 8x Tomatoes and 5x Corn
  5. Chat: "Foraged: X tomatoes, Y corn"

  ⛏️ HOW TO MINE (FestivalSmith, FestivalDecorator):
  FestivalSmith:
  1. Start at mountain (230, 38)
  2. Use observe_environment radius=32 to find iron rock, gold rock, coal rock
  3. Mine: 10x iron ore, 5x gold ore, 15x coal
  4. Chat: "Mined: X iron, Y gold, Z coal"

  FestivalDecorator:
  1. Start at gem mountain (238, 48)
  2. Use observe_environment to find beryl rock, topaz rock
  3. Mine: 5x beryl gems, 3x topaz gems
  4. Chat: "Mined gems: X beryl, Y topaz"

  🌲 HOW TO GATHER LOGS (FestivalFletcher):
  1. Start at forest (388, 3)
  2. Use observe_environment radius=32 to find Oak Trees
  3. Use harvest_resource targetInstance=<tree_instance>
  4. Gather 8x logs (for bow, arrows, crafting)
  5. Chat: "Gathered log #X. Total: Y/8"

  ⏱️ TIME ALLOCATION:
  - Rounds 1-12: Active gathering in assigned regions
  - Rounds 13-15: Verify inventory, prepare for Phase 2 travel

  📊 PHASE 2 - MATERIAL PROCESSING (Rounds 16-28):

  🎯 MANDATORY Objectives:
  - Fishers travel to cooks and transfer fish
  - Hunter transfers meat to cooks
  - Foragers transfer ingredients to cooks
  - Cooks prepare multiple dishes
  - Smith smelts bars for prize crafting
  - All agents communicate progress

  🚶 CONSOLIDATION AT COOKING HUB (400, 300):
  1. All gatherers travel to Cooking Hub where cooks are located
  2. Distances:
     - FestivalFisher1: (550,450) to (400,300) = ~190 tiles, 6 moves
     - FestivalFisher2: (548,448) to (400,300) = ~190 tiles, 6 moves
     - FestivalHunter: (400,350) to (400,300) = ~50 tiles, 2 moves
     - FestivalForager1: (402,352) to (400,300) = ~52 tiles, 2 moves
     - FestivalForager2: (404,354) to (400,300) = ~55 tiles, 2 moves
  3. Chat during travel: "Agent [name]: Traveling to Cooking Hub with [resources]"
  4. Arrival: "Arrived at Cooking Hub! Ready to transfer [resources]"

  📦 TRANSFER RESOURCES TO COOKS:
  To FestivalCook1 (Seafood chef):
  1. FestivalFisher1: transfer_items targetPlayer=FestivalCook1 itemKey=shrimp count=10
  2. FestivalFisher2: transfer_items targetPlayer=FestivalCook1 itemKey=tuna count=8
  3. FestivalFisher1 or 2: transfer_items targetPlayer=FestivalCook1 itemKey=jellyfish count=3 (if caught)
  4. FestivalCook1: verify_inventory to confirm materials

  To FestivalCook2 (Main course chef):
  1. FestivalHunter: transfer_items targetPlayer=FestivalCook2 itemKey=meat count=10 (or specific meat type)
  2. FestivalForager2: transfer_items targetPlayer=FestivalCook2 itemKey=tomato count=5
  3. FestivalForager2: transfer_items targetPlayer=FestivalCook2 itemKey=corn count=3
  4. FestivalCook2: verify_inventory to confirm materials

  🍳 HOW TO COOK DISHES (FestivalCook1, FestivalCook2):

  FestivalCook1 - Seafood Dishes:
  1. Cook Shrimp:
     - craft_item skill=Cooking itemKey=cookedshrimp
     - Recipe: 1x shrimp → 1x cookedshrimp
     - Repeat 10x: "Cooked shrimp X/10"

  2. Cook Tuna:
     - craft_item skill=Cooking itemKey=cookedtuna
     - Recipe: 1x tuna → 1x cookedtuna
     - Repeat 8x: "Cooked tuna X/8"

  3. Make Jellyfish Smoothie (if jellyfish available):
     - craft_item skill=Cooking itemKey=jellyfishsmoothie
     - Recipe: 3x jellyfish → 1x smoothie
     - Chat: "Jellyfish smoothie crafted!"

  FestivalCook2 - Feast Dishes:
  1. Cook Meat:
     - craft_item skill=Cooking itemKey=cookedmeat (or specific cooked meat type)
     - Recipe: 1x meat → 1x cookedmeat
     - Repeat for available meat: "Cooked meat X/Y"

  2. Make Stew:
     - craft_item skill=Cooking itemKey=stew
     - Recipe: 1x cookedmeat + 1x tomato + 1x corn + 1x bowl → 1x stew
     - Need bowl first! If no bowl, craft from logs:
       - First need sticks: craft_item skill=Fletching itemKey=stick (1 log → 4 sticks)
       - Then bowl: craft_item skill=Fletching itemKey=bowl (4 sticks → 1 bowl)
     - Then craft stew: "Stew crafted for festival feast!"

  🔥 HOW TO SMELT BARS (FestivalSmith):
  1. FestivalSmith stays at mountain (230, 38) or travels to smithing location
  2. Smelt iron bars:
     - craft_item skill=Smelting itemKey=ironbar
     - Recipe: 1x ironore + 1x coal → 1x ironbar
     - Repeat 10x: "Smelted iron bar X/10"
  3. Smelt gold bars:
     - craft_item skill=Smelting itemKey=goldbar
     - Recipe: 1x goldore + 1x coal → 1x goldbar
     - Repeat 5x: "Smelted gold bar X/5"
  4. Chat: "Smelting complete! Bars ready for prize crafting!"

  ⏱️ TIME ALLOCATION:
  - Rounds 16-18: Gatherers travel to Cooking Hub
  - Rounds 19-20: Transfer resources to cooks
  - Rounds 21-26: Cooks prepare all dishes simultaneously with smelting
  - Rounds 27-28: Verify all dishes cooked, bars smelted

  📊 PHASE 3 - PRIZE CRAFTING (Rounds 29-37):

  🎯 MANDATORY Objectives:
  - Fletcher crafts archery competition equipment (bow + arrows)
  - Smith crafts competition prize rings
  - Verify all prizes created

  🏹 HOW TO CRAFT ARCHERY EQUIPMENT (FestivalFletcher):
  1. FestivalFletcher has 8x logs from Phase 1
  2. Craft Sticks:
     - craft_item skill=Fletching itemKey=stick
     - Recipe: 1x logs → 4x sticks
     - Repeat 2x: "Crafted sticks. Total: 8 sticks"

  3. Craft Wooden Bow:
     - craft_item skill=Fletching itemKey=bow1
     - Recipe: 4x logs + 4x sticks → 1x Wooden Bow
     - Chat: "Wooden Bow crafted for archery competition!"

  4. Craft Arrows (need feathers):
     - If have feathers from bird hunting (from hunter or gatherers):
       - craft_item skill=Fletching itemKey=arrow
       - Recipe: 10x sticks + 10x feathers → 10x arrows
       - Chat: "Arrows crafted!"
     - If no feathers, skip arrows (bow is main prize)

  🔨 HOW TO CRAFT PRIZE RINGS (FestivalSmith):
  1. FestivalSmith has 10 iron bars + 5 gold bars
  2. Craft Silver Rings (from iron):
     - craft_item skill=Smithing itemKey=silverring
     - Recipe: 2x ironbar → 1x silverring
     - Repeat 3x: "Crafted silver ring X/3 (competition prizes)"

  3. Craft Golden Ring:
     - craft_item skill=Smithing itemKey=goldring
     - Recipe: 2x goldbar → 1x goldring
     - Chat: "Golden Ring crafted! (Grand prize for winner)"

  4. Chat: "All competition prizes ready! 3 silver rings + 1 golden ring!"

  ⏱️ TIME ALLOCATION:
  - Rounds 29-32: Fletcher crafts bow and arrows
  - Rounds 33-36: Smith crafts prize rings
  - Round 37: Verify all prizes crafted

  📊 PHASE 4 - DECORATION CREATION (Rounds 38-44):

  🎯 MANDATORY Objectives:
  - Decorator crafts festival decorations
  - Transfer materials if needed
  - Create pendants and staff for festival display

  💎 HOW TO CRAFT DECORATIONS (FestivalDecorator):
  1. FestivalDecorator has 5x beryl gems, 3x topaz gems from Phase 1
  2. Need logs for crafting - get from FestivalFletcher:
     - FestivalFletcher: transfer_items targetPlayer=FestivalDecorator itemKey=logs count=3
     - Chat: "Transferred logs to decorator"

  3. Craft Beryl Pendant:
     - craft_item skill=Crafting itemKey=berylpendant
     - Recipe: 2x berylgem + 1x logs → 1x Beryl Pendant
     - Chat: "Beryl Pendant crafted! (Festival decoration)"

  4. Craft Topaz Pendant:
     - craft_item skill=Crafting itemKey=topazpendant
     - Recipe: 2x topazgem + 1x logs → 1x Topaz Pendant
     - Chat: "Topaz Pendant crafted! (Festival decoration)"

  5. Craft Beads (need berries from forager):
     - FestivalForager1: transfer_items targetPlayer=FestivalDecorator itemKey=blueberry count=3
     - FestivalDecorator: craft_item skill=Crafting itemKey=beads
     - Recipe: 3x blueberry → 1x beads

  6. Craft Magic Staff:
     - craft_item skill=Crafting itemKey=magicstaff
     - Recipe: 2x logs + 1x beads → 1x Magic Staff
     - Chat: "Magic Staff crafted! (Festival centerpiece decoration)"

  ⏱️ TIME ALLOCATION:
  - Rounds 38-40: Transfer materials to decorator
  - Rounds 41-44: Craft pendants, beads, and magic staff

  📊 PHASE 5 - FESTIVAL SETUP (Rounds 45-50):

  🎯 MANDATORY Objectives:
  - All 10 agents travel to Festival Grounds
  - Consolidate all items for display
  - Verify complete festival inventory
  - Celebrate successful preparation

  📍 FESTIVAL GROUNDS LOCATION: (450, 300) - Central Festival Plaza

  🚶 ALL AGENTS TRAVEL TO FESTIVAL GROUNDS:
  1. All agents use move_character to travel to (450, 300)
  2. Distances vary:
     - Cooks: (400,300) to (450,300) = 50 tiles, 2 moves
     - Fletcher: (388,3) to (450,300) = ~300 tiles, 10 moves
     - Smith: (230,38) to (450,300) = ~340 tiles, 11 moves
     - Decorator: (238,48) to (450,300) = ~320 tiles, 10 moves
     - Others from Cooking Hub: 50 tiles, 2 moves
  3. Chat during travel: "Heading to Festival Grounds with [items]! Position: (X,Y)"
  4. Arrival: "Arrived at Festival Grounds! Items: [list]"

  📋 FESTIVAL INVENTORY VERIFICATION:
  Once all agents arrive, verify complete festival inventory:

  FEAST FOODS (from cooks):
  ✓ FestivalCook1: 10x Cooked Shrimp, 8x Cooked Tuna, 1x Jellyfish Smoothie (if made)
  ✓ FestivalCook2: Cooked Meat, 1-2x Stew

  COMPETITION PRIZES (from smith & fletcher):
  ✓ FestivalSmith: 3x Silver Ring, 1x Golden Ring
  ✓ FestivalFletcher: 1x Wooden Bow, 10x Arrows (if made)

  DECORATIONS (from decorator):
  ✓ FestivalDecorator: 1x Beryl Pendant, 1x Topaz Pendant, 1x Magic Staff

  📢 FINAL ANNOUNCEMENT:
  1. All agents chat festival items:
     - FestivalCook1: "Feast ready! 10 cooked shrimp, 8 cooked tuna, 1 smoothie!"
     - FestivalCook2: "Main course ready! Cooked meat and stew!"
     - FestivalSmith: "Prizes ready! 3 silver rings, 1 golden ring!"
     - FestivalFletcher: "Competition equipment ready! Wooden bow and arrows!"
     - FestivalDecorator: "Decorations complete! 2 pendants and magic staff!"
     - Other agents: "Festival Grounds setup complete!"

  2. Team celebration: "GRAND FESTIVAL PREPARATION COMPLETE! All items ready!"

  ⏱️ TIME ALLOCATION:
  - Rounds 45-48: All agents travel to Festival Grounds
  - Round 49: Final inventory verification
  - Round 50: Celebration and completion

  🚨 COMPLETION REQUIREMENTS:

  DO NOT use complete() until ALL MANDATORY requirements met:

  ✓ Phase 1: All resources gathered (10 shrimp, 8 tuna, 10 meat, fruits, vegetables, ores, gems, logs)
  ✓ Phase 2: All feast dishes cooked (10+ cooked items total)
  ✓ Phase 2: Smith smelted 10 iron bars + 5 gold bars
  ✓ Phase 3: Fletcher crafted Wooden Bow (arrows optional but preferred)
  ✓ Phase 3: Smith crafted 3 Silver Rings + 1 Golden Ring
  ✓ Phase 4: Decorator crafted 2 Pendants + 1 Magic Staff
  ✓ Phase 5: All 10 agents arrived at Festival Grounds (450, 300)
  ✓ Team used chat extensively for coordination throughout
  ✓ Completed within 50 rounds

  MINIMUM ACCEPTABLE (If Issues):
  ✓ At least 8 cooked food items
  ✓ At least 3 competition prizes (rings or bow)
  ✓ At least 2 decorative items
  ✓ All agents at Festival Grounds

  📋 FINAL VERIFICATION (Round 49-50):
  1. Each specialist verifies their contribution:
     - Cooks: List all dishes cooked
     - Smith: List all prizes crafted
     - Fletcher: List archery equipment
     - Decorator: List decorations created
  2. Team leader announces: "Grand Festival Preparation Complete! Total items: [count]. Festival ready!"
  3. One agent calls complete() with full summary of all phases

  🤝 COORDINATION REQUIREMENTS:
  - Use global chat CONSTANTLY throughout all phases
  - Share gathering progress and arrival updates
  - Confirm transfers before and after
  - Track team progress: "X/Y festival items complete"
  - Adapt if resources not found (search nearby or substitute)
  - Help agents who need materials or get lost
  - Celebrate each completed item: "One more festival item done!"

  Goal: Demonstrate diverse skill coordination (fishing, hunting, foraging, mining, lumberjacking, cooking, smelting, smithing, fletching, crafting), resource logistics, and collaborative preparation across a complete festival event!

# Limitations
