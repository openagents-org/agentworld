# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Multi-stop resource distribution

task:
  name: "Transportation Logistics - Multi-Stop Distribution"
  description: "Three agents coordinate multi-stop resource distribution of logs and fish"

# Task objectives
objectives:
  primary: "Distribute 4x logs and 4x rawshrimp across three agents"
  secondary: # checkpoints
    - "Coordinate multi-stop distribution"
    - "Complete distribution within 28 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a multi-stop logistics distribution scenario.

  OBJECTIVE: Coordinate resource distribution across team.

  MISSION REQUIREMENTS:
  - Lumberjack gathers 4x logs
  - Fisher catches 4x rawshrimp
  - Distribute so coordinator receives 2x logs and 2x rawshrimp
  - Coordinate transfers efficiently

  TEAM COORDINATION:
  - Announce when resources are ready
  - Coordinate transfer sequence
  - Verify final distribution

  DISTRIBUTION PLAN:
  1. Lumberjack gathers logs → transfers 2x to coordinator
  2. Fisher catches shrimp → transfers 2x to coordinator
  3. Verify everyone has resources

  DO NOT use complete() until distribution is verified!

# Limitations
max_action_steps: 28

