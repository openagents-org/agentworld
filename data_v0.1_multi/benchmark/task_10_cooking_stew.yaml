# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cooperative Stew Cooking - Culinary Team Production"
  description: "Three agents work together to prepare a hearty stew through container crafting, ingredient gathering, and cooking"

# Task objectives
objectives:
  primary: "Prepare a delicious stew through coordinated ingredient gathering and cooking"
  secondary: # checkpoints
    - "Coordinate container crafting and ingredient collection"
    - "Execute safe food preparation and cooking operations"
    - "Complete culinary production within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent culinary scenario requiring food preparation expertise.
  
  HINT:
  1. container_crafter_agent MUST create cooking bowl from wood materials
  2. ingredient_gatherer_agent MUST collect mushrooms and vegetables
  3. chef_agent MUST combine ingredients in bowl to cook stew
  4. chef_agent MUST consume or display the stew and declare completion
  
  LOCATION STRATEGY:
  - Forest areas for wood collection and bowl crafting
  - Foraging areas for mushrooms and vegetables
  - Central cooking location for stew preparation
  - Communicate ingredient locations through global chat
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  🪄 Fletching Recipe - stick:
    - craft_item skill=Fletching itemKey=stick
    - Materials: 1x logs → 4x stick
    - Level required: 1 (Fletching skill)
  
  🥣 Fletching Recipe - bowlmedium:
    - craft_item skill=Fletching itemKey=bowlmedium
    - Materials: 4x stick → 1x bowlmedium
    - Level required: 5 (Fletching skill)
  
  🍄 Foraging - mushrooms and vegetables:
    - harvest_resource on mushroom instances to get mushroom2
    - harvest_resource on corn instances to get corn
    - Level required: varies (Foraging skill)
  
  🍲 Cooking Recipe - stew2:
    - craft_item skill=Cooking itemKey=stew2
    - Materials: 1x bowlmedium + 1x mushroom2 + 1x corn → 1x stew2
    - Level required: 1 (Cooking skill)

# Limitations
max_action_steps: 25

