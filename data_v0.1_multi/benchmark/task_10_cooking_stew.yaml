# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cooperative Stew Cooking - Culinary Team Production"
  description: "Three agents work together to prepare a hearty stew through container crafting, ingredient gathering, and cooking"

# Task objectives
objectives:
  primary: "Prepare a delicious stew through coordinated ingredient gathering and cooking"
  secondary: # checkpoints
    - "Coordinate container crafting and ingredient collection"
    - "Execute safe food preparation and cooking operations"
    - "Complete culinary production within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent culinary scenario requiring food preparation expertise.
  
  CRITICAL SUCCESS REQUIREMENTS:
  1. container_crafter_agent MUST create cooking bowl from wood materials
  2. ingredient_gatherer_agent MUST collect mushrooms and vegetables
  3. chef_agent MUST combine ingredients in bowl to cook stew
  4. chef_agent MUST consume or display the stew and declare completion
  
  LOCATION STRATEGY:
  - Forest areas for wood collection and bowl crafting
  - Foraging areas for mushrooms and vegetables
  - Central cooking location for stew preparation
  - Communicate ingredient locations through global chat
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  🪄 Fletching Recipe - stick:
    - craft_item skill=Fletching itemKey=stick
    - Materials: 1x logs → 4x stick
    - Level required: 1 (Fletching skill)
  
  🥣 Fletching Recipe - bowlmedium:
    - craft_item skill=Fletching itemKey=bowlmedium
    - Materials: 4x stick → 1x bowlmedium
    - Level required: 5 (Fletching skill)
  
  🍄 Foraging - mushrooms and vegetables:
    - harvest_resource on mushroom instances to get mushroom2
    - harvest_resource on corn instances to get corn
    - Level required: varies (Foraging skill)
  
  🍲 Cooking Recipe - stew2:
    - craft_item skill=Cooking itemKey=stew2
    - Materials: 1x bowlmedium + 1x mushroom2 + 1x corn → 1x stew2
    - Level required: 1 (Cooking skill)

# Limitations
max_action_steps: 25

# Agent configurations
agent_1:
  username: "container_crafter_agent"
  new_character: true
  role: "Bowl Craftsperson"
  
  location:
    x: 126
    y: 23
  
  skill_levels:
    lumberjacking: 20
    fletching: 15     # Required for bowl crafting (level 5+)
    strength: 25
    health: 25
  
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "axe"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Container craftsperson responsible for cooking bowl creation
    
    🥣 CRITICAL CONTAINER CRAFTING MISSION - CREATE COOKING BOWL!
    
    ABSOLUTE PRIORITIES:
    1. Find and cut oak trees to get logs
    2. Craft logs into sticks for bowl material
    3. Craft sticks into medium cooking bowl
    4. Transfer cooking bowl to chef_agent
    
    CONTAINER CRAFTING STRATEGY:
    1. observe_environment to find oak trees
    2. harvest_resource on oak tree instances to get logs
    3. Collect at least 1x logs for stick production
    4. Craft sticks from logs:
       📋 FLETCHING: craft_item skill=Fletching itemKey=stick (1x logs → 4x stick)
    5. Craft cooking bowl from sticks:
       📋 FLETCHING: craft_item skill=Fletching itemKey=bowlmedium (4x stick → 1x bowlmedium)
    6. observe_environment to verify bowl created
    7. Use global chat to report bowl crafting completion
    8. Coordinate with chef_agent for bowl transfer
    9. Move to agreed meetup location
    10. transfer_items to give bowlmedium to chef_agent
    11. Wait for chef_agent to confirm bowl receipt
    12. Support team until stew cooking is complete
    
    CONTAINER CRAFTING REQUIREMENTS:
    - Lumberjacking skill for logs (you have 20)
    - Fletching skill level 5+ for bowl (you have 15)
    - Precision crafting for cooking container
    
    ERROR PREVENTION:
    - Verify each crafting step completion
    - Check inventory after each operation
    - Handle bowl transfer carefully - NEEDED FOR COOKING
    - REMEMBER: Logs → sticks → bowl sequence

agent_2:
  username: "ingredient_gatherer_agent"
  new_character: true
  role: "Food Ingredient Collector"
  
  location:
    x: 142
    y: 327
  
  skill_levels:
    foraging: 20      # Required for ingredient collection
    strength: 20
    health: 25
  
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Ingredient collector responsible for gathering stew components
    
    🍄 CRITICAL INGREDIENT GATHERING MISSION - COLLECT STEW INGREDIENTS!
    
    ABSOLUTE PRIORITIES:
    1. Find and collect mushrooms for stew base
    2. Find and collect corn for stew content
    3. Secure cooking ingredients for chef
    4. Transfer ingredients to chef_agent
    
    INGREDIENT GATHERING STRATEGY:
    1. observe_environment to search for mushrooms and corn
    2. Look for "mushroom2" instances and "corn" instances
    3. If not visible, move to different foraging areas:
       - move_character(x=450, y=350) for mushroom forest area
       - move_character(x=550, y=450) for vegetable garden area
       - move_character(x=600, y=300) for agricultural area
    4. harvest_resource on mushroom2 instances to get mushroom2
    5. harvest_resource on corn instances to get corn
    6. Target: 1x mushroom2 + 1x corn for stew recipe
    7. Check inventory after each foraging attempt
    8. Use global chat every 2-3 actions to report ingredient gathering progress
    9. Once you have both ingredients, coordinate with chef_agent
    10. Move to cooking location for ingredient transfer
    11. transfer_items to give ingredients to chef_agent
    12. Wait for chef_agent to confirm ingredient receipt
    13. Support team until stew cooking is complete
    
    INGREDIENT REQUIREMENTS:
    - Foraging skill level for gathering (you have 20)
    - 1x mushroom2 (stew base)
    - 1x corn (stew content)
    - Fresh ingredient handling
    
    ERROR PREVENTION:
    - Look specifically for mushroom2 and corn varieties
    - Check inventory after each foraging operation
    - Handle ingredients carefully - NEEDED FOR COOKING
    - REMEMBER: Fresh ingredients make better stew!

agent_3:
  username: "chef_agent"
  new_character: true
  role: "Master Chef"
  
  location:
    x: 136
    y: 25
  
  skill_levels:
    cooking: 15       # Required for stew cooking (level 1+)
    foraging: 10      # Basic ingredient knowledge
    crafting: 10      # Food preparation skills
    strength: 20
    health: 25
  
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Master chef responsible for stew preparation and cooking
    
    🍲 PRIORITY ACTIONS:
    1. Coordinate with both container_crafter_agent and ingredient_gatherer_agent
    2. Collect cooking bowl and ingredients
    3. Prepare and cook hearty stew
    4. Quality control and final food presentation
    
    CULINARY COORDINATION:
    1. send global chat message announcing kitchen readiness
    2. Monitor progress from both container_crafter_agent and ingredient_gatherer_agent
    3. Coordinate material collection from both agents
    4. First collect bowlmedium from container_crafter_agent
    5. Then collect ingredients from ingredient_gatherer_agent
    6. Verify all cooking components before preparation
    
    CRITICAL COOKING STEPS:
    7. observe_environment to CHECK YOUR INVENTORY before cooking
    8. VERIFY you have 1x bowlmedium AND 1x mushroom2 AND 1x corn
    9. ONLY AFTER verifying all ingredients, use craft_item:
       📋 RECIPE: craft_item skill=Cooking itemKey=stew2 (1x bowlmedium + 1x mushroom2 + 1x corn → 1x stew2)
    10. WAIT for craft_item result - confirm "Successfully crafted" message
    11. observe_environment to verify stew2 in inventory
    12. Use global chat to announce successful stew preparation
    13. Display finished stew for team verification
    14. complete() ONLY after successful stew creation
    
    COOKING REQUIREMENTS:
    ✅ 1x bowlmedium (from container_crafter_agent)
    ✅ 1x mushroom2 (from ingredient_gatherer_agent)
    ✅ 1x corn (from ingredient_gatherer_agent)
    ✅ Cooking skill level 1+ (you have level 15)
    
    ERROR PREVENTION:
    - Verify all ingredients received before cooking
    - Check cooking skill meets requirements
    - Handle food preparation with care
    - Coordinate timing with both supply agents

# Success criteria for multi-agent task
success_criteria:
  - "container_crafter_agent successfully creates and transfers cooking bowl"
  - "ingredient_gatherer_agent successfully collects and transfers ingredients"
  - "chef_agent receives all components and cooks stew"
  - "chef_agent successfully prepares hearty stew"
  - "All agents coordinate culinary operations effectively"
  - "Food preparation completes within time limit"
