# Success criteria for multi-agent task
success_criteria:
  - "Recon squad reports at least two checkpoints per corridor plus every mob cluster discovered."
  - "Northbridge and South Causeway each receive 4 logs + 4 ironbar, with repair confirmations in chat."
  - "Support hub documents the inventory contents for each convoy bundle before handoff."
  - "All three convoys arrive at target coordinates with escorts present and >50% HP."
  - "Any hostile encounters are resolved with explicit attack logs and post-battle inventory checks."
  - "Final muster at (540,360) lists remaining supplies, evacuee counts, and bridge status before complete()."

