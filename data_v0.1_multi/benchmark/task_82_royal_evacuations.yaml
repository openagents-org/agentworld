# AgentWorld Multi-Agent Task Configuration

task:
  name: "Royal Evacuation Command - Multi-Convoy Defense"
  description: "Ten officers evacuate civilians from the Central Kingdom, opening three escape corridors, repairing bridges, and escorting convoys to safe zones within 55 rounds."

# Task objectives
objectives:
  primary: "Evacuate three civilian groups from (528,384) toward the northern mountains, eastern coast, and southern desert while keeping supply wagons intact."
  secondary:
    - "Phase 1: Recon duo charts mobs, choke points, and rest stops on each corridor."
    - "Phase 2: Engineers repair Northbridge (510,320) and South Causeway (500,460) using logs + ironbar."
    - "Phase 3: Support hub prepares three convoys with food, flasks, and battle tonics."
    - "Phase 4: Escort teams move all convoys simultaneously, clearing ambushes and reporting checkpoints."
    - "Phase 5: Final muster at (540,360) with casualty report and inventory proof."

# Relevant game context (Hint)
relevant_game_context: |
  TEAM STRUCTURE
  - Recon: Agents 1-2 sweep ahead using observe_environment radius=48, tag mob clusters, and keep chat updated with “Sector (x,y) clear / unsafe”.
  - Engineers: Agents 3-4 gather 8 logs + 8 ironore/coal, smelt into bars, and repair the bridge tiles before convoys depart.
  - Support Hub: Agents 5-6 stay in the market square to collect food/medicine (foraging, purchase, mob drops), assembling three identical supply bundles.
  - Escorts: Agents 7-10 attach to convoys (North/East/South). Each convoy must have at least two escorts within 6 tiles at all times.
  
  CRITICAL DETAILS
  1. Resource plan:
     • Logs from nearby oaks (harvest_resource) + iron bars (craft_item Smelting ironbar) → structural supplies.
     • Convoy kit requires: 10 flasks, 10 food items, 2 strengthpotion (or equivalent buff item). Track counts per convoy.
  2. Movement rules:
     • convoys pause every two move_character calls for regroup checks.
     • If mobs spawn, escorts use stop_action then attack_entity targetInstance=<mob> before resuming.
     • Recon provides heading such as “North route waypoint (460,260) safe, proceed”.
  3. Communication:
     • bridge repairs announced as “Bridgewright: Northbridge reinforced (logs 0/8, bars 0/4 remaining)”.
     • Support hub shares inventory snapshots before handing bundles via transfer_items.
     • Arrival pings: “North convoy arrived (420,180) – supplies intact”.
  4. Completion guard:
     • complete() only after all three convoys check in, engineers certify bridges, and support hub reports leftover supplies.

# Limitations
max_action_steps: 55

