# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Simplified 4-agent jewelry workshop

task:
  name: "Enchanted Jewelry Workshop - Focused Gemstone Collection"
  description: "Four jewelry artisans gather gems, craft base jewelry, and create 8+ enchanted pieces"

# Task objectives
objectives:
  primary: "Create jewelry collection: 8+ pieces including 3 rings, 3 pendants, 2 base items"
  secondary:
    - "Gem Hunt (Rounds 1-12): Hunt mobs and forage for 10+ gemstones"
    - "Metal Works (Rounds 13-25): Mine and smelt metals for base jewelry"
    - "Crafting (Rounds 26-38): Create all jewelry pieces"
    - "Exhibition (Rounds 39-42): Display complete collection"

# Context and guidance for agents
relevant_game_context: |
  WORKSHOP SNAPSHOT
  - Four artisans must finish 8 jewelry pieces (3 rings, 3 pendants, 2 base pieces) by Round 42. Gem hunter operates near (350,250), forager in the western forest, and the Master Jeweler assembles everything at (528,384).

  GAME PLAN
  1. R1-12 Gem Hunt: Agent 1 farms goblins for rubies/emeralds; Agent 2 forages beryl and string; Agent 3 mines gold/iron + coal. Report tallies every few drops.
  2. R13-25 Delivery & Smelting: all gatherers converge on the hub (≤32-tile hops), hand over materials via transfer_items. Metal_Artisan smelts 4 gold bars and 6 iron bars.
  3. R26-38 Crafting: Master Jeweler crafts base rings (gold/silver) then upgrades with gemstones; pendants consume beryl/emerald + string.
  4. R39-42 Exhibition: verify_inventory shows at least 8 finished pieces, list the set in chat, then call complete().

  EXECUTION NOTES
  - Transfer only within ~10 tiles and require both sender/receiver confirmations.
  - If certain gems refuse to drop, communicate substitution plans early.
# Limitations
max_action_steps: 42

