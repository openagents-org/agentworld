# Success criteria for multi-agent task
success_criteria:
  - "Combat Arena Team successfully defeats at least 3 different boss-level creatures"
  - "Crafting Masters Team successfully crafts at least 5 legendary items from different categories"
  - "Resource Champions Team collects at least 8 different types of rare resources"
  - "Royal Chef prepares at least 20 food items for the grand feast"
  - "All three teams coordinate effectively using global chat throughout tournament"
  - "Successful inter-team resource sharing and support demonstrated"
  - "Teams demonstrate role specialization and parallel task execution"
  - "All tournament challenges completed within 50 rounds time limit"
  - "Regular status updates and milestone announcements maintained"
  - "Final victory announcement confirms all objectives met"

