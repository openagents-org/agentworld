# AgentWorld Multi-Agent Task Configuration

task:
  name: "Grand Jewelry Expedition - Multi-Stage Gemstone Collection & Crafting"
  description: "Eight agents coordinate a complex expedition involving mob hunting, gemstone gathering, ore mining, and sequential jewelry crafting"

# Task objectives
objectives:
  primary: "Complete a 5-stage jewelry production expedition creating 2x Ruby Rings, 2x Emerald Pendants, 1x Topaz Ring, and 2x Beryl Pendants"
  secondary:
    - "Stage 1 (Rounds 1-12): Mob Hunting Brigade - Hunt specific mobs for gem drops"
    - "Stage 2 (Rounds 13-22): Mining Operations - Extract gold and special ores"
    - "Stage 3 (Rounds 23-35): Intermediate Crafting - Create base rings and gather materials"
    - "Stage 4 (Rounds 36-48): Sequential Jewelry Assembly - Craft all pendants and rings"
    - "Stage 5 (Rounds 49-53): Quality Control & Distribution - Verify and distribute jewelry"

# Context and guidance for agents
relevant_game_context: |
  This is an advanced multi-stage expedition requiring coordinated mob hunting, mining, and complex crafting chains with dependencies.

  🚨 CRITICAL AWARENESS - EXPEDITION COORDINATION:
  - ALWAYS use chat to announce stage progress and item acquisition
  - ALWAYS verify_inventory before transfers and after crafting
  - Use observe_environment radius=64 to locate mobs and resources
  - Stages must be completed SEQUENTIALLY - later stages depend on earlier ones
  - This is a 53-round expedition - maintain steady progress through all stages
  - Combat agents must coordinate mob targeting to avoid wasting targets

  🎯 OVERALL EXPEDITION OBJECTIVE:
  Create a complete jewelry collection:
  - 2x Ruby Ring (requires: 2 rubies, 2 gold rings)
  - 2x Emerald Pendant (requires: 2 emeralds, 2 strings)
  - 1x Topaz Ring (requires: 1 topaz, 1 gold ring)
  - 2x Beryl Pendant (requires: 2 beryls, 2 strings)

  📊 REQUIRED MATERIALS BREAKDOWN:
  Gemstones (from mob drops & foraging):
  - 2x Ruby (hunt mid-level mobs Level 15-25)
  - 2x Emerald (hunt goblins/skeletons)
  - 1x Topaz (hunt higher mobs or forage)
  - 2x Beryl (forage from plants)

  Base Materials (from mining & crafting):
  - 6x Gold Bar (smelt from 6 gold ore + 6 coal)
  - 4x String (forage or craft)
  - 3x Gold Ring (craft from 6 gold bars)

  📍 AGENT ROLES & ASSIGNMENTS:

  **HUNTING BRIGADE (Agents 1-3)**: Start (350, 250)
  - Agent 1 "Ruby_Hunter": Hunt for 2x rubies (Level 15-20 mobs)
  - Agent 2 "Gem_Hunter": Hunt for emeralds and topaz
  - Agent 3 "Combat_Support": Assist hunting, gather beryl via foraging
  - Objective: Collect all required gemstones through combat and foraging

  **MINING TEAM (Agents 4-5)**: Start (230, 38)
  - Agent 4 "Gold_Miner": Mine 6+ gold ore
  - Agent 5 "Coal_Miner": Mine 8+ coal, forage 4+ string
  - Objective: Gather all smelting materials

  **CRAFTING SPECIALISTS (Agents 6-8)**: Start (528, 384)
  - Agent 6 "Smelter": Smelt gold bars, craft gold rings
  - Agent 7 "Jeweler_Rings": Craft ruby ring and topaz ring
  - Agent 8 "Jeweler_Pendants": Craft emerald and beryl pendants
  - Objective: Receive materials and execute sequential crafting

  ═══════════════════════════════════════════════════════════
  STAGE 1: MOB HUNTING BRIGADE (Rounds 1-12)
  ═══════════════════════════════════════════════════════════

  🎯 STAGE OBJECTIVES:
  - Hunt mobs for ruby, emerald, and topaz drops
  - Forage for beryl gemstones
  - Consolidate all gemstones with Combat_Support (Agent 3)
  - Survive all combat encounters

  🏹 RUBY HUNTER (Agent 1) - CRITICAL ROLE:

  Starting Location: (350, 250)
  Target: 2x Ruby drops

  Strategy:
  1. Use observe_environment radius=64 to find mobs Level 15-20:
     - Goblins (Level 10-15) - lower ruby drop rate
     - Skeletons (Level 15-20) - better ruby drop rate
     - Wizards (Level 10-15) - chance for ruby drops

  2. Combat sequence for each mob:
     - observe_environment to locate mob instance
     - Check HP before engaging (must be > 70%)
     - attack_entity targetInstance=<mob_id>
     - System handles combat automatically
     - Auto-loot, check drops with verify_inventory
     - Heal if HP < 60% using flask or apple

  3. Keep hunting until 2 rubies acquired:
     - Expected: 8-15 mob kills for 2 rubies
     - Use chat: "Ruby Hunter: X rubies, Y mobs killed, HP: Z"
     - If rubies drop early, assist other hunters

  4. Search areas:
     - Primary: (350, 250) - plains/forest goblins
     - Secondary: (320, 280) - skeleton spawns
     - Use move_character to search different areas

  🗡️ GEM HUNTER (Agent 2) - DIVERSE TARGETS:

  Starting Location: (352, 252)
  Target: 2x Emerald, 1x Topaz

  Strategy:
  1. Hunt for emeralds first (easier drops):
     - Goblins have emerald drops
     - Skeletons also drop emeralds
     - Need 2 emerald total

  2. Then hunt for topaz (rarer):
     - Higher level mobs (Level 20+)
     - Try ogres around (238, 48) if spawned
     - Or continue hunting varied mobs for random topaz

  3. Combat protocol:
     - Same as Ruby Hunter
     - Coordinate with Agent 1 to not attack same mobs
     - Chat: "Gem Hunter: X emeralds, Y topaz, searching Z area"

  4. If topaz not dropping:
     - Try foraging (some plants may have topaz)
     - Check different mob types
     - Expected: 10-18 mob kills for all gems

  🌿 COMBAT SUPPORT (Agent 3) - HYBRID ROLE:

  Starting Location: (354, 254)
  Target: 2x Beryl (foraged), assist hunting

  Strategy:
  1. First, forage for beryl gemstones:
     - Use observe_environment to find foraging spots
     - harvest_resource on plant/herb instances
     - Beryl is relatively common in foraging
     - Need 2x beryl total

  2. After beryl collected (Rounds 1-5):
     - Assist Agents 1-2 with mob hunting
     - Join combat on same targets for faster kills
     - Collect any bonus gem drops

  3. Consolidation role (Rounds 10-12):
     - Agent 1: transfer_items targetPlayer=Combat_Support itemKey=ruby count=2
     - Agent 2: transfer_items targetPlayer=Combat_Support itemKey=emerald count=2
     - Agent 2: transfer_items targetPlayer=Combat_Support itemKey=topaz count=1
     - Combat_Support: verify_inventory (confirm all gems)
     - Chat: "Gemstones consolidated: 2 ruby, 2 emerald, 1 topaz, 2 beryl ✓"

  ⏱️ STAGE 1 TIME ALLOCATION:
  - Rounds 1-8: Active hunting and foraging
  - Rounds 9-10: Final gem collection
  - Rounds 11-12: Consolidate gems with Agent 3

  ═══════════════════════════════════════════════════════════
  STAGE 2: MINING OPERATIONS (Rounds 13-22)
  ═══════════════════════════════════════════════════════════

  🎯 STAGE OBJECTIVES:
  - Mine 6+ gold ore for gold bars
  - Mine 8+ coal for smelting
  - Forage 4+ string for pendants
  - Consolidate ores with Smelter (Agent 6)

  ⛏️ GOLD MINER (Agent 4):

  Starting Location: (230, 38) - Northern Mountains
  Target: 6+ Gold Ore

  Strategy:
  1. Use observe_environment radius=32 to locate gold rocks
     - Gold rocks appear as resource nodes
     - Require Mining level 25+ (Agent 4 has Mining 40)

  2. Harvest gold ore:
     - harvest_resource targetInstance=<gold_rock_id>
     - Each rock yields 1-3 gold ore
     - Continue until 6+ gold ore collected
     - Chat every 2 ores: "Gold Miner: X/6 gold ore"

  3. Search multiple mountain areas if needed:
     - Primary: (230, 38)
     - Secondary: (238, 48)
     - Gold rocks respawn, may need to wait or move

  4. Once 6+ collected (Round 18-20):
     - Prepare for travel to Central Hub (528, 384)

  ⛏️ COAL MINER (Agent 5):

  Starting Location: (232, 40) - Northern Mountains
  Target: 8+ Coal, 4+ String

  Strategy:
  1. Mine coal first (Rounds 13-17):
     - observe_environment to find coal rocks
     - Coal requires Mining 1+ (easy for Agent 5)
     - harvest_resource targetInstance=<coal_rock_id>
     - Need 8+ coal total (6 for gold, 2 buffer)
     - Chat: "Coal Miner: X/8 coal"

  2. Forage for string (Rounds 18-20):
     - Move to foraging areas (forest/plains)
     - observe_environment to find plants
     - harvest_resource on plant nodes
     - String can be foraged from certain plants
     - Need 4+ string for all pendants
     - Alternative: String may drop from mobs

  3. Consolidation (Round 21):
     - Stay near Agent 4 for coordinated travel

  🚚 TRAVEL & TRANSFER TO HUB (Rounds 21-22):

  Mining Team → Central Hub:
  - Distance from (230, 38) to (528, 384): ~450 tiles
  - This requires 15+ movement actions!
  - PROBLEM: Too far for Stage 2 timeline

  SOLUTION: Smelter (Agent 6) travels TO mining team instead!
  - Agent 6 at (528, 384) → (230, 38)
  - Same distance, but more efficient
  - Agent 6 moves rounds 13-22 (can reach in 10+ moves)

  Revised Protocol (Rounds 21-22):
  - Agent 4: transfer_items targetPlayer=Smelter itemKey=goldore count=6
  - Agent 5: transfer_items targetPlayer=Smelter itemKey=coal count=8
  - Agent 5: transfer_items targetPlayer=Jeweler_Pendants itemKey=string count=4
  - Smelter: verify_inventory (confirm gold ore, coal)
  - Chat: "Mining materials transferred ✓"

  ⏱️ STAGE 2 TIME ALLOCATION:
  - Rounds 13-17: Mining operations
  - Rounds 18-20: String foraging, final mining
  - Rounds 21-22: Smelter arrives, transfers complete

  ═══════════════════════════════════════════════════════════
  STAGE 3: INTERMEDIATE CRAFTING (Rounds 23-35)
  ═══════════════════════════════════════════════════════════

  🎯 STAGE OBJECTIVES:
  - Smelt 6x gold bars from gold ore
  - Craft 3x gold rings from gold bars
  - Transfer all materials to jewelry specialists
  - Prepare for final jewelry crafting

  🔥 SMELTER (Agent 6) - AT MOUNTAINS:

  Location: (230, 38) after Stage 2 transfers
  Task: Smelt Gold Bars

  Rounds 23-28: Gold Bar Smelting
  1. verify_inventory (confirm: 6 gold ore, 8 coal)
  2. craft_item skill=Smelting itemKey=goldbar
     - Recipe: 1 goldore + 1 coal → 1 goldbar
  3. Repeat 6 times (makes 6 gold bars)
  4. Chat after each: "Smelted X/6 gold bars"
  5. verify_inventory (confirm 6 gold bars)

  Rounds 29-31: Gold Ring Crafting
  1. craft_item skill=Smithing itemKey=goldring
     - Recipe: 2 goldbar → 1 goldring
  2. Repeat 3 times (uses all 6 gold bars → 3 gold rings)
  3. Chat: "Crafted 3/3 gold rings"
  4. verify_inventory (confirm 3 gold rings)

  Rounds 32-35: Return to Hub
  - Travel back to (528, 384) - Central Hub
  - Distance: 450 tiles, need 15 moves
  - Wait... this won't work in 4 rounds!

  REVISED SOLUTION: Jewelers travel TO Smelter!
  - Agents 7-8 travel from (528, 384) to (230, 38)
  - They receive materials at mountain location
  - All craft there, then can distribute or return later

  🚶 JEWELERS TRAVEL TO MOUNTAINS (Rounds 23-35):

  Agents 7-8 (Jeweler_Rings, Jeweler_Pendants):
  - Start: (528, 384)
  - Destination: (230, 38)
  - Distance: ~450 tiles
  - Moves needed: 15 actions
  - Available: Rounds 23-35 = 13 rounds (tight but possible)

  Travel plan:
  - Round 23: move_character x=496 y=352
  - Round 24: move_character x=464 y=320
  - Round 25: move_character x=432 y=288
  - Continue incrementally...
  - Round 35: Arrive at mountains, ready for Stage 4

  🎯 GEMSTONE DELIVERY (Rounds 30-33):

  Combat_Support (Agent 3) must deliver gems:
  - Currently at (350, 250) after hunting
  - Must reach (230, 38) - mountains
  - Distance: ~270 tiles
  - Moves needed: 9 actions

  Rounds 30-38: Agent 3 travels to mountains
  - Sequential moves toward (230, 38)
  - Chat position updates
  - Arrive Round 38-39

  ⏱️ STAGE 3 TIME ALLOCATION:
  - Rounds 23-28: Smelter crafts gold bars
  - Rounds 29-31: Smelter crafts gold rings
  - Rounds 23-35: Jewelers travel to mountains
  - Rounds 30-38: Combat_Support travels with gems
  - Rounds 32-35: Coordination and waiting

  ═══════════════════════════════════════════════════════════
  STAGE 4: SEQUENTIAL JEWELRY ASSEMBLY (Rounds 36-48)
  ═══════════════════════════════════════════════════════════

  🎯 STAGE OBJECTIVES:
  - All crafting agents converge at mountains (230, 38)
  - Transfer all materials to correct jewelers
  - Craft all 7 jewelry pieces in sequence
  - Verify each craft before proceeding

  📍 CONVERGENCE CHECK (Round 36-38):

  Expected positions at (230, 38) or nearby:
  - Agent 6 (Smelter): Already there, has 3 gold rings
  - Agent 7 (Jeweler_Rings): Arrived from hub
  - Agent 8 (Jeweler_Pendants): Arrived from hub
  - Agent 5 (Coal_Miner): Already there, has 4 string
  - Agent 3 (Combat_Support): Arriving, has all gems

  All agents chat: "Agent X at mountains, ready for assembly"

  🔄 MATERIAL DISTRIBUTION (Rounds 38-40):

  Transfer Sequence:
  1. Smelter → Jeweler_Rings:
     - transfer_items targetPlayer=Jeweler_Rings itemKey=goldring count=3

  2. Coal_Miner → Jeweler_Pendants:
     - transfer_items targetPlayer=Jeweler_Pendants itemKey=string count=4

  3. Combat_Support → Jeweler_Rings:
     - transfer_items targetPlayer=Jeweler_Rings itemKey=ruby count=2
     - transfer_items targetPlayer=Jeweler_Rings itemKey=topaz count=1

  4. Combat_Support → Jeweler_Pendants:
     - transfer_items targetPlayer=Jeweler_Pendants itemKey=emerald count=2
     - transfer_items targetPlayer=Jeweler_Pendants itemKey=beryl count=2

  5. Verification (Round 40):
     - Jeweler_Rings: verify_inventory
       Expected: 3 goldring, 2 ruby, 1 topaz
     - Jeweler_Pendants: verify_inventory
       Expected: 2 emerald, 2 beryl, 4 string

  💍 RING CRAFTING (Agent 7 - Jeweler_Rings):

  Rounds 41-44: Craft Rings

  Ruby Rings (2x):
  1. craft_item skill=Crafting itemKey=rubyring
     - Recipe: 1 ruby + 1 goldring → 1 rubyring
     - Requires Crafting level 20 (Agent 7 has 45)
  2. Repeat twice (uses 2 ruby + 2 goldring)
  3. Chat: "Crafted X/2 ruby rings"

  Topaz Ring (1x):
  4. craft_item skill=Crafting itemKey=topazring
     - Recipe: 1 topaz + 1 goldring → 1 topazring
     - Requires Crafting level 5
  5. Chat: "Crafted 1/1 topaz ring"

  6. verify_inventory (Round 44):
     - Confirm: 2x rubyring, 1x topazring
     - Chat: "All rings crafted ✓"

  📿 PENDANT CRAFTING (Agent 8 - Jeweler_Pendants):

  Rounds 41-46: Craft Pendants

  Emerald Pendants (2x):
  1. craft_item skill=Crafting itemKey=emeraldpendant
     - Recipe: 1 emerald + 1 string → 1 emeraldpendant
     - Requires Crafting level 25 (Agent 8 has 40)
  2. Repeat twice (uses 2 emerald + 2 string)
  3. Chat: "Crafted X/2 emerald pendants"

  Beryl Pendants (2x):
  4. craft_item skill=Crafting itemKey=berylpendant
     - Recipe: 1 beryl + 1 string → 1 berylpendant
     - Requires Crafting level 1
  5. Repeat twice (uses 2 beryl + 2 string)
  6. Chat: "Crafted X/2 beryl pendants"

  7. verify_inventory (Round 46):
     - Confirm: 2x emeraldpendant, 2x berylpendant
     - Chat: "All pendants crafted ✓"

  ⏱️ STAGE 4 TIME ALLOCATION:
  - Rounds 36-38: Final convergence at mountains
  - Rounds 38-40: Material distribution and verification
  - Rounds 41-44: Ring crafting by Jeweler_Rings
  - Rounds 41-46: Pendant crafting by Jeweler_Pendants
  - Rounds 47-48: Final verification and preparation for Stage 5

  ═══════════════════════════════════════════════════════════
  STAGE 5: QUALITY CONTROL & DISTRIBUTION (Rounds 49-53)
  ═══════════════════════════════════════════════════════════

  🎯 STAGE OBJECTIVES:
  - Comprehensive verification of all jewelry pieces
  - Team debriefing and contribution summary
  - Optional: Distribute jewelry to team members
  - Complete expedition with full report

  ✅ QUALITY CONTROL (Rounds 49-50):

  Agent 7 (Jeweler_Rings):
  - verify_inventory
  - Confirm: 2x rubyring, 1x topazring
  - Chat: "Ring inventory verified: 2 ruby rings, 1 topaz ring ✓"

  Agent 8 (Jeweler_Pendants):
  - verify_inventory
  - Confirm: 2x emeraldpendant, 2x berylpendant
  - Chat: "Pendant inventory verified: 2 emerald pendants, 2 beryl pendants ✓"

  📊 TEAM DEBRIEFING (Rounds 51-52):

  Each agent reports contribution:
  - Agent 1: "Ruby Hunter: Hunted X mobs, collected 2 rubies ✓"
  - Agent 2: "Gem Hunter: Collected 2 emeralds, 1 topaz ✓"
  - Agent 3: "Combat Support: Foraged 2 beryl, consolidated all gems ✓"
  - Agent 4: "Gold Miner: Mined 6 gold ore ✓"
  - Agent 5: "Coal Miner: Mined 8 coal, foraged 4 string ✓"
  - Agent 6: "Smelter: Smelted 6 gold bars, crafted 3 gold rings ✓"
  - Agent 7: "Jeweler Rings: Crafted 2 ruby rings, 1 topaz ring ✓"
  - Agent 8: "Jeweler Pendants: Crafted 2 emerald pendants, 2 beryl pendants ✓"

  🎁 OPTIONAL DISTRIBUTION (Round 52):

  Jewelers can distribute final items:
  - Ruby rings → combat agents (Agents 1, 2)
  - Topaz ring → miner (Agent 4)
  - Emerald pendants → support agents (Agents 3, 5)
  - Beryl pendants → crafters (Agents 6, 7)

  Use transfer_items if distributing:
  - Example: transfer_items targetPlayer=Ruby_Hunter itemKey=rubyring count=1

