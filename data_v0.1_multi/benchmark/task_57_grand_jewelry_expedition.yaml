  🚨 CRITICAL COMPLETION REQUIREMENTS:

  DO NOT use complete() unless ALL verified:
  ✓ 2x Ruby Ring crafted (Agent 7 has them)
  ✓ 1x Topaz Ring crafted (Agent 7 has it)
  ✓ 2x Emerald Pendant crafted (Agent 8 has them)
  ✓ 2x Beryl Pendant crafted (Agent 8 has them)
  ✓ All agents participated in their assigned stages
  ✓ All major transfers completed successfully
  ✓ Expedition completed in 50-53 rounds

  ⚠️ DEADLOCK PREVENTION & TROUBLESHOOTING:

  1. **Combat Deadlock**: If mobs not dropping gems
     - Hunt more mobs (gems have drop rates, not guaranteed)
     - Try different mob types
     - Coordinate to avoid duplicate targeting
     - Expected 15-25 kills for all gems

  2. **Mining Deadlock**: If resources not spawning
     - Move to different mountain areas
     - Use observe_environment with larger radius
     - Wait 1-2 rounds for potential respawns
     - Gold and coal are abundant in mountains

  3. **Travel Deadlock**: If agents can't reach destinations
     - Remember 32 tile limit per move
     - Calculate total moves needed (distance / 32)
     - Plan travel to fit within stage timeframes
     - Use chat to coordinate travel progress

  4. **Transfer Deadlock**: If transfers fail
     - Verify both agents within 5 tiles
     - Use observe_environment to check positions
     - Confirm exact username spelling
     - Use verify_inventory to confirm items exist

  5. **Crafting Deadlock**: If crafts fail
     - Check skill level requirements
     - verify_inventory to confirm materials
     - Ensure correct itemKey spelling
     - Review recipe requirements

  📡 COMMUNICATION PROTOCOL:

  - Every agent should chat every 4-6 rounds minimum
  - Hunters: Report kill count and gem drops
  - Miners: Report ore collected
  - Crafters: Report each craft completed
  - Travelers: Report position during long journeys
  - Use format: "[Role]: [Status] at [Location/Round]"

  🎯 SUCCESS METRICS:

  Primary Objective:
  ✓ All 7 jewelry pieces crafted (2 ruby rings, 1 topaz ring, 2 emerald pendants, 2 beryl pendants)

  Secondary Objectives:
  ✓ Completed in 50-53 rounds (demonstrates efficient sequential coordination)
  ✓ All 8 agents survive expedition
  ✓ No deadlocks during material transfers
  ✓ Perfect convergence at mountain crafting location

  Tertiary Objectives:
  ✓ Minimal wasted actions (efficient hunting and mining)
  ✓ Excellent communication throughout all stages
  ✓ Successful multi-region coordination (900+ tiles total travel)

