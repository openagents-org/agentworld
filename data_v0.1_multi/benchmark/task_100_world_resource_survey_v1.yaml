# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets

task:
  name: "World Resource Survey - Continental Exploration & Mapping"
  description: "Sixteen agents conduct comprehensive survey of all major regions, documenting resources, creatures, and establishing observation posts"

# Task objectives
objectives:
  primary: "Complete world resource survey covering 6+ major regions with 80+ documented findings and 4+ observation posts within 55 rounds"
  secondary:
    - "Phase 1 (Rounds 1-12): Team Formation - Organize 4 survey teams and plan routes"
    - "Phase 2 (Rounds 13-30): Continental Exploration - Survey 6+ major biomes"
    - "Phase 3 (Rounds 31-45): Resource Documentation - Catalog 80+ findings"
    - "Phase 4 (Rounds 46-55): Report Compilation - Establish posts and finalize survey"

# Relevant game context (Hint)
relevant_game_context: |
  WORLD RESOURCE SURVEY OVERVIEW:

  Sixteen explorers must document the known world's resources and creatures.

  SURVEY REGIONS:

  ===============================================================
  TEAM ALPHA (Agents 1-4) - Forest & Plains Survey
  ===============================================================
  **Regions**:
  - Forest Region (380, 20)
  - Central Plains (400, 300)

  **Document**:
  - Tree types and locations (8+ trees)
  - Plains creatures (4+ mob types)
  - Herb and plant resources (8+ items)

  **Establish**: 1 observation post

  ===============================================================
  TEAM BETA (Agents 5-8) - Mountain & Ice Survey
  ===============================================================
  **Regions**:
  - Mountain Range (230, 40)
  - Ice Caverns (260, 154)

  **Document**:
  - Ore deposit locations (12+ rocks)
  - Mountain creatures (4+ mob types)
  - Ice region resources (8+ items)

  **Establish**: 1 observation post

  ===============================================================
  TEAM GAMMA (Agents 9-12) - Coastal & Ocean Survey
  ===============================================================
  **Regions**:
  - Coastal Region (580, 750)
  - Underwater Areas

  **Document**:
  - Fishing spots (8+ locations)
  - Marine creatures (4+ types)
  - Coastal resources (8+ items)

  **Establish**: 1 observation post

  ===============================================================
  TEAM DELTA (Agents 13-16) - Desert & Volcanic Survey
  ===============================================================
  **Regions**:
  - Desert Plains (400, 680)
  - Volcanic Border regions

  **Document**:
  - Desert creatures (4+ types)
  - Special minerals (8+ finds)
  - Heat zone resources (8+ items)

  **Establish**: 1 observation post

  ===============================================================
  SURVEY PROTOCOL
  ===============================================================

  **Phase 1: Team Formation (Rounds 1-12)**
  - Organize into 4 specialized teams
  - Plan exploration routes
  - Gather survey equipment
  - Initial reconnaissance

  **Phase 2: Continental Exploration (Rounds 13-30)**
  - Each team explores assigned regions
  - Use observe_environment extensively
  - Photograph (document) all findings
  - Report via global chat every 5 rounds

  **Phase 3: Resource Documentation (Rounds 31-45)**
  - Catalog all trees, rocks, fishing spots
  - Document all mob types and locations
  - Collect sample resources (1-2 of each type)
  - Cross-reference findings between teams

  **Phase 4: Report Compilation (Rounds 46-55)**
  - Establish observation posts at key locations
  - Compile comprehensive findings list
  - Share knowledge across all teams
  - Final survey verification

  **Documentation Requirements**:
  - Format: "[Team X] Region Y: Found Z at (coordinates)"
  - Example: "[Alpha] Forest: Oak Tree at (385, 22)"
  - Minimum 80 total documented findings
  - Each team must document 20+ unique findings

  **Observation Posts**:
  - Forest Post: (385, 25)
  - Mountain Post: (235, 45)
  - Coastal Post: (585, 752)
  - Desert Post: (405, 685)

  ===============================================================
  SUCCESS CRITERIA
  ===============================================================
  1. Survey 6+ major regions
  2. Document 80+ unique findings
  3. Catalog 15+ mob types
  4. Catalog 25+ resource nodes
  5. Catalog 15+ tree types
  6. Establish 4+ observation posts
  7. All teams report continuously
  8. Complete within 55 rounds

# Limitations
max_action_steps: 55

