# Success criteria
success_criteria:
  - "Phase 1 completed: Team gathers 15+ logs, mines 20+ iron ore and coal, crafts 15+ iron bars"
  - "Phase 1: Team crafts 3x Heavy Swords, 2x Axes, 2x Wooden Bows"
  - "Phase 1: All agents equipped with appropriate weapons, 50+ healing items stockpiled"
  - "Phase 2 completed: Team explores shallow dungeon, defeats 2-3 guardian mobs"
  - "Phase 2: Dungeon scouted, safe paths identified, loot collected"
  - "Phase 3 completed: Team gathers enhancement materials (gold ore, gems, feathers)"
  - "Phase 3: Team crafts protective equipment (3x Silver Rings, 30+ arrows)"
  - "Phase 3: Healing supplies increased to 70+ total across team"
  - "Phase 4 completed: Team explores mid-level dungeon chambers (3rd-5th levels)"
  - "Phase 4: Skeletons (Level 15-20) and Spectres (Level 25-30) defeated"
  - "Phase 4: Boss chamber located, rare materials collected"
  - "Phase 5 completed: Team gathers ultimate materials (15+ gold ore, magical beads)"
  - "Phase 5: Elite equipment crafted (gold bars, enhanced weapons, magical staffs)"
  - "Phase 5: Maximum healing supplies stockpiled (100+ total)"
  - "Phase 6 completed: Team defeats miniboss in 6th chamber"
  - "Phase 6: Team defeats final dungeon lord boss (Level 35-45)"
  - "All 6 phases completed in proper sequence over 50-55 rounds"
  - "All 7 agents survive entire expedition with HP > 0"
  - "Team demonstrates progressive equipment upgrades from Phase 1 to Phase 5"
  - "Team uses chat extensively for coordination throughout all phases"
  - "Epic 6-phase dungeon expedition successfully completed"
