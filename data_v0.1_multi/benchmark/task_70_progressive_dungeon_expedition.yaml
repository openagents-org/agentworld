# AgentWorld Multi-Agent Task Configuration

task:
  name: "Progressive Dungeon Expedition Campaign"
  description: "Seven adventurers embark on a multi-stage dungeon expedition, progressively crafting better equipment and exploring deeper levels"

# Task objectives
objectives:
  primary: "Complete a 6-phase progressive dungeon expedition spanning 55 rounds with equipment upgrades between each exploration phase"
  secondary:
    - "Phase 1 (Rounds 1-10): Initial Preparation - Gather basic materials and craft starting equipment"
    - "Phase 2 (Rounds 11-18): Shallow Dungeon Exploration - Scout dungeon entrance and defeat low-level guardians"
    - "Phase 3 (Rounds 19-28): Equipment Enhancement - Gather advanced materials and craft superior weapons/armor"
    - "Phase 4 (Rounds 29-38): Mid-Level Dungeon - Explore deeper levels and defeat mid-tier bosses"
    - "Phase 5 (Rounds 39-48): Elite Equipment Crafting - Create specialized gear for final push"
    - "Phase 6 (Rounds 49-55): Deep Dungeon Boss Rush - Conquer final chambers and defeat dungeon lord"

# Relevant game context
relevant_game_context: |
  CAMPAIGN STRUCTURE (55 ROUNDS)
  - Seven adventurers must clear six sequential phases: prep gear → shallow dungeon → mid-run upgrades → mid-depth bosses → elite crafting → final boss rush. Equipment and healing pools are upgraded between phases; no phase may be skipped.

  PHASE CHEAT-SHEET
  1. R1-10 Preparation: gather 15 logs, 20 iron/coal, smelt 15 bars, craft starter weapons (heavy swords, axes, wooden bows) and amass 50+ heals. Each agent announces their loadout before moving on.
  2. R11-18 Shallow dungeon: move to ~200,100, scout with observe_environment (if unavailable, advance carefully and rely on visual cues), defeat low-level mobs using attack_mob, and log loot/HP after each fight.
  3. R19-28 Enhancement: retreat to safe ground, mine extra gold/gems/feathers, craft rings/arrows, and restock heals to 70+. Rangers require ≥30 arrows before Phase 4.
  4. R29-38 Mid-depth: push through chambers 3–5, fight skeletons and spectres only when everyone has HP>90% (spectres require 100%). Note the boss door location but don’t engage yet.
  5. R39-48 Elite crafting: exit again, gather elite mats (extra gold, special beads), smelt/craft golden or enhanced gear, and build up to 100+ healing items. Finalize boss tactics in chat.
  6. R49-55 Boss rush: re-enter with full HP, buffs equipped, and execute the planned attack order. All fights use shared target calls; if HP drops below 60%, heal immediately.

  EXECUTION NOTES
  - Always verify_inventory before/after crafting, transfers, or phase transitions; post summaries like “Phase 3 loadout ready: [items].”
  - Keep everyone within ~10 tiles during dungeon runs so retreating/healing is coordinated.
  - attack_mob handles combat best; use move_character hops of ≤32 tiles between regions.

  COMPLETION CHECK
  - Phase-by-phase chat confirmations (e.g., “Phase 5 complete – gear list: …”) are required. Only call complete() after the final boss falls and all agents report surviving with a brief final status.
# Limitations
max_action_steps: 55

