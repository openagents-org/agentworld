# AgentWorld Multi-Agent Task Configuration

task:
  name: "Elemental Convergence - Multi-Element Mastery and Primal Force Balancing"
  description: "Three agents work together to master different elemental forces, create elemental convergence points, and balance primal energies"

# Task objectives
objectives:
  primary: "Successfully master multiple elemental forces, create elemental convergence points, and achieve primal energy balance"
  secondary: # checkpoints
    - "Establish elemental mastery coordination and convergence point preparation"
    - "Execute coordinated elemental force manipulation and energy balancing"
    - "Complete elemental convergence within 34 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent elemental mastery scenario requiring advanced magical coordination and energy manipulation.
  
  OBJECTIVE: Master multiple elemental forces, create convergence points, and achieve perfect primal energy balance.
  
  MISSION REQUIREMENTS:
  - Navigate to Elemental Nexus region (Region 7-6: coordinates 1000-1050, 600-650)
  - Master Fire, Ice, and Lightning elemental forces through specialized training
  - Create Elemental Convergence Points by combining different elemental energies
  - Balance primal energies to prevent elemental chaos and maintain harmony
  
  TEAM COORDINATION:
  - Use global chat for complex elemental coordination and energy status updates
  - Coordinate between elemental mastery, convergence creation, and energy balancing
  - Share elemental knowledge and provide magical support during energy manipulation
  - Work together to handle volatile elemental reactions and energy instabilities
  
  GENERAL STRATEGY:
  - This requires master-level magical skills and elemental understanding
  - Each agent specializes in different elemental forces for maximum coverage
  - Elemental convergence requires precise timing and coordinated energy channeling
  - Primal energy imbalance can cause catastrophic magical explosions
  - Balance individual elemental mastery with team convergence coordination
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  ELEMENTAL MASTERY PROCEDURES (CRITICAL KNOWLEDGE):
  🔥 Fire Elemental Mastery:
    - Use elemental_channel action with fire focus to master fire magic
    - Requires high magic skill (40+) and fire staff equipment
    - Master fire creation, flame control, and heat manipulation
    - Coordinate fire energy for convergence point creation
  
  ❄️ Ice Elemental Mastery:
    - Use elemental_channel action with ice focus to master ice magic
    - Requires high magic skill (40+) and ice staff equipment
    - Master ice creation, frost control, and cold manipulation
    - Coordinate ice energy for convergence point creation
  
  ⚡ Lightning Elemental Mastery:
    - Use elemental_channel action with lightning focus to master lightning magic
    - Requires high magic skill (40+) and lightning staff equipment
    - Master electricity generation, storm control, and energy manipulation
    - Coordinate lightning energy for convergence point creation
  
  🌀 Elemental Convergence Creation:
    - Use convergence_create action at nexus coordinates (1025,625)
    - Requires coordinated channeling of all three elemental forces
    - Balance elemental energies to prevent destructive interactions
    - Create stable convergence points for primal energy harmony
  
  ⚖️ Primal Energy Balancing:
    - Monitor elemental energy levels during convergence procedures
    - Use energy_balance action to stabilize volatile elemental reactions
    - Coordinate energy distribution to maintain elemental harmony
    - Prevent elemental chaos through precise magical control

# Limitations
max_action_steps: 34

