  - Equipment needed: Wooden Bow (signature), Axe, maximum arrows
  - Current: Axe, Silver Ring, Wooden Bow, 12 arrows
  - Already optimal! Increase arrow count
  - Final loadout:
    * Primary: Wooden Bow, 24 arrows (double ammo)
    * Secondary: Axe
    * Defense: Silver Ring
    * Supplies: 15 healing items
  - Craft 12 more arrows, give to GuildFletcher
  - Chat: "GuildFletcher specialist loadout complete! Ranged mastery achieved!"

  **GuildCrafter Specialist Loadout (Round 41-42):**
  - Focus: Magic and enchantment crafting
  - Equipment needed: Magic Staff (signature), magical accessories
  - Current: Axe, Silver Ring, Wooden Bow, 12 arrows, Magic Staff
  - Enhance with best magical gear
  - Final loadout:
    * Primary: Enhanced Magic Staff (Lightning/Fire/Nature if available)
    * Ranged: Wooden Bow, 12 arrows
    * Defense: Enhanced Ring (if available), Pendant
    * Supplies: 15 healing items, magical materials
  - Chat: "GuildCrafter specialist loadout complete! Magical arsenal maximized!"

  **GuildMaster Specialist Loadout (Round 42-43):**
  - Focus: Leadership and balanced capabilities
  - Equipment needed: Best of everything (balanced loadout)
