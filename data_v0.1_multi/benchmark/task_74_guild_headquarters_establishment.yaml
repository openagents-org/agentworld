# AgentWorld Multi-Agent Task Configuration

task:
  name: "Guild Headquarters Establishment - Complete Base Construction"
  description: "Six guild founders collaborate to build a fully-functional headquarters with crafting stations, armory, and equipment for all members"

# Task objectives
objectives:
  primary: "Establish a complete guild headquarters over 50 rounds with specialized facilities and full equipment for all 6 guild members"
  secondary:
    - "Phase 1 (Rounds 1-12): Foundation & Resources - Gather massive material stockpile for construction"
    - "Phase 2 (Rounds 13-24): Armory Construction - Craft weapons and armor for all members"
    - "Phase 3 (Rounds 25-36): Workshop Development - Create crafting stations and utility equipment"
    - "Phase 4 (Rounds 37-46): Member Outfitting - Produce specialized equipment for each guild role"
    - "Phase 5 (Rounds 47-50): Grand Opening - Test facilities and celebrate guild establishment"

# Relevant game context
relevant_game_context: |
  This is an epic cooperative construction project requiring resource management, specialized crafting, and systematic organization.

  🚨 CRITICAL AWARENESS - GUILD CONSTRUCTION:
  - ALWAYS use verify_inventory to track construction materials
  - ALWAYS use chat to coordinate material gathering and crafting queues
  - Use observe_environment radius=64 to locate resource nodes
  - This is about COOPERATION and ORGANIZATION, not combat
  - Each guild member has a specialized role (Lumberjack, Miner, Smith, Fletcher, Crafter, Master)
  - Must build complete equipment set for all 6 members
  - Headquarters = collection of crafted equipment, not physical buildings

  📍 HEADQUARTERS LOCATION: (400-420, 320-335) - Guild territory near forests and mountains

  🎯 GUILD ESTABLISHMENT STRUCTURE: Complete all 5 phases over 50 rounds

  ═══════════════════════════════════════════════════════════════
  PHASE 1 - FOUNDATION & RESOURCES (Rounds 1-12)
  ═══════════════════════════════════════════════════════════════

  🎯 MANDATORY Objectives:
    - Establish guild headquarters location at (400-420, 320-335)
    - Assign 6 guild founders to specialized roles
    - Gather massive material stockpile:
      * 50+ logs (for workshops and weapons)
      * 60+ iron ore (for armory)
      * 60+ coal (for smelting operations)
      * 20+ gold ore (for premium equipment)
      * 80+ feathers (for fletching workshop)
      * 40+ string (for various crafts)
    - Organize materials at headquarters
    - Create guild charter and role responsibilities

  👥 GUILD FOUNDER ROLE ASSIGNMENTS:

  **GuildLumberjack (Resource Specialist - Wood)**
  - Primary Role: Gather all logs for guild
  - Skills: Lumberjacking 40+, Fletching 30+
  - Responsibility: 50+ logs, craft sticks for guild
  - Location Focus: Forest areas (250, 350)

  **GuildMiner (Resource Specialist - Ore)**
  - Primary Role: Extract all ores for guild
  - Skills: Mining 40+, Smithing 25+
  - Responsibility: 60+ iron ore, 60+ coal, 20+ gold ore
  - Location Focus: Mountain areas (230, 38)

  **GuildSmith (Production Specialist - Metalwork)**
  - Primary Role: Smelt bars and forge metal equipment
  - Skills: Smithing 42+, Crafting 30+
  - Responsibility: All bars, swords, axes, pickaxes, rings
  - Station: Armory (metalworking)

  **GuildFletcher (Production Specialist - Woodwork)**
  - Primary Role: Craft bows, arrows, wooden items
  - Skills: Fletching 40+, Crafting 28+
  - Responsibility: All bows, arrows, wooden equipment
  - Station: Workshop (fletching)

  **GuildCrafter (Production Specialist - Magic & Accessories)**
  - Primary Role: Create magical items, pendants, enhanced equipment
  - Skills: Crafting 45+, Magic 35+
  - Responsibility: Staffs, pendants, enhanced rings
  - Station: Enchantment Workshop (crafting)

  **GuildMaster (Coordinator & Administrator)**
  - Primary Role: Coordinate all operations, manage resources
  - Skills: Balanced (all skills 30+)
  - Responsibility: Logistics, inventory tracking, quality control
  - Position: Central coordinator at headquarters

  📍 HOW TO ESTABLISH HEADQUARTERS (Rounds 1-2):
    - All 6 founders travel to guild territory (410, 325)
    - GuildMaster establishes central coordination point
    - Use chat to declare headquarters:
      * GuildMaster: "GUILD HEADQUARTERS ESTABLISHED at (410, 325)!"
      * "Guild Charter: Build complete functional base for 6 members"
      * "Goal: Full armory, workshops, and equipment for all!"
    - All founders confirm roles:
      * GuildLumberjack: "Role confirmed: Wood Resource Specialist. Ready!"
      * GuildMiner: "Role confirmed: Ore Resource Specialist. Ready!"
      * GuildSmith: "Role confirmed: Metalwork Production. Ready!"
      * GuildFletcher: "Role confirmed: Woodwork Production. Ready!"
      * GuildCrafter: "Role confirmed: Magic & Accessories. Ready!"
      * GuildMaster: "Role confirmed: Guild Coordinator. LET'S BUILD!"

  🌲 HOW TO GATHER FOUNDATION RESOURCES (Rounds 3-12):

  **Logging Operations (Rounds 3-7):**
  - GuildLumberjack and GuildFletcher travel to Western Forest (250, 350)
  - Distance: ~160 tiles, takes 1-2 rounds travel
  - Use observe_environment radius=32 to find Oak Trees
  - Both agents harvest logs simultaneously:
    * harvest_resource targetInstance=<tree_instance>
    * GuildLumberjack: 30+ logs (primary gatherer)
    * GuildFletcher: 20+ logs (secondary)
    * Total: 50+ logs for guild
  - Takes 3-4 rounds of harvesting
  - Chat updates: "Guild logging: X/50 logs for headquarters construction"
  - While logging, also hunt for 40+ feathers (birds/bats)
  - Return to headquarters by Round 7

  **Mining Operations (Rounds 3-9):**
  - GuildMiner and GuildSmith travel to Northern Mountains (230, 38)
  - Distance: ~300 tiles, takes 2 rounds travel
  - Use observe_environment radius=32 to find rock nodes
  - Extensive mining operation:
    A) Iron Ore (Target: 60+):
       - Both agents mine iron simultaneously
       - harvest_resource targetInstance=<iron_rock>
       - GuildMiner: 40+ iron ore (primary)
       - GuildSmith: 20+ iron ore (assist)
       - Takes 3-4 rounds
       - Chat: "Guild mining: X/60 iron ore extracted"

    B) Coal (Target: 60+):
       - Both agents mine coal
       - harvest_resource targetInstance=<coal_rock>
       - GuildMiner: 40+ coal
       - GuildSmith: 20+ coal
       - Takes 2-3 rounds
       - Chat: "Guild mining: X/60 coal gathered"

    C) Gold Ore (Target: 20+):
       - GuildMiner focuses on gold (Mining 40+ required)
       - harvest_resource targetInstance=<gold_rock>
       - GuildMiner: 20+ gold ore
       - Takes 2 rounds
       - Chat: "Premium ore: X/20 gold collected for guild"

  - Return to headquarters by Round 9

  **Supply Operations (Rounds 3-10):**
  - GuildCrafter and GuildMaster stay near headquarters
  - Hunt local creatures for supplies:
    * Feathers (additional 40+ for 80 total)
    * String (40+ for bows and crafts)
    * Food/healing items (60+ for guild stockpile)
    * Gems (5+ for enhanced equipment)
  - Use observe_environment to find creatures near headquarters
  - GuildMaster tracks arriving materials:
    * Chat updates: "Guild supplies: X feathers, Y string, Z food items"
  - Prepare crafting organization system

  **Material Consolidation (Rounds 10-12):**
  - All teams return to headquarters by Round 10
  - Transfer ALL materials to GuildMaster for inventory management:
    A) GuildLumberjack → GuildMaster:
       - transfer_items targetPlayer=GuildMaster itemKey=logs count=30
    B) GuildFletcher → GuildMaster:
       - transfer_items targetPlayer=GuildMaster itemKey=logs count=20
       - transfer_items targetPlayer=GuildMaster itemKey=feather count=40
    C) GuildMiner → GuildMaster:
       - transfer_items targetPlayer=GuildMaster itemKey=ironore count=40
       - transfer_items targetPlayer=GuildMaster itemKey=coal count=40
       - transfer_items targetPlayer=GuildMaster itemKey=goldore count=20
    D) GuildSmith → GuildMaster:
       - transfer_items targetPlayer=GuildMaster itemKey=ironore count=20
       - transfer_items targetPlayer=GuildMaster itemKey=coal count=20
    E) GuildCrafter → GuildMaster:
       - transfer_items targetPlayer=GuildMaster itemKey=string count=40
       - transfer_items targetPlayer=GuildMaster itemKey=feather count=40

  - GuildMaster verifies inventory:
    * "Guild stockpile verified:"
    * "- Logs: 50+ ✓"
    * "- Iron Ore: 60+ ✓"
    * "- Coal: 60+ ✓"
    * "- Gold Ore: 20+ ✓"
    * "- Feathers: 80+ ✓"
    * "- String: 40+ ✓"
    * "- Food: 60+ ✓"
    * "PHASE 1 COMPLETE! Foundation resources secured!"
    * "Proceeding to Phase 2: Armory Construction!"

  ⏱️ TIME ALLOCATION:
    - Rounds 1-2: Headquarters establishment and role assignment
    - Rounds 3-9: Parallel resource gathering (logging, mining, supplies)
    - Rounds 10-12: Material consolidation and inventory verification

  ═══════════════════════════════════════════════════════════════
  PHASE 2 - ARMORY CONSTRUCTION (Rounds 13-24)
  ═══════════════════════════════════════════════════════════════

  🎯 Objectives:
    - Build complete guild armory
    - Smelt 60+ iron bars and 20+ gold bars
    - Craft weapons: 6x Heavy Swords, 4x Axes, 3x Pickaxes
    - Craft armor: 6x Silver Rings, 3x Gold Rings
    - Distribute basic combat equipment to all founders
    - Establish weapon maintenance protocols

  🔨 HOW TO CONSTRUCT ARMORY (Rounds 13-20):

  **Bar Smelting Operations (Rounds 13-17):**
  - GuildMaster distributes ores to smiths:
    A) To GuildSmith:
       - transfer_items targetPlayer=GuildSmith itemKey=ironore count=40
       - transfer_items targetPlayer=GuildSmith itemKey=coal count=40
       - transfer_items targetPlayer=GuildSmith itemKey=goldore count=10
    B) To GuildMiner (assist smelting):
       - transfer_items targetPlayer=GuildMiner itemKey=ironore count=20
       - transfer_items targetPlayer=GuildMiner itemKey=coal count=20
       - transfer_items targetPlayer=GuildMiner itemKey=goldore count=10

  - Iron Bar Smelting (60+ needed):
    * GuildSmith and GuildMiner work in parallel
    * Function: craft_item skill=Crafting itemKey=ironbar
    * Recipe: 1x ironore + 1x coal → 1x ironbar
    * GuildSmith crafts 40 bars (uses 40 iron + 40 coal)
    * GuildMiner crafts 20 bars (uses 20 iron + 20 coal)
    * Takes 4-5 rounds for both to complete
    * Chat updates: "Armory smelting: X/60 iron bars forged"

  - Gold Bar Smelting (20+ needed):
    * Both continue with gold smelting
    * Function: craft_item skill=Crafting itemKey=goldbar
    * Recipe: 1x goldore + 1x coal → 1x goldbar (NEED MORE COAL!)
    * Wait - we used all 60 coal for iron! Need to adjust:
      * Actually smelt only 50 iron bars (save 10 coal)
      * Then smelt 10 gold bars with remaining coal
      * Need to gather 10 more coal for remaining 10 gold bars
    * Quick coal gathering mission (Round 16):
      * GuildMiner returns to mountains
      * Gathers 10+ additional coal quickly (1-2 rounds)
      * Returns and completes gold smelting
    * Chat: "Armory smelting: 20/20 gold bars complete!"

  **Weapon Forging (Rounds 18-20):**

  - GuildSmith receives bars from GuildMiner:
    * transfer_items targetPlayer=GuildSmith itemKey=ironbar count=30
    * transfer_items targetPlayer=GuildSmith itemKey=goldbar count=10
    * GuildSmith now has: 50+ iron bars, 10+ gold bars

  A) Heavy Swords (6x for all guild members):
     - Function: craft_item skill=Smithing itemKey=sword2
     - Recipe: 2x ironbar + 1x hilt2 → 1x Heavy Sword
     - Need 12 iron bars + 6 hilts
     - Check starting inventories for hilts! Some founders have them
     - GuildSmith crafts 6 swords (Round 18-19)
     - Chat: "Armory weapons: 6/6 Heavy Swords forged for guild!"

  B) Axes (4x for utility and backup):
     - Function: craft_item skill=Smithing itemKey=axe
     - Recipe: 3x ironbar + 1x logs → 1x Axe
     - Need 12 iron bars + 4 logs
     - GuildMaster provides logs to GuildSmith
     - GuildSmith crafts 4 axes (Round 19)
     - Chat: "Armory weapons: 4/4 Axes crafted!"

  C) Pickaxes (3x for mining/utility):
     - Function: craft_item skill=Smithing itemKey=pickaxe
     - Recipe: 5x ironbar + 1x logs → 1x Pickaxe
     - Need 15 iron bars + 3 logs
     - GuildSmith crafts 3 pickaxes (Round 20)
     - Chat: "Armory tools: 3/3 Pickaxes ready!"

  **Armor Forging (Rounds 21-24):**

  A) Silver Rings (6x for all guild members):
     - Function: craft_item skill=Smithing itemKey=silverring
     - Recipe: 2x ironbar → 1x silverring
     - Need 12 iron bars
     - GuildSmith crafts 6 silver rings (Round 21-22)
     - Basic defense for all members
     - Chat: "Armory defense: 6/6 Silver Rings forged!"

  B) Gold Rings (3x for senior members):
     - Function: craft_item skill=Smithing itemKey=goldring
     - Recipe: 2x goldbar → 1x goldring
     - Need 6 gold bars
     - GuildSmith crafts 3 gold rings (Round 22-23)
     - Premium defense for GuildMaster, GuildSmith, GuildMiner
     - Chat: "Armory premium: 3/3 Gold Rings created!"

  **Initial Equipment Distribution (Round 24):**
  - GuildSmith distributes armory equipment:
    * GuildLumberjack: Heavy Sword, Silver Ring
    * GuildMiner: Heavy Sword, Gold Ring
    * GuildSmith: Heavy Sword, Gold Ring (keeps one)
    * GuildFletcher: Axe, Silver Ring
    * GuildCrafter: Axe, Silver Ring
    * GuildMaster: Heavy Sword, Gold Ring
    * Remaining: 2 Heavy Swords, 2 Axes, 3 Pickaxes, 3 Silver Rings (reserve)

  - All founders equip armory gear:
    * Each uses equip_item for weapon and ring
    * verify_inventory to confirm equipment
    * Chat: "Guild member X: Equipped with Heavy Sword + Silver Ring. Guild armory functional!"

  - GuildMaster announces:
    * "PHASE 2 COMPLETE! Guild Armory established!"
    * "Weapons forged: 6 swords, 4 axes, 3 pickaxes ✓"
    * "Armor created: 6 silver rings, 3 gold rings ✓"
    * "All guild members equipped with basic combat gear!"
    * "Proceeding to Phase 3: Workshop Development!"

  ⏱️ TIME ALLOCATION:
    - Rounds 13-17: Bar smelting operations (50 iron, 20 gold bars)
    - Rounds 18-20: Weapon forging (6 swords, 4 axes, 3 pickaxes)
    - Rounds 21-23: Armor forging (6 silver rings, 3 gold rings)
    - Round 24: Initial equipment distribution

