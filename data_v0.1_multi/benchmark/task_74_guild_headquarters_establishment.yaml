  PHASE 3 - WORKSHOP DEVELOPMENT (Rounds 25-36)
  ═══════════════════════════════════════════════════════════════

  🎯 Objectives:
    - Build Fletching Workshop: craft bows, arrows, ammunition
    - Build Enchantment Workshop: craft magical staffs, pendants
    - Create utility equipment: additional tools, supplies
    - Establish guild stockpiles: ammunition, healing items
    - Develop specialized capabilities for each workshop

  🏹 HOW TO BUILD FLETCHING WORKSHOP (Rounds 25-30):

  **Material Preparation (Round 25):**
  - GuildMaster distributes wood materials to GuildFletcher:
    * transfer_items targetPlayer=GuildFletcher itemKey=logs count=25
    * transfer_items targetPlayer=GuildFletcher itemKey=feather count=60
    * transfer_items targetPlayer=GuildFletcher itemKey=string count=20

  **Stick Production (Rounds 26):**
  - GuildFletcher crafts sticks from logs:
    * Function: craft_item skill=Fletching itemKey=stick
    * Recipe: 1x logs → 4x sticks
    * Use 20 logs to create 80 sticks
    * Chat: "Workshop: 80/80 sticks crafted for fletching operations"

  **Bow Crafting (Rounds 27-28):**
  - GuildFletcher crafts bows:
    A) Wooden Bows (5x for guild):
       - Function: craft_item skill=Fletching itemKey=woodenbow
       - Recipe: 1x logs + 1x string → 1x Wooden Bow
       - Use 5 logs + 5 string
       - Craft 5 bows (Round 27-28)
       - Chat: "Fletching Workshop: 5/5 Wooden Bows crafted!"

  **Arrow Production (Rounds 29-30):**
  - GuildFletcher crafts massive arrow stockpile:
    * Function: craft_item skill=Fletching itemKey=arrow
    * Recipe: 10x stick + 10x feather → 10x arrows
    * Have 80 sticks + 60 feathers
    * Can craft 60 arrows total (6 batches)
    * Takes 2 rounds
    * Chat: "Fletching Workshop: 60/60 arrows produced! Guild ammunition ready!"

  **Workshop Equipment Distribution (Round 30):**
  - GuildFletcher distributes fletching products:
    * GuildLumberjack: Wooden Bow, 12 arrows
    * GuildMiner: 12 arrows (backup ammo)
    * GuildFletcher: Wooden Bow, 12 arrows (keeps one)
    * GuildCrafter: Wooden Bow, 12 arrows
    * GuildMaster: Wooden Bow, 12 arrows
    * Reserve: 1 Wooden Bow, 12 arrows (guild stockpile)
  - Chat: "Fletching Workshop operational! 5 bows and 60 arrows distributed!"

  🔮 HOW TO BUILD ENCHANTMENT WORKSHOP (Rounds 31-36):

  **Material Preparation (Round 31):**
  - GuildMaster distributes magical materials to GuildCrafter:
    * transfer_items targetPlayer=GuildCrafter itemKey=stick count=20
    * transfer_items targetPlayer=GuildCrafter itemKey=bead count=4 (check starting inventory!)
    * transfer_items targetPlayer=GuildCrafter itemKey=string count=15
    * transfer_items targetPlayer=GuildCrafter itemKey=emerald count=3 (if collected)

  **Magical Staff Crafting (Rounds 32-34):**
  - GuildCrafter creates magical arsenal:
    A) Basic Magic Staffs (3x base):
       - Function: craft_item skill=Crafting itemKey=staff
       - Recipe: 5x stick + 1x bead → 1x Magic Staff
       - Use 15 sticks + 3 beads
       - Craft 3 basic staffs
       - Chat: "Enchantment Workshop: 3/3 basic Magic Staffs created!"

    B) Enhanced Staffs (if special beads available):
       - Lightning Staff: craft_item skill=Crafting itemKey=lightningstaff
         Recipe: 1x staff + 1x lightningbead → 1x Lightning Staff
       - Fire Staff: craft_item skill=Crafting itemKey=firestaff
         Recipe: 1x staff + 1x firebead → 1x Fire Staff
       - Nature Staff: craft_item skill=Crafting itemKey=naturestaff
         Recipe: 1x staff + 1x naturebead → 1x Nature Staff
       - Craft 1-2 enhanced staffs if materials available
       - Chat: "Enchantment Workshop: Enhanced staffs crafted! (if beads available)"

  **Pendant Crafting (Rounds 35-36):**
  - GuildCrafter creates magical accessories:
    A) Emerald Pendants (2-3x if gems available):
       - Function: craft_item skill=Crafting itemKey=emeraldpendant
       - Recipe: 1x emerald + 1x string → 1x Emerald Pendant
       - Craft 2-3 pendants with available gems
       - Chat: "Enchantment Workshop: Emerald Pendants crafted!"

    B) Enhanced Rings with Gems:
       - If additional gems and base rings available:
         * Emerald Ring: 1x emerald + 1x silverring
         * Ruby Ring: 1x ruby + 1x silverring (if ruby collected)
       - Upgrade 2-3 silver rings to enhanced versions
       - Chat: "Enchantment Workshop: Enhanced rings upgraded!"

  **Workshop Equipment Distribution (Round 36):**
  - GuildCrafter distributes enchantment products:
    * GuildCrafter: Magic Staff or Enhanced Staff (keeps best)
    * GuildMaster: Magic Staff, Emerald Pendant
    * GuildSmith: Emerald Pendant, Enhanced Ring
    * Others: Any remaining pendants or enhanced equipment
  - All recipients equip magical gear
  - Chat: "Enchantment Workshop operational! Magical equipment distributed!"

  - GuildMaster announces:
    * "PHASE 3 COMPLETE! Guild Workshops established!"
    * "Fletching Workshop: 5 bows, 60 arrows ✓"
    * "Enchantment Workshop: 3+ staffs, 2-3 pendants, enhanced rings ✓"
    * "All workshops functional! Guild infrastructure complete!"
    * "Proceeding to Phase 4: Member Outfitting - specialized equipment!"

  ⏱️ TIME ALLOCATION:
    - Rounds 25-30: Fletching Workshop construction (bows, arrows)
    - Rounds 31-36: Enchantment Workshop construction (staffs, pendants, enhanced gear)

