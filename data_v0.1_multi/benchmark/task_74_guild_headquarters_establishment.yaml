  - Equipment needed: Axe (best tool for logging), Wooden Bow (ranged)
  - Current: Heavy Sword, Silver Ring, Wooden Bow, 12 arrows
  - Upgrade: Replace Heavy Sword with Axe (better for role)
  - Final loadout:
    * Primary: Axe (dual purpose: logging and combat)
    * Secondary: Wooden Bow, 12 arrows
