  - Equipment needed: Pickaxe (essential), Heavy Sword (combat)
  - Current: Heavy Sword, Gold Ring, 12 arrows
  - Upgrade: Add Pickaxe for mining operations
  - Final loadout:
    * Primary: Heavy Sword (combat)
    * Utility: Pickaxe (mining)
