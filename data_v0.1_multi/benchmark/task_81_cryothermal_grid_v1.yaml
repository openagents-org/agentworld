# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Simplified 6-agent dual-pylon energy project

task:
  name: "Cryothermal Grid Stabilization - Core Energy Project"
  description: "Six specialists connect ice and lava resources by building two synchronized pylons"

# Task objectives
objectives:
  primary: "Stabilize the cryothermal grid by collecting resources and activating pylons at 2 locations within 40 rounds"
  secondary:
    - "Phase 1 (Rounds 1-10): Ice squad harvests icelogs and icebeads"
    - "Phase 2 (Rounds 11-20): Lava squad harvests bloodwoodlogs and firebeads"
    - "Phase 3 (Rounds 21-30): Alloy squad mines and smelts 8 ironbar, crafts 2 silver ring connectors"
    - "Phase 4 (Rounds 31-40): Assembly and activate two pylons"

# Relevant game context
relevant_game_context: |
  WORKFLOW SNAPSHOT
  - Agents 1-2 (Ice Stabilizers) harvest ice resources.
  - Agents 3-4 (Lava Stabilizers) control heat vents and collect bloodwood + firebeads.
  - Agents 5-6 (Metalworks) gather ores, smelt bars, craft staffs.

  KEY TASK DETAILS
  1. Ice squad harvests >=8 icelogs + >=2 icebeads.
  2. Lava squad harvests >=8 bloodwoodlogs + >=2 firebeads.
  3. Metalworks smelts 8 ironbar and crafts 2 silverring + 2 staffs.
  4. Activate pylons at North and South positions.
# Limitations
max_action_steps: 40

