# Success criteria for multi-agent task
success_criteria:
  - "Phase 1 completed: Team crafts 2x Heavy Swords and 8+ iron bars"
  - "Phase 1: Team gathers 4+ logs and mines 8+ iron ore and coal"
  - "Phase 2 completed: Goblin boss (Level 10-15) defeated"
  - "Phase 2: Team coordinates attack with proper positioning and HP checks"
  - "Phase 3 completed: Team heals and gathers additional materials"
  - "Phase 4 completed: Skeleton boss (Level 15-20) defeated"
  - "Phase 4: Team searches dark areas and locates skeleton successfully"
  - "Phase 5 completed: Ogre boss (Level 25-30) defeated"
  - "Phase 5: Team manages difficult boss fight with healing and coordination"
  - "All 3 bosses defeated: Goblin, Skeleton, and Ogre"
  - "All three warriors survive entire 40-round campaign with HP > 0"
  - "Campaign takes 35-40 rounds (NOT completed in under 30 rounds)"
  - "Team uses chat extensively to coordinate all 5 phases"
  - "5-phase boss raid campaign successfully completed"
