  PHASE 4 - VOLCANIC MASTERY (Rounds 35-46)
  ═══════════════════════════════════════════════════════════════

  🎯 Objectives:
    - Return to Central Hub for fire equipment crafting
    - Craft fire-element equipment: Fire Staffs, golden weapons, heat-resistant gear
    - ALL 8 agents travel to Volcanic biome together
    - Engage and defeat volcanic guardians (Dark Ogres Level 28-35, Fire creatures)
    - Survive heat environmental effects
    - Achieve Volcanic Mastery (hardest biome!)

  🔥 HOW TO CRAFT FIRE EQUIPMENT (Rounds 35-41):

  **Rounds 35-36: Return to Central Hub**
  - Travel from Mountains (230, 38) to Hub (515, 390)
  - Takes 2-3 rounds
  - Chat: "Returning to Hub for fire equipment forging. Volcanic phase preparation!"

  **Rounds 37-41: Fire Equipment Crafting**

  A) Smelt Gold Bars (15+ for premium equipment):
     - Function: craft_item skill=Crafting itemKey=goldbar
     - Recipe: 1x goldore + 1x coal → 1x goldbar
     - Use 15 gold ore from Volcanic Team gathering
     - Need additional coal! Quick gather if short
     - ElementFire1 and ElementFire2 handle smelting
     - Chat: "Gold bars: X/15 smelted for fire weapons"

  B) Fire Staffs (2-3x for fire mages):
     - First craft basic staffs if needed (5x stick + 1x bead)
     - Then enhance with fire beads:
       * Function: craft_item skill=Crafting itemKey=firestaff
       * Recipe: 1x staff + 1x firebead → 1x Fire Staff
     - Craft 2 Fire Staffs using collected fire beads
     - Most powerful elemental staffs!
     - Chat: "Fire element: 2/2 Fire Staffs forged! Maximum power!"

  C) Axes (3x for volcanic combat):
     - Function: craft_item skill=Smithing itemKey=axe
     - Recipe: 3x ironbar + 1x logs → 1x Axe
     - Use remaining iron bars (should have some left)
     - Axes effective against tough volcanic enemies
     - Chat: "Fire melee: 3/3 Axes crafted!"

  D) Gold Rings (4x for heat resistance):
     - Function: craft_item skill=Smithing itemKey=goldring
     - Recipe: 2x goldbar → 1x goldring
     - Requires 8 gold bars
     - Critical for volcanic heat protection!
     - Chat: "Heat resistance: 4/4 Gold Rings forged!"

  E) Enhanced Rings with Gems (3x if have gems):
     - If collected gems from previous phases:
       * Ruby Ring: craft_item skill=Crafting itemKey=rubyring
         Recipe: 1x ruby + 1x goldring → 1x Ruby Ring
       * Topaz Ring: craft_item skill=Crafting itemKey=topazring
         Recipe: 1x topaz + 1x goldring → 1x Topaz Ring
     - Craft 2-3 enhanced rings for main fighters
     - Chat: "Premium fire gear: Enhanced Rings crafted!"

  F) Additional Healing Items:
     - Use remaining food items from all phases
     - Hunt near Central Hub for additional supplies
     - Target: 80+ healing items total across team
     - Critical for tough volcanic battles!
     - Chat: "Healing supplies: X/80 stockpiled for volcanic phase"

  **Equipment Distribution (Round 41):**
  - ElementFire1: Fire Staff, Enhanced Ruby Ring (or Gold Ring)
  - ElementFire2: Fire Staff, Gold Ring
  - ElementIce1: Heavy Sword, Enhanced Ring
  - ElementIce2: Axe, Gold Ring
  - ElementForest1: Nature Staff, Silver Ring, 10+ healing items
  - ElementForest2: Axe, Silver Ring, 10+ healing items
  - ElementWater1: Wooden Bow, Gold Ring, 15 arrows, 10+ healing
  - ElementWater2: Axe, Silver Ring, 15 arrows, 10+ healing
  - All agents equip fire gear, verify inventory
  - Chat: "All agents equipped for volcanic assault! Fire element ready!"

  🔥 HOW TO ACHIEVE VOLCANIC MASTERY (Rounds 42-46):

  **Round 42-43: Travel to Volcanic Combat Zone**
  - ALL 8 agents travel from Hub to Volcanic region (150, 650)
  - Distance: ~450 tiles, takes 2-3 rounds (longest journey!)
  - Expect HEAT environmental effects near lava
  - Chat: "Expedition departing for Volcanic region. Fire Mastery - Ultimate test!"
  - "Gold rings equipped for heat protection. Healing items ready. LET'S GO!"

  **Round 44: Scout Volcanic Guardians**
  - Use observe_environment radius=64
  - Locate volcanic guardians:
    * Dark Ogres (Level 28-35) - volcanic giants
    * Fire Spiders (Level 25-30) - lava creatures
    * Possibly Ogre Lord (Level 40+) - AVOID if present!
  - Identify 1-2 targets (volcanic enemies are TOUGH!)
  - ElementFire1: "Volcanic guardians detected! Dark Ogres Level 28-35 at (X,Y)."
  - "CRITICAL: These are our toughest enemies yet! ALL agents ready check!"
  - MANDATORY: All HP = 100%, all healing items confirmed

  **Rounds 45-46: Volcanic Guardian Combat (ULTIMATE CHALLENGE)**

  First Volcanic Guardian (Round 45):
  - ElementFire1: "ALL AGENTS! FOCUS FIRE! VOLCANIC GUARDIAN 1!"
  - "Fire Staffs at maximum power! ENGAGE!"
  - All 8 agents: attack_mob targetInstance=<dark_ogre1>
  - Battle will take 1-2 rounds (toughest enemies yet!)
  - Post-combat: IMMEDIATELY check all agent HP
  - Heal any agent below 85% to 90%+
  - Chat: "Guardian 1 defeated! Fire Staffs proving devastating!"
  - "Team HP: [list all agents]. Healing if needed before next engagement."

  Second Volcanic Guardian OR Heat Survival (Round 46):
  - If team in good condition (all > 85% HP):
    * Engage second guardian with same tactics
    * ElementFire2: "ENGAGE GUARDIAN 2! VOLCANIC MASTERY!"
    * All agents focus fire
    * Post-combat healing
  - If team weakened (any < 80% HP):
    * Skip second guardian
    * Demonstrate heat survival for 2 rounds
    * Use gold rings to resist heat damage
    * Chat: "Heat resistance test: Surviving volcanic environment!"

  Volcanic Mastery Achievement:
  - ElementFire1: "VOLCANIC MASTERY ACHIEVED!"
  - "🔥 Fire equipment tested: Fire Staffs DEVASTATING, Gold Rings protect from heat!"
  - "Volcanic guardians defeated: 1-2 Dark Ogres eliminated! (Level 28-35)"
  - "Heat environmental effects survived successfully!"
  - "This was our hardest trial! Team has proven elemental mastery!"
  - "Preparing for Phase 5: Coastal Finale - Water element and ultimate boss!"

  ⏱️ TIME ALLOCATION:
    - Rounds 35-36: Return to Central Hub (2 rounds)
    - Rounds 37-41: Craft fire equipment (5 rounds)
    - Rounds 42-43: Travel to volcanic region (2 rounds)
    - Round 44: Scout volcanic guardians (1 round)
    - Rounds 45-46: Combat and mastery achievement (2 rounds)

