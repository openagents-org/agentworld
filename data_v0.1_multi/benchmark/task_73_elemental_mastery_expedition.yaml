  PHASE 5 - COASTAL FINALE (Rounds 47-54)
  ═══════════════════════════════════════════════════════════════

  🎯 Objectives:
    - Return to Central Hub for final preparations
    - Consolidate all elemental equipment
    - ALL 8 agents travel to Coastal biome together
    - Engage coastal guardians (Water Guardians Level 30-40)
    - Defeat ultimate aquatic boss (Mini Sea Dragon Level 35-45 OR Sea Dragon Level 50+)
    - Achieve Water Mastery and complete Elemental Mastery Expedition
    - Demonstrate mastery of all 4 elements

  🌊 HOW TO PREPARE FOR COASTAL FINALE (Rounds 47-49):

  **Round 47-48: Return and Final Preparation**
  - Travel from Volcanic (150, 650) to Hub (515, 390)
  - Takes 2 rounds
  - Consolidate equipment and healing supplies
  - All agents heal to 100% HP
  - Verify all equipment equipped correctly
  - ElementWater1: "Final preparation: Coastal finale begins!"
  - "All elemental equipment consolidated:"
  - "- Nature: 2 Nature Staffs ✓"
  - "- Ice: Heavy Swords, Silver Rings ✓"
  - "- Fire: 2 Fire Staffs, Gold Rings ✓"
  - "- Water: Ready to test Wooden Bows in aquatic combat!"

  **Round 49: Strategy Session**
  - Team discusses coastal strategy
  - Assign roles for final battles:
    * ElementFire1 & ElementFire2: Primary damage (Fire Staffs)
    * ElementIce1 & ElementIce2: Melee assault (Heavy Swords)
    * ElementForest1: Support magic (Nature Staff)
    * ElementForest2: Utility and backup (Axe)
    * ElementWater1 & ElementWater2: Ranged damage (Bows + Arrows)
  - Distribute remaining healing items (10+ per agent)
  - ElementWater1: "Strategy finalized! Departing for Coastal finale!"

  🌊 HOW TO ACHIEVE COASTAL MASTERY (Rounds 50-54):

  **Round 50-51: Travel to Coastal Combat Zone**
  - ALL 8 agents travel from Hub (515, 390) to Eastern Coast (900, 400)
  - Distance: ~400 tiles, takes 2 rounds
  - Chat: "Elemental expedition departing for Coastal region!"
  - "Water Mastery - Final element! Ultimate boss awaits!"

  **Round 52: Scout Coastal Guardians and Ultimate Boss**
  - Use observe_environment radius=64 extensively
  - Locate water guardians and boss:
    * Water Guardians (Level 30-40) - aquatic defenders
    * Mini Sea Dragon (Level 35-45) - major boss
    * OR Sea Dragon (Level 50+) - ULTIMATE boss (assess if viable!)
  - ElementWater1: "Coastal guardians located!"
