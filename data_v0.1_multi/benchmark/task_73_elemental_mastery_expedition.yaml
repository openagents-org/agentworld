# AgentWorld Multi-Agent Task Configuration

task:
  name: "Elemental Mastery Expedition - Multi-Biome Conquest"
  description: "Eight elementalists journey across four biomes, gathering elemental materials, crafting specialized weapons, and mastering environmental combat"

# Task objectives
objectives:
  primary: "Complete a 5-phase elemental mastery journey spanning 54 rounds across forest, mountain, volcanic, and coastal biomes"
  secondary:
    - "Phase 1 (Rounds 1-10): Gathering Convergence - Collect basic materials from all biomes simultaneously"
    - "Phase 2 (Rounds 11-22): Forest Mastery - Craft nature-based equipment and conquer forest guardians"
    - "Phase 3 (Rounds 23-34): Mountain Mastery - Create ice/earth equipment and defeat mountain bosses"
    - "Phase 4 (Rounds 35-46): Volcanic Mastery - Forge fire equipment and survive volcanic encounters"
    - "Phase 5 (Rounds 47-54): Coastal Finale - Master water element and defeat ultimate aquatic boss"

# Relevant game context
relevant_game_context: |
  EXPEDITION PLAN
  - Eight elementalists split into pairs, cover four biomes (forest, mountain, volcanic, coastal), and regroup between phases to craft themed gear. Each phase (≈10 rounds) follows the same rhythm: gather biome materials → craft elemental equipment at the hub → travel as a full squad to that biome → defeat 2-3 guardians while managing environmental effects.

  PHASE HIGHLIGHTS
  1. R1-10 Gathering Convergence: four teams depart simultaneously (≤32-tile hops) to collect logs/feathers, ores/ice logs, gold/cinnabar, and strings/food. Return to the central hub and transfer everything via transfer_items with verify_inventory confirmations.
  2. R11-22 Forest Mastery: craft nature staffs, beryl pendants, wooden bows, and 50 arrows; march to (250,350), defeat goblin guardians together, then loot and rest.
  3. R23-34 Mountain Mastery: smelt 30+ iron bars, craft heavy swords/pickaxes/silver rings (and ice staffs if beads exist), travel north (~230,38), fight skeletons/ice mobs while watching cold damage, then confirm mastery.
  4. R35-46 Volcanic Mastery: forge fire gear (golden weapons, fire staffs, heat-resistant accessories), move to (~150,650), and focus-fire dark ogres/fire mobs while tracking heat ticks; gather fire beads for later use.
  5. R47-54 Coastal Finale: restock water-themed gear (bows, aquatic pendants, cooking), sail to (~900,400), defeat aquatic bosses, and announce final mastery before complete().

  EXECUTION NOTES
  - Without observe_environment, sweep the target grid manually and rely on harvest_resource/attack_mob feedback plus inventory counts.
  - Keep a phase checklist in chat (“Forest mats ✅, Nature gear ✅, Guardians 2/3”) so everyone knows progress.
  - Travel in ≤32-tile steps, announcing coordinates when moving as a squad; environmental hazards require staying above 80% HP at all times.
# Limitations
max_action_steps: 54

