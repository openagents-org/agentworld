# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Simple mining, just smelt iron bars (no equipment crafting)

task:
  name: "Grand Mining Expedition - Iron Smelting Operation"
  description: "Three agents mine iron ore and coal, then smelt 6x iron bars"

# Task objectives
objectives:
  primary: "Mine resources and smelt 6x iron bars through coordination"
  secondary: # checkpoints
    - "Coordinate mining and smelting"
    - "Complete smelting within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a simplified mining and smelting scenario.

  OBJECTIVE: Mine ore and coal, then smelt iron bars.

  MISSION REQUIREMENTS:
  - Mine 6x iron ore from iron rocks
  - Mine 6x coal from coal rocks
  - Smelt 6x iron bars

  TEAM COORDINATION:
  - Iron miner focuses on iron ore
  - Coal miner focuses on coal
  - Smelter combines materials

  STARTING RESOURCES:
  - Iron miner starts with 2x ironore
  - Coal miner starts with 3x coal
  - Smelter starts with 1x ironore + 1x coal

  SMELTING:
  🔥 Smelting - ironbar:
    - craft_item skill=Smelting itemKey=ironbar
    - Materials: 1x ironore + 1x coal → 1x ironbar
    - Target: 6x ironbar total

  DO NOT use complete() until 6x ironbar is produced!

# Limitations
max_action_steps: 25

