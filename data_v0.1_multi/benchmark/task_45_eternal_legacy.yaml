# AgentWorld Multi-Agent Task Configuration

task:
  name: "Eternal Legacy Creation - Timeless Achievement and Immortal Contribution"
  description: "Three agents work together to create an eternal legacy, establish timeless achievements, and make immortal contributions to all existence"

# Task objectives
objectives:
  primary: "Successfully create an eternal legacy, establish timeless achievements, and make immortal contributions to all existence"
  secondary: # checkpoints
    - "Establish eternal legacy planning coordination and timeless achievement preparation"
    - "Execute coordinated Legacy Guardian trials and immortal contribution creation"
    - "Complete eternal legacy creation within 45 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is the ultimate cooperative legacy creation scenario representing the pinnacle of all achievements in AgentWorld.
  
  OBJECTIVE: Create an eternal legacy, establish timeless achievements, and make immortal contributions to all existence.
  
  MISSION REQUIREMENTS:
  - Navigate to Eternity Chamber (Region 13-12: coordinates 1900-1950, 1500-1550)
  - Demonstrate worthiness through trials that test all accumulated knowledge and skills
  - Defeat Legacy Guardians (Level 88) that guard the power to create eternal legacies
  - Create lasting contributions that will benefit all future existence across infinite time
  
  TEAM COORDINATION:
  - Use global chat for ultimate coordination representing the peak of teamwork mastery
  - Coordinate between legacy planning, guardian trials, and immortal contribution creation
  - Share all accumulated wisdom and provide maximum support for eternal achievement
  - Work together to create the ultimate testament to cooperative excellence
  
  GENERAL STRATEGY:
  - This represents the ultimate test of everything learned throughout all previous tasks
  - Legacy Guardians (Level 88) are the highest-level challenges in all of AgentWorld
  - Eternal legacy creation requires perfect integration of all skills and knowledge
  - Immortal contributions must demonstrate mastery of combat, crafting, magic, and cooperation
  - This is the ultimate demonstration of agent capability and team coordination
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  ETERNAL LEGACY MASTERY (CRITICAL KNOWLEDGE):
  ⏳ Eternity Chamber Access:
    - Use eternal_access action requiring demonstration of all accumulated achievements
    - Must prove mastery of combat, crafting, magic, exploration, and cooperation
    - Access requires perfect team coordination and comprehensive skill demonstration
    - Coordinate skill exhibitions to showcase complete AgentWorld mastery
  
  👑 Combat - Legacy Guardians:
    - Use observe_environment to locate Legacy Guardians at chamber entrance (1925,1515) and heart (1935,1530)
    - Level 88 ultimate entities representing the highest combat challenge possible
    - Expect tests of all combat skills, magical abilities, and strategic coordination
    - Guardians test worthiness for eternal legacy creation through ultimate trials
    - Victory requires perfect integration of all learned combat and magical techniques
  
  📜 Eternal Legacy Creation:
    - Use create_legacy action at Eternity Chamber heart coordinates (1930,1525)
    - Requires legacy crystals, eternal essence, and demonstration of ultimate worthiness
    - Create contributions that will benefit all future generations across infinite time
    - Coordinate legacy elements to showcase mastery of all AgentWorld systems
  
  🏆 Timeless Achievement Establishment:
    - Document and establish achievements that transcend temporal limitations
    - Create monuments to cooperation, skill mastery, and beneficial contribution
    - Establish teaching systems for future agents based on accumulated wisdom
    - Coordinate achievement documentation to inspire infinite future success
  
  ✨ Immortal Contribution Manifestation:
    - Create lasting improvements to AgentWorld that will benefit all future existence
    - Establish systems, knowledge, and improvements that transcend individual achievement
    - Coordinate contributions that demonstrate the ultimate value of cooperation
    - Leave eternal testament to the power of teamwork and coordinated excellence

# Limitations
max_action_steps: 45

