# AgentWorld Multi-Agent Task Configuration
# VARIANT: Easy version - reduced targets and more time

task:
  name: "Deep Ocean Expedition - Underwater Resource Discovery (Easy)"
  description: "Eight agents embark on a simplified ocean exploration mission, fishing, hunting sea creatures, and establishing coastal supply chains"

# Task objectives
objectives:
  primary: "Complete deep ocean expedition gathering 80+ seafood items, defeating 2+ sea bosses, and establishing coastal fishing station within 60 rounds"
  secondary: # checkpoints
    - "Phase 1 (Rounds 1-15): Coastal Setup - Establish base camp and gather initial supplies"
    - "Phase 2 (Rounds 16-30): Deep Sea Fishing - Catch 50+ rawshrimp, jellyfish, and other seafood"
    - "Phase 3 (Rounds 31-45): Ocean Combat - Hunt sea creatures and defeat marine bosses"
    - "Phase 4 (Rounds 46-60): Culinary Processing - Cook massive feast with 40+ prepared meals"

# Relevant game context (Hint)
relevant_game_context: |
  DEEP OCEAN EXPEDITION OVERVIEW (EASY MODE):

  Eight brave adventurers must explore the coastal waters, harvest marine resources,
  battle sea monsters, and establish a permanent fishing industry.

  EXPEDITION TEAMS:

  MASTER FISHING FLEET (Agents 1-4) - Marine Harvesting

  **Location**: Coastal Region (580, 750)
  **Mission**: Harvest 50+ seafood from fishing spots

  **Team**:
  - Agent 1 (Fleet Admiral): Coordinate all fishing operations
  - Agent 2 (Master Fisher Alpha): Catch shrimp and fish
  - Agent 3 (Master Fisher Beta): Catch jellyfish
  - Agent 4 (Fisher Gamma): Support fishing

  **Fishing Goals**:
  - 30x rawshrimp (primary catch)
  - 15x jellyfish (secondary catch)
  - 5x other fish (clams, crabs)
  - Use harvest_resource on fishing spots
  - All agents need fishing rods equipped

  MARINE COMBAT SQUAD (Agents 5-6) - Sea Monster Hunters

  **Location**: Deep Waters (580, 755)
  **Mission**: Defeat 2+ sea bosses and protect fishing fleet

  **Team**:
  - Agent 5 (Sea Captain): Lead combat operations
  - Agent 6 (Harpooner): Primary damage dealer

  **Combat Targets**:
  - Hermit Crab Warrior (Level 30) at (224, 359)
  - Water Guardian (Level 36) at (197, 633)

  **Combat Strategy**:
  - Travel to boss locations
  - Coordinate synchronized attacks
  - Maintain HP above 70%
  - Use healing items liberally

  CULINARY MASTERS (Agents 7-8) - Food Processing

  **Location**: Coastal Kitchen (585, 752)
  **Mission**: Cook 40+ seafood meals for expedition

  **Team**:
  - Agent 7 (Head Chef): Cook premium dishes
  - Agent 8 (Sous Chef): Cook standard meals

  **Cooking Goals**:
  - 25x cookedshrimp (rawshrimp -> cookedshrimp)
  - 10x jellyfishsmoothie (jellyfish -> smoothie)
  - 5x other cooked seafood
  - Minimum 40 total prepared meals

  **Recipes**:
  - craft_item skill=Cooking itemKey=cookedshrimp
  - craft_item skill=Cooking itemKey=jellyfishsmoothie

  SUCCESS CRITERIA:
  1. Catch 50+ seafood items (30 shrimp, 15 jellyfish, 5 other)
  2. Defeat 2+ marine bosses
  3. Cook 40+ prepared meals
  4. All teams coordinate effectively
  5. Complete within 60 rounds

# Limitations
max_action_steps: 60

