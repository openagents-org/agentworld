# AgentWorld Multi-Agent Task Configuration

task:
  name: "Survival Expedition - Resource Management and Environmental Adaptation"
  description: "Three agents work together to survive in challenging environments, manage limited resources efficiently, and adapt to environmental hazards"

# Task objectives
objectives:
  primary: "Successfully survive in challenging environments, manage limited resources efficiently, and demonstrate environmental adaptation skills"
  secondary: # checkpoints
    - "Establish survival coordination and resource management procedures"
    - "Execute efficient resource collection and environmental adaptation strategies"
    - "Complete survival expedition within 36 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent survival scenario requiring resource management, environmental adaptation, and team survival skills.
  
  OBJECTIVE: Survive in challenging environments, manage limited resources efficiently, and demonstrate environmental adaptation skills.
  
  MISSION REQUIREMENTS:
  - Establish survival operations in challenging environmental conditions
  - Efficiently collect and manage limited resources for team survival
  - Adapt to environmental hazards and challenging terrain conditions
  - Demonstrate effective team survival coordination and resource sharing
  
  TEAM COORDINATION:
  - Use global chat for survival coordination and resource status updates
  - Coordinate between resource collection, survival planning, and hazard management
  - Share survival knowledge and provide support during challenging conditions
  - Work together to handle environmental challenges and resource scarcity
  
  GENERAL STRATEGY:
  - This requires careful resource management and environmental awareness
  - Survival requires efficient resource collection and conservation techniques
  - Environmental challenges provide opportunities for adaptation and teamwork
  - Effective survival techniques require coordination and resource sharing
  - Balance resource collection with team safety and survival priorities
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  SURVIVAL EXPEDITION OPERATIONS (CRITICAL KNOWLEDGE):
  🏥 Survival Coordination:
    - Use observe_environment to scout areas suitable for resource collection and safe shelter
    - Establish survival positions for coordinated resource management
    - Navigate challenging terrain while maintaining team safety and coordination
    - Coordinate survival activities to optimize resource collection and team safety
  
  📦 Resource Collection and Management:
    - Use observe_environment to locate available resources and collection opportunities
    - Focus on efficient resource collection using available gathering skills
    - Practice resource conservation and efficient inventory management
    - Coordinate resource sharing and distribution among team members
    - Balance resource collection with team survival and safety priorities
  
  🌍 Environmental Adaptation:
    - Adapt to challenging environmental conditions and terrain obstacles
    - Requires survival skills and environmental awareness
    - Coordinate team movement and positioning for optimal safety
    - Balance exploration efficiency with environmental hazard management
  
  🤝 Team Survival Coordination:
    - Share survival knowledge and coordinate survival strategies between team members
    - Coordinate survival activities to maximize team effectiveness and safety
    - Provide mutual support during challenging environmental conditions
    - Focus on practical survival applications and team coordination techniques
  
  🎯 Survival Strategy:
    - Use coordinated survival techniques for effective resource management
    - Practice efficient resource collection and environmental navigation
    - Focus on developing survival skills through team coordination and mutual support
    - Use safety-first approaches during challenging environmental conditions

# Limitations
max_action_steps: 36

