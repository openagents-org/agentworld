# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Gather diverse resources from different areas

task:
  name: "Environmental Protection - Multi-Resource Conservation"
  description: "Three agents gather 4x logs, 3x rawshrimp, and 4x blueberry from different areas"

# Task objectives
objectives:
  primary: "Gather diverse resources: 4x logs, 3x rawshrimp, 4x blueberry"
  secondary: # checkpoints
    - "Coordinate multi-area resource gathering"
    - "Complete conservation effort within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a multi-resource conservation scenario.

  OBJECTIVE: Gather diverse resources from different ecosystems.

  MISSION REQUIREMENTS:
  - Gather 4x logs from forest (oak trees)
  - Catch 3x rawshrimp from coastal waters
  - Gather 4x blueberry from foraging areas
  - Coordinate across different regions

  TEAM COORDINATION:
  - Lumberjack works in forest area
  - Fisher works in coastal area
  - Forager works in berry fields
  - Share progress updates

  RESOURCE GATHERING:
  🌲 Forest Resources - logs:
    - harvest_resource on Oak Tree instances
    - Target: 4x logs total

  🎣 Coastal Resources - rawshrimp:
    - harvest_resource on shrimp fishing spots
    - Target: 3x rawshrimp total

  🫐 Field Resources - blueberry:
    - harvest_resource on blueberry instances
    - Target: 4x blueberry total

  DO NOT use complete() until objectives are met!

# Limitations
max_action_steps: 25

