# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Extended 9-agent 8-phase dungeon campaign

task:
  name: "Progressive Dungeon Expedition - Grand Campaign"
  description: "Nine adventurers embark on an 8-phase dungeon campaign with multiple bosses and elite equipment crafting"

# Task objectives
objectives:
  primary: "Complete an 8-phase progressive dungeon campaign spanning 65 rounds with elite equipment and multiple bosses"
  secondary:
    - "Phase 1 (Rounds 1-10): Initial Preparation - Gather materials and craft starting equipment"
    - "Phase 2 (Rounds 11-18): Shallow Dungeon - Scout entrance and defeat low-level guardians"
    - "Phase 3 (Rounds 19-26): First Upgrade - Gather advanced materials and craft superior weapons"
    - "Phase 4 (Rounds 27-34): Mid-Level Dungeon - Explore deeper levels and defeat mid-tier bosses"
    - "Phase 5 (Rounds 35-42): Second Upgrade - Create specialized gear for harder challenges"
    - "Phase 6 (Rounds 43-50): Deep Dungeon - Explore deepest levels and defeat elite guardians"
    - "Phase 7 (Rounds 51-58): Elite Equipment - Create golden gear for final push"
    - "Phase 8 (Rounds 59-65): Boss Rush - Conquer final chambers and defeat dungeon lord"

# Relevant game context
relevant_game_context: |
  CAMPAIGN STRUCTURE (65 ROUNDS)
  - Nine adventurers must clear eight sequential phases with three boss encounters. Equipment is upgraded between phases; no phase may be skipped.

  PHASE CHEAT-SHEET
  1. R1-10 Preparation: gather 20 logs, 30 iron/coal, smelt 25 bars, craft starter weapons and amass 60+ heals.
  2. R11-18 Shallow dungeon: move to ~200,100, defeat low-level mobs, log loot/HP.
  3. R19-26 First upgrade: retreat, gather materials, craft rings/arrows, restock heals to 80+.
  4. R27-34 Mid-depth: push through chambers 3-5, fight skeletons and spectres, defeat first boss.
  5. R35-42 Second upgrade: exit, gather gold/gems, craft enhanced gear, heal pool to 100+.
  6. R43-50 Deep dungeon: explore chambers 6-8, defeat elite guardians and second boss.
  7. R51-58 Elite crafting: gather ultimate mats, craft golden gear, maximize healing to 120+.
  8. R59-65 Boss rush: re-enter with full HP, defeat dungeon lord.

  EXECUTION NOTES
  - Always verify_inventory before/after crafting, transfers, or phase transitions.
  - Keep everyone within ~10 tiles during dungeon runs for coordinated healing.
  - attack_mob handles combat; use move_character hops of <=32 tiles.
# Limitations
max_action_steps: 65

