# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Formation training, defeat 1 Wolf as final test

task:
  name: "Combat Training - Wolf Hunting Graduation"
  description: "Three agents complete combat training by defeating one Wolf"

# Task objectives
objectives:
  primary: "Complete combat training by defeating 1 Wolf (Level 55)"
  secondary: # checkpoints
    - "Establish combat formation"
    - "Complete training within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is advanced combat training with a challenging final target.

  OBJECTIVE: Graduate from combat training by defeating a Wolf.

  MISSION REQUIREMENTS:
  - Navigate to wilderness area
  - Locate and engage a Wolf (Level 55)
  - Use coordinated tactics to defeat it
  - Demonstrate combat proficiency

  TEAM COORDINATION:
  - Combat leader directs the attack
  - Mage provides magical support
  - Guardian protects the team
  - Coordinate timing for maximum damage

  COMBAT KNOWLEDGE:
  🐺 Combat - Wolf:
    - Level 55 creature
    - Requires coordinated attacks
    - Use magical and physical attacks together

  DO NOT use complete() until Wolf is defeated!

# Limitations
max_action_steps: 25

