# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - 4 agents with combat and full trading circuit

task:
  name: "Desert Caravan Trading - Full Commerce Expedition"
  description: "Four agents work together to establish complete trading circuit with combat and resource operations"

# Task objectives
objectives:
  primary: "Establish profitable trading operations, defeat desert creatures, and gather rare resources"
  secondary: # checkpoints
    - "Establish desert survival coordination"
    - "Execute trading and combat operations"
    - "Complete desert commerce within 40 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a full-scale desert expedition with trading, combat, and resource gathering.

  OBJECTIVE: Establish complete desert trading operations with expanded team.

  MISSION REQUIREMENTS:
  - Navigate to Southern Desert region (200-600, 600-768)
  - Defeat desert creatures (Vultures and predators)
  - Gather rare desert resources
  - Trade with at least 2 desert NPCs (Miner, Billey)
  - Complete profitable trading circuit

  TEAM COORDINATION:
  - Caravan leader coordinates operations
  - Combat specialist handles desert creatures
  - Trader manages NPC interactions
  - Gatherer collects resources for trading

  DESERT ACTIVITIES:
  🦅 Desert Combat:
    - Expect Vultures and desert predators
    - Coordinate ranged attacks

  💰 Desert Trading NPCs:
    - Miner: Located in mining areas
    - Billey: Desert merchant

  ⛏️ Desert Mining:
    - Unique ore deposits in desert
    - Resources for trading

  DO NOT use complete() until trading circuit is completed!

# Limitations
max_action_steps: 40

