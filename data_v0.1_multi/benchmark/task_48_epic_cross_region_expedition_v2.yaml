# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Two-region expedition (forest + mountain)

task:
  name: "Epic Cross-Region Expedition - Forest and Mountain Regions"
  description: "Three agents complete expedition across forest and mountain regions"

# Task objectives
objectives:
  primary: "Complete expedition: craft 1x magic staff (forest) and 1x axe (mountain)"
  secondary: # checkpoints
    - "Coordinate cross-region resource gathering"
    - "Complete expedition within 35 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a two-region expedition scenario.

  OBJECTIVE: Complete objectives in forest and mountain regions.

  PHASE 1 - FOREST:
  - Gather logs and craft sticks
  - Craft 1x magic staff

  PHASE 2 - MOUNTAIN:
  - Mine iron ore and coal
  - Smelt iron bars
  - Craft 1x axe

  TEAM COORDINATION:
  - Leader coordinates both phases
  - Craftsman handles all crafting
  - Gatherer focuses on resources

  STARTING RESOURCES:
  - Leader has 1x bead
  - Craftsman has smithinghammer
  - Gatherer has 2x ironore + 2x coal

  CRAFTING:
  🔮 staff: 5x stick + 1x bead
  🔨 axe: 3x ironbar + 1x logs

  DO NOT use complete() until both items are crafted!

# Limitations
max_action_steps: 35

