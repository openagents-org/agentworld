# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - 4 agents, defeat Dark Wolf and harvest special dark forest resources

task:
  name: "Dark Forest Cleansing - Complete Shadow Realm Expedition"
  description: "Four agents work together to defeat Dark Wolf and harvest rare shadow resources"

# Task objectives
objectives:
  primary: "Defeat Dark Wolf and harvest 5x shadow wood from dark forest"
  secondary: # checkpoints
    - "Establish dark forest coordination"
    - "Execute boss combat and resource gathering"
    - "Complete expedition within 40 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a full dark forest expedition with combat and resource gathering.

  OBJECTIVE: Complete forest cleansing and gather rare shadow resources.

  MISSION REQUIREMENTS:
  - Navigate to Dark Forest region (1016, 682)
  - Defeat the Dark Wolf boss
  - Harvest 5x shadow wood from corrupted trees
  - Cleanse the forest area

  TEAM COORDINATION:
  - Combat specialists handle Dark Wolf
  - Lumberjacks gather shadow wood
  - Light mages provide magical support
  - Share light sources for visibility

  COMBAT & GATHERING:
  🐺 Boss Combat - Dark Wolf:
    - Location: (1016, 682)
    - Use light-based magic for advantage

  🌲 Shadow Wood Harvesting:
    - harvest_resource on shadow trees
    - Target: 5x shadow wood total

  DO NOT use complete() until all objectives are achieved!

# Limitations
max_action_steps: 40

