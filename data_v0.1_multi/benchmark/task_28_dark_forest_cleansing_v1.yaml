  This is a simplified dark forest mission focusing on boss combat.

  OBJECTIVE: Locate and defeat the Dark Wolf boss.

  MISSION REQUIREMENTS:
  - Navigate to Dark Forest region (1016, 682)
  - Locate the Dark Wolf boss
  - Defeat Dark Wolf using coordinated attacks
  - No forest purification required

  TEAM COORDINATION:
  - Both agents focus on combat
  - Coordinate magical and physical attacks
  - Share healing resources

  COMBAT KNOWLEDGE:
  🐺 Boss Combat - Dark Wolf:
    - Location: coordinates (1016, 682)
    - May have unique shadow abilities
    - Use light-based magic for advantage

  DO NOT use complete() until Dark Wolf is defeated!

