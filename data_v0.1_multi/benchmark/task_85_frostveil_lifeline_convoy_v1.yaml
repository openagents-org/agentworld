# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Simplified 6-agent polar relief mission

task:
  name: "Frostveil Lifeline Convoy - Core Polar Relief"
  description: "Six specialists rebuild the frozen supply line between Ridge Camp and the Ice Guardian Outpost, delivering beacon staffs and medical kits within 40 rounds."

# Task objectives
objectives:
  primary: "Deliver the convoy manifest (logs, iron bars, one lightningstaff, one icestaff, medical rations) from Ridge Camp (232,148) to the Ice Guardian Outpost (260,156)."
  secondary:
    - "Phase 1 (Rounds 1-10): Stage at Ridge Camp, assign squads."
    - "Phase 2 (Rounds 11-22): Resource squad harvests 12 icelogs, mines 8 ironore + 8 coal."
    - "Phase 3 (Rounds 23-32): Beacon squad smelts 6 ironbar, crafts staffs."
    - "Phase 4 (Rounds 33-40): Escort squad guides convoy to outpost."

# Relevant game context
relevant_game_context: |
  RIDGE CAMP PROTOCOL
  - Keep everyone within 6 tiles when staging; confirm roles in chat.
  - Use harvest_resource target=iceoak for icelogs.
  - Mine iron/coal veins along the ridge.

  BEACON FABRICATION
  - Craft chain: craft_item skill=Crafting itemKey=staff → upgrade to lightningstaff/icestaff.
  - Use transfer_items with witnesses.

  CONVOY & ESCORTS
  - Designate Quartermaster as sole holder of convoy items.
  - Escort moves in formation around Quartermaster.

  CHECKPOINT CALLS
  - At each waypoint, recite location, HP status, and item counts.
  - Install beacons at (250,152) and the outpost gate (260,156).

# Limitations
max_action_steps: 40

