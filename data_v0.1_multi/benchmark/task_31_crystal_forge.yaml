# AgentWorld Multi-Agent Task Configuration

task:
  name: "Crystal Forge Operations - Advanced Magical Equipment Creation"
  description: "Three agents work together to establish a crystal forge operation, mine rare gems, and create enchanted magical equipment"

# Task objectives
objectives:
  primary: "Establish crystal forge operations and create enchanted magical equipment through coordinated gem mining and advanced crafting"
  secondary: # checkpoints
    - "Execute coordinated gem mining operations in dangerous underground regions"
    - "Establish advanced magical crafting coordination and enchantment procedures"
    - "Complete crystal forge operations within 30 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent advanced crafting scenario requiring gem mining and magical enhancement.
  
  OBJECTIVE: Create enchanted magical equipment through coordinated gem mining and advanced magical crafting.
  
  MISSION REQUIREMENTS:
  - Mine rare gems from dangerous underground regions
  - Craft advanced magical components and enchantment materials
  - Create multiple pieces of enchanted equipment for the team
  - Coordinate between mining, crafting, and magical enhancement
  
  TEAM COORDINATION:
  - Use global chat to share gem vein locations and mining progress
  - Coordinate between dangerous mining operations and magical crafting
  - Share rare materials and provide magical support for enchantment
  - Work together to handle underground hazards and resource scarcity
  
  GENERAL STRATEGY:
  - The team needs to locate and mine rare gem deposits safely
  - Advanced magical crafting requires specific rare materials and high skill levels
  - Enchantment processes require magical expertise and rare components
  - Balance mining efficiency with safety in dangerous underground areas
  - Coordinate magical enhancement with equipment distribution
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  CRYSTAL FORGE CRAFTING (CRITICAL KNOWLEDGE):
  💎 Mining - gems:
    - harvest_resource on gem deposit instances to get various gems
    - Level required: 15+ (Mining skill)
    - Tool required: Pickaxe (preferably enchanted for efficiency)
    - Look for "Ruby", "Sapphire", "Emerald", or "Diamond" deposits
  
  🔮 Crafting Recipe - crystal:
    - craft_item skill=Crafting itemKey=crystal
    - Materials: 2x gems → 1x crystal
    - Level required: 20 (Crafting skill)
    - IMPORTANT: Crystals are base components for enchantment
  
  ⚡ Enchanting - weapon enhancement:
    - enchant_item on weapons using crystals and magical energy
    - Level required: 25+ (Magic skill)
    - Materials: weapon + crystal + magical energy
    - CRITICAL: Enchanted weapons have significantly improved combat effectiveness
  
  🛡️ Advanced Equipment Creation:
    - Create multiple enchanted items for team equipment upgrade
    - Coordinate enchantment types based on team combat roles
    - Balance resource investment with strategic equipment needs

# Limitations
max_action_steps: 30

