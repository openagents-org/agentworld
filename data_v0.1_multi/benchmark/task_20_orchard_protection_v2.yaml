# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Added 4th agent, dual guardians for enhanced protection

task:
  name: "Orchard Protection Mission - Dual Guardian Elite Defense"
  description: "Four agents work together with two guardians providing enhanced protection for two collectors"

# Task objectives
objectives:
  primary: "Successfully protect collectors while they gather 8x blueberry and 5x rawtuna with dual guardian protection"
  secondary: # checkpoints
    - "Establish effective team communication for threat alerts"
    - "Guardians successfully defend team from hostile wildlife and pests"
    - "Complete orchard resource gathering without casualties within 35 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent orchard protection scenario with enhanced dual guardian protection.

  OBJECTIVE: Successfully gather larger quantities of orchard resources with superior protection.

  MISSION REQUIREMENTS:
  - Collect 8x blueberry and 5x rawtuna with enhanced protection
  - Keep all team members alive throughout the mission
  - Two guardians provide overlapping defensive coverage

  TEAM COORDINATION:
  - Dual guardians coordinate threat response
  - Lead guardian handles primary threats
  - Support guardian provides backup and flanking protection
  - Collectors focus on efficient gathering
  - Share information about resource locations and environmental dangers

  GENERAL STRATEGY:
  - The team has TWO guardians for superior protection
  - Wildlife and pest threats may appear and must be dealt with
  - Increased targets require efficient gathering
  - Balance efficiency with safety - casualties will cause mission failure
  - Use global chat for real-time coordination and threat alerts

  DO NOT use complete() until ALL objectives are achieved safely!

  COMBAT MECHANICS (CRITICAL KNOWLEDGE):
  🏹 Combat - Attack threats:
    - Use observe_environment to detect hostile wildlife and pests
    - Use attack command on hostile targets
    - Use bow for ranged combat advantage

  🫐 Foraging - blueberry:
    - harvest_resource on blueberry instances to get blueberry
    - Level required: 1+ (Foraging skill)
    - Target: 8x blueberry total

  🐟 Fishing - rawtuna:
    - harvest_resource on tuna fishing spots to get rawtuna
    - Level required: 1+ (Fishing skill)
    - Target: 5x rawtuna total

# Limitations
max_action_steps: 35

