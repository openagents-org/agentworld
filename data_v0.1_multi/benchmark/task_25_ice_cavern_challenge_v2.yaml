# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Defeat only one Ice Guardian, harvest more logs

task:
  name: "Ice Cavern Challenge - Single Guardian & Resource Expedition"
  description: "Three agents work together to defeat one Ice Guardian and harvest 6x Ice Oak logs"

# Task objectives
objectives:
  primary: "Defeat one Ice Guardian and harvest 6x Ice Oak logs from frozen region"
  secondary: # checkpoints
    - "Establish cold-weather survival coordination"
    - "Execute guardian combat and frozen resource harvesting"
    - "Complete expedition within 30 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a balanced ice region expedition with one boss fight and resource gathering.

  OBJECTIVE: Defeat one Ice Guardian and harvest frozen lumber efficiently.

  MISSION REQUIREMENTS:
  - Navigate to Frozen/Ice region (228-260, 151-156)
  - Defeat one Ice Guardian (Level 35) at (259, 151)
  - Harvest 6x Ice Oak logs from frozen trees
  - Survive freezing environmental damage

  TEAM COORDINATION:
  - Combat specialist handles Ice Guardian
  - Lumberjacks focus on Ice Oak harvesting
  - Share healing supplies for environmental damage

  COMBAT KNOWLEDGE:
  ❄️ Combat - Ice Guardian:
    - Location: (259, 151)
    - Level 35 with ice-based attacks
    - Use fire-based weapons for advantage

  RESOURCE GATHERING:
  🌲 Lumberjacking - Ice Oak:
    - harvest_resource on Ice Oak Tree instances
    - Level required: 20+ (Lumberjacking skill)
    - Target: 6x iceoaklogs total

  DO NOT use complete() until objectives are achieved!

# Limitations
max_action_steps: 30

