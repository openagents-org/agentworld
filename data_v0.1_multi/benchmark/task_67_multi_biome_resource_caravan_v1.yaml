# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Simplified 5-agent 4-biome caravan

task:
  name: "Multi-Biome Resource Caravan - Focused Trading Route"
  description: "Five traders establish trading routes across 4 biomes, gathering unique resources from each region"

# Task objectives
objectives:
  primary: "Establish trading route visiting 4 biomes, gather 50+ resources, craft 8+ regional specialty items"
  secondary:
    - "Route 1 (Rounds 1-12): Forest & Plains - Lumber and herbs"
    - "Route 2 (Rounds 13-25): Mountains & Coast - Ores and seafood"
    - "Route 3 (Rounds 26-38): Return & Processing - Craft regional items"

# Context and guidance for agents
relevant_game_context: |
  CARAVAN OVERVIEW
  - Five traders must visit four biomes (forest, plains, mountains, coast), collect ≥50 total resources, then craft ≥8 regional goods back at the hub by Round 38.

  ROUTE PLAN
  1. R1-12 Forest + Plains: start at (350,250), swing west to (250,350) for logs/herbs, then through the plains for animal/plant goods.
  2. R13-25 Mountains + Coast: push to (230,38) for ores/coal, then march to (900,400) for seafood.
  3. R26-38 Return & Craft: converge on the central hub (528,384), hand off materials to the crafter, and produce the regional specialties.

  EXECUTION NOTES
  - Use chat threads to record travel checkpoints and resource totals.
  - Transfers only work within ~10 tiles.
# Limitations
max_action_steps: 38

