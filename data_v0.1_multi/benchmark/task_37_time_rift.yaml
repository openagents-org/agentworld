# AgentWorld Multi-Agent Task Configuration

task:
  name: "Time Rift Stabilization - Temporal Anomaly Management and Chrono-Magic"
  description: "Three agents work together to investigate temporal rifts, defeat Time Wraiths, and stabilize dangerous chronological anomalies"

# Task objectives
objectives:
  primary: "Successfully investigate temporal rifts, defeat Time Wraiths, and stabilize chronological anomalies using chrono-magic"
  secondary: # checkpoints
    - "Establish temporal anomaly investigation coordination and rift location mapping"
    - "Execute coordinated Time Wraith combat and temporal stabilization procedures"
    - "Complete time rift stabilization within 36 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent temporal magic scenario requiring advanced magical coordination and anomaly management.
  
  OBJECTIVE: Investigate dangerous temporal rifts, defeat Time Wraiths, and stabilize chronological anomalies.
  
  MISSION REQUIREMENTS:
  - Navigate to Temporal Rift region (Region 6-5: coordinates 900-950, 500-550)
  - Investigate multiple temporal anomalies and map rift locations
  - Defeat Time Wraiths (Level 45) that emerge from temporal distortions
  - Stabilize temporal rifts using advanced chrono-magic techniques
  
  TEAM COORDINATION:
  - Use global chat for complex temporal coordination and rift status updates
  - Coordinate between anomaly investigation, temporal combat, and rift stabilization
  - Share temporal protection and provide magical support during rift manipulation
  - Work together to handle reality-warping effects and temporal paradoxes
  
  GENERAL STRATEGY:
  - This requires advanced magical skills and temporal anomaly understanding
  - Time Wraiths (Level 45) have temporal abilities and phase-shifting attacks
  - Temporal rifts cause reality distortions and unpredictable magical effects
  - Chrono-magic requires precise timing and coordinated magical energy
  - Balance investigation speed with temporal safety and stabilization accuracy
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  TEMPORAL RIFT MANAGEMENT (CRITICAL KNOWLEDGE):
  ⏰ Environmental Hazards:
    - Temporal overlay type causes time distortion and reality fluctuations
    - Time loops, acceleration zones, and temporal displacement effects
    - Chrono-damage affects aging and temporal stability of agents
    - Coordinate movement carefully to avoid temporal paradoxes
  
  👻 Combat - Time Wraiths:
    - Use observe_environment to locate Time Wraiths at rift points (925,515) and (935,530)
    - Level 45 creatures with temporal phase abilities and chrono-attacks
    - Expect time-stop attacks, temporal displacement, and reality-warping abilities
    - Use stability magic and temporal anchoring to counter phase abilities
    - Coordinate synchronized attacks during wraith materialization phases
  
  🔮 Chrono-Magic Techniques:
    - Use temporal_stabilize action on rift coordinates to close anomalies
    - Requires high magic skill (35+) and temporal understanding
    - Coordinate magical energy channeling for rift stabilization
    - Balance temporal energy to avoid creating new paradoxes
  
  ⚡ Temporal Investigation:
    - Map rift locations and anomaly strength before stabilization attempts
    - Use temporal_scan to detect hidden rifts and anomaly patterns
    - Coordinate investigation sequence to avoid temporal interference
    - Document temporal patterns for efficient stabilization procedures
  
  🛡️ Temporal Combat Strategy:
    - Use temporal anchoring magic to prevent wraith phase abilities
    - Coordinate attacks during wraith materialization windows
    - Focus on disrupting temporal energy that sustains wraith existence
    - Use protective barriers against chrono-damage and reality distortion

# Limitations
max_action_steps: 36

