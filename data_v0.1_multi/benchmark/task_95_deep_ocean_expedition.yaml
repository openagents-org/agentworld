# AgentWorld Multi-Agent Task Configuration

task:
  name: "Deep Ocean Expedition - Underwater Resource Discovery"
  description: "Eleven agents embark on a comprehensive ocean exploration mission, fishing, hunting sea creatures, and establishing coastal supply chains"

# Task objectives
objectives:
  primary: "Complete deep ocean expedition gathering 150+ seafood items, defeating 3+ sea bosses, and establishing coastal fishing station within 50 rounds"
  secondary: # checkpoints
    - "Phase 1 (Rounds 1-12): Coastal Setup - Establish base camp and gather initial supplies"
    - "Phase 2 (Rounds 13-25): Deep Sea Fishing - Catch 100+ rawshrimp, jellyfish, and other seafood"
    - "Phase 3 (Rounds 26-38): Ocean Combat - Hunt sea creatures and defeat marine bosses"
    - "Phase 4 (Rounds 39-50): Culinary Processing - Cook massive feast with 80+ prepared meals"

# Relevant game context (Hint)
relevant_game_context: |
  DEEP OCEAN EXPEDITION OVERVIEW:
  
  Eleven brave adventurers must explore the dangerous coastal waters, harvest marine resources,
  battle sea monsters, and establish a permanent fishing industry.
  
  🌊 EXPEDITION TEAMS:
  
  ═══════════════════════════════════════════════════════════
  🎣 MASTER FISHING FLEET (Agents 1-5) - Marine Harvesting
  ═══════════════════════════════════════════════════════════
  
  **Location**: Coastal Region (580, 750)
  **Mission**: Harvest 100+ seafood from fishing spots
  
  **Team**:
  - Agent 1 (Fleet Admiral): Coordinate all fishing operations
  - Agent 2 (Master Fisher Alpha): Catch shrimp and fish
  - Agent 3 (Master Fisher Beta): Catch jellyfish
  - Agent 4 (Fisher Gamma): Support fishing
  - Agent 5 (Resource Collector): Gather coastal resources
  
  **Fishing Goals**:
  - 60x rawshrimp (primary catch)
  - 30x jellyfish (secondary catch)
  - 10x other fish (clams, crabs)
  - Use harvest_resource on fishing spots
  - All agents need fishing rods equipped
  
  ═══════════════════════════════════════════════════════════
  ⚔️ MARINE COMBAT SQUAD (Agents 6-8) - Sea Monster Hunters
  ═══════════════════════════════════════════════════════════
  
  **Location**: Deep Waters (580, 755)
  **Mission**: Defeat 3+ sea bosses and protect fishing fleet
  
  **Team**:
  - Agent 6 (Sea Captain): Lead combat operations
  - Agent 7 (Harpooner): Primary damage dealer
  - Agent 8 (Naval Guardian): Tank and defender
  
  **Combat Targets**:
  - Mermaid (Level 55) at (580, 755) - Primary boss
  - Hermit Crab Warrior (Level 30) at (224, 359)
  - Water Guardian (Level 36) at (197, 633)
  - Coastal crabs and sea creatures
  
  **Combat Strategy**:
  - Travel to boss locations
  - Coordinate synchronized attacks
  - Maintain HP above 70%
  - Use healing items liberally
  
  ═══════════════════════════════════════════════════════════
  👨‍🍳 CULINARY MASTERS (Agents 9-11) - Food Processing
  ═══════════════════════════════════════════════════════════
  
  **Location**: Coastal Kitchen (585, 752)
  **Mission**: Cook 80+ seafood meals for expedition
  
  **Team**:
  - Agent 9 (Head Chef): Cook premium dishes
  - Agent 10 (Sous Chef): Cook standard meals
  - Agent 11 (Kitchen Assistant): Prepare ingredients
  
  **Cooking Goals**:
  - 40x cookedshrimp (rawshrimp → cookedshrimp)
  - 25x jellyfishsmoothie (jellyfish → smoothie)
  - 15x other cooked seafood
  - Minimum 80 total prepared meals
  
  **Recipes**:
  - craft_item skill=Cooking itemKey=cookedshrimp
  - craft_item skill=Cooking itemKey=jellyfishsmoothie
  
  ═══════════════════════════════════════════════════════════
  📋 EXPEDITION PROTOCOL
  ═══════════════════════════════════════════════════════════
  
  **Phase 1: Coastal Setup (Rounds 1-12)**
  - All teams gather at coastal region
  - Fishing Fleet scouts fishing spots
  - Combat Squad prepares for battles
  - Culinary team sets up kitchen
  - Announce: "Base camp established at (580, 750)"
  
  **Phase 2: Deep Sea Fishing (Rounds 13-25)**
  - Fishing Fleet harvests continuously
  - Report every 10 catches: "Caught 20/100 seafood"
  - Combat Squad patrols for threats
  - Begin transferring catches to Culinary team
  
  **Phase 3: Ocean Combat (Rounds 26-38)**
  - Combat Squad hunts sea bosses
  - Coordinate attacks: "Engaging Mermaid at (580, 755)"
  - Fishing Fleet continues operations
  - Share boss drops with team
  
  **Phase 4: Culinary Processing (Rounds 39-50)**
  - Culinary team cooks all seafood
  - Produce 80+ prepared meals
  - Distribute food to all teams
  - Final expedition feast
  
  **Communication**:
  - "[Fishing Fleet]: Caught 30/100 items, location (580, 750)"
  - "[Combat Squad]: Engaging boss, HP 85%, need healing"
  - "[Culinary]: Cooked 20/80 meals, need more rawshrimp"
  
  ═══════════════════════════════════════════════════════════
  🎯 SUCCESS CRITERIA
  ═══════════════════════════════════════════════════════════
  
  1. Catch 100+ seafood items (60 shrimp, 30 jellyfish, 10 other)
  2. Defeat 3+ marine bosses
  3. Cook 80+ prepared meals
  4. All teams coordinate effectively
  5. Complete within 50 rounds

# Limitations
max_action_steps: 50

