# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, adjusted resource targets

task:
  name: "Stormfront War Council - Multi-Front Offensive"
  description: "Ten commanders orchestrate two synchronized assaults (Water Guardian and Ogre Guardian) while maintaining a roving logistics line within 60 rounds."

# Task objectives
objectives:
  primary: "Hold a war council at (350,300), forge the war stockpile, and defeat the Water Guardian (197,633) and Ogre Guardian (291,644) in a coordinated campaign."
  secondary:
    - "Phase 1: Council & intel — assemble all ten agents at (350,300), assign Vanguard, Skirmish, Logistics squads, and log enemy intel."
    - "Phase 2: Logistics gather 16 ironore, 10 coal, 8 logs, 5 string, and at least 3 lightningbeads, sharing counts after verify_inventory."
    - "Phase 3: Forge 3 heavy swords, 2 axes, 1 pickaxe, 2 lightningstaff, plus 25 healing food items; designate carriers for each front."
    - "Phase 4: Execute two offensives ensuring every front has at least three agents present and HP >80% before attack_mob calls."
    - "Phase 5: After each victory, capture loot, restock from Logistics, and regroup; complete() only after both bosses fall and everyone debriefs at (350,300)."

# Relevant game context (Hint)
relevant_game_context: |
  COMMAND STRUCTURE
  - Vanguard (2-3 tanks), Skirmish (3 damage dealers), Logistics (4 support) — swap members as needed but keep rosters posted in chat. CouncilScribe records every decision.
  - Use call signs (e.g., [VAN-Lead]) in chat so squads can parse updates quickly.

  RESOURCE & FORGE DETAILS
  - Mine iron/coal near (230,40) or along cavern veins; fell logs near (320,320); gather string from coastal plants (197,633). Lightningbeads drop from Water Guardian adds or coastal mimics.
  - Crafting order: smelt ironbar → craft_item Smithing sword2 and axe; keep spare ironbar for pickaxe repairs. For staffs, craft_item Crafting staff → lightningstaff.

  OFFENSIVE PLAYBOOK
  - Before engaging any boss, run a readiness checklist: positions, HP >80, weapon/staff counts, bead reserves, escape route.
  - Attack order: Water Guardian (south) → Ogre Guardian (north) to minimize travel, but adapt if needed.
  - During combat, only one agent issues attack_mob per target to avoid double pulls.

  POST-FIGHT & DEADLOCK SAFETY
  - After each victory, gather around the dropped beacon/loot pile, verify_inventory totals, then redistribute.
  - complete() only when all agents reunite at the original council site and confirm no crafted gear is missing.

# Limitations
max_action_steps: 60

