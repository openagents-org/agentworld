# Success criteria for multi-agent task
success_criteria:
  - "All ten agents attend the initial council, publish squad assignments, and record gathered intel."
  - "Logistics team documents the required raw materials (16 ironore, 10 coal, 8 logs, 5 string, 3 lightningbeads) with verify_inventory before crafting."
  - "Forged items (3 heavy swords, 2 axes, 1 pickaxe, 2 lightningstaff, 25 food items) are produced and assigned to carriers."
  - "Each boss (Water Guardian, Ogre Guardian) is defeated with HP >80% threshold respected before engagement and post-battle regroup logged."
  - "Campaign concludes at (350,300) with loot summary and confirmation that no crafted weapon/staff is missing before complete()."
