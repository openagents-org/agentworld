# AgentWorld Multi-Agent Task Configuration

task:
  name: "Castle Siege Warfare - Fortress Assault & Defense"
  description: "Three agents work together to conduct a strategic siege of an ice fortress, defeat the Ice Knight commander, and secure the castle stronghold"

# Task objectives
objectives:
  primary: "Successfully conduct castle siege operations, defeat the Ice Knight fortress commander, and secure strategic control of the castle"
  secondary: # checkpoints
    - "Establish siege warfare coordination and fortress reconnaissance"
    - "Execute tactical assault and fortress combat operations"
    - "Complete castle conquest within 36 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent siege warfare mission requiring advanced tactical coordination and fortress combat.
  
  OBJECTIVE: Conduct strategic siege operations against a fortified castle and defeat the commanding Ice Knight.
  
  MISSION REQUIREMENTS:
  - Navigate to Castle/Fortress region (coordinates around 712, 717)
  - Approach from nearby safe locations to ensure viable combat path
  - Conduct reconnaissance of fortress defenses and strategic positions
  - Defeat the Ice Knight commander (Level 62) in fortress combat
  - Secure strategic control of castle stronghold and surrounding areas
  
  TEAM COORDINATION:
  - Use global chat to share fortress layout intelligence and enemy positions
  - Coordinate between siege tactics, assault operations, and fortress control
  - Share siege equipment and provide mutual combat support during assault
  - Work together to breach fortress defenses and handle elite defenders
  
  GENERAL STRATEGY:
  - The team needs to approach the castle with tactical awareness
  - Ice Knight commander (Level 62) is a high-level fortress defender
  - Castle/Fortress areas may have defensive advantages and chokepoints
  - Siege warfare requires coordinated assault from multiple angles
  - Balance aggressive assault with tactical positioning and retreat options
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  SIEGE WARFARE & FORTRESS COMBAT (CRITICAL KNOWLEDGE):
  🏰 Fortress Reconnaissance:
    - Assess castle layout and defensive positions through careful exploration
    - Identify fortress entrances, defensive chokepoints, and strategic positions
    - Look for siege equipment opportunities or environmental advantages
    - Plan assault routes and coordinate team positioning
  
  ⚔️ Boss Combat - Ice Knight:
    - Locate Ice Knight at coordinates (712, 717) in the castle region
    - Level 62 elite commander with advanced combat abilities
    - Expect heavy armor, ice-based attacks, and tactical combat skills
    - Ice Knight may have fortress defender bonuses and terrain advantages
    - Coordinate flanking attacks and magical support for effectiveness
  
  🛡️ Fortress Defense Handling:
    - Expect fortress defenders and castle guard creatures
    - Castle areas may have defensive traps or environmental hazards
    - Use siege tactics to overcome defensive advantages
    - Coordinate simultaneous attacks to prevent fortress regrouping
  
  ⚡ Siege Combat Strategy:
    - Use ranged attacks to engage from defensive positions
    - Coordinate magical and physical assaults for maximum effectiveness
    - Focus fire on Ice Knight while handling additional defenders
    - Utilize fortress architecture for tactical positioning
  
  🏆 Castle Conquest:
    - Secure key strategic positions within the fortress
    - Eliminate all major threats and establish control
    - Fortress conquest may require holding position after Ice Knight defeat

# Limitations
max_action_steps: 36

