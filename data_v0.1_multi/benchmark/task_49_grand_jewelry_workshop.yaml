# AgentWorld Multi-Agent Task Configuration

task:
  name: "Grand Jewelry Workshop - Multi-Stage Gem Processing and Ring Crafting"
  description: "Three agents establish a complete jewelry production pipeline using admin tools to obtain materials, then coordinate smelting and crafting to create multiple enchanted rings"

# Task objectives
objectives:
  primary: "Establish a complete jewelry workshop producing multiple types of rings through coordinated material acquisition, smelting, gem processing, and crafting"
  secondary: # checkpoints
    - "Use admin tools to acquire raw materials (ironore, goldnugget, coal, gems)"
    - "Execute multi-stage metal production (ore → bars → base rings)"
    - "Coordinate gem-enchanted ring crafting"
    - "Complete entire jewelry production pipeline within 50 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  WORKSHOP OVERVIEW
  - Three artisans use admin set_inventory to spawn materials, then run a ring pipeline: iron → silverring, gold → goldring, and gem infusions for emerald/topaz rings.
  - Final deliverables: ≥1 silverring, ≥1 goldring, 1 emerald ring (ring1), 1 topazring.

  QUICK RESOURCE PLAN
  - MasterMiner: set_inventory([{ironore:6},{coal:7}]), then move to (250,180) and hand everything to SmeltingSpecialist.
  - SmeltingSpecialist: set_inventory([{goldnugget:8},{coal:7}]); smelt 6 ironbars + 8 goldbars, craft 3 silverrings + 4 goldrings, pass one of each to JewelryArtisan.
  - JewelryArtisan: set_inventory([{emerald:1},{topaz:1}]); receive base rings, craft ring1 and topazring.

  TOOL REMINDERS
  - set_inventory items=[{"key":"item", "count":N}], clearFirst=False keeps starting food. Verify with check_inventory_status and announce results.
  - craft_item has no count parameter. Run it once per bar/ring: craft_item(skill="Smelting", itemKey="ironbar") etc.
  - transfer_items handles all handoffs; both sender and receiver must confirm via chat + verify_inventory.

  STAGE CHECKLIST
  1. Acquisition (R1-5): everyone spawns materials, meets at (250,180), shares inventories.
  2. Iron line (R6-20): MasterMiner transfers ore/coal → SmeltingSpecialist smelts 6 bars, crafts 3 silverrings, sends one to JewelryArtisan.
  3. Gold line (R21-35): SmeltingSpecialist smelts 8 goldbars, crafts 4 goldrings, sends one to JewelryArtisan.
  4. Gem infusion (R36-50): JewelryArtisan crafts ring1 (emerald+silverring) and topazring (topaz+goldring); team verifies extras remain.

  COMPLETION RULES
  - Chat log must show every set_inventory call, each smelt/craft, and every transfer confirmation.
  - Before complete(), list final holdings (who carries silverring, goldring, ring1, topazring) and ensure all three agents acknowledge success.
# Limitations
max_action_steps: 50

