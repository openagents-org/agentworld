# AgentWorld Multi-Agent Task Configuration

task:
  name: "Grand Jewelry Workshop - Multi-Stage Gem Processing and Ring Crafting"
  description: "Three agents establish a complete jewelry production pipeline using admin tools to obtain materials, then coordinate smelting and crafting to create multiple enchanted rings"

# Task objectives
objectives:
  primary: "Establish a complete jewelry workshop producing multiple types of rings through coordinated material acquisition, smelting, gem processing, and crafting"
  secondary: # checkpoints
    - "Use admin tools to acquire raw materials (ironore, goldnugget, coal, gems)"
    - "Execute multi-stage metal production (ore → bars → base rings)"
    - "Coordinate gem-enchanted ring crafting"
    - "Complete entire jewelry production pipeline within 50 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  Team objective: Establish a complete jewelry workshop to produce enchanted rings.
  
  🚨 CRITICAL AWARENESS: Check your actual inventory state before making claims!
  - Use check_inventory_status to see what you really have
  - Do NOT assume you have materials that aren't verified
  - Do NOT claim transfers happened without actually using transfer_items tool
  - Do NOT say you will do something - ACTUALLY DO IT by calling the tool
  
  📋 GRAND WORKSHOP PRODUCTION GOALS:
  - Final objective: Produce at least 1x Silver Ring, 1x Gold Ring, 1x Emerald Ring, 1x Topaz Ring
  - This requires: iron bars → silver ring, gold bars → gold ring, then gem enchantments
  - All production must be coordinated through actual tool usage (set_inventory, craft_item, transfer_items)
  
  🧮 COMPLETE RESOURCE REQUIREMENTS:
  RAW MATERIALS NEEDED:
  - 6x ironore (to make 6x ironbar, then 3x silverring)
  - 8x goldnugget (to make 8x goldbar, then 4x goldring) - NOTE: goldnugget NOT goldore!
  - 14x coal (6 for iron smelting + 8 for gold smelting)
  - 1x emerald (for emerald ring)
  - 1x topaz (for topaz ring)
  
  🎁 ADMIN CHEAT COMMANDS - USE THESE TO GET MATERIALS:
  All agents have access to set_inventory admin command to directly add items!
  
  Example usage:
  set_inventory(items=[{"key": "ironore", "count": 6}, {"key": "coal", "count": 7}], clearFirst=False)
  
  Agent should use set_inventory at START to get their initial materials:
  - MasterMiner: set_inventory to get 6x ironore + 7x coal
  - SmeltingSpecialist: set_inventory to get 8x goldnugget + 7x coal  
  - JewelryArtisan: set_inventory to get 1x emerald + 1x topaz
  
  METAL PRODUCTION MATH:
  - 6x ironore + 6x coal → 6x ironbar (via Smelting)
  - 6x ironbar → 3x silverring (2 ironbar per ring)
  - 8x goldnugget + 8x coal → 8x goldbar (via Smelting)
  - 8x goldbar → 4x goldring (2 goldbar per ring)
  
  FINAL RING PRODUCTION MATH:
  - 1x emerald + 1x silverring → 1x emerald ring (basic, itemKey=ring1)
  - 1x topaz + 1x goldring → 1x topaz ring
  - Extra rings can be distributed to team members as rewards
  
  ═══════════════════════════════════════════════════════════════
  STAGE 1 - MATERIAL ACQUISITION (Rounds 1-5)
  ═══════════════════════════════════════════════════════════════
  🎯 Objectives:
    - Use set_inventory admin tool to get all needed materials
    - Verify inventory after acquisition
    - Coordinate team locations for later transfers
  
  🎁 Admin Tool - set_inventory:
    - set_inventory(items=[{"key": "ironore", "count": 6}], clearFirst=False)
    - clearFirst=False: Keeps existing items (flask, apple)
    - clearFirst=True: Removes all items first, then adds new ones
    - Can add multiple items at once: items=[{"key": "ironore", "count": 6}, {"key": "coal", "count": 7}]
    - Syntax: set_inventory(items=[{"key": "item_key", "count": number}], clearFirst=False)
  
  📦 MasterMiner Initial Acquisition:
    - Call: set_inventory(items=[{"key": "ironore", "count": 6}, {"key": "coal", "count": 7}], clearFirst=False)
    - Verify with check_inventory_status()
    - Announce in chat: "Acquired materials! I have: 6x ironore, 7x coal"
  
  📦 SmeltingSpecialist Initial Acquisition:
    - Call: set_inventory(items=[{"key": "goldnugget", "count": 8}, {"key": "coal", "count": 7}], clearFirst=False)
    - NOTE: goldnugget NOT goldore! This is critical!
    - Verify with check_inventory_status()
    - Announce in chat: "Acquired materials! I have: 8x goldnugget, 7x coal"
  
  📦 JewelryArtisan Initial Acquisition:
    - Call: set_inventory(items=[{"key": "emerald", "count": 1}, {"key": "topaz", "count": 1}], clearFirst=False)
    - Verify with check_inventory_status()
    - Announce in chat: "Acquired gems! I have: 1x emerald, 1x topaz"
  
  🚨 CRITICAL INITIAL SETUP RULES:
  - EVERY agent MUST use set_inventory at the start to get materials
  - Use check_inventory_status() to verify what you actually have
  - Announce inventory in chat after acquisition
  - Move to central location (250, 180) for team coordination
  
  ═══════════════════════════════════════════════════════════════
  STAGE 2 - IRON SMELTING & SILVER RING CRAFTING (Rounds 6-20)
  ═══════════════════════════════════════════════════════════════
  🎯 Objectives:
    - MasterMiner transfers ironore + coal to SmeltingSpecialist
    - SmeltingSpecialist smelts 6x ironbar from 6x ironore + 6x coal
    - SmeltingSpecialist crafts 3x silverring from 6x ironbar
    - SmeltingSpecialist transfers 1x silverring to JewelryArtisan
  
  🔥 Iron Smelting Process (SmeltingSpecialist):
    - Receive: 6x ironore + 6x coal (from MasterMiner via transfer_items)
    - Craft: craft_item(skill="Smelting", itemKey="ironbar") - repeat 6 times
    - Materials: 1x ironore + 1x coal → 1x ironbar (automatically consumed)
    - Level required: 20 (uses Smithing skill level) - SmeltingSpecialist has 40 ✓
    - Result: 6x ironbar
    - Announce after each smelt: "Smelted! Now have: X ironbar, Y coal left"
  
  🔨 Silver Ring Crafting (SmeltingSpecialist):
    - Use: 6x ironbar (from previous smelting)
    - Craft: craft_item(skill="Smithing", itemKey="silverring") - repeat 3 times
    - Materials: 2x ironbar → 1x silverring (automatically consumed)
    - Level required: 1 (Smithing skill) - SmeltingSpecialist has 40 ✓
    - Result: 3x silverring
    - Announce: "Crafted 3x silverring! Transferring 1 to JewelryArtisan"
  
  📦 Transfer to JewelryArtisan:
    - transfer_items(targetPlayer="JewelryArtisan", itemKey="silverring", count=1)
    - transfer_items automatically: checks inventory, removes from sender, adds to receiver, sends chat
    - JewelryArtisan verifies: check_inventory_status()
    - JewelryArtisan confirms: "Received 1x silverring - inventory verified"
  
  🚨 CRITICAL SMELTING RULES:
  - DO NOT use count parameter in craft_item! Craft one at a time
  - Smelting uses "Smelting" skill parameter but checks your Smithing level
  - Each smelt consumes 1x ore + 1x coal automatically
  - Verify inventory frequently to track remaining materials
  - If craft fails, read error message - it tells you what's missing
  
  ═══════════════════════════════════════════════════════════════
  STAGE 3 - GOLD SMELTING & GOLD RING CRAFTING (Rounds 21-35)
  ═══════════════════════════════════════════════════════════════
  🎯 Objectives:
    - SmeltingSpecialist smelts 8x goldbar from 8x goldnugget + 8x coal
    - SmeltingSpecialist crafts 4x goldring from 8x goldbar
    - SmeltingSpecialist transfers 1x goldring to JewelryArtisan
  
  🔥 Gold Smelting Process (SmeltingSpecialist):
    - Use: 8x goldnugget + 8x coal (from own initial inventory)
    - Craft: craft_item(skill="Smelting", itemKey="goldbar") - repeat 8 times
    - Materials: 1x goldnugget + 1x coal → 1x goldbar (automatically consumed)
    - Level required: 20 (uses Smithing skill level) - SmeltingSpecialist has 40 ✓
    - Result: 8x goldbar
    - NOTE: Recipe uses goldnugget as input, not goldore!
    - Announce after each smelt: "Smelted! Now have: X goldbar, Y coal left"
  
  🔨 Gold Ring Crafting (SmeltingSpecialist):
    - Use: 8x goldbar (from previous smelting)
    - Craft: craft_item(skill="Smithing", itemKey="goldring") - repeat 4 times
    - Materials: 2x goldbar → 1x goldring (automatically consumed)
    - Level required: 1 (Smithing skill) - SmeltingSpecialist has 40 ✓
    - Result: 4x goldring
    - Announce: "Crafted 4x goldring! Transferring 1 to JewelryArtisan"
  
  📦 Transfer to JewelryArtisan:
    - transfer_items(targetPlayer="JewelryArtisan", itemKey="goldring", count=1)
    - JewelryArtisan verifies: check_inventory_status()
    - JewelryArtisan confirms: "Received 1x goldring - inventory verified"
  
  🚨 CRITICAL GOLD SMELTING AWARENESS:
  - goldnugget is the input, NOT goldore! (Gold Rock drops goldnugget)
  - Track coal carefully: you need 6 for iron + 8 for gold = 14 total
  - If you run out of coal, coordinate with team to get more
  - SmeltingSpecialist should have 14 coal total (7 from each source)
  
  ═══════════════════════════════════════════════════════════════
  STAGE 4 - ENCHANTED RING CRAFTING (Rounds 36-50)
  ═══════════════════════════════════════════════════════════════
  🎯 Objectives:
    - JewelryArtisan verifies has: 1x emerald, 1x topaz, 1x silverring, 1x goldring
    - JewelryArtisan crafts 1x Emerald Ring (ring1)
    - JewelryArtisan crafts 1x Topaz Ring
    - Team verifies all ring types produced
    - Team calls complete()
  
  💎 Gem Ring Verification (JewelryArtisan):
    - check_inventory_status()
    - Should have: 1x emerald, 1x topaz, 1x silverring, 1x goldring
    - If missing any item, coordinate with team for transfer
    - Announce: "Ready for enchantment! I have all materials"
  
  💍 Emerald Ring Crafting (JewelryArtisan):
    - craft_item(skill="Crafting", itemKey="ring1")
    - Materials: 1x emerald + 1x silverring → 1x emerald ring (automatically consumed)
    - Level required: 1 (Crafting skill) - JewelryArtisan has 30 ✓
    - Result: 1x Emerald Ring (basic variant)
    - Announce: "Crafted 1x Emerald Ring (ring1)!"
  
  💍 Topaz Ring Crafting (JewelryArtisan):
    - craft_item(skill="Crafting", itemKey="topazring")
    - Materials: 1x topaz + 1x goldring → 1x topaz ring (automatically consumed)
    - Level required: 5 (Crafting skill) - JewelryArtisan has 30 ✓
    - Result: 1x Topaz Ring
    - Announce: "Crafted 1x Topaz Ring!"
  
  ✅ Final Verification & Completion:
    - JewelryArtisan: check_inventory_status()
    - Should see: 1x ring1 (emerald ring), 1x topazring
    - SmeltingSpecialist verifies extras: 2x silverring, 3x goldring
    - Team announces: "TASK COMPLETE: All ring types produced!"
    - ALL team members confirm in chat before calling complete()
    - JewelryArtisan calls: complete(response="Successfully produced all enchanted rings!")
  
  🚨 CRITICAL COMPLETION RULES:
  - DO NOT call complete() until JewelryArtisan actually has both crafted rings
  - MINIMUM REQUIREMENT: 1x silverring (base), 1x goldring (base), 1x ring1 (emerald), 1x topazring
  - All team members must verify and confirm in chat
  - Only call complete() after team consensus
  
  ═══════════════════════════════════════════════════════════════
  🤝 OVERALL COORDINATION STRATEGY
  ═══════════════════════════════════════════════════════════════
  
  ROLE ASSIGNMENTS:
  - MasterMiner: Get ironore+coal via set_inventory, transfer to SmeltingSpecialist
  - SmeltingSpecialist: Get goldnugget+coal via set_inventory, smelt ALL bars, craft ALL rings, transfer to JewelryArtisan
  - JewelryArtisan: Get gems via set_inventory, receive base rings, craft enchanted rings, call complete()
  
  LOCATION COORDINATION:
  - 📍 Starting locations are spread out but agents should move to central location
  - 📍 RECOMMENDED: All agents move to (250, 180) after initial setup
  - 📍 Stay within 5 tiles of each other for easy coordination
  
  COMMUNICATION PROTOCOL:
  - Use chat() tool for EVERY significant action
  - After set_inventory: "Acquired materials! I have: [exact inventory]"
  - After crafting: "Crafted! Now have: [exact inventory]"
  - Before transfer: "Transferring Xx [item] to [player] now"
  - After receiving: "Confirmed received: Xx [item] - inventory verified"
  - Track progress: "Stage X complete, moving to Stage Y"
  
  TOOL USAGE RULES:
  - set_inventory: Get initial materials (use clearFirst=False to keep flask/apple)
  - check_inventory_status: Verify what you have BEFORE making claims
  - craft_item: Never use count parameter, craft one at a time
  - transfer_items: Always verify sender has items before calling
  - After EVERY tool use, announce result in chat
  
  ERROR HANDLING:
  - If set_inventory fails: Check item key spelling (goldnugget not goldore!)
  - If craft_item fails: Read error message carefully - tells you what's missing
  - If transfer_items fails: System auto-rolls back, check inventory of sender
  - If stuck: Communicate with team, adapt strategy
  - All tools provide detailed error messages - read them carefully
  
  COMPLETION VERIFICATION:
  - DO NOT call complete() prematurely
  - Required: 1+ silverring, 1+ goldring, 1+ ring1 (emerald), 1+ topazring
  - All team members confirm before complete()
  - Final team announcement: "TASK COMPLETE: All ring types produced!"
  
  🎯 SUCCESS = Team produces all ring types through coordinated admin tool usage and crafting!

