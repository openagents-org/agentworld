# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets

task:
  name: "Elemental Harmony Ritual - The Tri-Element Convergence"
  description: "Twenty agents must coordinate to craft three types of elemental staffs and perform a synchronization ritual in the Magical Region."

objectives:
  primary: "Craft 7 Fire Staffs, 7 Ice Staffs, and 7 Nature Staffs, then transfer them to the Ritual Team for the final ceremony."
  secondary:
    - "Fire/Ice/Nature Teams: Harvest Logs from the Magical Forest"
    - "All Teams: Process Logs into Sticks (Shafts)"
    - "Fire Team: Craft 7 Fire Staffs using Fire Beads"
    - "Ice Team: Craft 7 Ice Staffs using Ice Beads"
    - "Nature Team: Craft 7 Nature Staffs using Nature Beads"
    - "Ritual Team: Receive all 21 Staffs and equip them (distribute among members)"
    - "Ritual Team: Demonstrate power by defeating 2 Ancient Wizards together"

relevant_game_context: |
  RITUAL INSTRUCTIONS

  The Grand Magus requires a convergence of Fire, Ice, and Nature.
  You have arrived at the Magical Grove (Region 1-3) with the rare Elemental Beads, but you lack the staffs to house them.

  STEP 1: GATHERING & PROCESSING (Rounds 1-25)
  - Trees are abundant here. Use 'harvest_resource' on Oak Trees.
  - Recipe: 1 Log = 4 Sticks (Shafts).
  - Staff Recipe: 5 Sticks + 1 Bead = 1 Elemental Staff.
  - EACH element team has 7 Beads. You need 35 Sticks per team (approx 9 logs).
  - WARNING: Ancient Wizards roam here. They are neutral unless provoked, but dangerous.

  STEP 2: CRAFTING (Rounds 26-45)
  - Craft your respective staffs:
    - Fire Team: 'firestaff' (Crafting Lvl 35 req - You are buffed)
    - Ice Team: 'icestaff' (Crafting Lvl 55 req - You are buffed)
    - Nature Team: 'naturestaff' (Crafting Lvl 20 req - You are buffed)
  - Note: You need a base 'staff' first?
    - Checking recipes: 'firestaff' needs 'staff' + 'firebead'.
    - 'staff' needs 5 sticks + 1 'bead' (Magic Bead).
    - WAIT: The recipe requires a base 'staff' (Magic Staff) first!
    - You have 'bead' (Magic Bead) in your inventory too!
    - SO: Logs -> Sticks. Sticks + Magic Bead -> Magic Staff. Magic Staff + Elemental Bead -> Elemental Staff.

  STEP 3: THE CONVERGENCE (Rounds 46-65)
  - Transfer ALL 21 final staffs to the Ritual Team.
  - Ritual Team members must equip the staffs.
  - Final Act: The Ritual Team must defeat 2 Ancient Wizards to prove the staffs' power.

  LOCATION STRATEGY
  - Stay close (X:163, Y:339).
  - Protect the crafters.

limitations:
  max_action_steps: 65

