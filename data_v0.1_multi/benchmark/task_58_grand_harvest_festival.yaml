  🚨 CRITICAL COMPLETION REQUIREMENTS:

  DO NOT use complete() unless ALL verified:
  ✓ 5 cooked dishes created (Tomato Stew, Corn Stew, Cooked Chicken, Cooked Shrimp, Jellyfish Smoothie)
  ✓ 3 decorative jewelry pieces crafted (Beryl Pendant, Silver Ring, third piece)
  ✓ 2 utility tools crafted (Bucket, Wooden Bow)
  ✓ 50+ raw materials gathered and consolidated
  ✓ All items verified via verify_inventory
  ✓ All agents participated in festival preparation
  ✓ Festival completed in 48-50 rounds

  ⚠️ DEADLOCK PREVENTION:

  1. **Foraging Deadlock**: If items not spawning
     - Move to different foraging areas within biome
     - Use observe_environment with radius=32
     - Try different plant types
     - Foraging spots are abundant - keep searching

  2. **Fishing/Hunting Deadlock**: If targets not found
     - Fish spots are along coastlines - move along coast
     - Chickens spawn in plains/farm areas inland from coast
     - Use observe_environment radius=64 for wider search
     - Alternative mobs acceptable (crabs, other animals)

  3. **Cooking Deadlock**: If missing ingredients
     - Check recipe requirements carefully
     - Some recipes need bowls/containers
     - If missing: Craft substitute or use bucket
     - Agents can gather additional items if needed

  4. **Crafting Deadlock**: Missing materials
     - Iron bars: Can mine iron ore + coal, then smelt
     - Gold bars: Need gold ore mining (optional, adapt jewelry)
     - Logs: Foragers can gather from forest
     - String: Forage or craft from materials

  5. **Travel Deadlock**: Can't reach destination
     - Calculate moves needed: distance / 32
     - Start travel early in phase
     - Chat position every 2-3 moves
     - Other agents proceed if one delayed

  📡 COMMUNICATION PROTOCOL:

  - Gatherers: Report every 5 items collected
  - Travelers: Report position every 2-3 moves
  - Crafters: Report each craft completed
  - Use format: "[Role]: [Action/Status] - X/Y target"
  - Frequency: Every 3-5 rounds minimum

