# AgentWorld Multi-Agent Task Configuration

task:
  name: "Grand Harvest Festival - Cooperative Culinary & Decorative Preparation"
  description: "Six agents coordinate to prepare for a grand festival by gathering ingredients, cooking dishes, crafting decorations, and delivering everything to the festival grounds"

# Task objectives
objectives:
  primary: "Prepare and deliver a complete festival package: 5x cooked dishes, 3x decorative jewelry, 2x tools, and 50+ gathered resources to Central Festival Grounds"
  secondary:
    - "Phase 1 (Rounds 1-15): Resource Gathering Spree - Collect ingredients from multiple biomes"
    - "Phase 2 (Rounds 16-30): Culinary Production - Cook 5 different festival dishes"
    - "Phase 3 (Rounds 31-42): Decorative Crafting - Create festival decorations and gifts"
    - "Phase 4 (Rounds 43-50): Grand Festival Assembly - Deliver all items to festival grounds"

# Context and guidance for agents
relevant_game_context: |
  This is a cooperative festival preparation task focusing on gathering, cooking, crafting, and coordinated delivery.

  🚨 CRITICAL AWARENESS - FESTIVAL COORDINATION:
  - ALWAYS use chat to announce gathering progress and cooking status
  - ALWAYS verify_inventory before transfers and after cooking
  - Use observe_environment to locate foraging spots and resources
  - Timing is critical - all items must be ready before Phase 4
  - This is a NON-COMBAT task - focus on gathering and crafting
  - Agents must work in parallel during gathering phase for efficiency

  🎯 OVERALL FESTIVAL OBJECTIVE:
  Prepare a complete festival package:

  **CULINARY SECTION (5 dishes)**:
  - 1x Tomato Stew (cooked)
  - 1x Corn Stew (cooked)
  - 1x Cooked Chicken (hunted & cooked)
  - 1x Cooked Shrimp (fished & cooked)
  - 1x Jellyfish Smoothie (crafted)

  **DECORATIVE SECTION (3 jewelry pieces)**:
  - 1x Beryl Pendant (crafted)
  - 1x Silver Ring (crafted)
  - 1x Topaz Ring (crafted)

  **UTILITY SECTION (2 tools)**:
  - 1x Bucket (crafted)
  - 1x Wooden Bow (crafted)

  **RAW MATERIALS (50+ items)**:
  - 20+ fruits (apples, oranges, bananas)
  - 15+ vegetables (tomatoes, onions, corn)
  - 10+ herbs and flowers (cilantro, berries)
  - 5+ special items (beads, gems)

  📍 AGENT ROLES & STARTING LOCATIONS:

  **FORAGER TEAM (Agents 1-2)**: Start (250, 350) - Western Forest
  - Agent 1 "Master_Forager": Gather vegetables, herbs, fruits
  - Agent 2 "Flower_Gatherer": Gather flowers, special herbs, decorative plants
  - Objective: Collect 40+ foraged items for cooking and decoration

  **HUNTER-FISHER TEAM (Agent 3)**: Start (900, 400) - Eastern Coast
  - Agent 3 "Chef_Hunter": Hunt chickens, fish for shrimp and jellyfish
  - Objective: Obtain meat and seafood for cooking

  **CRAFTING HUB TEAM (Agents 4-6)**: Start (528, 384) - Central Kingdom
  - Agent 4 "Head_Chef": Receive ingredients, cook all festival dishes
  - Agent 5 "Jeweler": Craft all decorative jewelry
  - Agent 6 "Artisan": Craft utility tools and coordinate deliveries
  - Objective: Transform raw materials into festival items

  ═══════════════════════════════════════════════════════════
  PHASE 1: RESOURCE GATHERING SPREE (Rounds 1-15)
  ═══════════════════════════════════════════════════════════

  🎯 PHASE OBJECTIVES:
  - Foragers gather 40+ vegetables, fruits, and herbs
  - Hunter obtains 5+ raw meat and seafood
  - All gathering agents prepare for Phase 2 delivery
  - Crafting Hub prepares to receive materials

  🌾 MASTER FORAGER (Agent 1) - PRIMARY GATHERER:

  Starting Location: (250, 350) - Western Forest
  Target: 25+ foraged items

  Gathering List:
  - 8x Tomato (for stew)
  - 5x Corn (for stew)
  - 5x Onion (cooking ingredient)
  - 3x Mushroom (various types)
  - 2x Cilantro (herbs)
  - 2x Beryl (decorative gems)

  Strategy:
  1. Rounds 1-12: Active foraging
     - Use observe_environment radius=32 to find foraging spots
     - Look for plants with tomatoes, corn, onions, mushrooms
     - harvest_resource targetInstance=<plant_id>
     - Check multiple forest locations if needed
     - Chat every 3-4 items: "Master Forager: X/25 items gathered"

  2. Foraging mechanics:
     - Each plant may yield 1-3 items
     - Different plants spawn different items
     - Move around forest to find variety
     - Common locations: (250, 350), (280, 320), (220, 380)

  3. Verification (Round 13):
     - verify_inventory to check totals
     - Should have 25+ foraged items
     - Chat: "Master Forager: Gathering complete - X items total"

  4. Prepare for travel (Rounds 14-15):
     - Ready to move toward Central Hub (528, 384)
     - Distance: ~325 tiles

  🌸 FLOWER GATHERER (Agent 2) - DECORATIVE SPECIALIST:

  Starting Location: (252, 352) - Western Forest
  Target: 15+ decorative and special items

  Gathering List:
  - 5x Apple (fruit, easy to forage)
  - 3x Orange (fruit)
  - 2x Banana (fruit)
  - 2x Topaz (for topaz ring - may need hunting)
  - 2x Bead (magic beads for crafting)
  - 1x String (for pendant)

  Strategy:
  1. Rounds 1-5: Forage fruits (apples, oranges, bananas)
     - Abundant in forest areas
     - observe_environment to find fruit trees/bushes
     - harvest_resource on fruit spots
     - Chat: "Flower Gatherer: X fruits collected"

  2. Rounds 6-10: Search for special items
     - Topaz: May need to hunt low-level mobs or find rare foraging spots
     - Beads: Forage from magical plants or dropped by mobs
     - String: Forage from certain plants
     - May need to move to different areas

  3. Rounds 11-13: Final gathering and consolidation
     - verify_inventory
     - If missing topaz, coordinate with Agent 3 (hunter)
     - Chat totals: "Flower Gatherer: 15+ items ready"

  4. Rounds 14-15: Prepare for travel to hub

  🏹 CHEF HUNTER (Agent 3) - MEAT & SEAFOOD:

  Starting Location: (900, 400) - Eastern Coast
  Target: 3+ raw chicken, 5+ shrimp, 3+ jellyfish

  Strategy:
  1. Rounds 1-6: Fishing for shrimp and jellyfish
     - Use observe_environment to find fish spots
     - harvest_resource targetInstance=<fish_spot_id>
     - Shrimp require Fishing level 1 (Agent 3 has 25)
     - Jellyfish require Fishing level 5
     - Need: 5+ shrimp, 3+ jellyfish
     - Chat: "Chef Hunter: Caught X shrimp, Y jellyfish"

  2. Rounds 7-12: Hunt chickens for meat
     - Move inland from coast to find chicken spawns
     - Use observe_environment radius=32 to locate chickens
     - Chickens are low-level mobs (Level 1-5)
     - attack_entity targetInstance=<chicken_id>
     - System auto-loots chicken meat after kill
     - Need: 3+ chicken (for cooking)
     - Heal if HP < 70% using starting items

  3. Alternative: Hunt other animals
     - If chickens not found, hunt other low-level creatures
     - Any cooked meat works for festival
     - Crabs also work (cooked crab meat)

  4. Rounds 13-15: Consolidate and prepare travel
     - verify_inventory
     - Should have: 3-5 raw meat, 5 shrimp, 3 jellyfish
     - Chat: "Chef Hunter: All ingredients gathered, ready to travel"
     - Begin journey to Central Hub (528, 384)
     - Distance: ~372 tiles from coast

  🏛️ CRAFTING HUB PREPARATION (Agents 4-6):

  Location: (528, 384) - Central Kingdom (Festival Grounds)

  Rounds 1-15 Activities:
  1. Monitor chat for gathering progress
  2. Use verify_inventory to check starting materials
  3. Agent 5 (Jeweler): Check for any starting gems/bars
  4. Agent 6 (Artisan): Verify starting logs and materials
  5. All chat: "Hub ready to receive festival materials"
  6. Plan crafting sequences based on expected materials
  7. Prepare work areas (stay within 5 tiles of each other)

  ⏱️ PHASE 1 TIME ALLOCATION:
  - Rounds 1-12: Active gathering across all locations
  - Rounds 13-14: Final collection and verification
  - Round 15: Begin travel preparations

  ═══════════════════════════════════════════════════════════
  PHASE 2: CULINARY PRODUCTION (Rounds 16-30)
  ═══════════════════════════════════════════════════════════

  🎯 PHASE OBJECTIVES:
  - All gathering agents travel to Central Hub
  - Transfer all ingredients to Head_Chef (Agent 4)
  - Cook all 5 festival dishes in sequence
  - Verify all dishes completed

  🚶 TRAVEL TO FESTIVAL GROUNDS (Rounds 16-22):

  **Forager Team (250, 350) → Hub (528, 384)**:
  - Distance: ~325 tiles
  - Moves needed: 11 actions
  - Agents 1-2 travel together
  - Route: Move east and slightly south
  - Agents chat position every 2-3 moves
  - Expected arrival: Round 22-24

  **Chef Hunter (900, 400) → Hub (528, 384)**:
  - Distance: ~372 tiles
  - Moves needed: 12 actions
  - Agent 3 travels solo
  - Route: Move west toward center
  - Chat: "Chef Hunter at (X,Y), carrying ingredients"
  - Expected arrival: Round 23-25

  🔄 INGREDIENT CONSOLIDATION (Rounds 23-26):

  Transfer Sequence to Head_Chef (Agent 4):

  From Master_Forager (Agent 1):
  - transfer_items targetPlayer=Head_Chef itemKey=tomato count=8
  - transfer_items targetPlayer=Head_Chef itemKey=corn count=5
  - transfer_items targetPlayer=Head_Chef itemKey=onion count=5
  - transfer_items targetPlayer=Head_Chef itemKey=mushroom count=3
  - Chat confirmation after each transfer

  From Flower_Gatherer (Agent 2):
  - transfer_items targetPlayer=Head_Chef itemKey=apple count=5
  - transfer_items targetPlayer=Head_Chef itemKey=orange count=3
  - Keep topaz, bead, string for Jeweler (Agent 5)
  - Later: transfer_items targetPlayer=Jeweler itemKey=topaz count=2
  - transfer_items targetPlayer=Jeweler itemKey=bead count=2
  - transfer_items targetPlayer=Jeweler itemKey=string count=1

  From Chef_Hunter (Agent 3):
  - transfer_items targetPlayer=Head_Chef itemKey=chicken count=3
  - transfer_items targetPlayer=Head_Chef itemKey=shrimp count=5
  - transfer_items targetPlayer=Head_Chef itemKey=jellyfish count=3

  From Master_Forager (Agent 1) to Jeweler:
  - transfer_items targetPlayer=Jeweler itemKey=beryl count=2

  Verification (Round 26):
  - Head_Chef: verify_inventory
    Expected: 8 tomato, 5 corn, 5 onion, 3 mushroom, 3 chicken, 5 shrimp, 3 jellyfish
  - Jeweler: verify_inventory
    Expected: 2 topaz, 2 bead, 1 string, 2 beryl
  - All chat confirmations

  🍳 COOKING OPERATIONS (Agent 4 - Head_Chef):

  Rounds 27-30: Cook All Festival Dishes

  **Dish 1: Tomato Stew**
  - Recipe: 3x tomato + 1x mushroom + 1x bowl → 1x stew (Tomato Stew)
  - Note: Need bowl! Check if in starting inventory
  - If no bowl: Agent 6 must craft bucket first (can substitute)
  - craft_item skill=Cooking itemKey=stew
  - Chat: "Cooked Tomato Stew ✓"

  **Dish 2: Corn Stew**
  - Recipe: 3x corn + 1x mushroom + 1x bowl → 1x stew2 (Corn Stew)
  - craft_item skill=Cooking itemKey=stew2
  - Chat: "Cooked Corn Stew ✓"

  **Dish 3: Cooked Chicken**
  - Recipe: 1x chicken → 1x cookedchicken
  - craft_item skill=Cooking itemKey=cookedchicken
  - Chat: "Cooked Chicken ✓"

  **Dish 4: Cooked Shrimp**
  - Recipe: 1x shrimp → 1x cookedshrimp
  - craft_item skill=Cooking itemKey=cookedshrimp
  - Chat: "Cooked Shrimp ✓"

  **Dish 5: Jellyfish Smoothie**
  - Recipe: 3x jellyfish → 1x jellyfishsmoothie
  - craft_item skill=Cooking itemKey=jellyfishsmoothie
  - Chat: "Made Jellyfish Smoothie ✓"

  Final Verification (Round 30):
  - verify_inventory
  - Should have: 1x stew, 1x stew2, 1x cookedchicken, 1x cookedshrimp, 1x jellyfishsmoothie
  - Chat: "All 5 festival dishes completed! 🍽️"

  ⏱️ PHASE 2 TIME ALLOCATION:
  - Rounds 16-22: Travel to hub (overlaps with Phase 3 start)
  - Rounds 23-26: Ingredient transfers and verification
  - Rounds 27-30: Cooking all dishes

  ═══════════════════════════════════════════════════════════
  PHASE 3: DECORATIVE CRAFTING (Rounds 31-42)
  ═══════════════════════════════════════════════════════════

  🎯 PHASE OBJECTIVES:
  - Craft 3 decorative jewelry pieces
  - Craft 2 utility tools
  - Gather any additional materials needed
  - Prepare all festival items for assembly

  💎 JEWELRY CRAFTING (Agent 5 - Jeweler):

  Materials already received (Round 26):
  - 2x topaz
  - 2x bead
  - 1x string
  - 2x beryl

  Additional needed:
  - 2x iron bar (for silver ring)
  - 1x gold ring (for topaz ring)

  Solution:
  - Agent 4 should have starting iron bars OR
  - Agent 6 needs to gather iron ore and smelt

  Rounds 31-33: Prepare base materials

  If need iron bars:
  - Agent 6 or returning gatherers mine iron ore
  - Transfer to Agent 5 or Agent 4 for smelting
  - Smelt 2x ironbar from ironore + coal

  If need gold ring:
  - Requires goldbar to craft goldring
  - May use simplified recipe or substitute with crafted items
  - Alternative: Focus on silver ring and beryl pendant

  Rounds 34-38: Craft Jewelry

  **Beryl Pendant**:
  - Recipe: 1x beryl + 1x string → 1x berylpendant
  - craft_item skill=Crafting itemKey=berylpendant
  - Chat: "Crafted Beryl Pendant ✓"

  **Silver Ring**:
  - Recipe: 2x ironbar → 1x silverring
  - craft_item skill=Smithing itemKey=silverring
  - Chat: "Crafted Silver Ring ✓"

  **Topaz Ring** (if possible):
  - Recipe: 1x topaz + 1x goldring → 1x topazring
  - Requires goldring first (2x goldbar → 1x goldring)
  - If no gold bars available: Skip this and make second beryl pendant instead
  - Alternative craft: Another silver ring or emerald ring if have emerald

  Simplified Approach (if missing gold):
  - Craft: 1x Beryl Pendant, 1x Silver Ring, 1x additional decorative item
  - Use available materials efficiently

  🛠️ UTILITY CRAFTING (Agent 6 - Artisan):

  Rounds 31-35: Gather materials for tools

  **Bucket Requirements**:
  - Recipe: 3x ironbar → 1x bucket
  - Need to mine iron ore if not in inventory
  - Or receive from other agents

  **Wooden Bow Requirements**:
  - Recipe: 1x logs + 1x string → 1x woodenbow
  - Need logs from forest OR use starting logs
  - Need string from foragers

  Material Acquisition:
  - Check verify_inventory for starting materials
  - If missing: Agent 1 or 2 return to forest for logs
  - Or Agent 3 helps gather needed items
  - Coordinate via chat: "Artisan: Need 2x logs, 1x string for tools"

  Rounds 36-39: Craft Utility Tools

  **Bucket**:
  - Ensure have 3x ironbar
  - craft_item skill=Smithing itemKey=bucket
  - Chat: "Crafted Bucket ✓"

  **Wooden Bow**:
  - Ensure have 1x logs, 1x string
  - craft_item skill=Fletching itemKey=woodenbow
  - Chat: "Crafted Wooden Bow ✓"

  Rounds 40-42: Final Phase 3 Verification

  All crafters verify:
  - Head_Chef: Has 5 cooked dishes
  - Jeweler: Has 3 jewelry pieces (or variations)
  - Artisan: Has 2 utility tools
  - All chat: "Festival items ready for assembly!"

  ⏱️ PHASE 3 TIME ALLOCATION:
  - Rounds 31-33: Gather additional materials if needed
  - Rounds 34-38: Craft jewelry pieces
  - Rounds 36-39: Craft utility tools (overlaps)
  - Rounds 40-42: Verification and preparation

  ═══════════════════════════════════════════════════════════
