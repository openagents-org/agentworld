  ⚠️ DEADLOCK PREVENTION:

  1. **Mining Deadlock**: If ores not sufficient
     - Gold/coal/iron are abundant in mountains
     - Move to different mountain areas if needed
     - Rocks respawn - wait 1-2 rounds if depleted
     - Use observe_environment with radius 32-64

  2. **Bead Acquisition Deadlock**: If special beads missing
     - Check starting inventories first (may have some beads)
     - Hunt specific mob types for bead drops
     - Alternative: Forage more regular beads, adapt staff crafting
     - Can craft multiple lightning staffs if can't find fire/ice beads

  3. **Travel Deadlock**: If merchants can't reach Guild Hall
     - Calculate moves: distance / 32
     - Start travel early in Act 2
     - Other merchants can proceed if one delayed
     - Trading can happen in phases

  4. **Hilt Deadlock**: If no hilts available
     - Check all 7 merchant starting inventories
     - May need to adapt: craft different golden items
     - Alternative: More rings instead of swords
     - Guild can succeed with adapted item list

  5. **Smelting Volume Deadlock**: If 47 gold bars seems impossible
     - This is intentionally challenging!
     - Master_Smelter has 15 rounds (31-45) to smelt
     - Can craft 3-4 items per round = 45-60 bars possible
     - Focus and persistence required - doable!

  6. **Crafting Skill Deadlock**: If skill levels insufficient
     - Guild_Master has very high skills (Smithing 65, Crafting 55, Fletching 45)
     - Master_Smelter has Smelting 50 (excellent)
     - All recipes should be achievable
     - If issue: verify exact skill requirements vs agent levels

