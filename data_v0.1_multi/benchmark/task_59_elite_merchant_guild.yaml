  ACT 1: SPECIALIZATION PHASE (Rounds 1-15)
  ═══════════════════════════════════════════════════════════

  🎯 ACT OBJECTIVES:
  - Each merchant gathers their specialty resources
  - Miners extract all required ores
  - Foragers collect wood and magical items
  - Guild Hall prepares for receiving materials

  ⛏️ GOLD BARON (Merchant 1) - GOLD SPECIALIST:

  Location: (230, 38) - Northern Mountains
  Specialty: Gold Ore
  Target: 47+ gold ore (massive quantity!)

  Strategy:
  1. Rounds 1-15: Intensive gold mining
     - Use observe_environment radius=32 to find gold rocks
     - Gold mining requires Mining level 25+ (Merchant 1 has 50)
     - harvest_resource targetInstance=<gold_rock_id>
     - Each rock yields 1-3 gold ore typically
     - Need to mine 15-20+ gold rock instances
     - Chat every 5 ore: "Gold Baron: X/47 gold ore mined"

  2. Search multiple mountain areas:
     - Primary: (230, 38)
     - Secondary: (238, 48)
     - Gold rocks respawn - may need to wait or relocate
     - Use move_character to search wider area if needed

  3. Verification (Round 15):
     - verify_inventory
     - Should have 47+ gold ore
     - If short, continue mining in Act 2
     - Chat: "Gold Baron: Gold ore ready - X/47"

  ⛏️ COAL MAGNATE (Merchant 2) - COAL SPECIALIST:

  Location: (232, 40) - Northern Mountains
  Specialty: Coal
  Target: 54+ coal (largest quantity needed!)

  Strategy:
  1. Rounds 1-15: Mass coal mining
     - observe_environment to find coal rocks
     - Coal requires Mining level 1+ (easy for Merchant 2)
     - harvest_resource targetInstance=<coal_rock_id>
     - Coal is abundant but need large quantity
     - Chat every 6 coal: "Coal Magnate: X/54 coal mined"

  2. Efficient mining:
     - Coal rocks are common in mountains
     - Each yields 1-3 coal
     - Need 18-20+ coal rock harvests
     - Stay near (232, 40) - rich coal area

  3. This is most intensive gathering - focus and persistence
     - May need full 15 rounds for 54 coal
     - Chat progress regularly

  ⛏️ IRON TRADER (Merchant 3) - IRON SPECIALIST:

  Location: (234, 42) - Northern Mountains
  Specialty: Iron Ore
  Target: 7+ iron ore (smaller quantity - easier!)

  Strategy:
  1. Rounds 1-8: Iron ore mining
     - observe_environment to find iron rocks
     - Iron requires Mining level 10+ (Merchant 3 has 35)
     - harvest_resource targetInstance=<iron_rock_id>
     - Need only 7 iron ore - achievable quickly
     - Chat: "Iron Trader: X/7 iron ore collected"

  2. Rounds 9-15: Gather additional specialty items
     - Once 7 iron collected, help other merchants
     - Could gather extra logs or coal if needed
     - Or hunt for hilts (need 2 total for guild)
     - Check starting inventory for hilt2
     - Chat: "Iron Trader: Iron quota met, assisting guild"

  🪓 TIMBER MERCHANT (Merchant 4) - LUMBER SPECIALIST:

  Location: (250, 350) - Western Forest
  Specialty: Logs and Strings
  Target: 8+ logs, 10+ strings

  Strategy:
  1. Rounds 1-8: Lumber harvesting
     - Use observe_environment radius=32 to find Oak Trees
     - harvest_resource targetInstance=<tree_id>
     - Lumberjacking level 30 (excellent)
     - Need 8+ logs total
     - Chat: "Timber Merchant: X/8 logs harvested"

  2. Rounds 9-15: String foraging
     - Move to foraging areas in forest
     - observe_environment to find plants with string
     - harvest_resource on plant nodes
     - String can be foraged or found from spider mobs
     - Need 10+ strings for Golden Bow
     - Alternative: Hunt spiders for string drops
     - Chat: "Timber Merchant: X/10 strings collected"

  🔮 MYSTIC COLLECTOR (Merchant 5) - MAGICAL SPECIALIST:

  Location: (350, 250) - Central Plains
  Specialty: Magical Beads
  Target: 3+ regular beads, 1+ lightningbead, 1+ firebead, 1+ icebead

  Strategy:
  1. Rounds 1-6: Regular bead foraging
     - Use observe_environment to find magical plants
     - Beads can be foraged from certain spots
     - harvest_resource on magical plant instances
     - Need 3+ regular beads for base staffs
     - Chat: "Mystic Collector: X/3 regular beads found"

  2. Rounds 7-15: Special bead hunting
     - Lightning, fire, and ice beads are RARE
     - May need to hunt specific mobs:
       * Lightning bead: Wizards, magical creatures
       * Fire bead: Fire-based mobs
       * Ice bead: Ice-based mobs or ice region foraging
     - Alternative: Check starting inventory
     - May have some special beads to start
     - Hunt low-mid level mobs if needed
     - Chat: "Mystic Collector: Special beads - Lightning X, Fire Y, Ice Z"

  3. If hunting needed:
     - observe_environment radius=64 to find mobs
     - attack_entity targetInstance=<mob_id>
     - Check drops with verify_inventory
     - Heal if HP < 70%

