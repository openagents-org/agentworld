# AgentWorld Multi-Agent Task Configuration

task:
  name: "Elite Merchant Guild - Multi-Agent Trading & Specialization Network"
  description: "Seven specialist merchants establish a trading guild, each gathering unique resources and trading with peers to complete specialized collections and craft guild masterpieces"

# Task objectives
objectives:
  primary: "Establish a 7-member merchant guild where each specialist gathers unique resources, trades with peers, and collectively crafts 4x Golden items, 3x Staffs, and 2x Specialty weapons"
  secondary:
    - "Act 1 (Rounds 1-15): Specialization Phase - Each merchant gathers their specialty resources"
    - "Act 2 (Rounds 16-30): Trading Network Phase - Merchants trade resources peer-to-peer to complete recipes"
    - "Act 3 (Rounds 31-45): Crafting Excellence Phase - Each specialist crafts their signature items"
    - "Act 4 (Rounds 46-53): Guild Exhibition - Consolidate and showcase all masterpieces"

# Context and guidance for agents
relevant_game_context: |
  This is an advanced merchant guild simulation requiring resource specialization, peer-to-peer trading, and collaborative crafting.

  🚨 CRITICAL AWARENESS - MERCHANT GUILD OPERATIONS:
  - ALWAYS use chat to announce resource availability and trade offers
  - ALWAYS verify_inventory before and after every trade
  - Use observe_environment to locate specialized resources
  - Trading is PEER-TO-PEER - agents trade directly with each other
  - Each merchant has a SPECIALTY - focus on gathering your specialty first
  - This is a 53-round operation - pace resource gathering and trading

  🎯 OVERALL GUILD OBJECTIVE:
  Create a complete guild collection:

  **GOLDEN ITEMS (4 pieces)** - High prestige:
  - 1x Golden Sword (requires 15 goldbar + 1 hilt2)
  - 1x Golden Bow (requires 15 goldbar + 10 string + 2 logs)
  - 1x Golden Boots (requires 15 goldbar)
  - 1x Gold Ring (requires 2 goldbar)
  TOTAL GOLD NEEDED: 47 gold bars (requires 47 gold ore + 47 coal!)

  **MAGICAL STAFFS (3 types)**:
  - 1x Lightning Staff (requires 1 staff + 1 lightningbead)
  - 1x Fire Staff (requires 1 staff + 1 firebead)
  - 1x Ice Staff (requires 1 staff + 1 icebead)
  TOTAL: 3 base staffs (15 sticks + 3 beads) + 3 special beads

  **SPECIALTY WEAPONS (2 items)**:
  - 1x Pickaxe (requires 5 ironbar + 1 logs)
  - 1x Heavy Sword (requires 2 ironbar + 1 hilt2)
  TOTAL IRON NEEDED: 7 iron bars (requires 7 iron ore + 7 coal)

  📍 MERCHANT SPECIALIZATIONS & STARTING LOCATIONS:

  **MERCHANT 1 "Gold_Baron"** (230, 38) - Northern Mountains
  - Specialty: Gold ore mining
  - Target: Mine 47+ gold ore
  - Role: Primary gold supplier

  **MERCHANT 2 "Coal_Magnate"** (232, 40) - Northern Mountains
  - Specialty: Coal mining
  - Target: Mine 54+ coal (47 for gold + 7 for iron)
  - Role: Fuel supplier for all smelting

  **MERCHANT 3 "Iron_Trader"** (234, 42) - Northern Mountains
  - Specialty: Iron ore mining
  - Target: Mine 7+ iron ore
  - Role: Iron supplier for weapons/tools

  **MERCHANT 4 "Timber_Merchant"** (250, 350) - Western Forest
  - Specialty: Lumber and strings
  - Target: 8+ logs, 10+ strings
  - Role: Wood and binding material supplier

  **MERCHANT 5 "Mystic_Collector"** (350, 250) - Central Plains
  - Specialty: Magical beads and components
  - Target: 6+ beads (3 regular + 3 special)
  - Role: Magical component supplier

  **MERCHANT 6 "Master_Smelter"** (528, 384) - Guild Hall (Central Hub)
  - Specialty: Smelting and base crafting
  - Target: Smelt all bars, craft base items
  - Role: Primary smelter and intermediate crafter

  **MERCHANT 7 "Guild_Master"** (530, 386) - Guild Hall (Central Hub)
  - Specialty: High-level crafting and coordination
  - Target: Craft golden items and coordinate guild
  - Role: Master crafter and guild coordinator

