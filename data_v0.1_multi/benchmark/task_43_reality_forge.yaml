# AgentWorld Multi-Agent Task Configuration

task:
  name: "Reality Forge Mastery - Universal Creation and Existence Manipulation"
  description: "Three agents work together to master the Reality Forge, create new forms of existence, and manipulate the fundamental laws of reality"

# Task objectives
objectives:
  primary: "Successfully master the Reality Forge, create new forms of existence, and manipulate fundamental laws of reality"
  secondary: # checkpoints
    - "Establish Reality Forge access coordination and existence manipulation preparation"
    - "Execute coordinated reality creation and fundamental law modification"
    - "Complete Reality Forge mastery within 41 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is the ultimate cooperative reality manipulation scenario requiring mastery of all creation and existence magic.
  
  OBJECTIVE: Master the Reality Forge, create new forms of existence, and manipulate fundamental laws of reality.
  
  MISSION REQUIREMENTS:
  - Navigate to Reality Forge Chamber (Region 11-10: coordinates 1700-1750, 1300-1350)
  - Access the Reality Forge through complex magical authentication procedures
  - Defeat Reality Guardians (Level 78) that protect the forge from misuse
  - Create new forms of existence and modify fundamental laws of reality
  
  TEAM COORDINATION:
  - Use global chat for complex reality manipulation coordination and creation timing
  - Coordinate between forge access, guardian combat, and existence creation
  - Share reality-shaping energies and provide maximum support for universal creation
  - Work together to handle reality-scale manipulation with existential consequences
  
  GENERAL STRATEGY:
  - This requires ultimate magical mastery and reality manipulation understanding
  - Reality Guardians (Level 78) are among the most powerful protective entities
  - Reality Forge manipulation affects the fundamental nature of existence itself
  - Creation procedures require perfect coordination and massive reality-shaping energy
  - Balance creative ambition with existential responsibility and universal stability
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  REALITY FORGE MASTERY (CRITICAL KNOWLEDGE):
  🔨 Reality Forge Access:
    - Use reality_authenticate action with combined magical signatures
    - Requires master-level magic (55+) from all three agents simultaneously
    - Forge responds only to pure creative intent and existential responsibility
    - Coordinate authentication sequence to avoid reality backlash
  
  👁️ Combat - Reality Guardians:
    - Use observe_environment to locate Reality Guardians at forge entrance (1725,1315) and core (1735,1330)
    - Level 78 entities with reality manipulation and existence-ending abilities
    - Expect reality warping attacks, existence erasure, and dimensional banishment
    - Use creation magic and existence affirmation for maximum effectiveness
    - Coordinate reality-stabilization attacks to prevent existential damage
  
  ⚗️ Existence Creation Procedures:
    - Use create_existence action at Reality Forge core coordinates (1730,1325)
    - Requires reality crystals, existence essence, and pure creative will
    - Create new life forms, magical creatures, or even new physical laws
    - Coordinate creation energy to ensure stable and beneficial new existence
  
  📜 Fundamental Law Modification:
    - Use modify_reality action to alter basic rules of physics, magic, or existence
    - Requires unanimous agreement and perfect magical synchronization
    - Changes affect all of AgentWorld and connected dimensions
    - Coordinate modifications to improve universal harmony and stability
  
  🌌 Universal Creation Mastery:
    - Balance creative power with existential responsibility
    - Create beneficial additions to reality while preserving universal stability
    - Coordinate reality modifications to enhance life and harmony
    - Establish safeguards to prevent misuse of reality-shaping power

# Limitations
max_action_steps: 41

