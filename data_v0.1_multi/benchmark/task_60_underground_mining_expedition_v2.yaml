# AgentWorld Multi-Agent Task Configuration

task:
  name: "Underground Mining Expedition - Extended 9-Agent Mass Extraction"
  description: "Nine specialized miners coordinate a massive underground expedition to extract and process multiple ore types, creating a complete metallurgy empire"

# Task objectives
objectives:
  primary: "Execute a comprehensive mining operation extracting 120+ ores across 4 types, smelt 90+ bars, and craft 15+ metal items including tools, weapons, and jewelry"
  secondary:
    - "Phase 1 (Rounds 1-18): Deep Mining Operations - Extract iron, gold, coal, and special ores"
    - "Phase 2 (Rounds 19-32): Ore Transportation - Travel to central smeltery with all materials"
    - "Phase 3 (Rounds 33-48): Mass Smelting - Convert all ores to refined bars"
    - "Phase 4 (Rounds 49-60): Metalwork Production - Craft complete metallurgy collection"

# Context and guidance for agents
relevant_game_context: |
  EXPEDITION HIGHLIGHTS
  - Nine miners must clear 120+ ore (40 iron, 30 gold, 45 coal, 5 special), smelt 90+ bars, and craft at least fifteen metal goods (tools, weapons, jewelry) before Round 60. Mining squads work the northern range (~230–240, 38–50) while the smelter trio holds the central hub (528,384).

  PHASE PLAN
  1. R1-18 Mining: iron team hits 40 ore, gold team 30, Coal_Baron 45, gathering counts in chat and verifying inventories after each stint.
  2. R19-32 Transport: all miners march south-east toward the central smeltery in ≤32-tile hops, announcing positions. Once within 5 tiles, transfer ores/coal via transfer_items to Master_Smelter; special ores stay with Metalsmith until needed.
  3. R33-48 Smelting: Master_Smelter and Assistant_Smelter run craft_item(Smelting, ironbar/goldbar) until quotas met while Metalsmith tracks inventory milestones.
  4. R49-60 Production: Metalsmith and Jeweler craft pickaxe, 3x axe, 2x bucket, 2x heavy sword, golden sword, 3x gold ring, and 3x silver ring; report each completion before the final verification.

  EXECUTION NOTES
  - Keep ore handoffs orderly: iron/gold/coal → Smelters only; special ores/logs → Metalsmith. Both sender and receiver must confirm in chat.
  - Smelting volume is high; post progress every 10 bars so crafters know when they can begin.

  COMPLETION CHECK
  - Final inventories must show ≥40 iron bars, ≥30 gold bars converted into the requested tool/weapon/jewelry set (at least 15 finished items). Summarize ore totals, smelting counts, and crafted goods before calling complete().
# Limitations
max_action_steps: 60

