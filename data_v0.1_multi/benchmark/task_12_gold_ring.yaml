  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "pickaxe"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Fuel supply specialist responsible for coal collection
    
    ⚫ CRITICAL FUEL SUPPLY MISSION - COLLECT COAL FOR GOLD SMELTING!
    
    ABSOLUTE PRIORITIES:
    1. Find coal deposits for gold smelting fuel
    2. Extract sufficient coal for multiple smelting attempts
    3. Secure backup coal for challenging gold smelting
    4. Transfer coal to gold_smith_agent
    
    FUEL SUPPLY STRATEGY:
    1. observe_environment to search for coal deposits
    2. Look for "coal" rock instances (level 1 requirement - accessible)
    3. If not visible, move to coal mining areas:
       - move_character(x=150, y=450) for coal deposit area
       - move_character(x=250, y=350) for fuel mining zone
       - move_character(x=300, y=500) for coal-rich area
    4. harvest_resource on coal rock instances to get coal
    5. Target: Collect 4-5x coal for gold smelting + backup attempts
    6. Check inventory after each mining attempt
    7. Use global chat to report coal collection progress
    8. Once you have sufficient coal, coordinate with gold_smith_agent
    9. Move to agreed meetup location for coal transfer
    10. transfer_items to give coal to gold_smith_agent
    11. Wait for gold_smith_agent to confirm coal receipt
    12. Support team until gold ring creation is complete
    
    COAL SUPPLY REQUIREMENTS:
    - Mining skill level 1+ (you have 25) ✅
    - Multiple coal units for backup attempts
    - Reliable fuel supply for precious metal smelting
    
    ERROR PREVENTION:
    - Collect extra coal for backup smelting attempts
    - Check inventory after each coal extraction
    - Coordinate with gold smelting timeline
    - REMEMBER: Gold smelting is challenging - need backup fuel!

agent_3:
  username: "gold_smith_agent"
  new_character: true
  role: "Premium Gold Smith"
  
  location:
    x: 242
    y: 336
  
  skill_levels:
    smithing: 30      # Required for gold smelting and ring creation
    mining: 15        # Gold material knowledge
    strength: 25
    health: 25
  
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Premium gold smith responsible for gold ring creation
    
    🟨 PRIORITY ACTIONS:
    1. Coordinate with both gold_miner_agent and coal_supplier_agent
    2. Collect gold ore and coal for smelting operations
    3. Execute challenging gold smelting (40% success rate)
    4. Forge gold ring from gold bars
    5. Final quality control and ring equipping
    
    PREMIUM SMITHING COORDINATION:
    1. send global chat message announcing premium gold smithing facility readiness
    2. Monitor progress from both gold_miner_agent and coal_supplier_agent
    3. Coordinate material collection from both agents
    4. First collect goldore from gold_miner_agent
    5. Then collect coal from coal_supplier_agent
    6. Verify sufficient materials for multiple smelting attempts
    
    CRITICAL GOLD SMITHING STEPS:
    7. observe_environment to CHECK YOUR INVENTORY before smelting
    8. VERIFY you have goldore AND coal (with backups)
    9. Execute gold smelting (CHALLENGING - 40% success rate):
       📋 SMELTING: craft_item skill=Smelting itemKey=goldbar (1x goldore + 1x coal → 1x goldbar)
    10. If smelting fails, try again with backup materials
    11. Repeat until you have 2x goldbar
    12. Forge gold ring:
        📋 SMITHING: craft_item skill=Smithing itemKey=goldring (2x goldbar → 1x goldring)
    13. observe_environment to verify gold ring created
    14. equip_item to equip the gold ring
    15. observe_environment to verify ring is equipped
    16. Use global chat to declare "Premium gold ring forged and equipped successfully!"
    17. complete() ONLY after successful ring creation and equipping
    
    GOLD SMITHING REQUIREMENTS:
    ✅ Multiple goldore (from gold_miner_agent)
    ✅ Multiple coal (from coal_supplier_agent)
    ✅ Smithing skill level 20+ for gold smelting (you have 30)
    ⚠️ 40% success chance - expect multiple attempts!
    
    ERROR PREVENTION:
    - Prepare for multiple smelting failures
    - Have backup materials ready
    - Check inventory after each smelting attempt
    - REMEMBER: Gold smelting is the most challenging metallurgy!

# Success criteria for multi-agent task
success_criteria:
  - "gold_miner_agent successfully mines and transfers gold ore"
  - "coal_supplier_agent successfully collects and transfers coal"
  - "gold_smith_agent receives materials and creates gold ring"
  - "gold_smith_agent successfully equips the gold ring"
  - "All agents handle precious materials with appropriate care"
  - "Premium metallurgy operations complete within time limit"
