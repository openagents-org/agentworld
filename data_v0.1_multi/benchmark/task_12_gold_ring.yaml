# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cooperative Gold Ring Forging - Premium Metallurgy"
  description: "Three agents work together to create a gold ring through gold mining, advanced smelting, and precious metal smithing"

# Task objectives
objectives:
  primary: "Create a gold ring through coordinated gold extraction and premium metallurgy"
  secondary: # checkpoints
    - "Execute precious metal mining operations"
    - "Coordinate advanced gold smelting techniques"
    - "Complete premium ring smithing within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent premium metallurgy scenario requiring gold materials.
  
  HINT:
  1. gold_miner_agent MUST find and mine gold ore deposits (high-level mining)
  2. coal_supplier_agent MUST collect coal for gold smelting fuel
  3. gold_smith_agent MUST smelt gold ore into gold bars and forge gold ring
  4. gold_smith_agent MUST equip the gold ring and declare completion
  
  LOCATION STRATEGY:
  - High-level mining areas for gold ore extraction
  - Coal deposits for smelting fuel
  - Premium smithing facility for gold ring creation
  - Communicate precious metal locations through global chat
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  🟨 Mining - gold ore:
    - harvest_resource on gold rock instances to get goldore
    - Level required: 25+ (Mining skill) - HIGH LEVEL!
  
  ⛏️ Mining - coal:
    - harvest_resource on coal deposits to get coal
    - Level required: 1+ (Mining skill)
  
  🟨 Smelting Recipe - goldbar:
    - craft_item skill=Smelting itemKey=goldbar
    - Materials: 1x goldore + 1x coal → 1x goldbar
    - Level required: 20 (uses Smithing skill level)
    - Success chance: 40% - VERY CHALLENGING!
  
  🟨 Smithing Recipe - goldring:
    - craft_item skill=Smithing itemKey=goldring
    - Materials: 2x goldbar → 1x goldring
    - Level required: 1 (Smithing skill)

# Limitations
max_action_steps: 25

