# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cooperative Gold Ring Forging - Premium Metallurgy"
  description: "Three agents work together to create a gold ring through gold mining, advanced smelting, and precious metal smithing"

# Task objectives
objectives:
  primary: "Create a gold ring through coordinated gold extraction and premium metallurgy"
  secondary: # checkpoints
    - "Execute precious metal mining operations"
    - "Coordinate advanced gold smelting techniques"
    - "Complete premium ring smithing within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent premium metallurgy scenario requiring gold materials.
  
  CRITICAL SUCCESS REQUIREMENTS:
  1. gold_miner_agent MUST find and mine gold ore deposits (high-level mining)
  2. coal_supplier_agent MUST collect coal for gold smelting fuel
  3. gold_smith_agent MUST smelt gold ore into gold bars and forge gold ring
  4. gold_smith_agent MUST equip the gold ring and declare completion
  
  LOCATION STRATEGY:
  - High-level mining areas for gold ore extraction
  - Coal deposits for smelting fuel
  - Premium smithing facility for gold ring creation
  - Communicate precious metal locations through global chat
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  🟨 Mining - gold ore:
    - harvest_resource on gold rock instances to get goldore
    - Level required: 25+ (Mining skill) - HIGH LEVEL!
  
  ⛏️ Mining - coal:
    - harvest_resource on coal deposits to get coal
    - Level required: 1+ (Mining skill)
  
  🟨 Smelting Recipe - goldbar:
    - craft_item skill=Smelting itemKey=goldbar
    - Materials: 1x goldore + 1x coal → 1x goldbar
    - Level required: 20 (uses Smithing skill level)
    - Success chance: 40% - VERY CHALLENGING!
  
  🟨 Smithing Recipe - goldring:
    - craft_item skill=Smithing itemKey=goldring
    - Materials: 2x goldbar → 1x goldring
    - Level required: 1 (Smithing skill)

# Limitations
max_action_steps: 25

# Agent configurations
agent_1:
  username: "gold_miner_agent"
  new_character: true
  role: "Gold Ore Specialist"
  
  location:
    x: 212
    y: 650
  
  skill_levels:
    mining: 35        # Required for gold mining (level 25+)
    strength: 35
    health: 30
  
  inventory_items:
    - item: "flask"
      count: 15
    - item: "apple"
      count: 20
  
  equipped_items:
    - item: "pickaxe"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Gold ore specialist responsible for precious metal extraction
    
    🟨 CRITICAL GOLD MINING MISSION - EXTRACT PRECIOUS GOLD ORE!
    
    ABSOLUTE PRIORITIES:
    1. Find gold ore deposits in high-level mining areas
    2. Mine gold ore for premium ring crafting
    3. Secure multiple gold ore units for backup
    4. Transfer gold ore to gold_smith_agent
    
    GOLD MINING STRATEGY:
    1. observe_environment to search for gold rock deposits
    2. Look for "gold" rock instances (level 25 requirement - HIGH LEVEL!)
    3. If not visible, move to high-level mining areas:
       - move_character(x=250, y=650) for deep gold mine area
       - move_character(x=350, y=550) for precious metal zone
       - move_character(x=400, y=700) for advanced mining area
    4. harvest_resource on gold rock instances to get goldore
    5. Target: Collect 3-4x goldore for ring production + backup
    6. Check inventory after each mining attempt
    7. Use global chat every 2-3 actions to report gold mining progress
    8. Once you have sufficient gold ore, coordinate with gold_smith_agent
    9. Move to agreed meetup location for gold ore transfer
    10. transfer_items to give goldore to gold_smith_agent (EXTREMELY VALUABLE!)
    11. Wait for gold_smith_agent to confirm receipt
    12. Support team until gold ring creation is complete
    
    GOLD MINING REQUIREMENTS:
    - Mining skill level 25+ (you have 35) ✅
    - High-level pickaxe recommended
    - Advanced mining capability
    - Secure handling of precious metals
    
    ERROR PREVENTION:
    - Verify mining skill meets gold requirements
    - Check inventory carefully after mining attempts
    - Handle gold ore transfer with extreme care - MOST VALUABLE
    - REMEMBER: Gold ore is the most precious mining material!

