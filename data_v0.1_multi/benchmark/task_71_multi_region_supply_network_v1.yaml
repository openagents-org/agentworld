# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Simplified 5-agent 3-region supply network

task:
  name: "Multi-Region Supply Network - Core Trade System"
  description: "Five agents establish a supply chain spanning 3 regions to create crafted goods"

# Task objectives
objectives:
  primary: "Create a functioning 3-region supply network with gathering teams, transport, and centralized crafting over 40 rounds"
  secondary:
    - "Phase 1 (Rounds 1-8): Network Planning - Scout regions and establish roles"
    - "Phase 2 (Rounds 9-18): Resource Gathering - Teams gather region-specific materials"
    - "Phase 3 (Rounds 19-28): Transport Operations - Coordinate material transfers to hub"
    - "Phase 4 (Rounds 29-40): Production & Validation - Craft equipment and verify network"

# Relevant game context
relevant_game_context: |
  NETWORK GOAL
  - Five agents run a three-region supply chain over ~40 rounds: forest logs/sticks, mountain ores, and a central hub that smelts/crafts. Success requires synchronized gathering, transport, and production.

  PHASE OVERVIEW
  1. R1-8 Planning: assign teams (Forest, Mountain, Hub), scout their regions, set chat protocols.
  2. R9-18 Gathering: Forest team gets 30 logs + 50 sticks; Mountain team mines 25 iron/25 coal. Hub monitors progress.
  3. R19-28 Transport: execute delivery waves. After each arrival, transfer via transfer_items.
  4. R29-40 Production: hub crafter smelts bars, crafts weapons/tools using delivered materials.

  EXECUTION NOTES
  - Keep a running logistics board in chat ("Forest 20/30 logs") so the hub can time smelting.
  - Transfers only work within ~10 tiles; both sender and receiver must confirm.
# Limitations
max_action_steps: 40

