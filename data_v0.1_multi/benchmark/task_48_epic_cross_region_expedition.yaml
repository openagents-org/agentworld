# Success criteria for multi-agent task
success_criteria:
  - "ExpeditionLeader successfully navigates team across all three regions"
  - "Team successfully completes Forest Region objectives (Phase 1)"
  - "Magic Staff is crafted from forest resources"
  - "Team successfully travels to Mountain Region"
  - "MasterCraftsman coordinates all crafting operations across regions"
  - "Team successfully completes Mountain Region objectives (Phase 2)"
  - "Pickaxe and Axe are crafted from mountain resources"
  - "ResourceGatherer successfully gathers resources from all regions"
