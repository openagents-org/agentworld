# AgentWorld Multi-Agent Task Configuration

task:
  name: "Epic Cross-Region Expedition - Long-Distance Resource Quest"
  description: "Three agents embark on an epic cross-region journey to gather diverse resources, craft advanced equipment, and establish trade networks across multiple biomes"

# Task objectives
objectives:
  primary: "Complete an epic cross-region expedition gathering resources from forest, mountain, and coastal regions to craft multiple advanced equipment pieces"
  secondary: # checkpoints
    - "Execute long-distance travel across three major regions"
    - "Gather diverse resources from forest (wood), mountain (ore), and coastal (special materials)"
    - "Complete complex multi-stage crafting operations"
    - "Establish equipment production across all three regions within 50 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  EXPEDITION SNAPSHOT
  - Three specialists travel Forest → Mountain → Coast. Forest supplies 8 logs (enough for 16 sticks and future tool handles), mountains deliver 8+ ironbars, coast is the regroup point.
  - Starting items: ExpeditionLeader holds the bead, MasterCraftsman holds hilt2, ResourceGatherer begins with 2 ironore + 2 coal.

  PHASE FLOW
  1. Forest (R1-15): harvest_resource on oaks for 8 logs, craft sticks via craft_item(Fletching, stick), then craft one magic staff (5 sticks + bead). Reserve six logs for later tool handles.
  2. Mountains (R16-35): move_character to (230,38). Mine 12+ ironore and 12+ coal (expect smelting failure). Smelt with craft_item(Smelting, ironbar) until ≥8 successes. Use 5 bars + 1 log for pickaxe, 3 bars + 1 log for axe.
  3. Coast (R36-50): travel to (900,400), verify each agent carries the crafted staff/pickaxe/axe, redistribute gear, and document expedition summary.

  KEY RULES
  - Smelting succeeds ~60%; track counts in chat (“Bars 3/8”). Mine extra ore/coal before leaving the mountains.
  - Transfers happen through transfer_items with verify_inventory confirmations. Announce every harvest, smelt, craft, and region change in global chat.
  - Everyone travels together between regions; ExpeditionLeader calls routes, ResourceGatherer focuses on mining, MasterCraftsman handles all crafting.

  COMPLETION CHECKLIST
  - 1x magic staff (forest), 1x pickaxe and 1x axe (mountain) confirmed at the coast.
  - Chat log shows phase transitions, smelting totals, and transfer receipts.
  - Team is assembled in the coastal region before complete().
# Limitations
max_action_steps: 50

