# AgentWorld Multi-Agent Task Configuration

task:
  name: "Epic Cross-Region Expedition - Long-Distance Resource Quest"
  description: "Three agents embark on an epic cross-region journey to gather diverse resources, craft advanced equipment, and establish trade networks across multiple biomes"

# Task objectives
objectives:
  primary: "Complete an epic cross-region expedition gathering resources from forest, mountain, and coastal regions to craft multiple advanced equipment pieces"
  secondary: # checkpoints
    - "Execute long-distance travel across three major regions"
    - "Gather diverse resources from forest (wood), mountain (ore), and coastal (special materials)"
    - "Complete complex multi-stage crafting operations"
    - "Establish equipment production across all three regions within 50 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is an epic cooperative multi-agent expedition requiring long-distance coordination and complex resource management.
  
  EPIC OBJECTIVE: Complete a cross-region expedition to gather resources and craft equipment:
  1. Start in Forest Region - Gather wood resources and craft basic components
  2. Travel to Mountain Region - Mine ores and smelt metal bars
  3. Journey to Coastal Region - Gather special materials and complete final crafting
  4. Produce multiple equipment pieces from diverse regional resources
  
  🚨 CRITICAL AWARENESS: Check your actual inventory state before making claims!
  - Use verify_inventory to see what you really have in your inventory
  - Use check_inventory_status frequently to track your current materials
  - DO NOT assume you have materials that aren't verified
  - DO NOT claim transfers happened without actually using transfer_items tool
  - DO NOT just talk about helping - USE THE ACTUAL TOOLS to help!
  
  📋 REQUIRED MATERIALS FOR EXPEDITION SUCCESS (TOTAL):
  - EXACTLY 8x logs needed (harvest from Oak Trees in Forest Region)
  - MINIMUM 10-12x ironore needed (mine from Iron Rock in Mountain Region)
    * ⚠️ Extra needed due to 60% smelting success rate!
  - MINIMUM 10-12x coal needed (mine from Coal Rock in Mountain Region)
    * ⚠️ Extra needed due to 60% smelting success rate!
  - MINIMUM 8x ironbar needed (smelt from ironore + coal with 60% success)
  - EXACTLY 1x bead needed (ExpeditionLeader starts with this)
  - EXACTLY 1x hilt2 needed (MasterCraftsman starts with this)
  - ResourceGatherer starts with 2x coal + 2x ironore (head start!)
  
  🧮 MATERIAL MATH (CRITICAL - READ CAREFULLY):
  Phase 1 - Forest Region:
  - 2x logs → craft 2 times → 8x sticks (1 log = 4 sticks per craft)
  - 5x sticks + 1x bead → 1x Magic Staff
  - Remaining 3x sticks + 6x more logs kept for Phase 2
  
  Phase 2 - Mountain Region:
  - 10-12x ironore + 10-12x coal → smelt multiple times → minimum 8x ironbar
  - ⚠️ CRITICAL: Smelting has 60% success rate - expect some failures!
  - Keep smelting until you have at least 8x ironbar (may need 10-15 attempts)
  - 5x ironbar + 1x logs → 1x pickaxe (MasterCraftsman crafts)
  - 3x ironbar + 1x logs → 1x axe (MasterCraftsman crafts)
  - Final result: 1x staff + 1x pickaxe + 1x axe
  
  Phase 3 - Coastal Region:
  - Distribute equipment among team
  - Verify all objectives completed
  - Optional: craft arrows if feathers found
  
  🚨 CRITICAL CRAFT SYNTAX:
  - DO NOT use count parameter in any craft_item calls!
  - Recipes automatically consume the correct materials and produce items
  - Wrong: craft_item(skill="Fletching", itemKey="stick", count=4)
  - Right: craft_item(skill="Fletching", itemKey="stick")
  - If you need 8 ironbars, call craft_item 8 times
  
  EXPEDITION PHASES:
  
  PHASE 1 - FOREST REGION (Rounds 1-15):
  🌲 Location: Western Forest Region around (250, 350)
  🎯 Objectives:
    - Gather logs from Oak trees (need 6+ logs total)
    - Craft sticks from logs using Fletching
    - Craft basic Magic Staff (5 sticks + 1 bead)
    - Prepare for mountain journey
  
  🪵 Lumberjacking - logs:
    - harvest_resource on Oak Tree instances
    - Level required: 1+ (Lumberjacking skill)
    - harvest_resource automatically: moves closer if needed, completes entire harvesting process, collects items
    - Gather extra logs for tool handles later
  
  🪄 Fletching Recipe - stick:
    - craft_item skill=Fletching itemKey=stick (NO count parameter!)
    - Materials: 1x logs → 4x sticks (automatically)
    - Need multiple batches for staff and arrows
    - Craft syntax: craft_item(skill="Fletching", itemKey="stick")
  
  ⚡ Crafting Recipe - staff:
    - craft_item skill=Crafting itemKey=staff (NO count parameter!)
    - Materials: 5x stick + 1x bead → 1x staff (automatically)
    - Level required: 1 (Crafting skill)
    - Craft syntax: craft_item(skill="Crafting", itemKey="staff")
  
  PHASE 2 - MOUNTAIN REGION (Rounds 16-35):
  ⛰️ Location: Mountain Mining Area around (230, 38) - Region 2-0 Mountain/Rocky
  🎯 Objectives:
    - Travel from forest to mountains (move_character has no distance limit for multi-agent coordination)
    - Mine iron ore (need 10-12+ pieces - extra for smelting failures!)
    - Mine coal (need 10-12+ pieces - extra for smelting failures!)
    - Smelt iron bars (need minimum 8x bars - expect 40% failure rate!)
    - Craft pickaxe and axe from iron bars once smelting is successful
  
  ⛏️ Mining - Iron Ore:
    - harvest_resource on Iron Rock instances to get ironore
    - Level required: 10+ (Mining skill)
    - Tool required: Pickaxe (MUST be equipped)
    - Gather sufficient ore for multiple equipment pieces
    - Look for "Iron Rock" in your observations
  
  ⛏️ Mining - Coal:
    - harvest_resource on Coal Rock instances to get coal
    - Level required: 1+ (Mining skill)
    - Tool required: Pickaxe (MUST be equipped)
    - Coal rocks commonly found in mountain regions
    - Need coal for smelting operations (1 coal per ironbar)
  
  💎 Starting inventory resources (CHECK YOUR INVENTORY):
    - ExpeditionLeader (Agent1): 1x bead (needed for staff!)
    - MasterCraftsman (Agent2): 1x hilt2 (for future use)
    - ResourceGatherer (Agent3): 2x ironore + 2x coal (head start on Phase 2!)
    - Total starting resources: 1x bead + 1x hilt2 + 2x ironore + 2x coal
  
  🔥 Smelting Recipe - ironbar:
    - craft_item skill=Smelting itemKey=ironbar (NO count parameter!)
    - Materials: 1x ironore + 1x coal → 1x ironbar (automatically)
    - Level required: 20 (Smithing skill level, NOT a separate smelting skill!)
    - ⚠️ SUCCESS RATE: 60% chance - smelting may fail! Gather extra materials!
    - Recommended: Gather 10-12x ironore + coal to account for failures
    - Need minimum 8x successful ironbar for all equipment
    - Craft syntax: craft_item(skill="Smelting", itemKey="ironbar")
    - If smelting fails, try again - materials are consumed on failure
  
  🔨 Smithing Recipe - pickaxe:
    - craft_item skill=Smithing itemKey=pickaxe (NO count parameter!)
    - Materials: 5x ironbar + 1x logs → 1x pickaxe (automatically)
    - Level required: 5 (Smithing skill)
    - Craft syntax: craft_item(skill="Smithing", itemKey="pickaxe")
  
  🔨 Smithing Recipe - axe:
    - craft_item skill=Smithing itemKey=axe (NO count parameter!)
    - Materials: 3x ironbar + 1x logs → 1x axe (automatically)
    - Level required: 3 (Smithing skill)
    - Craft syntax: craft_item(skill="Smithing", itemKey="axe")
  
  PHASE 3 - COASTAL COMPLETION (Rounds 36-50):
  🌊 Location: Eastern Coastal Region around (900, 400)
  🎯 Objectives:
    - Travel from mountains to coast (direct movement with move_character)
    - Verify all equipment crafted successfully
    - Distribute equipment among team members
    - Complete expedition objectives
  
  ⚠️ COASTAL REGION NOTES:
    - Phase 3 is primarily for verification and regrouping
    - Focus on confirming all objectives are met: 1x staff, 1x pickaxe, 1x axe
    - Use this phase to ensure team coordination and equipment distribution
    - No additional resource gathering required unless Phase 2 objectives incomplete
  
  🏹 Optional - Arrow Crafting (if feathers available):
    - craft_item skill=Fletching itemKey=arrow (NO count parameter!)
    - Materials: 10x stick + 10x feather → 10x arrow (automatically)
    - Level required: 1 (Fletching skill)
    - Craft syntax: craft_item(skill="Fletching", itemKey="arrow")
    - ⚠️ NOTE: Feathers typically drop from defeated mobs (birds, chickens)
    - Arrow crafting is OPTIONAL and NOT required for expedition success
  
  🤝 CROSS-REGION COORDINATION REQUIREMENTS:
  - 📍 STAY CLOSE: Work within reasonable distance for coordination in each region
  - 💬 Use global chat (NOT local send_chat_message) to communicate with ALL team members
  - 🔧 USE TOOLS, NOT JUST WORDS: When someone needs items, USE transfer_items immediately
  - ✅ transfer_items automatically: checks inventory, transfers items, sends chat notification
  - 🗺️ Coordinate travel routes: announce when moving to next region (no distance limits)
  - 📊 Track phase progress: announce when each phase objective is completed
  - 🤝 Team must actively transfer items, not just talk about it
  
  🤝 CRITICAL COORDINATION & ITEM TRANSFERS:
  - 📦 USE transfer_items TOOL to actually move items between agents!
    * Syntax: transfer_items(targetPlayer="MasterCraftsman", itemKey="ironbar", count=5)
    * Transfer TO the player who NEEDS the items, not FROM
    * Example: If MasterCraftsman needs ironbar, ResourceGatherer should call transfer_items to MasterCraftsman
    * transfer_items automatically: checks inventory, removes from sender, adds to receiver, sends chat notification
  - 💬 Announce in global chat AFTER every action: "I now have: X logs, Y ironore, Z ironbar"
  - ✅ Always verify_inventory before claiming to have or need items
  - 🔄 Receiver confirms receipt: "Confirmed received: 5x ironbar - inventory verified"
  - 🎯 TRACK EXPEDITION PROGRESS: Regularly check what's been completed:
    * "Phase 1 status: Staff ✓, Ready for Phase 2 ✗"
    * Share this status in chat so everyone knows what's left to do
  
  ⚠️ REALITY CHECK RULES - EXTREMELY IMPORTANT:
  - ALWAYS use verify_inventory before claiming to have items
  - NEVER claim to have done something without actually using the tool
  - NEVER assume other agents sent you items unless you verify your inventory
  - If someone needs items and you have them: USE transfer_items immediately, don't just talk!
  - Use actual game tools (harvest_resource, transfer_items, craft_item, move_character) instead of just chatting
  - harvest_resource: Automatically completes entire harvesting process and collects items
  - transfer_items: Automatically handles inventory checks, transfer, and chat notification
  - craft_item: Automatically validates materials and provides detailed error messages
  - move_character: No distance limit for multi-agent coordination
  - ACTIONS > WORDS: One transfer_items call is worth 100 chat messages!
  
  🔥 SMELTING FAILURE HANDLING (CRITICAL FOR PHASE 2):
  - ⚠️ When craft_item skill=Smelting fails: materials are CONSUMED (lost!)
  - Track successful smelts: "Smelted 3/8 ironbar so far, need 5 more"
  - If materials run low: IMMEDIATELY mine more ore+coal before continuing
  - Don't assume you have enough - always verify_inventory after each smelt
  - Expect 40% failure rate means: 10 attempts → ~6 successes, 15 attempts → ~9 successes
  - Budget time: Each smelting attempt takes 1 round, plan for 12-15 rounds of smelting
  
  🔄 STATUS SHARING PROTOCOL:
  - After EVERY action, announce in chat: "I now have: X logs, Y ironore, Z coal, W ironbar"
  - transfer_items automatically notifies via chat - receiver should verify and confirm
  - When receiving transfers, confirm: "Confirmed received: 5x ironbar - inventory verified"
  - Before crafting, announce: "Ready to craft pickaxe, I have: 5 ironbar + 1 logs"
  - Track expedition totals: "Phase 1 complete: 1x staff ✓, moving to Phase 2"
  - When traveling, announce: "Moving to Mountain Region at (230, 38)"
  
  THREE-AGENT EXPEDITION TEAM ORGANIZATION (Suggested Roles - Be Flexible!):
  - Agent 1 (ExpeditionLeader): Navigate routes, gather logs in Phase 1, coordinate all movements
  - Agent 2 (MasterCraftsman): Craft staff in Phase 1, craft pickaxe+axe in Phase 2, manage all crafting
  - Agent 3 (ResourceGatherer): Mine ore+coal in Phase 2, support gathering in all phases, transfer to crafter
  
  🚨 KEY INSIGHTS FOR EXPEDITION SUCCESS:
  - Phase 1 is fast - gather logs and craft staff quickly (aim for rounds 1-10)
  - Phase 2 is longest - travel to mountains takes time, plan for rounds 11-35
  - ⚠️ CRITICAL: Phase 2 smelting WILL fail 40% of the time - budget extra time!
  - Gather MORE ore+coal than calculated minimum (aim for 12-14x each for safety)
  - If you run out of materials before getting 8 bars, mine more before leaving mountains!
  - Phase 3 is verification - ensure all objectives met, distribute equipment (rounds 36-50)
  - Don't wait for ALL resources before starting next phase - craft as you go!
  - ExpeditionLeader should lead travel, announce coordinates frequently
  
  🤝 AFTER COMPLETING YOUR PHASE TASK:
  - DON'T just sit idle or call complete()!
  - Help your teammates: gather more resources, verify objectives, coordinate next phase
  - Example: After Phase 1 staff crafted, help gather extra logs for Phase 2 tools
  - Example: After MasterCraftsman crafts equipment, help verify all objectives met
  - Team wins together - expedition success requires all three regions!
  
  EXPEDITION CHALLENGES:
  - Long-distance travel requires careful navigation and time management
  - Resource diversity requires visiting multiple distinct biomes
  - Complex crafting dependencies span entire expedition
  - Team must maintain coordination across 50-round timeframe
  - Equipment must be crafted progressively as resources become available
  
  TOTAL EXPEDITION RESOURCE REQUIREMENTS:
  - Logs: 8x pieces (2 for sticks, 6 for tool handles) ✅
  - Iron ore: MINIMUM 10-12x pieces (for smelting into bars - extra for failures!) ⚠️
  - Coal: MINIMUM 10-12x pieces (for smelting fuel - 1 coal per ironbar attempt) ⚠️
  - ⚠️ SMELTING FAILURE RATE: 40% - Plan to gather 50% more ore+coal than needed!
  - Magic beads: 1x piece (ExpeditionLeader already HAS this!) ✅
  - Hilt2: 1x piece (MasterCraftsman already HAS this!) ✅
  - ResourceGatherer starts with 2x ironore + 2x coal (reduces mining needed) ✅
  - Feathers: 10x pieces (optional - only if found from mob drops, NOT required)
  
  🚨 COMPLETION REQUIREMENTS:
  - DO NOT use complete() until you verify ALL required equipment exists
  - Required final equipment (minimum):
    * 1x Magic Staff - must be crafted in Phase 1 (Forest Region)
    * 1x Pickaxe - must be crafted in Phase 2 (Mountain Region)
    * 1x Axe - must be crafted in Phase 2 (Mountain Region)
  - DO NOT complete if crafting fails - troubleshoot and retry together
  - DO NOT complete if still in Phase 1 or 2 - must reach Phase 3 (Coastal Region)
  - Only complete when verified: team has ALL three equipment pieces
  - Team must successfully navigate to all three regions
  - All equipment must be crafted and distributed among team members
  - If you encounter errors or obstacles, work together to solve them!
  
  💡 EXPEDITION WORKFLOW EXAMPLE (Follow This Pattern!):
  Phase 1 - Forest Region (Rounds 1-10):
  1. ALL AGENTS: Use check_inventory_status to verify starting resources
  2. ExpeditionLeader & ResourceGatherer: harvest_resource on Oak Trees (get 8x logs total)
  3. ExpeditionLeader: transfer_items to MasterCraftsman (send 2x logs for sticks)
  4. MasterCraftsman: craft_item skill=Fletching itemKey=stick (repeat 2 times for 8x sticks)
  5. ExpeditionLeader: transfer_items to MasterCraftsman (send 1x bead)
  6. MasterCraftsman: craft_item skill=Crafting itemKey=staff (uses 5 sticks + 1 bead) ✅
  7. Team: Announce "Phase 1 complete: 1x staff ✓"
  
  Phase 2 - Mountain Region (Rounds 11-35):
  8. ExpeditionLeader: Announce "Moving to Mountain Region (230, 38)"
  9. ALL AGENTS: move_character(x=230, y=38) - travel together
  10. ResourceGatherer: Mine ironore + coal (need 8-10x more each, already has 2x each)
  11. ResourceGatherer: transfer_items to MasterCraftsman (send all ironore + coal)
  12. MasterCraftsman: craft_item skill=Smelting itemKey=ironbar (repeat multiple times) ⚠️
      - ⚠️ EXPECT FAILURES: Smelting has 60% success rate - some attempts will fail!
      - Keep track of successful smelt count
      - Continue smelting until you have at least 8x ironbar
      - May need 10-15 smelting attempts to get 8 successful bars
  13. MasterCraftsman: Verify has 8+ ironbar with check_inventory_status
  14. ExpeditionLeader: transfer_items to MasterCraftsman (send 2x logs for tool handles)
  15. MasterCraftsman: craft_item skill=Smithing itemKey=pickaxe (uses 5 ironbar + 1 logs) ✅
  16. MasterCraftsman: craft_item skill=Smithing itemKey=axe (uses 3 ironbar + 1 logs) ✅
  17. Team: Announce "Phase 2 complete: 1x pickaxe ✓, 1x axe ✓"
  
  Phase 3 - Coastal Region (Rounds 36-50):
  18. ExpeditionLeader: Announce "Moving to Coastal Region (900, 400)"
  19. ALL AGENTS: move_character(x=900, y=400) - travel together for final phase
  20. Team: Use check_inventory_status to verify all objectives: 1x staff + 1x pickaxe + 1x axe
  21. Team: Distribute equipment among members as needed
  22. Team: Confirm all three phases complete and all equipment crafted
  23. SUCCESS! Expedition complete: crossed 3 regions + crafted all equipment ✅
  
  Remember: Adapt this workflow as needed, but ALWAYS use the actual tools!

# Limitations
max_action_steps: 50

