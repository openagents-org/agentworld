# AgentWorld Multi-Agent Task Configuration

task:
  name: "Infinity Nexus Convergence - Omniversal Connection and Infinite Possibility Mastery"
  description: "Three agents work together to reach the Infinity Nexus, master omniversal connections, and unlock infinite possibilities"

# Task objectives
objectives:
  primary: "Successfully reach the Infinity Nexus, master omniversal connections, and unlock infinite possibilities across all realities"
  secondary: # checkpoints
    - "Establish Infinity Nexus approach coordination and omniversal preparation"
    - "Execute coordinated Nexus Guardian combat and infinite possibility manipulation"
    - "Complete Infinity Nexus convergence within 43 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is the ultimate cooperative omniversal mastery scenario requiring transcendence of all limitations and perfect unity.
  
  OBJECTIVE: Reach the Infinity Nexus, master omniversal connections, and unlock infinite possibilities.
  
  MISSION REQUIREMENTS:
  - Navigate to Infinity Nexus Core (Region 12-11: coordinates 1800-1850, 1400-1450)
  - Transcend dimensional limitations and access the omniversal connection point
  - Defeat Nexus Guardians (Level 82) that test worthiness for infinite power
  - Master omniversal connections and unlock infinite possibilities for all existence
  
  TEAM COORDINATION:
  - Use global chat for complex omniversal coordination and transcendence timing
  - Coordinate between dimensional transcendence, guardian trials, and infinity mastery
  - Share transcendent energies and provide maximum support for omniversal connection
  - Work together to handle infinite-scale operations with omniversal consequences
  
  GENERAL STRATEGY:
  - This requires transcendent mastery of all magical and existential systems
  - Nexus Guardians (Level 82) represent ultimate tests of worthiness and unity
  - Infinity Nexus operations affect all possible realities and infinite timelines
  - Omniversal mastery requires perfect team unity and transcendent understanding
  - Balance infinite ambition with omniversal responsibility and universal harmony
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  INFINITY NEXUS MASTERY (CRITICAL KNOWLEDGE):
  ♾️ Omniversal Access:
    - Use transcend_limits action to access omniversal connection layers
    - Requires transcendent magic (60+) and perfect team synchronization
    - Access requires demonstration of unity, wisdom, and beneficial intent
    - Coordinate transcendence sequence to avoid infinite regression loops
  
  🔮 Combat - Nexus Guardians:
    - Use observe_environment to locate Nexus Guardians at approach (1825,1415) and core (1835,1430)
    - Level 82 transcendent entities with infinite power testing abilities
    - Expect reality transcendence tests, unity challenges, and wisdom trials
    - Use perfect coordination and transcendent unity for success
    - Combat is more about proving worthiness than defeating guardians
  
  🌟 Infinite Possibility Unlocking:
    - Use unlock_infinity action at Infinity Nexus heart coordinates (1830,1425)
    - Requires infinite crystals, transcendent essence, and perfect team unity
    - Unlocks access to all possible realities and infinite potential
    - Coordinate infinity manipulation to benefit all existence across all realities
  
  🔗 Omniversal Connection Mastery:
    - Connect with all possible versions of AgentWorld across infinite timelines
    - Share beneficial improvements and harmony across all reality variations
    - Coordinate omniversal communication and cross-reality cooperation
    - Establish infinite network of positive influence across all existence
  
  ✨ Transcendent Unity Achievement:
    - Achieve perfect team unity that transcends individual limitations
    - Demonstrate wisdom worthy of infinite power and omniversal influence
    - Use infinite possibilities responsibly to enhance all existence
    - Coordinate transcendent actions that benefit infinite realities simultaneously

# Limitations
