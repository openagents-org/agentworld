# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cooperative Pickaxe Crafting - Mining Tool Production"
  description: "Three agents work together to create a pickaxe through extensive mining, smelting, and tool smithing"

# Task objectives
objectives:
  primary: "Forge a high-quality pickaxe through coordinated metallurgy and tool crafting"
  secondary: # checkpoints
    - "Execute large-scale iron extraction operations"
    - "Coordinate intensive smelting for multiple iron bars"
    - "Complete advanced tool smithing within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent tool crafting scenario requiring extensive metallurgy operations.
  
  CRITICAL SUCCESS REQUIREMENTS:
  1. miner_agent MUST extract large quantities of iron ore and coal
  2. miner_agent MUST also gather logs for tool handle
  3. smelter_agent MUST produce 5x iron bars from materials
  4. tool_smith_agent MUST forge pickaxe from 5x iron bars + 1x logs
  5. tool_smith_agent MUST equip the pickaxe and declare completion
  
  LOCATION STRATEGY:
  - Large-scale mining operations for iron and coal
  - Forest area for tool handle logs
  - High-capacity smelting for multiple iron bars
  - Advanced smithing facility for tool assembly
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  ⛏️ Mining - materials:
    - harvest_resource on iron rock instances to get ironore (level 10+)
    - harvest_resource on coal deposits to get coal (level 1+)
    - harvest_resource on oak trees to get logs (level 1+)
  
  🔥 Smelting Recipe - ironbar:
    - craft_item skill=Smelting itemKey=ironbar
    - Materials: 1x ironore + 1x coal → 1x ironbar
    - Level required: 20 (uses Smithing skill level)
  
  ⛏️ Smithing Recipe - pickaxe:
    - craft_item skill=Smithing itemKey=pickaxe
    - Materials: 5x ironbar + 1x logs → 1x pickaxe
    - Level required: 5 (Smithing skill)

# Limitations
max_action_steps: 25

# Agent configurations
agent_1:
  username: "miner_agent"
  new_character: true
  role: "Mass Resource Extractor"
  
  location:
    x: 229
    y: 37
  
  skill_levels:
    mining: 30
    lumberjacking: 20
    strength: 35
    health: 30
  
  inventory_items:
    - item: "flask"
      count: 15
    - item: "apple"
      count: 20
  
  equipped_items:
    - item: "pickaxe"
      count: 1
      enchant: 0
    - item: "axe"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Mass resource extractor for large-scale material gathering
    
    ⛏️ CRITICAL MASS EXTRACTION MISSION - GATHER MASSIVE MATERIALS!
    
    ABSOLUTE PRIORITIES:
    1. Extract large quantities of iron ore (5+ units)
    2. Extract sufficient coal for smelting (5+ units)
    3. Gather logs for tool handle (1+ units)
    4. Transfer all materials to smelter_agent
    
    MASS EXTRACTION STRATEGY:
    1. observe_environment to find iron rocks, coal deposits, and oak trees
    2. PRIORITY: IRON ROCKS first (highest requirement)
    3. Mine iron ore extensively: harvest_resource on multiple iron rock instances
    4. Mine coal deposits: harvest_resource on coal instances
    5. Cut oak trees: harvest_resource on oak tree instances
    6. TARGET MATERIALS: 5x ironore + 5x coal + 1x logs
    7. Move systematically through mining areas:
       - move_character(x=150, y=450) for iron-rich area
       - move_character(x=250, y=350) for coal deposits
       - move_character(x=300, y=500) for additional mining
       - move_character(x=126, y=23) for oak trees
    8. Check inventory frequently during extraction
    9. Use global chat every 3-4 actions to report progress
    10. Once sufficient materials collected, coordinate with smelter_agent
    11. Move to central meetup location
    12. transfer_items to give all materials to smelter_agent
    13. Support team until pickaxe completion
    
    MATERIAL REQUIREMENTS:
    - 5x ironore (for 5x ironbar)
    - 5x coal (smelting fuel)
    - 1x logs (tool handle)
    
    ERROR PREVENTION:
    - Verify tools equipped for each resource type
    - Check inventory capacity during mass extraction
    - REMEMBER: Pickaxe needs 5 iron bars - lots of mining!

agent_2:
  username: "smelter_agent"
  new_character: true
  role: "Industrial Smelter"
  
  location:
    x: 233
    y: 175
  
  skill_levels:
    smithing: 30      # For extensive smelting operations
    mining: 15        # Backup mining capability
    strength: 25
    health: 25
  
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Industrial smelter responsible for mass iron bar production
    
    🔥 CRITICAL INDUSTRIAL SMELTING - PRODUCE 5 IRON BARS!
    
    ABSOLUTE PRIORITIES:
    1. Receive large material shipment from miner_agent
    2. Execute 5 smelting operations for iron bars
    3. Quality control each smelting batch
    4. Transfer iron bars and logs to tool_smith_agent
    
    INDUSTRIAL SMELTING STRATEGY:
    1. send global chat message announcing smelting facility readiness
    2. Coordinate with miner_agent for mass material transfer
    3. observe_environment to verify materials received (5x ironore + 5x coal + 1x logs)
    4. Execute industrial smelting operations:
       📋 SMELTING 1: craft_item skill=Smelting itemKey=ironbar (1x ironore + 1x coal → 1x ironbar)
       📋 SMELTING 2: craft_item skill=Smelting itemKey=ironbar (1x ironore + 1x coal → 1x ironbar)
       📋 SMELTING 3: craft_item skill=Smelting itemKey=ironbar (1x ironore + 1x coal → 1x ironbar)
       📋 SMELTING 4: craft_item skill=Smelting itemKey=ironbar (1x ironore + 1x coal → 1x ironbar)
       📋 SMELTING 5: craft_item skill=Smelting itemKey=ironbar (1x ironore + 1x coal → 1x ironbar)
    5. observe_environment after each smelting to verify success
    6. FINAL OUTPUT: 5x ironbar + 1x logs
    7. Use global chat to report industrial smelting completion
    8. Coordinate with tool_smith_agent for material transfer
    9. Move to tool smithing location
    10. transfer_items to give all materials to tool_smith_agent
    11. Wait for confirmation and support until pickaxe completion
    
    SMELTING REQUIREMENTS:
    - Smithing skill level 20+ for iron smelting (you have 30)
    - 5x ironore + 5x coal → 5x ironbar
    - Maintain quality control throughout process
    
    ERROR PREVENTION:
    - Verify each smelting operation individually
    - Check inventory after each step
    - Ensure all 5 iron bars produced before transfer

agent_3:
  username: "tool_smith_agent"
  new_character: true
  role: "Master Tool Smith"
  
  location:
    x: 228
    y: 188
  
  skill_levels:
    smithing: 30      # Required for pickaxe crafting (level 5+)
    mining: 20        # Tool usage knowledge
    strength: 30
    health: 25
  
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Master tool smith responsible for pickaxe assembly
    
    ⛏️ PRIORITY ACTIONS:
    1. Coordinate with smelter_agent to receive iron bars and handle
    2. Forge advanced mining pickaxe from components
    3. Quality testing and tool calibration
    4. Equip the pickaxe and declare completion
    
    TOOL SMITHING COORDINATION:
    1. send global chat message announcing tool smithing facility readiness
    2. Wait for smelter_agent to report industrial smelting completion
    3. Coordinate meetup for massive material transfer
    4. Move to agreed location to receive materials
    5. observe_environment to verify materials received
    
    CRITICAL TOOL FORGING STEPS:
    6. BEFORE crafting, use observe_environment to CHECK YOUR INVENTORY
    7. VERIFY you have 5x ironbar AND 1x logs
    8. ONLY AFTER verifying materials, use craft_item:
       📋 RECIPE: craft_item skill=Smithing itemKey=pickaxe (5x ironbar + 1x logs → 1x pickaxe)
    9. WAIT for craft_item result - confirm "Successfully crafted" message
    10. observe_environment to verify pickaxe in inventory
    11. equip_item to equip the pickaxe
    12. observe_environment to verify pickaxe is equipped
    13. Use global chat to declare "Advanced pickaxe forged and equipped successfully!"
    14. complete() ONLY after successful tool creation and equipping
    
    MATERIAL REQUIREMENTS:
    ✅ 5x ironbar (from smelter_agent) - LARGE QUANTITY
    ✅ 1x logs (from smelter_agent)
    ✅ Smithing skill level 5+ (you have level 30)
    
    ERROR PREVENTION:
    - Verify all material transfers completed
    - Check inventory carefully before crafting
    - Confirm tool equipping after assembly
    - This is an ADVANCED tool requiring significant materials

# Success criteria for multi-agent task
success_criteria:
  - "miner_agent successfully extracts large quantities of materials"
  - "smelter_agent successfully produces 5 iron bars and transfers materials"
  - "tool_smith_agent receives materials and forges pickaxe"
  - "tool_smith_agent successfully equips the advanced pickaxe"
  - "All agents coordinate large-scale industrial operations"
  - "Advanced tool production completes within time limit"
