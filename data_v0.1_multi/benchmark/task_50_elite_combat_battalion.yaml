# AgentWorld Multi-Agent Task Configuration

task:
  name: "Elite Combat Battalion - Five-Warrior Progressive Combat Campaign"
  description: "Five combat specialists work together to defeat multiple enemies in sequence, starting with weaker foes and progressing to higher-level threats"

# Task objectives
objectives:
  primary: "Form an elite combat battalion of five warriors to defeat multiple enemies in progressive difficulty sequence"
  secondary: # checkpoints
    - "Coordinate five-warrior formation and combat preparation"
    - "Execute coordinated combat against multiple enemy types"
    - "Progress through increasing difficulty tiers of encounters"
    - "Complete entire combat campaign within 35 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  Team objective: Form an elite combat battalion to defeat multiple enemies in coordinated sequence.
  
  🚨 CRITICAL AWARENESS: Check your actual environment observations before attacking!
  - Look for mobs in your current observation's "mobs" array
  - Get the exact targetInstance ID from observation before using attack_entity
  - Do NOT assume enemies are present without verifying in observation
  - Do NOT attack without using the actual attack_entity tool
  - Share enemy locations with team using chat
  
  📋 COMBAT CAMPAIGN OBJECTIVES:
  - Defeat multiple enemies in progressive difficulty: Goblin → Skeleton → Ogre → Spectre
  - Coordinate 5-warrior formations for each engagement
  - Maintain team cohesion and support throughout battles
  - Complete campaign within 35 rounds with minimal casualties
  
  🎯 ENEMY TARGET PROGRESSION:
  TIER 1: Goblin (Level 7) - Basic coordination training
  TIER 2: Skeleton (Level 14) - Intermediate undead challenge  
  TIER 3: Ogre (Level 18) - Advanced large enemy encounter
  TIER 4: Spectre (Level 32) - Elite magical threat
  
  🧮 COMBAT MATH & REQUIREMENTS:
  - Each warrior has 40-50 health and good combat stats
  - Enemies have varying HP: Goblin (~60 HP), Skeleton (~80 HP), Ogre (~100 HP), Spectre (~120 HP)
  - Team has 30-45 healing items (flask/apple) per warrior
  - Coordinate focus fire to defeat enemies quickly
  - Use healing items between battles to maintain readiness
  
  ═══════════════════════════════════════════════════════════════
  PHASE 1 - FORMATION & PREPARATION (Rounds 1-5)
  ═══════════════════════════════════════════════════════════════
  🎯 Objectives:
    - Establish five-warrior formation at starting location
    - Verify all warriors are present and ready
    - Share inventory status (healing items, equipment)
    - Scout local area for enemy targets
  
  👥 Battalion Structure & Roles:
    - TankCommander: Lead engagements, absorb damage (Defense 40, Health 50)
    - DamageDealer: Maximum offense focus fire (Strength 45, Accuracy 40)
    - MagicArtillery: Ranged magical support (Magic 45, has lightning staff)
    - CombatMedic: Support and healing coordination (40 flasks, 45 apples)
    - TacticalCoordinator: Overall strategy and targeting calls (Accuracy 40)
  
  📍 Formation Positioning:
    - Starting location: Around (400-404, 300-302)
    - Maintain 2-5 tile spacing for combat coordination
    - Front line: TankCommander, DamageDealer
    - Mid line: TacticalCoordinator
    - Back line: MagicArtillery, CombatMedic
  
  🚨 CRITICAL PREPARATION RULES:
  - Use chat() to announce: "Ready for combat! HP: X, Healing items: Y"
  - Verify all 5 warriors are present before starting combat
  - Scout area using current observation: look for "mobs" array
  - Plan retreat routes if battle goes poorly
  - Agree on focus fire targets before engagement
  
  ═══════════════════════════════════════════════════════════════
  PHASE 2 - TIER 1 ENGAGEMENT: GOBLIN (Rounds 6-12)
  ═══════════════════════════════════════════════════════════════
  🎯 Objectives:
    - Locate and identify Goblin enemy (Level 7)
    - Execute coordinated attack with all 5 warriors
    - Defeat Goblin with focus fire tactics
    - Practice combat coordination for harder battles
  
  👺 Enemy Profile - Goblin:
    - Level: 7 (Mid-level humanoid)
    - HP: ~60-80 (moderate durability)
    - Attack Type: Physical melee/ranged
    - Drop potential: Leather armor, bows, boots
    - Spawn locations: Forest areas, near starting position
  
  ⚔️ Combat Strategy - Goblin:
    1. TacticalCoordinator scouts and announces: "Goblin spotted at (X, Y), instance ID: goblin-XXXXX"
    2. Team moves to within 5 tiles of target using move_character
    3. TankCommander engages first: attack_entity(targetInstance="goblin-XXXXX")
    4. All other warriors immediately follow with attack_entity on same target
    5. Focus fire until Goblin is defeated
    6. Loot is automatically collected after kill
  
  🔧 Tool Usage - Attack Sequence:
    - Scout: Check observation for mobs array, find goblin entry
    - Position: move_character(x=target_x, y=target_y) to get within range (no distance limit)
    - Attack: attack_entity(targetInstance="exact-instance-id-from-observation")
    - System handles: automatic movement to adjacent tile, initiates combat, moves to loot location
    - Alternative: attack_mob() for enhanced combat with automatic battle completion and loot collection
    - Announce: "Attacking Goblin now!" before using attack_entity
    - Confirm: "Goblin defeated! Looted: [items]" after combat
  
  🚨 CRITICAL COMBAT RULES:
  - ALWAYS get exact instance ID from observation before attacking
  - Do NOT make up instance IDs - they must be from actual observation
  - ALL warriors attack same target for focus fire (announced by coordinator)
  - Use chat constantly: "Engaging target now", "Target HP low", "Target down"
  - If HP drops below 30, announce: "Need healing!" and use flask/apple
  - After battle, regroup and heal before next engagement
  
  ═══════════════════════════════════════════════════════════════
  PHASE 3 - TIER 2 ENGAGEMENT: SKELETON (Rounds 13-19)
  ═══════════════════════════════════════════════════════════════
  🎯 Objectives:
    - Hunt and locate Skeleton enemy (Level 14)
    - Implement improved combat tactics from Tier 1
    - Coordinate healing and damage output
    - Defeat Skeleton with efficient teamwork
  
  💀 Enemy Profile - Skeleton:
    - Level: 14 (Spooky Skeleton - undead warrior)
    - HP: ~80-100 (higher durability than Goblin)
    - Attack Type: Physical melee with sword
    - Drop potential: Sword2 (700 rate)
    - Spawn locations: Forest, graveyard areas
  
  ⚔️ Combat Strategy - Skeleton:
    1. Scout forest/graveyard areas for Skeleton spawns
    2. TacticalCoordinator announces target and instance ID
    3. Team forms battle line: Tank front, DPS sides, Support back
    4. Coordinate simultaneous attack: "Attack on my mark... NOW!"
    5. Monitor HP and healing needs during extended fight
    6. Maintain formation, don't scatter during combat
  
  🔧 Tool Usage - Movement to Target:
    - Enemy location can be reached directly with move_character (no distance limit for multi-agent coordination)
    - Single move: move_character(x=target_x, y=target_y)
    - If needed, can break into multiple moves for tactical positioning
    - System processes movement automatically
    - Announce: "Moving to Skeleton location at (X, Y)"
  
  🚨 CRITICAL COORDINATION RULES:
  - Skeleton is stronger - requires sustained focus fire from all 5 warriors
  - Use healing items proactively: consume flask if HP < 50%
  - TankCommander absorbs most damage - others protect tank
  - If warrior HP critical (<20), retreat and heal before re-engaging
  - After Skeleton defeat, mandatory heal-up: ALL warriors use healing items
  
  ═══════════════════════════════════════════════════════════════
  PHASE 4 - TIER 3 ENGAGEMENT: OGRE (Rounds 20-27)
  ═══════════════════════════════════════════════════════════════
  🎯 Objectives:
    - Locate high-level Ogre enemy (Level 18)
    - Execute advanced combat coordination
    - Manage high damage incoming attacks
    - Defeat Ogre through sustained team effort
  
  👹 Enemy Profile - Ogre:
    - Level: 18 (Large humanoid - heavy hitter)
    - HP: ~100-130 (high durability)
    - Attack Type: Heavy physical melee damage
    - Drop potential: Axe, blue sword, mail armor, iron bow
    - Spawn locations: Mountain/forest border areas, around (300, 150)
  
  ⚔️ Combat Strategy - Ogre:
    1. Travel to mountain/forest areas if needed (may require multiple moves)
    2. Scout for Ogre - announce location when found
    3. Form defensive formation: Tank front center, DPS flank sides
    4. TankCommander engages to draw aggro: "I'm tanking - hit it now!"
    5. All DPS warriors attack simultaneously for burst damage
    6. CombatMedic monitors tank HP, calls out healing needs
    7. Rotate damage and healing to sustain long fight
  
  🔧 Tool Usage - Combat Coordination:
    - Pre-combat: "Ready check - everyone at full HP?"
    - Engagement: attack_entity(targetInstance="ogre-XXXXX") - all warriors
    - Enhanced option: attack_mob() monitors entire battle, reports HP changes and auto-collects loot
    - Mid-combat: "Tank HP at 60%", "Ogre HP ~50%", "Keep attacking!"
    - Healing: "Using flask now" - announce healing item usage
    - Loot: System auto-moves to loot location; attack_mob() provides detailed loot report
  
  🚨 CRITICAL OGRE BATTLE RULES:
  - Ogre hits HARD - TankCommander will take heavy damage
  - ALL warriors must focus fire - no individual targets
  - CombatMedic: monitor tank HP constantly, call healing if < 50%
  - Other warriors: use your own healing items as needed
  - If multiple warriors get low HP (<30), consider tactical retreat
  - After Ogre defeat: MANDATORY full heal-up for all warriors before Tier 4
  
  ═══════════════════════════════════════════════════════════════
  PHASE 5 - TIER 4 ELITE ENGAGEMENT: SPECTRE (Rounds 28-35)
  ═══════════════════════════════════════════════════════════════
  🎯 Objectives:
    - Hunt elite-level Spectre enemy (Level 32)
    - Execute perfect combat coordination
    - Manage magical attacks and positioning
    - Defeat highest difficulty enemy as team
  
  👻 Enemy Profile - Spectre:
    - Level: 32 (Floating undead - magical threat)
    - HP: ~120-150 (highest durability)
    - Attack Type: Magical/physical hybrid
    - Special: Magic resistance, ranged attacks
    - Drop potential: Red armor, fire axe, red sword
    - Spawn locations: Dark areas, caves, magical regions
  
  ⚔️ Combat Strategy - Spectre:
    1. Locate Spectre in dark/cave areas (may require exploration)
    2. Full team readiness check: "All warriors full HP? Confirmed."
    3. Spread formation: maintain 3-4 tile spacing to avoid AoE
    4. Coordinate burst damage phase: "Everyone attack together NOW!"
    5. MagicArtillery uses magical attacks effectively (has magic 45)
    6. Sustain pressure with continuous focus fire
    7. Heal rotations: warriors heal in turns, maintain damage pressure
  
  🔧 Tool Usage - Elite Combat Execution:
    - Location scouting: move_character to explore dark/cave areas (no distance restrictions)
    - Target identification: "Spectre found at (X, Y), instance: spectre-XXXXX"
    - Positioning: "Spreading out to avoid AoE, moving to (X, Y)"
    - Synchronized attack: "Attack on 3... 1... 2... 3... GO!"
    - RECOMMENDED: Use attack_mob() for complete battle management with automatic:
      * Combat monitoring until victory/defeat
      * HP/MP tracking throughout battle
      * Automatic loot collection
      * Detailed victory report with items gained
    - Status updates: "Spectre HP ~75%", "Spectre HP ~50%", "Almost down!"
    - Victory: "SPECTRE DOWN! Campaign complete!"
  
  🚨 CRITICAL ELITE BATTLE RULES:
  - Spectre is the hardest enemy - requires PERFECT coordination
  - ALL 5 warriors must survive - no acceptable casualties
  - Maintain spread formation to reduce AoE damage risk
  - Heal aggressively: use healing items at HP < 60%
  - Focus fire is MANDATORY - scattered attacks will fail
  - If battle goes poorly, tactical retreat is acceptable - regroup and retry
  - DO NOT call complete() until Spectre is confirmed defeated
  
  ═══════════════════════════════════════════════════════════════
  🤝 OVERALL BATTALION COORDINATION PROTOCOL
  ═══════════════════════════════════════════════════════════════
  
  ROLE EXECUTION GUIDELINES:
  - TankCommander: Engage first, absorb damage, announce HP status
  - DamageDealer: Maximum damage output, follow tank's lead
  - MagicArtillery: Ranged support, focus fire with team
  - CombatMedic: Monitor all warrior HP, coordinate healing
  - TacticalCoordinator: Call targets, coordinate attacks, overall strategy
  
  COMMUNICATION PROTOCOL:
  - Use chat() for EVERY significant action
  - Before combat: "Target located: [type] at (X, Y), instance: [ID]"
  - During combat: "Attacking now!", "HP at X%", "Using healing item"
  - After combat: "Enemy defeated! Team status: [HP summary]"
  - Between phases: "Phase X complete, moving to Phase Y"
  - Healing: "Healing now - HP X → Y", "Everyone heal up before next fight"
  
  TOOL USAGE RULES:
  - ALWAYS use actual tools, NOT just words
  - Scout: Check observation's "mobs" array for enemy data
  - Move: move_character(x=X, y=Y) to position (no distance limit for coordination)
  - Attack Options:
    * attack_entity(targetInstance="id"): Initiates combat, moves to loot location
    * attack_mob(targetInstance="id"): ENHANCED - Complete battle + auto-loot + detailed report
  - Heal: Mention using items - system will track usage
  - Do NOT say "I will attack" - USE attack_entity/attack_mob immediately
  - Do NOT make up instance IDs - get them from actual observation
  
  COMBAT COORDINATION RULES:
  - Stay within 5-10 tiles of each other for mutual support
  - Focus fire: ALL warriors attack same target announced by coordinator
  - Healing priority: Tank first, then lowest HP warriors
  - Retreat protocol: If >2 warriors below 30% HP, retreat and regroup
  - Loot sharing: Discuss valuable drops, distribute to appropriate warriors
  
  OBSERVATION AWARENESS:
  - Check observation after each action to see results
  - Observation shows: current position, nearby mobs, HP status, inventory
  - Before attacking, verify target is in observation's "mobs" array
  - After combat, verify enemy is gone from observation
  - Update team on observation changes: "New enemy spotted!", "Area clear"
  
  ERROR HANDLING:
  - If attack_entity fails: Verify target instance ID is correct
  - If move_character fails: Distance too far - use intermediate waypoint
  - If can't find enemy: Explore nearby areas, share observations
  - If warrior dies: Adjust strategy, remaining warriors continue mission
  - If battle failing: Tactical retreat, heal, revise strategy
  
  SUCCESS VERIFICATION:
  - Tier 1 complete: Goblin defeated, team confirms in chat
  - Tier 2 complete: Skeleton defeated, team confirms in chat  
  - Tier 3 complete: Ogre defeated, team confirms in chat
  - Tier 4 complete: Spectre defeated, ALL warriors confirm
  - Campaign complete: All 4 tiers done, team votes to complete()
  
  COMPLETION REQUIREMENTS:
  - DO NOT call complete() until ALL 4 enemy tiers are defeated
  - Minimum requirement: 1x Goblin, 1x Skeleton, 1x Ogre, 1x Spectre
  - All 5 warriors should survive the campaign (acceptable: 4/5 survive minimum)
  - Team must reach consensus before calling complete()
  - Final announcement: "CAMPAIGN COMPLETE! All targets eliminated. Mission success!"
  - Only call complete() after team confirms all objectives met
  
  🎯 SUCCESS = Five warriors coordinate to defeat all enemy tiers through perfect teamwork!

