# AgentWorld Multi-Agent Task Configuration

task:
  name: "Alchemist Guild - Potion Brewing & Herb Mastery"
  description: "Seven alchemists gather rare herbs, hunt for ingredients, and brew diverse potions and consumables"

# Task objectives
objectives:
  primary: "Brew complete potion collection: 10+ different consumables including healing, food, and specialty items"
  secondary:
    - "Gathering (Rounds 1-18): Collect herbs, hunt animals, fish for ingredients"
    - "Preparation (Rounds 19-32): Process and consolidate ingredients"
    - "Brewing (Rounds 33-47): Cook and craft all consumables"
    - "Guild Hall (Rounds 48-51): Display potion collection"

# Context and guidance for agents
relevant_game_context: |
  Alchemist guild creating diverse consumable collection.

  🎯 POTION COLLECTION (10+ types):

  **HEALING ITEMS (4)**:
  - 2x Cooked Chicken (chicken → cook)
  - 2x Cooked Shrimp (shrimp → cook)

  **GOURMET FOOD (3)**:
  - 1x Tomato Stew (tomato + mushroom + bowl)
  - 1x Corn Stew (corn + mushroom + bowl)
  - 1x Jellyfish Smoothie (jellyfish)

  **SPECIALTY CONSUMABLES (3+)**:
  - 1x Tuna Sushi (tuna)
  - 1x Cooked Beef (beef)
  - 1x Additional specialty items

  📍 GUILD MEMBERS:

  **HERBALISTS (Agents 1-2)**: Forest (250, 350)
  - Forage vegetables, mushrooms, herbs
  - Target: 20+ foraged items

  **HUNTERS (Agents 3-4)**: Plains (350, 250)
  - Hunt animals for meat
  - Target: 10+ animal kills

  **FISHERS (Agents 5-6)**: Coast (900, 400)
  - Fish for seafood ingredients
  - Target: 15+ fish caught

  **MASTER BREWER (Agent 7)**: Guild Hall (528, 384)
  - Receive ingredients, brew all potions
  - Target: 10+ consumables crafted

  ═══════════════════════════════════════════════════════════
  GATHERING (Rounds 1-18)
  ═══════════════════════════════════════════════════════════

  🌿 HERBALISTS (Agents 1-2):
  Location: (250, 350)
  - observe_environment for foraging spots
  - harvest_resource on plants
  - Gather: 6 tomato, 6 corn, 6 mushroom, misc herbs
  - Chat: "Herbalist X: Foraged Y items"

  🏹 HUNTERS (Agents 3-4):
  Location: (350, 250)
  - observe_environment radius=64 for animals
  - Hunt: chickens (easy), cows (moderate)
  - attack_entity targetInstance=<animal_id>
  - Target: 5 chicken, 3 beef minimum
  - Heal when HP < 70%
  - Chat: "Hunter X: Killed Y animals"

  🎣 FISHERS (Agents 5-6):
  Location: (900, 400)
  - observe_environment for fish spots
  - harvest_resource on fishing spots
  - Catch: 5 tuna, 6 shrimp, 4 jellyfish
  - Chat: "Fisher X: Caught Y fish"

  🏭 MASTER BREWER (Agent 7):
  - Stay at guild hall
  - Monitor gathering progress
  - Plan brewing sequences
  - Chat: "Guild Hall ready for ingredients"

  ═══════════════════════════════════════════════════════════
  PREPARATION (Rounds 19-32)
  ═══════════════════════════════════════════════════════════

  🚚 TRAVEL (Rounds 19-28):
  All gatherers → Guild Hall (528, 384)
  - Herbalists: ~325 tiles, 11 moves
  - Hunters: ~220 tiles, 7 moves
  - Fishers: ~372 tiles, 12 moves

  🔄 CONSOLIDATION (Rounds 29-32):
  Transfer ALL ingredients to Master_Brewer (Agent 7):
  - Vegetables, mushrooms from Herbalists
  - Meat from Hunters
  - Seafood from Fishers
  - verify_inventory to confirm

  ═══════════════════════════════════════════════════════════
  BREWING (Rounds 33-47)
  ═══════════════════════════════════════════════════════════

  🧪 MASTER BREWER (Agent 7):

  **Tomato Stew**:
  - craft_item skill=Cooking itemKey=stew
  - 3 tomato + 1 mushroom

  **Corn Stew**:
  - craft_item skill=Cooking itemKey=stew2
  - 3 corn + 1 mushroom

  **Cooked Chicken** (2x):
  - craft_item skill=Cooking itemKey=cookedchicken
  - Repeat twice

  **Cooked Shrimp** (2x):
  - craft_item skill=Cooking itemKey=cookedshrimp
  - Repeat twice

  **Cooked Beef**:
  - craft_item skill=Cooking itemKey=cookedbeef

  **Tuna Sushi**:
  - craft_item skill=Cooking itemKey=tunasushi

  **Jellyfish Smoothie**:
  - craft_item skill=Cooking itemKey=jellyfishsmoothie
  - 3 jellyfish

  Chat after each: "Brewed X potion/food"

  ═══════════════════════════════════════════════════════════
  GUILD HALL (Rounds 48-51)
  ═══════════════════════════════════════════════════════════

  ✅ Verify 10+ consumables created
  🎨 Display potion collection

  complete response="Alchemist Guild complete! Brewed 10+ diverse consumables: healing items, gourmet foods, specialty potions!"

# Limitations
max_action_steps: 51

