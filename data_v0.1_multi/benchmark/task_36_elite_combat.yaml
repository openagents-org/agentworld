# AgentWorld Multi-Agent Task Configuration

task:
  name: "Elite Combat Operations - Advanced Creature Hunting and Resource Mastery"
  description: "Three agents work together to conduct elite combat operations, hunt challenging creatures, and master advanced resource collection techniques"

# Task objectives
objectives:
  primary: "Successfully execute elite combat operations, hunt challenging creatures, and demonstrate mastery of advanced resource collection"
  secondary: # checkpoints
    - "Establish elite combat coordination and challenging creature hunting operations"
    - "Execute coordinated high-level creature combat with advanced tactical coordination"
    - "Complete elite combat operations within 38 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent elite combat scenario requiring maximum coordination and advanced tactical skills.
  
  OBJECTIVE: Execute elite combat operations, hunt challenging creatures, and master advanced resource collection techniques.
  
  MISSION REQUIREMENTS:
  - Establish elite combat operations in challenging areas
  - Hunt and defeat high-level creatures using coordinated tactics
  - Execute advanced resource collection and combat mastery techniques
  - Demonstrate elite-level team coordination and combat proficiency
  
  TEAM COORDINATION:
  - Use global chat for complex combat coordination and tactical status updates
  - Coordinate between creature hunting, combat operations, and resource collection
  - Share combat expertise and provide maximum tactical support
  - Work together to handle the most challenging combat encounters available
  
  GENERAL STRATEGY:
  - This requires expert-level coordination and advanced combat skills
  - High-level creatures require sophisticated tactical approaches
  - Elite operations demand precise coordination and timing
  - Advanced combat techniques require specialized positioning and resource management
  - Balance aggressive tactics with strategic positioning and team survival
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  ELITE COMBAT OPERATIONS (CRITICAL KNOWLEDGE):
  🎯 Tactical Positioning:
    - Use observe_environment to scout areas and locate high-level creatures
    - Establish strategic positions for coordinated elite combat operations
    - Navigate challenging terrain while maintaining team coordination
    - Coordinate movement to optimize tactical advantages
  
  ⚔️ Combat - High-Level Creatures:
    - Use observe_environment to locate challenging creatures in the operational area
    - Focus on high-level creatures that provide significant combat challenges
    - Expect sophisticated combat patterns requiring advanced tactical responses
    - Use appropriate weapon and magic combinations for maximum effectiveness
    - Requires coordinated burst damage and precise tactical positioning
  
  📦 Advanced Resource Collection:
    - Locate and collect valuable resources during combat operations
    - Coordinate resource gathering while maintaining combat readiness
    - Focus on resources that demonstrate mastery of collection techniques
    - Balance resource collection with tactical combat objectives
  
  🛡️ Elite Combat Strategy:
    - Use lightning and fire magic for maximum tactical effectiveness
    - Coordinate positioning to optimize team combat advantages
    - Focus on coordinated tactics that demonstrate elite combat proficiency
    - Use strategic positioning and tactical coordination for team survival
    - Coordinate timing for maximum effectiveness during combat encounters
  
  🏆 Advanced Tactical Operations:
    - Elite operations require sophisticated coordination and timing
    - Use environmental advantages and tactical positioning
    - Coordinate magical abilities and combat techniques
    - Focus team coordination for handling multiple challenging encounters

