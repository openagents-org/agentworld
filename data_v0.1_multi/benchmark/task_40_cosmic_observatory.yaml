# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cosmic Observatory - Stellar Navigation and Celestial Event Prediction"
  description: "Three agents work together to build a cosmic observatory, study celestial patterns, and predict major astronomical events"

# Task objectives
objectives:
  primary: "Successfully construct a cosmic observatory, study stellar patterns, and predict upcoming celestial events"
  secondary: # checkpoints
    - "Establish observatory construction coordination and celestial equipment preparation"
    - "Execute coordinated stellar observation and astronomical data collection"
    - "Complete cosmic observatory operations within 35 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent astronomical research scenario requiring advanced crafting and magical observation.
  
  OBJECTIVE: Build a cosmic observatory, study celestial patterns, and predict major astronomical events.
  
  MISSION REQUIREMENTS:
  - Navigate to Mountaintop region (Region 9-8: coordinates 1200-1250, 800-850)
  - Construct Cosmic Observatory using advanced materials and magical components
  - Study stellar patterns and collect astronomical data using specialized equipment
  - Predict at least one major celestial event using collected astronomical data
  
  TEAM COORDINATION:
  - Use global chat for complex observatory construction and celestial coordination
  - Coordinate between construction, observation, and astronomical prediction
  - Share specialized materials and provide magical support for celestial studies
  - Work together to handle complex astronomical calculations and predictions
  
  GENERAL STRATEGY:
  - This requires advanced crafting skills and magical astronomical knowledge
  - Observatory construction needs rare materials and precise magical alignment
  - Stellar observation requires specialized equipment and coordinated timing
  - Celestial event prediction needs complex data analysis and magical divination
  - Balance construction efficiency with observation accuracy and prediction precision
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  COSMIC OBSERVATORY CONSTRUCTION (CRITICAL KNOWLEDGE):
  🔭 Observatory Construction:
    - Use construct_building action with observatory blueprint at mountaintop (1225,825)
    - Requires advanced materials: crystal lenses, star metal, celestial stones
    - Needs high crafting skill (45+) and magical construction techniques
    - Coordinate construction phases for optimal celestial alignment
  
  ⭐ Stellar Observation Equipment:
    - Craft telescope using crystal lenses and star metal components
    - Create star charts using magical parchment and celestial ink
    - Build astrolabe for precise celestial navigation and timing
    - Coordinate equipment calibration for accurate observations
  
  🌟 Astronomical Data Collection:
    - Use observe_stars action during optimal celestial conditions
    - Record stellar positions, planetary movements, and cosmic phenomena
    - Track celestial cycles and identify astronomical patterns
    - Coordinate observation shifts for continuous data gathering
  
  🔮 Celestial Event Prediction:
    - Use predict_event action with collected astronomical data
    - Requires divination magic and complex astronomical calculations
    - Predict eclipses, meteor showers, planetary alignments, or cosmic storms
    - Coordinate prediction verification through multiple observation methods
  
  🌙 Optimal Observation Conditions:
    - Clear night skies provide best observation opportunities
    - Coordinate timing with lunar phases and atmospheric conditions
    - Use magical enhancement for improved celestial visibility
    - Plan observation schedule around predicted celestial events

# Limitations
max_action_steps: 35

