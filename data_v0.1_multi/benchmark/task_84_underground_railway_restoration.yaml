# AgentWorld Multi-Agent Task Configuration

task:
  name: "Underground Railway Restoration - Cavern Transit Revival"
  description: "Ten spelunkers reopen the abandoned railway beneath the Central Kingdom, clearing debris, laying signal beacons, and testing a supply cart within 55 rounds."

# Task objectives
objectives:
  primary: "Reconnect the North Shaft (230,60) and South Exit (480,620) through the underground tunnel, then escort a supply cart end-to-end while keeping comms online."
  secondary:
    - "Phase 1: Survey team charts collapsed corridors and marks detours."
    - "Phase 2: Excavation team clears three blockages using mining and lumber support."
    - "Phase 3: Beacon team crafts and installs four signal staffs for navigation."
    - "Phase 4: Security team removes hostile mobs and establishes safe checkpoints."
    - "Phase 5: Logistics team pushes the supply cart from north to south without losing escorted coverage."

# Relevant game context (Hint)
relevant_game_context: |
  MAP OVERVIEW
  - North Shaft (230,60) ↔ Mid Hub (350,320) ↔ South Exit (480,620). Keep at least two agents stationed at each hub while others travel.
  
  BLOCKAGE CLEARING
  - Each collapse consumes ~6 pickaxe swings worth of effort. Gather 12 ironore + 12 coal, smelt into 12 ironbar, and craft_item Smithing pickaxe (two replacements) before starting.
  - TimberJack supplies planks/logs to brace tunnels; confirm “Brace ready” in chat before mining.
  
  SIGNAL BEACONS
  - BeaconSmith crafts two lightningstaff (direction markers) and two firestaff (hazard markers) using sticks + beads from monsters/plants along the route.
  - Plant beacons at North Shaft, Mid Hub, South Exit, and one underground junction; SignalRunner posts activation messages.
  
  SECURITY + CART
  - TunnelGuard & ShadowCleaver patrol ahead, using attack_entity on spectres/scorpions and reporting loot so Beacon team can recycle beads.
  - QuarterCart represents the supply cart inventory. Once it departs North Shaft, at least three escorts must remain within 5 tiles until arrival.
  - Transfers happen only at hubs; verify_inventory before declaring a blockage cleared or beacon installed.
  
  COMPLETION
  - Need chat log of three cleared blockages, four active beacons, and cart arrival. complete() only after all agents assemble at South Exit for final inspection.

# Limitations
max_action_steps: 55

