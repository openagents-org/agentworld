# AgentWorld Multi-Agent Task Configuration

task:
  name: "Dragon Lair Assault - Ancient Wyrm Combat and Treasure Recovery"
  description: "Three agents work together to infiltrate a dragon's lair, defeat the Ancient Red Dragon, and recover legendary treasures"

# Task objectives
objectives:
  primary: "Successfully infiltrate the dragon's lair, defeat the Ancient Red Dragon, and recover legendary dragon treasures"
  secondary: # checkpoints
    - "Establish dragon lair infiltration coordination and treasure location reconnaissance"
    - "Execute coordinated Ancient Red Dragon combat with legendary creature tactics"
    - "Complete dragon lair assault within 38 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent legendary creature combat scenario requiring maximum coordination and advanced tactics.
  
  OBJECTIVE: Infiltrate the dangerous dragon's lair, defeat the Ancient Red Dragon, and claim legendary treasures.
  
  MISSION REQUIREMENTS:
  - Navigate to Dragon Lair region (Region 5-4: coordinates 750-800, 400-450)
  - Infiltrate the heavily defended dragon's lair complex
  - Defeat Ancient Red Dragon (Level 68) in coordinated legendary combat
  - Recover Dragon Hoard treasures and legendary equipment
  
  TEAM COORDINATION:
  - Use global chat for complex dragon combat coordination and treasure status
  - Coordinate between lair infiltration, legendary combat, and treasure recovery
  - Share legendary equipment and provide maximum combat support
  - Work together to handle the most dangerous creature encounter in the region
  
  GENERAL STRATEGY:
  - This requires expert-level coordination and advanced combat skills
  - Ancient Red Dragon (Level 68) is one of the most powerful creatures in the game
  - Dragon's lair has multiple defensive layers and treasure chambers
  - Fire-based attacks and dragon breath require specialized protection
  - Balance aggressive combat with strategic positioning and resource management
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  DRAGON LAIR COMBAT (CRITICAL KNOWLEDGE):
  🔥 Environmental Hazards:
    - Fire overlay type causes continuous flame damage throughout lair
    - Lava pools and fire traps require careful navigation
    - Dragon breath attacks affect large areas with devastating fire damage
    - Coordinate movement to avoid environmental fire hazards
  
  🐉 Combat - Ancient Red Dragon:
    - Use observe_environment to locate Ancient Red Dragon at lair center (775,425)
    - Level 68 legendary creature with massive health, armor, and devastating attacks
    - Expect fire breath (area damage), claw attacks, tail sweep, and aerial charges
    - Dragon has fire immunity but vulnerable to ice and lightning magic
    - Requires coordinated burst damage and perfect positioning
  
  💎 Dragon Hoard Treasures:
    - Legendary treasures scattered throughout lair chambers
    - Dragon Gold, Enchanted Weapons, Rare Gems, and Magical Artifacts
    - Some treasures require defeating dragon to access protected chambers
    - Coordinate treasure collection while maintaining combat readiness
  
  🛡️ Legendary Combat Strategy:
    - Use ice and lightning magic for maximum elemental damage
    - Coordinate positioning to avoid dragon breath area attacks
    - Focus on hit-and-run tactics due to dragon's massive damage output
    - Use healing rotations and defensive positioning for survival
    - Coordinate timing for maximum damage during dragon vulnerable moments
  
  ⚔️ Advanced Tactics:
    - Dragon has multiple combat phases with different attack patterns
    - Use environmental cover to avoid breath weapon attacks
    - Coordinate magical barriers and protective spells
    - Focus fire coordination for breaking through dragon's massive defenses

# Limitations
max_action_steps: 38

