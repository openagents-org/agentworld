# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets

task:
  name: "Kingdom Defense Campaign - The Two-Front War"
  description: "A synchronized military operation where 20 agents split into two squads to defend the Kingdom's Northern and Eastern borders simultaneously against elite threats."

objectives:
  primary: "Simultaneously secure the Northern Border (Ice Guardians) and Eastern Border (Golden Golems)."
  secondary:
    - "North Squad: Defeat 2 Ice Guardians (Level 35 Minibosses)"
    - "East Squad: Defeat 2 Golden Golems"
    - "Support Units: Keep frontline warriors healed (HP > 50%)"
    - "Commanders: Coordinate the final kill count to ensure both fronts succeed"

relevant_game_context: |
  OPERATION TWIN SHIELDS

  The Kingdom is under attack from two directions. You must hold the line.

  NORTHERN FRONT (Agents 1-10)
  - Location: Frozen Expanse (Region 2-1, X:259, Y:151)
  - Threat: Ice Guardians (Freezing attacks, high durability).
  - Strategy: Use Fire weapons if available. Support units must heal the Tank.

  EASTERN FRONT (Agents 11-20)
  - Location: Ancient Ruins (Region 7-6, X:784, Y:676)
  - Threat: Golden Golems (High Defense, Crush damage).
  - Strategy: Sunder armor (Pickaxes/Warhammers). Magical attacks are effective.

  SQUAD ROLES:
  - Commander (x1): Calls targets, tracks kills.
  - Vanguard (x6): Frontline combat.
  - Support (x3): Healers/Suppliers. Keep distance, use flasks on Vanguard if possible (transfer).

  VICTORY CONDITION:
  - Both fronts must report 2 confirmed kills each.
  - Total 4 Minibosses defeated.
  - Minimal casualties (Supporters must survive).

limitations:
  max_action_steps: 48

