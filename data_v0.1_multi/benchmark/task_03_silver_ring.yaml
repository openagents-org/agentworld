# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cooperative Silver Ring Forging - Jewelry Crafting"
  description: "Three agents work together to mine, smelt, and forge a silver ring"

# Task objectives
objectives:
  primary: "Create a silver ring through coordinated mining, smelting, and smithing"
  secondary: # checkpoints
    - "Establish mining and smelting coordination"
    - "Execute safe material transfers between agents"
    - "Complete jewelry crafting within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent metallurgy scenario requiring mining and smithing expertise.
  
  CRITICAL SUCCESS REQUIREMENTS:
  1. miner_agent MUST find and mine iron rocks to get iron ore
  2. miner_agent MUST also collect coal for smelting fuel
  3. smelter_agent MUST smelt iron ore + coal into iron bars
  4. smith_agent MUST receive iron bars and forge them into a silver ring
  5. smith_agent MUST equip the silver ring and declare completion
  
  LOCATION STRATEGY:
  - Look for iron rocks and coal deposits in mining areas
  - Find smelting facilities or use portable smelting
  - Central smithing location for final forging
  - Communicate resource locations through global chat
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  ⛏️ Mining - iron ore:
    - harvest_resource on iron rock instances to get ironore
    - Level required: 10+ (Mining skill)
  
  ⛏️ Mining - coal:
    - harvest_resource on coal rock instances to get coal
    - Level required: 1+ (Mining skill)
  
  🔥 Smelting Recipe - ironbar:
    - craft_item skill=Smelting itemKey=ironbar
    - Materials: 1x ironore + 1x coal → 1x ironbar
    - Level required: 20 (uses Smithing skill level)
  
  🔨 Smithing Recipe - silverring:
    - craft_item skill=Smithing itemKey=silverring
    - Materials: 2x ironbar → 1x silverring
    - Level required: 1 (Smithing skill)

# Limitations
max_action_steps: 25

# Agent configurations
agent_1:
  username: "miner_agent"
  new_character: true
  role: "Resource Miner"
  
  location:
    x: 229
    y: 37
  
  skill_levels:
    mining: 25
    strength: 30
    health: 25
  
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "pickaxe"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Resource miner responsible for gathering iron ore and coal
    
    ⛏️ CRITICAL MINING MISSION - GATHER SMELTING MATERIALS!
    
    ABSOLUTE PRIORITIES:
    1. Find and mine iron rocks to get iron ore
    2. Find and mine coal deposits for smelting fuel
    3. Collect at least 2x ironore and 2x coal
    4. Transfer materials to smelter_agent
    
    MINING STRATEGY:
    1. observe_environment to find iron rocks and coal deposits
    2. PRIORITY: Look for IRON ROCKS specifically (level 10 requirement)
    3. Also look for COAL deposits (level 1 requirement)
    4. If not visible, move to different mining areas:
       - move_character(x=150, y=450) for mountain mining area
       - move_character(x=250, y=350) for rocky mining area
       - move_character(x=300, y=500) for deep mining area
    5. harvest_resource on iron rock instances to get ironore
    6. harvest_resource on coal rock instances to get coal
    7. Check inventory after each mining operation
    8. Use global chat every 2-3 actions to report mining progress
    9. Once you have 2+ ironore and 2+ coal, coordinate with smelter_agent
    10. Move to agreed meetup location for material transfer
    11. transfer_items to give materials to smelter_agent
    12. Wait for smelter_agent to confirm receipt
    13. Support team until silver ring is complete
    
    MATERIAL TARGET:
    - Minimum 2x ironore (for 2x ironbar)
    - Minimum 2x coal (fuel for smelting)
    - Extra materials as backup
    
    ERROR PREVENTION:
    - Verify mining tool (pickaxe) is equipped
    - Check skill levels before attempting high-level mining
    - Always verify targetInstance IDs exist
    - REMEMBER: Iron rocks → ironore, Coal rocks → coal

agent_2:
  username: "smelter_agent"
  new_character: true
  role: "Metal Smelter"
  
  location:
    x: 233
    y: 175
  
  skill_levels:
    smithing: 25      # Used for smelting operations
    mining: 15        # Backup mining capability
    strength: 25
    health: 20
  
  inventory_items:
    - item: "flask"
      count: 8
    - item: "apple"
      count: 12
  
  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Metal smelter responsible for creating iron bars
    
    🔥 CRITICAL SMELTING MISSION - FORGE IRON BARS!
    
    ABSOLUTE PRIORITIES:
    1. Coordinate with miner_agent to receive raw materials
    2. Smelt iron ore and coal into iron bars
    3. Produce at least 2x iron bars for ring crafting
    4. Transfer iron bars to smith_agent
    
    SMELTING STRATEGY:
    1. send global chat message announcing readiness to receive ore
    2. Wait for miner_agent to report successful mining
    3. Coordinate meetup location for material transfer
    4. Move to agreed location to receive materials from miner_agent
    5. observe_environment to verify ironore and coal received
    6. Smelt materials into iron bars:
       📋 RECIPE: craft_item skill=Smelting itemKey=ironbar (1x ironore + 1x coal → 1x ironbar)
    7. Repeat smelting to create 2x ironbar total
    8. observe_environment to verify iron bars in inventory
    9. Use global chat to report successful smelting
    10. Coordinate with smith_agent for iron bar transfer
    11. Move to smith_agent's location for transfer
    12. transfer_items to give iron bars to smith_agent
    13. Wait for smith_agent to confirm receipt
    14. Support team until silver ring is complete
    
    SMELTING REQUIREMENTS:
    - Smithing skill level 20+ for iron bar smelting (you have 25)
    - 1x ironore + 1x coal per iron bar
    - Target: 2x ironbar for silver ring
    
    ERROR PREVENTION:
    - Verify materials received before smelting
    - Check inventory after each smelting operation
    - Confirm successful craft_item results
    - REMEMBER: Smelting uses Smithing skill level!

agent_3:
  username: "smith_agent"
  new_character: true
  role: "Master Smith"
  
  location:
    x: 259
    y: 184
  
  skill_levels:
    smithing: 25      # Required for silver ring crafting
    strength: 30
    health: 25
    defense: 20
  
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Master smith responsible for forging the silver ring
    
    🔨 PRIORITY ACTIONS:
    1. Coordinate with smelter_agent to receive iron bars
    2. Forge iron bars into a silver ring
    3. Quality control and final product verification
    4. Equip the ring and declare completion
    
    SMITHING COORDINATION:
    1. send global chat message announcing smithing readiness
    2. Wait for smelter_agent to report successful iron bar production
    3. Coordinate meetup location for iron bar transfer
    4. Move to agreed location to receive iron bars
    5. observe_environment to verify iron bars received
    
    CRITICAL VERIFICATION STEPS:
    6. BEFORE crafting, use observe_environment to CHECK YOUR INVENTORY
    7. VERIFY you have 2x ironbar in your inventory
    8. ONLY AFTER verifying materials, use craft_item:
       📋 RECIPE: craft_item skill=Smithing itemKey=silverring (2x ironbar → 1x silverring)
    9. WAIT for craft_item result - confirm "Successfully crafted" message
    10. observe_environment to verify silverring in inventory
    11. equip_item to equip the silver ring
    12. observe_environment to verify ring is equipped
    13. Use global chat to declare "Silver ring forged and equipped successfully!"
    14. complete() ONLY after successful ring creation and equipping
    
    MATERIAL REQUIREMENTS:
    ✅ 2x ironbar (from smelter_agent)
    ✅ Smithing skill level 1+ (you have level 25)
    
    ERROR PREVENTION:
    - Verify all material transfers completed
    - Check inventory before attempting crafting
    - Confirm equipment changes after equipping
    - Coordinate efficiently with team members

# Success criteria for multi-agent task
success_criteria:
  - "miner_agent successfully mines and transfers iron ore and coal"
  - "smelter_agent successfully smelts iron bars and transfers to smith"
  - "smith_agent receives iron bars and forges silver ring"
  - "smith_agent successfully equips the silver ring"
  - "All agents coordinate effectively through global chat"
  - "Metallurgy chain operates smoothly within time limit"
