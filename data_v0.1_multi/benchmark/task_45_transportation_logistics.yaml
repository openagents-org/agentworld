# AgentWorld Multi-Agent Task Configuration

task:
  name: "Transportation Logistics - Supply Chain Management and Distribution Coordination"
  description: "Three agents work together to establish transportation systems, manage supply chains, and coordinate distribution operations"

# Task objectives
objectives:
  primary: "Successfully establish transportation systems, manage supply chains effectively, and coordinate distribution operations"
  secondary: # checkpoints
    - "Establish transportation coordination and supply chain management preparation"
    - "Execute coordinated distribution operations and logistics management"
    - "Complete transportation logistics establishment within 45 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent transportation logistics scenario requiring supply chain management and distribution coordination.
  
  OBJECTIVE: Establish transportation systems, manage supply chains effectively, and coordinate distribution operations.
  
  MISSION REQUIREMENTS:
  - Establish transportation operations in suitable areas for logistics management and supply chain coordination
  - Coordinate distribution systems and supply chain services for transportation enhancement
  - Provide logistics assistance and transportation management using available resources and distribution methods
  - Develop sustainable transportation systems for ongoing supply chain operations
  
  TEAM COORDINATION:
  - Use global chat for complex transportation coordination and supply chain management
  - Coordinate between logistics development, distribution operations, and transportation service delivery
  - Share transportation knowledge and provide support during logistics operations
  - Work together to handle complex supply chain challenges and coordinate distribution systems
  
  GENERAL STRATEGY:
  - This requires transportation coordination skills and supply chain management expertise
  - Logistics programs need efficient resource utilization and coordinated transportation action
  - Distribution services require coordinated delivery and mutual supply chain support
  - Supply chain management needs strategic planning and transportation coordination
  - Balance immediate logistics needs with long-term transportation sustainability
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  TRANSPORTATION LOGISTICS OPERATIONS (CRITICAL KNOWLEDGE):
  🚛 Transportation System Development:
    - Use observe_environment to scout areas suitable for transportation operations and logistics development
    - Establish logistics coordination positions for supply chain service delivery and transportation management
    - Navigate transportation areas while maintaining team safety and logistics effectiveness
    - Coordinate transportation activities to optimize logistics effectiveness and distribution coordination
  
  📦 Supply Chain Management Coordination:
    - Use available resources for transportation programs and distribution projects
    - Focus on efficient resource utilization for logistics operations and transportation service delivery
    - Coordinate supply chain activities to maximize transportation effectiveness and distribution success
    - Practice logistics techniques and transportation coordination methods
  
  🚚 Distribution Operations Management:
    - Use available skills for transportation coordination and logistics assistance
    - Coordinate transportation resource sharing and distribution among team members
    - Focus on sustainable logistics practices and transportation resource conservation
    - Balance immediate distribution needs with long-term transportation planning
  
  📊 Logistics Infrastructure Operations:
    - Use observe_environment to identify transportation needs and logistics opportunities
    - Coordinate distribution assistance and supply chain system management
    - Practice team logistics strategies using available resources and transportation skills
    - Execute coordinated transportation operations and provide mutual logistics support
  
  🗺️ Transportation Coordination Strategy:
    - Use coordinated logistics techniques for effective supply chain management
    - Practice efficient transportation management and logistics resource coordination
    - Focus on developing transportation capabilities through team coordination
    - Use reliable approaches during logistics and transportation operations

# Limitations
max_action_steps: 45

