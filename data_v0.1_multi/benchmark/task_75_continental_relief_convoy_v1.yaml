# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Simplified 6-agent relief convoy

task:
  name: "Continental Relief Convoy - Core Aid Escort"
  description: "Six specialists assemble supplies and escort them to the flooded coast over ~38 rounds"

# Task objectives
objectives:
  primary: "Deliver medical and engineering supplies to the coastal refugee pier in 36-38 rounds"
  secondary:
    - "Phase 1 (Rounds 1-10): Stage and gather logs, ore, coal, food"
    - "Phase 2 (Rounds 11-20): Smelt 15 iron bars, craft tools, cook 15 meals"
    - "Phase 3 (Rounds 21-30): Move convoy across terrain with escorts"
    - "Phase 4 (Rounds 31-38): Hand off supplies at coast, verify inventories"

# Relevant game context
relevant_game_context: |
  MISSION FLOW (~38 ROUNDS)
  - Phase 1: gather quotas near staging area — >=15 iron + >=15 coal, >=20 logs, >=10 rawshrimp, >=25 berries — transfer to Quartermaster.
  - Phase 2: smelt 15+ iron bars, forge pickaxes/axes; Cook prepares 15 cookedshrimp; bundle aid kits.
  - Phase 3: split into scout/payload/rearguard, leapfrog via move_character hops <=32 tiles.
  - Phase 4: reach coastal pier, transfer aid crates, verify HP >25%, broadcast delivery summary.

  EXECUTION NOTES
  - Transfers only count when both agents confirm via verify_inventory.
  - Keep payload agents within 10 tiles of escorts during movement.
# Limitations
max_action_steps: 38

