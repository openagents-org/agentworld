# AgentWorld Multi-Agent Task Configuration
# VARIANT: Adjusted version - 4 rescue camps instead of 3

task:
  name: "Mountain Rescue Operation - Multi-Site Emergency Response (4 Camps)"
  description: "Twelve agents coordinate a complex mountain rescue spanning multiple regions, delivering supplies, clearing paths, and establishing 4 rescue camps"

# Task objectives
objectives:
  primary: "Execute successful mountain rescue operation across 4 regions, delivering 120+ supplies and establishing 4 rescue camps within 50 rounds"
  secondary:
    - "Phase 1 (Rounds 1-12): Supply Gathering - Collect 120+ healing items and 60+ tools"
    - "Phase 2 (Rounds 13-25): Path Clearing - Clear routes and defeat blocking mobs"
    - "Phase 3 (Rounds 26-38): Camp Establishment - Set up 4 rescue camps with supplies"
    - "Phase 4 (Rounds 39-50): Rescue Completion - Coordinate final supply delivery"

# Relevant game context (Hint)
relevant_game_context: |
  MOUNTAIN RESCUE OPERATION:

  Three rescue teams must coordinate across mountain regions to save stranded travelers.
  Requires supply gathering, route clearing, and establishing rescue camps.

  RESCUE TEAMS:

  SUPPLY CORPS (Agents 1-4) - Resource Gathering
  **Mission**: Gather 120+ healing items and survival supplies
  **Location**: Starting Base (400, 10)

  **Goals**:
  - 60x flask (healing)
  - 40x apple (food)
  - 25x cookedshrimp (premium healing)
  - 12x logs (firewood)
  - 6x pickaxes (tools)

  PATH CLEARING TEAM (Agents 5-8) - Route Security
  **Mission**: Clear mountain paths of hostile creatures
  **Locations**: Multiple mountain regions

  **Targets**:
  - Defeat 6+ mountain mobs blocking paths
  - Clear route from (400,10) to (230,40)
  - Clear route from (230,40) to (260,156)
  - Clear route from (260,156) to (350,100)
  - Clear route back to base

  CAMP CONSTRUCTION (Agents 9-12) - Rescue Stations
  **Mission**: Establish 4 rescue camps with supplies
  **Locations**:
  - Camp Alpha: (235, 42)
  - Camp Beta: (260, 154)
  - Camp Gamma: (400, 12)
  - Camp Delta: (350, 98)

  **Each Camp Needs**:
  - 35+ healing items
  - 12+ food items
  - 2+ tools
  - Emergency supplies

  SUCCESS CRITERIA:
  1. Gather 120+ supply items
  2. Defeat 6+ blocking creatures
  3. Establish 4 rescue camps
  4. Deliver 35+ items to each camp
  5. Complete within 50 rounds

# Limitations
max_action_steps: 50

