# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cooperative Emerald Ring Crafting - Precious Jewelry"
  description: "Three agents work together to create an emerald ring through gem mining, base ring smithing, and jewelry crafting"

# Task objectives
objectives:
  primary: "Create an emerald ring by combining emerald gem with silver ring base"
  secondary: # checkpoints
    - "Coordinate gem mining and metal smithing operations"
    - "Execute precise material transfers for valuable items"
    - "Complete luxury jewelry crafting within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent luxury crafting scenario requiring gem mining and jewelry expertise.
  
  HINT:
  1. gem_hunter_agent MUST find and mine emerald deposits (high-level mining)
  2. smith_agent MUST create silver ring base from iron materials
  3. jeweler_agent MUST combine emerald + silver ring into emerald ring
  4. jeweler_agent MUST equip the emerald ring and declare completion
  
  LOCATION STRATEGY:
  - Look for emerald deposits in high-level mining areas
  - Find iron and coal for silver ring base creation
  - Central jewelry crafting location for final assembly
  - Communicate rare resource locations through global chat
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  💎 Mining - emerald:
    - harvest_resource on emerald deposits to get emerald
    - Level required: 57+ (Mining skill) - HIGH LEVEL!
    - Respawn time: 180 seconds - RARE RESOURCE!
  
  🔨 Smithing Recipe - silverring:
    - craft_item skill=Smithing itemKey=silverring
    - Materials: 2x ironbar → 1x silverring
    - Level required: 1 (Smithing skill)
  
  💍 Crafting Recipe - emerald ring:
    - craft_item skill=Crafting itemKey=ring1
    - Materials: 1x emerald + 1x silverring → 1x emerald ring
    - Level required: 1 (Crafting skill)

# Limitations
max_action_steps: 25

