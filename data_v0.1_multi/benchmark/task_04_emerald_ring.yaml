# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cooperative Emerald Ring Crafting - Precious Jewelry"
  description: "Three agents work together to create an emerald ring through gem mining, base ring smithing, and jewelry crafting"

# Task objectives
objectives:
  primary: "Create an emerald ring by combining emerald gem with silver ring base"
  secondary: # checkpoints
    - "Coordinate gem mining and metal smithing operations"
    - "Execute precise material transfers for valuable items"
    - "Complete luxury jewelry crafting within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent luxury crafting scenario requiring gem mining and jewelry expertise.
  
  CRITICAL SUCCESS REQUIREMENTS:
  1. gem_hunter_agent MUST find and mine emerald deposits (high-level mining)
  2. smith_agent MUST create silver ring base from iron materials
  3. jeweler_agent MUST combine emerald + silver ring into emerald ring
  4. jeweler_agent MUST equip the emerald ring and declare completion
  
  LOCATION STRATEGY:
  - Look for emerald deposits in high-level mining areas
  - Find iron and coal for silver ring base creation
  - Central jewelry crafting location for final assembly
  - Communicate rare resource locations through global chat
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  💎 Mining - emerald:
    - harvest_resource on emerald deposits to get emerald
    - Level required: 57+ (Mining skill) - HIGH LEVEL!
    - Respawn time: 180 seconds - RARE RESOURCE!
  
  🔨 Smithing Recipe - silverring:
    - craft_item skill=Smithing itemKey=silverring
    - Materials: 2x ironbar → 1x silverring
    - Level required: 1 (Smithing skill)
  
  💍 Crafting Recipe - emerald ring:
    - craft_item skill=Crafting itemKey=ring1
    - Materials: 1x emerald + 1x silverring → 1x emerald ring
    - Level required: 1 (Crafting skill)

# Limitations
max_action_steps: 25

# Agent configurations
agent_1:
  username: "gem_hunter_agent"
  new_character: true
  role: "Emerald Miner"
  
  location:
    x: 745
    y: 579
  
  skill_levels:
    mining: 65        # HIGH LEVEL for emerald mining
    strength: 30
    health: 30
    defense: 25
  
  inventory_items:
    - item: "flask"
      count: 15
    - item: "apple"
      count: 20
  
  equipped_items:
    - item: "pickaxe"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Expert gem hunter responsible for mining precious emeralds
    
    💎 CRITICAL GEM MINING MISSION - FIND EMERALDS!
    
    ABSOLUTE PRIORITIES:
    1. Find emerald deposits in high-level mining areas
    2. Mine emerald gem (VERY HIGH SKILL REQUIREMENT!)
    3. Secure at least 1x emerald for ring crafting
    4. Transfer emerald to jeweler_agent safely
    
    GEM HUNTING STRATEGY:
    1. observe_environment to search for emerald deposits
    2. CRITICAL: Look for EMERALD deposits specifically (level 57 requirement!)
    3. If not visible, move to high-level mining areas:
       - move_character(x=550, y=550) for deep mountain area
       - move_character(x=650, y=450) for precious gem area
       - move_character(x=700, y=600) for rare mineral zone
    4. harvest_resource on emerald deposit instances
    5. IMPORTANT: Emeralds are RARE - may take multiple attempts
    6. Check inventory carefully after each mining attempt
    7. Use global chat to report emerald search progress
    8. Once you secure 1x emerald, immediately coordinate with jeweler_agent
    9. Move to secure meetup location for emerald transfer
    10. transfer_items to give emerald to jeweler_agent (HIGH VALUE!)
    11. Wait for jeweler_agent to confirm emerald receipt
    12. Support team until emerald ring is complete
    
    EMERALD MINING REQUIREMENTS:
    - Mining skill level 57+ (you have 65) ✅
    - High-end pickaxe recommended
    - Patience for rare resource spawns
    - Secure handling of valuable gems
    
    ERROR PREVENTION:
    - Verify mining skill meets emerald requirements
    - Double-check inventory after mining attempts
    - Handle emerald transfer with extreme care
    - REMEMBER: Emeralds are RARE and VALUABLE!

agent_2:
  username: "smith_agent"
  new_character: true
  role: "Ring Base Smith"
  
  location:
    x: 200
    y: 300
  
  skill_levels:
    smithing: 25
    mining: 20
    smelting: 25      # For iron bar creation
    strength: 30
    health: 25
  
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
    - item: "ironore"
      count: 2
    - item: "coal"
      count: 2
  
  equipped_items:
    - item: "pickaxe"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Ring base smith responsible for creating silver ring foundation
    
    🔨 CRITICAL SMITHING MISSION - CREATE SILVER RING BASE!
    
    ABSOLUTE PRIORITIES:
    1. Smelt iron ore and coal into iron bars
    2. Forge iron bars into silver ring base
    3. Transfer silver ring to jeweler_agent
    4. Support emerald ring assembly process
    
    SMITHING STRATEGY:
    1. observe_environment to verify starting materials (ironore, coal)
    2. Smelt iron materials into iron bars:
       📋 SMELTING: craft_item skill=Smelting itemKey=ironbar (1x ironore + 1x coal → 1x ironbar)
    3. Repeat smelting to create 2x ironbar total
    4. Forge silver ring base:
       📋 SMITHING: craft_item skill=Smithing itemKey=silverring (2x ironbar → 1x silverring)
    5. observe_environment to verify silver ring created
    6. Use global chat to report silver ring completion
    7. Coordinate with jeweler_agent for ring base transfer
    8. Move to agreed meetup location
    9. transfer_items to give silver ring to jeweler_agent
    10. Wait for jeweler_agent to confirm receipt
    11. Support team until emerald ring assembly is complete
    
    PRODUCTION REQUIREMENTS:
    - 2x ironore + 2x coal (you start with these)
    - Smithing skill level 1+ for ring (you have 25)
    - Precision crafting for jewelry base
    
    ERROR PREVENTION:
    - Verify each smelting operation success
    - Check inventory after each crafting step
    - Handle silver ring transfer carefully
    - Coordinate timing with gem hunter progress

agent_3:
  username: "jeweler_agent"
  new_character: true
  role: "Master Jeweler"
  
  location:
    x: 749
    y: 621
  
  skill_levels:
    crafting: 25      # Required for emerald ring assembly
    smithing: 15      # Backup smithing knowledge
    mining: 10        # Basic gem knowledge
    strength: 20
    health: 25
  
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Master jeweler responsible for emerald ring assembly
    
    💍 PRIORITY ACTIONS:
    1. Coordinate with both gem_hunter_agent and smith_agent
    2. Collect emerald and silver ring components
    3. Assemble emerald ring with precision crafting
    4. Final quality control and ring equipping
    
    JEWELRY ASSEMBLY COORDINATION:
    1. send global chat message announcing jewelry assembly readiness
    2. Monitor progress from both gem_hunter_agent and smith_agent
    3. Coordinate material collection from both agents
    4. First collect silver ring from smith_agent
    5. Then collect emerald from gem_hunter_agent (HANDLE WITH CARE!)
    6. Verify both components before assembly
    
    CRITICAL VERIFICATION STEPS:
    7. observe_environment to CHECK YOUR INVENTORY before crafting
    8. VERIFY you have BOTH 1x emerald AND 1x silverring
    9. ONLY AFTER verifying materials, use craft_item:
       📋 RECIPE: craft_item skill=Crafting itemKey=ring1 (1x emerald + 1x silverring → 1x emerald ring)
    10. WAIT for craft_item result - confirm "Successfully crafted" message
    11. observe_environment to verify emerald ring in inventory
    12. equip_item to equip the emerald ring
    13. observe_environment to verify ring is equipped
    14. Use global chat to declare "Emerald ring crafted and equipped successfully!"
    15. complete() ONLY after successful ring creation and equipping
    
    COMPONENT REQUIREMENTS:
    ✅ 1x emerald (from gem_hunter_agent) - RARE & VALUABLE
    ✅ 1x silverring (from smith_agent)
    ✅ Crafting skill level 1+ (you have level 25)
    
    ERROR PREVENTION:
    - Handle emerald with extreme care - IRREPLACEABLE
    - Verify all transfers completed successfully
    - Double-check inventory before crafting
    - Coordinate timing carefully with both agents

# Success criteria for multi-agent task
success_criteria:
  - "gem_hunter_agent successfully mines and transfers emerald"
  - "smith_agent successfully creates and transfers silver ring base"
  - "jeweler_agent receives both components and crafts emerald ring"
  - "jeweler_agent successfully equips the emerald ring"
  - "All agents handle valuable materials with appropriate care"
  - "Luxury jewelry production completes within time limit"
