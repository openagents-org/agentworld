# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Simplified 6-agent festival preparation

task:
  name: "Grand Festival Preparation - Core Celebration Event"
  description: "Six specialized agents coordinate to prepare a festival by fishing, foraging, cooking, and crafting items"

# Task objectives
objectives:
  primary: "Prepare a festival where 6 agents gather resources, cook dishes, and craft competition prizes"
  secondary:
    - "Phase 1 (Rounds 1-12): Resource Expedition"
    - "Phase 2 (Rounds 13-24): Material Processing and Cooking"
    - "Phase 3 (Rounds 25-32): Prize Crafting"
    - "Phase 4 (Rounds 33-38): Festival Setup"

# Relevant game context
relevant_game_context: |
  FESTIVAL PLAN
  - Six specialists gather seafood, produce, ores; cooks turn them into dishes; smith crafts prizes; everyone meets at plaza (450,300) within 38 rounds.
  - Phase 1: fisher catches 8 shrimp, hunter collects 6 meat, forager gathers fruits/veg, smith mines ores.
  - Phase 2: transfer ingredients to cooks; smith smelts 6 iron + 3 gold bars.
  - Phase 3: smith forges 2 silver rings and 1 golden ring.
  - Phase 4: all agents travel to festival grounds and verify items.

  EXECUTION NOTES
  - Use chat to track progress.
  - Transfers require verify_inventory.
# Limitations
max_action_steps: 38

