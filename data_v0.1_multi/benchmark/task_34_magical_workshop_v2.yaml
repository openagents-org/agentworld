# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Craft fire staff with pre-gathered materials

task:
  name: "Magical Workshop - Fire Staff Crafting"
  description: "Three agents with pre-gathered materials work together to craft a fire staff"

# Task objectives
objectives:
  primary: "Craft a fire staff using pre-gathered materials"
  secondary: # checkpoints
    - "Process logs into sticks"
    - "Complete fire staff crafting within 20 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a magical crafting scenario with materials already available.

  OBJECTIVE: Craft a fire staff using pre-gathered ruby and logs.

  CRITICAL: Materials already available!
  - gem_holder_agent has 1x ruby
  - wood_processor_agent has 2x logs

  TEAM COORDINATION:
  - Process logs into sticks
  - Combine sticks and ruby for fire staff
  - Coordinate crafting steps

  CRAFTING RECIPES:
  🪄 Fletching Recipe - stick:
    - craft_item skill=Fletching itemKey=stick
    - Materials: 1x logs → 4x stick

  🔥 Fletching Recipe - firestaff:
    - craft_item skill=Fletching itemKey=firestaff
    - Materials: 4x stick + 1x ruby → 1x firestaff
    - Level required: 30 (Fletching skill)

  DO NOT use complete() until firestaff is crafted!

# Limitations
max_action_steps: 20

