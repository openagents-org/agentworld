# AgentWorld Multi-Agent Task Configuration

task:
  name: "Legendary Equipment Forge - Ultimate Gear Creation"
  description: "Nine master craftsmen unite to create the ultimate equipment set: legendary golden items, magical staffs, and complete combat gear"

# Task objectives
objectives:
  primary: "Forge legendary equipment set: 5+ golden items, 4+ magical staffs, 6+ elite weapons/armor for complete legendary arsenal"
  secondary:
    - "Conquest 1 (Rounds 1-18): Massive Resource Gathering - Mine 100+ ores, gather magical components"
    - "Conquest 2 (Rounds 19-32): Industrial Smelting - Produce 80+ bars from ores"
    - "Conquest 3 (Rounds 33-48): Legendary Crafting - Forge all legendary items"
    - "Conquest 4 (Rounds 49-54): Arsenal Exhibition - Display complete legendary set"

