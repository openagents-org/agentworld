# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - 4 agents, harvest materials and craft fire-enchanted sword

task:
  name: "Volcanic Forge Mastery - Fire Sword Creation"
  description: "Four agents work together to harvest volcanic materials and craft a fire-enchanted sword"

# Task objectives
objectives:
  primary: "Harvest volcanic materials and craft a fire-enchanted sword using volcanic forge"
  secondary: # checkpoints
    - "Establish extreme heat survival coordination"
    - "Execute volcanic harvesting and forge operations"
    - "Complete legendary crafting within 40 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a full volcanic expedition with mining and crafting objectives.

  OBJECTIVE: Create a fire-enchanted sword using volcanic forge and materials.

  MISSION REQUIREMENTS:
  - Navigate to Volcanic/Lava region (~200, 600)
  - Harvest volcanic ore and coal for smelting
  - Smelt materials into refined volcanic metal
  - Use volcanic forge to craft fire-enchanted sword
  - Survive extreme heat throughout operations

  TEAM COORDINATION:
  - Navigators establish safe routes
  - Miners extract volcanic materials
  - Smith operates the volcanic forge
  - All share healing for heat survival

  CRAFTING OPERATIONS:
  ⛏️ Volcanic Mining:
    - Harvest volcanic ore from lava deposits
    - Gather coal for fuel

  🔥 Volcanic Forge:
    - Smelt materials using volcanic heat
    - Craft fire-enchanted equipment

  DO NOT use complete() until fire sword is crafted!

# Limitations
max_action_steps: 40

