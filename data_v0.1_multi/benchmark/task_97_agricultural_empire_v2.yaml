# AgentWorld Multi-Agent Task Configuration
# VARIANT: Adjusted version - extended time limit to 65 rounds

task:
  name: "Agricultural Empire Development - Farming & Food Production (Extended Time)"
  description: "Fourteen agents establish a comprehensive agricultural system with fishing, hunting, gathering, cooking, and food distribution operations with more time"

# Task objectives
objectives:
  primary: "Establish agricultural empire producing 150+ food items across fishing, hunting, and cooking operations within 65 rounds"
  secondary:
    - "Phase 1 (Rounds 1-18): Resource Survey - Scout biomes for food sources and establish fishing operations"
    - "Phase 2 (Rounds 19-36): Mass Harvesting - Fish and hunt for 100+ raw ingredients"
    - "Phase 3 (Rounds 37-52): Industrial Cooking - Process 80+ cooked meals"
    - "Phase 4 (Rounds 53-65): Distribution Network - Distribute food empire-wide"

# Relevant game context (Hint)
relevant_game_context: |
  AGRICULTURAL EMPIRE PROJECT:

  Fourteen specialists must create a complete food production system from coastal fishing to distribution.

  AGRICULTURAL DIVISIONS:

  COASTAL FISHING FLEET (Agents 1-5) - Seafood Operations
  **Mission**: Establish coastal fishing operations for 60+ seafood
  **Starting Location**: Coastal Region (580, 750)

  **Team Composition**:
  - Agent 1 (Fleet Captain): Coordinate fishing operations
  - Agent 2 (Shrimp Fisher): Specialize in shrimp catches
  - Agent 3 (Deep Fisher): Hunt jellyfish and diverse catches
  - Agent 4 (Coastal Hunter): Catch crabs and coastal fish
  - Agent 5 (Harbor Master): Organize catch transfers

  **Fishing Targets**:
  - rawshrimp: 30+ (primary seafood)
  - jellyfish: 20+ (for smoothies)
  - crab: 10+ (supplementary)
  - Total: 60+ raw seafood items

  **Fishing Strategy**:
  - Scout coastal fishing spots: observe_environment radius=48
  - Use harvest_resource on fishSpots for rawshrimp
  - Hunt jellyfish in deeper water areas
  - Coordinate catches via chat: "[Fleet] Captain: 20/60 seafood collected"
  - Transfer to culinary team at (585, 752)

  PLAINS HUNTING TEAM (Agents 6-8) - Meat Production
  **Mission**: Hunt plains animals for 40+ meat items
  **Starting Location**: Plains Region (400, 300)

  **Team Composition**:
  - Agent 6 (Hunt Master): Lead hunting expeditions
  - Agent 7 (Tracker): Scout and hunt game animals
  - Agent 8 (Provision Carrier): Transport meat to kitchen

  **Hunting Targets** (flexible based on available mobs):
  - Priority: Hunt any food-dropping animals in plains/grassland
  - Look for: Roosters (rawchicken), Cows (rawbeef), or similar
  - Secondary: Hunt any mobs that drop food items
  - Total: 40+ meat/food items

  FOREST GATHERING CORPS (Agents 9-10) - Plant Collection
  **Mission**: Gather 30+ plant materials and berries
  **Starting Location**: Forest Region (388, 5)

  **Team Composition**:
  - Agent 9 (Foraging Expert): Lead plant gathering
  - Agent 10 (Herbalist): Collect herbs and berries

  **Gathering Targets** (flexible):
  - berries: 15+ (if available via foraging)
  - mushroom1: 10+ (if available)
  - Other forageable plants: 5+
  - Total: 30+ plant items

  CULINARY FACTORY (Agents 11-12) - Food Processing
  **Mission**: Cook 80+ prepared meals from raw ingredients
  **Starting Location**: Central Kitchen (400, 15)

  **Team Composition**:
  - Agent 11 (Master Chef): Lead all cooking operations
  - Agent 12 (Line Cook): Assist with mass food production

  **Cooking Products** (80+ total):
  - cookedshrimp: 25+ (from rawshrimp)
  - jellyfishsmoothie: 15+ (from jellyfish)
  - cookedchicken: 10+ (from rawchicken if available)
  - Other cooked foods: 30+ (from various ingredients)

  DISTRIBUTION NETWORK (Agents 13-14) - Food Delivery
  **Mission**: Distribute food across 3+ empire locations
  **Starting Location**: Central Hub (410, 20)

  **Team Composition**:
  - Agent 13 (Distribution Chief): Coordinate all deliveries
  - Agent 14 (Logistics Agent): Execute food transfers

  **Distribution Goals**:
  - Collect cooked food from Culinary Factory
  - Distribute to 3+ regional locations:
    * Coastal Post: (585, 752)
    * Plains Post: (405, 305)
    * Forest Post: (390, 8)
  - Ensure 30+ items delivered to each location
  - Maintain inventory tracking

  SUCCESS CRITERIA (ALL MUST BE MET):
  1. Coastal Fishing: 60+ seafood items caught (shrimp, jellyfish, crab)
  2. Plains Hunting: 40+ meat/food items hunted
  3. Forest Gathering: 30+ plant items gathered (flexible based on availability)
  4. Total Raw Ingredients: 130+ items collected
  5. Cooking Production: 80+ cooked meals prepared
  6. Total Food Produced: 150+ food items (raw + cooked)
  7. Distribution: Food delivered to 3+ regional locations
  8. Coordination: All divisions communicate effectively
  9. Time Management: Complete within 65 rounds

# Limitations
max_action_steps: 65

