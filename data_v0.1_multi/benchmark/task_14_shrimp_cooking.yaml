# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cooperative Shrimp Cooking - Seafood Culinary Team"
  description: "Three agents work together to prepare cooked shrimp through fishing, fuel gathering, and cooking"

# Task objectives
objectives:
  primary: "Prepare cooked shrimp through coordinated fishing operations and culinary preparation"
  secondary: # checkpoints
    - "Execute successful fishing operations for fresh seafood"
    - "Coordinate cooking fuel preparation and culinary setup"
    - "Complete seafood cooking within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent seafood cooking scenario requiring fishing and cooking expertise.
  
  OBJECTIVE: Prepare cooked shrimp through coordinated fishing operations and seafood culinary preparation.
  
  TEAM COORDINATION:
  - Use global chat to share fishing locations and cooking preparation progress
  - Coordinate between fishing operations and cooking fuel gathering
  - Share fresh seafood and cooking materials for culinary preparation
  - Work together to complete fresh seafood cooking chain
  
  GENERAL STRATEGY:
  - The team needs to catch fresh seafood from fishing locations
  - Someone needs to gather materials for cooking operations
  - Fresh seafood cooking requires proper fuel and cooking expertise
  - Coordinate fishing timing with cooking preparation for freshness
  - Balance fishing operations with cooking support activities
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  🎣 Fishing - raw shrimp:
    - harvest_resource on fishing spot instances to get rawshrimp
    - Level required: 1+ (Fishing skill)
    - Tool required: Fishing pole
  
  🍤 Cooking Recipe - cookedshrimp:
    - craft_item skill=Cooking itemKey=cookedshrimp
    - Materials: 1x rawshrimp → 1x cookedshrimp
    - Level required: 1 (Cooking skill)

# Limitations
max_action_steps: 25

