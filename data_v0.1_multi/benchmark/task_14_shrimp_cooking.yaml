# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cooperative Shrimp Cooking - Seafood Culinary Team"
  description: "Three agents work together to prepare cooked shrimp through fishing, fuel gathering, and cooking"

# Task objectives
objectives:
  primary: "Prepare cooked shrimp through coordinated fishing operations and culinary preparation"
  secondary: # checkpoints
    - "Execute successful fishing operations for fresh seafood"
    - "Coordinate cooking fuel preparation and culinary setup"
    - "Complete seafood cooking within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent seafood cooking scenario requiring fishing and cooking expertise.
  
  CRITICAL SUCCESS REQUIREMENTS:
  1. fisherman_agent MUST find fishing spots and catch raw shrimp
  2. fuel_gatherer_agent MUST collect materials for cooking fuel
  3. seafood_chef_agent MUST cook raw shrimp into cooked shrimp
  4. seafood_chef_agent MUST display the cooked shrimp and declare completion
  
  LOCATION STRATEGY:
  - Waterside areas for fishing operations
  - Resource areas for cooking fuel materials
  - Central cooking facility for seafood preparation
  - Communicate fishing and cooking progress through global chat
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  🎣 Fishing - raw shrimp:
    - harvest_resource on fishing spot instances to get rawshrimp
    - Level required: 1+ (Fishing skill)
    - Tool required: Fishing pole
  
  🍤 Cooking Recipe - cookedshrimp:
    - craft_item skill=Cooking itemKey=cookedshrimp
    - Materials: 1x rawshrimp → 1x cookedshrimp
    - Level required: 1 (Cooking skill)

# Limitations
max_action_steps: 25

# Agent configurations
agent_1:
  username: "fisherman_agent"
  new_character: true
  role: "Shrimp Fisherman"
  
  location:
    x: 147
    y: 628
  
  skill_levels:
    fishing: 25       # Required for shrimp fishing
    strength: 25
    health: 25
  
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "fishingpole"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Shrimp fisherman responsible for fresh seafood collection
    
    🎣 CRITICAL FISHING MISSION - CATCH FRESH SHRIMP!
    
    ABSOLUTE PRIORITIES:
    1. Find fishing spots near water bodies
    2. Catch raw shrimp for cooking preparation
    3. Secure fresh seafood for culinary team
    4. Transfer raw shrimp to seafood_chef_agent
    
    FISHING STRATEGY:
    1. observe_environment to search for fishing spots or water areas
    2. Look for fishing spot instances or water bodies with fish
    3. If not visible, move to different water areas:
       - move_character(x=350, y=650) for coastal fishing area
       - move_character(x=450, y=550) for lake fishing area
       - move_character(x=500, y=700) for river fishing zone
    4. harvest_resource on fishing spot instances to get rawshrimp
    5. Target: Catch 1-2x rawshrimp for cooking + backup
    6. Check inventory after each fishing attempt
    7. Use global chat every 2-3 actions to report fishing progress
    8. Once you have raw shrimp, coordinate with seafood_chef_agent
    9. Move to cooking facility for seafood transfer
    10. transfer_items to give rawshrimp to seafood_chef_agent (FRESH!)
    11. Wait for seafood_chef_agent to confirm shrimp receipt
    12. Support team until shrimp cooking is complete
    
    FISHING REQUIREMENTS:
    - Fishing skill level 1+ (you have 25) ✅
    - Fishing pole equipped ✅
    - Access to water bodies with fishing spots
    - Fresh seafood handling
    
    ERROR PREVENTION:
    - Verify fishing pole equipped before fishing
    - Look for water areas with fishing opportunities
    - Handle fresh seafood carefully - TIME SENSITIVE
    - REMEMBER: Fresh shrimp needs quick cooking!

agent_2:
  username: "fuel_gatherer_agent"
  new_character: true
  role: "Cooking Fuel Supplier"
  
  location:
    x: 200
    y: 300
  
  skill_levels:
    foraging: 20      # For fuel material gathering
    lumberjacking: 15 # For wood fuel if needed
    strength: 25
    health: 25
  
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "axe"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Cooking fuel supplier responsible for culinary fuel preparation
    
    🔥 CRITICAL FUEL SUPPLY MISSION - GATHER COOKING MATERIALS!
    
    ABSOLUTE PRIORITIES:
    1. Collect materials for cooking fuel preparation
    2. Secure wood or other combustible materials
    3. Provide fuel support for seafood cooking
    4. Coordinate with cooking operations
    
    FUEL GATHERING STRATEGY:
    1. observe_environment to search for fuel materials
    2. Look for wood sources (trees) or other cooking fuel materials
    3. If trees available, cut logs for cooking fuel:
       - harvest_resource on oak tree instances to get logs
    4. If no trees, move to different areas:
       - move_character(x=150, y=350) for forest fuel area
       - move_character(x=250, y=250) for wood resource area
       - move_character(x=300, y=400) for material gathering zone
    5. Collect fuel materials as available in environment
    6. Check inventory after each fuel gathering attempt
    7. Use global chat to report fuel gathering progress
    8. Coordinate with seafood_chef_agent for cooking support
    9. Stand by to provide additional fuel materials if needed
    10. Support cooking operations until shrimp preparation complete
    
    FUEL SUPPLY REQUIREMENTS:
    - Material gathering capabilities
    - Support for cooking operations
    - Coordination with chef operations
    
    ERROR PREVENTION:
    - Gather available fuel materials in environment
    - Support chef with material needs
    - Coordinate with cooking timeline
    - REMEMBER: Good cooking needs proper fuel support!

agent_3:
  username: "seafood_chef_agent"
  new_character: true
  role: "Seafood Cooking Specialist"
  
  location:
    x: 183
    y: 312
  
  skill_levels:
    cooking: 20       # Required for shrimp cooking (level 1+)
    fishing: 10       # Seafood knowledge
    strength: 20
    health: 25
  
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Seafood cooking specialist responsible for shrimp preparation
    
    🍤 PRIORITY ACTIONS:
    1. Coordinate with fisherman_agent for fresh shrimp delivery
    2. Set up cooking operations with fuel_gatherer_agent support
    3. Cook raw shrimp into delicious cooked shrimp
    4. Quality control and seafood presentation
    
    SEAFOOD COOKING COORDINATION:
    1. send global chat message announcing seafood kitchen readiness
    2. Monitor progress from fisherman_agent for fresh shrimp
    3. Coordinate with fuel_gatherer_agent for cooking support
    4. Receive fresh shrimp from fisherman_agent
    5. Set up cooking operations for seafood preparation
    
    CRITICAL SEAFOOD COOKING STEPS:
    6. observe_environment to CHECK YOUR INVENTORY after shrimp transfer
    7. VERIFY you have 1x rawshrimp in your inventory
    8. ONLY AFTER verifying fresh shrimp, use craft_item:
       📋 RECIPE: craft_item skill=Cooking itemKey=cookedshrimp (1x rawshrimp → 1x cookedshrimp)
    9. WAIT for craft_item result - confirm "Successfully crafted" message
    10. observe_environment to verify cookedshrimp in inventory
    11. Use global chat to announce successful shrimp cooking
    12. Display cooked shrimp for team verification
    13. complete() ONLY after successful seafood cooking
    
    SEAFOOD COOKING REQUIREMENTS:
    ✅ 1x rawshrimp (from fisherman_agent) - FRESH SEAFOOD
    ✅ Cooking skill level 1+ (you have level 20)
    ✅ Support from fuel_gatherer_agent
    
    ERROR PREVENTION:
    - Handle fresh shrimp quickly - minimize time between catch and cook
    - Verify cooking skill meets requirements
    - Coordinate with fuel supplier for cooking support
    - REMEMBER: Fresh seafood requires prompt cooking!

# Success criteria for multi-agent task
success_criteria:
  - "fisherman_agent successfully catches and transfers fresh shrimp"
  - "fuel_gatherer_agent successfully provides cooking support"
  - "seafood_chef_agent receives shrimp and cooks successfully"
  - "seafood_chef_agent successfully prepares cooked shrimp"
  - "All agents coordinate seafood operations effectively"
  - "Fresh seafood cooking completes within time limit"
