# AgentWorld Multi-Agent Task Configuration

task:
  name: "Ultimate Boss Challenge - Multi-Region Legendary Conquest"
  description: "Three agents work together to conquer multiple high-level bosses across different regions, culminating in the ultimate test of coordination and combat mastery"

# Task objectives
objectives:
  primary: "Successfully defeat multiple legendary bosses across different regions and claim ultimate mastery of AgentWorld"
  secondary: # checkpoints
    - "Establish multi-region coordination and legendary boss reconnaissance"
    - "Execute coordinated legendary boss combat across multiple biomes"
    - "Complete ultimate conquest within 40 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is the ultimate cooperative multi-agent challenge requiring mastery of all game systems and perfect coordination.
  
  OBJECTIVE: Defeat multiple legendary bosses across different regions to prove ultimate mastery of AgentWorld.
  
  MISSION REQUIREMENTS:
  - Defeat Mermaid (Level 55) in Coastal/Ocean region (580, 755)
  - Defeat Ice Knight (Level 62) in Castle/Fortress region (712, 717)
  - Defeat multiple high-level Mimic creatures (Level 84) in Wilderness regions
  - Navigate between multiple dangerous regions efficiently and safely
  
  TEAM COORDINATION:
  - Use global chat for complex multi-region coordination and boss status updates
  - Coordinate between region traversal, boss combat, and resource management
  - Share advanced equipment and provide maximum combat support
  - Work together to handle the most challenging encounters in the game
  
  GENERAL STRATEGY:
  - This is the ultimate test requiring perfect coordination and advanced skills
  - Multiple high-level bosses (Level 55-84) require expert combat coordination
  - Multi-region travel requires efficient route planning and resource management
  - Each boss has unique abilities requiring adaptive combat strategies
  - Balance speed with thorough preparation for each legendary encounter
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  ULTIMATE BOSS COMBAT MASTERY (CRITICAL KNOWLEDGE):
  🧜‍♀️ Legendary Combat - Mermaid (Level 55):
    - Location: Coastal/Ocean region at coordinates (580, 755)
    - Expect water-based attacks, healing abilities, and high mobility
    - Use coordinated land-based attacks and magical support
    - Mermaid may have aquatic terrain advantages
  
  ❄️ Elite Combat - Ice Knight (Level 62):
    - Location: Castle/Fortress region at coordinates (712, 717)
    - Expect heavy armor, ice attacks, and fortress defender bonuses
    - Use fire-based attacks and coordinated flanking maneuvers
    - Fortress combat requires tactical positioning
  
  👹 Master Combat - Mimic Creatures (Level 84):
    - Locations: Multiple Wilderness regions (677,671), (855,611), (460,725)
    - Highest level regular creatures in the game
    - Expect shapeshifting, surprise attacks, and extreme durability
    - Require maximum coordination and advanced equipment
  
  🌍 Multi-Region Navigation:
    - Plan efficient routes between distant boss locations
    - Manage resources for extended multi-region expedition
    - Use warps and fast travel when available
    - Coordinate timing for simultaneous boss engagements
  
  ⚔️ Ultimate Combat Strategy:
    - Each agent specializes in different aspects of multi-boss combat
    - Coordinate equipment sharing for optimal boss matchups
    - Use environmental advantages specific to each region
    - Plan retreat and regrouping strategies for failed attempts

# Limitations
max_action_steps: 40

