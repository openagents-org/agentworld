# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Only harvest Ice Oak logs, no combat required

task:
  name: "Ice Cavern Challenge - Frozen Lumber Gathering"
  description: "Two agents work together to harvest rare Ice Oak logs from frozen regions"

# Task objectives
objectives:
  primary: "Successfully harvest 4x Ice Oak logs from frozen biome"
  secondary: # checkpoints
    - "Navigate to frozen ice region"
    - "Complete frozen lumber gathering within 20 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a simplified ice region expedition focusing on resource gathering.

  OBJECTIVE: Harvest rare Ice Oak logs from frozen areas.

  MISSION REQUIREMENTS:
  - Navigate to Frozen/Ice region (228-260, 151-156)
  - Locate and harvest Ice Oak trees
  - Collect 4x Ice Oak logs total
  - Manage freezing environmental damage

  TEAM COORDINATION:
  - Both agents focus on lumberjacking
  - Share healing supplies for cold damage
  - Coordinate efficient harvesting routes

  RESOURCE GATHERING:
  🌲 Lumberjacking - Ice Oak:
    - harvest_resource on Ice Oak Tree instances
    - Level required: 20+ (Lumberjacking skill)
    - Target: 4x iceoaklogs total

  🧊 Environmental Hazards:
    - Freezing causes continuous cold damage
    - Use healing items frequently

  DO NOT use complete() until 4x iceoaklogs are collected!

# Limitations
max_action_steps: 20

