# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Simplified 6-agent boss hunting expedition

task:
  name: "Elite Dragon Hunt Expedition - Core Boss Campaign"
  description: "Six elite warriors hunt bosses across 3 biomes, culminating in a dragon battle"

# Task objectives
objectives:
  primary: "Complete a boss hunting campaign where 6 agents travel across 3 biomes, defeat 2-3 bosses, and defeat a dragon"
  secondary:
    - "Phase 1 (Rounds 1-8): Equipment Preparation & Team Assembly"
    - "Phase 2 (Rounds 9-18): Forest Expedition - Hunt forest boss"
    - "Phase 3 (Rounds 19-28): Mountain Assault - Hunt mountain boss"
    - "Phase 4 (Rounds 29-38): Dragon Hunt Finale"

# Relevant game context
relevant_game_context: |
  EXPEDITION STRUCTURE (~38 ROUNDS)
  - Six warriors run four phases: prep -> forest boss -> mountain boss -> dragon finale.
  - Phase 1: gather logs/ores, smelt ~10 iron bars, craft heavy swords, stock >=35 heals.
  - Phase 2: travel to forest (~200,400), defeat a L15-20 boss.
  - Phase 3: travel to mountain (~238,48), beat a L25-30 boss.
  - Phase 4: scout for dragon, execute coordinated assault.

  EXECUTION NOTES
  - Tanks initiate attack_entity, DPS follows, supports heal.
  - Stay within 15 tiles during combat.
  - Heal to >=85% HP before engaging any boss.
# Limitations
max_action_steps: 38

