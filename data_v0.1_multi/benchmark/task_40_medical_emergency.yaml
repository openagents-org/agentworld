# AgentWorld Multi-Agent Task Configuration

task:
  name: "Medical Emergency Response - Healthcare Coordination and Life Support Operations"
  description: "Three agents work together to establish emergency medical operations, coordinate healthcare services, and provide life support assistance"

# Task objectives
objectives:
  primary: "Successfully establish emergency medical operations, coordinate healthcare services, and provide effective life support assistance"
  secondary: # checkpoints
    - "Establish medical coordination and emergency response preparation"
    - "Execute coordinated healthcare operations and medical assistance procedures"
    - "Complete medical emergency response within 35 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent medical emergency response scenario requiring healthcare coordination and life support skills.
  
  OBJECTIVE: Establish emergency medical operations, coordinate healthcare services, and provide effective life support assistance.
  
  MISSION REQUIREMENTS:
  - Establish medical operations in suitable areas for emergency response
  - Coordinate medical assistance and healthcare services for team members and others
  - Provide life support assistance and emergency medical care using available resources
  - Develop sustainable medical response systems for ongoing healthcare needs
  
  TEAM COORDINATION:
  - Use global chat for complex medical coordination and emergency response updates
  - Coordinate between medical assistance, resource management, and emergency response
  - Share medical knowledge and provide support during healthcare operations
  - Work together to handle medical emergencies and coordinate healthcare delivery
  
  GENERAL STRATEGY:
  - This requires resource management skills and medical coordination knowledge
  - Medical operations need efficient resource utilization and coordinated response
  - Healthcare services require coordinated assistance and mutual support
  - Emergency response needs quick decision-making and effective team coordination
  - Balance immediate medical needs with long-term healthcare sustainability
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  MEDICAL EMERGENCY RESPONSE OPERATIONS (CRITICAL KNOWLEDGE):
  🏥 Medical Operations Setup:
    - Use observe_environment to scout areas suitable for medical operations and emergency response
    - Establish medical coordination positions for healthcare service delivery
    - Navigate operational areas while maintaining team safety and medical readiness
    - Coordinate medical activities to optimize healthcare effectiveness and response time
  
  🚑 Emergency Response Coordination:
    - Use available resources for emergency medical assistance and life support
    - Focus on efficient resource utilization for medical operations and healthcare delivery
    - Coordinate emergency response activities to maximize medical effectiveness
    - Practice emergency procedures and medical coordination techniques
  
  📊 Healthcare Service Management:
    - Use available skills for healthcare coordination and medical assistance
    - Coordinate medical resource sharing and distribution among team members
    - Focus on sustainable healthcare practices and medical resource conservation
    - Balance immediate medical needs with long-term healthcare planning
  
  🩹 Life Support Operations:
    - Use observe_environment to identify medical needs and emergency situations
    - Coordinate life support assistance and emergency medical care
    - Practice team medical strategies using available resources and skills
    - Execute coordinated medical operations and provide mutual healthcare support
  
  🎯 Medical Coordination Strategy:
    - Use coordinated medical techniques for effective emergency response
    - Practice efficient healthcare management and resource coordination
    - Focus on developing medical response capabilities through team coordination
    - Use safety-first approaches during medical emergency operations

