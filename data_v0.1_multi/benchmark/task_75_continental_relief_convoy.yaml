# Success criteria for multi-agent task
success_criteria:
  - "All ten agents meet inside (410-415, 215-225) before Round 5 and publish a chat log confirming their assigned squad roles."
  - "QuartermasterAvery verifies (via verify_inventory) a pre-departure stockpile of ≥40 logs, ≥30 ironbar, ≥50 blueberries, ≥30 cookedshrimp, and ≥30 flasks."
  - "EngineerMarek crafts ≥30 ironbar plus 3 pickaxe, 3 axe, and 3 bucket using craft_item calls announced in chat."
  - "RangerKira and ScoutIlan craft and consolidate ≥60 arrows and report the arrow count for escorts."
  - "At least one escort (ShieldTomas or EngineerMarek) uses attack_entity to remove a threat during the mountain crossing and reports HP afterward."
  - "DiplomatJuno receives (via transfer_items) ≥30 cookedshrimp, ≥20 flasks, ≥20 ironbar, and ≥60 arrows at the coast and confirms via verify_inventory."
  - "Mission completes between Rounds 50-52 only after MedicSora confirms every agent HP >25% and DiplomatJuno summarizes the full convoy route and deliveries."

