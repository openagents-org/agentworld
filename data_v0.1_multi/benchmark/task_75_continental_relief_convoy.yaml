# AgentWorld Multi-Agent Task Configuration

task:
  name: "Continental Relief Convoy - Multi-Region Aid Escort"
  description: "Ten specialists assemble, fabricate supply crates, and escort them from the central farmlands to the flooded coast over ~52 rounds"

# Task objectives
objectives:
  primary: "Deliver consolidated medical and engineering supplies to the coastal refugee pier after executing a four-phase convoy plan in 50-52 rounds"
  secondary:
    - "Phase 1 (Rounds 1-12): Stage at (410-420, 215-225) and gather logs, ore, coal, shrimp, berries"
    - "Phase 2 (Rounds 13-26): Smelt 30 iron bars, craft repair tools, cook 30 meals, bundle aid kits"
    - "Phase 3 (Rounds 27-40): Move the convoy across mountains with scouts, payload, rearguard"
    - "Phase 4 (Rounds 41-52): Hand off supplies at (175-190, 634-640), verify inventories, summarize route"

# Relevant game context
relevant_game_context: |
  MISSION FLOW (≈52 ROUNDS)
  - Phase 1: gather quotas near the staging farm (410,220) — ≥30 iron + ≥30 coal, ≥40 logs + ≥40 feathers, ≥20 rawshrimp, ≥50 berries/tomatoes — and transfer them to QuartermasterAvery with verify_inventory confirmations.
  - Phase 2: in camp, EngineerMarek smelts 30+ iron bars and forges pickaxes/axes/buckets; RangerKira + ScoutIlan craft sticks → 60 arrows; CookEmil prepares 30 cookedshrimp; Quartermaster aggregates crates (logs, bars, food, flasks) while DiplomatJuno posts the manifest in chat.
  - Phase 3: split into vanguard/payload/rearguard columns, leapfrog via move_character hops ≤32 tiles, regroup every two hops for verify_inventory, and only advance after scouts clear threats with attack_entity; log checkpoints at the mountains and foothills.
  - Phase 4: reach the coastal pier (~185,637), set a perimeter, transfer aid crates from Quartermaster to Diplomat (cookedshrimp, flasks, iron bars, arrows, tools), double-check HP >25%, and broadcast a delivery summary before complete().

  EXECUTION NOTES
  - Always call observe_environment before harvesting in a new area or before each convoy hop; if the tool is unavailable, physically scout the tile range and report coordinates.
  - Transfers only count when both agents confirm via verify_inventory; Quartermaster should keep running totals in chat (“Iron bars 32, Meals 34, Arrows 60”).
  - During movement, payload agents never stray >10 tiles from either escort column; if mobs spawn mid-hop, escorts fight while the payload waits.
# Limitations
max_action_steps: 52

