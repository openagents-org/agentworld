  primary: "Successfully defeat the Mermaid (Level 55) boss in coordinated combat"
  secondary: # checkpoints
    - "Navigate to coastal region"
    - "Defeat Mermaid within 20 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a simplified boss challenge focusing on Mermaid combat.

  OBJECTIVE: Defeat the Mermaid boss in the coastal region.

  MISSION REQUIREMENTS:
  - Navigate to Coastal/Ocean region (580, 755)
  - Locate and engage the Mermaid boss
  - Defeat Mermaid using coordinated attacks
  - Agents already start near the boss location

  TEAM COORDINATION:
  - Both agents focus on combat
  - Coordinate magical and physical attacks
  - Share healing resources

  COMBAT KNOWLEDGE:
  🧜‍♀️ Legendary Combat - Mermaid (Level 55):
    - Location: Coastal/Ocean region (580, 755)
    - Expect water-based attacks and healing abilities
    - Use coordinated land-based attacks

  DO NOT use complete() until Mermaid is defeated!

# Limitations
