# AgentWorld Multi-Agent Task Configuration

task:
  name: "Magical Research Institute - Five-Mage Elemental Staff Workshop"
  description: "Five magical specialists work together to create multiple elemental staffs through coordinated resource gathering, component crafting, and magical enhancement"

# Task objectives
objectives:
  primary: "Establish a magical research institute with five mages to produce multiple elemental staffs and magical equipment"
  secondary: # checkpoints
    - "Coordinate five-mage resource gathering across magical materials"
    - "Execute multi-stage magical crafting pipeline"
    - "Produce multiple elemental staffs through team coordination"
    - "Complete magical research objectives within 35 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  OVERVIEW
  - Five mages run a compact workshop. Gather 4 logs, turn them into 16 sticks, craft three base staffs, then upgrade two into lightning/nature staffs. Everyone already holds the needed beads (5 regular + lightning + nature), so only lumber and coordination are required.

  MATERIAL FLOW
  1. Logs → sticks: harvest_resource on nearby oaks, then craft_item skill=Fletching itemKey=stick (four crafts produce 16 sticks).
  2. Sticks + beads → base staffs: craft_item skill=Crafting itemKey=staff consumes 5 sticks + 1 bead. Repeat three times.
  3. Elemental upgrades: hand a base staff to LightningEnchanter with the lightningbead to craft lightningstaff, and another to MasterCoordinator with the naturebead to craft naturestaff. Keep one base staff untouched.

  ROLES (ADAPT AS NEEDED)
  - ForestArcanist & ComponentSpecialist: harvest logs, convert to sticks, and transfer materials to StaffAssembler.
  - StaffAssembler: receives sticks + beads, forges base staffs, redistributes them immediately.
  - LightningEnchanter & MasterCoordinator: wait for their base staffs, attach the elemental beads, and confirm completion.

  COORDINATION RULES
  - Stay within transfer range; always use transfer_items and verify_inventory confirmations.
  - Use global chat to publish inventory snapshots ("Assembler: 10 sticks, 2 beads ready").
  - Work in parallel: once the first base staff is ready, send it to LightningEnchanter while additional staffs are crafted.

  COMPLETION CHECKLIST
  - 4 logs harvested, ≥15 sticks crafted, three base staffs produced.
  - Final inventory shows 1 base staff, 1 lightningstaff, 1 naturestaff.
  - Chat log includes confirmations for each transfer and craft.
  - Call complete() only when all staffs are verified and the team is regrouped near the workshop.
# Limitations
max_action_steps: 35

