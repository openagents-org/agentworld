# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Extended 12-agent quad-pylon energy empire

task:
  name: "Cryothermal Grid Stabilization - Grand Energy Empire"
  description: "Twelve specialists connect ice, lava, coastal, and volcanic resources by building four synchronized pylons"

# Task objectives
objectives:
  primary: "Stabilize the grand cryothermal grid by collecting resources and activating pylons at 4 locations within 65 rounds"
  secondary:
    - "Phase 1 (Rounds 1-14): Ice squad harvests icelogs and icebeads"
    - "Phase 2 (Rounds 1-14): Lava squad harvests bloodwoodlogs and firebeads"
    - "Phase 3 (Rounds 15-30): Alloy squads mine and smelt 20 ironbar, craft 4 silverring connectors"
    - "Phase 4 (Rounds 31-45): Coastal squad collects lightningbeads from coastal mobs"
    - "Phase 5 (Rounds 46-55): Craft four elemental staffs"
    - "Phase 6 (Rounds 56-65): Assembly and activate four pylons sequentially"

# Relevant game context
relevant_game_context: |
  WORKFLOW SNAPSHOT
  - Agents 1-3 (Ice Stabilizers) harvest ice resources.
  - Agents 4-6 (Lava Stabilizers) control heat vents and collect bloodwood + firebeads.
  - Agents 7-9 (Metalworks) gather ores, smelt bars, craft staffs and rings.
  - Agents 10-12 (Grid Pilots) coordinate installation and activation.

  KEY TASK DETAILS
  1. Ice squad harvests >=16 icelogs + >=4 icebeads.
  2. Lava squad harvests >=16 bloodwoodlogs + >=4 firebeads.
  3. Coastal squad secures >=2 lightningbeads.
  4. Metalworks smelts 20 ironbar, crafts 4 silverring + 4 staffs.
  5. Activate pylons at North, Central-East, Central-West, South positions.
# Limitations
max_action_steps: 65

