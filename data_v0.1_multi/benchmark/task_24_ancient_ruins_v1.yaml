# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Only defeat Golden Golem, no spider boss

task:
  name: "Ancient Ruins Exploration - Golden Golem Hunt"
  description: "Two agents work together to explore ancient ruins and defeat the Golden Golem guardian"

# Task objectives
objectives:
  primary: "Successfully explore ancient ruins and defeat the Golden Golem guardian"
  secondary: # checkpoints
    - "Navigate to Ancient Ruins region"
    - "Defeat Golden Golem within 20 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a simplified archaeological expedition focusing on one boss.

  OBJECTIVE: Explore ancient ruins and defeat the Golden Golem guardian.

  MISSION REQUIREMENTS:
  - Navigate to Ancient Ruins region (~775, 665)
  - Locate the Golden Golem at coordinates (784, 676)
  - Defeat the Golden Golem guardian
  - No need to defeat Big Baby Spooder

  TEAM COORDINATION:
  - Two combat agents work together
  - Coordinate physical and magical attacks
  - Share healing resources

  COMBAT KNOWLEDGE:
  🥇 Combat - Golden Golem:
    - Location: coordinates (784, 676)
    - Despite Level 0, may have special defensive properties
    - Coordinate attacks to test weaknesses

  DO NOT use complete() until Golden Golem is defeated!

# Limitations
max_action_steps: 20

