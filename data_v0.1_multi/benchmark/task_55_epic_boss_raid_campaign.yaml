# AgentWorld Multi-Agent Task Configuration

task:
  name: "Epic Boss Raid Campaign - Extended Multi-Boss Conquest Journey"
  description: "Three elite warriors embark on an extended boss raid campaign, defeating multiple bosses across regions with preparation phases between encounters"

# Task objectives
objectives:
  primary: "Complete an EXTENDED 7-phase boss raid campaign with crafting, resource gathering, and 4 boss battles spanning 50 rounds"
  secondary: # checkpoints (7 phases)
    - "Phase 1 (Rounds 1-10): Equipment Preparation - Craft weapons and tools"
    - "Phase 2 (Rounds 11-15): First Boss - Defeat Goblin"
    - "Phase 3 (Rounds 16-23): Resource Expansion - Gather advanced materials"
    - "Phase 4 (Rounds 24-30): Second Boss - Defeat Skeleton"
    - "Phase 5 (Rounds 31-37): Weapon Upgrades - Craft enhanced equipment"
    - "Phase 6 (Rounds 38-44): Third Boss - Defeat Ogre"
    - "Phase 7 (Rounds 45-50): Final Boss - Defeat Spectre or Ice Guardian"
    - "Complete ALL 7 phases in sequence over 45-50 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  RAID ROADMAP (50 ROUNDS, 7 PHASES)
  1. R1-10 Prep: cut 5 logs, mine 10 iron + 10 coal at (230,38), smelt 10 bars, craft 2 heavy swords + 1 pickaxe, stock healing items.
  2. R11-15 Goblin: travel (~350,250), locate a level 10-15 goblin via observation/mob list, ensure HP>80%, all three attack_mob the same ID.
  3. R16-23 Recovery/loot run: heal to >90%, gather bonus materials (gold or gems) and extra food; share totals in chat.
  4. R24-30 Skeleton: hunt cemetery/dungeon zones (~200,100 or 350,200), repeat synchronized attack procedure.
  5. R31-37 Upgrades: mine/smelt another batch (≈5 bars) for replacement axes or shields and bring total healing items above 30.
  6. R38-44 Ogre: head back near (238,48), run full ready check (HP>90%, healing stocked) before attacking.
  7. R45-50 Final boss: Spectre (≈230,30) or Ice Guardian (≈259,151). Everyone must be at 100% HP with ≥5 heals, attack simultaneously, then record victory logs.

  EXECUTION RULES
  - After every phase, post “Phase X complete – [summary]”. Use transfer_items to funnel ore/bars to whoever crafts. attack_mob is preferred for bosses so loot and combat reporting are automatic.
  - Never engage a boss with HP<80%; if supplies dip, pause the campaign and restock even if it delays the schedule.
  - Minimum success still requires Phase 1 gear, at least three bosses (Goblin, Ogre, Final), and the run lasting ≥40 rounds.

  COMPLETION CHECK
  - By Round 48-50 each agent states: crafted gear, bosses defeated, current HP/healing. Only after all confirm may one agent call complete() summarizing all seven phases.
# Limitations
max_action_steps: 50

