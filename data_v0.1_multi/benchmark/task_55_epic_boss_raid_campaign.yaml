# AgentWorld Multi-Agent Task Configuration

task:
  name: "Epic Boss Raid Campaign - Extended Multi-Boss Conquest Journey"
  description: "Three elite warriors embark on an extended boss raid campaign, defeating multiple bosses across regions with preparation phases between encounters"

# Task objectives
objectives:
  primary: "Complete an EXTENDED 7-phase boss raid campaign with crafting, resource gathering, and 4 boss battles spanning 50 rounds"
  secondary: # checkpoints (7 phases)
    - "Phase 1 (Rounds 1-10): Equipment Preparation - Craft weapons and tools"
    - "Phase 2 (Rounds 11-15): First Boss - Defeat Goblin"
    - "Phase 3 (Rounds 16-23): Resource Expansion - Gather advanced materials"
    - "Phase 4 (Rounds 24-30): Second Boss - Defeat Skeleton"
    - "Phase 5 (Rounds 31-37): Weapon Upgrades - Craft enhanced equipment"
    - "Phase 6 (Rounds 38-44): Third Boss - Defeat Ogre"
    - "Phase 7 (Rounds 45-50): Final Boss - Defeat Spectre or Ice Guardian"
    - "Complete ALL 7 phases in sequence over 45-50 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is an epic extended cooperative multi-agent boss raid requiring long-term planning and multiple boss encounters.
  
  🚨 CRITICAL AWARENESS - BOSS RAID CAMPAIGN:
  - ALWAYS use verify_inventory to check HP/MP before combat
  - ALWAYS use chat to coordinate boss attacks
  - Use observe_environment radius=64 to find bosses
  - Use attack_mob for boss combat (system handles entire battle)
  - NEVER engage boss if HP < 80% - use healing items first
  - Team must attack SAME boss simultaneously for coordinated assault
  - This is COMBAT-FOCUSED - prioritize staying alive over perfect execution
  
  📍 STARTING LOCATION: (350-354, 300-304) - Central combat zone
  
  ⚠️ REALISTIC BOSS RAID EXPECTATIONS:
  - Boss locations are approximate - may need to search
  - Some bosses may not spawn or may be too high level
  - If a boss is not found, search nearby or try different boss type
  - If team is low on HP, SKIP a boss phase and focus on final boss
  - Survival more important than defeating ALL bosses
  - Minimum requirement: Defeat at least 1-2 bosses total
  
  EPIC OBJECTIVE: Complete an EXTENDED multi-phase boss raid campaign spanning 50 rounds:
  1. Phase 1 (Rounds 1-10): Equipment Preparation - Craft essential combat gear
  2. Phase 2 (Rounds 11-15): First Boss - Defeat Goblin (Level 10-15)
  3. Phase 3 (Rounds 16-23): Resource Expansion - Gather advanced materials
  4. Phase 4 (Rounds 24-30): Second Boss - Defeat Skeleton (Level 15-20)
  5. Phase 5 (Rounds 31-37): Weapon Upgrades - Craft superior weapons
  6. Phase 6 (Rounds 38-44): Third Boss - Defeat Ogre (Level 25+)
  7. Phase 7 (Rounds 45-50): Final Boss - Defeat Spectre or Ice Guardian (Level 35+)
  
  ⚠️ CRITICAL: This is a LONG campaign - each phase has specific requirements!
  - DO NOT skip to bosses without completing preparation phases
  - Each phase builds on the previous phase
  - Agents must craft equipment, not just use starting gear
  
  EXTENDED RAID CAMPAIGN STRUCTURE:
  
  PHASE 1 - EQUIPMENT PREPARATION (Rounds 1-10):
  🎯 MANDATORY Objectives:
    - Gather 5+ logs from Oak trees for weapon crafting
    - Mine 10+ iron ore and 10+ coal for metal equipment
    - Smelt 10+ iron bars
    - Craft 2x Heavy Swords (better than starting weapons)
    - Craft 1x Pickaxe for mining efficiency
    - Gather 20+ healing items (hunt animals, forage plants)
  
  📋 WHY THIS IS NECESSARY:
    - Starting weapons are NOT sufficient for 4 boss battles
    - Team needs upgraded equipment to survive extended campaign
    - This phase establishes resource pipeline for later phases
  
  🪓 HOW TO GATHER LOGS (Need 5+):
    1. Team starts at (350-354, 300-304)
    2. Travel to forest area around (250, 350) - Oak trees abundant
    3. Use observe_environment radius=32 to find Oak Tree instances
    4. Use harvest_resource targetInstance=<tree_instance>
    5. Each agent should harvest 2+ logs (distribute workload)
    6. Use chat to track: "Harvested X logs, team total: Y/5"
  
  ⛏️ HOW TO MINE ORES (Need 10+ each):
    1. Travel to mountain mining region (230, 38)
    2. Use observe_environment radius=32 to locate iron rock and coal rock
    3. Use harvest_resource targetInstance=<rock_instance>
    4. RaidTank and RaidDPS focus on iron ore (need Mining 10+)
    5. All agents can mine coal (need Mining 1+)
    6. Use chat: "Mined X iron, Y coal. Team total: A/10 iron, B/10 coal"
  
  🔥 HOW TO SMELT BARS (Need 10+):
    1. Consolidate ALL ore and coal with one agent (recommend RaidTank)
    2. Use transfer_items targetPlayer=RaidTank itemKey=ironore count=<amount>
    3. Use transfer_items targetPlayer=RaidTank itemKey=coal count=<amount>
    4. RaidTank: verify_inventory to confirm materials
    5. Function: craft_item skill=Smelting itemKey=ironbar
    6. Materials: 1x ironore + 1x coal → 1x ironbar
    7. Call 10+ times to create bars
    8. Use chat after each batch: "Smelted X bars, total: Y/10"
  
  🔨 HOW TO CRAFT WEAPONS (Need 2x Heavy Swords):
    1. RaidTank already has hilt2 in starting inventory? Check with verify_inventory
    2. If not, team needs to find/craft hilts
    3. Transfer 4x ironbar and 2x hilt2 to crafter
    4. Function: craft_item skill=Smithing itemKey=sword2
    5. Materials: 2x ironbar + 1x hilt2 → 1x Heavy Sword
    6. Craft 2x swords for main fighters
    7. Use equip_item to equip the new weapons
  
  ⏱️ TIME ALLOCATION:
    - Rounds 1-3: Travel to forest, gather logs
    - Rounds 4-6: Travel to mountains, mine ores
    - Rounds 7-8: Smelt bars
    - Rounds 9-10: Craft weapons and verify readiness
  
  PHASE 2 - FIRST BOSS: GOBLIN (Rounds 11-15):
  🎯 Objectives:
    - Travel to Goblin territory
    - Scout and locate Goblin boss (Level 10-15)
    - Execute coordinated attack
    - Defeat Goblin and collect loot
    - Assess team condition for Phase 3
  
  📍 HOW TO LOCATE GOBLIN:
    1. From mountains (230, 38), travel to forest/plains (350, 250)
    2. Distance: ~200 tiles - will take 1-2 rounds of movement
    3. Use observe_environment radius=64 to search for goblin
    4. Look in mobs array for "goblin" with level 10-15
    5. If not found, expand search radius or try nearby areas
    6. Use chat to coordinate: "Searching sector (X,Y), no goblin yet" or "Goblin found at (X,Y)!"
  
  👺 HOW TO FIGHT GOBLIN BOSS:
    1. Before engaging - MANDATORY checks:
       - All agents chat: "Ready? HP: X/Y, Position: (A,B)"
       - All HP must be > 80%
       - All agents within 15 tiles of goblin
    2. Attack sequence:
       - RaidTank: attack_mob targetInstance=<goblin_instance>
       - RaidDPS: attack_mob targetInstance=<same_instance>
       - RaidSupport: attack_mob targetInstance=<same_instance>
    3. System handles battle automatically
    4. After victory:
       - Use verify_inventory to check loot
       - Use chat: "Goblin defeated! HP: X/Y. Loot: [list items]"
       - Rest 1 round before Phase 3
  
  ⏱️ TIME ALLOCATION:
    - Rounds 11-12: Travel to goblin area, scout location
    - Round 13: Locate goblin, coordinate attack
    - Rounds 14-15: Fight goblin, recover, prepare for Phase 3
  
  PHASE 3 - RESOURCE EXPANSION (Rounds 16-23):
  🎯 MANDATORY Objectives:
    - Recover from first boss (heal to >90% HP)
    - Gather 10+ additional healing items
    - Mine 5+ gold ore (if available) for advanced equipment
    - Gather 3+ special materials (gems, beads) for enchantments
    - Craft protective equipment (shields, better armor if possible)
    - Scout second boss location
  
  ❤️ HOW TO RECOVER AND HEAL:
    1. After Goblin fight, all agents check HP
    2. Use chat: "HP: X/Y after Goblin. Need healing: Yes/No"
    3. Consume healing items to restore HP > 90%:
       - Apple: heals 50-80 HP each
       - Flask: heals 200+ HP each
    4. If low on healing items, hunt 3-5 low-level creatures for drops
    5. Use verify_inventory to check healing item count
  
  💎 HOW TO GATHER ADVANCED MATERIALS:
    1. Gold ore (optional but recommended):
       - Search mountain areas for gold rock instances
       - Need Mining 25+ to harvest gold
       - Use harvest_resource targetInstance=<gold_rock>
       - Target: 5+ gold ore for advanced rings
    2. Gems and special materials:
       - Hunt mid-level creatures (Level 10-20) for drops
       - Check loot from boss fights
       - Foragespecial plants for beads/materials
    3. Use chat to track: "Found X gold ore, Y special materials"
  
  🛡️ HOW TO CRAFT PROTECTIVE EQUIPMENT (Optional):
    1. If have extra iron bars, craft silver rings:
       - Function: craft_item skill=Smithing itemKey=silverring
       - Materials: 2x ironbar → 1x silverring
       - Provides defense bonus
    2. Distribute protective equipment to all agents
    3. Use equip_item to equip new gear
  
  ⏱️ TIME ALLOCATION:
    - Rounds 16-17: Heal and recover
    - Rounds 18-20: Gather gold ore and special materials
    - Rounds 21-22: Craft protective equipment
    - Round 23: Scout for second boss, coordinate Phase 4 strategy
  
  PHASE 4 - SECOND BOSS: SKELETON (Rounds 24-30):
  🎯 Objectives:
    - Travel to Skeleton territory (dungeons/dark areas)
    - Locate Skeleton boss (Level 15-20)
    - Execute coordinated assault with improved tactics
    - Defeat Skeleton and collect valuable loot
  
  💀 HOW TO LOCATE SKELETON:
    1. Skeletons spawn in dark/dungeon areas
    2. Try searching near (200, 100) - dungeon entrances
    3. Or search around (350, 200) - graveyard areas
    4. Use observe_environment radius=64 repeatedly
    5. Look for "skeleton" with level 15-20 in mobs array
    6. Coordinate search: "Searching (X,Y) for Skeleton"
  
  💀 HOW TO FIGHT SKELETON BOSS:
    1. Pre-fight preparation:
       - MANDATORY: All HP > 85%
       - All agents within 10 tiles
       - Chat: "Skeleton at (X,Y). HP check: X/Y. Ready?"
    2. Battle execution:
       - RaidTank initiates: attack_mob targetInstance=<skeleton_instance>
       - RaidDPS follows immediately: attack_mob targetInstance=<same_instance>
       - RaidSupport joins: attack_mob targetInstance=<same_instance>
    3. Post-battle:
       - Collect loot with verify_inventory
       - Heal to >80% before Phase 5
       - Chat: "Skeleton defeated! HP: X/Y. Loot: [items]"
  
  ⏱️ TIME ALLOCATION:
    - Rounds 24-26: Travel to skeleton territory, search
    - Round 27: Locate skeleton, coordinate attack
    - Rounds 28-29: Fight skeleton, recover
    - Round 30: Heal and prepare for Phase 5
  
  PHASE 5 - WEAPON UPGRADES (Rounds 31-37):
  🎯 MANDATORY Objectives:
    - Gather MORE resources for weapon enhancement
    - Mine 5+ additional iron ore
    - Smelt 5+ additional iron bars
    - Craft enhanced weapons (axes, better swords)
    - Stock up on healing items (30+ total)
    - Prepare for difficult Ogre boss
  
  🔧 HOW TO ENHANCE WEAPONS:
    1. Return to mining area (230, 38) if needed
    2. Mine 5+ more iron ore and coal
    3. Smelt bars using craft_item skill=Smelting itemKey=ironbar
    4. Craft axes (good backup weapons):
       - Function: craft_item skill=Smithing itemKey=axe
       - Materials: 3x ironbar + 1x logs → 1x axe
       - Craft 1-2 axes as backup weapons
    5. Distribute weapons to ensure all agents well-armed
  
  🏥 HOW TO STOCK HEALING ITEMS:
    1. Hunt mid-level creatures (Level 10-15) for food drops
    2. Forage plants for healing items
    3. Target: 30+ healing items total across team
    4. Distribute evenly: each agent should have 10+ items
    5. Use chat: "Healing items: X. Team total: Y/30"
  
  ⏱️ TIME ALLOCATION:
    - Rounds 31-33: Mine additional ores
    - Rounds 34-35: Smelt and craft weapons
    - Rounds 36-37: Gather healing items, prepare for Phase 6
  
  PHASE 6 - THIRD BOSS: OGRE (Rounds 38-44):
  🎯 Objectives:
    - Travel to Ogre territory (mountains)
    - Locate Ogre boss (Level 25-30)
    - Execute advanced coordinated assault
    - Defeat Ogre through superior tactics and equipment
  
  👹 HOW TO LOCATE AND FIGHT OGRE:
    1. Travel to mountain region (238, 48) - Iron Ogre location
    2. Use observe_environment radius=64 to find ogre
    3. Look for "ogre" with level 25-30 (tough opponent!)
    4. Pre-fight CRITICAL checks:
       - ALL agents HP > 90% (MANDATORY)
       - All healing items ready in inventory
       - All agents positioned within 10 tiles
       - Chat: "Ogre found! HP: X/Y. Healing: Z items. READY?"
    5. Battle execution:
       - RaidTank: attack_mob targetInstance=<ogre_instance>
       - RaidDPS: attack_mob targetInstance=<same_instance>
       - RaidSupport: attack_mob targetInstance=<same_instance>
    6. Ogre battle will be LONG - may take 2-3 rounds
    7. Post-battle:
       - IMMEDIATELY heal to >70% HP
       - Collect loot
       - Chat: "Ogre defeated! HP: X/Y. Major victory!"
  
  ⏱️ TIME ALLOCATION:
    - Rounds 38-39: Travel to ogre area
    - Round 40: Locate ogre, heal to 100%
    - Rounds 41-43: Fight ogre (extended battle)
    - Round 44: Recover and prepare for FINAL PHASE
  
  PHASE 7 - FINAL BOSS (Rounds 45-50):
  🎯 Objectives:
    - Travel to final boss location
    - Locate ultimate boss (Spectre Level 35+ OR Ice Guardian)
    - Execute PERFECT team coordination
    - Defeat final boss as epic conclusion
    - Complete 50-round campaign successfully
  
  👻 HOW TO LOCATE FINAL BOSS:
    1. Potential final boss locations:
       - Spectre: Dark areas around (230, 30) - Level 35+ undead
       - Ice Guardian: Frozen region (259, 151) - Level 35+
       - Alternative: Ice Knight at (712, 717) - Level 62 (VERY difficult!)
    2. Travel to first location and use observe_environment radius=64
    3. If not found, travel to next location
    4. Choose boss that team can handle (Level 30-40 recommended)
    5. Use chat: "Final boss type [X] found at (Y,Z). Level: A. Assessing..."
  
  ⚔️ HOW TO FIGHT FINAL BOSS:
    1. CRITICAL pre-fight preparation:
       - ALL agents must have HP = 100% (full health)
       - Each agent needs 5+ healing items ready
       - All agents within 8 tiles of boss
       - Chat full status: "FINAL BOSS READY CHECK"
       - Each agent responds: "Agent [name]: HP X/X, Healing: Y items, Position: (A,B). READY!"
    2. Attack execution:
       - RaidTank initiates: attack_mob targetInstance=<boss_instance>
       - Wait 1 second for system processing
       - RaidDPS: attack_mob targetInstance=<same_instance>
       - Wait 1 second
       - RaidSupport: attack_mob targetInstance=<same_instance>
    3. Battle will be LONGEST fight - expect 3-5 rounds
    4. Post-battle victory:
       - Use verify_inventory to check epic loot
       - All agents chat: "FINAL BOSS DEFEATED!"
       - Share final stats: "HP: X/Y, Survived: YES"
  
  ⏱️ TIME ALLOCATION:
    - Rounds 45-46: Travel to final boss area (long distance)
    - Round 47: Search for final boss, locate target
    - Round 48: Heal to 100%, final preparations
    - Rounds 49-50: Epic final battle, victory celebration
  
  EXTENDED RAID COORDINATION:
  - Use global chat constantly throughout all 50 rounds
  - Track boss defeats and preparation status
  - Coordinate healing resource management
  - Plan travel routes between boss locations
  - Balance combat with recovery phases
  - Adapt strategies based on boss encounters
  
  📊 7-PHASE CAMPAIGN PROGRESSION:
  
  Phase 1 (Equipment Preparation): Gather, mine, smelt, craft - Build foundation
  Phase 2 (Boss 1 - Goblin): First boss encounter, establish teamwork
  Phase 3 (Resource Expansion): Gather advanced materials, heal, prepare
  Phase 4 (Boss 2 - Skeleton): Second boss, test improved coordination
  Phase 5 (Weapon Upgrades): More crafting, stock healing, enhance loadout
  Phase 6 (Boss 3 - Ogre): Major challenge, test advanced tactics
  Phase 7 (Boss 4 - Final Boss): Ultimate encounter, perfect execution required
  
  ⏳ EXPECTED TIMELINE:
  - Rounds 1-10: Crafting and preparation (Phase 1)
  - Rounds 11-15: First boss (Phase 2)
  - Rounds 16-23: Resource gathering (Phase 3)
  - Rounds 24-30: Second boss (Phase 4)
  - Rounds 31-37: Weapon upgrades (Phase 5)
  - Rounds 38-44: Third boss (Phase 6)
  - Rounds 45-50: Final boss and victory (Phase 7)
  
  🚨 COMPLETION REQUIREMENTS - STRICT 7-PHASE CAMPAIGN:
  
  DO NOT use complete() until ALL MANDATORY requirements met:
  
  PHASE COMPLETION CHECKLIST:
  ✓ Phase 1: Equipment crafted (2x Heavy Swords, 1x Pickaxe, 10+ bars)
  ✓ Phase 2: Goblin boss defeated (verify with verify_inventory for loot)
  ✓ Phase 3: Resource expansion completed (healing items, gold ore gathered)
  ✓ Phase 4: Skeleton boss defeated
  ✓ Phase 5: Weapon upgrades completed (axes crafted, 30+ healing items)
  ✓ Phase 6: Ogre boss defeated
  ✓ Phase 7: Final boss defeated (Spectre, Ice Guardian, or Level 30+ boss)
  ✓ Campaign completed in 45-50 rounds (NOT before round 40!)
  
  MINIMUM ACCEPTABLE COMPLETION (If Issues):
  ✓ At least 3 bosses defeated (must include Phase 2, 6, and 7 bosses)
  ✓ Equipment crafting completed in Phase 1 and Phase 5
  ✓ All 3 warriors survive with HP > 10%
  ✓ Campaign takes 40+ rounds minimum
  
  ⚠️ CRITICAL: DO NOT RUSH TO COMPLETION!
  - If completing before Round 40, you SKIPPED required phases
  - Must complete preparation phases (1, 3, 5) before boss phases
  - Each boss phase requires proper setup from previous phases
  - Completing in 18 rounds = FAILURE (skipped most content)
  
  VERIFICATION PROCESS (Round 48-50):
  ✓ RaidTank uses chat: "Campaign summary: Phase 1-7 complete. Bosses: [list 4 bosses]"
  ✓ RaidDPS uses chat: "Equipment crafted: [list items]. Resources gathered: [amounts]"
  ✓ RaidSupport uses chat: "Final status: HP X/Y. Healing items: Z. All survived: YES"
  ✓ All agents confirm: "50-round campaign complete. VICTORY!"
  
  THEN one agent calls complete() with full summary of all 7 phases

# Limitations
