# Success criteria for multi-agent task
success_criteria:
  - "Phase 1 completed: Team crafts 2x Heavy Swords, 1x Pickaxe, and 10+ iron bars"
  - "Phase 1: Team gathers 5+ logs and mines 10+ iron ore and coal"
  - "Phase 2 completed: Goblin boss (Level 10-15) defeated"
  - "Phase 2: Team coordinates attack with proper positioning and HP checks"
  - "Phase 3 completed: Team gathers advanced materials and healing items"
  - "Phase 3: Gold ore mined (if available) and protective equipment crafted"
  - "Phase 4 completed: Skeleton boss (Level 15-20) defeated"
  - "Phase 4: Team searches dark areas and locates skeleton successfully"
  - "Phase 5 completed: Team crafts enhanced weapons (axes) and stocks 30+ healing items"
  - "Phase 5: Additional mining and smelting operations completed"
  - "Phase 6 completed: Ogre boss (Level 25-30) defeated"
  - "Phase 6: Team manages difficult boss fight with healing and coordination"
  - "Phase 7 completed: Final boss (Spectre/Ice Guardian Level 30-40) defeated"
  - "Phase 7: Team travels to final boss location and executes perfect assault"
  - "All 4 bosses defeated: Goblin, Skeleton, Ogre, and Final Boss"
  - "All three warriors survive entire 50-round campaign with HP > 0"
  - "Campaign takes 45-50 rounds (NOT completed in under 40 rounds)"
