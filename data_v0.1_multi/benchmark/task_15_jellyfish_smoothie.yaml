# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cooperative Jellyfish Smoothie - Exotic Beverage Creation"
  description: "Three agents work together to create a jellyfish smoothie through advanced fishing, container crafting, and specialty cooking"

# Task objectives
objectives:
  primary: "Create a jellyfish smoothie through coordinated exotic fishing and specialty beverage preparation"
  secondary: # checkpoints
    - "Execute advanced fishing operations for exotic marine life"
    - "Coordinate specialized container crafting for beverage preparation"
    - "Complete exotic beverage creation within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent exotic beverage creation scenario requiring advanced skills.
  
  CRITICAL SUCCESS REQUIREMENTS:
  1. marine_fisher_agent MUST find fishing spots and catch jellyfish (level 5+ fishing)
  2. container_maker_agent MUST craft small bowl for beverage container
  3. beverage_specialist_agent MUST combine jellyfish + bowl into smoothie
  4. beverage_specialist_agent MUST display the smoothie and declare completion
  
  LOCATION STRATEGY:
  - Advanced fishing areas for exotic marine creatures
  - Wood processing for container crafting
  - Specialty beverage preparation facility
  - Communicate exotic ingredient progress through global chat
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  🎣 Fishing - jellyfish:
    - harvest_resource on fishing spot instances to get jellyfish
    - Level required: 5+ (Fishing skill) - ADVANCED FISHING!
    - Tool required: Fishing pole
  
  🥣 Fletching Recipe - bowlsmall:
    - craft_item skill=Fletching itemKey=bowlsmall
    - Materials: 2x stick → 1x bowlsmall
    - Level required: 1 (Fletching skill)
  
  🪄 Fletching Recipe - stick:
    - craft_item skill=Fletching itemKey=stick
    - Materials: 1x logs → 4x stick
    - Level required: 1 (Fletching skill)
  
  🎐 Cooking Recipe - jellyfishsmoothie:
    - craft_item skill=Cooking itemKey=jellyfishsmoothie
    - Materials: 1x jellyfish + 1x bowlsmall → 1x jellyfishsmoothie
    - Level required: 10 (Cooking skill) - ADVANCED COOKING!

# Limitations
max_action_steps: 25

# Agent configurations
agent_1:
  username: "marine_fisher_agent"
  new_character: true
  role: "Exotic Marine Fisher"
  
  location:
    x: 500
    y: 700
  
  skill_levels:
    fishing: 25       # Required for jellyfish fishing (level 5+)
    strength: 25
    health: 25
  
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "fishingpole"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Exotic marine fisher responsible for jellyfish collection
    
    🎣 CRITICAL EXOTIC FISHING MISSION - CATCH JELLYFISH!
    
    ABSOLUTE PRIORITIES:
    1. Find advanced fishing spots for exotic marine life
    2. Catch jellyfish for specialty beverage preparation
    3. Secure exotic marine ingredient for smoothie
    4. Transfer jellyfish to beverage_specialist_agent
    
    EXOTIC FISHING STRATEGY:
    1. observe_environment to search for fishing spots in marine areas
    2. Look for fishing spot instances that might contain jellyfish
    3. If not visible, move to different marine fishing areas:
       - move_character(x=450, y=750) for deep water fishing area
       - move_character(x=550, y=650) for marine life zone
       - move_character(x=600, y=800) for exotic fishing area
    4. harvest_resource on fishing spot instances to get jellyfish
    5. IMPORTANT: Jellyfish require level 5+ fishing - you have 25 ✅
    6. Target: Catch 1x jellyfish for smoothie preparation
    7. Check inventory after each fishing attempt
    8. Use global chat every 2-3 actions to report jellyfish fishing progress
    9. Once you have jellyfish, coordinate with beverage_specialist_agent
    10. Move to beverage preparation facility for jellyfish transfer
    11. transfer_items to give jellyfish to beverage_specialist_agent (EXOTIC!)
    12. Wait for beverage_specialist_agent to confirm jellyfish receipt
    13. Support team until jellyfish smoothie is complete
    
    EXOTIC FISHING REQUIREMENTS:
    - Fishing skill level 5+ (you have 25) ✅
    - Fishing pole equipped ✅
    - Advanced fishing capability for exotic species
    - Careful handling of marine creatures
    
    ERROR PREVENTION:
    - Verify fishing skill meets jellyfish requirements
    - Look for water areas with exotic marine life
    - Handle jellyfish carefully - EXOTIC INGREDIENT
    - REMEMBER: Jellyfish are more challenging to catch than basic fish!

agent_2:
  username: "container_maker_agent"
  new_character: true
  role: "Small Container Craftsperson"
  
  location:
    x: 126
    y: 23
  
  skill_levels:
    lumberjacking: 20
    fletching: 15     # Required for bowl crafting
    strength: 25
    health: 25
  
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "axe"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Small container craftsperson responsible for beverage bowl creation
    
    🥣 CRITICAL CONTAINER CRAFTING MISSION - CREATE SMALL BOWL!
    
    ABSOLUTE PRIORITIES:
    1. Find and cut oak trees to get logs
    2. Craft logs into sticks for bowl material
    3. Craft sticks into small beverage bowl
    4. Transfer small bowl to beverage_specialist_agent
    
    CONTAINER CRAFTING STRATEGY:
    1. observe_environment to find oak trees
    2. harvest_resource on oak tree instances to get logs
    3. Collect at least 1x logs for stick production
    4. Craft sticks from logs:
       📋 FLETCHING: craft_item skill=Fletching itemKey=stick (1x logs → 4x stick)
    5. Craft small bowl from sticks:
       📋 FLETCHING: craft_item skill=Fletching itemKey=bowlsmall (2x stick → 1x bowlsmall)
    6. observe_environment to verify small bowl created
    7. Use global chat to report small bowl crafting completion
    8. Coordinate with beverage_specialist_agent for bowl transfer
    9. Move to beverage facility for bowl transfer
    10. transfer_items to give bowlsmall to beverage_specialist_agent
    11. Wait for beverage_specialist_agent to confirm bowl receipt
    12. Support team until jellyfish smoothie is complete
    
    CONTAINER CRAFTING REQUIREMENTS:
    - Lumberjacking skill for logs (you have 20)
    - Fletching skill level 1+ for bowl (you have 15)
    - Precision crafting for beverage container
    
    ERROR PREVENTION:
    - Verify each crafting step completion
    - Check inventory after each operation
    - Handle bowl transfer carefully - NEEDED FOR BEVERAGE
    - REMEMBER: Logs → sticks → small bowl sequence

agent_3:
  username: "beverage_specialist_agent"
  new_character: true
  role: "Exotic Beverage Master"
  
  location:
    x: 136
    y: 25
  
  skill_levels:
    cooking: 25       # Required for smoothie creation (level 10+)
    fishing: 15       # Marine ingredient knowledge
    crafting: 10      # Beverage preparation skills
    strength: 20
    health: 25
  
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  task_instructions: |
    YOUR ROLE: Exotic beverage master responsible for jellyfish smoothie creation
    
    🎐 PRIORITY ACTIONS:
    1. Coordinate with both marine_fisher_agent and container_maker_agent
    2. Collect jellyfish and small bowl components
    3. Execute advanced beverage preparation techniques
    4. Quality control and exotic smoothie presentation
    
    EXOTIC BEVERAGE COORDINATION:
    1. send global chat message announcing exotic beverage facility readiness
    2. Monitor progress from both marine_fisher_agent and container_maker_agent
    3. Coordinate ingredient collection from both agents
    4. First collect bowlsmall from container_maker_agent
    5. Then collect jellyfish from marine_fisher_agent
    6. Verify both exotic components before beverage preparation
    
    CRITICAL BEVERAGE PREPARATION STEPS:
    7. observe_environment to CHECK YOUR INVENTORY before preparation
    8. VERIFY you have 1x jellyfish AND 1x bowlsmall
    9. ONLY AFTER verifying ingredients, use craft_item:
       📋 RECIPE: craft_item skill=Cooking itemKey=jellyfishsmoothie (1x jellyfish + 1x bowlsmall → 1x jellyfishsmoothie)
    10. WAIT for craft_item result - confirm "Successfully crafted" message
    11. observe_environment to verify jellyfishsmoothie in inventory
    12. Use global chat to announce successful exotic smoothie creation
    13. Display jellyfish smoothie for team verification
    14. complete() ONLY after successful exotic beverage creation
    
    EXOTIC BEVERAGE REQUIREMENTS:
    ✅ 1x jellyfish (from marine_fisher_agent) - EXOTIC INGREDIENT
    ✅ 1x bowlsmall (from container_maker_agent)
    ✅ Cooking skill level 10+ (you have level 25) - ADVANCED!
    
    ERROR PREVENTION:
    - Handle jellyfish with care - EXOTIC MARINE INGREDIENT
    - Verify advanced cooking skill meets requirements
    - Check exotic ingredient freshness
    - Coordinate timing with both specialty agents

# Success criteria for multi-agent task
success_criteria:
  - "marine_fisher_agent successfully catches and transfers jellyfish"
  - "container_maker_agent successfully creates and transfers small bowl"
  - "beverage_specialist_agent receives components and creates smoothie"
  - "beverage_specialist_agent successfully prepares jellyfish smoothie"
  - "All agents coordinate exotic beverage operations effectively"
  - "Advanced exotic beverage creation completes within time limit"
