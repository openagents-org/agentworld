# AgentWorld Multi-Agent Task Configuration

task:
  name: "Dark Forest Cleansing - Shadow Realm Purification"
  description: "Three agents work together to cleanse a corrupted dark forest, defeat the Dark Wolf boss, and restore natural balance to the shadow realm"

# Task objectives
objectives:
  primary: "Successfully cleanse the dark forest by defeating the Dark Wolf and purifying corrupted forest areas"
  secondary: # checkpoints
    - "Establish dark forest coordination and shadow creature threat assessment"
    - "Execute safe forest purification and boss combat operations"
    - "Complete shadow realm cleansing within 34 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent forest purification mission requiring coordinated boss combat and area cleansing.
  
  OBJECTIVE: Cleanse corrupted dark forest areas and defeat the powerful Dark Wolf boss to restore natural balance.
  
  MISSION REQUIREMENTS:
  - Navigate to Dark Forest region (Region 10-6: coordinates 1016, 682)
  - Defeat the Dark Wolf boss (Level 0 but likely with special dark abilities)
  - Cleanse corrupted forest areas and restore natural forest growth
  - Handle shadow creatures and dark environmental effects
  
  TEAM COORDINATION:
  - Use global chat to share dark forest entrance locations and corruption sightings
  - Coordinate between forest exploration, boss combat, and purification operations
  - Share light sources and provide mutual protection against darkness effects
  - Work together to navigate confusing dark forest terrain and shadow illusions
  
  GENERAL STRATEGY:
  - The team needs to reach far eastern dark forest region efficiently
  - Dark Wolf boss may have unique shadow abilities despite low level rating
  - Dark forest areas may have reduced visibility and disorienting effects
  - Forest purification may require specific actions or environmental interactions
  - Balance boss combat with thorough area cleansing for complete mission success
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  DARK FOREST COMBAT & PURIFICATION (CRITICAL KNOWLEDGE):
  🌑 Environmental Hazards:
    - Dark forest regions have darkness overlay reducing visibility
    - Shadow effects may cause confusion or disorientation
    - Corrupted areas may drain health or cause negative status effects
    - Use light sources and magical illumination to counter darkness
  
  🐺 Boss Combat - Dark Wolf:
    - Use observe_environment to locate Dark Wolf at coordinates (1016, 682)
    - Despite Level 0 rating, expect unique shadow-based abilities
    - Dark Wolf may have pack tactics, summoning, or stealth capabilities
    - Use coordinated attacks and light-based magic for effectiveness
    - Expect high mobility and hit-and-run shadow attacks
  
  🌲 Forest Purification:
    - Use observe_environment to identify corrupted forest areas
    - Purification may require specific environmental interactions
    - Look for dark or withered trees that need restoration
    - Forest cleansing may involve planting, healing, or magical restoration
  
  🔦 Darkness Combat Strategy:
    - Maintain close formation to avoid separation in darkness
    - Use area-effect attacks to handle multiple shadow creatures
    - Coordinate light sources for maximum visibility
    - Focus on boss elimination first, then area purification
  
  🧙‍♂️ Shadow Creature Combat:
    - Expect various dark forest creatures with shadow abilities
    - Use holy/light magic if available for elemental advantage
    - Physical attacks may be less effective against shadow creatures
    - Coordinate magical and physical attacks for maximum effectiveness

# Limitations
