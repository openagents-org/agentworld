# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, adjusted resource requirements

task:
  name: "Tri-Forge Vanguard - Continental Counteroffensive"
  description: "Ten artisans split across mountain, desert, and coastal forges to craft a coordinated war stockpile, then converge on Castle Vanguard (712,717) within 60 rounds."

# Task objectives
objectives:
  primary: "Activate all three forge hubs, craft 3 heavy swords, 2 golden bows, 2 lightningstaff, 1 firestaff, and deliver every finished item plus 25 healing supplies to Castle Vanguard for inspection."
  secondary:
    - "Phase 1: Deploy to hubs (Mountain 230,40 / Desert 420,650 / Coastal 197,633) and confirm squads + communication relays."
    - "Phase 2: Mountain squad mines 20 ironore + 20 coal, smelts 10 ironbar, and crafts 3 heavy swords + 1 pickaxe spare."
    - "Phase 3: Desert squad fells 6 bloodwoodlogs, gathers 8 goldore, smelts 6 goldbar, and crafts 2 golden bows."
    - "Phase 4: Coastal squad fishes 8 rawtuna, harvests 8 string-bearing plants, defeats mimics for lightningbeads, and crafts 2 lightningstaff + 1 firestaff."
    - "Phase 5: Logistics chain meets at Tri-Forge Plaza (350,320) to bundle gear, then deliver to Castle Vanguard."

# Relevant game context (Hint)
relevant_game_context: |
  TRI-FORGE COMMUNICATION
  - Use chat labels [Mountain], [Desert], [Coastal], [Central] when broadcasting updates. MountainLead keeps the global checklist.
  - Before leaving any hub, run verify_inventory and state "Hub ready" along with ore/log counts.

  RESOURCE & CRAFTING NOTES
  - Mountain: harvest_resource on oak near 230,40 if logs needed for tools. mine_resource on coal/iron nodes; smelt at the ridge furnace, then craft_item Smithing sword2 for heavy swords.
  - Desert: harvest_resource target=bloodwood near dunes, mine_resource for gold ore, smelt into goldbar, craft_item Fletching goldenbow.
  - Coastal: fish_resource at 197,633 for rawtuna. Lightningbeads drop from Water Guardian adds; firebeads drop from Fire Spooders around 769,657.

  LOGISTICS
  - All finished items move through Tri-Forge Plaza (350,320). Use transfer_items so CentralCoordinator can group shipments.
  - Deliver final gear + 25 combined food/healing items to Castle Vanguard before complete().

# Limitations
max_action_steps: 60

