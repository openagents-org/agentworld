# AgentWorld Multi-Agent Task Configuration

task:
  name: "Elemental Mastery Expedition - Tri-Biome Conquest"
  description: "Eight elementalists journey across three biomes, gathering elemental materials, crafting specialized weapons, and mastering environmental combat"

# Task objectives
objectives:
  primary: "Complete a 4-phase elemental mastery journey spanning 54 rounds across forest, mountain, and volcanic biomes"
  secondary:
    - "Phase 1 (Rounds 1-12): Gathering Convergence - Collect basic materials from all biomes simultaneously"
    - "Phase 2 (Rounds 13-24): Forest Mastery - Craft nature-based equipment and conquer forest guardians"
    - "Phase 3 (Rounds 25-38): Mountain Mastery - Create ice/earth equipment and defeat mountain bosses"
    - "Phase 4 (Rounds 39-54): Volcanic Finale - Forge fire equipment and defeat ultimate volcanic boss"

# Relevant game context
relevant_game_context: |
  EXPEDITION PLAN
  - Eight elementalists split into pairs, cover three biomes (forest, mountain, volcanic), and regroup between phases to craft themed gear. Each phase (≈12 rounds) follows the same rhythm: gather biome materials → craft elemental equipment at the hub → travel as a full squad to that biome → defeat 2-3 guardians while managing environmental effects.

  PHASE HIGHLIGHTS
  1. R1-12 Gathering Convergence: three teams depart simultaneously (≤32-tile hops) to collect logs/feathers, ores/ice logs, and gold/cinnabar. Return to the central hub and transfer everything via transfer_items with verify_inventory confirmations.
  2. R13-24 Forest Mastery: craft nature staffs, beryl pendants, wooden bows, and 50 arrows; march to (250,350), defeat goblin guardians together, then loot and rest.
  3. R25-38 Mountain Mastery: smelt 30+ iron bars, craft heavy swords/pickaxes/silver rings (and ice staffs if beads exist), travel north (~230,38), fight skeletons/ice mobs while watching cold damage, then confirm mastery.
  4. R39-54 Volcanic Finale: forge fire gear (golden weapons, fire staffs, heat-resistant accessories), move to (~150,650), and focus-fire dark ogres/fire mobs while tracking heat ticks; defeat the ultimate volcanic boss and announce final mastery before complete().

  EXECUTION NOTES
  - Without observe_environment, sweep the target grid manually and rely on harvest_resource/attack_mob feedback plus inventory counts.
  - Keep a phase checklist in chat ("Forest mats ✅, Nature gear ✅, Guardians 2/3") so everyone knows progress.
  - Travel in ≤32-tile steps, announcing coordinates when moving as a squad; environmental hazards require staying above 80% HP at all times.
# Limitations
max_action_steps: 54

