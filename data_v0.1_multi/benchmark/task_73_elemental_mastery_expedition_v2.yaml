  - "Phase 2: Nature equipment crafted (2 Nature Staffs, Beryl Pendants, 3 Wooden Bows, 50 arrows)"
  - "Phase 2: Forest guardians defeated (2-3 Goblins Level 10-15)"
  - "Phase 3 completed: Mountain Mastery achieved"
  - "Phase 3: Ice equipment crafted (4 Heavy Swords, 2 Pickaxes, 6 Silver Rings)"
  - "Phase 3: Mountain guardians defeated (2-3 Skeletons Level 15-25)"
  - "Phase 4 completed: Volcanic Mastery achieved"
  - "Phase 4: Fire equipment crafted (2 Fire Staffs, 3 Axes, 4 Gold Rings, Enhanced Rings)"
  - "Phase 4: Volcanic ultimate boss defeated (Dark Ogre Level 28-35 OR Fire Dragon Level 40+)"
