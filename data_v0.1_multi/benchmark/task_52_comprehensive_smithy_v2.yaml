# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Extended 6-smith operation with more output

task:
  name: "Comprehensive Smithy Operations - Six-Smith Complete Metalworking Empire"
  description: "Six specialized smiths work together to establish a complete metalworking operation from raw ore extraction through advanced equipment production and distribution"

# Task objectives
objectives:
  primary: "Establish a comprehensive six-smith metalworking operation producing complete equipment sets for entire team"
  secondary: # checkpoints
    - "Coordinate six-smith specialization and role assignment"
    - "Execute complete ore-to-equipment production pipeline"
    - "Produce diverse equipment types: tools, weapons, and accessories"
    - "Distribute complete equipment sets to all team members within 45 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  OVERVIEW
  - Six smiths split the ore→bar→equipment pipeline. Two Miners feed ores, SmeltingMaster turns them into bars, ToolForge builds pickaxes/axes, WeaponForge crafts heavy swords, JewelryArtisan handles rings. Target output in 45 rounds: 2 pickaxes, 2 axes, 2 sword2, and 4 silverrings.

  FLOW BY ROLE
  1. MasterMiner + AssistantMiner (230,38): harvest_resource iron/coal (≥20 each total), reporting totals in chat. When ready, travel to the smelter's hut (260,184) and transfer the entire haul.
  2. SmeltingMaster: craft_item(Smelting, ironbar) until ~28 bars exist. Hand out bars in batches: 16→ToolForge (for 2 pickaxes + 2 axes), 4→WeaponForge (for 2 swords), 8→JewelryArtisan (for 4 silverrings).
  3. ToolForge: gather logs, craft two pickaxes (5 bars + log each) then two axes (3 bars + log each). Confirm outputs before requesting more bars.
  4. WeaponForge: already has two hilt2; combine with 4 ironbars to forge two sword2.
  5. JewelryArtisan: turn 8 ironbars into four silverrings (2 bars each).

  COORDINATION NOTES
  - Transfers must occur within ~10 tiles using transfer_items; both sides run verify_inventory and acknowledge via chat.
  - Every craft or smelt should be announced ("SmeltingMaster: iron bars 12/28"). Keep a running checklist of produced items so all divisions know when they are done.

  COMPLETION CHECK
  - Inventory review shows: 2 pickaxes, 2 axes, 2 sword2, and 4 silverrings. Each role states "Division complete – holding X".
  - Final chat message summarizes total equipment before any agent calls complete().
# Limitations
max_action_steps: 45

