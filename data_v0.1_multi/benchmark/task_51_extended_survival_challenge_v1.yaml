  - "SurvivalLeader successfully coordinates all survival phases"
  - "Team successfully completes Phase 1: Basic Survival (Rounds 1-12)"
  - "Magic Staff is crafted during Phase 1"
  - "Team successfully completes Phase 2: Resource Expansion (Rounds 13-28)"
  - "Pickaxe is crafted during Phase 2"
  - "CraftingExpert successfully produces all required equipment"
  - "Team successfully completes Phase 3: Combat (Rounds 29-40)"
