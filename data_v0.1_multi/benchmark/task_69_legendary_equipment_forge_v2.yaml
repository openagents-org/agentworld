# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Extended 11-agent ultimate legendary forge

task:
  name: "Legendary Equipment Forge - Ultimate Arsenal Empire"
  description: "Eleven master craftsmen unite to create the ultimate equipment collection: legendary golden items, magical staffs, and complete elite arsenal"

# Task objectives
objectives:
  primary: "Forge ultimate legendary set: 7+ golden items, 6+ magical staffs, 8+ elite weapons for 21+ total legendary pieces"
  secondary:
    - "Conquest 1 (Rounds 1-20): Massive Resource Gathering - Mine 140+ ores, gather all magical components"
    - "Conquest 2 (Rounds 21-36): Industrial Smelting - Produce 110+ bars from ores"
    - "Conquest 3 (Rounds 37-54): Legendary Crafting - Forge all legendary items"
    - "Conquest 4 (Rounds 55-60): Grand Arsenal Exhibition - Display complete legendary empire"

# Context and guidance for agents
relevant_game_context: |
  LEGENDARY GOAL
  - Eleven specialists must gather massive material quotas (70 gold ore, 30 iron ore, 100 coal, logs, strings, hilts, 12 beads) and craft 21 legendary items (7 golden pieces, 6 elemental staffs, 8 elite weapons/tools) within ~60 rounds. Mining teams and hunters work remotely while the forge trio at (528,384) handles smelting and crafting.

  ROADMAP
  1. R1-20 Extraction: Gold team (4 miners) splits the 70-ore requirement; Iron/Coal team (2 miners) digs 30 iron + 100 coal; component hunters secure beads/strings/logs/hilts.
  2. R21-32 Caravan: all gatherers march to the forge (<=32-tile hops). Transfer ores/coal to Master_Smelter; hand beads/string/logs/hilts to the crafters.
  3. R33-54 Production: Smelters process 70 gold bars and 30 iron bars. Crafters build golden sword/bow/boots/helmet/rings, craft sticks/staffs, and forge heavy swords, pickaxes, axes.
  4. R55-60 Exhibition: list the final arsenal, confirm counts per category (golden items, staffs, elite weapons).

  EXECUTION NOTES
  - Keep a shared checklist ("Gold 45/70", "Beads 8/12") so the forge knows when each material stream is ready.
  - Transfers only succeed within ~10 tiles—announce both send and receive events.
# Limitations
max_action_steps: 60

