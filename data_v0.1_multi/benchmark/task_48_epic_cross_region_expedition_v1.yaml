# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Single region expedition, gather forest resources only

task:
  name: "Epic Cross-Region Expedition - Forest Region Focus"
  description: "Two agents complete a forest expedition gathering 6x logs and crafting 1x magic staff"

# Task objectives
objectives:
  primary: "Complete forest expedition: gather 6x logs and craft 1x magic staff"
  secondary: # checkpoints
    - "Coordinate forest resource gathering"
    - "Complete expedition within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a focused forest expedition scenario.

  OBJECTIVE: Complete forest region objectives.

  MISSION REQUIREMENTS:
  - Gather 6x logs from oak trees
  - Craft sticks from logs
  - Craft 1x magic staff with bead

  TEAM COORDINATION:
  - Gatherer focuses on logs and sticks
  - Crafter assembles the staff

  STARTING RESOURCES:
  - Leader has 1x bead
  - Gatherer has 1x logs

  FOREST ACTIVITIES:
  🌲 Lumberjacking - logs:
    - harvest_resource on Oak Tree instances
    - Target: 6x logs total

  🪄 Fletching - stick:
    - 1x logs → 4x stick

  🔮 Crafting - staff:
    - 5x stick + 1x bead → 1x staff

  DO NOT use complete() until objectives are met!

# Limitations
max_action_steps: 25

