# VARIANT: Adjusted version - more finished products (30 instead of 20)

task:
  name: "Mining Conglomerate Expansion - Multi-Site Industrial Mining (More Products)"
  description: "Fifteen miners establish a vast mining empire with multiple excavation sites, smelting operations, and increased product manufacturing"

# Task objectives
objectives:
  primary: "Establish mining conglomerate operating 4 mine sites, producing 100+ bars and 30+ finished products within 55 rounds"
  secondary:
    - "Phase 1 (Rounds 1-14): Mine Establishment - Open 4 excavation sites"
    - "Phase 2 (Rounds 15-32): Mass Extraction - Mine 120+ ores across all sites"
    - "Phase 3 (Rounds 33-45): Industrial Smelting - Produce 100+ metal bars"
    - "Phase 4 (Rounds 46-55): Manufacturing - Craft 30+ metal products"

# Relevant game context (Hint)
relevant_game_context: |
  MINING CONGLOMERATE OVERVIEW:

  Fifteen mining professionals must establish a multi-site industrial mining operation.

  MINING DIVISIONS:

  EXCAVATION TEAMS

  **Site Alpha (Agents 1-3)**: Iron Mine at (230, 38)
  - Goal: 50+ ironore

  **Site Beta (Agents 4-6)**: Gold Mine at (230, 42)
  - Goal: 30+ goldore

  **Site Gamma (Agents 7-9)**: Coal Mine at (235, 40)
  - Goal: 60+ coal (fuel)

  SMELTING OPERATIONS (Agents 10-12)
  **Mission**: Smelt 100+ bars

  **Production**:
  - 50+ ironbar
  - 30+ goldbar
  - 20+ other bars

  MANUFACTURING (Agents 13-15)
  **Mission**: Craft 30+ metal products

  **Products**:
  - 8+ heavy swords
  - 8+ axes
  - 8+ gold rings
  - 6+ other items

  SUCCESS CRITERIA:
  1. Mine 120+ total ores
  2. Smelt 100+ metal bars
  3. Craft 30+ finished products
  4. 4 mine sites operational
  5. Complete within 55 rounds

# Limitations
max_action_steps: 55

