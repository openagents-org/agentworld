# AgentWorld Multi-Agent Task Configuration

task:
  name: "Shadow Realm Incursion - Dark Dimension Combat and Soul Recovery"
  description: "Three agents work together to enter the Shadow Realm, defeat Shadow Lords, and recover lost souls trapped in darkness"

# Task objectives
objectives:
  primary: "Successfully enter the Shadow Realm, defeat Shadow Lords, and recover lost souls trapped in the dark dimension"
  secondary: # checkpoints
    - "Establish shadow realm entry coordination and dark dimension navigation"
    - "Execute coordinated Shadow Lord combat and soul recovery operations"
    - "Complete shadow realm incursion within 37 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent dark dimension scenario requiring shadow magic resistance and soul manipulation.
  
  OBJECTIVE: Enter the dangerous Shadow Realm, defeat powerful Shadow Lords, and rescue trapped souls.
  
  MISSION REQUIREMENTS:
  - Navigate to Shadow Portal region (Region 8-7: coordinates 1100-1150, 700-750)
  - Enter the Shadow Realm through dimensional portal manipulation
  - Defeat Shadow Lords (Level 52) that guard the trapped souls
  - Recover at least 3 Lost Souls and return them to the material plane
  
  TEAM COORDINATION:
  - Use global chat for complex shadow realm coordination and soul status updates
  - Coordinate between dimensional travel, shadow combat, and soul recovery
  - Share shadow protection and provide light magic support in dark dimension
  - Work together to handle reality-warping shadow effects and soul drain
  
  GENERAL STRATEGY:
  - This requires advanced magical skills and shadow resistance preparation
  - Shadow Lords (Level 52) have darkness abilities and soul-draining attacks
  - Shadow Realm has inverted physics and shadow-based environmental hazards
  - Soul recovery requires specific magical techniques and protective barriers
  - Balance combat efficiency with soul protection and dimensional stability
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  SHADOW REALM OPERATIONS (CRITICAL KNOWLEDGE):
  🌑 Environmental Hazards:
    - Shadow overlay type causes continuous darkness damage and vision impairment
    - Soul drain effects reduce maximum health and magical energy
    - Inverted gravity and reality distortion in shadow dimension
    - Coordinate movement carefully using light magic for navigation
  
  👤 Combat - Shadow Lords:
    - Use observe_environment to locate Shadow Lords at realm coordinates (1125,715) and (1135,730)
    - Level 52 creatures with shadow manipulation and soul-draining abilities
    - Expect darkness attacks, shadow teleportation, and soul-binding magic
    - Use light magic and holy weapons for maximum effectiveness against shadows
    - Coordinate light-based attacks to prevent shadow lord regeneration
  
  💫 Soul Recovery Procedures:
    - Use soul_recover action on Lost Soul locations throughout shadow realm
    - Requires light magic protection and soul-binding resistance
    - Lost Souls are fragile and require gentle magical handling
    - Coordinate soul protection during transport back to material plane
  
  🔮 Shadow Portal Management:
    - Use portal_enter action at shadow portal coordinates (1125,725)
    - Requires shadow resistance preparation and dimensional anchoring
    - Portal stability depends on team coordination and magical energy
    - Plan return portal activation for safe dimensional exit
  
  ✨ Light Magic Strategy:
    - Use light magic continuously to counter shadow realm effects
    - Coordinate light barriers for protection against shadow attacks
    - Focus light energy to weaken Shadow Lords and protect souls
    - Maintain light anchors to prevent team members from being lost in shadows

# Limitations
max_action_steps: 37

