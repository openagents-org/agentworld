# AgentWorld Multi-Agent Task Configuration

task:
  name: "Grand Harbor Bastion - Coastal Defense Retrofit"
  description: "Ten harbor specialists rebuild siege batteries, fortify the tidal wall, and repel an elite coastal boss within 53 rounds"

# Task objectives
objectives:
  primary: "Construct four functional ballista towers at the coastal harbor (175-197, 633-640) and survive the ensuing merfolk assault"
  secondary:
    - "Phase 1 (Rounds 1-12): Stockpile timber, ore, feathers, palmlogs, kelp, and seafood while establishing the harbor command post"
    - "Phase 2 (Rounds 13-28): Smelt 24 iron bars, craft 6 ballista frames (woodenbow) + 60 arrows, build repair kits, cook 20 meals"
    - "Phase 3 (Rounds 29-40): Install four towers along the seawall, assign crews, and verify ammo and repair materials"
    - "Phase 4 (Rounds 41-53): Trigger the defense drill, defeat the Water Guardian/Mermaid, heal up, and log the final readiness report"

# Relevant game context
relevant_game_context: |
  Harbor staging area: (182-190, 636-640). HarborMarshalEdda acts as quartermaster; all supplies flow through this tile via transfer_items followed by verify_inventory.
  
  CORE ACTION REMINDERS:
  - move_character ≤32 tiles per hop; stagger departures so carts do not collide.
  - observe_environment radius=64 before entering a new shoreline or mine to avoid walking into the Guardian early.
  - harvest_resource targetInstance=<id>: trees (logs/palmlogs), rocks (iron/coal), fish spots (rawshrimp), plants (kelp).
  - craft_item skill=Smelting itemKey=ironbar (24x), Smithing itemKey=pickaxe/axe, Crafting itemKey=woodenbow, Fletching itemKey=arrow, Cooking itemKey=cookedshrimp.
  - transfer_items targetPlayer=<ally> itemKey=<item> count=<n> for every resource/bundle; never rely on verbal promises.
  - verify_inventory before/after each tower install and before calling complete().
  - attack_entity targetInstance=<guardian> when Water Guardian or Mermaid spawns near (197,633); escorts must announce HP before/after combat.
  - chat (global) for role assignment, material totals, tower status, combat updates.
  
  PHASE 1 (Rounds 1-12) RESOURCE SURGE
  1. TimberLeadQuill + BowmasterRen work the western forest (388-360, 5-40) for ≥60 logs and ≥40 feathers.
  2. OreChiefSilas + ArtilleristNia mine at (230,38) for ≥30 ironore and ≥30 coal; keep Shield escort within 5 tiles to deter mobs.
  3. ScoutPax + CookHarper harvest ≥20 palmlogs, ≥12 kelp, and fish ≥20 rawshrimp along the coast (175-205, 630-645).
  4. Every run ends back at (185,638) where HarborMarshalEdda logs totals via verify_inventory; MedicDae redistributes healing items as needed.
  
  PHASE 2 (Rounds 13-28) FABRICATION BLOCK
  1. OreChiefSilas smelts 24 ironbar (craft_item skill=Smelting itemKey=ironbar) then forges 4 pickaxe + 4 axe for field repairs.
  2. BowmasterRen converts logs→sticks (craft_item skill=Fletching itemKey=stick) and crafts 60 arrows; ArtilleristNia builds 6 woodenbow frames (craft_item skill=Crafting itemKey=woodenbow).
  3. StormMageIris crafts an extra lightningstaff or firestaff if beads allow; she is responsible for magical overwatch.
  4. CookHarper cooks ≥20 cookedshrimp (craft_item skill=Cooking itemKey=cookedshrimp) and transfers half to MedicDae.
  5. HarborMarshalEdda ensures the stockpile before deployment contains: 24 ironbar, 6 woodenbow, 60 arrows, 20 cookedshrimp, 20 palmlogs, 12 kelp, 4 pickaxe, 4 axe.
  
  PHASE 3 (Rounds 29-40) TOWER INSTALLATION
  1. Tower spots: (180,634), (185,636), (190,638), (195,640). Each requires: 1 woodenbow + 10 arrows + 2 ironbar + 5 logs (ballista kit) plus 1 pickaxe or axe for maintenance.
  2. ArtilleristNia coordinates placements via chat. After a kit is set, assigned crew (BowmasterRen + ScoutPax, StormMageIris + MedicDae, etc.) posts "Tower X ready" with verify_inventory proof of remaining ammo.
  3. Driver duties: Defenders rotate along the wall using move_character hops; no crew more than 10 tiles away from their tower while ammo present.
  4. Spare materials stay on HarborMarshalEdda so emergency repairs don't deadlock.
  
  PHASE 4 (Rounds 41-53) DEFENSE DRILL & BOSS
  1. Trigger the drill by having ScoutPax run observe_environment radius=64 near (197,633). Once Water Guardian or Mermaid appears, HarborMarshalEdda, DefenderRook, and StormMageIris engage via attack_entity while ballista crews announce support fire.
  2. MedicDae tracks HP (must stay >35% before re-engaging) and redistributes flasks/cookedshrimp afterward.
  3. CookHarper restocks meals if any fall below 5 per tower; OreChiefSilas checks ironbar remainder (≥4) for future repairs.
  4. Final report: HarborMarshalEdda lists tower status, ammo counts, and guardian outcome before calling complete(). Do not finish before Round 50.
  
  DEADLOCK AVOIDANCE:
  - If tower tiles are occupied, use sleep(2) and take turns dropping kits so items do not vanish.
  - If resource nodes are empty, swap squads rather than waiting idle; there is enough slack to hit quotas.

# Limitations
max_action_steps: 53

