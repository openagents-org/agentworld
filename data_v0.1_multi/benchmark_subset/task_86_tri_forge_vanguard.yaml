# Success criteria for multi-agent task
success_criteria:
  - "Mountain hub reports 24+ iron ore, 24+ coal, 12 ironbar smelted, and crafts 4 heavy swords plus 2 pickaxes."
  - "Desert hub logs 8+ bloodwoodlogs, 10+ gold ore, 8 goldbar smelted, and crafts 3 golden bows after receiving coastal string."
  - "Coastal hub produces 10 rawtuna, supplies 10 string, acquires lightning/fire beads, and crafts 2 lightningstaff plus 2 firestaff."
  - "CentralCoordinator consolidates all items at (350,320) with verify_inventory snapshots before dispatching strike teams."
  - "Iron Ogre and Hermit Crab Warrior are defeated using the new gear, and final delivery at Castle Vanguard includes 30+ edible healing items before complete()."
