# AgentWorld Multi-Agent Task Configuration

task:
  name: "Tri-Forge Vanguard - Continental Counteroffensive"
  description: "Ten artisans split across mountain, desert, and coastal forges to craft a coordinated war stockpile, then converge on Castle Vanguard (712,717) within 55 rounds."

# Task objectives
objectives:
  primary: "Activate all three forge hubs, craft 4 heavy swords, 3 golden bows, 2 lightningstaff, 2 firestaff, and deliver every finished item plus 30 healing supplies to Castle Vanguard for inspection."
  secondary:
    - "Phase 1: Deploy to hubs (Mountain 230,40 / Desert 420,650 / Coastal 197,633) and confirm squads + communication relays."
    - "Phase 2: Mountain squad mines 24 ironore + 24 coal, smelts 12 ironbar, and crafts 4 heavy swords + 2 pickaxe spares."
    - "Phase 3: Desert squad fells 8 bloodwoodlogs, gathers 10 goldore, smelts 8 goldbar, and crafts 3 golden bows."
    - "Phase 4: Coastal squad fishes 10 rawtuna, harvests 10 string-bearing plants, defeats mimics for lightningbeads, and crafts 2 lightningstaff + 2 firestaff (after obtaining firebeads from volcanic mobs)."
    - "Phase 5: Logistics chain meets at Tri-Forge Plaza (350,320) to bundle gear, then escort two strike teams to defeat Iron Ogre (238,48) and Hermit Crab Warrior (224,359) before final delivery to Castle Vanguard."

# Relevant game context (Hint)
relevant_game_context: |
  TRI-FORGE COMMUNICATION
  - Use chat labels [Mountain], [Desert], [Coastal], [Central] when broadcasting updates. MountainLead keeps the global checklist.
  - Before leaving any hub, run verify_inventory and state “Hub ready” along with ore/log counts. If any hub falls behind, CentralCoordinator dispatches floaters.
  
  RESOURCE & CRAFTING NOTES
  - Mountain: harvest_resource on oak near 230,40 if logs needed for tools. mine_resource on coal/iron nodes; smelt at the ridge furnace, then craft_item Smithing sword2 for heavy swords and pickaxe for spares.
  - Desert: harvest_resource target=bloodwood near dunes, mine_resource for gold ore in the same quadrant, smelt into goldbar, craft_item Fletching goldenbow (remember to gather string from Coastal via transfers before Phase 3 ends).
  - Coastal: fish_resource at 197,633 for rawtuna (healing supplies). For string, forage plants near shoreline. Lightningbeads drop from Water Guardian adds; firebeads drop from Fire Spooders around 769,657—send two agents with escorts if traveling there. Craft staff blanks first, then upgrade using craft_item Crafting lightningstaff/firestaff. Avoid hoarding beads; announce each drop.
  
  LOGISTICS & STRIKE TEAMS
  - All finished items move through Tri-Forge Plaza (350,320). Use transfer_items so CentralCoordinator can group shipments (bundle by weapon type). Keep at least two escorts on each courier.
  - Strike Team A (heavy swords) handles Iron Ogre: ensure HP >80, buff with rawtuna, then synchronously attack_mob the ogre ID. Strike Team B (bows + staffs) handles Hermit Crab Warrior from range; kiting is allowed but keep line-of-sight.
  - After both minibosses fall, gather any beads/logs they drop and note it in chat. Deliver final gear + 30 combined food/healing items to Castle Vanguard; line up all agents on the courtyard tiles before calling complete().
  
  DEADLOCK PREVENTION
  - If lightning/fire beads refuse to drop after two encounters, reassign Mountain floaters to farm alternative mobs (lightningbeads from coastal mimics, firebeads from volcanic golems). Document reassignment in chat.
  - Never move all agents away from a hub simultaneously—at least one sentinel stays behind until shipments depart. This guarantees someone can receive late transfers.

# Limitations
max_action_steps: 55

