# AgentWorld Multi-Agent Task Configuration

task:
  name: "Advanced Culinary Expedition - Multi-Region Food Production and Cooking"
  description: "Three agents embark on a culinary journey gathering diverse ingredients from multiple regions and crafting advanced food items through extended cooperation"

# Task objectives
objectives:
  primary: "Complete a comprehensive culinary expedition gathering ingredients across regions and producing multiple advanced food items"
  secondary: # checkpoints
    - "Execute multi-region ingredient gathering operations"
    - "Coordinate complex food preparation and cooking"
    - "Produce diverse food types: stews, cooked meats, and smoothies"
    - "Complete entire culinary operation within 50 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  EXPEDITION SNAPSHOT
  - Three cooks roam the central farms → nearby forests → optional coast to gather ingredients and cook at least: 2 cooked meats (any mix), 1 tomato stew, and 1 jellyfish smoothie (corn stew optional). MasterCook already carries bowls and one jellyfish, so only a handful of items must be collected.

  SUGGESTED TIMELINE (≤50 ROUNDS)
  1. R1-10: ChefForager sweeps the farm belt (≈(260-300,160-200)) for tomatoes + mushrooms. Share coordinates and totals in chat; transfer extras to MasterCook later.
  2. R11-20: HunterGatherer hunts low-level mobs near spawn for raw meats via attack_mob. After each kill run verify_inventory and state drops; aim for at least four meat pieces.
  3. R21-30: Optional errands—grab corn if it appears along the farm edge or travel east only if the team wants extra jellyfish (not required thanks to the starter one).
  4. R31-50: Everyone regroups at camp (~(400,350)), transfers all ingredients to MasterCook (transfer_items + verify_inventory), cooks the meats (craft_item Cooking cookedbeef/chicken/pork), then crafts tomato stew (tomato + mushroom + bowl), corn stew if corn exists, and the jellyfish smoothie.

  EXECUTION RULES
  - If observe_environment is unavailable, rely on move_character hops (≤32 tiles) and harvest_resource/attack_mob feedback to confirm success.
  - Log every gather/hunt/cook action in chat; mention when ingredients are scarce so plans can pivot (e.g., “No corn found by R25, proceeding without corn stew”).
  - MasterCook announces each finished dish so the team knows when minimum goals are met.

  COMPLETION CHECKLIST
  - Inventory proof (via verify_inventory) for ≥2 cooked meats, ≥1 tomato stew, and ≥1 jellyfish smoothie; corn stew noted if crafted.
  - Final chat summary lists total dishes before anyone invokes complete().
# Limitations
max_action_steps: 50

