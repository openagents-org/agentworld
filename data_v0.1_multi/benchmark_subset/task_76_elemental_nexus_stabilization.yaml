# AgentWorld Multi-Agent Task Configuration

task:
  name: "Elemental Nexus Stabilization - Tri-Shrine Containment"
  description: "Ten elemental specialists gather rare resources, craft pylons, and defend three shrines (ice, stone, tidal) to seal planar rifts within 55 rounds"

# Task objectives
objectives:
  primary: "Stabilize the Ice, Stone, and Tidal conduits by supplying each shrine with its catalyst set, energizing pylons, and defeating their guardians"
  secondary:
    - "Phase 1 (Rounds 1-10): Meet at Magical Nexus (163-168, 335-342), assign squads, audit tools"
    - "Phase 2 (Rounds 11-22): Harvest icelogs/icebeads, mine iron/coal/cinnabar, gather palmlogs/kelp/shrimp"
    - "Phase 3 (Rounds 23-34): Craft 20 iron bars, 6 pickaxes, 6 silver rings, and the three elemental staffs"
    - "Phase 4 (Rounds 35-45): Deploy to Ice Guardian (259,151), Iron Ogre (238,48), and Water Guardian (197,633) shrines and keep pylons powered"
    - "Phase 5 (Rounds 46-55): Re-sync at Magical Nexus, verify conduit inventories, log final containment report"

# Relevant game context
relevant_game_context: |
  MISSION OUTLINE
  - Ten specialists seal three elemental shrines (Ice 259,151; Stone 238,48; Tidal 197,633) within 55 rounds. Run five phases: rendezvous and role check → resource sweep → fabrication → shrine deployment → final sync. Each squad must carry its catalyst kit (elemental staff + 2 silver rings + pickaxe + 8 themed logs + 6 iron bars) before leaving the nexus.

  PHASE CHECKLIST
  1. R1-10: meet at the Magical Nexus (~165,338). ArbiterCael assigns Ice/Stone/Tidal squads, everyone verify_inventory for tools, and request missing gear immediately.
  2. R11-22: Ice Squad harvests ≥20 icelogs + ≥6 icebeads, Stone Squad mines ≥25 ironore/coal + ≥8 cinnabar, Tidal Squad gathers ≥30 palmlogs + ≥10 kelp + ≥20 rawshrimp. Couriers relay materials back to the nexus using transfer_items.
  3. R23-34: regroup to smelt 20+ iron bars, forge 6 pickaxes + 6 silver rings, and craft three elemental staffs (lightning/fire/nature). MedicLian prepares shared healing packs. ArbiterCael confirms each conduit kit contents via verify_inventory.
  4. R35-45: squads march to their shrines (≤32-tile hops) with escorts, install pylons, and defeat the local guardian with coordinated attack_entity bursts. After stabilizing, broadcast “Shrine <name> sealed, HP status, catalysts left”.
  5. R46-55: everyone returns to the nexus with leftover catalysts (≥2 logs + ≥2 bars each), Arbiter posts a final containment summary covering all three shrines, then calls complete().

  EXECUTION NOTES
  - Always run observe_environment before harvesting or approaching a shrine; if unavailable, sweep manually and report coordinates.
  - Transfers require both sides to acknowledge via verify_inventory. Keep a shared log in chat (“Iron bars 14/20 ready”, “Ice kit loaded”).
  - When two squads need the same tile, stagger with sleep(2) or offset positions to avoid action conflicts.
# Limitations
max_action_steps: 55

