# Success criteria for multi-agent task
success_criteria:
  - "ArbiterCael hosts the kickoff meeting at the Magical Nexus before Round 5, assigns squads in chat, and confirms every agent ran verify_inventory."
  - "Ice Squad delivers ≥20 icelogs and ≥6 icebead to ArbiterCael, who confirms receipt via verify_inventory before Phase 3."
  - "FlameSmithRurik crafts ≥20 ironbar plus 6 pickaxe and 6 silverring, announcing each milestone in chat."
  - "Three distinct elemental staffs (firestaff, lightningstaff, naturestaff) are crafted and held by squad leads prior to shrine deployment."
  - "Each shrine fight is handled with at least one recorded attack_entity call and a post-combat HP report (Ice Guardian, Iron Ogre, Water Guardian)."
  - "At Round 46-50 regroup, each conduit lead retains ≥2 catalyst logs and ≥2 iron bars while ArbiterCael logs a consolidated containment summary."
  - "complete() is only called after Round 50 with confirmation that all three shrines were stabilized and inventories verified."

