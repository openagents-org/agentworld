# AgentWorld Multi-Agent Task Configuration

task:
  name: "Multi-Region Supply Network - Continental Trade System"
  description: "Eight agents establish a complex supply chain spanning forests, mountains, deserts, and coasts to create ultimate crafted goods"

# Task objectives
objectives:
  primary: "Create a functioning 5-region supply network with specialized gathering teams, transport logistics, and centralized crafting over 55 rounds"
  secondary:
    - "Phase 1 (Rounds 1-8): Network Planning - Scout all regions and establish base camps"
    - "Phase 2 (Rounds 9-20): Specialized Resource Gathering - Teams gather region-specific materials simultaneously"
    - "Phase 3 (Rounds 21-32): Transport Operations - Coordinate long-distance material transfers to central hub"
    - "Phase 4 (Rounds 33-45): Mass Production - Craft advanced equipment using consolidated resources"
    - "Phase 5 (Rounds 46-55): Distribution & Validation - Deliver finished goods to all regions, complete network"

# Relevant game context
relevant_game_context: |
  NETWORK GOAL
  - Eight agents run a five-region supply chain over ~55 rounds: forest logs/sticks, mountain ores, coast feathers/strings/food, plus a central hub that smelts/crafts and redistributes finished goods. Success requires synchronized gathering, staggered transport waves, and final deliveries back out to the regions.

  PHASE OVERVIEW
  1. R1-8 Planning: assign teams (Forest, Mountain, Coast, Hub), scout their regions, and set chat protocols plus transport routes (≤32-tile hops, centralized status calls every 2-3 rounds).
  2. R9-20 Gathering: each remote team hits its quotas (e.g., forest 50 logs + 100 sticks, mountains 40 iron/40 coal/20 gold, coast 30 feathers + 30 string + 60 food). Hub monitors progress and preps recipes.
  3. R21-32 Transport: execute three delivery waves (forest → hub, then mountain, then coast). After each arrival, transfer via transfer_items, run verify_inventory, and log receipts. All teams regroup at the hub by Round 32.
  4. R33-45 Production: hub crafters smelt bars, craft weapons/bows/staffs/rings using the delivered materials, and package outbound shipments while other teams help if idle.
  5. R46-55 Distribution: split back into regional pairs, deliver finished goods to their original biomes, and confirm that each region received the assigned equipment/food crates. Call complete() only after every deliverable is acknowledged in chat.

  EXECUTION NOTES
  - Without observe_environment, sweep the region grids manually and rely on harvest_resource/attack_mob feedback plus verify_inventory counts.
  - Keep a running logistics board in chat ("Forest 30/50 logs", "Wave2 departure R25") so the hub can time smelting batches.
  - Transfers only work within ~10 tiles; both sender and receiver must confirm the transaction before moving on.
# Limitations
max_action_steps: 55

