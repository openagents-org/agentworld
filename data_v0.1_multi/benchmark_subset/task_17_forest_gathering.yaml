# AgentWorld Multi-Agent Task Configuration

task:
  name: "Forest Gathering Mission - Wilderness Team Protection"
  description: "Three agents work together where one guardian protects two collectors gathering forest resources from wildlife threats"

# Task objectives
objectives:
  primary: "Successfully protect collectors while they gather 4x palmlogs and 5x peach under wildlife threat conditions"
  secondary: # checkpoints
    - "Establish effective team communication for threat alerts"
    - "Guardian successfully defends team from hostile wildlife"
    - "Complete forest resource gathering without casualties within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent forest protection scenario requiring tactical coordination.
  
  OBJECTIVE: Successfully gather required forest resources while protecting the team from wildlife threats.
  
  MISSION REQUIREMENTS:
  - Collect 4x palmlogs and 5x peach while under potential wildlife threat
  - Keep all team members alive throughout the mission
  - Use teamwork to balance resource gathering with wilderness security
  
  TEAM COORDINATION:
  - Establish communication protocols for wildlife detection and warnings
  - Coordinate movements between protection and forest resource gathering
  - Share information about resource locations and environmental dangers
  - Work together to ensure both safety and mission success
  
  GENERAL STRATEGY:
  - The team has complementary roles in combat, lumberjacking, and foraging
  - Wildlife threats may appear and must be dealt with appropriately
  - Forest resource gathering requires moving to specific locations and materials
  - Balance efficiency with safety - casualties will cause mission failure
  - Use global chat for real-time coordination and threat alerts
  
  DO NOT use complete() until ALL objectives are achieved safely!
  
  COMBAT MECHANICS (CRITICAL KNOWLEDGE):
  🏹 Combat - Attack threats:
    - Use observe_environment to detect hostile wildlife
    - Use attack command on hostile targets
    - Use bow for ranged combat advantage
  
  🌴 Lumberjacking - palmlogs:
    - harvest_resource on palm tree instances to get palmlogs
    - Level required: 5+ (Lumberjacking skill)
    - Target: 4x palmlogs total
    - IMPORTANT: Look for "Palm" trees, NOT regular oak trees!
  
  🍑 Foraging - peach:
    - harvest_resource on peach instances
    - Level required: 5+ (Foraging skill)  
    - Target: 5x peach total
    - IMPORTANT: Look for "Peach" trees, NOT other fruit trees!

# Limitations
max_action_steps: 25

