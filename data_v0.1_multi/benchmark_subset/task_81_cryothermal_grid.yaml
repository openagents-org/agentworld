# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cryothermal Grid Stabilization - Dual-Biome Energy Project"
  description: "Ten specialists connect the northern ice shelf with the southern lava vents by building three synchronized pylons powered by crafted elemental foci."

# Task objectives
objectives:
  primary: "Stabilize the cryothermal grid by collecting ice and lava resources, forging conduits, and activating pylons at (260,150), (320,360), and (180,620) within 55 rounds."
  secondary:
    - "Phase 1: Ice squad harvests 12 icelogs and 3 icebeads near (259,151) while scouting safe transit routes."
    - "Phase 2: Lava squad harvests 12 bloodwoodlogs and 3 firebeads around (160,610) and secures vent access."
    - "Phase 3: Alloy squad mines 12 ironore + 12 coal, smelts 12 ironbar, and crafts 3 silverring connectors."
    - "Phase 4: Logistics convoy moves materials to the three pylons, verifying inventories before installation."
    - "Phase 5: Assembly team crafts icestaff, firestaff, lightningstaff, and sequentially activates pylons with full chat logs."

# Relevant game context (Hint)
relevant_game_context: |
  WORKFLOW SNAPSHOT
  - Agents 1-3 (Ice Stabilizers) stay within the ice plateau until quotas are complete, then escort resources south.
  - Agents 4-6 (Lava Stabilizers) control heat vents, collect bloodwood + firebeads, and prepare the southern pylon site.
  - Agents 7-8 (Metalworks + Scout) gather ores, smelt bars at (250,50), and retrieve lightningbead from coastal mobs near (520,420).
  - Agents 9-10 (Grid Pilots) coordinate installation at the central basin, keeping all pylons within line-of-sight during activation.
  
  KEY TASK DETAILS
  1. Gathering rules:
     • use observe_environment radius=32 to find tree/ore nodes, then harvest_resource targetInstance=<id>.
     • lightningbead can be looted from coastal mobs; RelayScout (Agent 8) handles combat + pickup_resource.
     • convert logs → sticks via craft_item Fletching stick when preparing staff shafts.
  2. Crafting chain:
     • icestaff: craft 5 sticks + bead to staff, then combine with icebead.
     • firestaff: same flow using firebead.
     • lightningstaff: assemble staff + lightningbead after RelayScout returns.
     • silverring connectors: craft_item Smithing silverring using ironbar pairs.
  3. Logistics:
     • All transfers happen at staging points (ice camp, smeltery, or central basin) via transfer_items.
     • Every shipment must be confirmed with verify_inventory in chat.
     • Before activating a pylon, ensure one staff + four matching logs + one silverring sit in the same inventory.
  4. Activation order:
     • North → Central → South. After each activation, post “Pylon X online – resources remaining Y”.
     • complete() only after all three pylons report active and both Grid Pilots confirm zero unplaced staffs.

# Limitations
max_action_steps: 55

