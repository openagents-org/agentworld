# Success criteria for multi-agent task
success_criteria:
  - "Ice Stabilizers document harvesting at least 12 icelogs + 3 icebeads and announce departure from the plateau."
  - "Lava Stabilizers deliver 12 bloodwoodlogs + 3 firebeads to the southern staging point and confirm vent safety."
  - "AlloyCommander produces 12 ironbar and 3 silverring connectors; RelayScout secures 1 lightningbead."
  - "Every transfer is validated at staging points with verify_inventory screenshots in chat."
  - "Icestaff, firestaff, and lightningstaff are crafted and assigned to GridPilot/HarmonicAnchor before activation."
  - "Each pylon activation is broadcast with remaining resource counts and all agents regroup at (300-320,340-360) before calling complete()."

