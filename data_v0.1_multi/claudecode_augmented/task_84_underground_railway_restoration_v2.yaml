# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Extended 12-agent grand tunnel network restoration

task:
  name: "Underground Railway Restoration - Grand Cavern Transit Network"
  description: "Twelve spelunkers reopen the expanded railway network, clearing five blockages, laying six signal beacons, and testing multiple supply carts within 65 rounds."

# Task objectives
objectives:
  primary: "Reconnect the North Shaft (230,60), West Junction (150,300), East Junction (550,300), and South Exit (480,620), then escort supply carts along all routes."
  secondary:
    - "Phase 1 (Rounds 1-12): Survey team charts all collapsed corridors and junctions."
    - "Phase 2 (Rounds 13-28): Excavation team clears five blockages with lumber support."
    - "Phase 3 (Rounds 29-42): Beacon team crafts and installs six signal staffs."
    - "Phase 4 (Rounds 43-54): Security team removes hostile mobs at checkpoints."
    - "Phase 5 (Rounds 55-65): Logistics teams push two supply carts along different routes."

# Relevant game context
relevant_game_context: |
  MAP OVERVIEW
  - North Shaft (230,60) ↔ Mid Hub (350,320) ↔ South Exit (480,620)
  - West Junction (150,300) ↔ Mid Hub (350,320) ↔ East Junction (550,300)
  - Keep at least two agents stationed at each hub during operations.

  BLOCKAGE CLEARING
  - Each collapse consumes ~6 pickaxe swings. Gather 20 ironore + 20 coal, smelt into 20 ironbar, and craft four replacement pickaxes.
  - TimberJack supplies 16+ logs to brace tunnels; confirm "Brace ready" before mining.

  SIGNAL BEACONS
  - BeaconSmith crafts three lightningstaff (direction markers) and three firestaff (hazard markers).
  - Plant beacons at North Shaft, West Junction, East Junction, Mid Hub, South Exit, and one underground junction.

  SECURITY + CARTS
  - TunnelGuard squad patrols ahead, attacking spectres/scorpions.
  - Two QuarterCarts: one runs North→South, one runs West→East.
  - At least three escorts per cart within 5 tiles at all times.

  COMPLETION
  - Need chat log of five cleared blockages, six active beacons, and both cart arrivals.

# Limitations
max_action_steps: 65

