# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Hunt multiple Worker Ants instead of high-level creatures

task:
  name: "Elite Combat - Ant Colony Assault"
  description: "Two agents coordinate to defeat 5 Worker Ants"

# Task objectives
objectives:
  primary: "Defeat 5 Worker Ants through elite combat coordination"
  secondary: # checkpoints
    - "Locate Worker Ant colony"
    - "Complete assault within 22 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is an elite combat scenario focusing on multiple targets.

  OBJECTIVE: Demonstrate elite combat skills by defeating multiple ants.

  MISSION REQUIREMENTS:
  - Navigate to ant territory
  - Defeat 5 Worker Ants efficiently
  - Use coordinated tactics

  TEAM COORDINATION:
  - Coordinate attacks for efficiency
  - Share healing resources
  - Focus fire on one target at a time

  COMBAT KNOWLEDGE:
  🐜 Combat - Worker Ants:
    - Level 46 creatures
    - Multiple targets require coordination
    - Efficient elimination is key

  DO NOT use complete() until 5 Worker Ants are defeated!

# Limitations
max_action_steps: 22

