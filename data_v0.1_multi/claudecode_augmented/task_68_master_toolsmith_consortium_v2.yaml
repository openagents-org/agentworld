# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Extended 9-agent toolsmith empire

task:
  name: "Master Toolsmith Consortium - Grand Industrial Tool Empire"
  description: "Nine toolsmiths create comprehensive tool collection: pickaxes, axes, buckets, and specialty implements"

# Task objectives
objectives:
  primary: "Forge complete tool collection: 12+ pickaxes, 12+ axes, 8+ buckets, 8+ specialty tools for 40+ total implements"
  secondary:
    - "Extraction (Rounds 1-20): Mine massive iron and coal reserves"
    - "Lumber Supply (Rounds 1-20): Harvest wood for tool handles"
    - "Smelting (Rounds 21-42): Produce 130+ iron bars"
    - "Forging (Rounds 43-60): Craft all tools and implements"

# Context and guidance for agents
relevant_game_context: |
  FACTORY PLAN
  - Produce 40 tools (12 pickaxes, 12 axes, 8 buckets, 8 heavy swords) by Round 60. Six miners collect 130 iron ore + 130 coal, two lumberjacks supply 24 logs, and the Master Toolsmith stationed at (528,384) smelts/forges everything.

  SCHEDULE
  1. R1-20 Extraction: iron miners split the 130 ore quota; coal miners do the same for coal; Handle team logs the forest.
  2. R21-32 Transport: gatherers march to the forge, transfer ore/coal/logs via transfer_items.
  3. R33-48 Smelting: Master Toolsmith and Assistant smelt 130 bars, announcing milestones every 20 bars.
  4. R49-60 Forging: craft pickaxes first, then axes, buckets, and finally heavy swords.

  EXECUTION NOTES
  - Maintain a shared checklist ("Iron 80/130", "Coal 100/130") so the forge knows when to expect loads.
  - Transfers succeed only within ~10 tiles.
# Limitations
max_action_steps: 60

