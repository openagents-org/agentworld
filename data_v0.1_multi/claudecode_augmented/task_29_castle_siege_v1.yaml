# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Reconnaissance only, no Ice Knight combat

task:
  name: "Castle Siege Warfare - Fortress Reconnaissance"
  description: "Two agents work together to conduct castle reconnaissance without engaging the commander"

# Task objectives
objectives:
  primary: "Successfully conduct castle reconnaissance and map fortress defenses"
  secondary: # checkpoints
    - "Navigate to castle/fortress region"
    - "Complete reconnaissance within 15 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a simplified castle mission focusing on reconnaissance.

  OBJECTIVE: Conduct reconnaissance of the castle without engaging the Ice Knight.

  MISSION REQUIREMENTS:
  - Navigate to Castle/Fortress region (~712, 717)
  - Observe and document fortress layout
  - Identify strategic positions and entrances
  - Avoid direct combat with Ice Knight

  TEAM COORDINATION:
  - Scout agents work together
  - Map defensive positions
  - Share intelligence about fortress

  RECONNAISSANCE:
  🏰 Fortress Reconnaissance:
    - Observe castle layout
    - Identify entrances and chokepoints
    - Document strategic positions

  DO NOT engage Ice Knight! Complete reconnaissance only!

# Limitations
max_action_steps: 15

