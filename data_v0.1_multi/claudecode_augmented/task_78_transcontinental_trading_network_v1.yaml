# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Simplified 6-agent trading network

task:
  name: "Transcontinental Trading Network - Core Regional Exchange"
  description: "Six agents gather resources from 3 regions, establish trade routes, and craft 3 items requiring cross-regional cooperation"

# Task objectives
objectives:
  primary: "Establish a trading network where 6 agents gather resources, travel to hubs, and craft 3 items requiring materials from 3+ regions"
  secondary:
    - "Phase 1 (Rounds 1-10): Regional Resource Gathering"
    - "Phase 2 (Rounds 11-20): Travel to Regional Hub"
    - "Phase 3 (Rounds 21-30): Consolidation and Smelting"
    - "Phase 4 (Rounds 31-40): Coordinated Crafting"

# Relevant game context
relevant_game_context: |
  SUPPLY CHAIN PLAN
  - Six agents harvest materials from three regions, regroup at central hub (400,250), and craft three cross-regional items within ~40 rounds.
  - Phase 1: each agent harvests their quota (logs, ores, gems, fish).
  - Phase 2: agents march to central hub.
  - Phase 3: consolidate materials, smelt bars.
  - Phase 4: craft golden ring, silver ring, wooden bow.

  EXECUTION NOTES
  - Use transfer_items + verify_inventory for every handoff.
  - Keep running manifest in chat.
# Limitations
max_action_steps: 40

