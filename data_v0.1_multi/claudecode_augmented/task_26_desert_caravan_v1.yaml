# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Only resource gathering, no trading required

task:
  name: "Desert Caravan Trading - Desert Resource Expedition"
  description: "Two agents work together to gather desert resources without trading requirements"

# Task objectives
objectives:
  primary: "Successfully gather 4x cactus materials and 3x desert ore from desert region"
  secondary: # checkpoints
    - "Navigate to southern desert region"
    - "Complete desert resource gathering within 20 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a simplified desert expedition focusing on resource gathering.

  OBJECTIVE: Gather desert resources efficiently.

  MISSION REQUIREMENTS:
  - Navigate to Southern Desert region (200-600, 600-768)
  - Gather cactus materials from desert plants
  - Mine desert ore from rocky areas
  - Survive desert heat with proper supplies

  TEAM COORDINATION:
  - Forager focuses on cactus gathering
  - Miner focuses on desert ore extraction
  - Share water and healing supplies

  RESOURCE GATHERING:
  🌵 Desert Resource Gathering:
    - Use observe_environment to locate cactus and plants
    - Gather 4x cactus materials total

  ⛏️ Desert Mining:
    - harvest_resource on desert rock deposits
    - Gather 3x desert ore total

  DO NOT use complete() until resources are gathered!

# Limitations
max_action_steps: 20

# Agent configurations
