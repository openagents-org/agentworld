# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Simplified 6-agent dual-shrine stabilization

task:
  name: "Elemental Nexus Stabilization - Dual-Shrine Containment"
  description: "Six elemental specialists gather resources, craft pylons, and defend two shrines to seal planar rifts within 40 rounds"

# Task objectives
objectives:
  primary: "Stabilize the Ice and Stone conduits by supplying each shrine with its catalyst set and defeating their guardians"
  secondary:
    - "Phase 1 (Rounds 1-8): Meet at Magical Nexus, assign squads, audit tools"
    - "Phase 2 (Rounds 9-18): Harvest icelogs/icebeads, mine iron/coal"
    - "Phase 3 (Rounds 19-28): Craft 12 iron bars, 3 pickaxes, 3 silver rings, two elemental staffs"
    - "Phase 4 (Rounds 29-40): Deploy to shrines and activate pylons"

# Relevant game context
relevant_game_context: |
  MISSION OUTLINE
  - Six specialists seal two elemental shrines (Ice 259,151; Stone 238,48) within 40 rounds.
  - Phase 1: meet at nexus, assign Ice/Stone squads.
  - Phase 2: Ice Squad harvests >=12 icelogs + >=3 icebeads; Stone Squad mines >=15 ironore/coal.
  - Phase 3: smelt 12+ iron bars, forge 3 pickaxes + 3 silver rings, craft two staffs.
  - Phase 4: deploy to shrines, defeat guardians, activate pylons.

  EXECUTION NOTES
  - Transfers require both sides to verify_inventory.
  - Keep shared log in chat for material tracking.
# Limitations
max_action_steps: 40

