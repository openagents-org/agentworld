# AgentWorld Multi-Agent Task Configuration

task:
  name: "Grand Jewelry Expedition - Simplified 6-Agent Gemstone Collection"
  description: "Six agents coordinate a jewelry expedition involving mob hunting, gemstone gathering, ore mining, and jewelry crafting"

# Task objectives
objectives:
  primary: "Complete a 4-stage jewelry production expedition creating 2x Ruby Rings, 1x Emerald Pendant, and 1x Beryl Pendant"
  secondary:
    - "Stage 1 (Rounds 1-10): Mob Hunting Brigade - Hunt specific mobs for gem drops"
    - "Stage 2 (Rounds 11-20): Mining Operations - Extract gold and special ores"
    - "Stage 3 (Rounds 21-32): Intermediate Crafting & Assembly"
    - "Stage 4 (Rounds 33-45): Quality Control & Distribution - Verify and distribute jewelry"

# Context and guidance for agents
relevant_game_context: |
  EXPEDITION OVERVIEW
  - Six specialists complete four stages in ~45 rounds to deliver: 2 rubyring, 1 emeraldpendant, 1 berylpendant. Hunters gather gemstones, miners collect gold + coal + string, and jewelers craft everything at the mountain rendezvous (~230,38).

  STAGE SUMMARY
  1. R1-10 Mob hunting & foraging (Agents 1-2)
     • Ruby_Hunter: chase lvl 15–20 mobs near (350,250) until 2 rubies drop.
     • Combat_Support: forage 1 beryl + 1 emerald, then assist kills and consolidate all gems via transfer_items.
  2. R11-20 Mining (Agents 3-4)
     • Gold_Miner extracts ≥4 gold ore; Coal_Miner gathers ≥6 coal and 2 string.
     • Rather than dragging ore to the hub, have Smelter travel toward the mines for pickup.
  3. R21-32 Transit & smelting
     • Smelter reaches the mines, smelts 4 goldbars → crafts 2 goldrings.
     • Jeweler marches from (528,384) toward the mines while Combat_Support carries the gems there.
  4. R33-45 Jewelry assembly at the mountain camp
     • Once all crafters are co-located, run a quick transfer log.
     • Jeweler crafts 2 rubyring + 1 emeraldpendant + 1 berylpendant.

  EXECUTION NOTES
  - Use ≤32-tile move_character hops, announcing coordinates at each checkpoint so the team can converge.
  - attack_entity handles combat; heal whenever HP < 60%.

  COMPLETION
  - Before complete(), list final inventory totals for all four jewelry pieces and note which agent carries each.
# Limitations
max_action_steps: 45

