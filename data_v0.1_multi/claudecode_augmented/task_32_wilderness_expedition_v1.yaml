# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Only defeat Worker Ants (easier), no resource gathering

task:
  name: "Wilderness Expedition - Worker Ant Hunting"
  description: "Two agents work together to hunt Worker Ants in the wilderness"

# Task objectives
objectives:
  primary: "Defeat 3 Worker Ants through coordinated combat"
  secondary: # checkpoints
    - "Locate Worker Ants in wilderness area"
    - "Complete ant hunting within 20 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a simplified wilderness combat scenario targeting easier creatures.

  OBJECTIVE: Hunt and defeat Worker Ants in the wilderness.

  MISSION REQUIREMENTS:
  - Navigate wilderness areas
  - Locate Worker Ants (Level 46)
  - Defeat 3 Worker Ants through coordinated combat
  - No resource gathering required

  TEAM COORDINATION:
  - Both agents focus on combat
  - Coordinate attacks for efficiency
  - Share healing resources

  COMBAT KNOWLEDGE:
  🐜 Combat - Worker Ants:
    - Level 46 creatures, easier than Wolves
    - Use observe_environment to locate
    - Coordinate attacks for quick defeat

  DO NOT use complete() until 3 Worker Ants are defeated!

# Limitations
max_action_steps: 20

