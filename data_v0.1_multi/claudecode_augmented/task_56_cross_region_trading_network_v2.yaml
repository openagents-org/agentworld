# Success criteria for multi-agent task
success_criteria:
  - "Phase 1: Forest Team gathers 20+ logs from Western Forest region"
  - "Phase 1: Mountain Team mines 12+ gold ore and 14+ coal from Northern Mountains"
  - "Phase 1: Coastal Team forages 8+ beads and obtains 3+ lightningbead from Eastern Coast"
  - "Phase 2: All teams travel to Central Hub (528, 384) covering 1200+ total tiles"
  - "Phase 2: Teams execute sequential transfer protocol without deadlocks"
  - "Phase 2: Crafter_Gold receives 12 gold ore, 14 coal, maintains 2 hilt2"
  - "Phase 2: Crafter_Magic receives 20 logs, 8 beads, 3 lightningbead"
  - "Phase 3: Crafter_Gold smelts 8+ gold bars from gold ore and coal"
  - "Phase 3: Crafter_Magic crafts 16+ sticks from logs"
  - "Phase 3: Crafter_Gold crafts exactly 4x Gold Rings from gold bars"
  - "Phase 3: Crafter_Magic crafts 3x Magic Staffs from sticks and beads"
  - "Phase 3: Crafter_Magic upgrades 3x Magic Staffs to Lightning Staffs"
  - "Phase 3: Crafter_Gold crafts 2x Heavy Swords from iron bars and hilts"
  - "Phase 4: Final verification confirms 4 gold rings, 3 lightning staffs, 2 heavy swords"
  - "All agents use chat extensively throughout all 4 phases for coordination"
  - "All transfers completed successfully using transfer_items function"
  - "Task completed in 55-58 rounds demonstrating efficient cross-region coordination"
  - "Trading network successfully established across 6 different biomes"
