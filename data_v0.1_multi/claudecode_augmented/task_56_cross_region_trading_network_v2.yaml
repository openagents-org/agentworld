# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cross-Region Trading Network - Extended 8-Agent Trade Empire"
  description: "Eight agents establish an extensive trading network across six different regions, gathering unique resources and consolidating them for advanced crafting"

# Task objectives
objectives:
  primary: "Establish a cross-region trading network to gather resources from 6 different biomes and craft 4x Golden Rings, 3x Lightning Staffs, and 2x Heavy Swords"
  secondary:
    - "Phase 1 (Rounds 1-18): Regional Resource Gathering - Each team gathers biome-specific resources"
    - "Phase 2 (Rounds 19-35): Cross-Region Travel & Trading - Consolidate materials with designated crafters"
    - "Phase 3 (Rounds 36-50): Collaborative Crafting - Create intermediate and final items"
    - "Phase 4 (Rounds 51-58): Final Assembly & Verification - Complete all crafting objectives"

# Context and guidance for agents
relevant_game_context: |
  GOAL SNAPSHOT
  - Eight agents operate in four pods: Forest (logs), Mountain (gold ore + coal), Coast (beads + lightningbeads), and a central crafting trio. After gathering, everyone meets at (528,384) to smelt/craft: 4 gold rings, 3 lightning staffs, and 2 heavy swords within ~58 rounds.

  PHASE OUTLINE
  1. R1-18 Gather
     • Forest pair harvest 20 logs and convert some to sticks if time permits.
     • Mountain pair mine ≥12 gold ore and ≥14 coal.
     • Coastal runners forage 8 beads and hunt until 3 lightningbeads drop.
  2. R19-35 Travel + Transfers
     • Pods hop ≤32 tiles per move toward the hub, posting coordinates after each hop.
     • Transfer order: Forest → Crafter_Magic (logs), Mountain → Crafter_Gold (ore/coal), Coast → Crafter_Magic (beads). Each transfer uses transfer_items with verify_inventory confirmations logged in chat.
  3. R36-50 Crafting
     • Crafter_Gold smelts goldbar (goldore+coal) then crafts 4 goldrings and, once ironbars exist, 2 sword2 (Heavy Swords).
     • Crafter_Magic turns logs into sticks, crafts 3 staffs, then upgrades them with lightningbeads into 3 lightningstaffs.
  4. R51-58 Verification
     • All crafters list their finished items, distribute them if desired, and summarize the campaign before calling complete().

  EXECUTION NOTES
  - When observe_environment is missing, sweep the listed coordinate bands manually and rely on harvest_resource/attack_entity success plus inventory checks for feedback.
  - Keep one chat thread for resource totals ("Forest logs 15/20", "Gold bars 6/8") so the hub knows when to expect deliveries.
  - If lightningbeads prove stubborn, log every attempt; two beads is acceptable for minimum success, but try for three.

  COMPLETION CHECKLIST
  - Verified inventories show: 4 goldrings, 3 lightningstaffs, 2 heavy swords.
  - Each pod states its final contribution via chat, then the designated leader calls complete() with a short phase summary.
# Limitations
max_action_steps: 58

