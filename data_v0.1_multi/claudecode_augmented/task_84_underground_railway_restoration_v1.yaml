# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Simplified 6-agent tunnel restoration

task:
  name: "Underground Railway Restoration - Core Tunnel Revival"
  description: "Six spelunkers reopen the abandoned railway, clearing debris, laying signal beacons, and testing a supply cart within 40 rounds."

# Task objectives
objectives:
  primary: "Reconnect the North Shaft (230,60) and South Exit (480,620) through the underground tunnel, then escort a supply cart end-to-end."
  secondary:
    - "Phase 1 (Rounds 1-10): Survey team charts collapsed corridors."
    - "Phase 2 (Rounds 11-22): Excavation team clears two blockages."
    - "Phase 3 (Rounds 23-32): Beacon team crafts and installs two signal staffs."
    - "Phase 4 (Rounds 33-40): Logistics team pushes supply cart from north to south."

# Relevant game context
relevant_game_context: |
  MAP OVERVIEW
  - North Shaft (230,60) ↔ Mid Hub (350,320) ↔ South Exit (480,620).

  BLOCKAGE CLEARING
  - Each collapse consumes ~6 pickaxe swings. Gather 8 ironore + 8 coal, smelt into 8 ironbar, and craft one replacement pickaxe.
  - TimberJack supplies logs to brace tunnels; confirm "Brace ready" before mining.

  SIGNAL BEACONS
  - BeaconSmith crafts one lightningstaff and one firestaff using sticks + beads.
  - Plant beacons at North Shaft and South Exit.

  COMPLETION
  - Need chat log of two cleared blockages, two active beacons, and cart arrival.

# Limitations
max_action_steps: 40

