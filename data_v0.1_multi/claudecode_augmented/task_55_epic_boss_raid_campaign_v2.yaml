# AgentWorld Multi-Agent Task Configuration

task:
  name: "Epic Boss Raid Campaign - Extended 4-Boss Challenge with 4 Warriors"
  description: "Four elite warriors embark on an extended boss raid campaign, defeating 4 bosses across regions with preparation phases between encounters"

# Task objectives
objectives:
  primary: "Complete a 6-phase boss raid campaign with crafting, resource gathering, and 4 boss battles spanning 55 rounds"
  secondary: # checkpoints (6 phases)
    - "Phase 1 (Rounds 1-12): Equipment Preparation - Craft weapons and tools"
    - "Phase 2 (Rounds 13-20): First Boss - Defeat Goblin"
    - "Phase 3 (Rounds 21-28): Resource Expansion - Gather advanced materials"
    - "Phase 4 (Rounds 29-36): Second Boss - Defeat Skeleton"
    - "Phase 5 (Rounds 37-46): Third Boss - Defeat Ogre"
    - "Phase 6 (Rounds 47-55): Final Boss - Defeat Spectre"
    - "Complete ALL 6 phases in sequence over 50-55 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  RAID ROADMAP (55 ROUNDS, 6 PHASES)
  1. R1-12 Prep: cut 6 logs, mine 12 iron + 12 coal at (230,38), smelt 12 bars, craft 3 heavy swords + 1 pickaxe, stock healing items.
  2. R13-20 Goblin: travel (~350,250), locate a level 10-15 goblin via observation/mob list, ensure HP>80%, all four attack_mob the same ID.
  3. R21-28 Recovery/loot run: heal to >90%, gather bonus materials (gold or gems) and extra food; share totals in chat.
  4. R29-36 Skeleton: hunt cemetery/dungeon zones (~200,100 or 350,200), repeat synchronized attack procedure.
  5. R37-46 Ogre: head back near (238,48), run full ready check (HP>90%, healing stocked) before attacking.
  6. R47-55 Final boss: Spectre (≈230,30). Everyone must be at 100% HP with ≥5 heals, attack simultaneously, then record victory logs.

  EXECUTION RULES
  - After every phase, post "Phase X complete – [summary]". Use transfer_items to funnel ore/bars to whoever crafts. attack_mob is preferred for bosses so loot and combat reporting are automatic.
  - Never engage a boss with HP<80%; if supplies dip, pause the campaign and restock even if it delays the schedule.
  - Minimum success requires Phase 1 gear, at least three bosses, and the run lasting ≥45 rounds.

  COMPLETION CHECK
  - By Round 53-55 each agent states: crafted gear, bosses defeated, current HP/healing. Only after all confirm may one agent call complete() summarizing all six phases.
# Limitations
max_action_steps: 55

