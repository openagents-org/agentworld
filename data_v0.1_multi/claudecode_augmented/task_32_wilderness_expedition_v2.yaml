# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Only foraging and exploration, no combat

task:
  name: "Wilderness Expedition - Foraging Adventure"
  description: "Three agents work together to explore wilderness and gather 6x blueberry and 4x apple"

# Task objectives
objectives:
  primary: "Explore wilderness and gather 6x blueberry and 4x apple"
  secondary: # checkpoints
    - "Establish wilderness exploration coordination"
    - "Complete foraging expedition within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a peaceful wilderness foraging scenario without combat.

  OBJECTIVE: Explore wilderness and gather fruits through foraging.

  MISSION REQUIREMENTS:
  - Navigate wilderness areas
  - Gather 6x blueberry from blueberry bushes
  - Gather 4x apple from apple trees
  - Coordinate foraging efforts

  TEAM COORDINATION:
  - Share information about resource locations
  - Coordinate gathering to avoid overlap
  - Focus on efficient foraging routes

  FORAGING KNOWLEDGE:
  🫐 Foraging - blueberry:
    - harvest_resource on blueberry instances
    - Level required: 1+ (Foraging skill)
    - Target: 6x blueberry total

  🍎 Foraging - apple:
    - harvest_resource on apple tree instances
    - Level required: 1+ (Foraging skill)
    - Target: 4x apple total

  DO NOT use complete() until all resources are gathered!

# Limitations
max_action_steps: 25

