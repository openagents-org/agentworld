# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Simplified 5-agent 2-wave defense

task:
  name: "Fortress Siege Defense - Core Defense"
  description: "Five defenders prepare fortifications and withstand 2 waves of enemy attacks"

# Task objectives
objectives:
  primary: "Defend a fortress against 2 progressive enemy waves over 38 rounds with preparation phases"
  secondary:
    - "Phase 1 (Rounds 1-12): Fortress Preparation - Build defenses and craft equipment"
    - "Phase 2 (Rounds 13-22): First Wave - Repel Goblin assault (Level 10-15)"
    - "Phase 3 (Rounds 23-30): Reinforcement - Upgrade defenses for harder wave"
    - "Phase 4 (Rounds 31-38): Second Wave - Survive Skeleton invasion (Level 18-25)"

# Relevant game context
relevant_game_context: |
  DEFENSE OVERVIEW
  - Five defenders must hold the fortress at (~355,305) through two escalating waves (goblins -> skeletons) with preparation breaks between phases.

  PHASE QUICK GUIDE
  1. R1-12 Setup: assign roles, gather logs/ore/coal nearby, craft swords, bows, arrows, stock ~60 heals. Establish formation.
  2. R13-22 Wave 1 (Goblins L10-15): verify HP, then focus-fire each goblin using attack_mob while staying in formation. Heal back to >=90% afterward.
  3. R23-30 Reinforcement: regroup, gather extra materials, craft axes, rings, more arrows; redistribute gear.
  4. R31-38 Wave 2 (Skeletons L18-25): return to formation at full HP, burn down each skeleton together, healing between fights.

  EXECUTION NOTES
  - After every transfer/craft, run verify_inventory and post status.
  - Keep formation references in chat so re-positioning stays consistent.
# Limitations
max_action_steps: 38

