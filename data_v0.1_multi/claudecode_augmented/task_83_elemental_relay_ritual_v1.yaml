# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Simplified 6-agent dual-biome convergence

task:
  name: "Elemental Relay Ritual - Dual-Biome Convergence"
  description: "Six adepts retrieve two elemental cores from distant biomes and perform a timed relay ritual at the Central Obelisk within 38 rounds."

# Task objectives
objectives:
  primary: "Deliver Earth and Flame cores to the Central Obelisk (500,300) and channel them without dropping control of the relay baton."
  secondary:
    - "Phase 1 (Rounds 1-12): Forest team secures the Earth core."
    - "Phase 2 (Rounds 13-24): Desert team secures the Flame core."
    - "Phase 3 (Rounds 25-32): Central relay completes handoffs."
    - "Phase 4 (Rounds 33-38): Seal the obelisk."

# Relevant game context
relevant_game_context: |
  CORE RECIPES
  - Earth core: gather beryl (mining) + string, craft_item Crafting berylpendant.
  - Flame core: smelt goldbar and craft_item Smithing goldring for the core token.

  RITUAL PROTOCOL
  1. Biome teams (Agents 1-4) operate independently until cores are ready.
  2. RelayCaptain (Agent 5) stands at (500,300) with baton (any staff).
  3. ChantMedic (Agent 6) keeps RelayCaptain above 75% HP.
  4. verify_inventory after each handoff.
  5. complete() after both cores rest at the obelisk.

# Limitations
max_action_steps: 38

