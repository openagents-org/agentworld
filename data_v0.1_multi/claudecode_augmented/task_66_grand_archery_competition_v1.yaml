# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Simplified 4-agent archery production

task:
  name: "Grand Archery Competition - Focused Arrow & Bow Production"
  description: "Four archery specialists produce arrows, craft bows, and prepare for competition"

# Task objectives
objectives:
  primary: "Produce archery arsenal: 30+ arrows, 3+ bows"
  secondary:
    - "Materials (Rounds 1-12): Gather feathers, logs, strings"
    - "Production (Rounds 13-28): Craft sticks and base items"
    - "Assembly (Rounds 29-38): Arrow production, bow crafting"
    - "Competition (Rounds 39-42): Display complete archery arsenal"

# Context and guidance for agents
relevant_game_context: |
  COMPETITION OVERVIEW
  - Produce ≥30 arrows and ≥3 bows for the grand event by Round 42. One hunter collects feathers, one lumberjack harvests logs, and the hub pair converts everything into sticks/arrows/bows.

  TIMELINE
  1. R1-12 Gathering: Feather hunter hunts chickens/birds until 30+ feathers. Lumberjack logs the western forest for at least 8 logs.
  2. R13-28 Delivery: gatherers march to the hub (528,384), transfer logs + feathers to Arrow_Crafter.
  3. R29-38 Production: Arrow_Crafter turns logs → sticks then crafts arrows. Bow_Crafter uses string/logs to craft wooden bows.
  4. R39-42 Verification: Publish final counts ("Arrows 30+, Bows 3+").

  EXECUTION NOTES
  - Keep a running group checklist ("Feathers 20/30", "Logs 5/8").
  - If string shortages appear, hunt spiders or forage vines.
# Limitations
max_action_steps: 42

