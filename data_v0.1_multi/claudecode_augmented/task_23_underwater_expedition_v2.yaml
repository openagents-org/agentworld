# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - 4 agents, harvest more resources and craft underwater equipment

task:
  name: "Underwater Expedition - Deep Sea Harvesting Operation"
  description: "Four agents work together to harvest large quantities of marine resources and craft special underwater items"

# Task objectives
objectives:
  primary: "Successfully harvest 8x jellyfish and 6x clam, then craft 2x jellyfishsmoothie"
  secondary: # checkpoints
    - "Establish efficient underwater harvesting coordination"
    - "Execute marine resource gathering with full team"
    - "Complete deep sea expedition within 40 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is an expanded underwater expedition with larger team and crafting goals.

  OBJECTIVE: Harvest large quantities of marine resources and create exotic smoothies.

  MISSION REQUIREMENTS:
  - Navigate to coastal and underwater areas
  - Harvest 8x jellyfish with fishing team
  - Harvest 6x clam from deep areas
  - Craft 2x bowlsmall for smoothie containers
  - Create 2x jellyfishsmoothie as final products

  TEAM COORDINATION:
  - Fishing team focuses on jellyfish and clam harvesting
  - Crafter gathers logs and makes bowls
  - Chef combines ingredients for smoothies
  - Share resources for efficient crafting

  CRAFTING RECIPES:
  🪄 Fletching Recipe - stick:
    - craft_item skill=Fletching itemKey=stick
    - Materials: 1x logs → 4x stick

  🥣 Fletching Recipe - bowlsmall:
    - craft_item skill=Fletching itemKey=bowlsmall
    - Materials: 2x stick → 1x bowlsmall

  🎐 Cooking Recipe - jellyfishsmoothie:
    - craft_item skill=Cooking itemKey=jellyfishsmoothie
    - Materials: 1x jellyfish + 1x bowlsmall → 1x jellyfishsmoothie
    - Level required: 10 (Cooking skill)

  DO NOT use complete() until 2x jellyfishsmoothie is created!

# Limitations
max_action_steps: 40

