# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Simple silver ring crafting only

task:
  name: "Grand Jewelry Workshop - Silver Ring Production"
  description: "Two agents smelt iron bars and craft 2x silver rings"

# Task objectives
objectives:
  primary: "Smelt iron bars and craft 2x silver rings"
  secondary: # checkpoints
    - "Coordinate smelting and ring crafting"
    - "Complete ring production within 22 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a simplified ring crafting scenario.

  OBJECTIVE: Produce 2x silver rings from iron materials.

  MISSION REQUIREMENTS:
  - Smelt iron ore into iron bars
  - Craft 2x silver rings from iron bars
  - Each silver ring needs iron bars

  TEAM COORDINATION:
  - Smelter converts ore to bars
  - Jeweler crafts the rings

  STARTING RESOURCES:
  - Miner has 3x ironore + 4x coal
  - Smelter has 2x ironore + 3x coal

  CRAFTING:
  🔥 Smelting - ironbar:
    - 1x ironore + 1x coal → 1x ironbar

  💍 Smithing - silverring:
    - craft_item skill=Smithing itemKey=silverring
    - Materials: ironbar → silverring

  DO NOT use complete() until 2x silverring is crafted!

# Limitations
max_action_steps: 22

