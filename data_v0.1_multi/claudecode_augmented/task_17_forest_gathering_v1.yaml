# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Only 2 agents, both collectors share protection duties, reduced targets

task:
  name: "Forest Gathering Mission - Self-Reliant Collector Team"
  description: "Two collectors work together to gather forest resources while protecting each other"

# Task objectives
objectives:
  primary: "Successfully gather 3x palmlogs and 3x peach through mutual cooperation"
  secondary: # checkpoints
    - "Establish effective team communication"
    - "Complete forest resource gathering within 20 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent forest gathering scenario without a dedicated guardian.

  OBJECTIVE: Successfully gather required forest resources through teamwork.

  MISSION REQUIREMENTS:
  - Collect 3x palmlogs and 3x peach
  - Both agents help each other and watch for threats
  - Use teamwork to complete resource gathering efficiently

  TEAM COORDINATION:
  - Share information about resource locations
  - Both collectors have basic defense capabilities
  - Work together to ensure mission success

  GENERAL STRATEGY:
  - No dedicated guardian - collectors protect themselves
  - Focus on efficient resource gathering
  - Use global chat for coordination

  DO NOT use complete() until ALL objectives are achieved!

  GATHERING MECHANICS:
  🌴 Lumberjacking - palmlogs:
    - harvest_resource on palm tree instances to get palmlogs
    - Level required: 5+ (Lumberjacking skill)
    - Target: 3x palmlogs total
    - IMPORTANT: Look for "Palm" trees, NOT regular oak trees!

  🍑 Foraging - peach:
    - harvest_resource on peach instances
    - Level required: 5+ (Foraging skill)
    - Target: 3x peach total
    - IMPORTANT: Look for "Peach" trees!

# Limitations
max_action_steps: 20

# Agent configurations
