# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Defeat Mermaid and Ice Knight, no Mimic creatures

task:
  name: "Ultimate Boss Challenge - Dual Legendary Conquest"
  description: "Four agents work together to defeat both Mermaid and Ice Knight bosses"

# Task objectives
objectives:
  primary: "Successfully defeat Mermaid (Level 55) and Ice Knight (Level 62) in multi-region conquest"
  secondary: # checkpoints
    - "Establish multi-region coordination"
    - "Execute dual legendary boss combat"
    - "Complete conquest within 45 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a dual-boss challenge requiring multi-region coordination.

  OBJECTIVE: Defeat both Mermaid and Ice Knight legendary bosses.

  MISSION REQUIREMENTS:
  - Start at Coastal/Ocean region for Mermaid (580, 755)
  - Defeat Mermaid (Level 55) using water combat tactics
  - Travel to Castle/Fortress region (712, 717)
  - Defeat Ice Knight (Level 62) using siege tactics
  - No Mimic creatures required

  TEAM COORDINATION:
  - Split team for efficient multi-region operations
  - Coordinate timing for sequential boss engagements
  - Share equipment and healing resources

  COMBAT KNOWLEDGE:
  🧜‍♀️ Legendary Combat - Mermaid (Level 55):
    - Location: (580, 755)
    - Water-based attacks and healing

  ❄️ Elite Combat - Ice Knight (Level 62):
    - Location: (712, 717)
    - Heavy armor and ice attacks
    - Use fire-based attacks for advantage

  DO NOT use complete() until both bosses are defeated!

# Limitations
max_action_steps: 45

