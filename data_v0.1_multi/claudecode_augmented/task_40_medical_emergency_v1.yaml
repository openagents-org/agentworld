# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Simple health management, share food and healing

task:
  name: "Medical Emergency - Team Health Management"
  description: "Two agents coordinate health management by sharing food supplies"

# Task objectives
objectives:
  primary: "Ensure both agents maintain high health through resource sharing"
  secondary: # checkpoints
    - "Coordinate health resource distribution"
    - "Complete health management within 15 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a simple health coordination scenario.

  OBJECTIVE: Practice team health management through resource sharing.

  MISSION REQUIREMENTS:
  - Monitor team health levels
  - Share food resources (apple, flask) between agents
  - Ensure all agents maintain health above 80%
  - Practice emergency coordination

  TEAM COORDINATION:
  - Share health resources when needed
  - Coordinate resource distribution
  - Monitor each other's health status

  HEALTH MANAGEMENT:
  🍎 Food Resources:
    - Use apple and flask for health restoration
    - Share resources between team members
    - Monitor health levels regularly

  DO NOT use complete() until health management is demonstrated!

# Limitations
max_action_steps: 15

