# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Simplified 5-agent toolsmith operation

task:
  name: "Master Toolsmith Consortium - Focused Tool Production"
  description: "Five toolsmiths create tool collection: pickaxes, axes, buckets, and specialty implements"

# Task objectives
objectives:
  primary: "Forge tool collection: 4+ pickaxes, 4+ axes, 3+ buckets for 15+ total implements"
  secondary:
    - "Extraction (Rounds 1-14): Mine iron and coal reserves"
    - "Lumber Supply (Rounds 1-14): Harvest wood for tool handles"
    - "Smelting (Rounds 15-28): Produce 50+ iron bars"
    - "Forging (Rounds 29-42): Craft all tools and implements"

# Context and guidance for agents
relevant_game_context: |
  FACTORY PLAN
  - Produce 15 tools (4 pickaxes, 4 axes, 3 buckets, 2 heavy swords, 2 silverrings) by Round 42. Three miners collect 50 iron ore + 50 coal, a lumberjack supplies 10 logs, and the Master Toolsmith stationed at (528,384) smelts/forges everything.

  SCHEDULE
  1. R1-14 Extraction: iron miners split the 50 ore quota; coal miners do the same for coal; Handle_Harvester logs the forest.
  2. R15-22 Transport: gatherers march to the forge, transfer ore/coal/logs via transfer_items to the Master Toolsmith.
  3. R23-32 Smelting: Master Toolsmith executes craft_item(Smelting, ironbar) until 50 bars exist.
  4. R33-42 Forging: craft pickaxes first (5 bars + 1 log each), then axes, buckets, and swords.

  EXECUTION NOTES
  - Maintain a shared checklist ("Iron 30/50", "Coal 40/50") so the forge knows when to expect loads.
  - Transfers succeed only within ~10 tiles.
# Limitations
max_action_steps: 42

