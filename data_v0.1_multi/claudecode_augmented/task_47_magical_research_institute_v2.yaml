# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Craft base staff and upgrade to lightning staff

task:
  name: "Magical Research Institute - Lightning Staff Creation"
  description: "Three agents craft a base staff and upgrade it to lightning staff"

# Task objectives
objectives:
  primary: "Create 1x base staff and upgrade to 1x lightning staff"
  secondary: # checkpoints
    - "Coordinate staff crafting and enhancement"
    - "Complete lightning staff within 28 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is an elemental staff creation scenario.

  OBJECTIVE: Create and enhance a lightning staff.

  MISSION REQUIREMENTS:
  - Gather logs and make sticks
  - Craft 1x base magic staff
  - Enhance to 1x lightning staff

  TEAM COORDINATION:
  - Gatherer collects logs and makes sticks
  - Assembler crafts base staff
  - Enchanter upgrades to lightning staff

  STARTING RESOURCES:
  - Gatherer has 1x logs
  - Assembler has 2x bead
  - Enchanter has 1x lightningbead

  CRAFTING RECIPES:
  🪄 Fletching - stick:
    - 1x logs → 4x stick

  🔮 Crafting - staff:
    - 5x stick + 1x bead → 1x staff

  ⚡ Crafting - lightningstaff:
    - 1x staff + 1x lightningbead → 1x lightningstaff

  DO NOT use complete() until lightning staff is crafted!

# Limitations
max_action_steps: 28

