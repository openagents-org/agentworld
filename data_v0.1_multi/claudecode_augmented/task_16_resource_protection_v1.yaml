# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Reduced targets, agents start with some resources

task:
  name: "Resource Protection Mission - Quick Guardian Defense"
  description: "Three agents work together where one guardian protects two collectors from threats while they gather resources"

# Task objectives
objectives:
  primary: "Successfully protect collectors while they gather 3x logs and 2x blueberry under combat conditions"
  secondary: # checkpoints
    - "Establish effective team communication for threat alerts"
    - "Guardian successfully defends team from hostile creatures"
    - "Complete resource gathering without casualties within 20 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent protection scenario requiring tactical coordination.

  OBJECTIVE: Successfully gather required resources while protecting the team from environmental threats.

  MISSION REQUIREMENTS:
  - Collect 3x logs and 2x blueberry while under potential threat
  - Keep all team members alive throughout the mission
  - Use teamwork to balance resource gathering with security

  TEAM COORDINATION:
  - Establish communication protocols for threat detection and warnings
  - Coordinate movements between protection and resource gathering
  - Share information about resource locations and environmental dangers
  - Work together to ensure both safety and mission success

  GENERAL STRATEGY:
  - Collectors already have some starting resources
  - The team has complementary roles in combat, lumberjacking, and foraging
  - Environmental threats may appear and must be dealt with appropriately
  - Balance efficiency with safety - casualties will cause mission failure
  - Use global chat for real-time coordination and threat alerts

  DO NOT use complete() until ALL objectives are achieved safely!

  COMBAT MECHANICS (CRITICAL KNOWLEDGE):
  🏹 Combat - Attack threats:
    - Use observe_environment to detect hostile creatures
    - Use attack command on hostile targets
    - Use bow for ranged combat advantage

  🪵 Lumberjacking - logs:
    - harvest_resource on oak tree instances to get logs
    - Level required: 1+ (Lumberjacking skill)
    - Target: 3x logs total
    - IMPORTANT: Look for "Oak" trees, NOT "Willow" trees!

  🫐 Foraging - blueberry:
    - harvest_resource on blueberry instances
    - Level required: 1+ (Foraging skill)
    - Target: 2x blueberry total
    - IMPORTANT: Look for "Blueberry" bushes, NOT rocks or trees!

# Limitations
max_action_steps: 20

