# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Mining expedition, gather coal and iron ore

task:
  name: "Resource Expedition - Mining Operation"
  description: "Three agents work together to mine 4x coal and 3x iron ore"

# Task objectives
objectives:
  primary: "Mine 4x coal and 3x iron ore through coordinated mining"
  secondary: # checkpoints
    - "Locate coal and iron rock deposits"
    - "Complete mining expedition within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative mining expedition.

  OBJECTIVE: Gather mining resources efficiently through teamwork.

  MISSION REQUIREMENTS:
  - Navigate to mining areas
  - Mine 4x coal from coal rocks
  - Mine 3x iron ore from iron rocks
  - Coordinate mining efforts

  TEAM COORDINATION:
  - Share rock deposit locations
  - Coordinate mining to cover more area
  - Share resources as needed

  MINING:
  ⚫ Mining - coal:
    - harvest_resource on Coal Rock instances
    - Level required: 10+ (Mining skill)
    - Target: 4x coal total

  🔩 Mining - iron ore:
    - harvest_resource on Iron Rock instances
    - Level required: 15+ (Mining skill)
    - Target: 3x iron ore total

  DO NOT use complete() until objectives are achieved!

# Limitations
max_action_steps: 25

