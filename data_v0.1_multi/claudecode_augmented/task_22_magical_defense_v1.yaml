  This is a simplified magical defense scenario with pre-crafted equipment.

  OBJECTIVE: Defeat the Ice Wizard using pre-crafted lightning staff.

  CRITICAL: Equipment already available!
  - battle_mage_agent already has lightningstaff equipped
  - Team is ready for immediate combat engagement

  TEAM COORDINATION:
  - Locate Ice Wizard near magical areas (400-420, 300-320)
  - Coordinate magical and physical attacks
  - Defeat the Ice Wizard boss

