  primary: "Complete combat training by defeating 4 Worker Ants"
  secondary: # checkpoints
    - "Coordinate combat practice"
    - "Complete training within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a combat skill training scenario.

  OBJECTIVE: Develop combat proficiency through coordinated practice.

  MISSION REQUIREMENTS:
  - Locate Worker Ants for training
  - Practice coordinated combat tactics
  - Defeat 4 Worker Ants as training exercise
  - All trainees must participate

  TEAM COORDINATION:
  - Combat instructor leads the exercises
  - Trainees practice attack coordination
  - Share combat experience

  COMBAT TRAINING:
  🐜 Training Targets - Worker Ants:
    - Level 46 creatures
    - Good for combat practice
    - Coordinate attacks for efficiency

  DO NOT use complete() until training is complete!

