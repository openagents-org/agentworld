# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Simplified 6-agent harbor defense

task:
  name: "Grand Harbor Bastion - Core Coastal Defense"
  description: "Six harbor specialists rebuild two ballista towers and repel a coastal assault within 38 rounds"

# Task objectives
objectives:
  primary: "Construct two functional ballista towers at the coastal harbor and survive the merfolk assault"
  secondary:
    - "Phase 1 (Rounds 1-10): Stockpile timber, ore, feathers"
    - "Phase 2 (Rounds 11-22): Smelt 12 iron bars, craft 3 ballista frames + 30 arrows, cook meals"
    - "Phase 3 (Rounds 23-30): Install two towers along the seawall, assign crews"
    - "Phase 4 (Rounds 31-38): Trigger defense drill, defeat coastal boss"

# Relevant game context
relevant_game_context: |
  BASTION PLAN
  - Six defenders rebuild two ballista towers near the harbor and survive a coastal assault within 38 rounds.
  - Phase 1: timber team cuts >=30 logs + >=20 feathers, miners pull >=15 ironore/coal.
  - Phase 2: smelt 12 iron bars, forge 2 pickaxes/axes, craft 3 woodenbow frames + 30 arrows.
  - Phase 3: install two towers, assign crews.
  - Phase 4: defend against Water Guardian.

  EXECUTION NOTES
  - Transfers require sender and marshal to confirm inventories.
  - Keep formation references in chat.
# Limitations
max_action_steps: 38

