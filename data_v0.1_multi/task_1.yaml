# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cooperative Equipment Crafting - Team Dragon Slayer Preparation"
  description: "Three agents work together to gather materials, craft equipment, and prepare one agent for a dangerous dragon boss fight"

# Task objectives
objectives:
  primary: "Prepare warrior_agent with crafted heavy sword and protective equipment for dragon combat"
  secondary: # checkpoints
    - "Establish effective team communication through global chat"
    - "Ensure safe material transfer between agents"
    - "Complete all steps within 30 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent scenario where teamwork is essential.
  
  CRITICAL SUCCESS REQUIREMENTS:
  1. miner_agent MUST find and mine IRON ROCKS (not Gold Rocks or trees) to get iron ore, then smelt into iron bars
  2. miner_agent MUST also gather coal from appropriate sources  
  3. miner_agent MUST use chat to coordinate material transfer with smith_agent
      4. smith_agent MUST wait for materials, craft "hilt2" first, then craft "sword2" (heavy sword)
    5. smith_agent MUST transfer the crafted sword to warrior_agent via trade/inventory
  6. warrior_agent MUST receive and equip the heavy sword
  7. warrior_agent MUST declare readiness for dragon combat in global chat
  
  LOCATION STRATEGY:
  - Look for Iron Rocks near coordinates (545, 492) for iron ore mining - CONFIRMED IRON ROCK LOCATION!
  - Move directly to target coordinates for efficient navigation
  - Communicate locations and progress through global chat
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  🔨 Smelting Recipe - ironbar:
    - craft_item skill=Smelting itemKey=ironbar
    - Materials: 1x ironore + 1x coal → 1x ironbar
    - Level required: 20 (Smithing skill - smelting uses smithing level!)
  
  🔨 Smithing Recipe - hilt2:
    - craft_item skill=Smithing itemKey=hilt2  
    - Materials: 1x ironbar + 1x logs → 1x hilt2
    - Level required: 1 (Smithing skill)
  
  🗡️ Smithing Recipe - sword2 (Heavy Sword):
    - craft_item skill=Smithing itemKey=sword2
    - Materials: 2x ironbar + 1x hilt2 → 1x sword2
    - Level required: 1 (Smithing skill)

# Limitations
max_action_steps: 25  # Increased limit for successful completion

# Agent configurations
agent_1:
  username: "miner_agent"
  new_character: true
  role: "Resource Gatherer"
  
  # Starting location - closer to Iron Rock mining area
  location:
    x: 500
    y: 450
  
  # Skills focused on resource gathering
  skill_levels:
    mining: 25
    smithing: 25      # Required for smelting iron bars (smelting uses smithing skill)
    lumberjacking: 15
    strength: 20
    health: 25
  
  # Mining equipment and basic supplies
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "pickaxe"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  # Specific task instructions
  task_instructions: |
    YOUR ROLE: Resource gatherer responsible for mining materials
    
    ⛏️ CRITICAL MINING MISSION - YOU ARE A MINER, NOT A LUMBERJACK!
    
    ABSOLUTE PRIORITIES:
    1. DO NOT HARVEST TREES! You need iron ore from IRON ROCKS, not wood!
    2. IMMEDIATELY move towards Iron Rock coordinates (545, 492) - ignore all trees
    3. ONLY look for mining resources: "Iron Rock", "Coal", "Rock", "Stone", "Ore"
    4. If no mining resources visible, MOVE to new mining areas, don't waste time on trees!
    
    MINING STRATEGY:
    1. YOUR FIRST ACTION: move_character(x=545, y=492) - GO DIRECTLY TO IRON ROCK LOCATION!
    2. Use observe_environment at (545, 492) to look for Iron Rocks
    3. If no Iron Rocks at (545, 492), try these CONFIRMED iron coordinates ONE BY ONE:
       - move_character(x=550, y=494) then observe_environment
       - move_character(x=536, y=499) then observe_environment  
       - move_character(x=547, y=502) then observe_environment
       - move_character(x=569, y=580) then observe_environment
    4. NEVER harvest trees, plants, or fishing spots - you are MINING SPECIALIST!
    5. When you find Iron Rocks, harvest them immediately for iron ore
    6. Also look for Coal deposits to gather coal  
    7. Use craft_item skill=Smelting itemKey=ironbar to smelt iron ore + coal into iron bars
       📋 RECIPE: craft_item skill=Smelting itemKey=ironbar (1x ironore + 1x coal → 1x ironbar)
    8. Use global chat every 2-3 actions to report mining and smelting progress
    9. Once you have iron bars (minimum 3), coordinate with smith_agent for transfer
    9. Use transfer_items to give materials to smith_agent safely
    10. Do NOT use complete() until smith_agent confirms receipt of materials
    
    MOVEMENT RULES:
    - Move directly to mining coordinates - no distance limit!
    - If current area has only trees/plants, LEAVE immediately - find rocky terrain
    - Don't get distracted by harvestable trees - focus on MINING MISSION!
    
    ERROR PREVENTION:
    - Always verify targetInstance IDs exist in current environment
    - Never repeat failed harvest attempts on same resource
    - Use move_character directly to target coordinates
    - REMEMBER: Trees give wood, Iron Rocks give iron ore, iron ore + coal = iron bars via Smelting!

agent_2:
  username: "smith_agent"
  new_character: true
  role: "Master Craftsman"
  
  # Starting location - near smithy/forge area
  location:
    x: 88
    y: 33
  
  # Skills focused on crafting
  skill_levels:
    smithing: 30
    crafting: 20
    strength: 25
    health: 20
  
  # Smithing tools and backup materials
  inventory_items:
    - item: "coal"
      count: 5  # Backup coal supply
    - item: "logs"
      count: 3  # Wood for crafting hilt2
    - item: "flask"
      count: 8
  
  equipped_items:
    - item: "hammer"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "axe"
      count: 1
      enchant: 0
  
  # Specific task instructions
  task_instructions: |
    YOUR ROLE: Master craftsman responsible for creating the heavy sword
    
    PRIORITY ACTIONS:
    1. Use global chat to announce readiness and location for material transfer
    2. Wait actively for miner_agent - respond to chat messages and coordinate
    3. When miner_agent arrives, use transfer_items to receive materials safely
    4. Check inventory to confirm you received iron bars (minimum 3 total needed)
       MATERIAL REQUIREMENTS CHECKLIST:
       ✅ For hilt2: need 1x ironbar + 1x logs (you should have logs already)
       ✅ For sword2: need 2x ironbar + 1x hilt2 (will be crafted in step 5)
       ✅ TOTAL: need 3x ironbar + 1x logs (logs provided in starting inventory)
    5. First craft "hilt2" using the exact recipe:
       📋 RECIPE: craft_item skill=Smithing itemKey=hilt2 (1x ironbar + 1x logs → 1x hilt2)
    6. Then craft "sword2" (heavy sword) using the exact recipe:
       📋 RECIPE: craft_item skill=Smithing itemKey=sword2 (2x ironbar + 1x hilt2 → 1x sword2)
    6. If crafting fails, check requirements and materials in inventory
    7. Use global chat to announce successful crafting with details
    8. Coordinate meetup location with warrior_agent for sword transfer
    9. Transfer the heavy sword to warrior_agent using transfer_items
    10. Do NOT use complete() until warrior_agent confirms sword equipped
    
    ERROR PREVENTION:
    - Check inventory before and after all transfers
    - If craft_item fails, verify materials and try alternative recipes
    - Stay at fixed location to avoid coordination confusion

