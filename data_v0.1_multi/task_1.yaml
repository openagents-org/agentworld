  role: "Dragon Slayer"
  
  # Starting location - training/staging area
  location:
    x: 200
    y: 180
  
  # Skills focused on combat
  skill_levels:
    strength: 35
    accuracy: 30
    defense: 32
    health: 40
    archery: 20
  
  # Combat consumables and basic gear
  inventory_items:
    - item: "bigflask"
      count: 15
    - item: "firepotion"
      count: 10
    - item: "burger"
      count: 10
  
  equipped_items:
    - item: "coppersword"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0
  
  # Specific task instructions
  task_instructions: |
    YOUR ROLE: Dragon slayer waiting for powerful equipment
    
    PRIORITY ACTIONS:
    1. Use global chat to announce readiness and coordinate with team
    2. Monitor team progress actively - respond to chat messages
    3. Wait for smith_agent to craft the heavy sword - DO NOT complete early!
    4. When smith_agent announces sword completion, coordinate meetup location
    5. Travel directly to smith_agent's location
    6. Receive the heavy sword from smith_agent via transfer_items
    7. Check inventory to confirm sword received
    8. Equip the heavy sword using equip_item commands
    9. Verify equipment change in environment observation
    10. Use global chat to declare "Ready for dragon combat with heavy sword!"
    11. Only use complete() AFTER confirming sword equipped and announcing readiness
    
    ERROR PREVENTION:
    - Move directly to smith_agent without distance concerns
    - Check inventory before and after transfers
    - Verify equipment changes in observation after equipping items

# Success criteria for multi-agent task
success_criteria:
  - "miner_agent successfully gathers and transfers iron bars and coal to smith_agent"
  - "smith_agent receives materials and crafts a heavy sword"
  - "smith_agent successfully transfers the heavy sword to warrior_agent"
  - "warrior_agent receives the heavy sword and equips it"
  - "All agents use global chat for coordination throughout the process"
  - "warrior_agent declares readiness for dragon combat"
