# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_71_supply_network.yaml

task:
  name: "Supply Network - Extended Gathering (Harder)"
  description: "Eight agents gather large quantities from multiple regions"

objectives:
  primary: "Collect 16x logs from forest and 12x coal from mountain"

relevant_game_context: |
  This is a cooperative multi-agent resource collection with increased difficulty.

  CHALLENGE MODE:
  - Doubled all targets
  - Lower skill levels require more attempts
  - Reduced consumables
  - No pre-gathered resources

  COLLECTION TARGETS (DOUBLED):
  - 16x logs (from forest)
  - 12x coal (from mountain)

  REGION LOCATIONS:
  - Forest: Around (388, 10)
  - Mountain: Around (230, 40)

  DO NOT use complete() until ALL resources are collected!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 65

