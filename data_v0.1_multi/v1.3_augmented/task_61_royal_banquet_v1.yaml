# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_61_royal_banquet.yaml

task:
  name: "Royal Banquet - Seafood Feast (Easier)"
  description: "Eight agents prepare simplified banquet with pre-caught ingredients"

objectives:
  primary: "Cook 2x Cooked Shrimp and 1x Tuna Sushi with provided fish"

relevant_game_context: |
  This is a cooperative multi-agent cooking scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - fisher1_agent starts with 2x rawshrimp
  - fisher2_agent starts with 1x rawtuna
  - Higher skill levels for guaranteed success
  - Reduced targets: 2 shrimp, 1 sushi (no chicken)

  PRODUCTION TARGETS (REDUCED):
  - 2x Cooked Shrimp (have 2x rawshrimp ready)
  - 1x Tuna Sushi (have 1x rawtuna ready)

  TEAM COORDINATION:
  - Transfer fish to cooks
  - Cooks prepare dishes immediately

  DO NOT use complete() until dishes are cooked!

max_action_steps: 20

