# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_81_elemental_grid.yaml

task:
  name: "Elemental Grid - Full Array (Harder)"
  description: "Ten agents gather materials and craft multiple elemental staffs"

objectives:
  primary: "Collect 12x icelogs and 10x logs, and craft 4x Magic Staff"

relevant_game_context: |
  This is a cooperative multi-agent crafting scenario with maximum difficulty.

  CHALLENGE MODE:
  - Quadruple the staff production
  - Increased material requirements
  - Lower skill levels
  - Fewer consumables

  PRODUCTION TARGETS (QUADRUPLED):
  - 12x icelogs (from ice region)
  - 10x logs (from forest)
  - 4x Magic Staff (5x stick + 1x bead each = 20 sticks, 4 beads)

  TEAM ROLES:
  - Ice Loggers: Harvest ice logs
  - Forest Loggers: Harvest regular logs
  - Crafters: Make staffs

  DO NOT use complete() until all objectives are met!

max_action_steps: 60

