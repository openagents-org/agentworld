# SOURCE: task_65_cooking_guild.yaml

task:
  name: "Cooking Guild - Multi-Dish (Easier)"
  description: "Seven cooks prepare simplified menu with partial ingredients"

objectives:
  primary: "Cook 1x Corn Stew and 1x Cooked Shrimp with provided ingredients"

relevant_game_context: |
  This is a cooperative multi-agent cooking scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - forager1_agent starts with 1x corn
  - fisher1_agent starts with 1x rawshrimp
  - cook1_agent has bowl ready
  - Higher skill levels for guaranteed success
  - Reduced targets: 1 stew, 1 shrimp

  PRODUCTION TARGETS (REDUCED):
  - 1x Corn Stew (corn + bowl) - ingredients ready!
  - 1x Cooked Shrimp (rawshrimp) - fish ready!

  TEAM COORDINATION:
  - Transfer ingredients to cooks
  - Cooks prepare dishes

  DO NOT use complete() until dishes are ready!

max_action_steps: 18

