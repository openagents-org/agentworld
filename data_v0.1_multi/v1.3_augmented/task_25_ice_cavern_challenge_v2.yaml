# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets, added 4th agent
# SOURCE: task_25_ice_cavern_challenge.yaml

task:
  name: "Ice Cavern Challenge - Frozen Tundra Survival (Harder)"
  description: "Four agents work together to defeat THREE Ice Guardians and harvest multiple Ice Oak trees"

objectives:
  primary: "Successfully defeat three Ice Guardians and harvest 4x Ice Oak logs in harsh frozen conditions"

relevant_game_context: |
  This is a cooperative multi-agent cold-weather survival expedition with increased difficulty.

  CHALLENGE MODE:
  - Must defeat THREE Ice Guardians (not just two!)
  - Third Ice Guardian spawns in deeper ice cavern area
  - Must harvest 4x iceoaklogs from scratch (no pre-gathered)
  - Added 4th agent (frost_scout_agent) for additional coverage
  - Reduced consumables - manage resources carefully
  - Lower skill levels require precise coordination

  OBJECTIVE: Survive dangerous ice caverns, defeat all three ice guardians, and harvest rare frozen materials.

  MISSION REQUIREMENTS:
  - Navigate to Frozen/Ice region (coordinates 228-260, 151-156)
  - Defeat THREE Ice Guardians (Level 35) in coordinated combat
  - Harvest 4x Ice Oak logs from frozen trees
  - Survive extended freezing environmental damage

  TEAM COORDINATION:
  - Use global chat to coordinate multi-guardian combat
  - Share warming items and provide mutual healing
  - May need to defeat guardians sequentially
  - Two lumberjacks needed for efficient harvesting

  DO NOT use complete() until ALL three guardians defeated and 4x iceoaklogs collected!

  ICE CAVERN COMBAT & HARVESTING:
  ❄️ Ice Guardian Locations:
    - Guardian 1: (259, 151) - Level 35
    - Guardian 2: (260, 156) - Level 35
    - Guardian 3: (255, 148) - Level 35 (deeper cavern)

  🌲 Ice Oak Harvesting:
    - Need 4x iceoaklogs total
    - Level required: 20+ Lumberjacking
    - Found only in frozen biomes

  🧊 Environmental Hazards:
    - Continuous freezing damage
    - Extended exposure is dangerous
    - Coordinate efficient routes

max_action_steps: 50

