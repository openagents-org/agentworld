# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_83_elemental_ritual.yaml

task:
  name: "Elemental Ritual - Grand Ceremony (Harder)"
  description: "Ten agents craft multiple ritual items for grand ceremony"

objectives:
  primary: "Craft 2x Beryl Pendant, 2x Gold Ring, and collect 10x blueberry"

relevant_game_context: |
  This is a cooperative multi-agent crafting scenario with maximum difficulty.

  CHALLENGE MODE:
  - Doubled crafting requirements
  - Must gather beryl from scratch
  - Lower skill levels
  - Fewer consumables

  PRODUCTION TARGETS (DOUBLED):
  - 2x Beryl Pendant (beryl + string each)
  - 2x Gold Ring (2x goldbar each)
  - 10x blueberry (foraging)

  MATERIALS NEEDED:
  - 2x beryl (must mine)
  - 2x string
  - 4x goldbar

  TEAM ROLES:
  - Miners: Extract beryl gems
  - Foragers: Gather blueberries
  - Crafters: Make jewelry

  DO NOT use complete() until all objectives are met!

max_action_steps: 55

