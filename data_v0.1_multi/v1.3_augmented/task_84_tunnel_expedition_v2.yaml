# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_84_tunnel_expedition.yaml

task:
  name: "Tunnel Expedition - Deep Dive (Harder)"
  description: "Ten agents explore deep tunnels, clear enemies, and craft tools"

objectives:
  primary: "Mine 12x ironore, 10x coal, defeat 5x Skeletons, and craft 2x Pickaxe"

relevant_game_context: |
  This is a cooperative multi-agent exploration with maximum difficulty.

  CHALLENGE MODE:
  - More enemies to defeat
  - Doubled mining targets
  - Multiple pickaxes to craft
  - Lower skill levels

  PRODUCTION TARGETS (DOUBLED):
  - 12x ironore (from mountain)
  - 10x coal (from mountain)
  - Defeat 5x Skeletons
  - 2x Pickaxe (5x ironbar + 1x logs each)

  MATERIALS PROVIDED:
  - Iron bars and logs for pickaxes

  TEAM ROLES:
  - Miners: Extract ore and coal
  - Combat Team: Defeat skeletons
  - Crafter: Make pickaxes

  DO NOT use complete() until all objectives are met!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 60

