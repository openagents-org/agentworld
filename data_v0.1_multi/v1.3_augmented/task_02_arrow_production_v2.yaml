# Success criteria for multi-agent task
success_criteria:
  - "Team stays together within 3 tiles throughout the task"
  - "Team successfully gathers exactly 5x logs from Oak Trees"
  - "Team consolidates all 20x feathers (10x + 10x) with fletcher_agent"
  - "Team consolidates all 5x logs with fletcher_agent through transfers"
  - "Team communicates inventory status after every major action"
  - "Fletcher_agent crafts 20x sticks from 5x logs (using craft_item 5 times)"
  - "Fletcher_agent produces 20x arrows from 20x sticks + 20x feathers (craft twice)"
  - "Final target: Fletcher_agent has 20x arrows verified by all agents"
  - "All agents coordinate efficiently despite reduced resources"
