# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, easier completion
# SOURCE: task_07_pickaxe_crafting.yaml

task:
  name: "Cooperative Pickaxe Crafting - Mining Tool Production (Easier)"
  description: "Three agents work together to create a pickaxe - with pre-smelted ironbar ready"

# Task objectives
objectives:
  primary: "Forge a high-quality pickaxe through coordinated metallurgy and tool crafting"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent tool crafting scenario requiring extensive metallurgy operations.

  STARTING ADVANTAGE:
  - smelter_agent already has 3x ironbar (pre-smelted!)
  - miner_agent has materials for 2 more ironbar
  - tool_smith_agent has 1x logs ready for the handle
  - Higher skill levels across all agents

  OBJECTIVE: Forge a high-quality pickaxe with mostly pre-processed materials.

  SIMPLIFIED STRATEGY:
  - Team already has most materials ready
  - Need to smelt 2 more ironbar (miner has ore/coal)
  - Transfer all 5x ironbar + 1x logs to tool_smith_agent
  - tool_smith_agent forges the pickaxe

  TEAM COORDINATION:
  - Use global chat to coordinate transfers
  - Consolidate 5x ironbar with tool_smith_agent
  - tool_smith_agent crafts pickaxe

  DO NOT use complete() until ALL objectives are achieved by the team!

  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  🔥 Smelting Recipe - ironbar:
    - craft_item skill=Smelting itemKey=ironbar
    - Materials: 1x ironore + 1x coal → 1x ironbar
    - Level required: 20 (uses Smithing skill level)

  ⛏️ Smithing Recipe - pickaxe:
    - craft_item skill=Smithing itemKey=pickaxe
    - Materials: 5x ironbar + 1x logs → 1x pickaxe
    - Level required: 5 (Smithing skill)

# Limitations
max_action_steps: 20

