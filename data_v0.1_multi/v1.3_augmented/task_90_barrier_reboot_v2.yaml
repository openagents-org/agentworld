# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_90_barrier_reboot.yaml

task:
  name: "Barrier Reboot - Full System Reset (Harder)"
  description: "Ten agents defeat multiple bosses and craft multiple staffs"

objectives:
  primary: "Defeat Ancient Wizard at (163, 339), Golden Golem at (548, 232), and Dark Ogre at (238, 48), craft 2x Lightning Staff and 2x Fire Staff, and collect 12x goldnugget"

relevant_game_context: |
  This is a cooperative multi-agent combat and crafting scenario with maximum difficulty.

  CHALLENGE MODE:
  - THREE bosses to defeat
  - Doubled staff production
  - Increased mining targets
  - Lower skill levels

  COMBAT TARGETS (EXPANDED):
  - Ancient Wizard (Level 10) at (163, 339)
  - Golden Golem (Level 38) at (548, 232)
  - Dark Ogre (Level 25) at (238, 48)

  PRODUCTION TARGETS (DOUBLED):
  - 12x goldnugget (from mountain)
  - 2x Lightning Staff (staff + lightningbead each)
  - 2x Fire Staff (staff + firebead each)

  TEAM ROLES:
  - Combat Team: Defeat bosses
  - Miners: Extract gold ore
  - Crafters: Make staffs

  DO NOT use complete() until all objectives are met!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 65

