# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_46_mining_expedition.yaml

task:
  name: "Mining Expedition - Iron Equipment Production (Harder)"
  description: "Five agents mine from scratch to produce expanded equipment set"

objectives:
  primary: "Craft 2x Pickaxe, 2x Axe, and 2x Heavy Sword through full production chain"

relevant_game_context: |
  This is a cooperative multi-agent mining scenario with increased difficulty.

  CHALLENGE MODE:
  - Doubled all production targets
  - No pre-gathered materials - mine everything
  - Need 20x ironore and 20x coal for iron bars
  - Need 4x logs for tool handles
  - Need 2x hilt2 for heavy swords
  - Reduced consumables - manage carefully

  PRODUCTION TARGETS (DOUBLED):
  - 2x Pickaxe (5x ironbar + 1x logs each = 10 bars, 2 logs)
  - 2x Axe (3x ironbar + 1x logs each = 6 bars, 2 logs)
  - 2x Heavy Sword (2x ironbar + 1x hilt2 each = 4 bars, 2 hilts)

  MATERIAL REQUIREMENTS:
  - 20x ironore + 20x coal → 20x ironbar
  - 4x logs for handles
  - 2x hilt2 provided

  TEAM ROLES:
  - Miners: Extract all ore and coal
  - Lumberjack: Gather logs
  - Smelter: Process ore to bars
  - Smith: Craft all equipment

  DO NOT use complete() until ALL equipment is crafted!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 60

