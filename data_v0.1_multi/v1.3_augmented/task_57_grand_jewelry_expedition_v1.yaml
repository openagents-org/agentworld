# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_57_grand_jewelry_expedition.yaml

task:
  name: "Grand Jewelry Expedition (Easier)"
  description: "Eight agents craft simplified jewelry set using pre-gathered gemstones"

objectives:
  primary: "Craft 1x Ruby Ring and 1x Emerald Pendant with pre-gathered materials"

relevant_game_context: |
  This is a cooperative multi-agent jewelry expedition with reduced difficulty.

  STARTING ADVANTAGE:
  - Ruby and Emerald already mined (in Combat_Support inventory)
  - Gold bars already smelted (in Smelter inventory)
  - Strings provided for pendants
  - Higher skill levels for guaranteed success
  - Reduced targets: 1 ring, 1 pendant

  PRODUCTION TARGETS (REDUCED):
  - 1x Ruby Ring (1 ruby + 1 goldring)
  - 1x Emerald Pendant (1 emerald + 1 string)

  MATERIALS AVAILABLE:
  - Combat_Support: 1 ruby, 1 emerald
  - Smelter: 2 goldbar (for 1 gold ring)
  - Coal_Miner: 2 string

  PHASE OUTLINE:
  1. Smelter crafts 1 gold ring from 2 goldbar
  2. Transfer materials to jewelers
  3. Jeweler_Rings crafts ruby ring
  4. Jeweler_Pendants crafts emerald pendant

  DO NOT use complete() until jewelry is crafted!

max_action_steps: 25

