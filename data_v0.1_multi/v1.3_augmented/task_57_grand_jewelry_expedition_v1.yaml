# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_57_grand_jewelry_expedition.yaml

task:
  name: "Grand Jewelry Expedition (Easier)"
  description: "Eight agents craft simplified jewelry set using pre-gathered gemstones"

objectives:
  primary: "Craft 1x Gold Ring and 1x Beryl Pendant with pre-gathered materials"

relevant_game_context: |
  This is a cooperative multi-agent jewelry expedition with reduced difficulty.

  STARTING ADVANTAGE:
  - Topaz and Emerald already available (in Combat_Support inventory)
  - Silver ring materials ready (ironbars in Smelter inventory)
  - Strings provided for pendants
  - Higher skill levels for guaranteed success
  - Reduced targets: 1 ring, 1 pendant

  PRODUCTION TARGETS (REDUCED):
  - 1x Gold Ring (2x goldbar) - goldbar provided
  - 1x Beryl Pendant (beryl + string) - materials provided

  MATERIALS AVAILABLE:
  - Jeweler_Rings: 2 goldbar (for gold ring)
  - Jeweler_Pendants: 1 beryl, 1 string (for pendant)

  PHASE OUTLINE:
  1. Jeweler_Rings crafts gold ring from 2 goldbar
  2. Jeweler_Pendants crafts beryl pendant from beryl + string

  DO NOT use complete() until jewelry is crafted!

max_action_steps: 25

