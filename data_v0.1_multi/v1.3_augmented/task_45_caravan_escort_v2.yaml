# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets, added 4th agent
# SOURCE: task_45_caravan_escort.yaml

task:
  name: "Caravan Escort - Protected Gathering (Harder)"
  description: "Four agents protect miner while they extract significant gold deposits"

objectives:
  primary: "Protect miner while they collect 6x goldnugget and defeat 4x hostile creatures"

relevant_game_context: |
  This is a cooperative multi-agent escort scenario with increased difficulty.

  CHALLENGE MODE:
  - Doubled gold target: 6x goldnugget (not 3)
  - Doubled threats: defeat 4x hostile creatures
  - Added 4th agent (scout_agent) for threat detection
  - Reduced consumables - manage healing carefully
  - Lower combat stats require better coordination

  TARGETS (INCREASED):
  - Miner collects 6x goldnugget from Gold rocks
  - Guards defeat at least 4x hostile creatures
  - All agents survive

  GOLD LOCATIONS:
  - Gold rocks: Mountain regions (200-250, 30-60)
  - Expect multiple hostile encounters

  COMBAT:
  - Scout detects threats early
  - Guards engage to protect miner
  - Coordinate focus fire on dangerous enemies
  - Miner must balance mining and retreating

  DO NOT use complete() until gold is collected and all threats eliminated!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


