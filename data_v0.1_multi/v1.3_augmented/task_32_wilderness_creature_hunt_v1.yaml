task:
  name: "Wilderness Creature Hunt - Wolf Pack Elimination (Easier)"
  description: "Three agents work together with enhanced equipment to hunt wolves and gather resources"

objectives:
  primary: "Defeat 2x Wolves and collect 3x logs with pre-gathered starting materials"

relevant_game_context: |
  This is a cooperative multi-agent hunting and gathering scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - gatherer_agent starts with 2x logs already collected
  - Higher skill levels for safer combat
  - More consumables for healing
  - Reduced targets: 2x Wolves (not 3)
  - Only need 1 additional log

  TARGETS (REDUCED):
  - Defeat 2x Wolves (reduced from 3)
  - Collect 3x logs total (have 2, need 1 more)

  WOLF COMBAT:
  - Wolves are aggressive melee creatures
  - Coordinate attacks: tank draws aggro, others deal damage
  - Use ranged weapons for safer engagement

  DO NOT use complete() until objectives are met!

max_action_steps: 20

