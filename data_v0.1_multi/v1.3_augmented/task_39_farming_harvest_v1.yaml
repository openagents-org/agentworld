# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_39_farming_harvest.yaml

task:
  name: "Farming Harvest - Crop Collection (Easier)"
  description: "Three agents work together with pre-gathered crops to complete harvest collection"

objectives:
  primary: "Harvest 3x corn, 3x tomato, and 2x peach with pre-gathered starting materials"

relevant_game_context: |
  This is a cooperative multi-agent farming scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - farmer1_agent starts with 2x corn
  - farmer2_agent starts with 2x tomato
  - farmer3_agent starts with 1x peach
  - Higher skill levels for faster harvesting
  - Reduced targets for quicker completion

  HARVEST TARGETS (REDUCED):
  - 3x corn (have 2, need 1 more)
  - 3x tomato (have 2, need 1 more)
  - 2x peach (have 1, need 1 more)

  CROP LOCATIONS:
  - Corn: Farm areas and plains
  - Tomato: Garden areas
  - Peach: Orchard areas near forests

  DO NOT use complete() until all crops are harvested!

max_action_steps: 18

