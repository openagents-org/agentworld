task:
  name: "War Council - Five Boss Campaign (Harder)"
  description: "Ten agents defeat five bosses across multiple regions"

objectives:
  primary: "Defeat the Ogre Guardian at (291, 644), Dark Wolf at (1016, 682), Golden Golem at (548, 232), Ice Wizard at (259, 151), and Mermaid at (580, 755)"

relevant_game_context: |
  This is a cooperative multi-agent combat scenario with maximum difficulty.

  CHALLENGE MODE:
  - FIVE bosses to defeat (instead of 3)
  - Must split forces across regions
  - Lower combat stats
  - Fewer consumables

  COMBAT TARGETS (EXPANDED):
  - Ogre Guardian (Level 36) at (291, 644)
  - Dark Wolf (Level 40) at (1016, 682)
  - Golden Golem (Level 38) at (548, 232)
  - Ice Wizard (Level 35) at (259, 151)
  - Mermaid (Level 36) at (580, 755)

  TEAM COMPOSITION:
  - 4 Fighters with heavy weapons
  - 3 Ranged attackers with staffs
  - 3 Support agents

  STRATEGY:
  - Split into squads for each boss
  - Coordinate attacks via chat
  - Careful resource management

  DO NOT use complete() until ALL bosses are defeated!

max_action_steps: 130

