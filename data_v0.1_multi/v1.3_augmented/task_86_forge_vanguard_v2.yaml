# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_86_forge_vanguard.yaml

task:
  name: "Forge Vanguard - Full Arsenal (Harder)"
  description: "Ten agents gather materials and craft full weapon arsenal"

objectives:
  primary: "Mine 15x ironore, 12x coal, smelt 10x ironbar, and craft 4x Heavy Sword and 2x Axe"

relevant_game_context: |
  This is a cooperative multi-agent crafting scenario with maximum difficulty.

  CHALLENGE MODE:
  - Doubled weapon production
  - Increased material requirements
  - Lower skill levels
  - Fewer consumables

  PRODUCTION TARGETS (DOUBLED):
  - 15x ironore (from mountain)
  - 12x coal (from mountain)
  - 10x ironbar (smelted)
  - 4x Heavy Sword (2x ironbar + hilt2 each)
  - 2x Axe (3x ironbar + logs each)

  MATERIALS NEEDED:
  - 8x ironbar for swords
  - 6x ironbar for axes
  - 4x hilt2 for swords
  - 2x logs for axes

  TEAM ROLES:
  - Miners: Extract ore and coal
  - Smelter: Smelt bars
  - Smiths: Craft weapons

  DO NOT use complete() until all objectives are met!

max_action_steps: 62

