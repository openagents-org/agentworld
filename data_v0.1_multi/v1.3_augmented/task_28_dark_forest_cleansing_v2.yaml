# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets, added 4th agent
# SOURCE: task_28_dark_forest_cleansing.yaml

task:
  name: "Dark Forest Cleansing - Dark Wolf Hunt (Harder)"
  description: "Four agents work together to defeat the Dark Wolf AND clear additional forest threats"

objectives:
  primary: "Successfully defeat Dark Wolf, cleanse forest of additional threats, and harvest dark forest resources"

relevant_game_context: |
  This is a cooperative multi-agent boss hunting mission with increased difficulty.

  CHALLENGE MODE:
  - Must defeat Dark Wolf boss (~1050 HP)
  - Must also defeat at least 2 additional forest creatures
  - Must harvest logs from dark forest trees
  - Added 4th agent (forest_ranger_agent) for additional tasks
  - Reduced consumables - manage resources carefully
  - Lower skill levels require precise coordination

  OBJECTIVE: Complete full forest cleansing - defeat Dark Wolf and clear additional threats.

  MISSION REQUIREMENTS:
  - Locate and defeat Dark Wolf at (1016, 682)
  - Defeat at least 2 additional forest creatures in the dark forest area
  - Harvest at least 2 logs from dark forest trees
  - Collect wolfarmor and any other drops
  - Keep all team members alive

  TEAM COORDINATION:
  - Coordinate between boss combat and creature clearing
  - forest_ranger_agent handles tree harvesting
  - Share combat responsibilities across threats

  DO NOT use complete() until ALL objectives achieved!

  DARK FOREST CHALLENGES:
  🐺 Dark Wolf Boss at (1016, 682):
    - HP: approximately 1050
    - Main target - priority kill
    - Drops: wolfarmor

  🌲 Forest Tasks:
    - Clear 2+ additional forest creatures
    - Harvest 2+ logs from trees
    - forest_ranger_agent has lumberjacking skills

max_action_steps: 48

