# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_49_jewelry_workshop.yaml

task:
  name: "Jewelry Workshop - Ring Collection (Harder)"
  description: "Five agents craft 4x Gold Rings and 4x Silver Rings from scratch"

objectives:
  primary: "Craft 4x Gold Rings and 4x Silver Rings through full production chain"

relevant_game_context: |
  This is a cooperative multi-agent jewelry crafting scenario with increased difficulty.

  CHALLENGE MODE:
  - Doubled ring targets: 4x Gold, 4x Silver
  - Must mine all ore from scratch
  - Need 8x goldnugget + 8x ironore + 16x coal
  - Lower skill levels require more attempts
  - Reduced consumables - manage carefully

  PRODUCTION TARGETS (DOUBLED):
  - 4x Gold Ring (2x goldbar each = 8x goldbar)
  - 4x Silver Ring (2x ironbar each = 8x ironbar)

  MATERIAL REQUIREMENTS:
  - 8x goldnugget + 8x coal → 8x goldbar → 4x goldring
  - 8x ironore + 8x coal → 8x ironbar → 4x silverring
  - Total: 16x coal needed

  RESOURCE LOCATIONS:
  - Gold rocks: Mountain regions (Level 25 mining)
  - Iron rocks: Mountain regions (Level 20 mining)
  - Coal rocks: Mountain regions (Level 1 mining)

  DO NOT use complete() until ALL rings are crafted!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 60

