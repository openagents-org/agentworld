# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_89_beacon_calibration.yaml

task:
  name: "Beacon Calibration - Full Array (Harder)"
  description: "Ten agents craft multiple elemental items for beacon array"

objectives:
  primary: "Craft 2x Beryl Pendant, 2x Lightning Staff, and collect 12x logs and 10x icelogs"

relevant_game_context: |
  This is a cooperative multi-agent crafting scenario with maximum difficulty.

  CHALLENGE MODE:
  - Doubled crafting requirements
  - Increased gathering targets
  - Lower skill levels
  - Fewer consumables

  PRODUCTION TARGETS (DOUBLED):
  - 12x logs (from forest)
  - 10x icelogs (from ice region)
  - 2x Beryl Pendant (beryl + string each)
  - 2x Lightning Staff (staff + lightningbead each)

  MATERIALS NEEDED:
  - 2x beryl (provided)
  - 2x string (provided)
  - 2x lightningbead (provided)
  - 10x sticks + 2x beads for 2x staff (provided)

  TEAM ROLES:
  - Forest Loggers: Harvest logs
  - Ice Loggers: Harvest ice logs
  - Crafters: Make items

  DO NOT use complete() until all objectives are met!

max_action_steps: 60

