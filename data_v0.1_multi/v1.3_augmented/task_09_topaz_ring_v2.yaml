# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, full production chain required
# SOURCE: task_09_topaz_ring.yaml

task:
  name: "Cooperative Topaz Ring Crafting - Luxury Jewelry (Harder)"
  description: "Three agents work together to create TWO topaz rings through complete gold smelting and jewelry chain"

# Task objectives
objectives:
  primary: "Create TWO topaz rings through full gold smelting and jewelry crafting chain"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent luxury jewelry scenario requiring precious materials.

  CHALLENGE MODE:
  - Must create TWO topaz rings (doubled target!)
  - gold_smith_agent starts with NO goldbar - must smelt from ore
  - Full production chain required: smelting → ring crafting → gem setting
  - Reduced consumables - manage resources carefully

  OBJECTIVE: Create 2x topaz rings through complete luxury production chain.

  REQUIRED MATERIALS FOR 2 TOPAZ RINGS:
  - 4x goldbar (2 per goldring) - must smelt from goldnugget + coal
  - 2x goldring (crafted from goldbar)
  - 2x topaz (gem_miner_agent has these)

  PRODUCTION CHAIN:
  1. Smelt 4x goldbar from goldnugget + coal
  2. Craft 2x goldring from goldbar
  3. Transfer topaz and goldrings to luxury_jeweler_agent
  4. Craft 2x topazring

  DO NOT use complete() until 2x topaz rings are created!

  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  🟨 Smelting Recipe - goldbar:
    - craft_item skill=Smelting itemKey=goldbar
    - Materials: 1x goldnugget + 1x coal → 1x goldbar
    - Level required: 20 (uses Smithing skill level)

  🟨 Smithing Recipe - goldring:
    - craft_item skill=Smithing itemKey=goldring
    - Materials: 2x goldbar → 1x goldring
    - Level required: 1 (Smithing skill)

  💍 Crafting Recipe - topaz ring:
    - craft_item skill=Crafting itemKey=topazring
    - Materials: 1x topaz + 1x goldring → 1x topaz ring
    - Level required: 5 (Crafting skill)

# Limitations
max_action_steps: 40

