# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, must gather and craft all materials
# SOURCE: task_05_beryl_pendant.yaml

task:
  name: "Cooperative Beryl Pendant Crafting - Elegant Jewelry (Harder)"
  description: "Three agents work together to create TWO beryl pendants through complete foraging and crafting chain"

# Task objectives
objectives:
  primary: "Create TWO beryl pendants by gathering all materials from scratch"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent jewelry crafting scenario requiring both foraging and mining skills.

  CHALLENGE MODE:
  - Must create TWO beryl pendants (doubled target!)
  - jeweler_agent has NO pre-crafted string - must craft from bluelily
  - Full crafting chain required: foraging → string crafting → pendant assembly
  - Reduced consumables - manage resources carefully

  OBJECTIVE: Create 2x beryl pendants through the complete crafting chain.

  REQUIRED MATERIALS FOR 2 PENDANTS:
  - 2x beryl gems (gem_miner_agent has these)
  - 2x string (must craft from 2x bluelily)
  - Must forage bluelily and craft string first!

  TEAM COORDINATION:
  - forager_agent gathers bluelily
  - Transfer bluelily to jeweler_agent for string crafting
  - gem_miner_agent transfers both beryl gems
  - jeweler_agent crafts 2x string, then 2x beryl pendant

  DO NOT use complete() until 2x beryl pendants are created!

  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  🌸 Foraging - bluelily:
    - harvest_resource on bluelily instances to get bluelily
    - Level required: 10+ (Foraging skill)

  🧵 Crafting Recipe - string:
    - craft_item skill=Crafting itemKey=string
    - Materials: 1x bluelily → 1x string
    - Level required: 1 (Crafting skill)
    - Need to craft 2x string!

  📿 Crafting Recipe - beryl pendant:
    - craft_item skill=Crafting itemKey=berylpendant
    - Materials: 1x beryl + 1x string → 1x beryl pendant
    - Level required: 1 (Crafting skill)
    - Need to craft 2x pendant!

# Limitations
max_action_steps: 35

