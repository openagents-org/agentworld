# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_60_mining_operation.yaml

task:
  name: "Mining Operation - Ore Extraction (Easier)"
  description: "Seven miners with pre-smelted bars craft simplified equipment"

objectives:
  primary: "Craft 1x Silver Ring using pre-smelted iron bars"

relevant_game_context: |
  This is a cooperative multi-agent mining scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - smelter_agent starts with 6x ironbar already smelted
  - lumberjack_agent starts with 2x logs
  - Higher skill levels for guaranteed success
  - Reduced target: Just 1 silver ring (pickaxe optional)

  PRODUCTION TARGETS (REDUCED):
  - 1x Silver Ring (2x ironbar) - bars provided!

  OPTIONAL BONUS:
  - Can craft pickaxe with remaining materials

  TEAM COORDINATION:
  - Smith crafts ring using provided ironbar
  - Other agents can mine for extras

  DO NOT use complete() until ring is crafted!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 25

