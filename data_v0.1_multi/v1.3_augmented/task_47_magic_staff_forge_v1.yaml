  description: "Five agents craft 1x Lightning Staff using pre-gathered materials"

objectives:
  primary: "Craft 1x Lightning Staff using pre-crafted staff and materials"

relevant_game_context: |
  This is a cooperative multi-agent magical crafting scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - crafter1_agent starts with 1x staff already crafted
  - lightningbead provided for enchantment
  - Extra sticks available for additional crafting
  - Higher skill levels for guaranteed success
  - Only need to craft 1x Lightning Staff

  PRODUCTION TARGETS (REDUCED):
  - 1x Lightning Staff (staff + lightningbead)
  - Staff already provided!

  OPTIONAL BONUS:
  - Can craft additional staffs with extra materials
  - Can enchant fire staff if time permits

  TEAM COORDINATION:
  - Crafter enchants provided staff
  - Other agents can gather more materials if desired

  DO NOT use complete() until lightning staff is crafted!

max_action_steps: 20

