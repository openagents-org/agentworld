relevant_game_context: |
  This is a cooperative multi-agent hunting and gathering scenario with increased difficulty.

  CHALLENGE MODE:
  - Increased targets: 6x Wolves (doubled!)
  - Increased logs: 8x logs required
  - Added 4th agent (tracker_agent) for wider coverage
  - Reduced consumables - manage resources carefully
  - Lower skill levels require better coordination

  TARGETS (INCREASED):
  - Defeat 6x Wolves (roaming in wilderness regions)
  - Collect 8x logs from Oak trees

  WOLF COMBAT:
  - Wolves are aggressive melee creatures
  - May need to engage multiple wolves simultaneously
  - Coordinate team positioning carefully

  DO NOT use complete() until all objectives are met!

