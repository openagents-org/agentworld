# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_90_barrier_reboot.yaml

task:
  name: "Barrier Reboot - Quick Activation (Easier)"
  description: "Ten agents defeat one boss and craft one staff with pre-gathered materials"

objectives:
  primary: "Defeat Ancient Wizard at (163, 339), craft 1x Lightning Staff, and collect 5x goldnugget"

relevant_game_context: |
  This is a cooperative multi-agent combat and crafting scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - Higher combat stats for fighters
  - miner1_agent has 3x goldnugget pre-gathered
  - crafter1_agent has staff ready
  - Only 1 staff to craft
  - More consumables

  COMBAT TARGET:
  - Ancient Wizard (Level 10) at (163, 339)

  PRODUCTION TARGETS (REDUCED):
  - 5x goldnugget (from mountain) - 3 already gathered!
  - 1x Lightning Staff (staff + lightningbead) - staff ready!

  TEAM ROLES:
  - Combat Team: Defeat wizard
  - Miners: Extract gold ore
  - Crafter: Make staff

  DO NOT use complete() until all objectives are met!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 22

