# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_56_cross_region_trading_network.yaml

task:
  name: "Cross-Region Trading Network (Easier)"
  description: "Seven agents with pre-gathered materials establish simplified trading network"

objectives:
  primary: "Craft 2x Silver Rings and 1x Axe using pre-gathered iron bars and logs"

relevant_game_context: |
  This is a cooperative multi-agent trading scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - All 14 ironbar already provided (distributed among agents)
  - 2x logs already gathered
  - Higher skill levels for guaranteed success
  - Reduced targets: 2 rings, 1 axe (no heavy sword)

  CRAFTING TARGETS (REDUCED):
  - 2x Silver Rings: 4 ironbar (Smithing L1)
  - 1x Axe: 3 ironbar + 1 logs (Smithing L3)
  - TOTAL NEEDED: 7 ironbar, 1 logs

  STARTING MATERIALS:
  - Mountain_Miner_1: 7 ironbar
  - Mountain_Miner_2: 7 ironbar
  - Forest_Gatherer_1: 2 logs

  PHASE OUTLINE:
  1. Gather at Central Hub (528,384)
  2. Transfer materials to Crafter_Gold
  3. Craft 2x Silver Rings and 1x Axe
  4. Verify completion

  DO NOT use complete() until all items are crafted!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 30

