# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_86_forge_vanguard.yaml

task:
  name: "Forge Vanguard - Quick Production (Easier)"
  description: "Ten agents craft weapons with pre-gathered materials"

objectives:
  primary: "Mine 6x ironore, 5x coal, smelt 4x ironbar, and craft 1x Heavy Sword and 1x Axe"

relevant_game_context: |
  This is a cooperative multi-agent crafting scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - miner1_agent has 4x ironore pre-gathered
  - smelter_agent has 8x coal and 3x ironbar ready
  - Reduced weapon production
  - Higher skill levels

  PRODUCTION TARGETS (REDUCED):
  - 6x ironore (from mountain) - 4 already gathered!
  - 5x coal (from mountain) - already have 8!
  - 4x ironbar (smelted) - 3 already ready!
  - 1x Heavy Sword (2x ironbar + hilt2)
  - 1x Axe (3x ironbar + logs)

  TEAM ROLES:
  - Miners: Extract ore
  - Smelter: Smelt bars
  - Smiths: Craft weapons

  DO NOT use complete() until all objectives are met!

max_action_steps: 22

