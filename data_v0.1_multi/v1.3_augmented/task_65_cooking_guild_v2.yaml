# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Harder version requiring gathering and crafting
# SOURCE: task_65_cooking_guild.yaml (redesigned - cooking recipes limited)

task:
  name: "Crafting Guild - Full Production (Harder)"
  description: "Seven agents gather materials and craft multiple items"

objectives:
  primary: "Craft 2x Magic Staff, 2x Silver Ring, and gather 6x logs and 4x rawshrimp"

relevant_game_context: |
  This is a cooperative multi-agent crafting and gathering scenario.

  CHALLENGE MODE:
  - Must gather resources from different regions
  - Materials distributed across agents
  - Requires coordination between gatherers and crafters

  PRODUCTION TARGETS:
  - 2x Magic Staff (5x stick + 1x bead each = 10 sticks + 2 beads)
  - 2x Silver Ring (2x ironbar each = 4 ironbar)
  - 6x logs (from Oak trees)
  - 4x rawshrimp (from fishing)

  MATERIAL REQUIREMENTS:
  - 3x logs provided, need 3 more from gathering
  - 2x bead provided
  - 10x stick provided (for 2 Magic Staffs)
  - 4x ironbar provided
  - Fishers gather shrimp

  TEAM ROLES:
  - Foragers/Lumberjacks: Gather logs from forest
  - Fishers: Fish for shrimp at coast
  - Crafters: Create staffs and rings

  LOCATIONS:
  - Forest (Oak Trees): Around (388, 10)
  - Coast (Fishing): Around (580, 750)

  DO NOT use complete() until ALL objectives are met!

max_action_steps: 60

