# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_65_cooking_guild.yaml

task:
  name: "Cooking Guild - Full Menu (Harder)"
  description: "Seven cooks gather and prepare expanded menu from scratch"

objectives:
  primary: "Cook 4x Corn Stew, 4x Cooked Shrimp, 4x Cooked Chicken, and 2x Jellyfish Smoothie"

relevant_game_context: |
  This is a cooperative multi-agent cooking scenario with increased difficulty.

  CHALLENGE MODE:
  - Doubled all targets
  - Must gather all ingredients from scratch
  - Lower skill levels require more attempts
  - Reduced consumables
  - Added jellyfish requirement

  PRODUCTION TARGETS (DOUBLED):
  - 4x Corn Stew (4x corn + 4x bowl)
  - 4x Cooked Shrimp (4x rawshrimp)
  - 4x Cooked Chicken (4x rawchicken)
  - 2x Jellyfish Smoothie (2x jellyfish)

  GATHERING REQUIREMENTS:
  - 4x corn (foraging)
  - 4x bowl (provided)
  - 4x rawshrimp (fishing)
  - 2x jellyfish (fishing level 5+)
  - 4x rawchicken (hunting)

  DO NOT use complete() until ALL dishes are ready!

max_action_steps: 60

