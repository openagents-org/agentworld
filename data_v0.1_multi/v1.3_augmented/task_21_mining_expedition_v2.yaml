# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets, added 4th agent
# SOURCE: task_21_mining_expedition.yaml

task:
  name: "Deep Mining Expedition - Precious Metal Extraction (Harder)"
  description: "Four agents work together to mine multiple gold ores and craft two golden rings in a challenging mining operation"

objectives:
  primary: "Successfully mine multiple gold ores and craft 2x golden rings through coordinated mining and advanced smithing"

relevant_game_context: |
  This is a cooperative multi-agent mining expedition with increased difficulty.

  CHALLENGE MODE:
  - Must craft 2x golden rings (doubled target!)
  - Need to mine 4x goldnugget from scratch (no pre-gathered materials)
  - Need 4x coal for smelting operations
  - Added 4th agent (mining_support_agent) for better coordination
  - Reduced consumables - manage resources carefully

  OBJECTIVE: Establish mining operations to extract multiple gold ores and craft 2 golden rings.

  MISSION REQUIREMENTS:
  - Find and extract 4x Gold Ore from Gold Rock deposits (very rare!)
  - Gather 4x Coal for smelting operations
  - Smelt 4x Gold Bars using smelting
  - Craft 2x Golden Rings as proof of successful mining operation (each needs 2x goldbar)
  - Coordinate heavy ore transportation between team members

  TEAM COORDINATION:
  - Use global chat to share locations of rare ore deposits
  - Coordinate between exploration, extraction, and processing
  - Share heavy materials efficiently
  - Two miners can cover more ground to find rare gold deposits

  DO NOT use complete() until BOTH golden rings are crafted!

  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  Mining - Gold Ore (RARE):
    - harvest_resource on Gold Rock instances to get goldnugget
    - Level required: 30+ (Mining skill)
    - RARE: Gold Rocks are much scarcer than Iron Rocks!

  Mining - Coal:
    - harvest_resource on Coal Rock instances to get coal
    - Level required: 10+ (Mining skill)
    - Essential fuel for smelting operations

  Smelting Recipe - goldbar:
    - craft_item skill=Smelting itemKey=goldbar
    - Materials: 1x goldnugget + 1x coal → 1x goldbar
    - Level required: Smelting skill

  Smithing Recipe - goldring:
    - craft_item skill=Smithing itemKey=goldring
    - Materials: 2x goldbar → 1x goldring
    - Level required: Smithing level 1
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


