# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, full smelting chain with 40% success rate
# SOURCE: task_12_gold_ring.yaml

task:
  name: "Cooperative Gold Ring Forging - Premium Metallurgy (Harder)"
  description: "Three agents work together to create TWO gold rings through challenging gold smelting chain"

objectives:
  primary: "Create TWO gold rings through coordinated gold smelting (40% success rate!) and smithing"

relevant_game_context: |
  This is a cooperative multi-agent premium metallurgy scenario requiring gold materials.

  CHALLENGE MODE:
  - Must create TWO gold rings (doubled target!)
  - gold_smith_agent starts with NO goldbar - must smelt all
  - Gold smelting has 40% success rate - very challenging!
  - Need ~10 attempts to get 4 goldbars reliably

  OBJECTIVE: Create 2x gold rings through complete challenging metallurgy chain.

  REQUIRED MATERIALS FOR 2 GOLD RINGS:
  - 4x goldbar (2 per ring)
  - Must smelt from goldnugget + coal
  - With 40% success rate, need ~10x goldnugget and coal for 4 successes

  CRITICAL: Gold smelting has 40% success rate!
  - Team has 12x goldnugget + 12x coal distributed
  - Multiple smelting attempts required
  - Track successes via chat

  DO NOT use complete() until 2x goldring is created!

  CRAFTING RECIPES:
  🟨 Smelting Recipe - goldbar:
    - craft_item skill=Smelting itemKey=goldbar
    - Materials: 1x goldnugget + 1x coal → 1x goldbar
    - Level required: 20 (Smithing skill)
    - Success chance: 40% - VERY CHALLENGING!

  🟨 Smithing Recipe - goldring:
    - craft_item skill=Smithing itemKey=goldring
    - Materials: 2x goldbar → 1x goldring
    - Level required: 1 (Smithing skill)
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


