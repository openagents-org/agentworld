# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Easier version with some pre-gathered materials
# SOURCE: task_08_bronze_alloy.yaml (redesigned for valid recipes)

task:
  name: "Iron Working Guild - Silver Ring Production (Easier)"
  description: "Three agents collaborate to mine iron ore, smelt bars, and craft silver rings"

# Task objectives
objectives:
  primary: "Mine iron ore, smelt iron bars, and craft 2x Silver Ring through coordinated teamwork"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent metallurgy scenario.

  STARTING ADVANTAGE:
  - miner_agent has 2x ironore pre-gathered
  - smelter_agent has 2x coal for smelting
  - smith_agent has 2x ironbar ready

  OBJECTIVE: Craft 2x Silver Ring (each needs 2x ironbar)

  PRODUCTION CHAIN:
  1. miner_agent mines additional ironore from mountain
  2. smelter_agent smelts ironore + coal → ironbar
  3. smith_agent crafts ironbar → silverring

  CRAFTING RECIPE:
  - Silver Ring: 2x ironbar → 1x silverring (Smithing level 1)
  - Iron Bar: 1x ironore + 1x coal → 1x ironbar (Smelting)

  TEAM ROLES:
  - miner_agent: Has pickaxe, mines iron ore
  - smelter_agent: Has coal, smelts iron bars
  - smith_agent: Has smithing skill, crafts rings

  LOCATIONS:
  - Mountain mining: Around (230, 40)

  DO NOT use complete() until 2x silverring is crafted!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 25

