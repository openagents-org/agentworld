# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, easier completion
# SOURCE: task_08_bronze_alloy.yaml

task:
  name: "Cooperative Bronze Alloy Creation - Advanced Metallurgy (Easier)"
  description: "Three agents work together to create bronze bars - with extra ore for higher success rate"

# Task objectives
objectives:
  primary: "Create bronze bars through coordinated copper and tin mining with alloy smelting"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent advanced metallurgy scenario requiring specialized ore mining.

  STARTING ADVANTAGE:
  - copper_miner_agent has 3x copperore + 3x tinore (extra for safety!)
  - alloy_smith_agent has 1x bronzebar already (head start!)
  - Higher skill levels increase success rate
  - Extra materials compensate for 70% success chance

  OBJECTIVE: Create bronze bars through alloy smelting (with safety buffer).

  NOTE ON SUCCESS RATE:
  - Bronze smelting has 70% success chance
  - Extra materials provided to handle failures
  - Target: At least 2x bronzebar total (1 pre-made + 1-2 new)

  TEAM COORDINATION:
  - copper_miner_agent transfers ores to alloy_smith_agent
  - alloy_smith_agent attempts multiple smelts with extra materials
  - Communication important to track successes

  DO NOT use complete() until at least 2x bronzebar is obtained!

  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  🥉 Smelting Recipe - bronzebar:
    - craft_item skill=Smelting itemKey=bronzebar
    - Materials: 1x copperore + 1x tinore → 1x bronzebar
    - Level required: 5 (uses Smithing skill level)
    - Success chance: 70% - multiple attempts may be needed!

# Limitations
max_action_steps: 20

