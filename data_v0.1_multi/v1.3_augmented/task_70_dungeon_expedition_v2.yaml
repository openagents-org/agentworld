# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_70_dungeon_expedition.yaml

task:
  name: "Dungeon Expedition - Triple Boss Hunt (Harder)"
  description: "Seven adventurers defeat three bosses and craft multiple weapons"

objectives:
  primary: "Defeat Iron Ogre, Ogre Guardian, AND Ogre Chieftain, then craft 4x Heavy Sword"

relevant_game_context: |
  This is a cooperative multi-agent dungeon expedition with maximum difficulty.

  CHALLENGE MODE:
  - THREE bosses to defeat
  - Must craft 4x heavy swords
  - Lower combat stats
  - Fewer consumables
  - Need to mine iron for extra swords

  TARGET BOSSES:
  - Iron Ogre (Level 25): Located at (238, 48)
  - Ogre Guardian (Level 32): Located at (291, 644)
  - Ogre Chieftain (Level 35): Located at (300, 650)

  PRODUCTION TARGETS (DOUBLED):
  - 4x Heavy Sword (2x ironbar + 1x hilt2 each = 8x ironbar, 4x hilt2)

  MATERIALS:
  - Smith has 4x ironbar and 2x hilt2
  - Must mine 4 more iron + smelt for extra swords
  - Must acquire 2 more hilt2

  DO NOT use complete() until ALL bosses are defeated and swords are crafted!

max_action_steps: 70

