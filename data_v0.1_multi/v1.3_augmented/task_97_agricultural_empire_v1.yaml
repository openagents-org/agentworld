# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_97_agricultural_empire.yaml

task:
  name: "Agricultural Empire - Quick Harvest (Easier)"
  description: "Ten agents fish and cook for agricultural production"

objectives:
  primary: "Catch 4x rawshrimp, cook 3x Cooked Shrimp and 1x Jellyfish Smoothie"

relevant_game_context: |
  This is a cooperative multi-agent agricultural scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - fisher1_agent has 2x rawshrimp pre-caught
  - fisher2_agent has 2x jellyfish pre-caught
  - Higher skill levels
  - More consumables

  PRODUCTION TARGETS (REDUCED):
  - 4x rawshrimp (from fishing) - 2 already caught!
  - 3x Cooked Shrimp (from cooking)
  - 1x Jellyfish Smoothie (from cooking) - jellyfish ready!

  LOCATIONS:
  - Fishing: Coastal (580, 750)

  TEAM ROLES:
  - Fishers: Catch seafood
  - Cooks: Prepare food

  DO NOT use complete() until all objectives are met!

max_action_steps: 22

