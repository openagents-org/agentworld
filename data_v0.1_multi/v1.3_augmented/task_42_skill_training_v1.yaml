task:
  name: "Skill Training - Multi-Craft Production (Easier)"
  description: "Three agents practice crafting with pre-gathered materials"

objectives:
  primary: "Craft 1x staff using pre-gathered sticks"

relevant_game_context: |
  This is a cooperative multi-agent skill training scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - fletcher_agent starts with 8x stick already crafted
  - smith_agent starts with 2x ironbar
  - Higher skill levels for guaranteed success
  - Only need to craft 1x staff (silverring optional)

  CRAFTING TARGETS (REDUCED):
  - 1x staff (5x stick + 1x bead)
  - Sticks already provided!

  TEAM COORDINATION:
  - Fletcher crafts staff with provided sticks and bead
  - Smith can craft silverring if time permits

  DO NOT use complete() until staff is crafted!

max_action_steps: 15

