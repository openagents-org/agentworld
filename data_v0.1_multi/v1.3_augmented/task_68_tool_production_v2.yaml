# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_68_tool_production.yaml

task:
  name: "Tool Production - Master Smithy (Harder)"
  description: "Seven smiths mine ore and craft a full arsenal of tools and weapons"

objectives:
  primary: "Mine ore, smelt bars, and craft 4x Pickaxe, 4x Axe, and 2x Heavy Sword"

relevant_game_context: |
  This is a cooperative multi-agent smithing scenario with increased difficulty.

  CHALLENGE MODE:
  - Doubled all targets
  - Must mine all ore from scratch
  - Lower skill levels require more attempts
  - Reduced consumables
  - Need additional hilt

  PRODUCTION TARGETS (DOUBLED):
  - 4x Pickaxe (5x ironbar + 1x logs each = 20x ironbar, 4x logs)
  - 4x Axe (3x ironbar + 1x logs each = 12x ironbar, 4x logs)
  - 2x Heavy Sword (2x ironbar + 1x hilt2 each = 4x ironbar, 2x hilt2)

  TOTAL IRON NEEDED: 36x ironbar
  - Requires 36x ironore + 36x coal for smelting

  DO NOT use complete() until ALL items are crafted!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 150

