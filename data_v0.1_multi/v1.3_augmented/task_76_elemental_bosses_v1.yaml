  description: "Ten agents defeat one elemental boss with enhanced stats"

objectives:
  primary: "Defeat the Iron Ogre at (238, 48)"

relevant_game_context: |
  This is a cooperative multi-agent boss combat with reduced difficulty.

  STARTING ADVANTAGE:
  - Only 1 boss to defeat (easiest one)
  - Higher combat stats for all squads
  - More consumables for healing
  - Full team can focus on single target

  TARGET BOSS (REDUCED):
  - Iron Ogre (Level 25): Located at mountain region (238, 48)

  COMBAT STRATEGY:
  - Full team assaults single boss
  - Tanks draw aggro
  - DPS focuses damage
  - Supports heal

  DO NOT use complete() until boss is defeated!

max_action_steps: 20

