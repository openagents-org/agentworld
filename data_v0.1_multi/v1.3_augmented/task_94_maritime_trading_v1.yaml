  STARTING ADVANTAGE:
  - fisher1_agent has 2x rawshrimp pre-caught
  - cook1_agent has 2x rawshrimp ready to cook
  - crafter_agent has goldbar ready
  - Reduced production targets
  - Higher skill levels

  PRODUCTION TARGETS (REDUCED):
  - 4x rawshrimp (from fishing) - 2 already caught!
  - 3x Cooked Shrimp (from cooking) - 2 shrimp ready!
  - 1x Gold Ring (2x goldbar) - goldbar ready!

  LOCATIONS:
  - Fishing: Coastal (580, 750)

  DO NOT use complete() until all objectives are met!

max_action_steps: 20

