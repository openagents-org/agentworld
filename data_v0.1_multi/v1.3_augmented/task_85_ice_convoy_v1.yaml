  description: "Ten agents gather ice resources and craft one staff"

objectives:
  primary: "Collect 6x icelogs and 3x rawshrimp, and craft 1x Ice Staff"

relevant_game_context: |
  This is a cooperative multi-agent polar expedition with reduced difficulty.

  STARTING ADVANTAGE:
  - icelogger1_agent has 4x icelogs pre-gathered
  - fisher1_agent has 2x rawshrimp pre-gathered
  - crafter_agent has staff ready for upgrade
  - Higher skill levels

  PRODUCTION TARGETS (REDUCED):
  - 6x icelogs (from ice region) - 4 already gathered!
  - 3x rawshrimp (from fishing) - 2 already gathered!
  - 1x Ice Staff (staff + icebead) - staff ready!

  TEAM ROLES:
  - Ice Loggers: Harvest ice logs
  - Fishers: Catch shrimp
  - Crafter: Make ice staff

  DO NOT use complete() until all objectives are met!

max_action_steps: 20

