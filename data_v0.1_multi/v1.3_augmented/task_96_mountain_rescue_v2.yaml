# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_96_mountain_rescue.yaml

task:
  name: "Mountain Rescue - Full Supply Chain (Harder)"
  description: "Ten agents gather massive supplies for rescue operation"

objectives:
  primary: "Collect 12x logs, 14x ironore, cook 8x Cooked Shrimp, and craft 4x Pickaxe"

relevant_game_context: |
  This is a cooperative multi-agent rescue supply scenario with maximum difficulty.

  CHALLENGE MODE:
  - Doubled resource collection
  - Quadrupled tool production
  - Lower skill levels
  - Fewer consumables

  PRODUCTION TARGETS (DOUBLED):
  - 12x logs (from forest)
  - 14x ironore (from mountain)
  - 8x Cooked Shrimp (from cooking)
  - 4x Pickaxe (5x ironbar + 1x logs each)

  MATERIALS NEEDED:
  - 20x ironbar for pickaxes
  - 4x logs for pickaxes

  LOCATIONS:
  - Forest: Around (388, 10)
  - Mountain: Around (230, 40)

  DO NOT use complete() until all objectives are met!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 65

