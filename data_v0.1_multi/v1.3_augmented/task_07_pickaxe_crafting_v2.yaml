# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, full production chain required
# SOURCE: task_07_pickaxe_crafting.yaml

task:
  name: "Cooperative Pickaxe Crafting - Mining Tool Production (Harder)"
  description: "Three agents work together to create TWO pickaxes through complete mining and smelting chain"

# Task objectives
objectives:
  primary: "Forge TWO high-quality pickaxes through coordinated large-scale material extraction and tool smithing"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent tool crafting scenario requiring extensive metallurgy operations.

  CHALLENGE MODE:
  - Must create TWO pickaxes (doubled target!)
  - tool_smith_agent starts with NO ironbar - full chain required
  - Must mine additional ore and smelt all ironbar from scratch
  - Reduced consumables - manage resources carefully

  OBJECTIVE: Forge 2x high-quality pickaxes through complete production chain.

  REQUIRED MATERIALS FOR 2 PICKAXES:
  - 10x ironbar (5 per pickaxe)
  - 2x logs (1 per pickaxe)
  - Must smelt all ironbar from 10x ironore + 10x coal

  CRAFTING CHAIN:
  1. Gather/consolidate 10x ironore + 10x coal
  2. Smelt 10x ironbar
  3. Gather 2x logs
  4. Forge 2x pickaxe (5x ironbar + 1x logs each)

  DO NOT use complete() until 2x pickaxes are created!

  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  ⛏️ Mining - materials:
    - harvest_resource on iron rock instances to get ironore (level 10+)
    - harvest_resource on coal deposits to get coal (level 1+)
    - harvest_resource on oak trees to get logs (level 1+)

  🔥 Smelting Recipe - ironbar:
    - craft_item skill=Smelting itemKey=ironbar
    - Materials: 1x ironore + 1x coal → 1x ironbar
    - Level required: 20 (uses Smithing skill level)

  ⛏️ Smithing Recipe - pickaxe:
    - craft_item skill=Smithing itemKey=pickaxe
    - Materials: 5x ironbar + 1x logs → 1x pickaxe
    - Level required: 5 (Smithing skill)

# Limitations
max_action_steps: 50

