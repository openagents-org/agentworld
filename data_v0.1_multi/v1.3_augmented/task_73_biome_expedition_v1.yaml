# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_73_biome_expedition.yaml

task:
  name: "Biome Expedition - Quick Hunt (Easier)"
  description: "Eight agents complete simplified biome objectives"

objectives:
  primary: "Collect 3x logs, defeat 1x Goblin, and craft 1x Wooden Bow with provided materials"

relevant_game_context: |
  This is a cooperative multi-agent expedition with reduced difficulty.

  STARTING ADVANTAGE:
  - forest1_agent has 2x logs pre-gathered
  - crafter_agent has 1x logs and 1x string ready for bow
  - Higher combat stats for easier fights
  - Reduced targets: fewer enemies, less gathering

  COMBAT TARGETS (REDUCED):
  - 1x Goblin (Level 10-15) - only one!

  PRODUCTION TARGETS (REDUCED):
  - 3x logs (from forest) - 2 already gathered!
  - 1x Wooden Bow (1x logs + 1x string) - materials ready!

  DO NOT use complete() until all objectives are met!

max_action_steps: 20

