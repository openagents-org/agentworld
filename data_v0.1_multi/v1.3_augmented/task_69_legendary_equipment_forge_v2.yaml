# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_69_legendary_equipment_forge.yaml

task:
  name: "Legendary Equipment Forge - Ultimate Challenge (Harder)"
  description: "Nine master craftsmen mine from scratch and create an expanded legendary arsenal"

objectives:
  primary: "Forge 7x golden items, 6x magical staffs, and 8x elite weapons from scratch"

relevant_game_context: |
  This is a cooperative multi-agent legendary crafting with maximum difficulty.

  CHALLENGE MODE:
  - No pre-gathered materials
  - Must mine 70+ gold ore, 30+ iron ore, 100+ coal
  - Must gather all beads, strings, logs, hilts
  - Lower skill levels require more attempts
  - Reduced consumables
  - Extended crafting list

  PRODUCTION TARGETS (EXPANDED):
  - 7x Golden Items:
    - 1x Golden Sword (8x goldbar + 1x hilt2)
    - 1x Golden Bow (15x goldbar + 10x string + 2x logs)
    - 1x Golden Boots (5x goldbar)
    - 4x Gold Ring (2x goldbar each = 8 goldbar)
  - 6x Magical Staffs:
    - Lightning, Fire, Ice, Nature staffs + 2 extras
  - 8x Elite Weapons:
    - 3x Heavy Sword, 3x Pickaxe, 2x Battle Axe

  MATERIAL REQUIREMENTS:
  - 70x goldore + 70x coal → 70x goldbar
  - 30x ironore + 30x coal → 30x ironbar
  - 12x beads (8 regular + 4 special)
  - 15x string, 8x logs, 8x hilt2

  DO NOT use complete() until ALL objectives are met!

max_action_steps: 80

