# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Harder version with partial pre-gathered materials
# SOURCE: task_69_legendary_equipment_forge.yaml (redesigned for realistic difficulty)

task:
  name: "Legendary Equipment Forge - Extended Challenge (Harder)"
  description: "Nine master craftsmen create legendary arsenal with some materials to gather"

objectives:
  primary: "Forge 4x golden items, 3x magic staffs, and 5x elite weapons"

relevant_game_context: |
  This is a cooperative multi-agent legendary crafting with increased difficulty.

  CHALLENGE MODE:
  - Some materials pre-gathered, some need mining
  - Must mine additional gold and iron ore
  - Must coordinate material transfers
  - Requires high skill coordination

  PRODUCTION TARGETS:
  - 4x Golden Items:
    - 1x Golden Sword (15x goldbar + 1x hilt2) - Smithing 62
    - 1x Golden Boots (15x goldbar) - Smithing 62
    - 2x Gold Ring (2x goldbar each = 4 goldbar) - Smithing 1
  - 3x Magic Staffs (5x stick + 1x bead each):
    - Crafting level 1
  - 5x Elite Weapons:
    - 2x Heavy Sword (2x ironbar + 1x hilt2 each)
    - 2x Pickaxe (5x ironbar + 1x logs each)
    - 1x Axe (3x ironbar + 1x logs)

  MATERIAL REQUIREMENTS (34 goldbar, 17 ironbar total):
  - 34x goldbar (25 provided, need 9 more from mining)
  - 17x ironbar (12 provided, need 5 more from mining)
  - 4x hilt2 (provided)
  - 15x stick (for staffs, provided)
  - 3x bead (provided)
  - 3x logs (for weapons)

  TEAM ROLES:
  - Miners: Mine gold ore and iron ore
  - Smelter: Smelt ore to bars
  - Legendary_Crafter: Craft golden items (has Smithing 85)
  - Master_Smelter: Craft magic staffs (has Crafting 80)
  - Component_Master: Provide logs and hilts

  DO NOT use complete() until ALL objectives are met!

max_action_steps: 90

