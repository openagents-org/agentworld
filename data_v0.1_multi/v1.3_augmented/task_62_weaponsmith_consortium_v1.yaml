# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_62_weaponsmith_consortium.yaml

task:
  name: "Weaponsmith Consortium - Arsenal (Easier)"
  description: "Seven smiths craft simplified arsenal using pre-gathered materials"

objectives:
  primary: "Craft 1x Heavy Sword, 1x Axe, and 1x Pickaxe using provided bars"

relevant_game_context: |
  This is a cooperative multi-agent weapon crafting with reduced difficulty.

  STARTING ADVANTAGE:
  - Master_Forger starts with 10x ironbar already smelted
  - Lumber_Jack starts with 4x logs
  - All materials provided - no mining needed
  - Higher skill levels for guaranteed success
  - Reduced targets: 3 weapons only

  PRODUCTION TARGETS (REDUCED):
  - 1x Heavy Sword (2x ironbar + 1x hilt2)
  - 1x Axe (3x ironbar + 1x logs)
  - 1x Pickaxe (5x ironbar + 1x logs)

  MATERIAL AVAILABILITY:
  - 10x ironbar (need 10 for all items)
  - 4x logs (need 2 for weapons)
  - 1x hilt2 (provided)

  DO NOT use complete() until weapons are forged!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 25

