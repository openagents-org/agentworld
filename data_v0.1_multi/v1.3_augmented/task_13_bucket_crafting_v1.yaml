# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Easier version with pre-gathered materials
# SOURCE: task_13_bucket_crafting.yaml (redesigned - bucket recipe doesn't exist)

task:
  name: "Wooden Bow Workshop - Cooperative Crafting (Easier)"
  description: "Three agents collaborate to gather materials and craft a Wooden Bow"

objectives:
  primary: "Craft 1x Wooden Bow through coordinated wood harvesting and string production"

relevant_game_context: |
  This is a cooperative multi-agent crafting scenario.

  STARTING ADVANTAGE:
  - lumber_agent has 1x logs pre-gathered
  - string_agent has 1x string ready
  - Higher skill levels for faster completion

  OBJECTIVE: Craft 1x Wooden Bow (needs 1x logs + 1x string)

  CRAFTING RECIPE:
  - Wooden Bow: 1x logs + 1x string → 1x woodenbow (Fletching level 5)

  TEAM ROLES:
  - lumber_agent: Has axe, can harvest logs from Oak Trees
  - string_agent: Provides string for bow crafting
  - fletcher_agent: Has fletching skill, crafts the bow

  LOCATIONS:
  - Forest (Oak Trees): Around (388, 10)

  DO NOT use complete() until woodenbow is crafted!

max_action_steps: 20

