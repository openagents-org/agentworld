# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_58_harvest_festival.yaml (redesigned - corn stew recipe doesn't exist)

task:
  name: "Festival Crafting - Large Scale Production (Harder)"
  description: "Six agents craft multiple festival items from gathered materials"

objectives:
  primary: "Craft 3x Magic Staff, 4x Silver Rings, and 2x Wooden Bows"

relevant_game_context: |
  This is a cooperative multi-agent festival crafting scenario with increased difficulty.

  CHALLENGE MODE:
  - Increased targets for all items
  - Must gather logs and sticks from scratch
  - Materials distributed across agents
  - Lower skill levels require coordination
  - Reduced consumables

  PRODUCTION TARGETS:
  - 3x Magic Staff (5x stick + 1x bead each = 15x stick + 3x bead)
  - 4x Silver Ring (2x ironbar each = 8x ironbar)
  - 2x Wooden Bow (1x logs + 1x string each)

  MATERIAL REQUIREMENTS:
  - 4x logs needed (for sticks and bows)
  - 3x bead provided (distributed)
  - 8x ironbar provided (distributed)
  - 2x string provided

  CRAFTING RECIPES:
  - Magic Staff: 5x stick + 1x bead (Crafting level 1)
  - Silver Ring: 2x ironbar (Smithing level 1)
  - Wooden Bow: 1x logs + 1x string (Fletching level 5)
  - Stick: 1x logs → 4x stick (Fletching)

  TEAM ROLES:
  - Lumberjacks harvest logs
  - Crafters make magic staffs
  - Smiths make silver rings
  - Fletchers make wooden bows

  DO NOT use complete() until ALL items are ready!

max_action_steps: 55

