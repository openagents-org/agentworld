# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_58_harvest_festival.yaml

task:
  name: "Harvest Festival - Celebration Prep (Harder)"
  description: "Six agents prepare expanded festival items from scratch"

objectives:
  primary: "Cook 6x Corn Stew, craft 4x Silver Rings, and 2x Wooden Bows"

relevant_game_context: |
  This is a cooperative multi-agent festival scenario with increased difficulty.

  CHALLENGE MODE:
  - Doubled all targets
  - Must gather all corn from scratch
  - Need 8x ironbar for rings
  - Need 2x logs and 2x string for bows
  - Lower skill levels require more attempts
  - Reduced consumables

  PRODUCTION TARGETS (DOUBLED):
  - 6x Corn Stew (6x corn + 6x bowl)
  - 4x Silver Ring (2x ironbar each = 8 bars)
  - 2x Wooden Bow (1x logs + 1x string each)

  MATERIAL REQUIREMENTS:
  - 6x corn (foraging)
  - 6x bowl (provided)
  - 8x ironbar (provided)
  - 2x logs (gathering)
  - 2x string (provided)

  TEAM ROLES:
  - Foragers gather 6 corn
  - Chef cooks 6 corn stew
  - Jeweler crafts 4 rings
  - Artisan crafts 2 bows

  DO NOT use complete() until ALL items are ready!

max_action_steps: 55

