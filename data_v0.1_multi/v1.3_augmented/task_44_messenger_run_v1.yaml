# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_44_messenger_run.yaml

task:
  name: "Messenger Run - Resource Delivery (Easier)"
  description: "Three agents with pre-gathered resources complete simplified delivery"

objectives:
  primary: "Transfer pre-gathered logs and coal to coordinator with minimal additional gathering"

relevant_game_context: |
  This is a cooperative multi-agent delivery scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - lumberjack_agent starts with 2x logs already gathered
  - miner_agent starts with 1x coal already gathered
  - Higher skill levels for faster gathering
  - Only need 1 more log and 1 more coal

  COLLECTION TARGETS (REDUCED):
  - 3x logs total (have 2, gather 1)
  - 2x coal total (have 1, gather 1)

  DELIVERY REQUIREMENT:
  - All resources transferred to coordinator_agent
  - Use transfer_items to hand over materials

  TEAM COORDINATION:
  - Lumberjack gathers 1 more log, delivers all
  - Miner gathers 1 more coal, delivers all
  - Coordinator waits at meeting point

  DO NOT use complete() until coordinator has all resources!

max_action_steps: 15

agent_1:
  username: "lumberjack_agent"
  new_character: true

  location:
    x: 388
    y: 10

  skill_levels:
    lumberjacking: 35
    strength: 32
    health: 40

  inventory_items:
    - item: "flask"
      count: 25
    - item: "apple"
      count: 30
    - item: "logs"
      count: 2

  equipped_items:
    - item: "axe"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0

agent_2:
  username: "miner_agent"
  new_character: true

  location:
    x: 230
    y: 45

  skill_levels:
    mining: 30
    strength: 32
    health: 40

  inventory_items:
    - item: "flask"
      count: 25
    - item: "apple"
      count: 30
    - item: "coal"
      count: 1

  equipped_items:
    - item: "pickaxe"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0

agent_3:
  username: "coordinator_agent"
  new_character: true

  location:
    x: 300
    y: 100

  skill_levels:
    strength: 28
    health: 40

  inventory_items:
    - item: "flask"
      count: 30
    - item: "apple"
      count: 35

  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0

success_criteria:
  - "coordinator_agent inventory contains at least 3x logs"
  - "coordinator_agent inventory contains at least 2x coal"
  - "All agents survive the mission"
