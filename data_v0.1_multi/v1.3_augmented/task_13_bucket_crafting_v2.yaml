# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, must gather all materials
# SOURCE: task_13_bucket_crafting.yaml

task:
  name: "Cooperative Bucket Crafting - Utility Container Production (Harder)"
  description: "Three agents work together to create THREE buckets through extensive logging operations"

objectives:
  primary: "Create THREE utility buckets through coordinated large-scale wood harvesting and crafting"

relevant_game_context: |
  This is a cooperative multi-agent utility crafting scenario requiring extensive wood materials.

  CHALLENGE MODE:
  - Must create THREE buckets (tripled target!)
  - container_crafter_agent starts with NO logs - must harvest all
  - Need 15x logs total (5 per bucket)
  - Reduced consumables - manage resources carefully

  OBJECTIVE: Create 3x buckets through extensive logging operations.

  REQUIRED MATERIALS FOR 3 BUCKETS:
  - 15x logs (5 per bucket)
  - Must harvest all from oak trees

  STRATEGY:
  - All agents with lumberjacking skill harvest logs
  - Consolidate 15+ logs with container_crafter_agent
  - container_crafter_agent crafts 3x bucket

  DO NOT use complete() until 3x bucket is created!

  CRAFTING RECIPES:
  🪵 Lumberjacking - logs:
    - harvest_resource on oak tree instances to get logs
    - Level required: 1+ (Lumberjacking skill)

  🪣 Crafting Recipe - bucket:
    - craft_item skill=Crafting itemKey=bucket
    - Materials: 5x logs → 1x bucket
    - Level required: 10 (Crafting skill)
    - Craft 3 times!

max_action_steps: 45

