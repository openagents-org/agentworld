# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Harder version with more requirements
# SOURCE: task_13_bucket_crafting.yaml (redesigned - bucket recipe doesn't exist)

task:
  name: "Wooden Bow Workshop - Full Production (Harder)"
  description: "Three agents collaborate to harvest materials and craft 2x Wooden Bows"

objectives:
  primary: "Craft 2x Wooden Bow through coordinated wood harvesting and material gathering"

relevant_game_context: |
  This is a cooperative multi-agent crafting scenario with increased difficulty.

  CHALLENGE MODE:
  - Must craft 2x Wooden Bow (need 2x logs + 2x string)
  - No pre-gathered logs - must harvest from Oak Trees
  - Lower skill levels require more coordination
  - Fewer consumables

  CRAFTING RECIPE:
  - Wooden Bow: 1x logs + 1x string → 1x woodenbow (Fletching level 5)

  TEAM ROLES:
  - lumber_agent: Has axe, must harvest 2x logs from Oak Trees
  - string_agent: Has 2x string, transfers to fletcher
  - fletcher_agent: Has fletching skill, crafts both bows

  LOCATIONS:
  - Forest (Oak Trees): Around (388, 10)

  DO NOT use complete() until 2x woodenbow is crafted!

max_action_steps: 30

agent_1:
  username: "lumber_agent"
  new_character: true

  location:
    x: 388
    y: 10

  skill_levels:
    lumberjacking: 20
    strength: 25
    health: 28

  inventory_items:
    - item: "flask"
      count: 15
    - item: "apple"
      count: 20

  equipped_items:
    - item: "axe"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0

agent_2:
  username: "string_agent"
  new_character: true

  location:
    x: 390
    y: 12

  skill_levels:
    crafting: 18
    strength: 22
    health: 26

  inventory_items:
    - item: "flask"
      count: 15
    - item: "apple"
      count: 20
    - item: "string"
      count: 2

  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0

agent_3:
  username: "fletcher_agent"
  new_character: true

  location:
    x: 392
    y: 14

  skill_levels:
    fletching: 18
    crafting: 15
    health: 25

  inventory_items:
    - item: "flask"
      count: 15
    - item: "apple"
      count: 20
    - item: "logs"
      count: 2
    - item: "string"
      count: 2

  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0

success_criteria:
  - "Team inventory contains 2x woodenbow"
  - "lumber_agent harvests logs from Oak Trees"
  - "string_agent transfers string to fletcher_agent"
  - "fletcher_agent crafts both wooden bows"
  - "All agents coordinate their specialized roles"
