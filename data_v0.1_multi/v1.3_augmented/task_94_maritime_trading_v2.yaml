task:
  name: "Maritime Trading - Empire Trade (Harder)"
  description: "Ten agents fish and craft for large-scale maritime trading"

objectives:
  primary: "Catch 16x rawshrimp, cook 12x Cooked Shrimp, and craft 4x Gold Ring"

relevant_game_context: |
  This is a cooperative multi-agent maritime scenario with maximum difficulty.

  CHALLENGE MODE:
  - Doubled fishing and cooking targets
  - Quadrupled ring production
  - Lower skill levels
  - Fewer consumables

  PRODUCTION TARGETS (DOUBLED):
  - 16x rawshrimp (from fishing)
  - 12x Cooked Shrimp (from cooking)
  - 4x Gold Ring (2x goldbar each)

  MATERIALS NEEDED:
  - 8x goldbar for rings

  LOCATIONS:
  - Fishing: Coastal (580, 750)

  DO NOT use complete() until all objectives are met!

max_action_steps: 65

