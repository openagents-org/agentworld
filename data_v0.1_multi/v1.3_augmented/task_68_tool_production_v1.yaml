# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_68_tool_production.yaml

task:
  name: "Tool Production - Quick Forge (Easier)"
  description: "Seven smiths craft tools with pre-smelted iron bars"

objectives:
  primary: "Craft 1x Pickaxe, 1x Axe, and 1x Heavy Sword with provided materials"

relevant_game_context: |
  This is a cooperative multi-agent smithing scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - smelter_agent has 10x ironbar ready
  - smith_agent has 5x ironbar and 1x hilt2 ready
  - lumberjack_agent has 3x logs for handles
  - Higher skill levels for guaranteed crafting
  - Reduced targets: 1 of each tool

  PRODUCTION TARGETS (REDUCED):
  - 1x Pickaxe (5x ironbar + 1x logs) - materials ready!
  - 1x Axe (3x ironbar + 1x logs) - materials ready!
  - 1x Heavy Sword (2x ironbar + 1x hilt2) - materials ready!

  TEAM COORDINATION:
  - Materials are pre-gathered
  - Transfer items to smith
  - Smith crafts all tools

  DO NOT use complete() until items are crafted!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 18

