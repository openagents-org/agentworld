relevant_game_context: |
  This is a cooperative multi-agent boss hunting mission with reduced difficulty.

  STARTING ADVANTAGE:
  - Higher skill levels for more effective combat
  - More consumables (healthpotion, manapotion) for survival
  - Pre-positioned closer to Dark Wolf location
  - Enhanced armor reduces damage taken
  - Single boss target - no additional objectives

  OBJECTIVE: Hunt and defeat the Dark Wolf boss to cleanse the dark forest.

  MISSION REQUIREMENTS:
  - Locate the Dark Wolf boss at coordinates (1016, 682)
  - Coordinate team attack to defeat the Dark Wolf
  - Collect wolfarmor drop as proof of victory
  - Keep all team members alive

  TEAM COORDINATION:
  - Use global chat to coordinate attack timing
  - All three agents focus fire on Dark Wolf
  - Share health status and provide healing support

  DO NOT use complete() until Dark Wolf is defeated and drops collected!

  DARK WOLF COMBAT:
  🐺 Boss Information - Dark Wolf:
    - Location: coordinates (1016, 682)
    - HP: approximately 1050
    - Drops: wolfarmor (valuable armor)
    - Coordinate all three agents for fast kill

