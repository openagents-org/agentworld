# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_52_smithy_operation.yaml

task:
  name: "Smithy Operation - Weapon Production (Harder)"
  description: "Five smiths mine and craft expanded equipment set from scratch"

objectives:
  primary: "Craft 2x Heavy Sword, 2x Pickaxe, and 4x Silver Rings"

relevant_game_context: |
  This is a cooperative multi-agent smithing scenario with increased difficulty.

  CHALLENGE MODE:
  - Doubled all targets
  - Must mine all ore from scratch
  - Lower skill levels require more attempts
  - Need 22x ironbar total

  PRODUCTION TARGETS (DOUBLED):
  - 2x Heavy Sword (2x ironbar + 1x hilt2 each = 4 bars, 2 hilts)
  - 2x Pickaxe (5x ironbar + 1x logs each = 10 bars, 2 logs)
  - 4x Silver Ring (2x ironbar each = 8 bars)

  TOTAL IRON REQUIRED: 22x ironbar
  - Need 22x ironore + 22x coal for smelting

  TEAM ROLES:
  - Miners: Extract 22 ore and 22 coal
  - Lumberjack: Provide 2 logs
  - Smelter: Process all ore
  - Smith: Craft all items

  DO NOT use complete() until ALL items are crafted!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 60

