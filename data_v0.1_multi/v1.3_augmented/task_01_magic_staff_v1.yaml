# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, easier completion
# SOURCE: task_01_magic_staff.yaml

task:
  name: "Cooperative Magic Staff Crafting - Wizard Equipment Preparation (Easier)"
  description: "Three agents work together to gather materials and craft a magical staff for spellcasting - with pre-gathered materials"

# Task objectives
objectives:
  primary: "Prepare wizard_agent with crafted magic staff for magical combat"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent scenario where teamwork is essential.

  OBJECTIVE: Work together to create a magic staff for the wizard_agent to prepare for magical combat.

  TEAM COORDINATION:
  - Use global chat to communicate and coordinate your actions
  - Share resources and materials between team members as needed
  - Leverage each agent's specialized skills effectively
  - Stay within reasonable distance for successful item transfers
  - Complete the objective within the time limit

  STARTING ADVANTAGE:
  - lumberjack_agent starts with 1x logs (partial materials pre-gathered)
  - woodworker_agent starts with 2x sticks (head start on crafting)
  - This reduces the amount of gathering needed!

  GENERAL STRATEGY:
  - The team needs to gather wood materials and craft components in sequence
  - With starting materials, less harvesting is required
  - Someone needs to collect additional logs, someone needs to craft sticks, someone assembles the staff
  - Work together to determine who does what based on your skills and current situation
  - Stay close enough for transfers - use coordination and positioning wisely

  DO NOT use complete() until ALL objectives are achieved by the team!

  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  🪵 Lumberjacking - logs:
    - harvest_resource on OAK TREE instances to get logs (NOT Willow trees!)
    - Level required: 1+ (Lumberjacking skill)
    - IMPORTANT: Look for "Oak", "Oak2", "Oak3", "Oak4", or "Oak5" tree types
    - AVOID: Willow trees (Level 30, produces willowlogs), Pine trees, etc.

  🪄 Fletching Recipe - stick:
    - craft_item skill=Fletching itemKey=stick
    - Materials: 1x logs → 4x stick
    - Level required: 1 (Fletching skill)
    - With 2 sticks already, only need 1 more log for 3 additional sticks!

  ⚡ Crafting Recipe - staff:
    - craft_item skill=Crafting itemKey=staff
    - Materials: 5x stick + 1x bead → 1x staff
    - Level required: 1 (Crafting skill)
    - CRITICAL: Requires exactly 5x stick + magic bead!

# Limitations
max_action_steps: 30

# Agent configurations
agent_1:
  username: "t01a1_lumberjack_agent"
  new_character: true

  # Starting location - forest area for tree cutting
  location:
    x: 388
    y: 3

  # Skills focused on lumberjacking - boosted
  skill_levels:
    lumberjacking: 30
    strength: 28
    health: 28

  # Lumberjacking equipment and basic supplies - with starting logs
  inventory_items:
    - item: "flask"
      count: 15
    - item: "apple"
      count: 20
    - item: "logs"
      count: 1

  equipped_items:
    - item: "axe"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0


agent_2:
  username: "t01a1_woodworker_agent"
  new_character: true

  # Starting location - central area for coordination
  location:
    x: 390
    y: 3

  # Skills focused on fletching and crafting - boosted
  skill_levels:
    fletching: 20
    crafting: 15
    strength: 23
    health: 23

  # Basic supplies - with starting sticks
  inventory_items:
    - item: "flask"
      count: 12
    - item: "apple"
      count: 17
    - item: "stick"
      count: 2

  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0


agent_3:
  username: "t01a1_wizard_agent"
  new_character: true

  # Starting location - magical area
  location:
    x: 392
    y: 3

  # Skills focused on crafting and magic - boosted
  skill_levels:
    crafting: 20
    magic: 28
    health: 28
    strength: 18

  # Magical supplies and basic gear
  inventory_items:
    - item: "flask"
      count: 15
    - item: "apple"
      count: 20
    - item: "bead"
      count: 1

  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0


# Success criteria for multi-agent task
success_criteria:
  - "lumberjack_agent successfully gathers and transfers logs to woodworker_agent"
  - "woodworker_agent successfully crafts sticks and transfers to wizard_agent"
  - "wizard_agent receives materials and crafts a magic staff"
  - "wizard_agent successfully equips the magic staff"
  - "All agents use global chat for coordination throughout the process"
  - "wizard_agent declares readiness for magical combat"
