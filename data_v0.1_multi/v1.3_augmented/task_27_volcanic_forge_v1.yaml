# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_27_volcanic_forge.yaml

task:
  name: "Southern Desert Expedition - Mining and Combat (Easier)"
  description: "Three agents work together with pre-gathered ores to defeat one miniboss and collect equipment"

objectives:
  primary: "Successfully defeat Water Guardian and collect equipment drops with pre-gathered ore supplies"

relevant_game_context: |
  This is a cooperative multi-agent expedition with reduced difficulty.

  STARTING ADVANTAGE:
  - volcanic_miner_agent starts with 2x goldnugget and 1x lapisore pre-mined
  - Higher skill levels for safer combat
  - More consumables for survival
  - Only need to defeat ONE miniboss (Water Guardian)
  - Ogre Guardian is OPTIONAL

  OBJECTIVE: Defeat Water Guardian and collect its equipment drops.

  MISSION REQUIREMENTS:
  - Navigate to Water Guardian at (197, 633)
  - Defeat Water Guardian (Level 36) in coordinated combat
  - Verify pre-gathered ores in inventory

  TEAM COORDINATION:
  - Use global chat to coordinate combat
  - Focus all agents on Water Guardian
  - Share healing items during combat

  DO NOT use complete() until Water Guardian is defeated!

  COMBAT STRATEGY:
  ⚔️ Water Guardian (Level 36) at (197, 633):
    - Drops: redguardarmor, ring1, scimitar, watermelonbow
    - Coordinate team attacks for faster kill
    - Focus fire for efficiency
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 22

