# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_26_desert_caravan.yaml

task:
  name: "Desert Caravan Expedition - Resource Gathering and Team Exchange (Easier)"
  description: "Three agents work together with pre-gathered resources to navigate desert and complete resource exchanges"

objectives:
  primary: "Successfully reach the desert region and complete resource exchanges with pre-gathered materials"

relevant_game_context: |
  This is a cooperative multi-agent desert expedition with reduced difficulty.

  STARTING ADVANTAGE:
  - resource_gatherer_agent starts with 2x goldore already mined
  - desert_trader_agent has 15x goldnugget for trading
  - Higher skill levels for safer combat
  - More consumables for desert survival
  - Reduced travel required - closer starting position
  - No combat requirement - just resource exchanges

  OBJECTIVE: Navigate to desert and complete resource exchanges between team members.

  MISSION REQUIREMENTS:
  - Navigate to Southern Desert region (Y > 600)
  - Complete at least 2 resource transfers between team members
  - Coordinate movements via chat

  TEAM COORDINATION:
  - Use chat tool to communicate locations
  - Use transfer_items to share gathered resources
  - Share supplies if needed for survival

  DO NOT use complete() until resource exchanges are completed!

  RESOURCE EXCHANGE:
  📦 Transfer Items:
    - Use transfer_items tool to share resources
    - Parameters: targetPlayer (username), itemKey, count
    - Example: transfer goldore to desert_trader_agent

max_action_steps: 28

