# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Easier version with distributed materials
# SOURCE: task_14_shrimp_cooking.yaml

task:
  name: "Cooperative Shrimp Cooking - Seafood Culinary Team (Easier)"
  description: "Three agents collaborate to gather shrimp and cook them"

objectives:
  primary: "Cook 4x Cooked Shrimp through coordinated fishing and culinary preparation"

relevant_game_context: |
  This is a cooperative multi-agent seafood cooking scenario.

  STARTING ADVANTAGE:
  - fisherman_agent has 2x rawshrimp and fishing pole
  - fisher2_agent has 2x rawshrimp
  - Materials distributed - requires transfers

  OBJECTIVE: Cook 4x Cooked Shrimp

  TEAM ROLES:
  - fisherman_agent: Has rawshrimp, can fish more at coast
  - fisher2_agent: Has rawshrimp, transfers to chef
  - seafood_chef_agent: Has cooking skill, cooks the shrimp

  COORDINATION REQUIRED:
  - Fishermen must transfer rawshrimp to chef
  - Only chef has cooking skill to prepare food

  LOCATIONS:
  - Coast (fishing): Around (580, 750)

  DO NOT use complete() until 4x cookedshrimp exists!

  CRAFTING RECIPE:
  - Cooked Shrimp: 1x rawshrimp → 1x cookedshrimp (Cooking skill)

max_action_steps: 20

