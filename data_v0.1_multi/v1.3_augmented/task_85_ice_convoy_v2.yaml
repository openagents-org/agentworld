# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_85_ice_convoy.yaml

task:
  name: "Ice Convoy - Arctic Expedition (Harder)"
  description: "Ten agents gather ice resources and craft multiple staffs"

objectives:
  primary: "Collect 15x icelogs and 8x rawshrimp, and craft 2x Ice Staff"

relevant_game_context: |
  This is a cooperative multi-agent polar expedition with maximum difficulty.

  CHALLENGE MODE:
  - Doubled staff production
  - Increased gathering targets
  - Must craft staffs from scratch
  - Lower skill levels

  PRODUCTION TARGETS (DOUBLED):
  - 15x icelogs (from ice region)
  - 8x rawshrimp (from fishing)
  - 2x Ice Staff (staff + icebead each)

  CRAFTING CHAIN:
  - First craft 2x Magic Staff: 5x stick + 1x bead each
  - Then craft 2x Ice Staff: 1x staff + 1x icebead each

  TEAM ROLES:
  - Ice Loggers: Harvest ice logs
  - Fishers: Catch shrimp
  - Crafter: Make ice staffs

  DO NOT use complete() until all objectives are met!

max_action_steps: 60

