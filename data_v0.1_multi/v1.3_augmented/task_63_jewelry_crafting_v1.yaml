# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_63_jewelry_crafting.yaml

task:
  name: "Jewelry Crafting - Ring Workshop (Easier)"
  description: "Six artisans craft simplified jewelry with pre-smelted bars"

objectives:
  primary: "Craft 1x Gold Ring and 1x Silver Ring using provided materials"

relevant_game_context: |
  This is a cooperative multi-agent jewelry crafting with reduced difficulty.

  STARTING ADVANTAGE:
  - smelter_agent starts with 2x goldbar and 2x ironbar
  - forager_agent has beryl and string for optional pendant
  - Higher skill levels for guaranteed success
  - Reduced targets: 1 gold ring, 1 silver ring

  PRODUCTION TARGETS (REDUCED):
  - 1x Gold Ring (2x goldbar) - bars provided!
  - 1x Silver Ring (2x ironbar) - bars provided!

  OPTIONAL BONUS:
  - Can craft beryl pendant if time permits

  TEAM COORDINATION:
  - Transfer bars to jeweler
  - Jeweler crafts both rings

  DO NOT use complete() until rings are crafted!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 18

