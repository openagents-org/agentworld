# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_63_jewelry_crafting.yaml

task:
  name: "Jewelry Crafting - Full Collection (Harder)"
  description: "Six artisans mine and craft expanded jewelry collection"

objectives:
  primary: "Craft 4x Gold Ring, 4x Silver Ring, and 4x Beryl Pendant"

relevant_game_context: |
  This is a cooperative multi-agent jewelry crafting with increased difficulty.

  CHALLENGE MODE:
  - Doubled all targets
  - Must mine all ore from scratch
  - Need 8x goldnugget + 8x ironore + 16x coal
  - Must forage 4x beryl
  - Lower skill levels require more attempts
  - Reduced consumables

  PRODUCTION TARGETS (DOUBLED):
  - 4x Gold Ring (2x goldbar each = 8 goldbar)
  - 4x Silver Ring (2x ironbar each = 8 ironbar)
  - 4x Beryl Pendant (beryl + string each)

  MATERIAL REQUIREMENTS:
  - 8x goldnugget + 8x coal → 8x goldbar
  - 8x ironore + 8x coal → 8x ironbar
  - 4x beryl (foraging)
  - 4x string (provided)

  DO NOT use complete() until ALL jewelry is crafted!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 55

