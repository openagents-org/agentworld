# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_36_elite_skeleton_hunt.yaml

task:
  name: "Elite Skeleton Hunt - Undead Elimination (Easier)"
  description: "Three agents work together with pre-gathered resources to hunt skeletons"

objectives:
  primary: "Defeat 2x Skeletons and collect 3x logs with pre-gathered starting materials"

relevant_game_context: |
  This is a cooperative multi-agent combat and gathering scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - gatherer_agent starts with 2x logs already collected
  - Higher skill levels for safer combat
  - More consumables for healing
  - Reduced targets: 2x Skeletons (not 3)
  - Only need 1 additional log

  TARGETS (REDUCED):
  - Defeat 2x Skeletons (Level 14, 140 HP each)
  - Collect 3x logs total (have 2, need 1 more)
  - Skeletons drop: sword2 (heavy sword)

  COMBAT TACTICS:
  - Skeletons are undead melee fighters
  - Use coordinated attacks to take them down quickly

  DO NOT use complete() until objectives are met!

max_action_steps: 20

