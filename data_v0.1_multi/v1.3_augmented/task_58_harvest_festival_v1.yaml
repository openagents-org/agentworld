# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_58_harvest_festival.yaml

task:
  name: "Harvest Festival - Celebration Prep (Easier)"
  description: "Six agents prepare simplified festival items with pre-gathered materials"

objectives:
  primary: "Cook 1x Corn Stew and craft 1x Silver Ring using provided ingredients"

relevant_game_context: |
  This is a cooperative multi-agent festival scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - forager1_agent starts with 2x corn already gathered
  - chef_agent has bowls ready
  - jeweler_agent has ironbar ready for ring
  - artisan_agent has materials for bow (optional)
  - Higher skill levels for guaranteed success
  - Reduced targets: 1 stew, 1 ring (bow optional)

  PRODUCTION TARGETS (REDUCED):
  - 1x Corn Stew (corn + bowl) - ingredients ready!
  - 1x Silver Ring (2x ironbar) - bars ready!

  TEAM COORDINATION:
  - Chef cooks corn stew
  - Jeweler crafts silver ring
  - Others can assist or prepare more

  DO NOT use complete() until items are ready!

max_action_steps: 20

