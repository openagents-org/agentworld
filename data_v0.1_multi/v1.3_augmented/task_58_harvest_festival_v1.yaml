# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Easier version with distributed materials
# SOURCE: task_58_harvest_festival.yaml (redesigned - corn stew recipe doesn't exist)

task:
  name: "Festival Crafting - Celebration Prep (Easier)"
  description: "Six agents collaborate to craft festival equipment through material transfers"

objectives:
  primary: "Craft 1x Magic Staff and 1x Silver Ring through coordinated material transfers"

relevant_game_context: |
  This is a cooperative multi-agent festival crafting scenario.

  STARTING ADVANTAGE:
  - Materials distributed across agents - requires transfers
  - Higher skill levels for guaranteed success
  - All materials provided, just need coordination

  PRODUCTION TARGETS:
  - 1x Magic Staff (5x stick + 1x bead) - Crafting level 1
  - 1x Silver Ring (2x ironbar) - Smithing level 1

  MATERIAL DISTRIBUTION (MUST TRANSFER TO CRAFTERS):
  - gatherer1_agent: Has 3x stick
  - gatherer2_agent: Has 2x stick + 1x bead
  - smith_supplier_agent: Has 1x ironbar
  - jeweler_agent: Has Smithing skill + 1x ironbar (needs 1 more from supplier)
  - crafter_agent: Has Crafting skill but needs sticks and bead
  - coordinator_agent: Facilitates transfers between agents

  TEAM COORDINATION:
  - gatherer1 and gatherer2 transfer materials to crafter_agent
  - smith_supplier transfers ironbar to jeweler_agent
  - crafter_agent crafts Magic Staff
  - jeweler_agent crafts Silver Ring

  DO NOT use complete() until items are ready!

max_action_steps: 25

