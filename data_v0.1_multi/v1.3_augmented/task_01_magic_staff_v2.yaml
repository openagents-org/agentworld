# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased difficulty, no starting materials
# SOURCE: task_01_magic_staff.yaml

task:
  name: "Cooperative Magic Staff Crafting - Wizard Equipment Preparation (Harder)"
  description: "Three agents work together to gather materials and craft a magical staff for spellcasting - must gather all materials from scratch"

# Task objectives
objectives:
  primary: "Prepare wizard_agent with crafted magic staff for magical combat"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent scenario where teamwork is essential.

  OBJECTIVE: Work together to create a magic staff for the wizard_agent to prepare for magical combat.

  CHALLENGE MODE:
  - No pre-gathered materials - must harvest everything from scratch!
  - Reduced consumables - manage resources carefully
  - Slightly lower skill levels - efficiency matters more

  TEAM COORDINATION:
  - Use global chat to communicate and coordinate your actions
  - Share resources and materials between team members as needed
  - Leverage each agent's specialized skills effectively
  - Stay within reasonable distance for successful item transfers
  - Complete the objective within the time limit

  GENERAL STRATEGY:
  - The team needs to gather wood materials and craft components in sequence
  - Coordinate locations to enable successful material transfers between agents
  - Someone needs to collect logs, someone needs to craft sticks, someone assembles the staff
  - Work together to determine who does what based on your skills and current situation
  - Stay close enough for transfers - use coordination and positioning wisely

  DO NOT use complete() until ALL objectives are achieved by the team!

  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  🪵 Lumberjacking - logs:
    - harvest_resource on OAK TREE instances to get logs (NOT Willow trees!)
    - Level required: 1+ (Lumberjacking skill)
    - IMPORTANT: Look for "Oak", "Oak2", "Oak3", "Oak4", or "Oak5" tree types
    - AVOID: Willow trees (Level 30, produces willowlogs), Pine trees, etc.
    - NEED: At least 2 logs for enough sticks!

  🪄 Fletching Recipe - stick:
    - craft_item skill=Fletching itemKey=stick
    - Materials: 1x logs → 4x stick
    - Level required: 1 (Fletching skill)
    - IMPORTANT: Need minimum 2x logs to get enough sticks for the staff!

  ⚡ Crafting Recipe - staff:
    - craft_item skill=Crafting itemKey=staff
    - Materials: 5x stick + 1x bead → 1x staff
    - Level required: 1 (Crafting skill)
    - CRITICAL: Requires exactly 5x stick (from 2x logs) + magic bead!

# Limitations
max_action_steps: 35

# Agent configurations
agent_1:
  username: "lumberjack_agent"
  new_character: true

  # Starting location - forest area for tree cutting
  location:
    x: 388
    y: 3

  # Skills focused on lumberjacking - slightly reduced
  skill_levels:
    lumberjacking: 22
    strength: 22
    health: 22

  # Reduced supplies - no starting materials
  inventory_items:
    - item: "flask"
      count: 8
    - item: "apple"
      count: 10

  equipped_items:
    - item: "axe"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0


agent_2:
  username: "woodworker_agent"
  new_character: true

  # Starting location - central area for coordination
  location:
    x: 390
    y: 3

  # Skills focused on fletching and crafting - slightly reduced
  skill_levels:
    fletching: 12
    crafting: 8
    strength: 18
    health: 18

  # Reduced supplies
  inventory_items:
    - item: "flask"
      count: 6
    - item: "apple"
      count: 8

  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0


agent_3:
  username: "wizard_agent"
  new_character: true

  # Starting location - magical area
  location:
    x: 392
    y: 3

  # Skills focused on crafting and magic - slightly reduced
  skill_levels:
    crafting: 12
    magic: 22
    health: 22
    strength: 12

  # Reduced supplies - still has the bead
  inventory_items:
    - item: "flask"
      count: 8
    - item: "apple"
      count: 10
    - item: "bead"
      count: 1

  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0


# Success criteria for multi-agent task
success_criteria:
  - "lumberjack_agent successfully gathers at least 2 logs and transfers to woodworker_agent"
  - "woodworker_agent successfully crafts 5+ sticks and transfers to wizard_agent"
  - "wizard_agent receives materials and crafts a magic staff"
  - "wizard_agent successfully equips the magic staff"
  - "All agents use global chat for coordination throughout the process"
  - "wizard_agent declares readiness for magical combat"
  - "Task completed with efficient resource management despite limited supplies"
