task:
  name: "Elemental Grid - Quick Staff (Easier)"
  description: "Ten agents craft one elemental staff with pre-gathered materials"

objectives:
  primary: "Collect 5x icelogs and 4x logs, and craft 1x Magic Staff"

relevant_game_context: |
  This is a cooperative multi-agent crafting scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - icelogger1_agent has 3x icelogs pre-gathered
  - logger1_agent has 2x logs pre-gathered
  - Only 1 staff to craft (instead of 2)
  - Higher skill levels

  PRODUCTION TARGETS (REDUCED):
  - 5x icelogs (from ice region) - 3 already gathered!
  - 4x logs (from forest) - 2 already gathered!
  - 1x Magic Staff (5x stick + 1x bead)

  TEAM ROLES:
  - Ice Loggers: Harvest ice logs
  - Forest Loggers: Harvest regular logs
  - Crafter: Make staff

  DO NOT use complete() until all objectives are met!

max_action_steps: 22

