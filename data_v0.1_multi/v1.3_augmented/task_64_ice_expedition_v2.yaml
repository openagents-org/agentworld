# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_64_ice_expedition.yaml

task:
  name: "Ice Region Expedition (Harder)"
  description: "Eight explorers face expanded ice region challenges"

objectives:
  primary: "Collect 16x ice logs, defeat 8x Ice Rats, and craft 4x Axe"

relevant_game_context: |
  This is a cooperative multi-agent ice expedition with increased difficulty.

  CHALLENGE MODE:
  - Doubled all targets
  - Must mine iron ore for axe bars
  - Lower combat stats require better tactics
  - Fewer consumables - manage carefully
  - Ice region is dangerous!

  PRODUCTION TARGETS (DOUBLED):
  - 16x ice logs (harvesting)
  - Defeat 8x Ice Rat
  - 4x Axe (3x ironbar + 1x logs each = 12 bars, 4 logs)

  ICE REGION LOCATION:
  - Ice region around (259, 151)
  - Ice Rats spawn frequently

  MATERIAL REQUIREMENTS:
  - 12x ironbar (need to mine 12 ore + 12 coal)
  - 4x logs for axe handles

  DO NOT use complete() until ALL objectives are met!

max_action_steps: 60

