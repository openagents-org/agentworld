# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_24_ancient_ruins.yaml

task:
  name: "Ancient Ruins Exploration - Archaeological Treasure Discovery (Easier)"
  description: "Three agents work together to explore ancient ruins and defeat one guardian creature with enhanced starting resources"

objectives:
  primary: "Successfully explore ancient ruins and defeat the Golden Golem guardian"

relevant_game_context: |
  This is a cooperative multi-agent archaeological expedition with reduced difficulty.

  STARTING ADVANTAGE:
  - Higher skill levels for more effective combat
  - More consumables (healthpotion, manapotion) for survival
  - Only need to defeat Golden Golem (Level 0) - easier target
  - Big Baby Spooder (Level 45) NOT required
  - Pre-positioned closer to ruins for faster engagement

  OBJECTIVE: Explore ancient ruins and defeat the Golden Golem guardian.

  MISSION REQUIREMENTS:
  - Navigate to Ancient Ruins region (Region 7-6: coordinates 769-784, 657-676)
  - Defeat Golden Golem (Level 0) guardian creature
  - Explore ruins architecture and locate treasure chambers
  - Recover ancient artifacts from ruins

  TEAM COORDINATION:
  - Use global chat to share guardian positions
  - Coordinate combat focus on Golden Golem only
  - Share combat responsibilities and healing support

  DO NOT use complete() until Golden Golem is defeated!

  ANCIENT RUINS COMBAT:
  🥇 Combat - Golden Golem:
    - Use observe_environment to locate Golden Golem at coordinates (784, 676)
    - Despite Level 0, may have special defensive properties
    - Coordinate physical attacks and magic to test weaknesses
    - Single target makes coordination easier

max_action_steps: 22

