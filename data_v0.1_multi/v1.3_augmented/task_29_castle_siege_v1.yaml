  description: "Three agents work together with enhanced equipment to defeat the Ice Knight fortress commander"

objectives:
  primary: "Successfully defeat Ice Knight commander with enhanced combat capabilities"

relevant_game_context: |
  This is a cooperative multi-agent siege warfare mission with reduced difficulty.

  STARTING ADVANTAGE:
  - Higher skill levels for elite combat
  - More consumables (healthpotion, manapotion) for sustained fighting
  - Pre-positioned close to fortress for quick engagement
  - Enhanced armor provides better protection
  - Focus only on Ice Knight - no additional fortress objectives

  OBJECTIVE: Defeat the Ice Knight fortress commander.

  MISSION REQUIREMENTS:
  - Navigate to Ice Knight at coordinates (712, 717)
  - Defeat Ice Knight (Level 62) in coordinated combat
  - Keep all team members alive through the encounter

  TEAM COORDINATION:
  - Use global chat to coordinate attack timing
  - Focus all three agents on Ice Knight
  - Rotate healing responsibilities during extended combat

  DO NOT use complete() until Ice Knight is defeated!

  SIEGE COMBAT:
  ⚔️ Ice Knight (Level 62) at (712, 717):
    - Elite fortress commander
    - Heavy armor and ice-based attacks
    - Coordinate flanking and magical attacks
    - High level but manageable with enhanced stats

