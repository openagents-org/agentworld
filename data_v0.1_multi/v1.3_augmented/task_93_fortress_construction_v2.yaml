# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_93_fortress_construction.yaml

task:
  name: "Fortress Construction - Full Arsenal (Harder)"
  description: "Ten agents gather materials and craft full arsenal"

objectives:
  primary: "Collect 12x logs, 12x ironore, 10x coal, and craft 4x Heavy Sword and 4x Axe"

relevant_game_context: |
  This is a cooperative multi-agent construction scenario with maximum difficulty.

  CHALLENGE MODE:
  - Doubled weapon production
  - Increased material requirements
  - Lower skill levels
  - Fewer consumables

  PRODUCTION TARGETS (DOUBLED):
  - 12x logs (from forest)
  - 12x ironore (from mountain)
  - 10x coal (from mountain)
  - 4x Heavy Sword (2x ironbar + hilt2 each)
  - 4x Axe (3x ironbar + logs each)

  MATERIALS NEEDED:
  - 8x ironbar for swords
  - 12x ironbar for axes

  DO NOT use complete() until all objectives are met!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 70

