  This is a cooperative multi-agent survey scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - forest_logger1_agent has 2x logs pre-gathered
  - mountain_miner1_agent has 2x ironore pre-gathered
  - ice_logger1_agent has 2x icelogs pre-gathered
  - Higher skill levels
  - Reduced targets

  PRODUCTION TARGETS (REDUCED):
  - 4x logs (from forest) - 2 already gathered!
  - 4x ironore (from mountain) - 2 already gathered!
  - 3x icelogs (from ice region) - 2 already gathered!
  - 2x rawshrimp (from coast)

  LOCATIONS:
  - Forest: Around (388, 10)
  - Mountain: Around (230, 40)
  - Ice Region: Around (259, 151)
  - Coast: Around (580, 750)

  DO NOT use complete() until all objectives are met!

