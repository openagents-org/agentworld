  name: "Elemental Bosses - Five Boss Gauntlet (Harder)"
  description: "Ten agents defeat five elemental bosses across regions"

objectives:
  primary: "Defeat the Ice Wizard, Dark Ogre, two Mermaids, and Ogre Chieftain"

relevant_game_context: |
  This is a cooperative multi-agent boss combat with maximum difficulty.

  CHALLENGE MODE:
  - FIVE bosses to defeat
  - Lower combat stats
  - Fewer consumables
  - Must split forces across regions

  TARGET BOSSES (EXPANDED):
  - Ice Wizard (Level 35): Located at ice region (259, 151)
  - Dark Ogre (Level 25): Located at mountain region (238, 48)
  - Mermaid (Level 36): Located at coastal region (197, 633)
  - Mermaid (Level 36): Located at ocean region (580, 755)
  - Ogre Chieftain (Level 35): Located at (300, 650)

  COMBAT STRATEGY:
  - Split into squads for each boss
  - Coordinate healing and attacks
  - Manage limited resources

  DO NOT use complete() until ALL bosses are defeated!

max_action_steps: 75

