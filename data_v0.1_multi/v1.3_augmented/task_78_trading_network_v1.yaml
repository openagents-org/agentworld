# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_78_trading_network.yaml

task:
  name: "Trading Network - Quick Trade (Easier)"
  description: "Ten agents gather resources and craft jewelry with pre-gathered materials"

objectives:
  primary: "Collect 5x logs, 4x ironore, 3x goldnugget, and craft 1x Golden Ring"

relevant_game_context: |
  This is a cooperative multi-agent resource gathering with reduced difficulty.

  STARTING ADVANTAGE:
  - logger1_agent has 3x logs pre-gathered
  - smelter_agent has 5x coal and 2x goldbar ready
  - Higher skill levels for faster gathering
  - Reduced targets and simplified crafting

  COLLECTION TARGETS (REDUCED):
  - 5x logs (from forest) - 3 already gathered!
  - 4x ironore (from mountain)
  - 3x goldnugget (from mountain)

  PRODUCTION TARGET:
  - 1x Golden Ring (2x goldbar) - goldbar ready!

  DO NOT use complete() until all objectives are met!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 20

