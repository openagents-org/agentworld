# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_69_legendary_equipment_forge.yaml

task:
  name: "Legendary Equipment Forge - Simplified Collection (Easier)"
  description: "Nine master craftsmen create legendary equipment with pre-gathered materials"

objectives:
  primary: "Forge 3x golden items, 2x magical staffs, and 3x elite weapons"

relevant_game_context: |
  This is a cooperative multi-agent legendary crafting with reduced difficulty.

  STARTING ADVANTAGE:
  - Master_Smelter_Supreme has 35x goldbar and 15x stick ready
  - Iron_Specialist has 10x ironbar ready
  - Component_Master has 5x logs, 8x string, 3x hilt2
  - Arcane_Bead_Hunter has 4x bead ready
  - Higher skill levels for guaranteed crafting
  - Reduced targets: fewer items needed

  PRODUCTION TARGETS (REDUCED):
  - 3x Golden Items (Golden Sword, Golden Boots, 1x Gold Ring)
  - 2x Magic Staffs (5x stick + 1x bead each)
  - 3x Elite Weapons (1x Heavy Sword, 1x Pickaxe, 1x Axe)

  TEAM COORDINATION:
  - Most materials are pre-gathered
  - Smelter already has bars
  - Focus on crafting coordination

  DO NOT use complete() until objectives are met!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 50

