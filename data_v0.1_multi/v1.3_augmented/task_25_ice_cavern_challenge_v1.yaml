task:
  name: "Ice Cavern Challenge - Frozen Tundra Survival (Easier)"
  description: "Three agents work together with pre-gathered Ice Oak logs to defeat one Ice Guardian"

objectives:
  primary: "Successfully defeat one Ice Wizard and gather Ice Oak lumber with pre-gathered starting materials"

relevant_game_context: |
  This is a cooperative multi-agent cold-weather survival expedition with reduced difficulty.

  STARTING ADVANTAGE:
  - frost_lumberjack_agent starts with 2x iceoaklogs already harvested
  - Higher skill levels for more effective combat
  - More consumables for freezing damage survival
  - Only need to defeat ONE Ice Wizard (not two)
  - Pre-positioned closer to targets

  OBJECTIVE: Defeat one Ice Wizard and secure Ice Oak lumber.

  MISSION REQUIREMENTS:
  - Navigate to Frozen/Ice region (coordinates 228-260, 151-156)
  - Defeat ONE Ice Wizard in coordinated combat
  - Already have Ice Oak logs - just verify collection
  - Survive freezing environmental damage

  TEAM COORDINATION:
  - Use global chat to coordinate single enemy engagement
  - Focus fire on one Ice Wizard at (259, 151)
  - Share warming items and healing support

  DO NOT use complete() until Ice Wizard is defeated!

  ICE CAVERN SURVIVAL & COMBAT:
  ❄️ Combat - Ice Wizard:
    - Target Ice Wizard at (259, 151)
    - Ice-based magical enemy
    - Use fire-based weapons for elemental advantage
    - Single target makes coordination manageable

  🔥 Cold Weather Survival:
    - Maintain high health levels to counter freezing damage
    - Use fire-based equipment for warmth

max_action_steps: 22

