# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_100_resource_survey.yaml

task:
  name: "Resource Survey - Continental Expedition (Harder)"
  description: "Ten agents gather massive resources from multiple biomes"

objectives:
  primary: "Collect 14x logs, 14x ironore, 10x icelogs, and 8x rawshrimp from different regions"

relevant_game_context: |
  This is a cooperative multi-agent survey scenario with maximum difficulty.

  CHALLENGE MODE:
  - Doubled resource targets across all biomes
  - Lower skill levels
  - Fewer consumables
  - Must coordinate across four regions

  PRODUCTION TARGETS (DOUBLED):
  - 14x logs (from forest)
  - 14x ironore (from mountain)
  - 10x icelogs (from ice region)
  - 8x rawshrimp (from coast)

  LOCATIONS:
  - Forest: Around (388, 10)
  - Mountain: Around (230, 40)
  - Ice Region: Around (259, 151)
  - Coast: Around (580, 750)

  TEAM ROLES:
  - Forest Team: Harvest logs
  - Mountain Team: Mine iron ore
  - Ice Team: Harvest ice logs
  - Coastal Team: Fish shrimp

  DO NOT use complete() until all objectives are met!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 70

