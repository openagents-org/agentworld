task:
  name: "Harbor Defense - Triple Threat (Harder)"
  description: "Ten agents defeat three coastal bosses and craft multiple bows"

objectives:
  primary: "Defeat Water Guardian, Mermaid, and Ogre Guardian, then craft 4x Wooden Bow"

relevant_game_context: |
  This is a cooperative multi-agent coastal defense with maximum difficulty.

  CHALLENGE MODE:
  - THREE bosses to defeat
  - Must craft 4 bows from scratch
  - Lower combat stats
  - Fewer consumables
  - Must gather materials

  TARGET BOSSES (EXPANDED):
  - Water Guardian: Located at (197, 633)
  - Mermaid: Located at (580, 755)
  - Ogre Guardian: Located at (291, 644)

  PRODUCTION TARGETS (DOUBLED):
  - 4x Wooden Bow (1x logs + 1x string each)

  DO NOT use complete() until ALL bosses are defeated and bows are crafted!

max_action_steps: 75

