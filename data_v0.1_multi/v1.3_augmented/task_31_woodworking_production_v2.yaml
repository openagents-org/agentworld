# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets, added 4th agent
# SOURCE: task_31_woodworking_production.yaml

task:
  name: "Woodworking Production - Bow and Arrow Workshop (Harder)"
  description: "Four agents work together to harvest lumber and produce extensive archery equipment"

objectives:
  primary: "Harvest 10x logs, craft 2x Wooden Bows, and produce 30x Arrows through coordinated woodworking"

relevant_game_context: |
  This is a cooperative multi-agent crafting scenario with increased difficulty.

  CHALLENGE MODE:
  - Increased targets: 10x logs, 2x bows, 30x arrows
  - No pre-gathered materials
  - Added 4th agent (apprentice_agent) for additional help
  - Reduced consumables - manage resources carefully

  PRODUCTION TARGETS:
  - Harvest 10x logs from Oak trees
  - Craft 2x Wooden Bows (need 2x logs + 2x string)
  - Craft 30x Arrows (need 30x stick + 30x feather)
  - Need at least 10 logs total for all production

  CRAFTING RECIPES:
  - Fletching: 1x logs → 4x stick
  - Fletching: 1x logs + 1x string → 1x Wooden Bow
  - Fletching: 10x stick + 10x feather → 10x Arrow

  DO NOT use complete() until all items are crafted!

max_action_steps: 42

