# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_49_jewelry_workshop.yaml

task:
  name: "Jewelry Workshop - Ring Collection (Easier)"
  description: "Five agents craft 1x Gold Ring and 1x Silver Ring with pre-smelted bars"

objectives:
  primary: "Craft 1x Gold Ring and 1x Silver Ring using pre-prepared materials"

relevant_game_context: |
  This is a cooperative multi-agent jewelry crafting scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - smelter_agent starts with 2x goldbar already smelted
  - jeweler_agent starts with 2x ironbar already smelted
  - Higher skill levels for guaranteed success
  - Only need 1 of each ring type

  PRODUCTION TARGETS (REDUCED):
  - 1x Gold Ring (2x goldbar) - bars provided!
  - 1x Silver Ring (2x ironbar) - bars provided!

  MATERIAL AVAILABILITY:
  - 2x goldbar ready for gold ring
  - 2x ironbar ready for silver ring
  - No mining required!

  TEAM COORDINATION:
  - Jeweler crafts both rings
  - Other agents can mine for extras if desired

  DO NOT use complete() until both rings are crafted!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 18

