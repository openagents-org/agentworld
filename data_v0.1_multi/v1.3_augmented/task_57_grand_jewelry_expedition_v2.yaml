# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_57_grand_jewelry_expedition.yaml

task:
  name: "Grand Jewelry Expedition (Harder)"
  description: "Eight agents mine gemstones and craft expanded jewelry collection"

objectives:
  primary: "Craft 4x Ruby Rings, 4x Emerald Pendants, 2x Topaz Rings, and 4x Beryl Pendants"

relevant_game_context: |
  This is a cooperative multi-agent jewelry expedition with increased difficulty.

  CHALLENGE MODE:
  - Doubled all targets
  - Must mine all gemstones from scratch
  - Need 4 rubies, 4 emeralds, 2 topaz, 4 beryl
  - Need 12 gold nuggets for 6 gold rings
  - Lower skill levels require more mining attempts
  - Reduced consumables

  PRODUCTION TARGETS (DOUBLED):
  - 4x Ruby Ring (4 ruby + 4 goldring)
  - 4x Emerald Pendant (4 emerald + 4 string)
  - 2x Topaz Ring (2 topaz + 2 goldring)
  - 4x Beryl Pendant (4 beryl + 4 string)

  GEMSTONE MINING:
  - Ruby: Mining level 62 required
  - Emerald: Mining level 57 required
  - Topaz: Mining level 15 required
  - Beryl: Mining level 1 required

  SMELTING CHAIN:
  - Mine 12 gold nuggets + 12 coal
  - Smelt 12 gold bars
  - Craft 6 gold rings

  DO NOT use complete() until ALL jewelry is crafted!

max_action_steps: 70

