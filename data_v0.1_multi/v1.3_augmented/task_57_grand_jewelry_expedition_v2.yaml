# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_57_grand_jewelry_expedition.yaml

task:
  name: "Grand Jewelry Expedition (Harder)"
  description: "Eight agents mine gemstones and craft expanded jewelry collection"

objectives:
  primary: "Craft 3x Gold Rings and 4x Beryl Pendants with gathered materials"

relevant_game_context: |
  This is a cooperative multi-agent jewelry expedition with increased difficulty.

  CHALLENGE MODE:
  - Increased targets
  - Need 6 goldbar for 3 gold rings
  - Need 4 beryl + 4 string for pendants
  - Lower skill levels require more coordination
  - Reduced consumables

  PRODUCTION TARGETS (INCREASED):
  - 3x Gold Ring (6x goldbar total)
  - 4x Beryl Pendant (4 beryl + 4 string)

  MATERIALS PROVIDED:
  - Jeweler_Rings: 6 goldbar (for gold rings)
  - Coal_Miner: 4 beryl, 8 string
  - Jeweler_Pendants: will craft pendants

  DO NOT use complete() until ALL jewelry is crafted!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 70

