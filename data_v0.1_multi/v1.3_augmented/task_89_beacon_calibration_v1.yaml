  This is a cooperative multi-agent crafting scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - logger1_agent has 3x logs pre-gathered
  - icelogger1_agent has 3x icelogs pre-gathered
  - crafter1_agent has beryl ready
  - Only 1 item to craft (no lightning staff)
  - Higher skill levels

  PRODUCTION TARGETS (REDUCED):
  - 5x logs (from forest) - 3 already gathered!
  - 4x icelogs (from ice region) - 3 already gathered!
  - 1x Beryl Pendant (beryl + string)

  TEAM ROLES:
  - Forest Loggers: Harvest logs
  - Ice Loggers: Harvest ice logs
  - Crafter: Make pendant

  DO NOT use complete() until all objectives are met!

