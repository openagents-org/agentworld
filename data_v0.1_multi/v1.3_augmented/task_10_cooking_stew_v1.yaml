# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, easier completion
# SOURCE: task_10_cooking_stew.yaml

task:
  name: "Cooperative Stew Cooking - Culinary Team Production (Easier)"
  description: "Three agents work together to prepare a hearty stew - with pre-crafted bowl and ingredients"

# Task objectives
objectives:
  primary: "Prepare a delicious stew through coordinated ingredient gathering and cooking"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent culinary scenario requiring food preparation expertise.

  STARTING ADVANTAGE:
  - container_crafter_agent already has 1x bowlmedium (pre-crafted!)
  - ingredient_gatherer_agent has 1x mushroom2 and 1x corn (ingredients ready!)
  - chef_agent just needs to receive materials and cook
  - Higher skill levels across all agents

  OBJECTIVE: Prepare a stew with mostly pre-gathered materials.

  SIMPLIFIED STRATEGY:
  - container_crafter_agent transfers bowlmedium to chef_agent
  - ingredient_gatherer_agent transfers mushroom2 and corn to chef_agent
  - chef_agent cooks the stew immediately

  TEAM COORDINATION:
  - Use global chat to coordinate transfers
  - All materials flow to chef_agent for cooking

  DO NOT use complete() until stew is cooked!

  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  🍲 Cooking Recipe - stew2:
    - craft_item skill=Cooking itemKey=stew2
    - Materials: 1x bowlmedium + 1x mushroom2 + 1x corn → 1x stew2
    - Level required: 1 (Cooking skill)
    - chef_agent has Cooking skill level 20!

# Limitations
max_action_steps: 15

