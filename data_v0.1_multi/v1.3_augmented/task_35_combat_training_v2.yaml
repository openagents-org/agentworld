  This is a cooperative multi-agent combat training scenario with increased difficulty.

  CHALLENGE MODE:
  - Increased target: 8x Goblins (doubled!)
  - Added 4th agent (flanker_agent) for additional damage
  - Reduced consumables - manage resources carefully
  - Lower skill levels require better coordination
  - May need to engage multiple goblins at once

  TARGETS (INCREASED):
  - Defeat 8x Goblins (Level 7, 90 HP each)
  - Goblins drop: leather armor, leather boots, plastic bow

  COMBAT TACTICS:
  - Tank agent draws aggro and absorbs damage
  - DPS agents deal damage from flanking positions
  - Flanker agent provides additional melee damage
  - Support provides ranged backup

  DO NOT use complete() until all 8 goblins are defeated!

