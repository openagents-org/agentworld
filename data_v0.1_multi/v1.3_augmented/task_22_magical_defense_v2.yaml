# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets, added 4th agent
# SOURCE: task_22_magical_defense.yaml

task:
  name: "Magical Defense - Lightning Staff Forge & Ice Guardian Battle (Harder)"
  description: "Four agents work together to craft a lightning staff from scratch and defeat BOTH Ice Guardians"

objectives:
  primary: "Craft a Lightning Staff from raw materials and defeat BOTH Ice Guardians in coordinated combat"

relevant_game_context: |
  This is a cooperative multi-agent magical defense scenario with increased difficulty.

  CHALLENGE MODE:
  - Must defeat BOTH Ice Guardians (not just one!)
  - Must gather logs and craft from scratch (no pre-made components)
  - Added 4th agent (support_mage_agent) for additional firepower
  - Reduced consumables - manage resources carefully
  - Lower skill levels require more careful coordination

  OBJECTIVE: Craft a Lightning Staff from raw materials and defeat both Ice Guardians.

  MISSION REQUIREMENTS:
  - Gather logs from Oak trees
  - Craft sticks from logs, then staff from sticks and bead
  - Craft Lightning Staff from staff and lightning bead
  - Defeat BOTH Ice Guardians at (259, 151) and (260, 156)
  - Ensure all team members survive both encounters

  CRAFTING SEQUENCE (FULL CHAIN):
  Step 1: Get Logs (Lumberjacking):
    - harvest_resource on Oak Tree instances to get logs
    - Need at least 2 logs (to craft 8 sticks, need 5 for staff)

  Step 2: Craft Sticks (Fletching):
    - craft_item skill=Fletching itemKey=stick
    - Materials: 1x logs -> 4x stick

  Step 3: Craft Magic Staff (Crafting):
    - craft_item skill=Crafting itemKey=staff
    - Materials: 5x stick + 1x bead -> 1x staff

  Step 4: Craft Lightning Staff (Crafting):
    - craft_item skill=Crafting itemKey=lightningstaff
    - Materials: 1x staff + 1x lightningbead -> 1x lightningstaff

  COMBAT - Ice Guardians (BOTH REQUIRED):
  - Ice Guardian 1: (259, 151) - Level 35
  - Ice Guardian 2: (260, 156) - Level 35
  - Use fire-based attacks for elemental advantage
  - Coordinate all four agents for faster kills

max_action_steps: 50

