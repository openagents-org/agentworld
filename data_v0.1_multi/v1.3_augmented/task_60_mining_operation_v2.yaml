# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_60_mining_operation.yaml

task:
  name: "Mining Operation - Ore Extraction (Harder)"
  description: "Seven miners mine from scratch and craft expanded equipment set"

objectives:
  primary: "Mine ore, smelt 12x ironbar, and craft 2x Pickaxe and 4x Silver Ring"

relevant_game_context: |
  This is a cooperative multi-agent mining scenario with increased difficulty.

  CHALLENGE MODE:
  - Doubled all targets
  - Must mine all ore from scratch
  - Need 18x ironore and 18x coal
  - Lower skill levels require more attempts
  - Reduced consumables

  PRODUCTION TARGETS (DOUBLED):
  - 18x ironbar (smelted from 18x ironore + 18x coal)
  - 2x Pickaxe (5x ironbar + 1x logs each = 10 bars, 2 logs)
  - 4x Silver Ring (2x ironbar each = 8 bars)
  - Total iron bars needed: 18

  TOTAL MATERIALS NEEDED:
  - 18x iron ore
  - 18x coal
  - 2x logs

  TEAM ROLES:
  - Iron Miners: Extract 18+ iron ore
  - Coal Miners: Mine 18+ coal
  - Lumberjack: Gather 2 logs
  - Smelter: Smelt all ore to bars
  - Smith: Craft all items

  DO NOT use complete() until ALL items are crafted!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 70

