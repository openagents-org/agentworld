# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets, added 4th agent
# SOURCE: task_39_farming_harvest.yaml

task:
  name: "Farming Harvest - Crop Collection (Harder)"
  description: "Four agents work together to harvest extensive crops from farming areas"

objectives:
  primary: "Harvest 8x corn, 8x tomato, 6x peach, and 4x blueberry from farming regions"

relevant_game_context: |
  This is a cooperative multi-agent farming scenario with increased difficulty.

  CHALLENGE MODE:
  - Increased targets: 8x corn, 8x tomato, 6x peach
  - Added new crop: 4x blueberry
  - No pre-gathered materials
  - Added 4th agent (harvest_helper) for wider coverage
  - Reduced consumables - manage resources carefully

  HARVEST TARGETS (INCREASED):
  - 8x corn (Level 5 foraging)
  - 8x tomato (Level 15 foraging)
  - 6x peach (Level 5 foraging)
  - 4x blueberry (Level 1 foraging) - NEW!

  CROP LOCATIONS:
  - Corn: Farm areas and plains
  - Tomato: Garden areas
  - Peach: Orchard areas near forests
  - Blueberry: Forest edges and clearings

  DO NOT use complete() until all crops are harvested!

max_action_steps: 42

