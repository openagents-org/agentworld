# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets, easier completion
# SOURCE: task_16_resource_protection.yaml

task:
  name: "Resource Protection Mission - Guardian Team Defense (Easier)"
  description: "Three agents work together where one guardian protects two collectors - reduced targets"

objectives:
  primary: "Successfully protect collectors while they gather 3x logs and 2x blueberry under combat conditions"

relevant_game_context: |
  This is a cooperative multi-agent protection scenario requiring tactical coordination.

  STARTING ADVANTAGE:
  - Reduced targets: only 3x logs and 2x blueberry (easier than 5+3)
  - guardian_agent has extra arrows (70)
  - Higher skill levels for better combat performance
  - collectors start with some resources pre-gathered

  OBJECTIVE: Gather reduced resources while protecting the team.

  MISSION REQUIREMENTS:
  - Collect 3x logs and 2x blueberry (reduced from 5+3)
  - Keep all team members alive throughout the mission
  - Use teamwork to balance resource gathering with security

  DO NOT use complete() until ALL objectives are achieved safely!

  COMBAT & GATHERING:
  🏹 Combat: Use attack on hostile targets
  🪵 Lumberjacking: harvest_resource on oak trees → 3x logs
  🫐 Foraging: harvest_resource on blueberry bushes → 2x blueberry

max_action_steps: 20

