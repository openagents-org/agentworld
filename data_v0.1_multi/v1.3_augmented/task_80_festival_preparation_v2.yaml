# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_80_festival_preparation.yaml

task:
  name: "Festival Preparation - Grand Festival (Harder)"
  description: "Ten agents prepare large quantities of food and prizes"

objectives:
  primary: "Cook 8x Cooked Shrimp, 6x Jellyfish Smoothie, and craft 4x Silver Ring"

relevant_game_context: |
  This is a cooperative multi-agent festival preparation with increased difficulty.

  CHALLENGE MODE:
  - Doubled all production targets
  - Must catch all seafood from scratch
  - Must mine iron for rings
  - Lower skill levels
  - Fewer consumables

  PRODUCTION TARGETS (DOUBLED):
  - 8x Cooked Shrimp (cook 8x rawshrimp, cooking level 1)
  - 6x Jellyfish Smoothie (cook 6x jellyfish, cooking level 10)
  - 4x Silver Ring (2x ironbar each = 8x ironbar, smithing level 1)

  GATHERING REQUIREMENTS:
  - 8x rawshrimp (fishing level 1)
  - 6x jellyfish (fishing level 5)
  - 8x ironbar (must mine and smelt)

  DO NOT use complete() until ALL items are ready!

max_action_steps: 70

