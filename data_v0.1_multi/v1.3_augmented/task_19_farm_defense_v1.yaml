  This is a cooperative multi-agent agricultural protection scenario.

  STARTING ADVANTAGE:
  - Reduced targets: 5x corn and 2x tomato (easier than 8+4)
  - corn_harvester_agent starts with 2x corn
  - tomato_gatherer_agent starts with 1x tomato
