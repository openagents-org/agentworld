# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_34_enchanted_staff_workshop.yaml

task:
  name: "Magic Staff Workshop - Staff Creation (Easier)"
  description: "Three agents work together to craft a Magic Staff from components"

objectives:
  primary: "Craft 1x Magic Staff from sticks and bead"

relevant_game_context: |
  This is a cooperative multi-agent magical crafting scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - Materials distributed across agents
  - lumberjack_agent has 3x stick
  - crafter_agent has 2x stick
  - enchanter_agent has 1x bead
  - Higher skill levels for guaranteed success

  CRAFTING CHAIN:
  - Magic Staff (5x stick + 1x bead → 1x staff)

  MATERIAL SOURCES:
  - Sticks: Split between lumberjack_agent and crafter_agent
  - Bead: In enchanter_agent inventory

  DO NOT use complete() until Magic Staff is crafted!

max_action_steps: 15

agent_1:
  username: "lumberjack_agent"
  new_character: true

  location:
    x: 388
    y: 10

  skill_levels:
    lumberjacking: 32
    strength: 30
    health: 38

  inventory_items:
    - item: "flask"
      count: 20
    - item: "apple"
      count: 25
    - item: "stick"
      count: 3

  equipped_items:
    - item: "axe"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0

