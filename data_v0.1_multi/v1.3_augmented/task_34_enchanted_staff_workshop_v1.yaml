task:
  name: "Enchanted Staff Workshop - Lightning Staff Creation (Easier)"
  description: "Three agents work together with pre-crafted materials to assemble a Lightning Staff"

objectives:
  primary: "Craft 1x Lightning Staff using pre-crafted staff base"

relevant_game_context: |
  This is a cooperative multi-agent magical crafting scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - crafter_agent starts with 1x staff already crafted!
  - Only need to upgrade staff → lightning staff
  - Higher skill levels for guaranteed success
  - No log gathering required

  CRAFTING CHAIN (SIMPLIFIED):
  - Upgrade to Lightning Staff (1x staff + 1x lightningbead → 1x lightningstaff)
  - Staff is already provided - just need the final upgrade

  MATERIAL SOURCES:
  - Staff: Already in crafter_agent inventory
  - Lightning Bead: Provided in enchanter_agent inventory

  DO NOT use complete() until Lightning Staff is crafted!

max_action_steps: 15

