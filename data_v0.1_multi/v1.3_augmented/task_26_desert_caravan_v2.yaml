# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets, added 4th agent
# SOURCE: task_26_desert_caravan.yaml

task:
  name: "Desert Caravan Expedition - Resource Gathering and Team Exchange (Harder)"
  description: "Four agents work together to gather desert resources, defeat multiple desert creatures, and complete extensive resource exchanges"

objectives:
  primary: "Successfully gather desert resources through mining and combat, defeat multiple desert creatures, and complete at least 5 resource exchanges"

relevant_game_context: |
  This is a cooperative multi-agent desert expedition with increased difficulty.

  CHALLENGE MODE:
  - Must defeat at least 3 desert creatures (cactus, scorpion, vulture)
  - Must mine at least 2 different ore deposits
  - Must complete at least 5 resource transfers between agents
  - Added 4th agent (desert_scout_agent) for wider coverage
  - Reduced consumables - manage resources carefully
  - Starting further from desert requires longer travel

  OBJECTIVE: Complete full desert expedition with combat, mining, and extensive resource sharing.

  MISSION REQUIREMENTS:
  - Navigate to Southern Desert region (Y > 600)
  - Defeat at least 3 desert creatures
  - Mine at least 2 rock/ore deposits
  - Complete at least 5 transfer_items operations
  - Coordinate extensively via chat (at least 5 times)

  TEAM COORDINATION:
  - Use chat to coordinate combat and mining
  - Share gathered resources between all four agents
  - Coordinate who fights which creatures
  - Plan efficient routes through the desert

  DO NOT use complete() until ALL objectives achieved!

  DESERT CHALLENGES:
  🌵 Desert Creatures:
    - Cactus (level 16): Always aggressive
    - Desert Scorpion (level 24): Medium difficulty
    - Scorpion (level 38): Harder target
    - Vulture (level 25): Drops feathers
    - Must defeat 3+ creatures total

  ⛏️ Mining Operations:
    - Mine Gold ore (level 25), Pythar ore (level 15)
    - Need 2+ successful mining operations

max_action_steps: 65

