# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_67_resource_caravan.yaml

task:
  name: "Resource Caravan - Extended Expedition (Harder)"
  description: "Eight traders gather large quantities of resources across regions"

objectives:
  primary: "Collect 12x logs, 10x coal, and craft 2x Pickaxe and 1x Axe"

relevant_game_context: |
  This is a cooperative multi-agent resource gathering with increased difficulty.

  CHALLENGE MODE:
  - Doubled log target: 12 logs
  - Doubled coal target: 10 coal
  - Must craft 2x pickaxe AND 1x axe
  - Must mine iron for crafting (no pre-gathered bars)
  - Lower skill levels
  - Reduced consumables

  PRODUCTION TARGETS (DOUBLED):
  - 12x logs (from forest)
  - 10x coal (from mountain)
  - 2x Pickaxe (5x ironbar + 1x logs each = 10 ironbar, 2 logs)
  - 1x Axe (3x ironbar + 1x logs)

  MATERIAL REQUIREMENTS:
  - 13x ironore + 13x coal → 13x ironbar (for tools)
  - Total coal needed: 10 (objective) + 13 (smelting) = 23 coal
  - 15x logs total (12 objective + 3 for tool handles)

  DO NOT use complete() until ALL objectives are met!

max_action_steps: 65

