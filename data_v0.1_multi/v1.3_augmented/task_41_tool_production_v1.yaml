# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_41_tool_production.yaml

task:
  name: "Tool Production - Pickaxe and Axe Crafting (Easier)"
  description: "Three agents work together with pre-gathered materials to craft tools"

objectives:
  primary: "Craft 1x Pickaxe using pre-gathered iron bars and logs"

relevant_game_context: |
  This is a cooperative multi-agent tool crafting scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - smith_agent starts with 5x ironbar already smelted
  - lumberjack_agent starts with 2x logs already gathered
  - Higher skill levels for guaranteed success
  - Only need to craft 1x Pickaxe (no Axe required)

  PRODUCTION CHAIN (SIMPLIFIED):
  - Craft 1x pickaxe (5x ironbar + 1x logs)
  - All materials already provided!

  TEAM COORDINATION:
  - Transfer logs to smith
  - Smith crafts pickaxe

  DO NOT use complete() until pickaxe is crafted!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 15

