# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_56_cross_region_trading_network.yaml

task:
  name: "Cross-Region Trading Network (Harder)"
  description: "Seven agents mine from scratch and craft expanded equipment set"

objectives:
  primary: "Craft 6x Silver Rings, 4x Axes, and 2x Heavy Swords through full production chain"

relevant_game_context: |
  This is a cooperative multi-agent trading scenario with increased difficulty.

  CHALLENGE MODE:
  - Doubled all crafting targets
  - Must mine all ore from scratch
  - Need 28+ ironbar total
  - Lower skill levels require better coordination
  - Reduced consumables

  CRAFTING TARGETS (DOUBLED):
  - 6x Silver Rings: 12 ironbar (Smithing L1)
  - 4x Axes: 12 ironbar + 4 logs (Smithing L3)
  - 2x Heavy Swords: 4 ironbar + 2 hilt2 (Smithing L1)
  - TOTAL NEEDED: 28 ironbar, 4 logs, 2 hilt2

  PHASE OUTLINE:
  1. R1-20: Gather resources from all biomes
  2. R21-40: Travel to hub and transfer materials
  3. R41-55: Smelt bars and craft all items
  4. R56-65: Verify completion

  BIOME COVERAGE:
  - Forest team gathers 6+ logs
  - Mountain team mines 28+ ironore + 28+ coal
  - All teams coordinate via chat

  DO NOT use complete() until ALL items are crafted!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 65

