# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_46_mining_expedition.yaml

task:
  name: "Mining Expedition - Iron Equipment Production (Easier)"
  description: "Five agents with pre-gathered materials craft simplified equipment"

objectives:
  primary: "Craft 1x Pickaxe using pre-smelted iron bars and gathered logs"

relevant_game_context: |
  This is a cooperative multi-agent mining scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - smelter_agent starts with 6x ironbar already smelted
  - lumberjack_agent starts with 2x logs already gathered
  - smith_agent has hilt2 for optional heavy sword
  - Higher skill levels for guaranteed success
  - Only need to craft 1x Pickaxe (other equipment optional)

  PRODUCTION TARGETS (REDUCED):
  - 1x Pickaxe (5x ironbar + 1x logs) - materials provided!

  OPTIONAL BONUS:
  - Can craft axe with remaining materials
  - Can craft heavy sword if desired

  TEAM COORDINATION:
  - Materials already prepared
  - Smith just needs to craft
  - Other agents can assist or explore

  DO NOT use complete() until pickaxe is crafted!

max_action_steps: 20

