  primary: "Defeat Ancient Wizard at (163, 339) and Desert Warrior at (330, 480), cook 8x Cooked Shrimp, and craft 4x Heavy Sword and 4x Gold Ring"

relevant_game_context: |
  This is a cooperative multi-agent festival preparation with maximum difficulty.

  CHALLENGE MODE:
  - TWO bosses to defeat
  - Quadrupled crafting targets
  - Lower skill levels
  - Fewer consumables

  COMBAT TARGETS:
  - Ancient Wizard (Level 10) at (163, 339)
  - Desert Warrior (Level 20) at (330, 480)

  PRODUCTION TARGETS (DOUBLED):
  - 8x Cooked Shrimp (from cooking)
  - 4x Heavy Sword (2x ironbar + hilt2 each)
  - 4x Gold Ring (2x goldbar each)

  MATERIALS NEEDED:
  - 8x ironbar for swords
  - 8x goldbar for rings

  DO NOT use complete() until all objectives are met!

