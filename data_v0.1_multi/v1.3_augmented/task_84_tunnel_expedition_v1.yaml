# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_84_tunnel_expedition.yaml

task:
  name: "Tunnel Expedition - Quick Run (Easier)"
  description: "Ten agents explore tunnels and complete simplified objectives"

objectives:
  primary: "Mine 5x ironore, 4x coal, defeat 1x Skeleton, and craft 1x Pickaxe"

relevant_game_context: |
  This is a cooperative multi-agent exploration with reduced difficulty.

  STARTING ADVANTAGE:
  - miner1_agent has 3x ironore pre-gathered
  - miner2_agent has 2x coal pre-gathered
  - Only 1 skeleton to defeat
  - Higher combat and mining stats

  PRODUCTION TARGETS (REDUCED):
  - 5x ironore (from mountain) - 3 already gathered!
  - 4x coal (from mountain) - 2 already gathered!
  - Defeat 1x Skeleton
  - 1x Pickaxe (materials ready)

  TEAM ROLES:
  - Miners: Extract ore and coal
  - Combat Team: Defeat skeleton
  - Crafter: Make pickaxe

  DO NOT use complete() until all objectives are met!

max_action_steps: 22

