# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_82_evacuation.yaml

task:
  name: "Evacuation - Quick Prep (Easier)"
  description: "Ten agents collect resources and craft tools for evacuation"

objectives:
  primary: "Collect 5x logs, 4x ironore, and craft 1x Axe"

relevant_game_context: |
  This is a cooperative multi-agent resource gathering with reduced difficulty.

  STARTING ADVANTAGE:
  - logger1_agent has 3x logs pre-gathered
  - miner1_agent has 2x ironore pre-gathered
  - Only 1 axe to craft (instead of 2)
  - Higher skill levels

  PRODUCTION TARGETS (REDUCED):
  - 5x logs (from forest) - 3 already gathered!
  - 4x ironore (from mountain) - 2 already gathered!
  - 1x Axe (3x ironbar + 1x logs)

  TEAM ROLES:
  - Loggers: Gather logs
  - Miners: Extract iron ore
  - Smith: Craft axe

  DO NOT use complete() until all objectives are met!

max_action_steps: 22

