# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_74_guild_equipment.yaml

task:
  name: "Guild Equipment - Full Arsenal (Harder)"
  description: "Six guild members craft complete equipment set from scratch"

objectives:
  primary: "Craft 4x Heavy Sword, 2x Axe, 2x Wooden Bow, and 4x Silver Ring"

relevant_game_context: |
  This is a cooperative multi-agent crafting with increased difficulty.

  CHALLENGE MODE:
  - Doubled all targets
  - Must mine all ore from scratch
  - Lower skill levels
  - Fewer consumables
  - Need additional materials

  PRODUCTION TARGETS (DOUBLED):
  - 4x Heavy Sword (2x ironbar + 1x hilt2 each = 8x ironbar, 4x hilt2)
  - 2x Axe (3x ironbar + 1x logs each = 6x ironbar, 2x logs)
  - 2x Wooden Bow (1x logs + 1x string each)
  - 4x Silver Ring (2x ironbar each = 8x ironbar)

  TOTAL IRON NEEDED: 22x ironbar
  - Requires 22x ironore + 22x coal

  DO NOT use complete() until ALL equipment is crafted!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 70

