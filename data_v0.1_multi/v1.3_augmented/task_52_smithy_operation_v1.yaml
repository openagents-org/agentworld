# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_52_smithy_operation.yaml

task:
  name: "Smithy Operation - Weapon Production (Easier)"
  description: "Five smiths with pre-smelted bars craft simplified equipment set"

objectives:
  primary: "Craft 1x Heavy Sword and 1x Silver Ring using provided iron bars"

relevant_game_context: |
  This is a cooperative multi-agent smithing scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - smelter_agent starts with 6x ironbar already smelted
  - lumberjack_agent has 2x logs ready
  - Higher skill levels for guaranteed success
  - Reduced targets: Just sword and ring (no pickaxe)

  PRODUCTION TARGETS (REDUCED):
  - 1x Heavy Sword (2x ironbar + 1x hilt2) - bars provided
  - 1x Silver Ring (2x ironbar) - bars provided

  MATERIAL AVAILABILITY:
  - 6x ironbar ready (need 4 for targets)
  - hilt2 provided
  - No mining required!

  TEAM COORDINATION:
  - Smith crafts items using provided materials
  - Other agents can mine for extras if desired

  DO NOT use complete() until items are crafted!

max_action_steps: 18

