# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, must gather and process all materials
# SOURCE: task_04_axe_crafting.yaml

task:
  name: "Cooperative Axe Crafting - Woodcutter Tool Production (Harder)"
  description: "Three agents work together to create TWO axes through complete mining, smelting, and smithing chain"

# Task objectives
objectives:
  primary: "Create TWO axes through coordinated mining, smelting, and smithing from scratch"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent tool crafting scenario requiring mining and smithing skills.

  CHALLENGE MODE:
  - Must create TWO axes (doubled target!)
  - smith_agent starts with NO ironbar - full chain required
  - Must harvest logs AND smelt iron from scratch
  - Reduced consumables - manage resources carefully

  OBJECTIVE: Work together to create 2x axes through complete production chain.

  REQUIRED MATERIALS FOR 2 AXES:
  - 6x ironbar (3 per axe)
  - 2x logs (1 per axe)
  - Must smelt all ironbar from ore + coal

  TEAM COORDINATION NOTES:
  - Full production chain: mine ore → smelt bars → forge axes
  - miner_agent and lumberjack_agent have raw ore/coal materials
  - smith_agent has smithing skill 22 (needed for smelting level 20)
  - Transfer ore/coal to smith_agent for smelting, or smith_agent can smelt after receiving materials
  - lumberjack_agent gathers logs from Oak Trees

  DO NOT use complete() until 2x axes are created!

  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  ⛏️ Mining - iron ore:
    - harvest_resource on iron rock instances to get ironore
    - Level required: 10+ (Mining skill)

  🔥 Smelting Recipe - ironbar:
    - craft_item skill=Smelting itemKey=ironbar
    - Materials: 1x ironore + 1x coal → 1x ironbar
    - Level required: 20 (uses Smithing skill level)

  🪓 Smithing Recipe - axe:
    - craft_item skill=Smithing itemKey=axe
    - Materials: 3x ironbar + 1x logs → 1x axe
    - Level required: 1 (Smithing skill)
    - Need to craft TWICE!

# Limitations
max_action_steps: 40

