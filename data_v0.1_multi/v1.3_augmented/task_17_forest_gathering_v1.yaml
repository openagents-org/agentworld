# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_17_forest_gathering.yaml

task:
  name: "Forest Gathering Mission - Wilderness Team Protection (Easier)"
  description: "Three agents work together to gather forest resources - reduced targets with pre-gathered materials"

objectives:
  primary: "Successfully protect collectors while they gather 2x palmlogs and 3x peach under wildlife threat conditions"

relevant_game_context: |
  This is a cooperative multi-agent forest protection scenario.

  STARTING ADVANTAGE:
  - Reduced targets: 2x palmlogs and 3x peach (easier than 4+5)
  - palm_logger_agent starts with 1x palmlogs
  - peach_forager_agent starts with 1x peach
  - Higher skill levels and more arrows

  OBJECTIVE: Gather reduced forest resources while protecting the team.

  MISSION REQUIREMENTS:
  - Collect 2x palmlogs and 3x peach (reduced targets)
  - Keep all team members alive throughout the mission

  DO NOT use complete() until ALL objectives are achieved safely!

