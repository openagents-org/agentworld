# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets, added 4th agent
# SOURCE: task_27_volcanic_forge.yaml

task:
  name: "Southern Desert Expedition - Mining and Combat (Harder)"
  description: "Four agents work together to mine multiple high-level ores and defeat BOTH minibosses"

objectives:
  primary: "Successfully mine 4+ high-level ores and defeat BOTH Water Guardian AND Ogre Guardian"

relevant_game_context: |
  This is a cooperative multi-agent expedition with increased difficulty.

  CHALLENGE MODE:
  - Must defeat BOTH minibosses (Water Guardian + Ogre Guardian)
  - Must mine at least 4 high-level ores from scratch
  - Added 4th agent (expedition_support_agent) for additional firepower
  - Reduced consumables - manage resources carefully
  - Lower skill levels require careful coordination

  OBJECTIVE: Complete full desert expedition - mine ores and defeat both minibosses.

  MISSION REQUIREMENTS:
  - Mine at least 4 high-level ores (gold, ibo, taaffeite, moonrock, or lapis lazuli)
  - Defeat Water Guardian (Level 36) at (197, 633)
  - Defeat Ogre Guardian (Level 32) at (291, 644)
  - Collect equipment drops from both bosses

  TEAM COORDINATION:
  - Coordinate between mining and combat operations
  - May need to split tasks between miners and fighters
  - Share healing items between encounters

  DO NOT use complete() until BOTH bosses defeated and 4+ ores collected!

  COMBAT & MINING:
  ⚔️ Water Guardian (Level 36) at (197, 633):
    - Drops: redguardarmor, ring1, scimitar, watermelonbow
    - Higher level - requires coordination

  ⚔️ Ogre Guardian (Level 32) at (291, 644):
    - 120 experience bonus
    - Slightly easier than Water Guardian

  ⛏️ Mining Targets:
    - Gold (25), Ibo (30), Taaffeite (30), Moonrock (40), Lapis (45)
    - Need 4+ total ores mined

max_action_steps: 50

