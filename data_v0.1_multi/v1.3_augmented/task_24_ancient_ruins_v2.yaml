# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets, added 4th agent
# SOURCE: task_24_ancient_ruins.yaml

task:
  name: "Ancient Ruins Exploration - Archaeological Treasure Discovery (Harder)"
  description: "Four agents work together to explore ancient ruins, defeat BOTH guardian creatures, and recover multiple artifacts"

objectives:
  primary: "Successfully defeat BOTH Golden Golem AND Giant Spider, plus explore all treasure chambers"

relevant_game_context: |
  This is a cooperative multi-agent archaeological expedition with increased difficulty.

  CHALLENGE MODE:
  - Must defeat BOTH guardians: Golden Golem AND Giant Spider
  - Added 4th agent (relic_scout_agent) for additional firepower
  - Reduced consumables - manage resources carefully
  - Lower skill levels require precise coordination
  - Must explore ALL treasure chambers in the ruins

  OBJECTIVE: Complete full archaeological expedition - defeat both guardians and explore all areas.

  MISSION REQUIREMENTS:
  - Navigate to Ancient Ruins region (coordinates 769-784, 657-676)
  - Defeat Golden Golem (Level 38) at (784, 676)
  - Defeat Giant Spider (Level 25) at (769, 657)
  - Explore all ruins architecture and locate hidden treasure chambers
  - Recover multiple ancient artifacts from ruins

  TEAM COORDINATION:
  - Use global chat to coordinate dual guardian engagement
  - May need to defeat guardians sequentially for survival
  - Share combat responsibilities carefully between agents

  DO NOT use complete() until BOTH guardians are defeated!

  COMBAT KNOWLEDGE:
  🥇 Golden Golem (Level 38) at (784, 676):
    - May have special defensive properties
    - Coordinate attacks to test weaknesses

  🕷️ Giant Spider (Level 25) at (769, 657):
    - Web attacks and poison damage
    - Use ranged attacks and positioning

max_action_steps: 50

