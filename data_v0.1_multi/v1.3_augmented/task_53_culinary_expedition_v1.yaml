# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_53_culinary_expedition.yaml

task:
  name: "Culinary Expedition - Seafood Feast (Easier)"
  description: "Five agents prepare simplified seafood dishes with pre-caught fish"

objectives:
  primary: "Cook 2x Cooked Shrimp and 1x Tuna Sushi with partial ingredients provided"

relevant_game_context: |
  This is a cooperative multi-agent cooking scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - fisher1_agent starts with 2x rawshrimp already caught
  - fisher2_agent starts with 1x rawtuna already caught
  - cook1_agent has kelp for sushi
  - Higher skill levels for faster cooking
  - Reduced targets: simpler menu

  PRODUCTION TARGETS (REDUCED):
  - 2x Cooked Shrimp (have 2x rawshrimp ready!)
  - 1x Tuna Sushi (have 1x rawtuna and kelp ready!)

  COOKING RECIPES:
  - Cooked Shrimp: 1x rawshrimp (Cooking Level 1)
  - Tuna Sushi: 1x rawtuna + 1x kelp (Cooking Level 20)

  TEAM COORDINATION:
  - Transfer fish to cooks
  - Cooks prepare dishes

  DO NOT use complete() until food is cooked!

max_action_steps: 18

