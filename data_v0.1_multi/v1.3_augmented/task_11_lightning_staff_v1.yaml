# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, easier completion
# SOURCE: task_11_lightning_staff.yaml

task:
  name: "Cooperative Lightning Staff Enhancement - Advanced Magic Crafting (Easier)"
  description: "Three agents work together to create an enhanced lightning staff - with pre-crafted basic staff"

objectives:
  primary: "Create a lightning staff through coordinated magic staff creation and elemental enhancement"

relevant_game_context: |
  This is a cooperative multi-agent advanced magic crafting scenario requiring elemental materials.

  STARTING ADVANTAGE:
  - staff_crafter_agent already has 1x staff (pre-crafted!)
  - magic_enhancer_agent has 1x lightningbead (for enhancement)
  - Higher skill levels across all agents
  - Simple assembly required!

  OBJECTIVE: Create a lightning staff by combining pre-made staff with lightning bead.

  SIMPLIFIED STRATEGY:
  - staff_crafter_agent transfers staff to magic_enhancer_agent
  - elemental_gatherer_agent transfers lightningbead to magic_enhancer_agent
  - magic_enhancer_agent crafts lightningstaff immediately

  DO NOT use complete() until lightningstaff is crafted!

  CRAFTING RECIPES:
  ⚡ Crafting Recipe - lightningstaff:
    - craft_item skill=Crafting itemKey=lightningstaff
    - Materials: 1x staff + 1x lightningbead → 1x lightningstaff
    - Level required: 10 (Crafting skill)

max_action_steps: 20

