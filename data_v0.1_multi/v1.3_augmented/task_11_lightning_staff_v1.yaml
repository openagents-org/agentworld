# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, easier completion
# SOURCE: task_11_lightning_staff.yaml

task:
  name: "Cooperative Magic Staff Creation (Easier)"
  description: "Three agents work together to create a magic staff from components"

objectives:
  primary: "Create a Magic Staff through coordinated crafting"

relevant_game_context: |
  This is a cooperative multi-agent magic crafting scenario.

  STARTING ADVANTAGE:
  - Materials distributed across agents
  - stick_gatherer_agent has 3x stick
  - bead_gatherer_agent has 1x bead and 2x stick
  - crafter_agent will combine materials to craft staff
  - Higher skill levels across all agents

  OBJECTIVE: Create a Magic Staff by combining sticks and bead.

  STRATEGY:
  - stick_gatherer_agent transfers sticks to crafter_agent
  - bead_gatherer_agent transfers bead and remaining sticks to crafter_agent
  - crafter_agent crafts staff (5x stick + 1x bead)

  DO NOT use complete() until staff is crafted!

  CRAFTING RECIPES:
  Magic Staff (staff):
    - craft_item skill=Crafting itemKey=staff
    - Materials: 5x stick + 1x bead → 1x staff
    - Level required: 1 (Crafting skill)

max_action_steps: 20

