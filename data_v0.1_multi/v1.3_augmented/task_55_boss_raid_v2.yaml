task:
  name: "Boss Raid - Multi-Boss Gauntlet (Harder)"
  description: "Five warriors face expanded boss roster in extended combat"

objectives:
  primary: "Defeat Ancient Wizard, Hermit Crab, and Spider"

relevant_game_context: |
  This is a cooperative multi-agent boss raid with increased difficulty.

  CHALLENGE MODE:
  - Added additional bosses
  - Lower combat stats require better tactics
  - Less enchanted equipment
  - Fewer consumables - manage healing carefully

  TARGET BOSSES (EXPANDED):
  - Ancient Wizard (Level 10): Located at (163, 339)
  - Hermit Crab (Level 15): Located at (224, 359)
  - Spider (Level 10): Located at (180, 345)

  RAID ORDER:
  1. Ancient Wizard first (easier, warm up)
  2. Spider Queen second
  3. Hermit Crab Warriors last (toughest)

  COMBAT STRATEGY:
  - Tank must hold aggro effectively
  - Coordinate focus fire
  - Conserve resources for later bosses
  - Support must triage healing

  DO NOT use complete() until ALL bosses are defeated!

max_action_steps: 85

