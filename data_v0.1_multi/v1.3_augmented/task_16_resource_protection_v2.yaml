  CHALLENGE MODE:
  - Increased targets: 10x logs and 6x blueberry (doubled!)
  - Added 4th agent (support_guardian) for enhanced protection
  - Reduced consumables - manage resources carefully
  - Extended duration for larger gathering operation

  OBJECTIVE: Gather increased resources while protecting the team.

  MISSION REQUIREMENTS:
  - Collect 10x logs and 6x blueberry (increased from 5+3)
  - Keep all team members alive throughout the mission
  - Coordinate two guardians for better coverage

  DO NOT use complete() until ALL objectives are achieved safely!

  COMBAT & GATHERING:
  🏹 Combat: Use attack on hostile targets
  🪵 Lumberjacking: harvest_resource on oak trees → 10x logs
  🫐 Foraging: harvest_resource on blueberry bushes → 6x blueberry

