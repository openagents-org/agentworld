# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets, added 4th agent
# SOURCE: task_33_resource_collection.yaml

task:
  name: "Resource Collection - Multi-Material Gathering (Harder)"
  description: "Four agents work together to gather extensive resources from different regions"

objectives:
  primary: "Collect 8x logs, 6x coal, 4x copperore, and 2x ironore through coordinated gathering"

relevant_game_context: |
  This is a cooperative multi-agent resource gathering scenario with increased difficulty.

  CHALLENGE MODE:
  - Increased targets: 8x logs, 6x coal, 4x copperore, 2x ironore
  - No pre-gathered materials
  - Added 4th agent (expedition_agent) for wider coverage
  - Added ironore requirement (higher level mining)
  - Reduced consumables - manage resources carefully

  COLLECTION TARGETS (INCREASED):
  - 8x logs (from Oak trees)
  - 6x coal (from Coal rocks)
  - 4x copperore (from Copper rocks)
  - 2x ironore (from Iron rocks, Level 15 mining)

  RESOURCE LOCATIONS:
  - Oak trees: Forest regions (380-400, 0-50)
  - Coal rocks: Mountain regions (200-250, 30-60)
  - Copper rocks: Mountain regions (200-250, 30-60)
  - Iron rocks: Mountain regions (200-250, 30-60)

  DO NOT use complete() until all resources are collected!

max_action_steps: 42

