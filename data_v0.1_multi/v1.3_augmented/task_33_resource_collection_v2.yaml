# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Harder version requiring unique specializations and crafting
# SOURCE: task_33_resource_collection.yaml (redesigned for genuine collaboration)

task:
  name: "Resource Collection and Crafting - Coordinated Production (Harder)"
  description: "Four agents with unique skills gather resources and craft equipment"

objectives:
  primary: "Craft 1x Axe and 1x Wooden Bow through specialized resource gathering and coordinated crafting"

relevant_game_context: |
  This is a cooperative multi-agent resource gathering and crafting scenario.

  CHALLENGE MODE:
  - Each agent has UNIQUE skills others cannot perform
  - Must gather resources AND craft items
  - Requires multiple item transfers between specialists
  - No pre-gathered materials

  PRODUCTION TARGETS:
  - 1x Axe (3x ironbar + 1x logs) - requires Smithing
  - 1x Wooden Bow (1x logs + 1x string) - requires Fletching

  MATERIAL CHAIN:
  - Need 3x ironore → 3x ironbar (Smelting)
  - Need 2x logs (from trees)
  - Need 1x string (from spiders)

  TEAM ROLES (UNIQUE SKILLS):
  - lumberjack_agent: ONLY ONE with Lumberjacking - harvests logs
  - miner_agent: ONLY ONE with Mining - mines iron ore
  - smelter_agent: ONLY ONE with Smelting - smelts ore to bars
  - crafter_agent: ONLY ONE with Smithing AND Fletching - crafts items

  LOCATIONS:
  - Forest (Oak trees): Around (388, 10)
  - Mountain (Iron rocks): Around (230, 40)
  - Spider area (String drops): Around (200, 180)

  COORDINATION REQUIRED:
  - miner transfers ironore to smelter
  - smelter transfers ironbar to crafter
  - lumberjack transfers logs to crafter
  - lumberjack gets string from spiders, transfers to crafter

  DO NOT use complete() until both axe and woodenbow are crafted!

max_action_steps: 50

