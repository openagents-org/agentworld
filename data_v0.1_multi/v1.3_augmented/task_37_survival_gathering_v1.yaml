# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_37_survival_gathering.yaml

task:
  name: "Survival Gathering - Food and Resource Collection (Easier)"
  description: "Three agents work together with pre-gathered resources to complete survival collection"

objectives:
  primary: "Collect 3x blueberry, 2x corn, and 2x logs with pre-gathered starting materials"

relevant_game_context: |
  This is a cooperative multi-agent survival gathering scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - forager_agent starts with 2x blueberry
  - farmer_agent starts with 1x corn
  - lumberjack_agent starts with 1x logs
  - Higher skill levels for faster gathering
  - Reduced targets for quicker completion

  COLLECTION TARGETS (REDUCED):
  - 3x blueberry (have 2, need 1 more)
  - 2x corn (have 1, need 1 more)
  - 2x logs (have 1, need 1 more)

  RESOURCE LOCATIONS:
  - Blueberry bushes: Found in forest edges
  - Corn: Found in farming areas
  - Oak trees: Forest regions

  DO NOT use complete() until all resources are collected!

max_action_steps: 18

