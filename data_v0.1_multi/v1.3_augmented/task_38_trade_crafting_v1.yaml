# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_38_trade_crafting.yaml

task:
  name: "Trade Crafting - Gold Ring Production (Easier)"
  description: "Three agents work together with pre-gathered materials to craft a gold ring"

objectives:
  primary: "Craft 1x Gold Ring using pre-gathered gold ore and coal"

relevant_game_context: |
  This is a cooperative multi-agent mining and crafting scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - miner_agent starts with 2x goldore already mined
  - support_agent starts with 2x coal for smelting
  - Higher skill levels for guaranteed success
  - No mining required - just crafting operations

  PRODUCTION CHAIN:
  1. Smelt 2x goldbar (1x goldore + 1x coal → 1x goldbar)
  2. Craft 1x goldring (2x goldbar → 1x goldring)

  TEAM COORDINATION:
  - Transfer materials to smith_agent
  - Smith performs smelting and crafting

  DO NOT use complete() until gold ring is crafted!

max_action_steps: 18

