# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets, added 4th agent
# SOURCE: task_34_enchanted_staff_workshop.yaml

task:
  name: "Enchanted Staff Workshop - Lightning Staff Creation (Harder)"
  description: "Four agents work together to craft TWO Lightning Staffs through coordinated gathering and crafting"

objectives:
  primary: "Craft 2x Lightning Staffs by gathering materials and coordinating crafting operations"

relevant_game_context: |
  This is a cooperative multi-agent magical crafting scenario with increased difficulty.

  CHALLENGE MODE:
  - Must craft 2x Lightning Staffs (doubled!)
  - Need to gather all materials from scratch
  - Added 4th agent (assistant_crafter) for additional help
  - Need 4x logs minimum for both staffs
  - Reduced consumables - manage resources carefully

  CRAFTING CHAIN (FOR EACH STAFF):
  1. Harvest 2x logs from Oak trees (4x total for both staffs)
  2. Craft logs into sticks (1x logs → 4x stick)
  3. Craft basic staff (5x stick + 1x bead → 1x staff)
  4. Upgrade to Lightning Staff (1x staff + 1x lightningbead → 1x lightningstaff)

  MATERIAL SOURCES:
  - Logs: Oak trees in forest region
  - Beads: 2x provided (one per staff)
  - Lightning Beads: 2x provided (one per staff)

  DO NOT use complete() until BOTH Lightning Staffs are crafted!

max_action_steps: 45

