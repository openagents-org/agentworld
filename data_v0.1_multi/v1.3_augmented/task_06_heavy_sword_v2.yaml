# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, full production chain required
# SOURCE: task_06_heavy_sword.yaml

task:
  name: "Cooperative Heavy Sword Forging - Warrior Weapon Crafting (Harder)"
  description: "Three agents work together to create TWO heavy swords through complete metallurgy chain"

# Task objectives
objectives:
  primary: "Forge TWO heavy swords through coordinated material extraction and weapon smithing from scratch"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent weapon crafting scenario requiring advanced metallurgy and smithing.

  CHALLENGE MODE:
  - Must create TWO heavy swords (doubled target!)
  - weapon_smith_agent starts with NO hilt2 or ironbar - full chain required
  - Must smelt ironbar AND craft hilts from scratch
  - Reduced consumables - manage resources carefully

  OBJECTIVE: Forge 2x heavy swords through complete production chain.

  REQUIRED MATERIALS FOR 2 HEAVY SWORDS:
  - 4x ironbar (2 per sword for blade)
  - 2x hilt2 (1 per sword) - each hilt needs 1x ironbar + 1x logs
  - Total: 6x ironbar + 2x logs

  CRAFTING CHAIN:
  1. Smelt 6x ironbar from 6x ironore + 6x coal
  2. Craft 2x hilt2 (2x ironbar + 2x logs)
  3. Forge 2x sword2 (4x ironbar + 2x hilt2)

  DO NOT use complete() until 2x heavy swords are created!

  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  🔥 Smelting Recipe - ironbar:
    - craft_item skill=Smelting itemKey=ironbar
    - Materials: 1x ironore + 1x coal → 1x ironbar
    - Level required: 20 (uses Smithing skill level)

  🔨 Smithing Recipe - hilt2:
    - craft_item skill=Smithing itemKey=hilt2
    - Materials: 1x ironbar + 1x logs → 1x hilt2
    - Level required: 1 (Smithing skill)

  ⚔️ Smithing Recipe - sword2 (heavy sword):
    - craft_item skill=Smithing itemKey=sword2
    - Materials: 2x ironbar + 1x hilt2 → 1x heavy sword
    - Level required: 1 (Smithing skill)

