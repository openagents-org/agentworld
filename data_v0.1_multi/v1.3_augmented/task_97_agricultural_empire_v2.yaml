  description: "Ten agents fish and cook for large-scale agricultural production"

objectives:
  primary: "Catch 14x rawshrimp, cook 12x Cooked Shrimp and 4x Cooked Tuna"

relevant_game_context: |
  This is a cooperative multi-agent agricultural scenario with maximum difficulty.

  CHALLENGE MODE:
  - Doubled fishing and cooking targets
  - Quadrupled smoothie production
  - Lower skill levels
  - Fewer consumables

  PRODUCTION TARGETS (DOUBLED):
  - 14x rawshrimp (from fishing)
  - 12x Cooked Shrimp (from cooking)
  - 4x Cooked Tuna (from cooking)

  MATERIALS NEEDED:
  - Need to catch 4x rawtuna for tuna

  LOCATIONS:
  - Fishing: Coastal (580, 750)

  TEAM ROLES:
  - Fishers: Catch seafood
  - Cooks: Prepare food

  DO NOT use complete() until all objectives are met!

max_action_steps: 65

