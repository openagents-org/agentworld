# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_61_royal_banquet.yaml

task:
  name: "Royal Banquet - Full Feast (Harder)"
  description: "Eight agents prepare grand banquet catching all ingredients from scratch"

objectives:
  primary: "Cook 6x Cooked Shrimp, 4x Tuna Sushi, 4x Cooked Chicken, and 2x Jellyfish Smoothie"

relevant_game_context: |
  This is a cooperative multi-agent cooking scenario with increased difficulty.

  CHALLENGE MODE:
  - Doubled all targets
  - Must catch/hunt all ingredients from scratch
  - Lower skill levels require more attempts
  - Added jellyfish smoothie
  - Reduced consumables

  PRODUCTION TARGETS (DOUBLED):
  - 6x Cooked Shrimp (catch 6x rawshrimp)
  - 4x Tuna Sushi (catch 4x rawtuna)
  - 4x Cooked Chicken (hunt 4x chicken)
  - 2x Jellyfish Smoothie (catch 2x jellyfish)

  GATHERING REQUIREMENTS:
  - 6x rawshrimp (fishing)
  - 4x rawtuna (fishing)
  - 2x jellyfish (fishing level 5+)
  - 4x rawchicken (hunting)

  DO NOT use complete() until ALL dishes are cooked!

max_action_steps: 60

