# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_59_elite_merchant_guild.yaml

task:
  name: "Elite Merchant Guild (Easier)"
  description: "Seven specialists craft simplified guild showcase with pre-gathered materials"

objectives:
  primary: "Craft 1x Gold Ring, 1x Staff, and 1x Pickaxe using provided materials"

relevant_game_context: |
  This is a cooperative multi-agent guild scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - Gold_Baron starts with 4x goldbar already smelted
  - Iron_Trader starts with 5x ironbar already smelted
  - Timber_Merchant starts with 3x logs
  - Mystic_Collector starts with 1x bead
  - Higher skill levels for guaranteed success
  - Simplified targets: 1 ring, 1 staff, 1 pickaxe

  PRODUCTION TARGETS (REDUCED):
  - 1x Gold Ring (2x goldbar)
  - 1x Staff (5x stick + 1x bead)
  - 1x Pickaxe (5x ironbar + 1x logs)

  MATERIALS AVAILABLE:
  - 4x goldbar (for ring + extra)
  - 5x ironbar (for pickaxe)
  - 3x logs (for sticks and handle)
  - 1x bead (for staff)

  PHASE OUTLINE:
  1. Gather at guild hall
  2. Transfer materials to Guild_Master
  3. Craft all items

  DO NOT use complete() until items are crafted!

max_action_steps: 28

