# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, full crafting chain required
# SOURCE: task_11_lightning_staff.yaml

task:
  name: "Cooperative Lightning Staff Enhancement - Advanced Magic Crafting (Harder)"
  description: "Three agents work together to create TWO lightning staffs through complete crafting chain"

objectives:
  primary: "Create TWO lightning staffs through full staff crafting and elemental enhancement chain"

relevant_game_context: |
  This is a cooperative multi-agent advanced magic crafting scenario requiring elemental materials.

  CHALLENGE MODE:
  - Must create TWO lightning staffs (doubled target!)
  - magic_enhancer_agent starts with NO staff - full chain required
  - Must craft basic staffs from logs→sticks→staff, then enhance
  - Reduced consumables - manage resources carefully

  OBJECTIVE: Create 2x lightning staffs through complete production chain.

  REQUIRED MATERIALS FOR 2 LIGHTNING STAFFS:
  - 2x staff (each needs 5 sticks + 1 bead)
  - 2x lightningbead (elemental_gatherer has these)
  - Total: 10 sticks (3 logs) + 2 beads + 2 lightningbeads

  CRAFTING CHAIN:
  1. Gather 3+ logs
  2. Craft 12+ sticks from logs
  3. Craft 2x staff (5 sticks + 1 bead each)
  4. Enhance to 2x lightningstaff

  DO NOT use complete() until 2x lightningstaff is created!

  CRAFTING RECIPES:
  🪵 Lumberjacking: harvest_resource on oak trees
  🪄 Fletching: 1x logs → 4x stick
  ⚡ Crafting: 5x stick + 1x bead → 1x staff
  ⚡ Crafting: 1x staff + 1x lightningbead → 1x lightningstaff (Level 10+)

