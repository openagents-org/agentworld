# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, must gather and smelt all materials
# SOURCE: task_03_silver_ring.yaml

task:
  name: "Cooperative Silver Ring Forging - Jewelry Crafting (Harder)"
  description: "Three agents work together to mine, smelt, and forge TWO silver rings - full production chain required"

# Task objectives
objectives:
  primary: "Create TWO silver rings through coordinated mining, smelting, and smithing from scratch"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent jewelry crafting scenario.

  CHALLENGE MODE:
  - Must create TWO silver rings (doubled target!)
  - smith_agent starts with NO ironbar - must receive from team
  - Full production chain required: mining → smelting → smithing
  - Reduced consumables - manage resources carefully

  OBJECTIVE: Create 2x silver rings through the complete metallurgy chain.

  REQUIRED MATERIALS:
  - 4x ironbar needed (2 per ring)
  - Must smelt ironbar from ironore + coal
  - Team has raw materials distributed - must coordinate transfers

  TEAM COORDINATION:
  - Use global chat to coordinate the full production chain
  - miner_agent and smelter_agent have ore - need to process it
  - Materials must flow: ore → smelter → smith

  CRAFTING RECIPES:
  🔥 Smelting Recipe - ironbar:
    - craft_item skill=Smelting itemKey=ironbar
    - Materials: 1x ironore + 1x coal → 1x ironbar
    - Level required: 20 (uses Smithing skill level)

  🔨 Smithing Recipe - silverring:
    - Command: craft_item skill=Smithing itemKey=silverring
    - Materials: 2x ironbar → 1x silverring
    - Level required: 1 (Smithing skill)
    - Need to craft TWICE for 2 rings!

  PRODUCTION CHAIN:
  1. Consolidate ore and coal with smelter_agent
  2. smelter_agent smelts 4x ironbar
  3. Transfer ironbar to smith_agent
  4. smith_agent crafts 2x silverring

  DO NOT use complete() until 2x silverring is in inventory!

  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


