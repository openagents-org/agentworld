# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_67_resource_caravan.yaml

task:
  name: "Resource Caravan - Quick Gathering (Easier)"
  description: "Eight traders gather resources with pre-gathered materials"

objectives:
  primary: "Collect 3x logs, 3x coal, and craft 1x Pickaxe with provided iron"

relevant_game_context: |
  This is a cooperative multi-agent resource gathering with reduced difficulty.

  STARTING ADVANTAGE:
  - lumberjack1_agent has 2x logs pre-gathered
  - miner1_agent has 2x coal pre-gathered
  - crafter_agent has 5x ironbar ready for pickaxe
  - Higher skill levels for faster gathering
  - Reduced targets: half the logs and coal

  PRODUCTION TARGETS (REDUCED):
  - 3x logs (from forest) - 2 already gathered!
  - 3x coal (from mountain) - 2 already gathered!
  - 1x Pickaxe (5x ironbar + 1x logs) - iron bars ready!

  TEAM COORDINATION:
  - Gather remaining resources
  - Crafter has materials for pickaxe
  - Quick completion possible

  DO NOT use complete() until objectives are met!

max_action_steps: 18

