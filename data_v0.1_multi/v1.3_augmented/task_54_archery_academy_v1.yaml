# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Easier version with some pre-gathered materials
# SOURCE: task_54_archery_academy.yaml (redesigned for proper collaboration)

task:
  name: "Archery Academy - Equipment Production (Easier)"
  description: "Five agents collaborate with distributed materials to craft archery equipment"

objectives:
  primary: "Craft 1x Wooden Bow and 10x Arrows through coordinated material transfers"

relevant_game_context: |
  This is a cooperative archery equipment production scenario.

  STARTING ADVANTAGE:
  - Materials are distributed across agents - requires transfers
  - Higher skill levels for guaranteed success
  - Targets: 1 bow, 10 arrows (one batch)

  PRODUCTION TARGETS:
  - 1x Wooden Bow (1x logs + 1x string) - Fletching level 5
  - 10x Arrows (10x stick + 10x feather) - Fletching level 1

  MATERIAL DISTRIBUTION (MUST TRANSFER TO FLETCHER):
  - lumberjack1_agent: Has 1x logs (for bow)
  - lumberjack2_agent: Has 1x string (for bow)
  - material_agent1: Has 5x stick (half for arrows)
  - material_agent2: Has 5x stick + 10x feather (half sticks + all feathers)
  - fletcher_agent: Has Fletching skill but NO materials

  TEAM COORDINATION:
  - All material holders must transfer items to fletcher_agent
  - Only fletcher_agent has Fletching skill to craft

  DO NOT use complete() until archery items are ready!

max_action_steps: 25

