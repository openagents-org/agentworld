  description: "Five agents craft 1x Wooden Bow using pre-gathered materials"

objectives:
  primary: "Craft 1x Wooden Bow and 5x Arrows with materials mostly provided"

relevant_game_context: |
  This is a cooperative archery equipment production with reduced difficulty.

  STARTING ADVANTAGE:
  - lumberjack1_agent starts with 2x logs already gathered
  - fletcher1_agent has sticks ready for arrows
  - Higher skill levels for guaranteed success
  - Reduced targets: 1 bow, 5 arrows

  PRODUCTION TARGETS (REDUCED):
  - 1x Wooden Bow (1x logs + 1x string) - materials ready
  - 5x Arrows (5x stick + 5x feather) - materials ready

  MATERIAL AVAILABILITY:
