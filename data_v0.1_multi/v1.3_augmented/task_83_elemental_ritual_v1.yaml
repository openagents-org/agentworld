# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_83_elemental_ritual.yaml

task:
  name: "Elemental Ritual - Simple Ceremony (Easier)"
  description: "Ten agents craft ritual items with pre-gathered materials"

objectives:
  primary: "Craft 1x Beryl Pendant and collect 4x blueberry"

relevant_game_context: |
  This is a cooperative multi-agent crafting scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - crafter1_agent has beryl already gathered
  - forager1_agent has 2x blueberry pre-gathered
  - Only 1 item to craft (no gold ring)
  - Higher skill levels

  PRODUCTION TARGETS (REDUCED):
  - 1x Beryl Pendant (beryl + string)
  - 4x blueberry (foraging) - 2 already gathered!

  MATERIALS PROVIDED:
  - Gold bars and string provided

  TEAM ROLES:
  - Foragers: Gather blueberries
  - Crafter: Make pendant

  DO NOT use complete() until all objectives are met!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 20

