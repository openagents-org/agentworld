# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_51_survival_challenge.yaml

task:
  name: "Survival Challenge - Equipment Preparation (Harder)"
  description: "Five agents must gather all materials and craft full survival kit"

objectives:
  primary: "Craft 2x Wooden Bow, 2x Axe, and collect 10x rawshrimp and 8x logs"

relevant_game_context: |
  This is a cooperative multi-agent survival preparation with increased difficulty.

  CHALLENGE MODE:
  - Doubled all targets
  - No pre-gathered materials
  - Lower skill levels require more attempts
  - Must gather all logs from scratch
  - Need 22 ironore/coal for 6 ironbars (2 axes)

  PRODUCTION TARGETS (DOUBLED):
  - 2x Wooden Bow (1x logs + 1x string each)
  - 2x Axe (3x ironbar + 1x logs each = 6 bars, 2 logs)
  - 10x rawshrimp (fishing)
  - 8x logs (lumberjacking)

  MATERIAL REQUIREMENTS:
  - 4x logs for bows
  - 2x logs for axe handles
  - 2x logs extra for total
  - 2x string (provided)
  - 6x ironbar from mining

  DO NOT use complete() until ALL items are ready!

max_action_steps: 55

