  description: "Ten agents prepare supplies with pre-gathered materials"

objectives:
  primary: "Cook 3x Cooked Shrimp, craft 1x Pickaxe, and collect 4x logs"

relevant_game_context: |
  This is a cooperative multi-agent supply preparation with reduced difficulty.

  STARTING ADVANTAGE:
  - fisher1_agent has 2x rawshrimp pre-caught
  - logger1_agent has 2x logs pre-gathered
  - smith_agent has 5x ironbar ready
  - Higher skill levels for faster work
  - Reduced targets

  PRODUCTION TARGETS (REDUCED):
  - 3x Cooked Shrimp (cook 3x rawshrimp) - 2 already caught!
  - 1x Pickaxe (5x ironbar + 1x logs) - iron bars ready!
  - 4x logs (from forest) - 2 already gathered!

  DO NOT use complete() until all supplies are ready!

max_action_steps: 20

