  CHALLENGE MODE:
  - Doubled targets: 2x staff, 2x silverring
  - Added 4th agent (apprentice_agent) for additional help
  - Materials distributed across agents - requires coordination
  - Reduced consumables - manage resources carefully

  CRAFTING TARGETS (INCREASED):
  - 2x staff (5x stick + 1x bead each = 10 sticks, 2 beads)
  - 2x silverring (2x ironbar each = 4 ironbar)

  MATERIAL REQUIREMENTS:
  - 10x stick (provided, split across agents)
  - 2x bead (provided)
  - 4x ironbar (provided)

  DO NOT use complete() until all items are crafted!

