# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_62_weaponsmith_consortium.yaml

task:
  name: "Weaponsmith Consortium - Full Arsenal (Harder)"
  description: "Seven smiths mine and forge expanded 12-piece weapon arsenal"

objectives:
  primary: "Forge complete arsenal: 2 golden swords, 1 golden bow, 4 heavy swords, 4 axes, 1 pickaxe"

relevant_game_context: |
  This is a cooperative multi-agent weapon crafting with increased difficulty.

  CHALLENGE MODE:
  - Expanded to 12 weapons total
  - Must mine all ore from scratch
  - Need 60+ gold ore for golden items
  - Need 36+ iron ore for iron items
  - Lower skill levels require more attempts
  - Reduced consumables

  PRODUCTION TARGETS (EXPANDED):
  - 2x Golden Sword (15x goldbar + 1x hilt each = 30 gold bars)
  - 1x Golden Bow (15x goldbar + 10x string + 2x logs)
  - 4x Heavy Sword (2x ironbar + 1x hilt2 each = 8 iron bars)
  - 4x Axe (3x ironbar + 1x logs each = 12 iron bars)
  - 1x Pickaxe (5x ironbar + 1x logs)

  MATERIAL REQUIREMENTS:
  - 45x goldbar (45 gold ore + 45 coal)
  - 25x ironbar (25 iron ore + 25 coal)
  - Total ~70 coal needed
  - 7x logs, 10x string, hilts provided

  DO NOT use complete() until ALL weapons forged!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 150

