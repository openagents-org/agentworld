# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, must fish and cook larger quantity
# SOURCE: task_14_shrimp_cooking.yaml

task:
  name: "Cooperative Shrimp Cooking - Seafood Culinary Team (Harder)"
  description: "Three agents work together to prepare 15x cooked shrimp through extensive fishing and cooking"

objectives:
  primary: "Prepare 15x cooked shrimp through coordinated fishing and culinary operations"

relevant_game_context: |
  This is a cooperative multi-agent seafood cooking scenario.

  CHALLENGE MODE:
  - Must prepare 15x cookedshrimp (tripled target!)
  - seafood_chef_agent starts with only 3x rawshrimp - must fish more!
  - Full fishing → cooking chain required
  - Reduced consumables - manage resources carefully

  OBJECTIVE: Fish and cook 15x shrimp through complete production chain.

  REQUIRED MATERIALS:
  - 15x rawshrimp (must fish most of them)
  - Team has 6x rawshrimp total - need 9+ more

  STRATEGY:
  - fisherman_agent catches additional rawshrimp
  - All shrimp transferred to seafood_chef_agent
  - seafood_chef_agent cooks all 15x

  DO NOT use complete() until 15x cookedshrimp exists!

  CRAFTING RECIPES:
  🎣 Fishing - rawshrimp:
    - harvest_resource on shrimp fishing spots to get rawshrimp
    - Level required: 1+ (Fishing skill)

  🍤 Cooking Recipe - cookedshrimp:
    - craft_item skill=Cooking itemKey=cookedshrimp
    - Materials: 1x rawshrimp → 1x cookedshrimp
    - Level required: 1 (Cooking skill)
    - Cook 15 times!

max_action_steps: 40

