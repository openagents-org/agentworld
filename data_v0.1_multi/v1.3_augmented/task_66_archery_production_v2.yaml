# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Harder version with resource gathering
# SOURCE: task_66_archery_production.yaml (redesigned for realistic difficulty)

task:
  name: "Archery Production - Master Fletcher (Harder)"
  description: "Six agents gather materials and craft golden bows and arrows"

objectives:
  primary: "Craft 1x Golden Bow and 20x Arrows through coordinated gathering and crafting"

relevant_game_context: |
  This is a cooperative multi-agent archery production with increased difficulty.

  CHALLENGE MODE:
  - Must gather logs and feathers
  - Some gold bars provided, some must be smelted
  - Fletchers must reach level 32 for golden bow
  - Requires coordination across different regions

  PRODUCTION TARGETS:
  - 1x Golden Bow (15x goldbar + 10x string + 2x logs) - Fletching level 32
  - 20x Arrows (20x stick + 20x feather) - Fletching level 1

  MATERIAL STATUS:
  - 10x goldbar provided (need 5 more from smelting)
  - 5x goldnugget + 5x coal provided for smelting
  - 10x string provided
  - Must harvest 5x logs (for bow + sticks)
  - Must hunt for 20x feathers (from birds)

  TEAM ROLES:
  - Hunters: Hunt birds for feathers
  - Lumberjacks: Harvest logs from Oak trees
  - Smelter: Smelt goldnugget to goldbar
  - Fletchers: Craft bows and arrows

  LOCATIONS:
  - Oak Trees: Around (388, 10)
  - Birds: Around (350, 250)

  DO NOT use complete() until ALL archery items are ready!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 70

