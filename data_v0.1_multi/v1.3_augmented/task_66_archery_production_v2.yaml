# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_66_archery_production.yaml

task:
  name: "Archery Production - Master Fletcher (Harder)"
  description: "Six agents mine gold, hunt feathers, and craft multiple bows and arrows"

objectives:
  primary: "Craft 2x Golden Bow and 40x Arrows from scratch"

relevant_game_context: |
  This is a cooperative multi-agent archery production with increased difficulty.

  CHALLENGE MODE:
  - Double bow target: 2 golden bows
  - Double arrow target: 40 arrows
  - Must mine all gold from scratch
  - Must hunt all feathers
  - Lower skill levels require more attempts
  - Reduced consumables

  PRODUCTION TARGETS (DOUBLED):
  - 2x Golden Bow (30x goldbar + 20x string + 4x logs)
  - 40x Arrows (40x stick + 40x feather)

  MATERIAL REQUIREMENTS:
  - 30x goldore + 30x coal → 30x goldbar
  - 20x string (foraging)
  - 4x logs → 10x sticks (need 4 more logs for 40 sticks)
  - 40x feather (hunting birds)

  DO NOT use complete() until ALL archery items are ready!

max_action_steps: 70

