  primary: "Defeat the Iron Ogre at (238, 48)"

relevant_game_context: |
  This is a cooperative multi-agent boss hunting with reduced difficulty.

  STARTING ADVANTAGE:
  - Only 1 boss to defeat (easiest one)
  - Higher combat stats for all warriors
  - More consumables for survival
  - Full team focus on single target

  TARGET BOSS (REDUCED):
  - Iron Ogre (Level 25): Located at mountain region (238, 48)

  COMBAT STRATEGY:
  - Full team assaults in sequence
  - Tank players draw aggro
  - DPS focuses damage
  - Supports provide healing

  DO NOT use complete() until boss is defeated!

max_action_steps: 22

