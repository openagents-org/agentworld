task:
  name: "Dragon Hunt - Five Boss Conquest (Harder)"
  description: "Ten elite warriors hunt and defeat five dangerous bosses"

objectives:
  primary: "Defeat Iron Ogre, Water Guardian, Mermaid, Ogre Guardian, and Ogre Chieftain"

relevant_game_context: |
  This is a cooperative multi-agent boss hunting with maximum difficulty.

  CHALLENGE MODE:
  - FIVE bosses to defeat
  - Lower combat stats
  - Fewer consumables
  - Must travel between regions

  TARGET BOSSES (EXPANDED):
  - Iron Ogre (Level 25): Located at mountain (238, 48)
  - Water Guardian (Level 36): Located at coast (197, 633)
  - Mermaid (Level 55): Located at ocean (580, 755)
  - Ogre Guardian (Level 32): Located at (291, 644)
  - Ogre Chieftain (Level 35): Located at (300, 650)

  COMBAT STRATEGY:
  - Must split team or hunt sequentially
  - Coordinate healing and attacks
  - Manage limited resources

  DO NOT use complete() until ALL bosses are defeated!

max_action_steps: 80

