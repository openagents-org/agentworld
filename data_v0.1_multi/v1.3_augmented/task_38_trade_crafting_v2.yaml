# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets, added 4th agent
# SOURCE: task_38_trade_crafting.yaml

task:
  name: "Trade Crafting - Gold Ring Production (Harder)"
  description: "Four agents work together to mine gold and craft multiple valuable gold rings"

objectives:
  primary: "Mine gold ore, smelt 4x gold bars, and craft 2x Gold Rings"

relevant_game_context: |
  This is a cooperative multi-agent mining and crafting scenario with increased difficulty.

  CHALLENGE MODE:
  - Must craft 2x Gold Rings (doubled!)
  - Need to mine 4x goldore from scratch
  - Need to mine 4x coal for smelting
  - Added 4th agent (expedition_miner) for additional mining
  - Reduced consumables - manage resources carefully

  PRODUCTION CHAIN:
  1. Mine 4x goldore from Gold rocks (Level 25 mining)
  2. Mine 4x coal from Coal rocks
  3. Smelt 4x goldbar (1x goldore + 1x coal → 1x goldbar)
  4. Craft 2x goldring (2x goldbar → 1x goldring each)

  TEAM COORDINATION:
  - Two miners to cover gold and coal
  - Smith handles all smelting and crafting
  - Coordinate material transfers

  DO NOT use complete() until 2x gold rings are crafted!

max_action_steps: 45

