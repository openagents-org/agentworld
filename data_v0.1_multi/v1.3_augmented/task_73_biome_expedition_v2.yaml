task:
  name: "Biome Expedition - Full Conquest (Harder)"
  description: "Eight agents conquer multiple biomes with expanded objectives"

objectives:
  primary: "Collect 12x logs, defeat 4x Goblins and 2x Ogres, and craft 2x Wooden Bow"

relevant_game_context: |
  This is a cooperative multi-agent expedition with increased difficulty.

  CHALLENGE MODE:
  - Doubled log target: 12 logs
  - Doubled goblin count: 4 goblins
  - Doubled ogre count: 2 ogres
  - Must craft 2 bows instead of 1
  - Lower stats and fewer consumables

  COMBAT TARGETS (DOUBLED):
  - 4x Goblins (Level 10-15): Forest area
  - 2x Ogres (Level 28-35): Mountain area

  PRODUCTION TARGETS (DOUBLED):
  - 12x logs (from forest)
  - 2x Wooden Bow (1x logs + 1x string each)

  DO NOT use complete() until ALL objectives are met!

max_action_steps: 70

