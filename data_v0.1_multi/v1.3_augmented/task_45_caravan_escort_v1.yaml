# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_45_caravan_escort.yaml

task:
  name: "Caravan Escort - Protected Gathering (Easier)"
  description: "Three powerful agents protect miner with pre-gathered gold"

objectives:
  primary: "Protect miner while they collect 1 more goldnugget (2 already gathered) and defeat 1x threat"

relevant_game_context: |
  This is a cooperative multi-agent escort scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - miner_agent starts with 2x goldnugget already gathered
  - Guards have higher combat stats
  - Only need to defeat 1 threat (not 2)
  - More consumables for healing

  TARGETS (REDUCED):
  - Miner collects 3x goldnugget total (have 2, need 1)
  - Guards defeat 1x hostile creature

  GOLD LOCATIONS:
  - Gold rocks: Mountain regions (200-250, 30-60)

  COMBAT:
  - Guards engage any threats to protect miner
  - With higher stats, combat is straightforward
  - Miner focuses on final extraction

  DO NOT use complete() until gold is collected and threat eliminated!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 18

