# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_33_resource_collection.yaml

task:
  name: "Resource Collection - Multi-Material Gathering (Easier)"
  description: "Three agents work together with pre-gathered resources to complete collection targets"

objectives:
  primary: "Collect 3x logs, 2x coal, and 1x copperore with pre-gathered starting materials"

relevant_game_context: |
  This is a cooperative multi-agent resource gathering scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - lumberjack_agent starts with 2x logs
  - miner_agent starts with 1x coal
  - Higher skill levels for faster gathering
  - Reduced targets for quicker completion

  COLLECTION TARGETS (REDUCED):
  - 3x logs (have 2, need 1 more)
  - 2x coal (have 1, need 1 more)
  - 1x copperore (need 1)

  RESOURCE LOCATIONS:
  - Oak trees: Forest regions (380-400, 0-50)
  - Coal rocks: Mountain regions (200-250, 30-60)
  - Copper rocks: Mountain regions (200-250, 30-60)

  DO NOT use complete() until all resources are collected!

max_action_steps: 18

