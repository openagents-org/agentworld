# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_92_trade_network.yaml

task:
  name: "Trade Network - Empire Trade (Harder)"
  description: "Ten agents collect resources and craft trade goods"

objectives:
  primary: "Collect 12x logs, 10x ironore, 8x rawshrimp, and craft 4x Gold Ring"

relevant_game_context: |
  This is a cooperative multi-agent gathering scenario with maximum difficulty.

  CHALLENGE MODE:
  - Quadrupled ring production
  - Increased gathering across all resources
  - Lower skill levels
  - Fewer consumables

  PRODUCTION TARGETS (DOUBLED):
  - 12x logs (from forest)
  - 10x ironore (from mountain)
  - 8x rawshrimp (from fishing)
  - 4x Gold Ring (2x goldbar each)

  MATERIALS NEEDED:
  - 8x goldbar for rings

  DO NOT use complete() until all objectives are met!

max_action_steps: 65

