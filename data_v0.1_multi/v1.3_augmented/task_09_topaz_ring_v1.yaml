# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, easier completion
# SOURCE: task_09_topaz_ring.yaml

task:
  name: "Cooperative Topaz Ring Crafting - Luxury Jewelry (Easier)"
  description: "Three agents work together to create a topaz ring - with pre-smelted gold materials"

# Task objectives
objectives:
  primary: "Create a topaz ring by combining topaz gem with gold ring base"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent luxury jewelry scenario requiring precious materials.

  STARTING ADVANTAGE:
  - gold_smith_agent already has 2x goldbar (pre-smelted!)
  - gem_miner_agent has 2x topaz (extra for safety)
  - luxury_jeweler_agent ready to assemble
  - Higher skill levels across all agents

  OBJECTIVE: Create a topaz ring with mostly pre-processed materials.

  SIMPLIFIED STRATEGY:
  - gold_smith_agent crafts goldring from 2x goldbar
  - gem_miner_agent transfers topaz to luxury_jeweler_agent
  - gold_smith_agent transfers goldring to luxury_jeweler_agent
  - luxury_jeweler_agent crafts topazring

  TEAM COORDINATION:
  - Use global chat to coordinate transfers
  - Materials flow to luxury_jeweler_agent for final assembly

  DO NOT use complete() until topaz ring is created!

  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  🟨 Smithing Recipe - goldring:
    - craft_item skill=Smithing itemKey=goldring
    - Materials: 2x goldbar → 1x goldring
    - Level required: 1 (Smithing skill)

  💍 Crafting Recipe - topaz ring:
    - craft_item skill=Crafting itemKey=topazring
    - Materials: 1x topaz + 1x goldring → 1x topaz ring
    - Level required: 5 (Crafting skill)

# Limitations
max_action_steps: 20

