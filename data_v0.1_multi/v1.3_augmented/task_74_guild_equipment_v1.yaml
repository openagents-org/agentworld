# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_74_guild_equipment.yaml

task:
  name: "Guild Equipment - Quick Crafting (Easier)"
  description: "Six guild members craft basic equipment with pre-gathered materials"

objectives:
  primary: "Craft 1x Heavy Sword, 1x Wooden Bow, and 1x Silver Ring with provided materials"

relevant_game_context: |
  This is a cooperative multi-agent crafting with reduced difficulty.

  STARTING ADVANTAGE:
  - smith_agent has 4x ironbar and 1x hilt2 ready
  - fletcher_agent has 1x logs and 1x string ready
  - crafter_agent has 2x ironbar ready
  - Higher skill levels for guaranteed crafting
  - Reduced targets: fewer items

  PRODUCTION TARGETS (REDUCED):
  - 1x Heavy Sword (2x ironbar + 1x hilt2) - materials ready!
  - 1x Wooden Bow (1x logs + 1x string) - materials ready!
  - 1x Silver Ring (2x ironbar) - materials ready!

  TEAM COORDINATION:
  - All materials are pre-gathered
  - Just coordinate crafting

  DO NOT use complete() until all equipment is crafted!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 15

