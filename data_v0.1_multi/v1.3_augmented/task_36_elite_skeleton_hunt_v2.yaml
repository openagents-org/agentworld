  description: "Four agents work together to hunt multiple skeletons and gather extensive resources"

objectives:
  primary: "Defeat 6x Skeletons and collect 8x logs"

relevant_game_context: |
  This is a cooperative multi-agent combat and gathering scenario with increased difficulty.

  CHALLENGE MODE:
  - Increased targets: 6x Skeletons (doubled!)
  - Increased logs: 8x logs required
  - Added 4th agent (scout_agent) for wider coverage
  - Reduced consumables - manage resources carefully
  - Lower skill levels require better coordination

  TARGETS (INCREASED):
  - Defeat 6x Skeletons (Level 14, 140 HP each)
  - Collect 8x logs from Oak trees
  - Skeletons drop: sword2 (heavy sword)

  COMBAT TACTICS:
  - May need to engage multiple skeletons at once
  - Coordinate healing between fights

  DO NOT use complete() until all objectives are met!

