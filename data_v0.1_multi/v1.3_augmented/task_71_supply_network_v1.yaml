# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_71_supply_network.yaml

task:
  name: "Supply Network - Quick Collect (Easier)"
  description: "Eight agents gather resources with pre-gathered materials"

objectives:
  primary: "Collect 4x logs from forest and 3x coal from mountain"

relevant_game_context: |
  This is a cooperative multi-agent resource collection with reduced difficulty.

  STARTING ADVANTAGE:
  - logger1_agent has 2x logs pre-gathered
  - miner1_agent has 2x coal pre-gathered
  - Higher skill levels for faster gathering
  - Reduced targets: half the original

  COLLECTION TARGETS (REDUCED):
  - 4x logs (from forest) - 2 already gathered!
  - 3x coal (from mountain) - 2 already gathered!

  TEAM COORDINATION:
  - Gather remaining resources quickly
  - Most materials are pre-gathered

  DO NOT use complete() until all resources are collected!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 18

