  This is a cooperative multi-agent combat scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - Higher combat stats across all warriors
  - More consumables for sustained fighting
  - More arrows for archer
  - Reduced targets: 1 Ogre, 2 Goblins

  TARGETS (REDUCED):
  - 1x Ogre (Level 18, 150 HP)
  - 2x Goblins (Level 7, 90 HP each)

  COMBAT TACTICS:
