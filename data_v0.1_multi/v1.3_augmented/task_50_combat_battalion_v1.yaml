  - DPS focus fire on single target
  - Archer provides ranged support
  - Mage uses spells for damage

  ENEMY LOCATIONS:
  - Ogres: Mountain and wilderness regions
  - Goblins: Forest edges

  DO NOT use complete() until all enemies are defeated!

