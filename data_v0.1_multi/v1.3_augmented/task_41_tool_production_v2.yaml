# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets, added 4th agent
# SOURCE: task_41_tool_production.yaml

task:
  name: "Tool Production - Pickaxe and Axe Crafting (Harder)"
  description: "Four agents work together to mine ore and craft multiple tools"

objectives:
  primary: "Craft 2x Pickaxes and 2x Axes through coordinated mining and smithing"

relevant_game_context: |
  This is a cooperative multi-agent tool crafting scenario with increased difficulty.

  CHALLENGE MODE:
  - Must craft 2x Pickaxes AND 2x Axes (doubled!)
  - Need 16x ironore and 16x coal for iron bars (no pre-gathered)
  - Added 4th agent (assistant_miner) for more mining capacity
  - Need 4x logs for tool handles
  - Reduced consumables - manage resources carefully

  PRODUCTION CHAIN:
  1. Mine 16x ironore from Iron rocks
  2. Mine 16x coal from Coal rocks
  3. Smelt 16x ironbar
  4. Gather 4x logs
  5. Craft 2x pickaxe (5x ironbar + 1x logs each = 10 bars, 2 logs)
  6. Craft 2x axe (3x ironbar + 1x logs each = 6 bars, 2 logs)

  DO NOT use complete() until ALL tools are crafted!

max_action_steps: 50

