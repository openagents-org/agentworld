# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets, added 4th agent
# SOURCE: task_30_legendary_boss_hunt.yaml

task:
  name: "Legendary Boss Hunt - Triple Boss Elimination (Harder)"
  description: "Four agents work together to defeat FOUR legendary bosses across different regions"

objectives:
  primary: "Defeat Mermaid, Dark Wolf, Ice Knight, AND Water Guardian in an epic boss hunting expedition"

relevant_game_context: |
  This is a cooperative multi-agent boss hunting scenario with increased difficulty.

  CHALLENGE MODE:
  - Must defeat FOUR legendary bosses (one more than original!)
  - Added Water Guardian as 4th target
  - Added 4th agent (support_hunter_agent) for additional firepower
  - Reduced consumables - manage resources carefully
  - Lower skill levels require precise coordination
  - Longer travel between boss locations

  OBJECTIVE: Complete the ultimate boss hunt - defeat all four legendary bosses.

  TARGET BOSSES (EXPANDED):
  - Mermaid (Level 55): Located at coastal region (580, 755)
  - Dark Wolf (Level 0): Located at dark region (1016, 682)
  - Ice Knight (Level 62): Located at castle region (712, 717)
  - Water Guardian (Level 36): Located at (197, 633) - ADDED!

  TEAM COORDINATION:
  - Plan efficient route between boss locations
  - Manage healing resources across four fights
  - Support each other with healing and damage

  COMBAT STRATEGY:
  - Mermaid: Water-based attacks, use ranged weapons
  - Dark Wolf: Fast attacks, coordinate melee and magic
  - Ice Knight: Freezing attacks, maintain distance
  - Water Guardian: Water attacks, similar to Mermaid

  DO NOT use complete() until ALL FOUR bosses are defeated!

