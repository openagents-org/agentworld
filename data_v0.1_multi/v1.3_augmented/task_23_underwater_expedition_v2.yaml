# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets, added 4th agent
# SOURCE: task_23_underwater_expedition.yaml

task:
  name: "Underwater Expedition - Deep Sea Treasure Hunt (Harder)"
  description: "Four agents work together to explore underwater regions, harvest marine resources, and recover TWO tridents from deep sea treasures"

objectives:
  primary: "Successfully explore underwater regions, harvest 8x jellyfish, 4x clams, and recover 2x tridents from treasure locations"

relevant_game_context: |
  This is a cooperative multi-agent underwater exploration with increased difficulty.

  CHALLENGE MODE:
  - Must recover 2x tridents from underwater treasures (doubled!)
  - Must harvest 8x jellyfish and 4x clams (increased targets)
  - Added 4th agent (coral_explorer_agent) for wider coverage
  - Reduced consumables - manage resources carefully
  - Lower skill levels require more careful coordination

  OBJECTIVE: Explore dangerous underwater regions to recover multiple treasures and marine resources.

  MISSION REQUIREMENTS:
  - Navigate to coastal regions and locate underwater entrances
  - Explore underwater caves and deep sea areas safely
  - Harvest 8x jellyfish and 4x clams from marine areas
  - Locate and recover 2x Tridents from underwater treasure locations
  - Handle Water Guardian and sea creature encounters

  TEAM COORDINATION:
  - Use global chat to share underwater entrance locations and treasure sightings
  - Coordinate between surface support, diving operations, and treasure recovery
  - Multiple divers needed to cover extensive underwater areas
  - Work together to navigate underwater maze-like cave systems

  DO NOT use complete() until ALL objectives are achieved!

  UNDERWATER EXPLORATION & MARINE HARVESTING:
  🐟 Fishing - Jellyfish:
    - harvest_resource on Jellyfish fishing spots
    - Level required: 5+ (Fishing skill)
    - Need 8x total

  🦪 Fishing - Clam:
    - harvest_resource on Clam fishing spots
    - Level required: 10+ (Fishing skill)
    - Need 4x total

  🔱 Treasure Recovery - Trident:
    - Search for underwater treasure chests in deep sea areas
    - Need 2x tridents from different treasure locations
    - Coordinates around (209, 713) area and other underwater zones

  🏊‍♂️ Underwater Combat:
    - Expect Water Guardian (Level 36) and sea creatures
    - Coordinate attacks to handle powerful aquatic enemies

max_action_steps: 48

