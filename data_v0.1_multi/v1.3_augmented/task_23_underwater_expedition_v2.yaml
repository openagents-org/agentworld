# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets, added 4th agent
# SOURCE: task_23_underwater_expedition.yaml

task:
  name: "Underwater Expedition - Marine Harvest (Harder)"
  description: "Four agents work together to harvest marine resources from coastal fishing spots"

objectives:
  primary: "Successfully harvest 10x jellyfish and 6x clams from marine fishing spots"

relevant_game_context: |
  This is a cooperative multi-agent marine fishing expedition with increased difficulty.

  CHALLENGE MODE:
  - Must harvest 10x jellyfish and 6x clams (increased targets)
  - Added 4th agent (coral_explorer_agent) for wider coverage
  - Reduced consumables - manage resources carefully
  - Lower skill levels require more careful coordination

  OBJECTIVE: Harvest marine resources from coastal fishing spots.

  MISSION REQUIREMENTS:
  - Navigate to coastal fishing spots
  - Harvest 10x jellyfish (Fishing level 5 required)
  - Harvest 6x clams (Fishing level 10 required)
  - Coordinate fishing across multiple agents

  TEAM COORDINATION:
  - Use global chat to coordinate fishing efforts
  - Multiple fishers work in parallel to meet targets
  - Share fishing spot locations

  DO NOT use complete() until ALL objectives are achieved!

  MARINE HARVESTING:
  Fishing - Jellyfish:
    - harvest_resource on Jellyfish fishing spots
    - Level required: 5+ (Fishing skill)
    - Need 10x total

  Fishing - Clam:
    - harvest_resource on Clam fishing spots
    - Level required: 10+ (Fishing skill)
    - Need 6x total

max_action_steps: 48

