# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_48_cross_region_expedition.yaml

task:
  name: "Cross-Region Expedition - Multi-Biome Gathering (Easier)"
  description: "Five agents with pre-gathered resources complete simplified collection"

objectives:
  primary: "Collect remaining resources with partial pre-gathering done"

relevant_game_context: |
  This is a cooperative multi-agent cross-region scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - forest1_agent starts with 3x logs already gathered
  - mountain1_agent starts with 2x coal already gathered
  - coastal_agent starts with 2x rawshrimp already caught
  - Higher skill levels for faster gathering
  - Only need minimal additional resources

  COLLECTION TARGETS (REDUCED):
  - 5x logs total (have 3, gather 2)
  - 4x coal total (have 2, gather 2)
  - 3x rawshrimp total (have 2, gather 1)

  BIOME LOCATIONS:
  - Forest: 380-400, 0-50
  - Mountain: 200-250, 30-60
  - Coast: 550-600, 700-760

  TEAM COORDINATION:
  - Each team gathers minimal additional resources
  - Quick completion expected

  DO NOT use complete() until all resources are collected!

max_action_steps: 20

