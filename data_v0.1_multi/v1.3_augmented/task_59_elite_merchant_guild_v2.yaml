# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_59_elite_merchant_guild.yaml

task:
  name: "Elite Merchant Guild (Harder)"
  description: "Seven specialists mine and craft expanded guild masterpiece collection"

objectives:
  primary: "Craft 2x Golden Swords, 4x Gold Rings, 3x Lightning Staffs, 2x Pickaxes, and 2x Heavy Swords"

relevant_game_context: |
  This is a cooperative multi-agent guild scenario with increased difficulty.

  CHALLENGE MODE:
  - Massively expanded targets
  - Must mine all ore from scratch
  - Need 90+ gold ore for golden items
  - Need 14+ iron ore for tools
  - Need 90+ coal for smelting
  - Lower skill levels require better coordination
  - Reduced consumables

  PRODUCTION TARGETS (EXPANDED):
  - 2x Golden Sword (15x goldbar + 1x hilt each)
  - 4x Gold Ring (2x goldbar each = 8 bars)
  - 3x Lightning Staff (staff + lightningbead)
  - 2x Pickaxe (5x ironbar + 1x logs each)
  - 2x Heavy Sword (2x ironbar + 1x hilt2 each)

  MATERIAL REQUIREMENTS:
  - 38x goldbar (30 for swords, 8 for rings)
  - 14x ironbar (10 for pickaxes, 4 for swords)
  - 90+ coal for smelting all
  - 8x logs (for sticks and handles)
  - 3x lightningbead
  - 2x hilt, 2x hilt2

  DO NOT use complete() until ALL items are crafted!

max_action_steps: 70

