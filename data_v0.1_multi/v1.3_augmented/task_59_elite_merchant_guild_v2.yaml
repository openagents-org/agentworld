# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_59_elite_merchant_guild.yaml

task:
  name: "Elite Merchant Guild (Harder)"
  description: "Seven specialists mine and craft expanded guild masterpiece collection"

objectives:
  primary: "Craft 2x Gold Rings, 2x Magic Staffs, and 2x Silver Rings"

relevant_game_context: |
  This is a cooperative multi-agent guild scenario with increased difficulty.

  CHALLENGE MODE:
  - Must craft multiple items
  - Materials provided to crafters
  - Lower skill levels require better coordination
  - Reduced consumables

  PRODUCTION TARGETS:
  - 2x Gold Ring (2x goldbar each = 4 goldbar)
  - 2x Magic Staff (5x stick + 1x bead each = 10 sticks, 2 beads)
  - 2x Silver Ring (2x ironbar each = 4 ironbar)

  MATERIALS PROVIDED:
  - Guild_Master: 4x goldbar, 4x ironbar
  - Mystic_Collector: 10x stick, 2x bead

  DO NOT use complete() until ALL items are crafted!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 70

