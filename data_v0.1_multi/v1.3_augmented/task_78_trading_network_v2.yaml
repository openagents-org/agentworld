# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_78_trading_network.yaml

task:
  name: "Trading Network - Full Trade Route (Harder)"
  description: "Ten agents gather large quantities and craft multiple jewelry pieces"

objectives:
  primary: "Collect 20x logs, 16x ironore, 12x goldnugget, and craft 2x Golden Ring and 2x Silver Ring"

relevant_game_context: |
  This is a cooperative multi-agent resource gathering with increased difficulty.

  CHALLENGE MODE:
  - Doubled all gathering targets
  - Must craft 2 of each ring type
  - Lower skill levels
  - Fewer consumables
  - No pre-gathered resources

  COLLECTION TARGETS (DOUBLED):
  - 20x logs (from forest)
  - 16x ironore (from mountain)
  - 12x goldnugget (from mountain)

  PRODUCTION TARGETS (DOUBLED):
  - 2x Golden Ring (2x goldbar each = 4x goldbar)
  - 2x Silver Ring (2x ironbar each = 4x ironbar)

  DO NOT use complete() until ALL objectives are met!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 75

