# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_50_combat_battalion.yaml

task:
  name: "Combat Battalion - Ogre Hunt (Harder)"
  description: "Five warriors face expanded enemy forces in extended combat"

objectives:
  primary: "Defeat 4x Ogres and 6x Goblins in sustained coordinated warfare"

relevant_game_context: |
  This is a cooperative multi-agent combat scenario with increased difficulty.

  CHALLENGE MODE:
  - Doubled targets: 4x Ogres, 6x Goblins
  - Lower combat stats require better tactics
  - Fewer consumables - manage healing carefully
  - Fewer arrows - make shots count
  - Extended engagement requires endurance

  TARGETS (DOUBLED):
  - 4x Ogres (Level 18, 150 HP each)
  - 6x Goblins (Level 7, 90 HP each)

  ENEMY CHARACTERISTICS:
  - Ogres: Strong melee fighters, high HP
  - Goblins: Weaker but numerous

  COMBAT TACTICS:
  - Tank must hold aggro on multiple ogres
  - DPS coordinate focus fire
  - Archer must prioritize targets carefully
  - Mage supports with AoE when possible
  - Manage health resources throughout fight

  DO NOT use complete() until ALL enemies are defeated!

max_action_steps: 50

