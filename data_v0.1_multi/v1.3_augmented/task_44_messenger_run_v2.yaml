# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets, added 4th agent
# SOURCE: task_44_messenger_run.yaml

task:
  name: "Messenger Run - Resource Delivery (Harder)"
  description: "Four agents work together to gather and deliver expanded resource list"

objectives:
  primary: "Gather 6x logs, 4x coal, and 3x ironore - deliver all to coordinator"

relevant_game_context: |
  This is a cooperative multi-agent delivery scenario with increased difficulty.

  CHALLENGE MODE:
  - Doubled resource targets
  - Added iron ore requirement
  - Added 4th agent (runner_agent) for additional coverage
  - Reduced consumables - manage carefully
  - Lower skill levels require more gathering attempts

  COLLECTION TARGETS (INCREASED):
  - 6x logs (from Oak trees)
  - 4x coal (from Coal rocks)
  - 3x ironore (from Iron rocks)

  DELIVERY REQUIREMENT:
  - ALL resources must be transferred to coordinator_agent
  - Use transfer_items to hand over materials

  RESOURCE LOCATIONS:
  - Oak trees: Forest regions (380-400, 0-50)
  - Coal/Iron rocks: Mountain regions (200-250, 30-60)

  DO NOT use complete() until coordinator has all resources!

max_action_steps: 40

