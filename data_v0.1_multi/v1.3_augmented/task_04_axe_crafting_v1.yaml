# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, easier completion
# SOURCE: task_04_axe_crafting.yaml

task:
  name: "Cooperative Axe Crafting - Woodcutter Tool Production (Easier)"
  description: "Three agents work together to mine, smelt, and forge an axe - with pre-smelted materials"

# Task objectives
objectives:
  primary: "Create an axe through coordinated mining, smelting, and smithing"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent tool crafting scenario requiring mining and smithing skills.

  STARTING ADVANTAGE:
  - smith_agent already has 2x ironbar (pre-smelted!)
  - lumberjack_agent has 2x logs (extra wood)
  - Only need 1 more ironbar to complete the axe
  - Higher skill levels across all agents

  OBJECTIVE: Work together to create an axe through coordinated resource gathering and metalworking.

  TEAM COORDINATION NOTES:
  - Each agent starts with generous materials
  - smith_agent is almost ready to craft - just needs 1 more ironbar and logs
  - Use global chat to communicate and coordinate with teammates
  - Consider using transfer_items to move materials between agents when needed

  IMPORTANT CONSIDERATIONS:
  - smith_agent needs 3x ironbar + 1x logs for axe
  - smith_agent already has 2x ironbar - only needs 1 more!
  - miner_agent can smelt additional ironbar if needed

  DO NOT use complete() until ALL objectives are achieved by the team!

  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  🔥 Smelting Recipe - ironbar:
    - craft_item skill=Smelting itemKey=ironbar
    - Materials: 1x ironore + 1x coal → 1x ironbar
    - Level required: 20 (uses Smithing skill level)

  🪓 Smithing Recipe - axe:
    - craft_item skill=Smithing itemKey=axe
    - Materials: 3x ironbar + 1x logs → 1x axe
    - Level required: 1 (Smithing skill)

# Limitations
max_action_steps: 20

