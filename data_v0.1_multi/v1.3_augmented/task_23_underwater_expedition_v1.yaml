# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_23_underwater_expedition.yaml

task:
  name: "Underwater Expedition - Deep Sea Treasure Hunt (Easier)"
  description: "Three agents work together with pre-gathered marine resources to explore underwater and harvest additional jellyfish"

objectives:
  primary: "Successfully explore underwater regions and harvest 4x jellyfish with pre-gathered starting supplies"

relevant_game_context: |
  This is a cooperative multi-agent underwater exploration with reduced difficulty.

  STARTING ADVANTAGE:
  - marine_harvester_agent starts with 2x jellyfish already gathered
  - treasure_hunter_agent starts with 1x clam
  - Higher skill levels for safer exploration
  - More consumables for extended survival
  - Reduced target: only need 4x jellyfish total (have 2, need 2 more)
  - No trident required - focus on marine harvesting

  OBJECTIVE: Gather additional marine resources to reach 4x jellyfish total.

  MISSION REQUIREMENTS:
  - Navigate to coastal regions and locate underwater entrances
  - Harvest additional jellyfish (2 more needed)
  - Keep all team members safe during exploration

  TEAM COORDINATION:
  - Use global chat to share underwater entrance locations
  - Coordinate fishing operations for efficient harvesting
  - Share marine resources and provide mutual assistance

  DO NOT use complete() until 4x jellyfish objective is achieved!

  UNDERWATER EXPLORATION & MARINE HARVESTING:
  🐟 Fishing - Jellyfish:
    - harvest_resource on Jellyfish fishing spots to get jellyfish
    - Level required: 5+ (Fishing skill)
    - Tool required: Fishing rod
    - Location: Underwater and coastal areas

max_action_steps: 20

