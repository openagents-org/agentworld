  description: "Three agents work together with enhanced equipment to defeat two legendary bosses"

objectives:
  primary: "Defeat the Mermaid at (580, 755) and Dark Wolf at (1016, 682) with enhanced combat capabilities"

relevant_game_context: |
  This is a cooperative multi-agent boss hunting scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - Higher skill levels for elite combat
  - More consumables for sustained fighting
  - Only need to defeat TWO bosses (not three!)
  - Ice Knight is NOT required
  - Enchanted equipment for extra damage
  - Pre-positioned near first boss

  OBJECTIVE: Defeat two legendary bosses across different regions.

  TARGET BOSSES (REDUCED):
  - Mermaid (Level 55): Located at coastal region (580, 755)
  - Dark Wolf (Level 0): Located at dark region (1016, 682)
  - Ice Knight: SKIPPED in this variant

  TEAM COORDINATION:
  - Use global chat to coordinate boss locations and timing
  - Share healing items between fights
  - Rest and resupply between boss encounters

  COMBAT STRATEGY:
  - Mermaid: Water-based attacks, use ranged weapons
  - Dark Wolf: Fast attacks, coordinate melee and magic

  DO NOT use complete() until BOTH bosses are defeated!

