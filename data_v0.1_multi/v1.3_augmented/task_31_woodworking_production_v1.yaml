# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_31_woodworking_production.yaml

task:
  name: "Woodworking Production - Bow and Arrow Workshop (Easier)"
  description: "Three agents work together with pre-gathered logs to produce archery equipment"

objectives:
  primary: "Craft 1x Wooden Bow and 10x Arrows using pre-gathered materials"

relevant_game_context: |
  This is a cooperative multi-agent crafting scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - lumberjack_agent starts with 4x logs already gathered
  - fletcher_agent has extra feathers (20x) and string (3x)
  - Higher skill levels for faster crafting
  - Only need to harvest 2 additional logs

  PRODUCTION TARGETS:
  - Have 6x logs total (4 pre-gathered + 2 harvested)
  - Craft 1x Wooden Bow
  - Craft 10x Arrows

  CRAFTING RECIPES:
  - Fletching: 1x logs → 4x stick
  - Fletching: 1x logs + 1x string → 1x Wooden Bow
  - Fletching: 10x stick + 10x feather → 10x Arrow

  DO NOT use complete() until all items are crafted!

max_action_steps: 18

