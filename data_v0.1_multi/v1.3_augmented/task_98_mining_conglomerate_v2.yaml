# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_98_mining_conglomerate.yaml

task:
  name: "Mining Conglomerate - Industrial Scale (Harder)"
  description: "Ten agents mine ore and craft metal products at industrial scale"

objectives:
  primary: "Mine 16x ironore, 12x coal, smelt 12x ironbar, and craft 4x Heavy Sword"

relevant_game_context: |
  This is a cooperative multi-agent mining scenario with maximum difficulty.

  CHALLENGE MODE:
  - Doubled mining targets
  - Quadrupled weapon production
  - Lower skill levels
  - Fewer consumables

  PRODUCTION TARGETS (DOUBLED):
  - 16x ironore (from mountain)
  - 12x coal (from mountain)
  - 12x ironbar (smelted)
  - 4x Heavy Sword (2x ironbar + hilt2 each)

  MATERIALS NEEDED:
  - 8x ironbar for swords
  - 4x hilt2 for swords

  LOCATIONS:
  - Mountain Mining: Around (230, 40)

  DO NOT use complete() until all objectives are met!

max_action_steps: 65

