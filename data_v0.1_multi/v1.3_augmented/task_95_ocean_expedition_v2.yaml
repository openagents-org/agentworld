task:
  name: "Ocean Expedition - Deep Sea Gauntlet (Harder)"
  description: "Ten agents fish, defeat multiple sea creatures, and cook"

objectives:
  primary: "Catch 14x rawshrimp, defeat Mermaid at (580, 755) and Hermit Crab Warrior at (224, 359), and cook 8x Cooked Shrimp"

relevant_game_context: |
  This is a cooperative multi-agent ocean expedition with maximum difficulty.

  CHALLENGE MODE:
  - Doubled fishing and cooking targets
  - TWO bosses to defeat
  - Lower combat stats
  - Fewer consumables

  PRODUCTION TARGETS (INCREASED):
  - 14x rawshrimp (from fishing)
  - Defeat Mermaid AND Hermit Crab Warrior
  - 8x Cooked Shrimp (from cooking)

  COMBAT TARGETS:
  - Mermaid (Level 55) at (580, 755)
  - Hermit Crab Warrior (Level 30) at (224, 359)

  LOCATIONS:
  - Fishing: Coastal (580, 750)

  DO NOT use complete() until all objectives are met!

max_action_steps: 60

