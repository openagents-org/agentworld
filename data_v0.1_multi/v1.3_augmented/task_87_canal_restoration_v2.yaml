# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_87_canal_restoration.yaml

task:
  name: "Canal Restoration - Full Infrastructure (Harder)"
  description: "Ten agents gather resources for major canal restoration"

objectives:
  primary: "Collect 10x logs, 12x ironore, 8x rawshrimp, and craft 4x Pickaxe"

relevant_game_context: |
  This is a cooperative multi-agent gathering scenario with maximum difficulty.

  CHALLENGE MODE:
  - Quadrupled pickaxe production
  - Increased gathering across all resources
  - Lower skill levels
  - Fewer consumables

  PRODUCTION TARGETS (DOUBLED):
  - 10x logs (from forest)
  - 12x ironore (from mountain)
  - 8x rawshrimp (from fishing)
  - 4x Pickaxe (5x ironbar + 1x logs each)

  MATERIALS NEEDED:
  - 20x ironbar for pickaxes
  - 4x logs for pickaxe handles

  TEAM ROLES:
  - Loggers: Harvest logs
  - Miners: Extract ore
  - Fishers: Catch shrimp
  - Crafter: Make pickaxes

  DO NOT use complete() until all objectives are met!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 62

