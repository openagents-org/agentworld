# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets, added 4th agent
# SOURCE: task_29_castle_siege.yaml

task:
  name: "Castle Siege Warfare - Fortress Assault & Defense (Harder)"
  description: "Four agents work together to defeat Ice Knight and secure full fortress control"

objectives:
  primary: "Successfully defeat Ice Knight, clear fortress defenders, and secure complete castle control"

relevant_game_context: |
  This is a cooperative multi-agent siege warfare mission with increased difficulty.

  CHALLENGE MODE:
  - Must defeat Ice Knight (Level 62) - main objective
  - Must also clear at least 3 fortress defenders/creatures
  - Must secure strategic positions within the fortress
  - Added 4th agent (siege_support_agent) for comprehensive assault
  - Reduced consumables - manage resources carefully
  - Lower skill levels require tactical coordination

  OBJECTIVE: Complete full castle siege - defeat Ice Knight and secure fortress.

  MISSION REQUIREMENTS:
  - Approach castle and conduct reconnaissance
  - Defeat Ice Knight (Level 62) at (712, 717)
  - Clear at least 3 additional fortress defenders
  - Secure strategic control of castle stronghold
  - Keep all team members alive

  TEAM COORDINATION:
  - Coordinate between Ice Knight combat and defender clearing
  - siege_support_agent assists with both objectives
  - Share healing items across multiple encounters

  DO NOT use complete() until ALL objectives achieved!

  FORTRESS CHALLENGES:
  ⚔️ Ice Knight (Level 62) at (712, 717):
    - Elite commander - main target
    - Heavy armor and ice attacks
    - Requires full team coordination

  🛡️ Fortress Defenders:
    - Clear 3+ additional fortress creatures
    - May include guards, wolves, or other defenders
    - Clear before or after Ice Knight based on strategy

max_action_steps: 52

