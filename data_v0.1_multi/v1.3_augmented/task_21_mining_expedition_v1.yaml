# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_21_mining_expedition.yaml

task:
  name: "Deep Mining Expedition - Precious Metal Extraction (Easier)"
  description: "Three agents work together with pre-gathered materials to craft a golden ring with reduced requirements"

objectives:
  primary: "Successfully craft a golden ring using pre-gathered gold ore and coal"

relevant_game_context: |
  This is a cooperative multi-agent mining expedition with reduced difficulty.

  STARTING ADVANTAGE:
  - ore_prospector_agent starts with 2x goldore already mined
  - fuel_gatherer_agent starts with 2x coal for smelting
  - Higher skill levels for faster processing
  - More consumables for safety

  OBJECTIVE: Use pre-gathered materials to craft a golden ring efficiently.

  MISSION REQUIREMENTS:
  - Use existing gold ore and coal to smelt 2x Gold Bars
  - Craft a Golden Ring as proof of successful mining operation
  - Coordinate material transfers between team members

  TEAM COORDINATION:
  - Use global chat to coordinate material transfers
  - Share materials efficiently between agents
  - Work together to optimize crafting workflow

  DO NOT use complete() until the golden ring is crafted!

  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  Smelting Recipe - goldbar:
    - craft_item skill=Smelting itemKey=goldbar
    - Materials: 1x goldore + 1x coal → 1x goldbar
    - Level required: Smelting skill

  Smithing Recipe - goldring:
    - craft_item skill=Smithing itemKey=goldring
    - Materials: 2x goldbar → 1x goldring
    - Level required: Smithing level 1

max_action_steps: 18

