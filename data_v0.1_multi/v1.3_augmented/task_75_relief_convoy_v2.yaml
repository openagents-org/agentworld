# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_75_relief_convoy.yaml

task:
  name: "Relief Convoy - Extended Supply Run (Harder)"
  description: "Ten agents gather and prepare large supply shipment"

objectives:
  primary: "Cook 12x Cooked Shrimp, craft 4x Pickaxe, and collect 16x logs"

relevant_game_context: |
  This is a cooperative multi-agent supply preparation with increased difficulty.

  CHALLENGE MODE:
  - Doubled all targets
  - Must catch all fish from scratch
  - Must mine iron for pickaxes
  - Lower skill levels
  - Fewer consumables

  PRODUCTION TARGETS (DOUBLED):
  - 12x Cooked Shrimp (cook 12x rawshrimp)
  - 4x Pickaxe (5x ironbar + 1x logs each = 20x ironbar, 4x logs)
  - 16x logs (from forest)

  MATERIAL REQUIREMENTS:
  - 12x rawshrimp (fishing at coast)
  - 20x ironbar = 20x ironore + 20x coal
  - 16+ logs (for objective + pickaxe handles)

  DO NOT use complete() until ALL supplies are ready!

max_action_steps: 140

