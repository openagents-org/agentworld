# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_40_healing_supplies.yaml

task:
  name: "Healing Supplies - Cooked Food Production (Easier)"
  description: "Three agents work together with pre-caught shrimp to cook healing food"

objectives:
  primary: "Cook 3x cookedshrimp using pre-caught raw shrimp"

relevant_game_context: |
  This is a cooperative multi-agent fishing and cooking scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - fisher1_agent starts with 2x rawshrimp
  - fisher2_agent starts with 1x rawshrimp
  - Higher skill levels for guaranteed catches
  - Reduced target: only 3x cookedshrimp needed
  - Only need to catch 0 more shrimp (3 already have)

  PRODUCTION CHAIN:
  1. Transfer raw shrimp to cook_agent
  2. Cook 3x cookedshrimp (1x rawshrimp → 1x cookedshrimp)

  TEAM COORDINATION:
  - Fishers transfer shrimp to cook
  - Cook processes all shrimp

  DO NOT use complete() until shrimp are cooked!

max_action_steps: 15

