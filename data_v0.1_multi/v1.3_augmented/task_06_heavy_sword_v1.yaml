# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, easier completion
# SOURCE: task_06_heavy_sword.yaml

task:
  name: "Cooperative Heavy Sword Forging - Warrior Weapon Crafting (Easier)"
  description: "Three agents work together to create a heavy sword - with pre-smelted materials and hilt ready"

# Task objectives
objectives:
  primary: "Forge a heavy sword through coordinated material processing and weapon smithing"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent weapon crafting scenario requiring advanced metallurgy and smithing.

  STARTING ADVANTAGE:
  - weapon_smith_agent already has 1x hilt2 (pre-crafted!)
  - smelter_agent has 2x ironbar ready (enough for the sword!)
  - miner_agent has extra materials for backup
  - Higher skill levels across all agents

  OBJECTIVE: Forge a heavy sword with pre-processed components.

  SIMPLIFIED STRATEGY:
  - weapon_smith_agent already has hilt2
  - smelter_agent transfers 2x ironbar to weapon_smith_agent
  - weapon_smith_agent forges the heavy sword immediately

  TEAM COORDINATION:
  - Use global chat to coordinate the simple transfer
  - smelter_agent sends 2x ironbar to weapon_smith_agent
  - weapon_smith_agent crafts sword2 (heavy sword)

  DO NOT use complete() until ALL objectives are achieved by the team!

  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  ⚔️ Smithing Recipe - sword2 (heavy sword):
    - craft_item skill=Smithing itemKey=sword2
    - Materials: 2x ironbar + 1x hilt2 → 1x heavy sword
    - Level required: 1 (Smithing skill)
    - weapon_smith_agent has hilt2, just needs 2x ironbar!

# Limitations
max_action_steps: 20

