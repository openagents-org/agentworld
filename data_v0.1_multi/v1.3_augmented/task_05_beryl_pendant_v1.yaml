# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, easier completion
# SOURCE: task_05_beryl_pendant.yaml

task:
  name: "Cooperative Beryl Pendant Crafting - Elegant Jewelry (Easier)"
  description: "Three agents work together to create a beryl pendant - with pre-gathered string materials"

# Task objectives
objectives:
  primary: "Create a beryl pendant by combining beryl gem with crafted string"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent jewelry crafting scenario requiring both foraging and mining skills.

  STARTING ADVANTAGE:
  - jeweler_agent already has 1x string (pre-crafted!)
  - gem_miner_agent has the beryl gem ready
  - forager_agent has extra bluelily for backup
  - Higher skill levels across all agents

  OBJECTIVE: Create a beryl pendant by combining beryl gem with string.

  SIMPLIFIED STRATEGY:
  - jeweler_agent already has string - just needs the beryl gem!
  - gem_miner_agent transfers beryl to jeweler_agent
  - jeweler_agent crafts the beryl pendant immediately

  TEAM COORDINATION:
  - Use global chat to coordinate the simple transfer
  - gem_miner_agent sends beryl to jeweler_agent
  - jeweler_agent crafts berylpendant

  DO NOT use complete() until ALL objectives are achieved by the team!

  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  📿 Crafting Recipe - beryl pendant:
    - craft_item skill=Crafting itemKey=berylpendant
    - Materials: 1x beryl + 1x string → 1x beryl pendant
    - Level required: 1 (Crafting skill)
    - jeweler_agent has both materials available!

# Limitations
max_action_steps: 20

