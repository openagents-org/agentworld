# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_53_culinary_expedition.yaml

task:
  name: "Culinary Expedition - Seafood Feast (Harder)"
  description: "Five agents catch and cook expanded seafood menu from scratch"

objectives:
  primary: "Cook 8x Cooked Shrimp, 4x Tuna Sushi, and 2x Jellyfish Smoothie"

relevant_game_context: |
  This is a cooperative multi-agent cooking scenario with increased difficulty.

  CHALLENGE MODE:
  - Doubled all targets
  - Must catch all fish from scratch
  - Lower skill levels require more attempts
  - Need more kelp for sushi

  PRODUCTION TARGETS (DOUBLED):
  - 8x Cooked Shrimp (cook 8x rawshrimp)
  - 4x Tuna Sushi (cook 4x rawtuna + 4x kelp)
  - 2x Jellyfish Smoothie (cook 2x jellyfish)

  FISHING REQUIREMENTS:
  - 8x Raw Shrimp: Level 1 fishing
  - 4x Raw Tuna: Level 1 fishing
  - 2x Jellyfish: Level 5 fishing

  COOKING RECIPES:
  - Cooked Shrimp: 1x rawshrimp (Cooking Level 1)
  - Tuna Sushi: 1x rawtuna + 1x kelp (Cooking Level 20)
  - Jellyfish Smoothie: 1x jellyfish (Cooking Level 10)

  DO NOT use complete() until ALL food is cooked!

max_action_steps: 55

