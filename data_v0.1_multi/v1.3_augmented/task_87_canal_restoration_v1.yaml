# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets
# SOURCE: task_87_canal_restoration.yaml

task:
  name: "Canal Restoration - Quick Build (Easier)"
  description: "Ten agents gather resources with pre-gathered materials"

objectives:
  primary: "Collect 4x logs, 5x ironore, 3x rawshrimp, and craft 1x Pickaxe"

relevant_game_context: |
  This is a cooperative multi-agent gathering scenario with reduced difficulty.

  STARTING ADVANTAGE:
  - logger1_agent has 3x logs pre-gathered
  - miner1_agent has 3x ironore pre-gathered
  - fisher1_agent has 2x rawshrimp pre-gathered
  - Only 1 pickaxe to craft
  - Higher skill levels

  PRODUCTION TARGETS (REDUCED):
  - 4x logs (from forest) - 3 already gathered!
  - 5x ironore (from mountain) - 3 already gathered!
  - 3x rawshrimp (from fishing) - 2 already gathered!
  - 1x Pickaxe (5x ironbar + 1x logs)

  TEAM ROLES:
  - Loggers: Harvest logs
  - Miners: Extract ore
  - Fishers: Catch shrimp
  - Crafter: Make pickaxe

  DO NOT use complete() until all objectives are met!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 22

