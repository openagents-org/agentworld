# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets, added 4th agent
# SOURCE: task_37_survival_gathering.yaml

task:
  name: "Survival Gathering - Food and Resource Collection (Harder)"
  description: "Four agents work together to gather extensive survival resources"

objectives:
  primary: "Collect 10x blueberry, 6x corn, 8x logs, and 4x tomato through coordinated gathering"

relevant_game_context: |
  This is a cooperative multi-agent survival gathering scenario with increased difficulty.

  CHALLENGE MODE:
  - Increased targets: 10x blueberry, 6x corn, 8x logs
  - Added new resource: 4x tomato
  - No pre-gathered materials
  - Added 4th agent (gatherer_agent) for wider coverage
  - Reduced consumables - manage resources carefully

  COLLECTION TARGETS (INCREASED):
  - 10x blueberry (Level 1 foraging)
  - 6x corn (Level 5 foraging)
  - 8x logs (Level 1 lumberjacking)
  - 4x tomato (Level 15 foraging) - NEW!

  RESOURCE LOCATIONS:
  - Blueberry bushes: Found in forest edges and clearings
  - Corn: Found in farming areas
  - Oak trees: Forest regions (380-400, 0-50)
  - Tomato: Garden areas

  DO NOT use complete() until all resources are collected!

max_action_steps: 45

