# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, full crafting chain required
# SOURCE: task_10_cooking_stew.yaml

task:
  name: "Cooperative Stew Cooking - Culinary Team Production (Harder)"
  description: "Three agents work together to prepare THREE hearty stews through complete container crafting and ingredient gathering"

# Task objectives
objectives:
  primary: "Prepare THREE delicious stews through coordinated container crafting, ingredient gathering, and cooking"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent culinary scenario requiring food preparation expertise.

  CHALLENGE MODE:
  - Must prepare THREE stews (tripled target!)
  - chef_agent has NO pre-made materials - full chain required
  - Must craft bowls from logs/sticks AND gather all ingredients
  - Reduced consumables - manage resources carefully

  OBJECTIVE: Prepare 3x stews through complete culinary production chain.

  REQUIRED MATERIALS FOR 3 STEWS:
  - 3x bowl (provided)
  - 3x mushroom (must forage)
  - 3x corn (must forage)

  WORKFLOW:
  1. Forager gathers 3x mushroom and 3x corn
  2. Transfer ingredients to chef
  3. Cook 3x stew

  DO NOT use complete() until 3x stew is cooked!

  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  🍄 Foraging - mushrooms and vegetables:
    - harvest_resource on mushroom instances to get mushroom
    - harvest_resource on corn instances to get corn
    - Level required: varies (Foraging skill)

  🍲 Cooking Recipe - stew:
    - craft_item skill=Cooking itemKey=stew
    - Materials: 1x bowl + 1x mushroom + 1x corn → 1x stew
    - Level required: 1 (Cooking skill)

# Limitations
max_action_steps: 40

