# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_54_archery_academy.yaml

task:
  name: "Archery Academy - Equipment Production (Harder)"
  description: "Five agents produce expanded archery equipment from scratch"

objectives:
  primary: "Craft 4x Wooden Bows and 20x Arrows through full production chain"

relevant_game_context: |
  This is a cooperative archery equipment production with increased difficulty.

  CHALLENGE MODE:
  - Doubled bow target, doubled arrows
  - Must gather all logs from scratch
  - Lower skill levels require more attempts
  - Need 8+ logs for full production

  PRODUCTION TARGETS (DOUBLED):
  - 4x Wooden Bow (1x logs + 1x string each = 4 logs, 4 string)
  - 20x Arrows (20x stick + 20x feather = 5 logs worth of sticks)

  MATERIAL REQUIREMENTS:
  - 8+ logs (4 for bows, 5+ for 20 sticks)
  - 4x string (provided)
  - 20x feather (provided)

  CRAFTING CHAIN:
  - Harvest logs → craft sticks → craft arrows
  - Harvest logs → craft bows

  DO NOT use complete() until ALL archery items are ready!

max_action_steps: 55

