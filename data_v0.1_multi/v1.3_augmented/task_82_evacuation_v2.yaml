# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets
# SOURCE: task_82_evacuation.yaml

task:
  name: "Evacuation - Full Equipment (Harder)"
  description: "Ten agents collect resources and craft multiple tools for evacuation"

objectives:
  primary: "Collect 12x logs, 10x ironore, and craft 4x Axe"

relevant_game_context: |
  This is a cooperative multi-agent resource gathering with maximum difficulty.

  CHALLENGE MODE:
  - Doubled axe production
  - Increased material requirements
  - Lower skill levels
  - Fewer consumables

  PRODUCTION TARGETS (DOUBLED):
  - 12x logs (from forest)
  - 10x ironore (from mountain)
  - 4x Axe (3x ironbar + 1x logs each)

  MATERIALS NEEDED:
  - 12x ironbar total for axes
  - 4x logs for axe handles

  TEAM ROLES:
  - Loggers: Gather logs
  - Miners: Extract iron ore
  - Smith: Craft axes

  DO NOT use complete() until all objectives are met!
  ORE TYPE REFERENCE (CRITICAL - different rocks give different ores):
  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10+)
  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)
  - Gold Rock (around 141, 5): gives "goldnugget" (requires mining level 25+)
  - Coal Rock: gives "coal" (requires mining level 1)


max_action_steps: 58

