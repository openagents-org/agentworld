# AgentWorld Multi-Agent Task Configuration

task:
  name: "Elemental Ritual - Item Crafting"
  description: "Ten agents gather materials and craft ritual items"

# Task objectives
objectives:
  primary: "Craft 1x Beryl Pendant, 1x Gold Ring, and collect 6x blueberry"
  secondary:
    - "Mine beryl gems"
    - "Gather blueberries"
    - "Craft jewelry items"
    - "Complete within 40 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent crafting scenario.

  OBJECTIVE: Craft ritual items and gather ingredients.

  PRODUCTION TARGETS:
  - 1x Beryl Pendant (beryl + string)
  - 1x Gold Ring (2x goldbar)
  - 6x blueberry (foraging)

  MATERIALS PROVIDED:
  - Gold bars provided to crafter
  - String provided to crafter

  TEAM ROLES:
  - Miners: Extract beryl gems
  - Foragers: Gather blueberries
  - Crafters: Make jewelry

  DO NOT use complete() until all objectives are met!

# Limitations
max_action_steps: 40

