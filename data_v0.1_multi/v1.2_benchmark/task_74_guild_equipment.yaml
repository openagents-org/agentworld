# AgentWorld Multi-Agent Task Configuration

task:
  name: "Guild Equipment - Crafting Workshop"
  description: "Six guild members craft a complete set of equipment"

# Task objectives
objectives:
  primary: "Craft 2x Heavy Sword, 1x Axe, 1x Wooden Bow, and 2x Silver Ring"
  secondary:
    - "Gather logs for crafting"
    - "Mine ore and smelt bars"
    - "Craft weapons and jewelry"
    - "Complete within 42 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent crafting scenario.

  OBJECTIVE: Produce equipment for the guild.

  PRODUCTION TARGETS:
  - 2x Heavy Sword (2x ironbar + 1x hilt2 each = 4x ironbar, 2x hilt2)
  - 1x Axe (3x ironbar + 1x logs)
  - 1x Wooden Bow (1x logs + 1x string)
  - 2x Silver Ring (2x ironbar each = 4x ironbar)

  TOTAL IRON NEEDED: 11x ironbar
  - Requires 11x ironore + 11x coal

  TEAM ROLES:
  - Lumberjack: Gather logs
  - Miner: Extract ore and coal
  - Smith: Smelt and forge
  - Fletcher: Make bow
  - Crafter: Make rings

  DO NOT use complete() until all equipment is crafted!

# Limitations
max_action_steps: 42

