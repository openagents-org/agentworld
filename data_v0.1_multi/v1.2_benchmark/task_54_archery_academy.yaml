# AgentWorld Multi-Agent Task Configuration

task:
  name: "Archery Academy - Bow and Arrow Production"
  description: "Five agents produce archery equipment including bows and arrows"

# Task objectives
objectives:
  primary: "Craft 2x Wooden Bows and 10x Arrows through coordinated production"
  secondary:
    - "Gather logs and craft sticks"
    - "Produce bows and arrows"
    - "Complete within 38 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent archery equipment production scenario.

  OBJECTIVE: Produce archery equipment for the academy.

  PRODUCTION TARGETS:
  - 2x Wooden Bow (1x logs + 1x string each)
  - 10x Arrows (10x stick + 10x feather = 10x arrows)

  MATERIAL REQUIREMENTS:
  - 4x logs (2 for bows, 2+ for sticks)
  - 2x string (provided)
  - 10x feather (provided)

  CRAFTING RECIPES:
  - 1x logs → 4x stick
  - 1x logs + 1x string → 1x Wooden Bow
  - 10x stick + 10x feather → 10x Arrow

  TEAM ROLES:
  - Lumberjacks: Gather logs
  - Fletchers: Craft sticks, bows, and arrows

  DO NOT use complete() until all archery items are ready!

# Limitations
max_action_steps: 38

