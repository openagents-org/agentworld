# AgentWorld Multi-Agent Task Configuration

task:
  name: "Mining Expedition - Iron Equipment Production"
  description: "Five agents work together to mine ore and craft iron equipment"

# Task objectives
objectives:
  primary: "Mine ore and craft 1x Pickaxe, 1x Axe, and 1x Heavy Sword"
  secondary:
    - "Mine iron ore and coal from mountain region"
    - "Smelt iron bars"
    - "Craft three tools/weapons within 40 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent mining and smithing scenario.

  OBJECTIVE: Produce iron equipment through coordinated mining and crafting.

  PRODUCTION TARGETS:
  - 1x Pickaxe (5x ironbar + 1x logs)
  - 1x Axe (3x ironbar + 1x logs)
  - 1x Heavy Sword (2x ironbar + 1x hilt2)

  MATERIAL REQUIREMENTS:
  - 10x ironore + 10x coal → 10x ironbar
  - 2x logs for tool handles
  - 1x hilt2 (provided to smith)

  TEAM ROLES:
  - 2 Miners: Extract iron ore and coal
  - 1 Lumberjack: Gather logs
  - 1 Smelter: Process ore into bars
  - 1 Smith: Craft final equipment

  DO NOT use complete() until all equipment is crafted!

# Limitations
max_action_steps: 40

