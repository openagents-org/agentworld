# AgentWorld Multi-Agent Task Configuration

task:
  name: "Skill Training - Multi-Craft Production"
  description: "Three agents practice different crafting skills by producing various items"

# Task objectives
objectives:
  primary: "Craft 1x staff, 1x silverring, and produce 10x stick through skill practice"
  secondary:
    - "Gather materials for crafting"
    - "Each agent crafts different item types"
    - "Complete skill training within 30 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent skill training scenario.

  OBJECTIVE: Practice crafting skills by making different items.

  CRAFTING TARGETS:
  - 1x staff (5x stick + 1x bead, Crafting skill)
  - 1x silverring (2x ironbar, Smithing skill)
  - 10x stick (from 3x logs, Fletching skill)

  MATERIAL REQUIREMENTS:
  - 3x logs (for sticks)
  - 1x bead (provided)
  - 2x ironbar (provided)

  TEAM COORDINATION:
  - Lumberjack gathers logs
  - Fletcher makes sticks and staff
  - Smith crafts silver ring

  DO NOT use complete() until all items are crafted!

# Limitations
max_action_steps: 30

