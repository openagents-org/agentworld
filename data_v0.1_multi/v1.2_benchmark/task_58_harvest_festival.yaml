# AgentWorld Multi-Agent Task Configuration

task:
  name: "Harvest Festival - Food and Crafting Celebration"
  description: "Six agents gather ingredients, cook dishes, and craft items for festival"

# Task objectives
objectives:
  primary: "Cook 3x Corn Stew and craft 2x Silver Rings and 1x Wooden Bow"
  secondary:
    - "Gather vegetables and ingredients"
    - "Cook festival dishes"
    - "Craft decorative and utility items"
    - "Complete within 42 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent festival preparation scenario.

  OBJECTIVE: Prepare items for the harvest festival celebration.

  PRODUCTION TARGETS:
  - 3x Corn Stew (cook corn with bowl)
  - 2x Silver Ring (2x ironbar each)
  - 1x Wooden Bow (1x logs + 1x string)

  MATERIAL REQUIREMENTS:
  - 3x corn (foraging)
  - 3x bowl (cooking containers)
  - 4x ironbar (for rings)
  - 1x logs (for bow)
  - 1x string (for bow)

  TEAM ROLES:
  - Foragers: Gather corn and vegetables
  - Chef: Cook the corn stew dishes
  - Jeweler: Craft silver rings
  - Artisan: Craft wooden bow

  DO NOT use complete() until all festival items are ready!

# Limitations
max_action_steps: 42

