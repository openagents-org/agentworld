# AgentWorld Multi-Agent Task Configuration

task:
  name: "Evacuation - Resource Collection and Tool Crafting"
  description: "Ten agents collect resources and craft tools for evacuation"

# Task objectives
objectives:
  primary: "Collect 8x logs, 6x ironore, and craft 2x Axe"
  secondary:
    - "Gather logs from forest"
    - "Mine iron ore"
    - "Craft axes for evacuation"
    - "Complete within 40 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent resource gathering scenario.

  OBJECTIVE: Gather resources and craft tools.

  PRODUCTION TARGETS:
  - 8x logs (from forest)
  - 6x ironore (from mountain)
  - 2x Axe (3x ironbar + 1x logs each)

  MATERIALS NEEDED:
  - 6x ironbar (provided to smith)
  - 2x logs (for axe handles)

  TEAM ROLES:
  - Loggers: Gather logs
  - Miners: Extract iron ore
  - Smith: Craft axes

  DO NOT use complete() until all objectives are met!

# Limitations
max_action_steps: 40

