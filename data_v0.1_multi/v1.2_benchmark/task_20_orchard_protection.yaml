# AgentWorld Multi-Agent Task Configuration

task:
  name: "Orchard Protection Mission - Fruit Grove Team Defense"
  description: "Three agents work together where one guardian protects two collectors gathering orchard fruits from wildlife and pest threats"

# Task objectives
objectives:
  primary: "Successfully protect collectors while they gather 6x blueberry and 3x rawtuna under orchard threat conditions"
  secondary: # checkpoints
    - "Establish effective team communication for threat alerts"
    - "Guardian successfully defends team from hostile wildlife and pests"
    - "Complete orchard resource gathering without casualties within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent orchard protection scenario requiring tactical coordination.
  
  OBJECTIVE: Successfully gather required orchard resources while protecting the team from wildlife and pest threats.
  
  MISSION REQUIREMENTS:
  - Collect 6x blueberry and 3x rawtuna while under potential wildlife and pest threat
  - Keep all team members alive throughout the mission
  - Use teamwork to balance resource gathering with orchard security
  
  TEAM COORDINATION:
  - Establish communication protocols for wildlife and pest detection and warnings
  - Coordinate movements between protection and orchard resource gathering
  - Share information about resource locations and environmental dangers
  - Work together to ensure both safety and mission success
  
  GENERAL STRATEGY:
  - The team has complementary roles in combat, foraging, and fishing
  - Wildlife and pest threats may appear and must be dealt with appropriately
  - Orchard resource gathering requires moving to specific locations
  - Balance efficiency with safety - casualties will cause mission failure
  - Use global chat for real-time coordination and threat alerts
  
  DO NOT use complete() until ALL objectives are achieved safely!
  
  COMBAT MECHANICS (CRITICAL KNOWLEDGE):
  🏹 Combat - Attack threats:
    - Use observe_environment to detect hostile wildlife and pests
    - Use attack command on hostile targets
    - Use bow for ranged combat advantage
  
  🫐 Foraging - blueberry:
    - harvest_resource on blueberry instances to get blueberry
    - Level required: 1+ (Foraging skill)
    - Target: 6x blueberry total
    - IMPORTANT: Look for "Blueberry" bushes in orchard areas!
  
  🐟 Fishing - rawtuna:
    - harvest_resource on tuna fishing spots to get rawtuna
    - Level required: 1+ (Fishing skill)  
    - Target: 3x rawtuna total
    - IMPORTANT: Look for "Tuna" fishing spots near orchard water sources!

# Limitations
max_action_steps: 25

