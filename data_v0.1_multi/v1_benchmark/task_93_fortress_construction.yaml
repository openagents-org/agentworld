# AgentWorld Multi-Agent Task Configuration

task:
  name: "Fortress Construction - Resource Gathering"
  description: "Fifteen agents gather materials for fortress construction"

# Task objectives
objectives:
  primary: "Collect 8x logs, 8x ironore, 6x coal, and craft 2x Heavy Sword and 2x Axe"
  secondary:
    - "Harvest logs from forest"
    - "Mine iron ore and coal"
    - "Craft weapons"
    - "Complete within 50 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent construction scenario.

  OBJECTIVE: Gather materials and craft weapons.

  PRODUCTION TARGETS:
  - 8x logs (from forest)
  - 8x ironore (from mountain)
  - 6x coal (from mountain)
  - 2x Heavy Sword (2x ironbar + hilt2)
  - 2x Axe (3x ironbar + logs)

  MATERIALS PROVIDED:
  - Iron bars and hilts provided to crafter

  LOCATIONS:
  - Forest: Around (388, 10)
  - Mountain: Around (230, 40)

  DO NOT use complete() until all objectives are met!

# Limitations
max_action_steps: 50

