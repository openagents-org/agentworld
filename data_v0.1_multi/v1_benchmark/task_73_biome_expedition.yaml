# AgentWorld Multi-Agent Task Configuration

task:
  name: "Biome Expedition - Multi-Region Combat"
  description: "Eight agents explore biomes, gather resources, and defeat guardians"

# Task objectives
objectives:
  primary: "Collect 6x logs, defeat 2x Goblins, defeat 1x Ogre, and craft 1x Wooden Bow"
  secondary:
    - "Gather resources from forest"
    - "Defeat forest and mountain guardians"
    - "Craft archery equipment"
    - "Complete within 45 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent expedition scenario.

  OBJECTIVE: Explore biomes, defeat guardians, and craft equipment.

  COMBAT TARGETS:
  - 2x Goblins (Level 10-15): Forest area
  - 1x Ogre (Level 28-35): Mountain area

  PRODUCTION TARGETS:
  - 6x logs (from forest)
  - 1x Wooden Bow (1x logs + 1x string)

  LOCATIONS:
  - Forest: Around (250, 350)
  - Mountain: Around (230, 40)

  TEAM ROLES:
  - Forest Team: Gather logs and defeat goblins
  - Mountain Team: Defeat ogre
  - Crafter: Make bow

  DO NOT use complete() until all objectives are met!

# Limitations
max_action_steps: 45

