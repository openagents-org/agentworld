# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cooperative Lightning Staff Enhancement - Advanced Magic Crafting"
  description: "Three agents work together to create an enhanced lightning staff through basic staff crafting and magical enhancement"

# Task objectives
objectives:
  primary: "Create a lightning staff through coordinated magic staff creation and elemental enhancement"
  secondary: # checkpoints
    - "Coordinate basic magic staff production and enhancement materials"
    - "Execute advanced magical enhancement techniques"
    - "Complete high-level magic weapon crafting within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent advanced magic crafting scenario requiring elemental materials.
  
  OBJECTIVE: Create a lightning staff through coordinated basic magic staff creation and advanced elemental enhancement.
  
  TEAM COORDINATION:
  - Use global chat to share locations of magical and elemental resources
  - Coordinate between basic crafting and advanced magical enhancement
  - Share materials and magical components for weapon enhancement
  - Work together to complete high-level magic weapon crafting
  
  GENERAL STRATEGY:
  - The team needs to create a basic magic staff foundation
  - Someone needs to gather rare elemental materials for enhancement
  - Advanced magical enhancement requires combining basic staff with elemental components
  - Final enhancement requires advanced crafting expertise and magical knowledge
  - Coordinate basic crafting with specialized magical enhancement operations
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  🪄 Fletching Recipe - stick:
    - craft_item skill=Fletching itemKey=stick
    - Materials: 1x logs → 4x stick
    - Level required: 1 (Fletching skill)
  
  ⚡ Crafting Recipe - staff:
    - craft_item skill=Crafting itemKey=staff
    - Materials: 5x stick + 1x bead → 1x staff
    - Level required: 1 (Crafting skill)
  
  ⚡ Crafting Recipe - lightningstaff:
    - craft_item skill=Crafting itemKey=lightningstaff
    - Materials: 1x staff + 1x lightningbead → 1x lightningstaff
    - Level required: 10 (Crafting skill) - ADVANCED!

# Limitations
max_action_steps: 25

