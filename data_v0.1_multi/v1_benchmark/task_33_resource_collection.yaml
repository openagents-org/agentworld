# AgentWorld Multi-Agent Task Configuration

task:
  name: "Resource Collection - Multi-Material Gathering"
  description: "Three agents work together to gather diverse resources from different regions"

# Task objectives
objectives:
  primary: "Collect 4x logs, 3x coal, and 2x copperore through coordinated gathering"
  secondary:
    - "Gather wood from oak trees"
    - "Mine coal and copper from rock deposits"
    - "Complete collection within 28 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent resource gathering scenario.

  OBJECTIVE: Gather multiple resource types from different locations.

  COLLECTION TARGETS:
  - 4x logs (from Oak trees)
  - 3x coal (from Coal rocks)
  - 2x copperore (from Copper rocks)

  RESOURCE LOCATIONS:
  - Oak trees: Forest regions (380-400, 0-50)
  - Coal rocks: Mountain regions (200-250, 30-60)
  - Copper rocks: Mountain regions (200-250, 30-60)

  TEAM COORDINATION:
  - Lumberjack focuses on gathering logs
  - Miner focuses on coal and copper
  - Use global chat to coordinate and share progress

  DO NOT use complete() until all resources are collected!

# Limitations
max_action_steps: 28

