# AgentWorld Multi-Agent Task Configuration

task:
  name: "Trading Network - Resource Exchange"
  description: "Ten agents gather resources from regions and craft items"

# Task objectives
objectives:
  primary: "Collect 10x logs, 8x ironore, 6x goldore, and craft 1x Golden Ring and 1x Silver Ring"
  secondary:
    - "Gather logs from forest"
    - "Mine iron and gold ore"
    - "Smelt bars and craft rings"
    - "Complete within 45 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent resource gathering scenario.

  OBJECTIVE: Gather resources and craft jewelry.

  PRODUCTION TARGETS:
  - 10x logs (from forest)
  - 8x ironore (from mountain)
  - 6x goldore (from mountain)
  - 1x Golden Ring (2x goldbar)
  - 1x Silver Ring (2x ironbar)

  TEAM ROLES:
  - Loggers: Gather logs from forest
  - Miners: Extract iron and gold ore
  - Smelter: Smelt bars
  - Crafter: Make rings

  DO NOT use complete() until all objectives are met!

# Limitations
max_action_steps: 45

