# AgentWorld Multi-Agent Task Configuration

task:
  name: "Beacon Calibration - Elemental Crafting"
  description: "Ten agents craft elemental items for beacon calibration"

# Task objectives
objectives:
  primary: "Craft 1x Beryl Pendant, 1x Lightning Staff, and collect 8x logs and 6x icelogs"
  secondary:
    - "Gather logs from forest"
    - "Gather ice logs from ice region"
    - "Craft pendant and staff"
    - "Complete within 42 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent crafting scenario.

  OBJECTIVE: Craft elemental items and gather materials.

  PRODUCTION TARGETS:
  - 8x logs (from forest)
  - 6x icelogs (from ice region)
  - 1x Beryl Pendant (beryl + string)
  - 1x Lightning Staff (staff + lightningbead)

  MATERIALS PROVIDED:
  - Beryl and string provided to crafter
  - Lightning bead provided to crafter

  LOCATIONS:
  - Forest: Around (388, 10)
  - Ice Region: Around (259, 151)

  TEAM ROLES:
  - Forest Loggers: Harvest logs
  - Ice Loggers: Harvest ice logs
  - Crafters: Make items

  DO NOT use complete() until all objectives are met!

# Limitations
max_action_steps: 42

