# AgentWorld Multi-Agent Task Configuration

task:
  name: "Magical Academy Defense - Elemental Staff Creation & Boss Battle"
  description: "Three agents work together to craft a powerful lightning staff and defend against a dangerous Ice Wizard threat"

# Task objectives
objectives:
  primary: "Craft a Lightning Staff and successfully defeat an Ice Wizard in coordinated magical combat"
  secondary: # checkpoints
    - "Establish magical team coordination and resource gathering"
    - "Execute advanced magical crafting with gem enhancement"
    - "Complete boss battle victory within 35 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent magical defense scenario requiring advanced magical coordination.
  
  OBJECTIVE: Create powerful magical equipment and defeat a dangerous Ice Wizard boss through team coordination.
  
  MISSION REQUIREMENTS:
  - Craft a Lightning Staff using advanced magical components
  - Locate and engage an Ice Wizard boss enemy for combat
  - Defeat the Ice Wizard using coordinated magical and physical attacks
  - Ensure all team members survive the dangerous boss encounter
  
  TEAM COORDINATION:
  - Use global chat to share locations of magical components and enemy sightings
  - Coordinate between resource gathering, crafting, and combat preparation
  - Share magical materials and provide combat support during boss fight
  - Work together to balance magical offense with tactical positioning
  
  GENERAL STRATEGY:
  - The team needs to gather rare magical gems (Beryl for lightning enchantment)
  - Someone needs to craft the magical staff using advanced fletching skills
  - Combat coordination essential for surviving high-level magical boss
  - Coordinate crafting completion with boss location and engagement timing
  - Balance magical preparation with combat readiness and positioning
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  MAGICAL CRAFTING & COMBAT (CRITICAL KNOWLEDGE):
  🌳 Lumberjacking - logs:
    - harvest_resource on Oak Tree instances to get logs
    - Level required: 1+ (Lumberjacking skill)
    - IMPORTANT: Look for "Oak", "Oak2", "Oak3" tree types, NOT Willow trees!
  
  🪄 Fletching Recipe - stick:
    - craft_item skill=Fletching itemKey=stick
    - Materials: 1x logs → 4x stick
    - Level required: 1 (Fletching skill)
  
  💎 Mining - Beryl (RARE GEMS):
    - harvest_resource on Beryl Rock instances to get beryl
    - Level required: 25+ (Mining skill) - ADVANCED MINING!
    - Tool required: High-level pickaxe
    - RARE: Beryl rocks are very scarce, search carefully!
  
  ⚡ Fletching Recipe - lightningstaff:
    - craft_item skill=Fletching itemKey=lightningstaff
    - Materials: 4x stick + 1x beryl → 1x lightningstaff
    - Level required: 35 (Fletching skill) - EXPERT CRAFTING!
  
  🧙‍♂️ Combat - Ice Wizard:
    - Search for Ice Wizard enemies in magical regions and forest areas
    - Ice Wizards are high-level magical bosses with ranged attacks
    - Coordinate attacks: magic vs magic, physical flanking
    - Use terrain and positioning to avoid ice projectiles
    - Expect 150+ HP and powerful freezing attacks
    - Ice Wizards typically found near magical areas around coordinates (400-420, 300-320)

# Limitations
max_action_steps: 35

