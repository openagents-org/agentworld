# AgentWorld Multi-Agent Task Configuration

task:
  name: "Dragon Hunt - Elite Boss Campaign"
  description: "Ten elite warriors hunt multiple bosses across regions"

# Task objectives
objectives:
  primary: "Defeat the Iron Ogre at (238, 48), the Water Guardian at (197, 633), and the Mermaid at (580, 755)"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent boss hunting scenario.

  OBJECTIVE: Defeat three dangerous bosses.

  TARGET BOSSES:
  - Iron Ogre (Level 25): Located at mountain region (238, 48)
  - Water Guardian (Level 36): Located at coastal region (197, 633)
  - Mermaid (Level 55): Located at ocean region (580, 755)

  COMBAT STRATEGY:
  - Full team assaults each boss in sequence
  - Tank players draw aggro
  - DPS focuses damage
  - Supports provide healing

  TEAM ROLES:
  - Tanks: Front-line combat
  - DPS: Deal damage
  - Support: Healing and assistance

  DO NOT use complete() until all bosses are defeated!

# Limitations
max_action_steps: 48

