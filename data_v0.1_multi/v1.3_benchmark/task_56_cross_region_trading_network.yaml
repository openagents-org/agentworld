# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cross-Region Trading Network - Multi-Biome Resource Consolidation"
  description: "Seven agents establish a trading network across five different regions, gathering logs and consolidating iron resources for collaborative smithing"

# Task objectives
objectives:
  primary: "Establish a cross-region trading network to gather resources from 5 different biomes and craft 3x Silver Rings, 2x Axes, and 1x Heavy Sword"

# Context and guidance for agents
relevant_game_context: |
  GOAL SNAPSHOT
  - Seven agents operate in specialized teams: Forest (logs), Mountain (exploration + ironbar transport), Coastal (exploration), and Crafter duo. After gathering logs and consolidating ironbars, meet at Central Hub (528,384) to craft: 3 silver rings, 2 axes, and 1 heavy sword within ~50 rounds.

  CRAFTING REQUIREMENTS (All use Smithing skill)
  - 3x Silver Rings: 6 ironbar total (Smithing L1)
  - 2x Axes: 6 ironbar + 2 logs (Smithing L3)
  - 1x Heavy Sword: 2 ironbar + 1 hilt2 (Smithing L1)
  - TOTAL NEEDED: 14 ironbar, 2 logs, 1 hilt2

  STARTING MATERIALS DISTRIBUTION
  - Mountain_Miner_1: 5 ironbar
  - Mountain_Miner_2: 5 ironbar
  - Crafter_Gold: 4 ironbar, 2 hilt2
  - TOTAL AVAILABLE: 14 ironbar, 2 hilt2 (logs must be gathered)

  PHASE OUTLINE
  1. R1-12 Gather & Explore
     - Forest pair: Harvest 4+ logs from Western Forest (around 250,350) using lumberjacking
     - Mountain pair: Explore Northern Mountain region (around 500,100), verify ironbar inventory
     - Coastal_Forager: Explore Eastern Coast (around 900,400), scout the area
     - Crafters: Prepare at starting location, coordinate via chat

  2. R13-25 Travel + Transfers
     - All teams move toward Central Hub (528,384) using ≤32 tiles per move
     - Post coordinates in chat after each major move
     - Transfer order:
       * Forest → Crafter_Gold (2 logs)
       * Mountain_Miner_1 → Crafter_Gold (5 ironbar)
       * Mountain_Miner_2 → Crafter_Gold (5 ironbar)
     - Use transfer_items with verify_inventory confirmations

  3. R26-40 Crafting (Crafter_Gold executes all smithing)
     - Verify inventory: should have 14 ironbar, 2 logs, 2 hilt2
     - Craft 3x Silver Rings (craft_item skill="Smithing" itemKey="silverring" count=1, repeat 3x)
     - Craft 2x Axes (craft_item skill="Smithing" itemKey="axe" count=1, repeat 2x)
     - Craft 1x Heavy Sword (craft_item skill="Smithing" itemKey="sword2")

  4. R41-50 Verification & Distribution
     - Crafter_Gold verifies: 3 silverring, 2 axe, 1 sword2 in inventory
     - Optionally distribute items to team members
     - All agents report final status via chat
     - Leader calls complete() with summary

  EXECUTION NOTES
  - Forest team: Look for oak trees (tree instances) in forest region, use harvest_resource
  - All movement: Use move_character with x,y coordinates within 32 tiles of current position
  - Transfers: Both players must be within proximity; use transfer_items function
  - Chat regularly to coordinate: "Forest has 3/4 logs", "Moving to (x,y)", "Transfer complete"
  - Crafter_Gold has Smithing:35, sufficient for all recipes (max requirement is L5 for pickaxe)

  BIOME LOCATIONS FOR 5-REGION EXPLORATION
  1. Western Forest: (200-350, 250-450) - Log gathering
  2. Northern Mountains: (400-600, 50-150) - Team exploration
  3. Eastern Coast: (850-950, 350-450) - Coastal exploration
  4. Central Kingdom: (500-560, 350-420) - Trading hub
  5. Southern Desert: (350-450, 650-720) - Optional exploration

  COMPLETION CHECKLIST
  - 4+ logs gathered from Western Forest
  - All 7 agents visited at least 2 different biomes
  - All ironbars consolidated with Crafter_Gold (14 total)
  - Crafted items verified: 3 silver rings, 2 axes, 1 heavy sword
  - Extensive chat coordination throughout all phases
  - Task completed with complete() call including phase summary

# Limitations
max_action_steps: 50

