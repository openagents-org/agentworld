# AgentWorld Multi-Agent Task Configuration

task:
  name: "Tool Production - Pickaxe and Axe Crafting"
  description: "Three agents work together to mine ore, smelt bars, and craft tools"

# Task objectives
objectives:
  primary: "Craft 1x Pickaxe and 1x Axe through coordinated mining and smithing"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent tool crafting scenario.

  OBJECTIVE: Create essential tools through mining and smithing.

  PRODUCTION CHAIN:
  1. Mine 8x ironore from Iron rocks (Level 20 mining)
  2. Mine 8x coal from Coal rocks (Level 1 mining)
  3. Smelt 8x ironbar (1x ironore + 1x coal → 1x ironbar)
  4. Gather 2x logs from Oak trees
  5. Craft 1x pickaxe (5x ironbar + 1x logs)
  6. Craft 1x axe (3x ironbar + 1x logs)

  RESOURCE LOCATIONS:
  - Iron rocks: Mountain regions (200-250, 30-60)
  - Coal rocks: Mountain regions
  - Oak trees: Forest regions (380-400, 0-50)

  TEAM COORDINATION:
  - Miners gather ore and coal
  - Smith smelts and crafts
  - Lumberjack provides logs

  DO NOT use complete() until both tools are crafted!

# Limitations
max_action_steps: 35

