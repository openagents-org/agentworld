# AgentWorld Multi-Agent Task Configuration

task:
  name: "Forest Cleanup - Rat Extermination"
  description: "Three agents work together to clear rats from the forest and gather resources"

# Task objectives
objectives:
  primary: "Defeat 5x Rats and collect 4x blueberry from the forest"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent pest control scenario.

  OBJECTIVE: Clear rats from the forest and gather berries.

  TARGETS:
  - Defeat 5x Rats (Level 1, 34 HP each)
  - Collect 4x blueberry from bushes

  RAT COMBAT:
  - Rats are weak creatures but can swarm
  - Found throughout forest regions
  - Easy to defeat with basic weapons

  RESOURCE LOCATIONS:
  - Blueberry bushes: Forest clearings
  - Rats: Forest floor areas

  TEAM COORDINATION:
  - Hunters clear rats
  - Forager collects berries
  - Work together to cover the area

  DO NOT use complete() until all objectives are met!

# Limitations
max_action_steps: 25

