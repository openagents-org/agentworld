# AgentWorld Multi-Agent Task Configuration

task:
  name: "Combat Training - Goblin Elimination"
  description: "Three agents work together to defeat goblins in coordinated combat"

# Task objectives
objectives:
  primary: "Defeat 4x Goblins through coordinated team combat"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent combat training scenario.

  OBJECTIVE: Defeat goblins through coordinated team attacks.

  TARGETS:
  - Defeat 4x Goblins (Level 7, 90 HP each)
  - Goblins drop: leather armor, leather boots, plastic bow

  COMBAT TACTICS:
  - Tank agent draws aggro and absorbs damage
  - DPS agents deal damage from flanking positions
  - Support provides ranged backup

  GOBLIN LOCATIONS:
  - Wilderness regions around (400-500, 300-400)
  - Goblins are aggressive and will attack on sight

  DO NOT use complete() until all goblins are defeated!

# Limitations
max_action_steps: 25

