# AgentWorld Multi-Agent Task Configuration

task:
  name: "Caravan Escort - Protected Gathering"
  description: "Three agents protect a gatherer while they collect valuable resources"

# Task objectives
objectives:
  primary: "Protect gatherer while they collect 3x goldore and defeat any 2x threats"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent escort and protection scenario.

  OBJECTIVE: Protect miner while they extract gold ore.

  TARGETS:
  - Miner collects 3x goldore from Gold rocks
  - Guards defeat at least 2x hostile creatures
  - All agents survive

  GOLD LOCATIONS:
  - Gold rocks: Mountain regions (200-250, 30-60)
  - Hostile creatures may spawn in the area

  COMBAT:
  - Guards engage any threats to protect miner
  - Use ranged attacks to intercept enemies early
  - Miner should focus on mining, not combat

  TEAM COORDINATION:
  - Miner focuses on gold extraction
  - Guards patrol and eliminate threats
  - Communication on enemy sightings

  DO NOT use complete() until gold is collected and threats eliminated!

# Limitations
max_action_steps: 30

