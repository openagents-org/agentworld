# AgentWorld Multi-Agent Task Configuration

task:
  name: "Southern Desert Expedition - Mining and Combat"
  description: "Three agents work together to explore the southern desert region, mine valuable ores, defeat regional minibosses, and collect rare equipment drops"

# Task objectives
objectives:
  primary: "Successfully explore the southern desert region, mine valuable ores, defeat the Water Guardian and Ogre Guardian minibosses, and collect their equipment drops"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent expedition combining resource gathering and miniboss combat.

  OBJECTIVE: Explore the southern desert region to mine valuable ores and defeat regional minibosses for equipment drops.

  MISSION REQUIREMENTS:
  - Navigate the Southern Desert Region (coordinates ~200-600, 600-768)
  - Find and harvest rock deposits for valuable ores
  - Defeat Water Guardian (Level 36) at (197, 633) for equipment drops
  - Defeat Ogre Guardian (Level 32) at (291, 644) for experience and drops

  TEAM COORDINATION:
  - Use global chat to coordinate movement and combat strategies
  - Share information about rock deposit locations found during exploration
  - Coordinate attacks on minibosses for efficient combat
  - Distribute healing items and support each other during fights

  GENERAL STRATEGY:
  - The team starts near (200, 600) in the southern desert area
  - volcanic_miner_agent should focus on finding and mining rock deposits
  - lava_navigator_agent should scout for miniboss locations and lead combat
  - forge_master_agent should support combat and help with material collection
  - Coordinate miniboss fights - Water Guardian drops valuable armor and weapons

  DO NOT use complete() until ALL objectives are achieved by the team!

  MINING OPERATIONS (CRITICAL KNOWLEDGE):
  ⛏️ Resource Gathering:
    - Use harvest_resource on rock instances to mine ores
    - volcanic_miner_agent has mining level 45, can mine up to Lapis Lazuli (level 45)
    - Available high-level ores: Gold (25), Ibo (30), Taaffeite (30), Moonrock (40), Lapis Lazuli (45)
    - Look for rock deposits in the environment observation
    - Rocks respawn after being depleted

  ⚔️ Combat Strategy:
    - Water Guardian (Level 36) at (197, 633):
      * Drops: redguardarmor, redguardarcherarmor, ring1, scimitar, watermelonbow
      * Coordinate team attacks for faster kill
      * Use attack_entity with the mob's instance ID

    - Ogre Guardian (Level 32) at (291, 644):
      * Provides 120 experience bonus
      * Coordinate physical attacks
      * Easier target than Water Guardian

  🗺️ Navigation Tips:
    - Use move_character to navigate (max 32 tiles per move)
    - Water Guardian location: (197, 633) - southwest of starting position
    - Ogre Guardian location: (291, 644) - east of starting position
    - Check environment observation for nearby mobs and resources

  💊 Survival Strategy:
    - All agents have flask and apple supplies for healing
    - Use healing items to recover HP after combat
    - lava_navigator_agent has the most health potions (20)
    - Coordinate healing during extended fights

# Limitations
max_action_steps: 35

