# AgentWorld Multi-Agent Task Configuration

task:
  name: "Wilderness Creature Hunt - Wolf Pack Elimination"
  description: "Three agents work together to hunt wolves and gather resources"

# Task objectives
objectives:
  primary: "Defeat 3x Wolves and collect 5x logs from the wilderness forest area"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent hunting and gathering scenario.

  OBJECTIVE: Hunt wolves and gather resources in the wilderness.

  TARGETS:
  - Defeat 3x Wolves (found roaming in wilderness regions)
  - Collect 5x logs from Oak trees

  WOLF COMBAT:
  - Wolves are aggressive melee creatures
  - Coordinate attacks: tank draws aggro, others deal damage
  - Use ranged weapons for safer engagement

  TEAM COORDINATION:
  - Use global chat to report wolf sightings
  - Hunter leads combat, gatherer collects resources
  - Support agent provides healing and backup

  DO NOT use complete() until all wolves are defeated and logs collected!

# Limitations
max_action_steps: 30

