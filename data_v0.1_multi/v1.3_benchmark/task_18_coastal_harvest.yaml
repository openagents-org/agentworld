task:
  name: Coastal Harvest Mission - Seaside Team Protection
  description: Three agents work together where one guardian protects two collectors
    gathering coastal resources from sea creatures and threats
objectives:
  primary: Successfully protect collectors while they gather 6x rawshrimp and 3x icelogs
    under coastal threat conditions
relevant_game_context: "This is a cooperative multi-agent coastal protection scenario\
  \ requiring tactical coordination.\n\nOBJECTIVE: Successfully gather required coastal\
  \ resources while protecting the team from sea creature threats.\n\nMISSION REQUIREMENTS:\n\
  - Collect 6x rawshrimp and 3x icelogs while under potential sea creature threat\n\
  - Keep all team members alive throughout the mission\n- Use teamwork to balance\
  \ resource gathering with coastal security\n\nTEAM COORDINATION:\n- Establish communication\
  \ protocols for sea creature detection and warnings\n- Coordinate movements between\
  \ protection and coastal resource gathering\n- Share information about resource\
  \ locations and environmental dangers\n- Work together to ensure both safety and\
  \ mission success\n\nGENERAL STRATEGY:\n- The team has complementary roles in combat,\
  \ fishing, and lumberjacking\n- Sea creature threats may appear and must be dealt\
  \ with appropriately\n- Coastal resource gathering requires moving to specific locations\
  \ near water\n- Balance efficiency with safety - casualties will cause mission failure\n\
  - Use global chat for real-time coordination and threat alerts\n\nDO NOT use complete()\
  \ until ALL objectives are achieved safely!\n\nCOMBAT MECHANICS (CRITICAL KNOWLEDGE):\n\
  \U0001F3F9 Combat - Attack threats:\n  - Use observe_environment to detect hostile\
  \ Snow Wolves\n  - Use attack command on hostile targets IMMEDIATELY when spotted\n\
  \  - PRIORITY: Guardian must attack any wolf targeting ice_logger BEFORE they deal\
  \ damage\n  - Use bow for ranged combat advantage\n  - CRITICAL: Snow Wolves (Level\
  \ 55) patrol the Snowoak area - attack them on sight!\n  - GUARDIAN: STAY at spawn\
  \ position (456, 15) to protect ice_logger! DO NOT move away!\n\n\U0001F3A3 Fishing\
  \ - rawshrimp:\n  - harvest_resource on fishing spots near your spawn to get rawshrimp\n\
  \  - Level required: 1+ (Fishing skill)\n  - Target: 6x rawshrimp total\n  - IMPORTANT:\
  \ STAY at spawn location (685, 13) for fishing! DO NOT move to other areas!\n  -\
  \ The fishing spots at (683, 11) and (687, 11) yield rawshrimp!\n\n❄️ Lumberjacking\
  \ - icelogs:\n  - harvest_resource on Snowoak Tree instances to get icelogs\n  -\
  \ Level required: 10+ (Lumberjacking skill)\n  - Target: 3x icelogs total\n  - IMPORTANT:\
  \ Snowoak Trees at (456, 15) area - harvest there for icelogs!\n  - DANGER: Snow\
  \ Wolves (Level 55) patrol this area - guardian MUST protect ice_logger!\n"
max_action_steps: 25
