# AgentWorld Multi-Agent Task Configuration

task:
  name: "Coastal Harvest Mission - Seaside Team Protection"
  description: "Three agents work together where one guardian protects two collectors gathering coastal resources from sea creatures and threats"

# Task objectives
objectives:
  primary: "Successfully protect collectors while they gather 6x rawshrimp and 3x icelogs under coastal threat conditions"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent coastal protection scenario requiring tactical coordination.
  
  OBJECTIVE: Successfully gather required coastal resources while protecting the team from sea creature threats.
  
  MISSION REQUIREMENTS:
  - Collect 6x rawshrimp and 3x icelogs while under potential sea creature threat
  - Keep all team members alive throughout the mission
  - Use teamwork to balance resource gathering with coastal security
  
  TEAM COORDINATION:
  - Establish communication protocols for sea creature detection and warnings
  - Coordinate movements between protection and coastal resource gathering
  - Share information about resource locations and environmental dangers
  - Work together to ensure both safety and mission success
  
  GENERAL STRATEGY:
  - The team has complementary roles in combat, fishing, and lumberjacking
  - Sea creature threats may appear and must be dealt with appropriately
  - Coastal resource gathering requires moving to specific locations near water
  - Balance efficiency with safety - casualties will cause mission failure
  - Use global chat for real-time coordination and threat alerts
  
  DO NOT use complete() until ALL objectives are achieved safely!
  
  COMBAT MECHANICS (CRITICAL KNOWLEDGE):
  🏹 Combat - Attack threats:
    - Use observe_environment to detect hostile sea creatures
    - Use attack command on hostile targets
    - Use bow for ranged combat advantage
  
  🎣 Fishing - rawshrimp:
    - harvest_resource on shrimp fishing spots to get rawshrimp
    - Level required: 1+ (Fishing skill)
    - Target: 6x rawshrimp total
    - IMPORTANT: Look for "Shrimp" fishing spots near water!
  
  ❄️ Lumberjacking - icelogs:
    - harvest_resource on ice oak tree instances to get icelogs
    - Level required: 10+ (Lumberjacking skill)  
    - Target: 3x icelogs total
    - IMPORTANT: Look for "Ice Oak" trees, NOT regular oak trees!

# Limitations
max_action_steps: 25

