# AgentWorld Multi-Agent Task Configuration

task:
  name: "Enchanted Staff Workshop - Lightning Staff Creation"
  description: "Three agents work together to craft a Lightning Staff through coordinated gathering and crafting"

# Task objectives
objectives:
  primary: "Craft 1x Lightning Staff by gathering materials and coordinating crafting operations"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent magical crafting scenario.

  OBJECTIVE: Create a Lightning Staff through coordinated material gathering and crafting.

  CRAFTING CHAIN:
  1. Harvest 2x logs from Oak trees
  2. Craft logs into sticks (1x logs → 4x stick)
  3. Craft basic staff (5x stick + 1x bead → 1x staff)
  4. Upgrade to Lightning Staff (1x staff + 1x lightningbead → 1x lightningstaff)

  MATERIAL SOURCES:
  - Logs: Oak trees in forest region
  - Bead: Provided in inventory
  - Lightning Bead: Provided in inventory

  TEAM COORDINATION:
  - Lumberjack gathers logs
  - Crafter makes sticks and staff
  - Enchanter upgrades to lightning staff

  DO NOT use complete() until Lightning Staff is crafted!

  ITEM KEY REFERENCE (use these exact itemKey values in craft_item):
  - Wooden Bow: itemKey=woodenbow (Fletching)
  - Golden Bow: itemKey=goldenbow (Fletching)
  - Arrow: itemKey=arrow (Fletching)
  - Stick/Shaft: itemKey=stick (Fletching)
  - Sword/Heavy Sword: itemKey=sword2 (Smithing)
  - Golden Sword: itemKey=goldensword (Smithing)
  - Axe: itemKey=axe (Smithing)
  - Pickaxe: itemKey=pickaxe (Smithing)
  - Silver Ring: itemKey=silverring (Smithing)
  - Gold Ring: itemKey=goldring (Smithing)
  - Staff: itemKey=staff (Crafting)
  - Lightning Staff: itemKey=lightningstaff (Crafting)
  - Fire Staff: itemKey=firestaff (Crafting)
  - Ice Staff: itemKey=icestaff (Crafting)
  - Nature Staff: itemKey=naturestaff (Crafting)
  - Bucket: itemKey=bucket (Crafting)
  - Iron Bar: itemKey=ironbar (Smelting)
  - Gold Bar: itemKey=goldbar (Smelting)
  - Bronze Bar: itemKey=bronzebar (Smelting)
  - Cooked Shrimp: itemKey=cookedshrimp (Cooking)
  - Stew: itemKey=stew (Cooking)


# Limitations
max_action_steps: 30

