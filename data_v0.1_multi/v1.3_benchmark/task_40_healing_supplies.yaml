# AgentWorld Multi-Agent Task Configuration

task:
  name: "Healing Supplies - Cooked Food Production"
  description: "Three agents work together to gather ingredients and cook healing food"

# Task objectives
objectives:
  primary: "Catch 4x rawshrimp and cook them into 4x cookedshrimp"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent fishing and cooking scenario.

  OBJECTIVE: Create cooked shrimp for healing supplies.

  PRODUCTION CHAIN:
  1. Catch 4x rawshrimp from fishing spots (Level 1 fishing)
  2. Cook 4x cookedshrimp (1x rawshrimp → 1x cookedshrimp)

  FISHING LOCATIONS:
  - Shrimp fishing spots: Coastal regions (550-600, 700-760)

  COOKING:
  - Cooking skill: 1x rawshrimp → 1x cookedshrimp
  - Level 1 cooking required

  TEAM COORDINATION:
  - Fishers catch shrimp
  - Cook processes raw shrimp
  - Support helps with transfers

  DO NOT use complete() until all shrimp are cooked!

# Limitations
max_action_steps: 30

