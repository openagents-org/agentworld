# AgentWorld Multi-Agent Task Configuration

task:
  name: "Grand Jewelry Expedition - Multi-Stage Gemstone Mining & Crafting"
  description: "Eight agents coordinate a complex expedition involving gemstone mining, ore extraction, smelting, and sequential jewelry crafting"

# Task objectives
objectives:
  primary: "Complete a 5-stage jewelry production expedition creating 2x Ruby Rings, 2x Emerald Pendants, 1x Topaz Ring, and 2x Beryl Pendants"

# Context and guidance for agents
relevant_game_context: |
  EXPEDITION OVERVIEW
  - Eight specialists complete five stages in ~53 rounds to deliver: 2 rubyring, 2 emeraldpendant, 2 berylpendant, 1 topazring. Miners extract gemstones and gold ore from mining deposits, smelter processes materials, and jewelers craft everything at the mining camp rendezvous (~560,550).

  GEMSTONE MINING REQUIREMENTS (from collectable_items.md)
  - Ruby: Mining level 62 required (t57_Ruby_Miner has 65)
  - Emerald: Mining level 57 required (t57_Emerald_Miner has 60)
  - Topaz: Mining level 15 required (t57_Gold_Miner has 40)
  - Beryl: Mining level 1 required (t57_Coal_Miner has 25)
  - Gold Nuggets: Mining level 25 required (t57_Gold_Miner has 40)

  STAGE SUMMARY
  1. R1-12 Gemstone Mining (Agents 1-3)
     - t57_Ruby_Miner: Travel to high-level mining areas and extract 2 rubies using harvest_resource on ruby rock deposits.
     - t57_Emerald_Miner: Locate emerald deposits and mine 2 emeralds.
     - t57_Combat_Support: Provide protection and assist with navigation; forage 2 beryl from beryl rock deposits.
  2. R13-22 Resource Extraction (Agents 4-5)
     - t57_Gold_Miner extracts 6+ gold nuggets and 1 topaz from mountain deposits.
     - t57_Coal_Miner assists with beryl mining (beryl rock deposits) since coal is NOT needed for Smithing gold bars.
     - t57_Smelter begins traveling toward the mining area to receive materials.
  3. R23-35 Smithing & Transit
     - t57_Smelter receives gold nuggets via transfer_items.
     - t57_Smelter uses craft_item with skill "Smithing" to create 6 gold bars from 6 goldnuggets.
     - t57_Smelter crafts 3 gold rings using craft_item with skill "Smithing" (needs 2 goldbar each).
     - Jewelers (Agents 7-8) travel from starting positions toward the mountain camp.
     - t57_Combat_Support consolidates all gemstones and delivers to the camp.
  4. R36-48 Jewelry Assembly at Mountain Camp
     - Transfer materials: gold rings to t57_Jeweler_Rings, strings to t57_Jeweler_Pendants, gems distributed accordingly.
     - t57_Jeweler_Rings crafts: 2x rubyring (each needs 1 ruby + 1 goldring), 1x topazring (needs 1 topaz + 1 goldring).
     - t57_Jeweler_Pendants crafts: 2x emeraldpendant (each needs 1 emerald + 1 string), 2x berylpendant (each needs 1 beryl + 1 string).
  5. R49-53 Quality Control
     - Each crafter uses verify_inventory and broadcasts holdings via chat.
     - Distribute finished pieces if desired, then summarize the expedition with complete().

  CRAFTING RECIPES REFERENCE
  - Ruby Ring: Crafting skill, level 20, needs 1 ruby + 1 goldring
  - Emerald Pendant: Crafting skill, level 25, needs 1 emerald + 1 string
  - Topaz Ring: Crafting skill, level 5, needs 1 topaz + 1 goldring
  - Beryl Pendant: Crafting skill, level 1, needs 1 beryl + 1 string
  - Gold Ring: Smithing skill, level 1, needs 2 goldbar
  - Gold Bar (Option A - RECOMMENDED): Smithing skill, level 1, needs 1 goldnugget (mined from Gold Rock)
  - Gold Bar (Option B): Smelting skill, level 20, needs 1 goldore + 1 coal (40% success chance)

  EXECUTION NOTES
  - Use harvest_resource with the instance ID of rocks visible in environment observation.
  - Use move_character with ≤32-tile hops, announcing coordinates at each checkpoint.
  - Use transfer_items to pass materials between agents when they are nearby.
  - Keep a shared checklist in chat ("Rubies 2/2, Gold ore 5/6...") so jewelers know when materials are ready.
  - Miners should focus on their specialty gems first, then assist others.

  COMPLETION
  - Before complete(), list final inventory totals for all seven jewelry pieces and note which agent carries each. Only then should a coordinator submit the completion message summarizing all five stages.


  ITEM KEY REFERENCE (use these exact itemKey values in craft_item):
  - Wooden Bow: itemKey=woodenbow (Fletching)
  - Golden Bow: itemKey=goldenbow (Fletching)
  - Arrow: itemKey=arrow (Fletching)
  - Stick/Shaft: itemKey=stick (Fletching)
  - Sword/Heavy Sword: itemKey=sword2 (Smithing)
  - Golden Sword: itemKey=goldensword (Smithing)
  - Axe: itemKey=axe (Smithing)
  - Pickaxe: itemKey=pickaxe (Smithing)
  - Silver Ring: itemKey=silverring (Smithing)
  - Gold Ring: itemKey=goldring (Smithing)
  - Topaz Ring: itemKey=topazring (Smithing)
  - Staff: itemKey=staff (Crafting)
  - Lightning Staff: itemKey=lightningstaff (Crafting)
  - Fire Staff: itemKey=firestaff (Crafting)
  - Ice Staff: itemKey=icestaff (Crafting)
  - Nature Staff: itemKey=naturestaff (Crafting)
  - Bucket: itemKey=bucket (Crafting)
  - Beryl Pendant: itemKey=berylpendant (Crafting)
  - Iron Bar: itemKey=ironbar (Smelting)
  - Gold Bar: itemKey=goldbar (Smelting)
  - Bronze Bar: itemKey=bronzebar (Smelting)
  - Cooked Shrimp: itemKey=cookedshrimp (Cooking)
  - Stew: itemKey=stew (Cooking)


