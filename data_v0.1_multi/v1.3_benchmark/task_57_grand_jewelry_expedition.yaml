  - "Stage 2: t57_Gold_Miner mines 6+ gold nuggets from gold deposits (mining level 25+ required)"
  - "Stage 2: t57_Gold_Miner mines 1 topaz from topaz rock deposits (mining level 15+ required)"
  - "Stage 2: t57_Coal_Miner mines 8+ coal from coal deposits"
  - "Stage 2: t57_Smelter travels toward mining area to receive materials"
  - "Stage 3: t57_Smelter receives gold nuggets and coal via transfer_items"
  - "Stage 3: t57_Smelter smelts 6 gold bars from gold nuggets and coal"
  - "Stage 3: t57_Smelter crafts 3 gold rings from 6 gold bars"
  - "Stage 3: Jewelers travel toward mountain camp"
  - "Stage 3: t57_Combat_Support delivers all gemstones to mountain camp"
  - "Stage 4: All 8 agents converge at mountain region"
  - "Stage 4: Materials distributed correctly - gold rings to t57_Jeweler_Rings, strings to t57_Jeweler_Pendants"
