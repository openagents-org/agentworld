# AgentWorld Multi-Agent Task Configuration

task:
  name: "Elite Skeleton Hunt - Undead Elimination"
  description: "Three agents work together to hunt and defeat skeletons"

# Task objectives
objectives:
  primary: "Defeat 3x Skeletons and collect 3x logs"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent combat and gathering scenario.

  OBJECTIVE: Hunt skeletons and gather resources.

  TARGETS:
  - Defeat 3x Skeletons (Level 14, 140 HP each)
  - Collect 3x logs from nearby Oak trees
  - Skeletons drop: sword2 (heavy sword)

  COMBAT TACTICS:
  - Skeletons are undead melee fighters
  - Use coordinated attacks to take them down quickly
  - One agent can gather while others fight

  SKELETON LOCATIONS:
  - Found in wilderness and dark forest regions
  - Often near ancient ruins areas

  DO NOT use complete() until all objectives are met!

# Limitations
max_action_steps: 30

