# AgentWorld Multi-Agent Task Configuration

task:
  name: "Agricultural Empire - Fishing and Cooking"
  description: "Fourteen agents fish and cook for agricultural production"

# Task objectives
objectives:
  primary: "Catch 8x rawshrimp, cook 6x Cooked Shrimp and 2x Jellyfish Smoothie"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent agricultural scenario.

  OBJECTIVE: Fish and cook food products.

  PRODUCTION TARGETS:
  - 8x rawshrimp (from fishing)
  - 6x Cooked Shrimp (from cooking)
  - 2x Jellyfish Smoothie (from cooking)

  LOCATIONS:
  - Fishing: Coastal (580, 750)

  TEAM ROLES:
  - Fishers: Catch seafood
  - Cooks: Prepare food

  DO NOT use complete() until all objectives are met!

# Limitations
max_action_steps: 50

