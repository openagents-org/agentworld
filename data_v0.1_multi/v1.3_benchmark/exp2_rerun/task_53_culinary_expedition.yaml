# AgentWorld Multi-Agent Task Configuration

task:
  name: "Culinary Expedition - Seafood Feast"
  description: "Five agents gather ingredients and cook a seafood feast"

# Task objectives
objectives:
  primary: "Cook 4x Cooked Shrimp, 2x Tuna Sushi, and 1x Jellyfish Smoothie"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent cooking scenario.

  OBJECTIVE: Prepare a seafood feast through fishing and cooking.

  PRODUCTION TARGETS:
  - 4x Cooked Shrimp (cook 4x rawshrimp)
  - 2x Tuna Sushi (cook 2x rawtuna + 2x kelp)
  - 1x Jellyfish Smoothie (cook 1x jellyfish)

  FISHING REQUIREMENTS:
  - Raw Shrimp: Level 1 fishing
  - Raw Tuna: Level 1 fishing
  - Jellyfish: Level 5 fishing

  FISHING LOCATIONS:
  - Coastal fishing spots (200-230, 200-250)

  TEAM ROLES:
  - Fishers: Catch seafood (shrimp, tuna, jellyfish)
  - Cooks: Process raw ingredients (cooks already have kelp for sushi)

  COOKING RECIPES:
  - Cooked Shrimp: 1x rawshrimp (Cooking Level 1)
  - Tuna Sushi: 1x rawtuna + 1x kelp (Cooking Level 20)
  - Jellyfish Smoothie: 1x jellyfish (Cooking Level 10)

  COORDINATION:
  - Fishers need to transfer fish to cooks via transfer_items
  - Cooks have pre-supplied kelp for Tuna Sushi

  DO NOT use complete() until all food is cooked!

# Limitations
max_action_steps: 38

