# AgentWorld Multi-Agent Task Configuration

task:
  name: "War Council - Multi-Boss Campaign"
  description: "Ten agents defeat multiple bosses in coordinated assault"

# Task objectives
objectives:
  primary: "Defeat the Ogre Guardian at (291, 644), the Dark Wolf at (1016, 682), and the Golden Golem at (548, 232)"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent combat scenario.

  OBJECTIVE: Defeat three dangerous bosses across the realm.

  COMBAT TARGETS:
  - Ogre Guardian (Level 36) at (291, 644)
  - Dark Wolf (Level 40) at (1016, 682)
  - Golden Golem (Level 38) at (548, 232)

  TEAM COMPOSITION:
  - 4 Fighters with heavy weapons
  - 3 Ranged attackers with staffs
  - 3 Support agents

  STRATEGY:
  - Split into teams for each boss
  - Coordinate attacks via chat
  - Maintain HP above 50% before engaging

  DO NOT use complete() until all objectives are met!

# Limitations
max_action_steps: 48

