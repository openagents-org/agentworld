# AgentWorld Multi-Agent Task Configuration

task:
  name: "Trade Network - Resource Collection"
  description: "Twelve agents collect resources for trade network"

# Task objectives
objectives:
  primary: "Collect 8x logs, 6x ironore, 4x rawshrimp, and craft 2x Gold Ring"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent gathering scenario.

  OBJECTIVE: Gather resources and craft trade goods.

  PRODUCTION TARGETS:
  - 8x logs (from forest)
  - 6x ironore (from mountain)
  - 4x rawshrimp (from fishing)
  - 2x Gold Ring (2x goldbar each)

  MATERIALS PROVIDED:
  - Gold bars provided to crafter

  LOCATIONS:
  - Forest: Around (388, 10)
  - Mountain: Around (230, 40)
  - Fishing: Coastal (580, 750)

  DO NOT use complete() until all objectives are met!

# Limitations
max_action_steps: 48

