# AgentWorld Multi-Agent Task Configuration

task:
  name: "Ocean Expedition - Fishing and Combat"
  description: "Eleven agents fish and defeat sea creatures"

# Task objectives
objectives:
  primary: "Catch 8x rawshrimp, defeat Mermaid at (580, 755), and cook 4x Cooked Shrimp"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent ocean expedition scenario.

  OBJECTIVE: Fish, defeat sea boss, and cook.

  PRODUCTION TARGETS:
  - 8x rawshrimp (from fishing)
  - Defeat Mermaid boss
  - 4x Cooked Shrimp (from cooking)

  COMBAT TARGET:
  - Mermaid (Level 55) at (580, 755)

  LOCATIONS:
  - Fishing: Coastal (580, 750)

  DO NOT use complete() until all objectives are met!

# Limitations
max_action_steps: 45

