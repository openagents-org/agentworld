# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cooperative Heavy Sword Forging - Warrior Weapon Crafting"
  description: "Three agents work together to create a heavy sword through mining, smelting, and advanced smithing"

# Task objectives
objectives:
  primary: "Forge a heavy sword through coordinated material processing and weapon smithing"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent weapon crafting scenario requiring advanced metallurgy and smithing.
  
  OBJECTIVE: Forge a heavy sword through coordinated material processing and advanced weapon smithing.
  
  TEAM COORDINATION:
  - Use global chat to coordinate complex multi-step metallurgy operations
  - Share materials and intermediate products between processing stages
  - Coordinate timing for efficient smelting and smithing workflow
  - Work together to complete advanced weapon crafting chain
  
  GENERAL STRATEGY:
  - The team needs to extract raw materials for advanced metallurgy
  - Materials must be processed through smelting operations into refined components
  - Multiple intermediate components must be crafted and assembled
  - Final weapon assembly requires advanced smithing expertise
  - Coordinate complex material flow and processing timing
  
  DO NOT use complete() until ALL objectives are achieved by the team!

  ITEM KEY REFERENCE (use these exact itemKey values in craft_item):
  - Wooden Bow: itemKey=woodenbow (Fletching)
  - Golden Bow: itemKey=goldenbow (Fletching)
  - Arrow: itemKey=arrow (Fletching)
  - Stick/Shaft: itemKey=stick (Fletching)
  - Sword/Heavy Sword: itemKey=sword2 (Smithing)
  - Golden Sword: itemKey=goldensword (Smithing)
  - Axe: itemKey=axe (Smithing)
  - Pickaxe: itemKey=pickaxe (Smithing)
  - Silver Ring: itemKey=silverring (Smithing)
  - Gold Ring: itemKey=goldring (Smithing)
  - Staff: itemKey=staff (Crafting)
  - Lightning Staff: itemKey=lightningstaff (Crafting)
  - Fire Staff: itemKey=firestaff (Crafting)
  - Ice Staff: itemKey=icestaff (Crafting)
  - Nature Staff: itemKey=naturestaff (Crafting)
  - Bucket: itemKey=bucket (Crafting)
  - Iron Bar: itemKey=ironbar (Smelting)
  - Gold Bar: itemKey=goldbar (Smelting)
  - Bronze Bar: itemKey=bronzebar (Smelting)
  - Cooked Shrimp: itemKey=cookedshrimp (Cooking)
  - Stew: itemKey=stew (Cooking)

  
  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  ⛏️ Mining - iron ore and coal:
    - harvest_resource on iron rock instances to get ironore (level 10+)
    - harvest_resource on coal deposits to get coal (level 1+)
  
  🔥 Smelting Recipe - ironbar:
    - craft_item skill=Smelting itemKey=ironbar
    - Materials: 1x ironore + 1x coal → 1x ironbar
    - Level required: 20 (uses Smithing skill level)
  
  🔨 Smithing Recipe - hilt2:
    - craft_item skill=Smithing itemKey=hilt2
    - Materials: 1x ironbar + 1x logs → 1x hilt2
    - Level required: 1 (Smithing skill)
  
  ⚔️ Smithing Recipe - sword2 (heavy sword):
    - craft_item skill=Smithing itemKey=sword2
    - Materials: 2x ironbar + 1x hilt2 → 1x heavy sword
    - Level required: 1 (Smithing skill)

# Limitations
max_action_steps: 25

