# AgentWorld Multi-Agent Task Configuration

task:
  name: "Barrier Reboot - Combat and Crafting"
  description: "Ten agents defeat bosses and craft staffs for barrier reboot"

# Task objectives
objectives:
  primary: "Defeat Ancient Wizard at (163, 339), craft 1x Lightning Staff and 1x Fire Staff, and collect 8x goldore"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent combat and crafting scenario.

  OBJECTIVE: Defeat boss and craft staffs.

  COMBAT TARGET:
  - Ancient Wizard (Level 10) at (163, 339)

  PRODUCTION TARGETS:
  - 8x goldore (from mountain)
  - 1x Lightning Staff (staff + lightningbead)
  - 1x Fire Staff (staff + firebead)

  MATERIALS PROVIDED:
  - Beads provided to crafters

  LOCATIONS:
  - Mountain Mining: Around (230, 40)
  - Ancient Wizard Location: (163, 339)

  TEAM ROLES:
  - Combat Team: Defeat spectre
  - Miners: Extract gold ore
  - Crafters: Make staffs

  DO NOT use complete() until all objectives are met!

# Limitations
max_action_steps: 45

