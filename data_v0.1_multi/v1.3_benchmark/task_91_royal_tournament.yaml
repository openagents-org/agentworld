# AgentWorld Multi-Agent Task Configuration

task:
  name: "Royal Tournament - Combat Exhibition"
  description: "Ten agents defeat bosses for tournament exhibition"

# Task objectives
objectives:
  primary: "Defeat Iron Ogre at (238, 48), Hermit Crab Warrior at (224, 359), and Ogre Guardian at (291, 644)"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent combat scenario.

  OBJECTIVE: Defeat three boss creatures for tournament.

  COMBAT TARGETS:
  - Iron Ogre (Level 25) at (238, 48)
  - Hermit Crab Warrior (Level 30) at (224, 359)
  - Ogre Guardian (Level 32) at (291, 644)

  TEAM COMPOSITION:
  - 6 Fighters with heavy weapons
  - 4 Support agents

  STRATEGY:
  - Split into teams for each boss
  - Coordinate attacks via chat
  - Maintain HP above 50% before engaging

  DO NOT use complete() until all objectives are met!

# Limitations
max_action_steps: 45

