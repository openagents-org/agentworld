# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cross-Region Expedition - Multi-Biome Resource Gathering"
  description: "Five agents gather resources from forest, mountain, and coast regions"

# Task objectives
objectives:
  primary: "Collect 5x logs from forest, 4x coal from mountain, and 3x rawshrimp from coast"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent cross-region gathering scenario.

  OBJECTIVE: Gather resources from three different biomes.

  COLLECTION TARGETS:
  - 5x logs (Forest region: Oak trees near 85, 85)
  - 4x coal (Mining region: Coal rocks near 555, 550)
  - 3x rawshrimp (Coastal region: Fishing spots near 170, 220)

  TEAM ROLES:
  - Forest Team: 2 agents gather logs
  - Mountain Team: 2 agents mine coal
  - Coastal Agent: 1 agent fishes for shrimp

  TEAM COORDINATION:
  - Each team works in assigned region
  - Report progress via global chat
  - Transfer items to coordinator when done

  DO NOT use complete() until all resources are collected!

# Limitations
max_action_steps: 40

