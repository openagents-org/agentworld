# AgentWorld Multi-Agent Task Configuration

task:
  name: "Desert Caravan Expedition - Resource Gathering and Team Exchange"
  description: "Three agents work together to navigate to the southern desert region, gather rare desert resources through mining and combat, and share resources through coordinated team exchanges"

# Task objectives
objectives:
  primary: "Successfully reach the desert region, gather rare desert materials through mining and combat, and complete coordinated resource exchanges between team members"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent desert expedition requiring navigation, resource gathering, and team coordination.

  OBJECTIVE: Navigate to the desert, gather valuable resources, and share them between team members.

  MISSION REQUIREMENTS:
  - Navigate to Southern Desert region (coordinates approximately Y > 600)
  - Gather desert resources through mining (rocks/ores) and combat (desert creatures)
  - Share gathered resources between team members using transfer_items tool
  - Coordinate movements and activities via global chat

  TEAM COORDINATION:
  - Use chat tool to communicate locations and coordinate movements
  - Use transfer_items to share gathered resources between agents
  - Coordinate combat against desert creatures for safety
  - Share supplies (flasks, apples) if needed for survival

  NAVIGATION STRATEGY:
  - Starting position is around (180-190, 200) in the northern area
  - Southern Desert is at Y coordinates 600-768
  - Move in increments of up to 32 tiles per move_character call
  - Coordinate team movement to stay together for safety

  DO NOT use complete() until ALL objectives are achieved by the team!

  ITEM KEY REFERENCE (use these exact itemKey values in craft_item):
  - Wooden Bow: itemKey=woodenbow (Fletching)
  - Golden Bow: itemKey=goldenbow (Fletching)
  - Arrow: itemKey=arrow (Fletching)
  - Stick/Shaft: itemKey=stick (Fletching)
  - Sword/Heavy Sword: itemKey=sword2 (Smithing)
  - Golden Sword: itemKey=goldensword (Smithing)
  - Axe: itemKey=axe (Smithing)
  - Pickaxe: itemKey=pickaxe (Smithing)
  - Silver Ring: itemKey=silverring (Smithing)
  - Gold Ring: itemKey=goldring (Smithing)
  - Staff: itemKey=staff (Crafting)
  - Lightning Staff: itemKey=lightningstaff (Crafting)
  - Fire Staff: itemKey=firestaff (Crafting)
  - Ice Staff: itemKey=icestaff (Crafting)
  - Nature Staff: itemKey=naturestaff (Crafting)
  - Bucket: itemKey=bucket (Crafting)
  - Iron Bar: itemKey=ironbar (Smelting)
  - Gold Bar: itemKey=goldbar (Smelting)
  - Bronze Bar: itemKey=bronzebar (Smelting)
  - Cooked Shrimp: itemKey=cookedshrimp (Cooking)
  - Stew: itemKey=stew (Cooking)


  DESERT RESOURCE GATHERING (CRITICAL KNOWLEDGE):
  ⛏️ Mining Operations:
    - resource_gatherer_agent has mining:25 skill and pickaxe equipped
    - Can mine Gold ore (level 25), Pythar ore (level 15), and lower level ores
    - Use observe_environment to find rocks in the desert region
    - Use harvest_resource with the rock's instance ID to mine

  🌵 Desert Combat:
    - Cactus (level 16): Drops cactusaxe - always aggressive
    - Desert Scorpion (level 24): Drops steelboots
    - Scorpion (level 38): Found in desert areas
    - Vulture (level 25): Drops feathers (8000/10000 rate)
    - Use attack_entity with mob instance ID to attack

  📦 Resource Exchange:
    - Use transfer_items tool to share resources between agents
    - Parameters: targetPlayer (username), itemKey (item name), count (number)
    - Example: transfer_items to "desert_trader_agent" with itemKey "goldnugget" count 5

  💬 Team Communication:
    - Use chat tool to broadcast messages to all team members
    - Coordinate who gathers what and where to meet
    - Share locations of valuable resources found

  STEP-BY-STEP APPROACH:
  1. All agents use chat to coordinate the expedition plan
  2. Move south together in 32-tile increments toward desert (Y > 600)
  3. Once in desert, locate resources (rocks, desert creatures)
  4. resource_gatherer mines rocks for ores
  5. Combat agents attack desert creatures for drops
  6. Use transfer_items to share gathered resources between team
  7. Call complete() after resources are gathered and exchanged

# Limitations
max_action_steps: 50

