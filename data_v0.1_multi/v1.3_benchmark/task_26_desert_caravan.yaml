# Success criteria
success_criteria:
  - "All agents successfully navigate to the Southern Desert region (Y coordinate > 600)"
  - "resource_gatherer_agent successfully mines at least one rock/ore deposit in the desert"
  - "At least one agent successfully defeats a desert creature (cactus, scorpion, or vulture)"
  - "At least one successful resource transfer between agents using transfer_items tool"
  - "Team coordinates via chat tool at least 3 times during the expedition"
  - "All agents survive the desert expedition"
  - "Mission completed within the step limit"
