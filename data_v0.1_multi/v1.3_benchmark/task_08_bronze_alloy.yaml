# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cooperative Bronze Alloy Creation - Advanced Metallurgy"
  description: "Three agents work together to create bronze bars through specialized ore mining and alloy smelting"

# Task objectives
objectives:
  primary: "Create bronze bars through coordinated copper and tin mining with alloy smelting"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent advanced metallurgy scenario requiring specialized ore mining.
  
  OBJECTIVE: Create bronze bars through coordinated extraction of different ore types and advanced alloy smelting.
  
  TEAM COORDINATION:
  - Use global chat to share locations of different specialized ore deposits
  - Coordinate between different mining operations for complementary materials
  - Share extracted ores for advanced alloy metallurgy
  - Work together to complete challenging bronze alloy production
  
  GENERAL STRATEGY:
  - The team needs to locate and extract two different types of specialized ores
  - Different agents may focus on different ore types for efficiency
  - Materials must be combined through advanced alloy smelting techniques
  - Alloy production has challenging success rates requiring skill
  - Coordinate specialized mining and metallurgy expertise
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  ⛏️ Mining - copper ore:
    - harvest_resource on copper rock instances to get copperore
    - Level required: 1+ (Mining skill)
  
  ⛏️ Mining - tin ore:
    - harvest_resource on tin rock instances to get tinore
    - Level required: 1+ (Mining skill)
  
  🥉 Smelting Recipe - bronzebar:
    - craft_item skill=Smelting itemKey=bronzebar
    - Materials: 1x copperore + 1x tinore → 1x bronzebar
    - Level required: 5 (uses Smithing skill level)
    - Success chance: 70% - CHALLENGING!

# Limitations
max_action_steps: 25

