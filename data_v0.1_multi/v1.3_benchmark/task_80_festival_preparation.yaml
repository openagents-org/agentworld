# AgentWorld Multi-Agent Task Configuration

task:
  name: "Festival Preparation - Cooking and Crafting"
  description: "Ten agents prepare food and crafts for a festival"

# Task objectives
objectives:
  primary: "Cook 4x Cooked Shrimp, 3x Jellyfish Smoothie, and craft 2x Silver Ring"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent festival preparation scenario.

  OBJECTIVE: Prepare food and prizes for the festival.

  PRODUCTION TARGETS:
  - 4x Cooked Shrimp (cook 4x rawshrimp, cooking level 1)
  - 3x Jellyfish Smoothie (cook 3x jellyfish, cooking level 10)
  - 2x Silver Ring (2x ironbar each, smithing level 1)

  GATHERING REQUIREMENTS:
  - 4x rawshrimp (fishing level 1)
  - 3x jellyfish (fishing level 5)
  - 4x ironbar (provided to crafter)

  TEAM ROLES:
  - Fishers: Catch rawshrimp and jellyfish from nearby fishing spots
  - Cooks: Prepare cookedshrimp and jellyfishsmoothie
  - Crafter: Make silver rings

  WORKFLOW:
  1. Fishers harvest rawshrimp and jellyfish from fishing spots
  2. Fishers transfer seafood to cooks via transfer_items
  3. Cooks craft cookedshrimp (skill: Cooking, itemKey: cookedshrimp)
  4. Cooks craft jellyfishsmoothie (skill: Cooking, itemKey: jellyfishsmoothie)
  5. Crafter crafts silverring (skill: Smithing, itemKey: silverring)

  DO NOT use complete() until all items are ready!

  ITEM KEY REFERENCE (use these exact itemKey values in craft_item):
  - Wooden Bow: itemKey=woodenbow (Fletching)
  - Golden Bow: itemKey=goldenbow (Fletching)
  - Arrow: itemKey=arrow (Fletching)
  - Stick/Shaft: itemKey=stick (Fletching)
  - Sword/Heavy Sword: itemKey=sword2 (Smithing)
  - Golden Sword: itemKey=goldensword (Smithing)
  - Axe: itemKey=axe (Smithing)
  - Pickaxe: itemKey=pickaxe (Smithing)
  - Silver Ring: itemKey=silverring (Smithing)
  - Gold Ring: itemKey=goldring (Smithing)
  - Staff: itemKey=staff (Crafting)
  - Lightning Staff: itemKey=lightningstaff (Crafting)
  - Fire Staff: itemKey=firestaff (Crafting)
  - Ice Staff: itemKey=icestaff (Crafting)
  - Nature Staff: itemKey=naturestaff (Crafting)
  - Bucket: itemKey=bucket (Crafting)
  - Iron Bar: itemKey=ironbar (Smelting)
  - Gold Bar: itemKey=goldbar (Smelting)
  - Bronze Bar: itemKey=bronzebar (Smelting)
  - Cooked Shrimp: itemKey=cookedshrimp (Cooking)
  - Stew: itemKey=stew (Cooking)


# Limitations
max_action_steps: 42

