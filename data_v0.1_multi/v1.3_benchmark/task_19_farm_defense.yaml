# AgentWorld Multi-Agent Task Configuration

task:
  name: "Farm Defense Mission - Agricultural Team Protection"
  description: "Three agents work together where one guardian protects two collectors gathering farm produce from pest and raider threats"

# Task objectives
objectives:
  primary: "Successfully protect collectors while they gather 8x corn and 4x tomato under agricultural threat conditions"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent agricultural protection scenario requiring tactical coordination.
  
  OBJECTIVE: Successfully gather required farm produce while protecting the team from pest and raider threats.
  
  MISSION REQUIREMENTS:
  - Collect 8x corn and 4x tomato while under potential pest and raider threat
  - Keep all team members alive throughout the mission
  - Use teamwork to balance resource gathering with farm security
  
  TEAM COORDINATION:
  - Establish communication protocols for pest and raider detection and warnings
  - Coordinate movements between protection and farm produce gathering
  - Share information about resource locations and environmental dangers
  - Work together to ensure both safety and mission success
  
  GENERAL STRATEGY:
  - The team has complementary roles in combat and foraging
  - Pest and raider threats may appear and must be dealt with appropriately
  - Farm produce gathering requires moving to specific agricultural locations
  - Balance efficiency with safety - casualties will cause mission failure
  - Use global chat for real-time coordination and threat alerts
  
  DO NOT use complete() until ALL objectives are achieved safely!
  
  COMBAT MECHANICS (CRITICAL KNOWLEDGE):
  🏹 Combat - Attack threats:
    - Use observe_environment to detect hostile pests and raiders
    - Use attack command on hostile targets
    - Use bow for ranged combat advantage
  
  🌽 Foraging - corn:
    - harvest_resource on corn instances to get corn
    - Level required: 5+ (Foraging skill)
    - Target: 8x corn total
    - IMPORTANT: Look for "Corn" plants in agricultural areas!
  
  🍅 Foraging - tomato:
    - harvest_resource on tomato instances to get tomato
    - Level required: 15+ (Foraging skill)  
    - Target: 4x tomato total
    - IMPORTANT: Look for "Tomato" plants, NOT other vegetables!

# Limitations
max_action_steps: 25

