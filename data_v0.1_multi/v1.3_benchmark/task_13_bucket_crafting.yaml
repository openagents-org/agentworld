# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cooperative Bucket Crafting - Utility Container Production"
  description: "Three agents work together to create a bucket through extensive wood gathering, processing, and advanced crafting"

# Task objectives
objectives:
  primary: "Create a utility bucket through coordinated large-scale wood processing and crafting"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent utility crafting scenario requiring extensive wood materials.
  
  OBJECTIVE: Create a utility bucket through coordinated large-scale wood processing and advanced container crafting.
  
  TEAM COORDINATION:
  - Use global chat to coordinate large-scale lumber operations
  - Share wood materials and processing tasks between team members
  - Organize extensive material gathering for advanced crafting requirements
  - Work together to complete utility container production chain
  
  GENERAL STRATEGY:
  - The team needs to gather large quantities of wood materials
  - Materials may need processing and organization for advanced crafting
  - Bucket crafting requires significant material quantities and advanced skills
  - Coordinate extensive material gathering with specialized crafting expertise
  - Balance efficient logging operations with crafting requirements
  
  DO NOT use complete() until ALL objectives are achieved by the team!

  ITEM KEY REFERENCE (use these exact itemKey values in craft_item):
  - Wooden Bow: itemKey=woodenbow (Fletching)
  - Golden Bow: itemKey=goldenbow (Fletching)
  - Arrow: itemKey=arrow (Fletching)
  - Stick/Shaft: itemKey=stick (Fletching)
  - Sword/Heavy Sword: itemKey=sword2 (Smithing)
  - Golden Sword: itemKey=goldensword (Smithing)
  - Axe: itemKey=axe (Smithing)
  - Pickaxe: itemKey=pickaxe (Smithing)
  - Silver Ring: itemKey=silverring (Smithing)
  - Gold Ring: itemKey=goldring (Smithing)
  - Staff: itemKey=staff (Crafting)
  - Lightning Staff: itemKey=lightningstaff (Crafting)
  - Fire Staff: itemKey=firestaff (Crafting)
  - Ice Staff: itemKey=icestaff (Crafting)
  - Nature Staff: itemKey=naturestaff (Crafting)
  - Bucket: itemKey=bucket (Crafting)
  - Iron Bar: itemKey=ironbar (Smelting)
  - Gold Bar: itemKey=goldbar (Smelting)
  - Bronze Bar: itemKey=bronzebar (Smelting)
  - Cooked Shrimp: itemKey=cookedshrimp (Cooking)
  - Stew: itemKey=stew (Cooking)

  
  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  🪵 Lumberjacking - logs:
    - harvest_resource on oak tree instances to get logs
    - Level required: 1+ (Lumberjacking skill)
  
  🪣 Crafting Recipe - bucket:
    - craft_item skill=Crafting itemKey=bucket
    - Materials: 5x logs → 1x bucket
    - Level required: 10 (Crafting skill) - ADVANCED CRAFTING!

