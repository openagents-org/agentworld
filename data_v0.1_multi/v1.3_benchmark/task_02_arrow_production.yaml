# Success criteria for multi-agent task
success_criteria:
  - "Team stays together within 3 tiles throughout the task"
  - "Team successfully gathers exactly 3x logs from Oak Trees"
  - "Team consolidates all 10x feathers (5x + 5x) with fletcher_agent"
  - "Team consolidates all 3x logs with fletcher_agent through transfers"
  - "Team communicates inventory status after every major action"
  - "Fletcher_agent crafts 12x sticks from 3x logs (using craft_item 3 times)"
  - "Fletcher_agent produces 10x arrows from 10x sticks + 10x feathers"
  - "Final target: Fletcher_agent has 10x arrows verified by all agents"
  - "All agents coordinate location and materials throughout the process"
  - "Materials are collected and transferred using actual tool operations"