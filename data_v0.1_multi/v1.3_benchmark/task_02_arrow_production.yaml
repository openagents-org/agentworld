# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cooperative Arrow Production - Archer Supply Chain"
  description: "Three agents work together to mass-produce arrows for archery combat"

# Task objectives
objectives:
  primary: "Produce a batch of 10 arrows through coordinated material gathering and crafting"

# Context and guidance for agents
relevant_game_context: |
  Team objective: Produce 10x arrows through coordinated effort.
  
  🚨 CRITICAL AWARENESS: Check your actual inventory state before making claims!
  - Use verify_inventory to see what you really have in your inventory
  - Do NOT assume you have materials that aren't verified
  - Do NOT claim transfers happened without actually using transfer_items tool
  
  📋 REQUIRED MATERIALS FOR SUCCESS:
  - EXACTLY 3x logs needed (can be harvested from Oak Trees using harvest_resource)
  - EXACTLY 10x feathers needed (team starts with 10x total: 5x per hunter_agent and fletcher_agent)
  - Materials must be consolidated with ONE agent for crafting (recommend fletcher_agent)
  
  🧮 MATERIAL MATH (CRITICAL):
  - 3x logs → craft 3 times → 12x sticks total (1 log = 4 sticks each craft)
  - 10x sticks + 10x feathers → 10x arrows (final goal)
  - Extra 2x sticks are buffer for safety
  
  🛠️ CRAFTING PROCESS OVERVIEW:
  - logs → sticks: Use craft_item skill=Fletching itemKey=stick (NO count parameter needed!)
    Recipe: 1x logs → 4x sticks automatically
  - sticks + feathers → arrows: Use craft_item skill=Fletching itemKey=arrow (NO count parameter!)
    Recipe: 10x sticks + 10x feathers → 10x arrows automatically
  - Someone needs to gather logs, someone needs to handle feathers, someone needs to do crafting
  
  🚨 CRITICAL CRAFT SYNTAX:
  - DO NOT use count parameter in craft_item calls!
  - craft_item skill=Fletching itemKey=stick (will use 1 log, make 4 sticks)
  - craft_item skill=Fletching itemKey=arrow (will use 10 sticks + 10 feathers, make 10 arrows)
  
  🤝 COORDINATION REQUIREMENTS:
  - 📍 MANDATORY: ALL agents must work at the SAME LOCATION (within 3 tiles of each other)
  - 📍 RECOMMENDED BASE: Stay near Oak Trees around spawn area (388-392, 3-6)
  - 📦 Use transfer_items to consolidate materials for crafting
  - 💬 Use global chat frequently to share exact inventory counts
  - ✅ Use verify_inventory before and after EVERY transfer operation
  - 🎯 Work together to decide who does what and how to organize the work
  - 🤝 Team must self-organize: decide roles, sequence, and coordination strategy
  
  📋 COORDINATION CONSTRAINTS:
  - Stay physically close to enable transfers and communication
  - Share inventory status frequently to maintain team awareness
  - Consolidate materials efficiently for crafting operations
  
  ⚠️ REALITY CHECK RULES:
  - ALWAYS use verify_inventory before claiming to have items
  - NEVER claim to have done something without actually using the tool
  - NEVER assume other agents have sent you items unless you verify and confirm
  - Use actual game tools (harvest_resource, transfer_items, craft_item) instead of just talking about them
  
  🔄 STATUS SHARING PROTOCOL:
  - After EVERY action, announce in chat: "I now have: X logs, Y feathers, Z sticks, W arrows"
  - When receiving transfers, confirm: "Confirmed received: X items from Y agent"
  - Before starting craft, announce: "Ready to craft, I have: [exact inventory]"
  - Team should track total materials: "Team status: X/3 logs, Y/10 feathers collected"
  
  🚨 COMPLETION RULES:
  - DO NOT use complete() until fletcher_agent actually has 10x arrows in inventory

  ITEM KEY REFERENCE (use these exact itemKey values in craft_item):
  - Wooden Bow: itemKey=woodenbow (Fletching)
  - Golden Bow: itemKey=goldenbow (Fletching)
  - Arrow: itemKey=arrow (Fletching)
  - Stick/Shaft: itemKey=stick (Fletching)
  - Sword/Heavy Sword: itemKey=sword2 (Smithing)
  - Golden Sword: itemKey=goldensword (Smithing)
  - Axe: itemKey=axe (Smithing)
  - Pickaxe: itemKey=pickaxe (Smithing)
  - Silver Ring: itemKey=silverring (Smithing)
  - Gold Ring: itemKey=goldring (Smithing)
  - Staff: itemKey=staff (Crafting)
  - Lightning Staff: itemKey=lightningstaff (Crafting)
  - Fire Staff: itemKey=firestaff (Crafting)
  - Ice Staff: itemKey=icestaff (Crafting)
  - Nature Staff: itemKey=naturestaff (Crafting)
  - Bucket: itemKey=bucket (Crafting)
  - Iron Bar: itemKey=ironbar (Smelting)
  - Gold Bar: itemKey=goldbar (Smelting)
  - Bronze Bar: itemKey=bronzebar (Smelting)
  - Cooked Shrimp: itemKey=cookedshrimp (Cooking)
  - Stew: itemKey=stew (Cooking)

  - DO NOT complete if crafting fails - troubleshoot and retry instead
  - DO NOT complete if team is scattered - gather together first
  - Only complete when final objective is verified by ALL agents: team has 10x arrows
  - If you encounter errors, work together to solve them, don't give up!
  
  🎯 TEAM ORGANIZATION:
  - Team must decide their own workflow and role assignments
  - Discuss and agree on who does what through global chat
  - Focus on efficient coordination and clear communication
  - Adapt your strategy based on what works for your team
  
  Goal: Team must collaborate to determine roles and coordinate the full production chain!

# Limitations
max_action_steps: 35

