# AgentWorld Multi-Agent Task Configuration

task:
  name: "Weaponsmith Consortium - Complete Arsenal Production"
  description: "Seven master weaponsmiths create a complete arsenal: 3 swords (including golden), 3 axes, 2 bows (including golden), and specialty weapons through coordinated production"

# Task objectives
objectives:
  primary: "Forge complete weapon arsenal: 3 swords (1 golden, 2 heavy), 3 axes, 2 bows (1 golden, 1 wooden), 1 pickaxe for total of 9 weapons"

# Context and guidance for agents
relevant_game_context: |
  ARSENAL PLAN
  - Seven smiths build a 9-piece arsenal (golden sword, golden bow, 2 heavy swords, 3 battle axes, 1 wooden bow, 1 pickaxe) by Round 52. Mountain miners supply ore, forest suppliers bring logs, t62_String_Maker brings pre-gathered string, and the central forge team smelts/crafts everything.

  MATERIAL REQUIREMENTS
  - Golden Sword: 15 goldbar + 1 hilt2 (Smithing 62)
  - Golden Bow: 15 goldbar + 10 string + 2 logs (Fletching 32)
  - 2 Heavy Swords: 4 ironbar + 2 hilt2 (Smithing 1)
  - 3 Axes: 9 ironbar + 3 logs (Smithing 3)
  - 1 Wooden Bow: 1 log + 1 string (Fletching 5)
  - 1 Pickaxe: 5 ironbar + 1 log (Smithing 5)
  TOTALS: 30 goldbar, 18 ironbar, 3 hilt2 (have 4), 7 logs, 11 string (have 12)

  FLOW
  1. R1-15 Procurement: t62_Iron_Master (20+ iron ore), t62_Gold_Master (35+ gold ore), t62_Coal_Master (60+ coal) mine around (550-560, 500-545) near southern ore deposits. t62_Lumber_Jack harvests 10+ logs near (250,350). t62_String_Maker already has 12 string and can assist with coordination. Forge team stays at (528,384) monitoring counts.
  2. R16-28 Transport & Consolidation: all gatherers travel toward the forge in ≤32-tile hops, transferring resources via transfer_items (ores/coal → t62_Master_Forger, logs/string → t62_Weaponsmith). When observe_environment is unavailable, rely on grid movement plus harvest confirmations.
  3. R29-45 Production: t62_Master_Forger smelts ~18 iron + ~30 gold bars (announce milestones). t62_Weaponsmith crafts in order: pickaxe, axes, wooden bow, heavy swords, golden sword, golden bow; ensure hilts/strings/logs are allocated before crafting each recipe.
  4. R46-52 Verification: verify_inventory shows every weapon, and the consortium announces "Arsenal complete" before calling complete().

  EXECUTION NOTES
  - Keep a shared progress log ("Gold 18/30", "Iron 10/18") so the forge can plan smelting batches.
  - If smelting lags, prioritize the bars required for non-gold weapons first so counts progress toward the objective.
  - Transfers only succeed within ~10 tiles; both parties must acknowledge receipt and run verify_inventory.
  - t62_Weaponsmith has 4 hilt2 but only needs 3 for the arsenal (1 golden sword + 2 heavy swords).


  ITEM KEY REFERENCE (use these exact itemKey values in craft_item):
  - Wooden Bow: itemKey=woodenbow (Fletching)
  - Golden Bow: itemKey=goldenbow (Fletching)
  - Arrow: itemKey=arrow (Fletching)
  - Stick/Shaft: itemKey=stick (Fletching)
  - Sword/Heavy Sword: itemKey=sword2 (Smithing)
  - Golden Sword: itemKey=goldensword (Smithing)
  - Axe: itemKey=axe (Smithing)
  - Pickaxe: itemKey=pickaxe (Smithing)
  - Silver Ring: itemKey=silverring (Smithing)
  - Gold Ring: itemKey=goldring (Smithing)
  - Topaz Ring: itemKey=topazring (Smithing)
  - Staff: itemKey=staff (Crafting)
  - Lightning Staff: itemKey=lightningstaff (Crafting)
  - Fire Staff: itemKey=firestaff (Crafting)
  - Ice Staff: itemKey=icestaff (Crafting)
  - Nature Staff: itemKey=naturestaff (Crafting)
  - Bucket: itemKey=bucket (Crafting)
  - Beryl Pendant: itemKey=berylpendant (Crafting)
  - Iron Bar: itemKey=ironbar (Smelting)
  - Gold Bar: itemKey=goldbar (Smelting)
  - Bronze Bar: itemKey=bronzebar (Smelting)
  - Cooked Shrimp: itemKey=cookedshrimp (Cooking)
  - Stew: itemKey=stew (Cooking)


# Limitations
max_action_steps: 52

