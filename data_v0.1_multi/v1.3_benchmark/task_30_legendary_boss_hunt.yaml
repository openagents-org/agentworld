# AgentWorld Multi-Agent Task Configuration

task:
  name: "Legendary Boss Hunt - Triple Boss Elimination"
  description: "Three agents work together to defeat three legendary bosses across different regions"

# Task objectives
objectives:
  primary: "Defeat the Mermaid at (580, 755), the Dark Wolf at (1016, 682), and the Ice Knight at (712, 717)"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent boss hunting scenario requiring coordinated combat across regions.

  OBJECTIVE: Defeat three legendary bosses in different regions of the world.

  TARGET BOSSES:
  - Mermaid (Level 55): Located at coastal region (580, 755)
  - Dark Wolf (Level 0): Located at dark region (1016, 682)
  - Ice Knight (Level 62): Located at castle region (712, 717)

  TEAM COORDINATION:
  - Use global chat to coordinate boss locations and attack timing
  - Share healing items and provide combat support
  - Assign roles: tank, damage dealer, support

  COMBAT STRATEGY:
  - Mermaid: Water-based attacks, use ranged weapons
  - Golden Golem: Heavy armor, use crush damage
  - Ice Knight: Freezing attacks, maintain distance and heal frequently

  DO NOT use complete() until ALL three bosses are defeated!

# Limitations
max_action_steps: 40

