# AgentWorld Multi-Agent Task Configuration

task:
  name: "Smithy Operation - Weapon and Tool Production"
  description: "Five smiths work together to produce weapons and tools"

# Task objectives
objectives:
  primary: "Craft 1x Heavy Sword, 1x Pickaxe, and 2x Silver Rings"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent smithing scenario.

  OBJECTIVE: Produce a set of smithed items.

  PRODUCTION TARGETS:
  - 1x Heavy Sword (2x ironbar + 1x hilt2)
  - 1x Pickaxe (5x ironbar + 1x logs)
  - 2x Silver Ring (2x ironbar each)

  TOTAL IRON REQUIRED: 11x ironbar
  - Need 11x ironore + 11x coal for smelting

  TEAM ROLES:
  - Miners: Extract iron ore and coal
  - Lumberjack: Provide logs
  - Smelter: Process ore to bars
  - Smiths: Craft final items

  DO NOT use complete() until all items are crafted!

# Limitations
max_action_steps: 42

