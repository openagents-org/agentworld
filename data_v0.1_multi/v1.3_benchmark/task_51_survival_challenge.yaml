# AgentWorld Multi-Agent Task Configuration

task:
  name: "Survival Challenge - Equipment and Resource Preparation"
  description: "Five agents gather resources and craft essential survival equipment"

# Task objectives
objectives:
  primary: "Craft 1x Wooden Bow, 1x Axe, and collect 5x rawshrimp and 4x logs"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent survival preparation scenario.

  OBJECTIVE: Prepare equipment and gather food resources.

  PRODUCTION TARGETS:
  - 1x Wooden Bow (1x logs + 1x string)
  - 1x Axe (3x ironbar + 1x logs)
  - 5x rawshrimp (fishing)
  - 4x logs (lumberjacking)

  CRAFTING RECIPES (use exact itemKey values):
  - Wooden Bow: craft_item(skill=Fletching, itemKey=woodenbow) - requires 1x logs + 1x string
  - Axe: craft_item(skill=Smithing, itemKey=axe) - requires 3x ironbar + 1x logs

  MATERIAL SOURCES:
  - Logs: Oak trees in forest (harvest_resource on Oak tree instances)
  - Shrimp: Coastal fishing spots (harvest_resource on fishing spot instances)
  - Iron bars: Provided to crafter

  TEAM ROLES:
  - Fishers: Catch shrimp
  - Lumberjacks: Gather logs
  - Crafter: Make bow and axe

  DO NOT use complete() until all items are ready!

  ITEM KEY REFERENCE (use these exact itemKey values in craft_item):
  - Wooden Bow: itemKey=woodenbow (Fletching)
  - Golden Bow: itemKey=goldenbow (Fletching)
  - Arrow: itemKey=arrow (Fletching)
  - Stick/Shaft: itemKey=stick (Fletching)
  - Sword/Heavy Sword: itemKey=sword2 (Smithing)
  - Golden Sword: itemKey=goldensword (Smithing)
  - Axe: itemKey=axe (Smithing)
  - Pickaxe: itemKey=pickaxe (Smithing)
  - Silver Ring: itemKey=silverring (Smithing)
  - Gold Ring: itemKey=goldring (Smithing)
  - Staff: itemKey=staff (Crafting)
  - Lightning Staff: itemKey=lightningstaff (Crafting)
  - Fire Staff: itemKey=firestaff (Crafting)
  - Ice Staff: itemKey=icestaff (Crafting)
  - Nature Staff: itemKey=naturestaff (Crafting)
  - Bucket: itemKey=bucket (Crafting)
  - Iron Bar: itemKey=ironbar (Smelting)
  - Gold Bar: itemKey=goldbar (Smelting)
  - Bronze Bar: itemKey=bronzebar (Smelting)
  - Cooked Shrimp: itemKey=cookedshrimp (Cooking)
  - Stew: itemKey=stew (Cooking)


