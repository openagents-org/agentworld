# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cooperative Magic Staff Crafting - Wizard Equipment Preparation"
  description: "Three agents work together to gather materials and craft a magical staff for spellcasting"

# Task objectives
objectives:
  primary: "Prepare wizard_agent with crafted magic staff for magical combat"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent scenario where teamwork is essential.
  
  OBJECTIVE: Work together to create a magic staff for the wizard_agent to prepare for magical combat.
  
  TEAM COORDINATION:
  - Use global chat to communicate and coordinate your actions
  - Share resources and materials between team members as needed
  - Leverage each agent's specialized skills effectively
  - Stay within reasonable distance for successful item transfers
  - Complete the objective within the time limit
  
  GENERAL STRATEGY:
  - The team needs to gather wood materials and craft components in sequence
  - Coordinate locations to enable successful material transfers between agents
  - Someone needs to collect logs, someone needs to craft sticks, someone assembles the staff
  - Work together to determine who does what based on your skills and current situation
  - Stay close enough for transfers - use coordination and positioning wisely
  
  DO NOT use complete() until ALL objectives are achieved by the team!

  ITEM KEY REFERENCE (use these exact itemKey values in craft_item):
  - Wooden Bow: itemKey=woodenbow (Fletching)
  - Golden Bow: itemKey=goldenbow (Fletching)
  - Arrow: itemKey=arrow (Fletching)
  - Stick/Shaft: itemKey=stick (Fletching)
  - Sword/Heavy Sword: itemKey=sword2 (Smithing)
  - Golden Sword: itemKey=goldensword (Smithing)
  - Axe: itemKey=axe (Smithing)
  - Pickaxe: itemKey=pickaxe (Smithing)
  - Silver Ring: itemKey=silverring (Smithing)
  - Gold Ring: itemKey=goldring (Smithing)
  - Staff: itemKey=staff (Crafting)
  - Lightning Staff: itemKey=lightningstaff (Crafting)
  - Fire Staff: itemKey=firestaff (Crafting)
  - Ice Staff: itemKey=icestaff (Crafting)
  - Nature Staff: itemKey=naturestaff (Crafting)
  - Bucket: itemKey=bucket (Crafting)
  - Iron Bar: itemKey=ironbar (Smelting)
  - Gold Bar: itemKey=goldbar (Smelting)
  - Bronze Bar: itemKey=bronzebar (Smelting)
  - Cooked Shrimp: itemKey=cookedshrimp (Cooking)
  - Stew: itemKey=stew (Cooking)

  
  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  🪵 Lumberjacking - logs:
    - harvest_resource on OAK TREE instances to get logs (NOT Willow trees!)
    - Level required: 1+ (Lumberjacking skill)
    - IMPORTANT: Look for "Oak", "Oak2", "Oak3", "Oak4", or "Oak5" tree types
    - AVOID: Willow trees (Level 30, produces willowlogs), Pine trees, etc.
  
  🪄 Fletching Recipe - stick:
    - craft_item skill=Fletching itemKey=stick
    - Materials: 1x logs → 4x stick
    - Level required: 1 (Fletching skill)
    - IMPORTANT: Need minimum 2x logs to get enough sticks for the staff!
  
  ⚡ Crafting Recipe - staff:
    - craft_item skill=Crafting itemKey=staff
    - Materials: 5x stick + 1x bead → 1x staff
    - Level required: 1 (Crafting skill)
    - CRITICAL: Requires exactly 5x stick (from 2x logs) + magic bead!

# Limitations
max_action_steps: 25

# Agent configurations
agent_1:
  username: "lumberjack_agent"
  new_character: true
  
  # Starting location - near oak trees for tree cutting
  location:
    x: 270
    y: 80
  
  # Skills focused on lumberjacking
  skill_levels:
    lumberjacking: 25
    strength: 25
    health: 25
  
  # Lumberjacking equipment and basic supplies
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
  
  equipped_items:
    - item: "axe"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0


agent_2:
  username: "woodworker_agent"
  new_character: true
  
  # Starting location - near oak trees for coordination
  location:
    x: 275
    y: 85
  
  # Skills focused on fletching and crafting
  skill_levels:
    fletching: 15      # Required for stick crafting
    crafting: 10       # Additional crafting capability
    strength: 20
    health: 20
  
  # Basic supplies
  inventory_items:
    - item: "flask"
      count: 8
    - item: "apple"
      count: 12
  
  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0


agent_3:
  username: "wizard_agent"
  new_character: true
  
  # Starting location - near team for coordination
  location:
    x: 280
    y: 90
  
  # Skills focused on crafting and magic
  skill_levels:
    crafting: 15       # Required for staff crafting
    magic: 25
    health: 25
    strength: 15
  
  # Magical supplies and basic gear
  inventory_items:
    - item: "flask"
      count: 10
    - item: "apple"
      count: 15
    - item: "bead"
      count: 1
  
  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0


# Success criteria for multi-agent task
success_criteria:
  - "lumberjack_agent successfully gathers and transfers logs to woodworker_agent"
  - "woodworker_agent successfully crafts sticks and transfers to wizard_agent"
  - "wizard_agent receives materials and crafts a magic staff"
  - "wizard_agent successfully equips the magic staff"
  - "All agents use global chat for coordination throughout the process"
  - "wizard_agent declares readiness for magical combat"
