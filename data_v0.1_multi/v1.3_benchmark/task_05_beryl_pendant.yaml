# Success criteria for multi-agent task
success_criteria:
  - "forager_agent successfully collects and transfers blue lily"
  - "gem_miner_agent successfully transfers beryl to jeweler"
  - "jeweler_agent receives materials and crafts string"
  - "jeweler_agent successfully crafts and equips beryl pendant"
  - "All agents coordinate material gathering and crafting efficiently"
  - "Elegant jewelry production completes within time limit"
