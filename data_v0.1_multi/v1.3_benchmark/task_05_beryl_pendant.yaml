# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cooperative Beryl Pendant Crafting - Elegant Jewelry"
  description: "Three agents work together to create a beryl pendant through foraging, gem mining, and jewelry crafting"

# Task objectives
objectives:
  primary: "Create a beryl pendant by combining beryl gem with crafted string"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent jewelry crafting scenario requiring both foraging and mining skills.
  
  OBJECTIVE: Create a beryl pendant by combining beryl gem with crafted string from natural materials.
  
  TEAM COORDINATION:
  - Use global chat to share locations of foraging and mining resources
  - Coordinate between plant gathering and gem mining operations
  - Share materials for intermediate crafting steps
  - Work together to complete elegant jewelry crafting
  
  GENERAL STRATEGY:
  - The team needs to gather plant materials for string crafting
  - Someone needs to locate and collect specific flowers for string crafting
  - Beryl gem is already provided in gem_miner_agent's inventory
  - Materials must be processed into components and assembled into jewelry
  - Focus on foraging and crafting activities for efficient completion
  
  DO NOT use complete() until ALL objectives are achieved by the team!
  
  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  🌸 Foraging - bluelily:
    - harvest_resource on bluelily instances to get bluelily
    - Level required: 10+ (Foraging skill)
  
  💎 Beryl gem:
    - Already provided in gem_miner_agent's initial inventory
    - No mining required for this task
  
  🧵 Crafting Recipe - string:
    - craft_item skill=Crafting itemKey=string
    - Materials: 1x bluelily → 1x string
    - Level required: 1 (Crafting skill)
  
  📿 Crafting Recipe - beryl pendant:
    - craft_item skill=Crafting itemKey=berylpendant
    - Materials: 1x beryl + 1x string → 1x beryl pendant
    - Level required: 1 (Crafting skill)

# Limitations
max_action_steps: 25

# Agent configurations
