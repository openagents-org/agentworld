task:
  name: Ice Cavern Challenge - Frozen Tundra Survival
  description: Three agents work together to survive harsh ice caverns, defeat ice
    guardians, and harvest rare frozen resources
objectives:
  primary: Successfully explore ice caverns, defeat Ice Guardians, and harvest rare
    Ice Oak lumber for cold-weather equipment
relevant_game_context: "This is a cooperative multi-agent cold-weather survival expedition\
  \ requiring environmental adaptation.\n\nOBJECTIVE: Survive dangerous ice caverns,\
  \ defeat powerful ice guardians, and harvest rare frozen materials.\n\nMISSION REQUIREMENTS:\n\
  - Navigate to Frozen/Ice region (Region 2-1: coordinates 228-260, 151-156)\n- Defeat\
  \ multiple Ice Guardians (Level 35) in coordinated combat\n- Harvest rare Ice Oak\
  \ trees for specialized cold-weather lumber\n- Survive freezing environmental damage\
  \ and ice-based attacks\n\nTEAM COORDINATION:\n- Use global chat to share ice cavern\
  \ entrance locations and guardian positions\n- Coordinate between cold-weather survival,\
  \ combat, and resource harvesting\n- Share warming items and provide mutual protection\
  \ against freezing damage\n- Work together to navigate treacherous ice cavern terrain\
  \ safely\n\nGENERAL STRATEGY:\n- The team needs to reach northern mountain ice regions\
  \ quickly\n- Multiple Ice Guardians (Level 35) require coordinated high-level combat\n\
  - Ice Oak trees are rare and found only in frozen biomes\n- Environmental freezing\
  \ damage requires constant health management\n- Balance combat engagement with resource\
  \ harvesting and survival needs\n\nDO NOT use complete() until ALL objectives are\
  \ achieved by the team!\n\nICE CAVERN SURVIVAL & COMBAT (CRITICAL KNOWLEDGE):\n\U0001F9CA\
  \ Environmental Hazards:\n  - Freezing overlay type causes continuous cold damage\n\
  \  - Use healing items frequently to counter environmental damage\n  - Ice caverns\
  \ have reduced visibility and slippery movement\n  - Coordinate movement carefully\
  \ to avoid ice hazards\n\n❄️ Combat - Ice Guardians:\n  - Use observe_environment\
  \ to locate Ice Guardians at (259,151) and (260,156)\n  - Level 35 creatures with\
  \ ice-based attacks and high defense\n  - Expect freezing attacks that slow movement\
  \ and reduce accuracy\n  - Use fire-based weapons/magic for elemental advantage\n\
  \  - Coordinate flanking attacks to avoid ice projectiles\n\n\U0001F332 Lumberjacking\
  \ - Ice Oak:\n  - harvest_resource on Ice Oak Tree instances to get iceoaklogs\n\
  \  - Level required: 20+ (Lumberjacking skill)\n  - Tool required: Axe (preferably\
  \ enchanted for cold resistance)\n  - RARE: Ice Oak trees only found in frozen biomes\n\
  \n\U0001F525 Cold Weather Survival:\n  - Maintain high health levels to counter\
  \ freezing damage\n  - Use fire-based equipment for warmth and combat advantage\n\
  \  - Stay close to teammates for mutual warming effects\n  - Plan efficient routes\
  \ to minimize exposure time\n\n\U0001F9EA Combat Strategy:\n  - Use ranged attacks\
  \ when possible to avoid ice melee damage\n  - Coordinate healing rotations to maintain\
  \ team health\n  - Focus fire on one guardian at a time for efficient elimination\n"
max_action_steps: 33
