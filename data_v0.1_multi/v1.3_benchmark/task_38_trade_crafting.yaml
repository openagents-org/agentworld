# AgentWorld Multi-Agent Task Configuration

task:
  name: "Trade Crafting - Gold Ring Production"
  description: "Three agents work together to mine gold and craft valuable gold rings"

# Task objectives
objectives:
  primary: "Mine gold ore, smelt 2x gold bars, and craft 1x Gold Ring"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent mining and crafting scenario.

  OBJECTIVE: Create a valuable gold ring through mining and smithing.

  PRODUCTION CHAIN:
  1. Mine 2x goldore from Gold rocks (Level 25 mining)
  2. Mine 2x coal from Coal rocks (Level 1 mining)
  3. Smelt 2x goldbar (1x goldore + 1x coal → 1x goldbar)
  4. Craft 1x goldring (2x goldbar → 1x goldring)

  ⚠️ CRITICAL ITEM KEYS - MUST USE EXACTLY:
  - Mining gold gives itemKey=goldore (NOT goldnugget!)
  - Mining coal gives itemKey=coal
  - When transferring to smith_agent, use:
    * transfer_items(count=2, itemKey=goldore, targetPlayer=smith_agent)
    * transfer_items(count=2, itemKey=coal, targetPlayer=smith_agent)
  - Smelting gold bars: craft_item(itemKey=goldbar, skill=Smelting) requires goldore+coal
  - Crafting gold ring: craft_item(itemKey=goldring, skill=Smithing) requires 2x goldbar

  RESOURCE LOCATIONS:
  - Gold rocks: Eastern mountain regions around (280-290, 30-35) - verified Gold Rock locations
  - Coal rocks: Southern volcanic/desert regions around (550-570, 540-560) - Dense coal area
  
  CRITICAL: Gold and Coal are in DIFFERENT regions!
  - Gold mining team goes EAST to (280-290, 30-35)
  - Coal mining team goes SOUTH to (550-570, 540-560)
  - Coordinate transfers to smith for smelting

  TEAM COORDINATION:
  - Split mining duties: Gold ore (east) and Coal (south) are far apart
  - Use chat to coordinate who mines what
  - Transfer all materials to smith_agent for smelting and crafting
  - Gold rocks are rare - focus experienced miner on gold
  - Coal is more common in southern region - lower skilled agent can gather coal
  - IMPORTANT: Use itemKey=goldore for all gold ore transfers (NOT goldnugget)

  DO NOT use complete() until gold ring is crafted!

  ITEM KEY REFERENCE FOR THIS TASK:
  ⚠️ MINING MATERIALS (use in transfer_items):
  - Gold Ore (mined from Gold Rock): itemKey=goldore ⚠️ DO NOT USE goldnugget!
  - Coal (mined from Coal Rock): itemKey=coal
  
  ⚠️ SMELTING RECIPES (use in craft_item with skill=Smelting):
  - Gold Bar: itemKey=goldbar (requires 1x goldore + 1x coal)
  
  ⚠️ SMITHING RECIPES (use in craft_item with skill=Smithing):
  - Gold Ring: itemKey=goldring (requires 2x goldbar)
  
  OTHER ITEM KEY REFERENCE (for general knowledge):
  - Wooden Bow: itemKey=woodenbow (Fletching)
  - Golden Bow: itemKey=goldenbow (Fletching)
  - Arrow: itemKey=arrow (Fletching)
  - Stick/Shaft: itemKey=stick (Fletching)
  - Sword/Heavy Sword: itemKey=sword2 (Smithing)
  - Golden Sword: itemKey=goldensword (Smithing)
  - Axe: itemKey=axe (Smithing)
  - Pickaxe: itemKey=pickaxe (Smithing)
  - Silver Ring: itemKey=silverring (Smithing)
  - Iron Bar: itemKey=ironbar (Smelting)
  - Bronze Bar: itemKey=bronzebar (Smelting)
  - Cooked Shrimp: itemKey=cookedshrimp (Cooking)
  - Stew: itemKey=stew (Cooking)


