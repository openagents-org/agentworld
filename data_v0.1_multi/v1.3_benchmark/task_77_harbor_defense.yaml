# AgentWorld Multi-Agent Task Configuration

task:
  name: "Harbor Defense - Coastal Boss Battle"
  description: "Ten agents prepare defenses and defeat coastal bosses"

# Task objectives
objectives:
  primary: "Defeat the Water Guardian at (197, 633), the Mermaid at (580, 755), and craft 2x Wooden Bow"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent coastal defense scenario.

  OBJECTIVE: Defend the harbor by defeating coastal bosses.

  TARGET BOSSES:
  - Water Guardian: Located at (197, 633)
  - Mermaid: Located at (580, 755)

  PRODUCTION TARGETS:
  - 2x Wooden Bow (1x logs + 1x string each)

  TEAM ROLES:
  - Combat Squad: Engage and defeat bosses
  - Archers: Ranged support
  - Crafters: Make bows

  DO NOT use complete() until bosses are defeated and bows are crafted!

# Limitations
max_action_steps: 48

