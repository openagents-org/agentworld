# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cooking Guild - Multi-Dish Preparation"
  description: "Seven cooks gather ingredients and prepare various cooked dishes"

# Task objectives
objectives:
  primary: "Cook 2x Corn Stew, 2x Cooked Shrimp, 2x Cooked Chicken, and 1x Jellyfish Smoothie"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent cooking scenario.

  OBJECTIVE: Prepare a variety of cooked dishes.

  PRODUCTION TARGETS:
  - 2x Corn Stew (corn + bowl)
  - 2x Cooked Shrimp (cook rawshrimp)
  - 2x Cooked Chicken (cook rawchicken)
  - 1x Jellyfish Smoothie (cook jellyfish)

  GATHERING REQUIREMENTS:
  - 2x corn (foraging)
  - 2x bowl (for stews)
  - 2x rawshrimp (fishing)
  - 1x jellyfish (fishing)
  - 2x rawchicken (hunting)

  TEAM ROLES:
  - Foragers: Gather vegetables
  - Fishers: Catch seafood
  - Hunters: Hunt chickens
  - Cooks: Prepare all dishes

  DO NOT use complete() until all dishes are ready!

# Limitations
max_action_steps: 45

