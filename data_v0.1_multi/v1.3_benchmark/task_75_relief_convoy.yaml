# AgentWorld Multi-Agent Task Configuration

task:
  name: "Relief Convoy - Supply Preparation"
  description: "Ten agents gather resources and prepare supplies for delivery"

# Task objectives
objectives:
  primary: "Cook 6x Cooked Shrimp, craft 2x Pickaxe, and collect 8x logs"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent supply preparation scenario.

  OBJECTIVE: Prepare supplies for the relief convoy.

  PRODUCTION TARGETS:
  - 6x Cooked Shrimp (cook 6x rawshrimp)
  - 2x Pickaxe (5x ironbar + 1x logs each)
  - 8x logs (from forest)

  GATHERING REQUIREMENTS:
  - 6x rawshrimp (fishing at coast)
  - 8x logs (from forest)
  - Iron bars provided to smiths

  TEAM ROLES:
  - Fishers: Catch shrimp
  - Loggers: Gather logs
  - Cooks: Prepare food
  - Smiths: Craft tools

  DO NOT use complete() until all supplies are ready!

# Limitations
max_action_steps: 45

