# AgentWorld Multi-Agent Task Configuration

task:
  name: "Supply Network - Resource Collection"
  description: "Eight agents gather resources from multiple regions"

# Task objectives
objectives:
  primary: "Collect 8x logs from forest and 6x coal from mountain"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent resource collection scenario.

  OBJECTIVE: Gather resources from different regions.

  COLLECTION TARGETS:
  - 8x logs (from forest region)
  - 6x coal (from coal mining area region)

  REGION LOCATIONS:
  - Forest (Oak Trees): Around (250, 35) - produces logs
  - Coal mining area: Around (555, 545)

  TEAM ROLES:
  - Loggers: Gather logs from forest
  - Miners: Extract coal from mountain

  DO NOT use complete() until all resources are collected!

# Limitations
max_action_steps: 40

