# AgentWorld Multi-Agent Task Configuration

task:
  name: "Supply Network - Resource Processing Chain"
  description: "Eight agents coordinate a multi-region supply chain to gather, process, and craft resources"

# Task objectives
objectives:
  primary: "Collect 6x logs, craft 2x Axe, 1x Wooden Bow, 1x Pickaxe, and 1x Heavy Sword"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent supply chain scenario.

  OBJECTIVE: Gather resources from forest and mountain regions, then process and craft tools and weapons.

  PRODUCTION TARGETS:
  - 6x logs (collected from forest region)
  - 2x Axe (3x ironbar + 1x logs each)
  - 1x Wooden Bow (1x logs + 1x string)
  - 1x Pickaxe (5x ironbar + 1x logs)
  - 1x Heavy Sword (2x ironbar + 1x hilt2)

  TOTAL IRON NEEDED: 13x ironbar
  - Requires 13x ironore + 13x coal for smelting
  - Smith starts with 2x ironbar, smelter must produce 11 more

  REGION LOCATIONS:
  - Forest (Oak Trees): Around (250, 35) - produces logs
  - Mountain: Around (555, 545) - iron ore and coal mining
  - Furnace area: Around (552, 510) - smelting and smithing

  TEAM ROLES:
  - Loggers: Harvest logs from forest
  - Fletcher: Craft Wooden Bow
  - Iron Miners: Mine iron ore from mountain
  - Coal Miner: Mine coal from mountain
  - Smelter: Smelt iron ore + coal into iron bars
  - Smith: Craft axes, pickaxe, and heavy sword

  DO NOT use complete() until all objectives are met!

  ITEM KEY REFERENCE (use these exact itemKey values in craft_item):
  - Wooden Bow: itemKey=woodenbow (Fletching)
  - Stick/Shaft: itemKey=stick (Fletching)
  - Pickaxe: itemKey=pickaxe (Smithing)
  - Axe: itemKey=axe (Smithing)
  - Sword/Heavy Sword: itemKey=sword2 (Smithing)
  - Iron Bar: itemKey=ironbar (Smelting)
  - Gold Bar: itemKey=goldbar (SMITHING) - requires goldnugget only, NO coal
  - Bronze Bar: itemKey=bronzebar (Smelting)
  - Cooked Shrimp: itemKey=cookedshrimp (Cooking)
  - Stew: itemKey=stew (Cooking)


# Limitations
max_action_steps: 45

