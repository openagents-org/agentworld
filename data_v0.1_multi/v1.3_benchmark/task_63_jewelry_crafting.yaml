# AgentWorld Multi-Agent Task Configuration

task:
  name: "Jewelry Crafting - Ring and Pendant Workshop"
  description: "Six artisans gather materials and craft jewelry pieces"

# Task objectives
objectives:
  primary: "Craft 2x Gold Ring, 2x Silver Ring, and 2x Beryl Pendant"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent jewelry crafting scenario.

  OBJECTIVE: Create a jewelry collection.

  PRODUCTION TARGETS:
  - 2x Gold Ring (2x goldbar each = 4x goldbar total)
  - 2x Silver Ring (2x ironbar each = 4x ironbar total)
  - 2x Beryl Pendant (beryl + string each)

  MATERIAL REQUIREMENTS:
  - 4x goldnugget (from gold rocks) -> craft goldbar via SMITHING (no coal needed)
  - 4x ironore + 4x coal (for iron bars via Smelting)
  - 2x beryl (from beryl rocks - requires MINING)
  - 2x string (for pendants)

  IMPORTANT CRAFTING NOTES:
  - Gold Bar: Use SMITHING skill with goldnugget (NOT Smelting)
  - Iron Bar: Use Smelting skill with ironore + coal

  TEAM ROLES:
  - Gold Miner: Extract gold nuggets from gold rocks
  - Iron Miner: Extract iron ore
  - Coal Miner: Mine coal (for iron bars only)
  - Beryl Miner: Mine beryl rocks (requires mining skill)
  - Smelter: Smelt iron bars (Smelting), craft gold bars (Smithing)
  - Jeweler: Craft all jewelry

  DO NOT use complete() until all jewelry is crafted!

  ITEM KEY REFERENCE (use these exact itemKey values in craft_item):
  - Wooden Bow: itemKey=woodenbow (Fletching)
  - Golden Bow: itemKey=goldenbow (Fletching)
  - Arrow: itemKey=arrow (Fletching)
  - Stick/Shaft: itemKey=stick (Fletching)
  - Sword/Heavy Sword: itemKey=sword2 (Smithing)
  - Golden Sword: itemKey=goldensword (Smithing)
  - Axe: itemKey=axe (Smithing)
  - Pickaxe: itemKey=pickaxe (Smithing)
  - Silver Ring: itemKey=silverring (Smithing)
  - Gold Ring: itemKey=goldring (Smithing)
  - Staff: itemKey=staff (Crafting)
  - Lightning Staff: itemKey=lightningstaff (Crafting)
  - Fire Staff: itemKey=firestaff (Crafting)
  - Ice Staff: itemKey=icestaff (Crafting)
  - Nature Staff: itemKey=naturestaff (Crafting)
  - Bucket: itemKey=bucket (Crafting)
  - Iron Bar: itemKey=ironbar (Smelting) - requires ironore + coal
  - Gold Bar: itemKey=goldbar (Smithing) - requires goldnugget only, NO coal
  - Bronze Bar: itemKey=bronzebar (Smelting)
  - Cooked Shrimp: itemKey=cookedshrimp (Cooking)
  - Stew: itemKey=stew (Cooking)


# Limitations
max_action_steps: 42

