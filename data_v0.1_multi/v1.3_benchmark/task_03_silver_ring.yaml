# AgentWorld Multi-Agent Task Configuration

task:
  name: "Cooperative Silver Ring Forging - Jewelry Crafting"
  description: "Three agents work together to mine, smelt, and forge a silver ring"

# Task objectives
objectives:
  primary: "Create a silver ring through coordinated mining, smelting, and smithing"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent jewelry crafting scenario.

  OBJECTIVE: Create a silver ring. smith_agent ALREADY HAS the required materials!

  CRITICAL: smith_agent ALREADY HAS 2x ironbar in inventory - ready to craft!

  TEAM COORDINATION:
  - Use global chat to coordinate
  - smith_agent should craft the silver ring immediately
  - Other agents can assist or observe

  SMITHING RECIPE (CRITICAL - USE THIS EXACT COMMAND):
  🔨 Smithing Recipe - silverring:
    - Command: craft_item skill=Smithing itemKey=silverring
    - Materials: 2x ironbar → 1x silverring
    - Level required: 1 (Smithing skill)
    - smith_agent has Smithing skill level 25 and 2x ironbar ready!

  SIMPLE STEPS:
  1. smith_agent should use: craft_item skill=Smithing itemKey=silverring
  2. This will convert 2 ironbar into 1 silverring
  3. Once silverring exists in inventory, the team can complete()

  DO NOT use complete() until silverring is in inventory!

  ITEM KEY REFERENCE (use these exact itemKey values in craft_item):
  - Wooden Bow: itemKey=woodenbow (Fletching)
  - Golden Bow: itemKey=goldenbow (Fletching)
  - Arrow: itemKey=arrow (Fletching)
  - Stick/Shaft: itemKey=stick (Fletching)
  - Sword/Heavy Sword: itemKey=sword2 (Smithing)
  - Golden Sword: itemKey=goldensword (Smithing)
  - Axe: itemKey=axe (Smithing)
  - Pickaxe: itemKey=pickaxe (Smithing)
  - Silver Ring: itemKey=silverring (Smithing)
  - Gold Ring: itemKey=goldring (Smithing)
  - Staff: itemKey=staff (Crafting)
  - Lightning Staff: itemKey=lightningstaff (Crafting)
  - Fire Staff: itemKey=firestaff (Crafting)
  - Ice Staff: itemKey=icestaff (Crafting)
  - Nature Staff: itemKey=naturestaff (Crafting)
  - Bucket: itemKey=bucket (Crafting)
  - Iron Bar: itemKey=ironbar (Smelting)
  - Gold Bar: itemKey=goldbar (Smelting)
  - Bronze Bar: itemKey=bronzebar (Smelting)
  - Cooked Shrimp: itemKey=cookedshrimp (Cooking)
  - Stew: itemKey=stew (Cooking)


