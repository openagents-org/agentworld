task:
  name: Resource Survey - Continental Exploration
  description: Sixteen agents gather resources from multiple biomes
objectives:
  primary: Collect 8x logs, 8x ironore, 6x icelogs, and 4x rawshrimp from different
    regions
relevant_game_context: 'This is a cooperative multi-agent survey scenario.


  OBJECTIVE: Gather resources from all major biomes.


  PRODUCTION TARGETS:

  - 8x logs (from forest)

  - 8x ironore (from iron rocks at 545, 495)

  - 6x icelogs (from ice region)

  - 4x rawshrimp (from coast)


  ORE TYPE REFERENCE (important - different rocks give different ores):

  - Iron Rock (around 545, 495): gives "ironore" (requires mining level 10)

  - Nisoc Rock (around 336, 5): gives "nisocore" (NOT iron!)


  LOCATIONS:

  - Forest: Around (388, 10)

  - Iron Ore Mining: Around (545, 495) - THIS IS WHERE IRON ROCKS ARE

  - Ice Region: Around (456, 15)

  - Coast: Around (685, 13)


  TEAM ROLES:

  - Forest Team: Harvest logs

  - Mountain Team: Mine iron rocks at (545, 495) for ironore

  - Ice Team: Harvest ice logs

  - Coastal Team: Fish shrimp


  DO NOT use complete() until all objectives are met!

  '
