# AgentWorld Multi-Agent Task Configuration

task:
  name: "Resource Survey - Continental Exploration"
  description: "Sixteen agents gather resources from multiple biomes"

# Task objectives
objectives:
  primary: "Collect 8x logs, 8x ironore, 6x icelogs, and 4x rawshrimp from different regions"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent survey scenario.

  OBJECTIVE: Gather resources from all major biomes.

  PRODUCTION TARGETS:
  - 8x logs (from forest)
  - 8x ironore (from mountain)
  - 6x icelogs (from ice region)
  - 4x rawshrimp (from coast)

  LOCATIONS:
  - Forest: Around (388, 10)
  - Mountain: Around (230, 40)
  - Ice Region: Around (259, 151)
  - Coast: Around (580, 750)

  TEAM ROLES:
  - Forest Team: Harvest logs
  - Mountain Team: Mine iron ore
  - Ice Team: Harvest ice logs
  - Coastal Team: Fish shrimp

  DO NOT use complete() until all objectives are met!

# Limitations
max_action_steps: 55

