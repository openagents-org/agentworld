# AgentWorld Multi-Agent Task Configuration

task:
  name: "Survival Gathering - Food and Resource Collection"
  description: "Three agents work together to gather survival resources including food and materials"

# Task objectives
objectives:
  primary: "Collect 5x blueberry, 3x corn, and 4x logs for survival supplies"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent survival gathering scenario.

  OBJECTIVE: Gather essential survival resources.

  COLLECTION TARGETS:
  - 5x blueberry (from Blueberry bushes, Level 1 foraging)
  - 3x corn (from Corn plants, Level 5 foraging)
  - 4x logs (from Oak trees, Level 1 lumberjacking)

  RESOURCE LOCATIONS:
  - Blueberry bushes: Western regions around (120-130, 20-25) - Look for "Blueberry" plants NOT "Blue Lily"
  - Corn: Farming areas around (230-250, 200-210) - verified locations
  - Oak trees: Eastern forest (388, 3) or mountain foothills (230-240, 40-45) - for regular "logs"
  
  CRITICAL DISTINCTIONS:
  - Blueberry ≠ Blue Lily (Blue Lily is a herb, NOT the blueberry fruit!)
  - Oak logs ≠ Ice Logs (Ice Logs come from Snowoak/Ice Oak trees)
  - Look for "Blueberry" plants specifically, NOT "Bluelily" plants
  - Look for "Oak", "Oak2", "Oak3", "Oak4", or "Oak5" trees, NOT "Snow Oak" or "Ice Oak"

  TEAM COORDINATION:
  - forager_agent: Gather 5x blueberry from Blueberry bushes (around 125, 22)
  - farmer_agent: Gather 3x corn from Corn plants (around 240, 205)
  - lumberjack_agent: Gather 4x logs from Oak trees (around 388, 3)
  - Use global chat to coordinate and share progress
  - Verify you're collecting the CORRECT resource type (check item names in inventory!)

  DO NOT use complete() until all resources are collected!

# Limitations
max_action_steps: 30

