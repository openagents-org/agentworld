# AgentWorld Multi-Agent Task Configuration

task:
  name: "Elemental Bosses - Multi-Boss Combat"
  description: "Ten agents defeat multiple elemental bosses across different regions"

# Task objectives
objectives:
  primary: "Defeat the Ice Guardian at (259, 151), the Iron Ogre at (238, 48), and the Water Guardian at (197, 633)"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent boss combat scenario.

  OBJECTIVE: Defeat three elemental bosses.

  TARGET BOSSES:
  - Ice Guardian (Level 35): Located at ice region (259, 151)
  - Iron Ogre (Level 25): Located at mountain region (238, 48)
  - Water Guardian (Level 36): Located at coastal region (197, 633)

  COMBAT STRATEGY:
  - Split into three squads
  - Each squad attacks their assigned boss
  - Coordinate healing and attacks

  TEAM ROLES:
  - Ice Squad: 3 agents for Ice Guardian
  - Mountain Squad: 3 agents for Ogre
  - Water Squad: 4 agents for Water Guardian

  DO NOT use complete() until all bosses are defeated!

# Limitations
max_action_steps: 48

