task:
  name: Forest Gathering Mission - Wilderness Team Protection
  description: Three agents work together where one guardian protects two collectors
    gathering forest resources from wildlife threats
objectives:
  primary: Successfully protect collectors while they gather 4x palmlogs and 5x peach
    under wildlife threat conditions
relevant_game_context: "This is a cooperative multi-agent forest protection scenario\
  \ requiring tactical coordination.\n\nOBJECTIVE: Successfully gather required forest\
  \ resources while protecting the team from wildlife threats.\n\nMISSION REQUIREMENTS:\n\
  - Collect 4x palmlogs and 5x peach while under potential wildlife threat\n- Keep\
  \ all team members alive throughout the mission\n- Use teamwork to balance resource\
  \ gathering with wilderness security\n\nTEAM COORDINATION:\n- Establish communication\
  \ protocols for wildlife detection and warnings\n- Coordinate movements between\
  \ protection and forest resource gathering\n- Share information about resource locations\
  \ and environmental dangers\n- Work together to ensure both safety and mission success\n\
  \nGENERAL STRATEGY:\n- The team has complementary roles in combat, lumberjacking,\
  \ and foraging\n- Wildlife threats may appear and must be dealt with appropriately\n\
  - Forest resource gathering requires moving to specific locations and materials\n\
  - Balance efficiency with safety - casualties will cause mission failure\n- Use\
  \ global chat for real-time coordination and threat alerts\n\nDO NOT use complete()\
  \ until ALL objectives are achieved safely!\n\nCOMBAT MECHANICS (CRITICAL KNOWLEDGE):\n\
  \U0001F3F9 Combat - Attack threats:\n  - Use observe_environment to detect hostile\
  \ wildlife\n  - Use attack command on hostile targets\n  - Use bow for ranged combat\
  \ advantage\n\n\U0001F334 Lumberjacking - palmlogs:\n  - harvest_resource on palm\
  \ tree instances to get palmlogs\n  - Level required: 5+ (Lumberjacking skill)\n\
  \  - Target: 4x palmlogs total\n  - IMPORTANT: Look for \"Palm\" trees, NOT regular\
  \ oak trees!\n\n\U0001F351 Foraging - peach:\n  - harvest_resource on peach instances\n\
  \  - Level required: 5+ (Foraging skill)  \n  - Target: 5x peach total\n  - IMPORTANT:\
  \ Look for \"Peach\" trees, NOT other fruit trees!\n"
max_action_steps: 25
