# AgentWorld Multi-Agent Task Configuration

task:
  name: "Mountain Rescue - Resource Supply"
  description: "Twelve agents gather supplies for mountain rescue operation"

# Task objectives
objectives:
  primary: "Collect 6x logs, 8x ironore, cook 4x Cooked Shrimp, and craft 2x Pickaxe"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent rescue supply scenario.

  OBJECTIVE: Gather supplies and craft tools.

  PRODUCTION TARGETS:
  - 6x logs (from forest)
  - 8x ironore (from mountain)
  - 4x Cooked Shrimp (from cooking)
  - 2x Pickaxe (5x ironbar + 1x logs)

  MATERIALS PROVIDED:
  - Iron bars provided to crafter
  - Raw shrimp provided to cook

  LOCATIONS:
  - Forest: Around (388, 10)
  - Mountain: Around (230, 40)

  DO NOT use complete() until all objectives are met!

# Limitations
max_action_steps: 48

