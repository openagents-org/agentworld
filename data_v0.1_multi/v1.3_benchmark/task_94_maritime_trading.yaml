# AgentWorld Multi-Agent Task Configuration

task:
  name: "Maritime Trading - Coastal Operations"
  description: "Twenty agents fish and craft items for maritime trading"

# Task objectives
objectives:
  primary: "Catch 8x rawshrimp, cook 6x Cooked Shrimp, and craft 2x Gold Ring"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent maritime scenario.

  OBJECTIVE: Fish, cook, and craft trade goods.

  PRODUCTION TARGETS:
  - 8x rawshrimp (from fishing)
  - 6x Cooked Shrimp (from cooking)
  - 2x Gold Ring (2x goldbar each)

  MATERIALS PROVIDED:
  - Gold bars provided to crafter

  LOCATIONS:
  - Fishing: Coastal (580, 750)

  DO NOT use complete() until all objectives are met!

# Limitations
max_action_steps: 50

