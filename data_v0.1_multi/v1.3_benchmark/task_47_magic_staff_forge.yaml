# AgentWorld Multi-Agent Task Configuration

task:
  name: "Magic Staff Forge - Elemental Staff Production"
  description: "Five agents work together to craft 2x Lightning Staff and 1x Fire Staff"

# Task objectives
objectives:
  primary: "Craft 2x Lightning Staff and 1x Fire Staff through coordinated magical crafting"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent magical crafting scenario.

  OBJECTIVE: Create enchanted elemental staffs.

  PRODUCTION TARGETS:
  - 2x Lightning Staff (staff + lightningbead each)
  - 1x Fire Staff (staff + firebead)

  CRAFTING CHAIN:
  1. Harvest 4x logs from Oak trees
  2. Craft 16x stick (1x logs → 4x stick)
  3. Craft 3x staff (5x stick + 1x bead each)
  4. Enchant to Lightning Staff (staff + lightningbead)
  5. Enchant to Fire Staff (staff + firebead)

  MATERIALS PROVIDED:
  - 3x bead for base staffs
  - 2x lightningbead for lightning enchant
  - 1x firebead for fire enchant

  TEAM ROLES:
  - Lumberjacks gather logs
  - Fletcher crafts sticks
  - Crafters make staffs and enchant

  DO NOT use complete() until all staffs are crafted!

# Limitations
max_action_steps: 45

