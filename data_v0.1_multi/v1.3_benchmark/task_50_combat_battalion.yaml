# AgentWorld Multi-Agent Task Configuration

task:
  name: "Combat Battalion - Ogre Hunt"
  description: "Five warriors work together to defeat ogres in coordinated combat"

# Task objectives
objectives:
  primary: "Defeat 2x Ogres and 3x Goblins in coordinated team combat"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent combat scenario.

  OBJECTIVE: Eliminate multiple enemy types through coordinated warfare.

  TARGETS:
  - 2x Ogres (Level 18, 150 HP each) - MUST be exact name "Ogre", NOT "Ogre Lord" or "Iron Ogre"
  - 3x Goblins (Level 7, 90 HP each) - MUST be exact name "Goblin", NOT "Hobgoblin"

  ENEMY CHARACTERISTICS:
  - Ogres: Strong melee fighters, high HP, found NORTHEAST around (154-188, 11-71)
  - Goblins: Weaker but often in groups, found WEST/SOUTHWEST around (35-71, 54-78)

  COMBAT TACTICS:
  - Tank draws ogre aggro first
  - All DPS focus fire on single target until dead
  - Archer provides ranged support
  - Use flasks/apples to heal when HP drops below 50%
  - Kill goblins first (easier), then ogres

  STARTING POSITION: You start near (112, 50) - between goblin and ogre territories
  - Head SOUTHWEST (~50 tiles) to find Goblins
  - Head NORTHEAST (~50 tiles) to find Ogres

  IMPORTANT:
  - Use get_observation() to scan for nearby mobs
  - Coordinate attacks via chat - call out target instance IDs
  - DO NOT attack "Ogre Lord" (Level 44) or "Hobgoblin" (Level 42) - too strong!
  - DO NOT use complete() until all 5 enemies are defeated!

# Limitations
max_action_steps: 35

