# AgentWorld Multi-Agent Task Configuration

task:
  name: "Combat Battalion - Ogre Hunt"
  description: "Five warriors work together to defeat ogres in coordinated combat"

# Task objectives
objectives:
  primary: "Defeat 2x Ogres and 3x Goblins in coordinated team combat"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent combat scenario.

  OBJECTIVE: Eliminate multiple enemy types through coordinated warfare.

  TARGETS:
  - 2x Ogres (Level 18, 150 HP each)
  - 3x Goblins (Level 7, 90 HP each)

  ENEMY CHARACTERISTICS:
  - Ogres: Strong melee fighters, high HP
  - Goblins: Weaker but often in groups

  COMBAT TACTICS:
  - Tank draws ogre aggro
  - DPS focus fire on single target
  - Archer provides ranged support
  - Healers keep team alive

  ENEMY LOCATIONS:
  - Ogres: Mountain and wilderness regions
  - Goblins: Forest edges and caves

  DO NOT use complete() until all enemies are defeated!

# Limitations
max_action_steps: 35

