# AgentWorld Multi-Agent Task Configuration

task:
  name: "Tool Production - Pickaxe and Axe Crafting"
  description: "Three agents work together to mine ore, smelt bars, and craft tools"

# Task objectives
objectives:
  primary: "Craft 1x Pickaxe and 1x Axe through coordinated mining and smithing"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent tool crafting scenario.

  OBJECTIVE: Create essential tools through mining and smithing.

  PRODUCTION CHAIN:
  1. Miner has 8x ironore (pre-equipped) - NO NEED TO MINE IRON
  2. Coal miner: Mine 8x coal from Coal rocks (Level 1 mining) in southern region (550-570, 540-560)
  3. Lumberjack: Gather 2x logs from Oak trees - multiple locations available
  4. Transfer all materials to smith_agent
  5. Smith smelts 8x ironbar (1x ironore + 1x coal → 1x ironbar)
  6. Smith crafts 1x pickaxe (5x ironbar + 1x logs)
  7. Smith crafts 1x axe (3x ironbar + 1x logs)

  RESOURCE LOCATIONS:
  - Coal rocks: Southern volcanic/desert regions around (550-570, 540-560) - Dense coal area ✅
  - Oak trees: Multiple locations available - try these areas:
    * Area 1: Around (186, 38) - western forest
    * Area 2: Around (388, 10) - eastern forest  
    * Area 3: Around (390-395, 8-12) - nearby eastern area
    * TIP: If you don't see trees at your spawn point, move 5-10 tiles to find them
  
  CRITICAL: Ironore is PRE-PROVIDED to smith_agent's inventory!

  TEAM COORDINATION:
  - smith_agent: Has 8x ironore (pre-equipped), waits for coal and logs
  - coal_miner_agent: Mine 8x coal from southern region (around 560, 550), transfer to smith
  - lumberjack_agent: Find Oak trees in eastern/western forest areas, harvest 2x logs, transfer to smith
  - smith_agent: Receives coal and logs, smelts 8x ironbar, crafts pickaxe and axe
  - Use global chat to coordinate transfers and progress
  - IMPORTANT: Only call complete() after successfully harvesting/transferring your materials

  DO NOT use complete() until both tools are crafted!

  LUMBERJACK TIPS:
  - If you can't see tree instances at your starting location, explore nearby areas
  - Oak trees are common in forest regions - move around to find them
  - You need to harvest 2x logs total
  - Transfer logs to smith_agent using: transfer_items(count=2, itemKey=logs, targetPlayer=smith_agent)
  - Only call complete() AFTER successfully transferring logs

  ITEM KEY REFERENCE (use these exact itemKey values):
  - Logs: itemKey=logs (harvested from Oak trees)
  - Coal: itemKey=coal (mined from Coal rocks)
  - Iron Bar: itemKey=ironbar (Smelting: 1x ironore + 1x coal)
  - Pickaxe: itemKey=pickaxe (Smithing: 5x ironbar + 1x logs)
  - Axe: itemKey=axe (Smithing: 3x ironbar + 1x logs)
  
  OTHER ITEMS (for reference):
  - Wooden Bow: itemKey=woodenbow (Fletching)
  - Arrow: itemKey=arrow (Fletching)
  - Stick/Shaft: itemKey=stick (Fletching)
  - Sword/Heavy Sword: itemKey=sword2 (Smithing)
  - Gold Ring: itemKey=goldring (Smithing)
  - Silver Ring: itemKey=silverring (Smithing)


# Limitations
max_action_steps: 35

