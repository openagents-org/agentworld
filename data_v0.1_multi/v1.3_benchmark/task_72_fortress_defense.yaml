# AgentWorld Multi-Agent Task Configuration

task:
  name: "Fortress Defense - Siege Combat"
  description: "Seven defenders craft weapons and repel enemy siege forces"

# Task objectives
objectives:
  primary: "Craft 2x Heavy Sword, defeat 6x Goblins and 4x Skeletons"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent fortress defense scenario.

  OBJECTIVE: Arm your warriors and defeat the enemy siege forces.

  COMBAT TARGETS:
  - 6x Goblins (Level 10-15)
  - 4x Skeletons (Level 18-25)

  PRODUCTION TARGETS:
  - 2x Heavy Sword (2x ironbar + 1x hilt2 each)

  ENEMY LOCATIONS:
  - Goblins and Skeletons spawn around (15, 20) area

  TEAM ROLES:
  - Guards: Front-line combat (already armed)
  - Warriors: Carry iron bars, need weapons from smith
  - Archer: Ranged support
  - Smith: Craft 2x Heavy Sword from iron bars + hilt2
  - Commander: Coordinate defense (already armed)

  DO NOT use complete() until all enemies are defeated!

  ITEM KEY REFERENCE (use these exact itemKey values in craft_item):
  - Sword/Heavy Sword: itemKey=sword2 (Smithing)
  - Axe: itemKey=axe (Smithing)
  - Pickaxe: itemKey=pickaxe (Smithing)
  - Iron Bar: itemKey=ironbar (Smelting)
  - Gold Bar: itemKey=goldbar (SMITHING) - requires goldnugget only, NO coal
  - Bronze Bar: itemKey=bronzebar (Smelting)


# Limitations
max_action_steps: 45

