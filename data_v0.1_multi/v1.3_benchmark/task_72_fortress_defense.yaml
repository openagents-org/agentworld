  name: "Fortress Defense - Enemy Wave Combat"
  description: "Seven defenders defeat waves of enemies"

# Task objectives
objectives:
  primary: "Defeat 3x Goblins and 2x Skeletons"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent defense scenario.

  OBJECTIVE: Defend against enemy waves.

  COMBAT TARGETS:
  - 3x Goblins (Level 10-15)
  - 2x Skeletons (Level 18-25)

  ENEMY LOCATIONS:
  - Goblins and Skeletons spawn around (355, 305) area

  TEAM ROLES:
  - Guards: Front-line combat
  - Archers: Ranged support
  - Commander: Coordinate attacks
  - Support: Healing

  DO NOT use complete() until all enemies are defeated!

# Limitations
max_action_steps: 40

