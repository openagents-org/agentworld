# AgentWorld Multi-Agent Task Configuration

task:
  name: "Magical Defense - Lightning Staff Forge & Ice Guardian Battle"
  description: "Three agents work together to craft a powerful lightning staff and defeat dangerous Ice Guardians"

# Task objectives
objectives:
  primary: "Craft a Lightning Staff and successfully defeat an Ice Guardian in coordinated combat"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent magical defense scenario.

  OBJECTIVE: Craft a Lightning Staff and defeat the Ice Guardians threatening the frozen region.

  MISSION REQUIREMENTS:
  - Craft a Lightning Staff using the provided magical beads and gathered materials
  - Locate and engage Ice Guardian enemies at their known location
  - Defeat at least one Ice Guardian using coordinated attacks
  - Ensure all team members survive the encounter

  TEAM COORDINATION:
  - Use global chat to coordinate gathering, crafting, and combat phases
  - Share materials between agents as needed using transfer_items
  - Support each other during combat with healing items

  CRAFTING SEQUENCE (CRITICAL - Follow this exact order):

  Step 1: Get Logs (Lumberjacking):
    - harvest_resource on Oak Tree instances to get logs
    - Need at least 2 logs (to craft 8 sticks, you need 5 for staff)
    - Level required: 1+ (Lumberjacking skill)
    - Look for "Oak", "Oak2", "Oak3" tree types

  Step 2: Craft Sticks (Fletching):
    - craft_item skill=Fletching itemKey=stick
    - Materials: 1x logs -> 4x stick
    - Craft twice to get 8 sticks (need 5 for staff)
    - Level required: 1 (Fletching skill)

  Step 3: Craft Magic Staff (Crafting):
    - craft_item skill=Crafting itemKey=staff
    - Materials: 5x stick + 1x bead -> 1x staff
    - Level required: 1 (Crafting skill)
    - NOTE: Magic bead (bead) is PROVIDED in staff_crafter_agent's inventory!

  Step 4: Craft Lightning Staff (Crafting):
    - craft_item skill=Crafting itemKey=lightningstaff
    - Materials: 1x staff + 1x lightningbead -> 1x lightningstaff
    - Level required: 10 (Crafting skill)
    - NOTE: Lightning bead is PROVIDED in staff_crafter_agent's inventory!

  COMBAT - Ice Guardians:
  - Ice Guardians are located at coordinates (259, 151) and (260, 156)
  - They are Level 35 minibosses with ice-based attacks
  - battle_mage_agent should lead with firestaff (fire is effective against ice!)
  - Transfer the crafted Lightning Staff to battle_mage_agent for maximum damage
  - Other agents provide physical attack support and use healing items as needed
  - Use flask and apple items to heal during combat

  IMPORTANT REMINDERS:
  - staff_crafter_agent has the rare magical beads (bead + lightningbead) in inventory
  - The crafting agent should gather logs and craft everything
  - After crafting, transfer Lightning Staff to battle_mage_agent
  - Equip the Lightning Staff before engaging Ice Guardians
  - DO NOT use complete() until Lightning Staff is crafted AND Ice Guardian is defeated!

  ITEM KEY REFERENCE (use these exact itemKey values in craft_item):
  - Wooden Bow: itemKey=woodenbow (Fletching)
  - Golden Bow: itemKey=goldenbow (Fletching)
  - Arrow: itemKey=arrow (Fletching)
  - Stick/Shaft: itemKey=stick (Fletching)
  - Sword/Heavy Sword: itemKey=sword2 (Smithing)
  - Golden Sword: itemKey=goldensword (Smithing)
  - Axe: itemKey=axe (Smithing)
  - Pickaxe: itemKey=pickaxe (Smithing)
  - Silver Ring: itemKey=silverring (Smithing)
  - Gold Ring: itemKey=goldring (Smithing)
  - Staff: itemKey=staff (Crafting)
  - Lightning Staff: itemKey=lightningstaff (Crafting)
  - Fire Staff: itemKey=firestaff (Crafting)
  - Ice Staff: itemKey=icestaff (Crafting)
  - Nature Staff: itemKey=naturestaff (Crafting)
  - Bucket: itemKey=bucket (Crafting)
  - Iron Bar: itemKey=ironbar (Smelting)
  - Gold Bar: itemKey=goldbar (Smelting)
  - Bronze Bar: itemKey=bronzebar (Smelting)
  - Cooked Shrimp: itemKey=cookedshrimp (Cooking)
  - Stew: itemKey=stew (Cooking)


# Limitations
max_action_steps: 35

