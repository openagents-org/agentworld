# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - 4 agents, defeat Ice Knight and secure castle

task:
  name: "Castle Siege Warfare - Complete Fortress Conquest"
  description: "Four agents work together for full castle siege, defeat Ice Knight, and secure the fortress"

# Task objectives
objectives:
  primary: "Defeat Ice Knight commander and secure complete control of the castle"
  secondary: # checkpoints
    - "Establish siege warfare coordination"
    - "Execute tactical assault and boss combat"
    - "Complete castle conquest within 45 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a full-scale castle siege with expanded team and objectives.

  OBJECTIVE: Complete fortress conquest through coordinated siege warfare.

  MISSION REQUIREMENTS:
  - Navigate to Castle/Fortress region (~712, 717)
  - Conduct reconnaissance and plan assault
  - Defeat Ice Knight (Level 62) commander
  - Secure strategic control of entire castle

  TEAM COORDINATION:
  - Siege commander coordinates operations
  - Breacher leads assault on defenses
  - Warriors handle Ice Knight combat
  - Tactician provides magical support

  COMBAT KNOWLEDGE:
  ⚔️ Boss Combat - Ice Knight:
    - Location: (712, 717)
    - Level 62 elite commander
    - Heavy armor, ice attacks

  🏰 Castle Conquest:
    - Secure key strategic positions
    - Eliminate all major threats

  DO NOT use complete() until castle is secured!

# Limitations
max_action_steps: 45

