# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, increased targets

task:
  name: "World Resource Survey - Continental Exploration & Mapping"
  description: "Sixteen agents conduct comprehensive survey of all major regions, documenting resources, creatures, and establishing observation posts"

# Task objectives
objectives:
  primary: "Complete world resource survey covering 10+ major regions with 120+ documented findings and 8+ observation posts within 70 rounds"
  secondary:
    - "Phase 1 (Rounds 1-18): Team Formation - Organize 4 survey teams and plan routes"
    - "Phase 2 (Rounds 19-42): Continental Exploration - Survey 10+ major biomes"
    - "Phase 3 (Rounds 43-58): Resource Documentation - Catalog 120+ findings"
    - "Phase 4 (Rounds 59-70): Report Compilation - Establish posts and finalize survey"

# Relevant game context (Hint)
relevant_game_context: |
  WORLD RESOURCE SURVEY OVERVIEW:

  Sixteen explorers must document the entire known world's resources and creatures.

  SURVEY REGIONS:

  ===============================================================
  TEAM ALPHA (Agents 1-4) - Forest & Plains Survey
  ===============================================================
  **Regions**:
  - Forest Region (380, 20)
  - Central Plains (400, 300)
  - Outer Forest (350, 50)

  **Document**:
  - Tree types and locations (15+ trees)
  - Plains creatures (6+ mob types)
  - Herb and plant resources (12+ items)

  **Establish**: 2 observation posts

  ===============================================================
  TEAM BETA (Agents 5-8) - Mountain & Ice Survey
  ===============================================================
  **Regions**:
  - Mountain Range (230, 40)
  - Ice Caverns (260, 154)
  - Mountain Peaks (220, 60)

  **Document**:
  - Ore deposit locations (18+ rocks)
  - Mountain creatures (6+ mob types)
  - Ice region resources (12+ items)

  **Establish**: 2 observation posts

  ===============================================================
  TEAM GAMMA (Agents 9-12) - Coastal & Ocean Survey
  ===============================================================
  **Regions**:
  - Coastal Region (580, 750)
  - Underwater Areas
  - Deep Sea Zone

  **Document**:
  - Fishing spots (12+ locations)
  - Marine creatures (6+ types)
  - Coastal resources (12+ items)

  **Establish**: 2 observation posts

  ===============================================================
  TEAM DELTA (Agents 13-16) - Desert & Volcanic Survey
  ===============================================================
  **Regions**:
  - Desert Plains (400, 680)
  - Volcanic Border regions
  - Oasis Areas

  **Document**:
  - Desert creatures (6+ types)
  - Special minerals (12+ finds)
  - Heat zone resources (12+ items)

  **Establish**: 2 observation posts

  ===============================================================
  SURVEY PROTOCOL
  ===============================================================

  **Phase 1: Team Formation (Rounds 1-18)**
  - Organize into 4 specialized teams
  - Plan exploration routes
  - Gather survey equipment
  - Initial reconnaissance

  **Phase 2: Continental Exploration (Rounds 19-42)**
  - Each team explores assigned regions
  - Use observe_environment extensively
  - Photograph (document) all findings
  - Report via global chat every 5 rounds

  **Phase 3: Resource Documentation (Rounds 43-58)**
  - Catalog all trees, rocks, fishing spots
  - Document all mob types and locations
  - Collect sample resources (1-2 of each type)
  - Cross-reference findings between teams

  **Phase 4: Report Compilation (Rounds 59-70)**
  - Establish observation posts at key locations
  - Compile comprehensive findings list
  - Share knowledge across all teams
  - Final survey verification

  **Documentation Requirements**:
  - Format: "[Team X] Region Y: Found Z at (coordinates)"
  - Example: "[Alpha] Forest: Oak Tree at (385, 22)"
  - Minimum 120 total documented findings
  - Each team must document 30+ unique findings

  **Observation Posts**:
  - Forest Post: (385, 25)
  - Mountain Post: (235, 45)
  - Ice Post: (260, 156)
  - Coastal Post: (585, 752)
  - Desert Post: (405, 685)
  - Central Post: (400, 15)
  - Outer Forest Post: (355, 55)
  - Deep Sea Post: (590, 760)

  ===============================================================
  SUCCESS CRITERIA
  ===============================================================
  1. Survey 10+ major regions
  2. Document 120+ unique findings
  3. Catalog 25+ mob types
  4. Catalog 35+ resource nodes
  5. Catalog 25+ tree types
  6. Establish 8+ observation posts
  7. All teams report continuously
  8. Complete within 70 rounds

# Limitations
max_action_steps: 70

