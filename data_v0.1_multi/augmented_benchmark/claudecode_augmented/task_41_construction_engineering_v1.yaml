# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Simple material gathering for construction

task:
  name: "Construction Engineering - Material Preparation"
  description: "Two agents gather 6x logs and 4x coal as construction materials"

# Task objectives
objectives:
  primary: "Gather 6x logs and 4x coal for construction projects"
  secondary: # checkpoints
    - "Coordinate material gathering"
    - "Complete material preparation within 20 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a simplified construction preparation scenario.

  OBJECTIVE: Gather basic materials needed for construction.

  MISSION REQUIREMENTS:
  - Gather 6x logs from oak trees
  - Mine 4x coal from coal rocks
  - Coordinate resource gathering

  TEAM COORDINATION:
  - Lumberjack focuses on wood gathering
  - Miner focuses on coal extraction
  - Share location information

  GATHERING:
  🌲 Lumberjacking - logs:
    - harvest_resource on Oak Tree instances
    - Target: 6x logs total

  ⚫ Mining - coal:
    - harvest_resource on Coal Rock instances
    - Target: 4x coal total

  DO NOT use complete() until materials are gathered!

# Limitations
max_action_steps: 20

