# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Extended 12-agent quad-corridor evacuation

task:
  name: "Royal Evacuation Command - Grand Corridor Defense"
  description: "Twelve officers evacuate civilians through four escape corridors, repairing three bridges, and escorting convoys to safe zones within 65 rounds."

# Task objectives
objectives:
  primary: "Evacuate four civilian groups from (528,384) toward northern mountains, eastern coast, western forest, and southern desert while keeping supply wagons intact."
  secondary:
    - "Phase 1 (Rounds 1-14): Recon squad charts all four corridors."
    - "Phase 2 (Rounds 15-28): Engineers repair Northbridge, East Crossing, and South Causeway."
    - "Phase 3 (Rounds 29-42): Support hub prepares four convoys with supplies."
    - "Phase 4 (Rounds 43-56): Escort teams move all convoys simultaneously."
    - "Phase 5 (Rounds 57-65): Final muster with casualty report."

# Relevant game context
relevant_game_context: |
  TEAM STRUCTURE
  - Recon: Agents 1-2 sweep all four corridors using observe_environment radius=48.
  - Engineers: Agents 3-5 gather 16 logs + 16 ironore/coal, smelt bars, repair three bridges.
  - Support Hub: Agents 6-7 collect food/medicine, assemble four identical supply bundles.
  - Escorts: Agents 8-12 attach to convoys. Each convoy must have at least two escorts.

  CRITICAL DETAILS
  1. Resource plan:
     • 16 logs + 16 ironbar → structural supplies for three bridges.
     • Each convoy kit: 12 flasks, 12 food items, 2 strengthpotion.
  2. Movement rules:
     • Convoys pause every two moves for regroup checks.
     • If mobs spawn, escorts attack before resuming.
     • Recon provides waypoint headings for each corridor.
  3. Communication:
     • Bridge repairs announced with resource counts.
     • Support hub shares inventory snapshots before handoffs.
  4. Completion: complete() after all four convoys check in and bridges certified.

# Limitations
max_action_steps: 65

