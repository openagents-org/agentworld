# Success criteria
success_criteria:
  - "Recon squad reports at least two checkpoints per corridor plus every mob cluster discovered"
  - "Three bridges each receive 5+ logs + 5+ ironbar with repair confirmations in chat"
  - "Support hub documents inventory contents for each of four convoy bundles"
  - "All four convoys arrive at target coordinates with escorts present and >50% HP"
  - "Any hostile encounters resolved with explicit attack logs and post-battle inventory checks"
  - "Final muster lists remaining supplies, evacuee counts, and bridge status"
  - "Mission completes in 62-65 rounds"
