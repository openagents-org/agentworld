# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Craft 2 gold rings, need more materials

task:
  name: "Cooperative Gold Ring Forging - Dual Ring Premium Metallurgy"
  description: "Three agents work together to create TWO gold rings through gold mining, advanced smelting, and precious metal smithing"

# Task objectives
objectives:
  primary: "Create TWO gold rings through coordinated gold extraction and premium metallurgy"
  secondary: # checkpoints
    - "Execute precious metal mining operations"
    - "Coordinate advanced gold smelting techniques"
    - "Complete dual premium ring smithing within 35 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative multi-agent premium metallurgy scenario requiring gold materials.

  OBJECTIVE: Create TWO gold rings through coordinated precious metal extraction and premium metallurgy.

  TEAM COORDINATION:
  - Use global chat to share locations of precious metals and smelting materials
  - Coordinate high-level mining operations and premium metallurgy
  - Handle valuable materials with extreme care during transfers
  - Work together to complete challenging gold metallurgy processes

  GENERAL STRATEGY:
  - The team needs to extract precious gold ore (requires high-level mining skills)
  - Someone needs to gather smelting fuel for gold processing
  - Gold processing has very challenging success rates requiring skill and preparation
  - Final ring creation requires premium smithing expertise
  - Coordinate high-level mining with advanced metallurgy operations
  - Need 4x goldbar total for 2x goldring

  DO NOT use complete() until ALL objectives are achieved by the team!

  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  🟨 Mining - gold ore:
    - harvest_resource on gold rock instances to get goldore
    - Level required: 25+ (Mining skill) - HIGH LEVEL!

  ⛏️ Mining - coal:
    - harvest_resource on coal deposits to get coal
    - Level required: 1+ (Mining skill)

  🟨 Smelting Recipe - goldbar:
    - craft_item skill=Smelting itemKey=goldbar
    - Materials: 1x goldore + 1x coal → 1x goldbar
    - Level required: 20 (uses Smithing skill level)
    - Success chance: 40% - VERY CHALLENGING!

  🟨 Smithing Recipe - goldring:
    - craft_item skill=Smithing itemKey=goldring
    - Materials: 2x goldbar → 1x goldring
    - Level required: 1 (Smithing skill)

# Limitations
max_action_steps: 35

