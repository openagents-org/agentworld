# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Reduced material targets, more initial resources

task:
  name: "Fortress Defense Construction - Multi-Stage Defensive Fortification"
  description: "Fifteen agents work together to build a fortress defense system, gathering materials, crafting equipment, and defending against simulated attacks"

# Task objectives
objectives:
  primary: "Construct a fully operational fortress defense system with walls, weapons, and trained defenders over 50 rounds"
  secondary:
    - "Phase 1 (Rounds 1-12): Foundation - Gather raw materials (80+ logs, 40+ iron ore, 40+ coal)"
    - "Phase 2 (Rounds 13-25): Construction - Craft defensive equipment (8+ weapons, 4+ armor sets)"
    - "Phase 3 (Rounds 26-38): Armament - Produce ammunition and supplies (40+ arrows, 80+ healing items)"
    - "Phase 4 (Rounds 39-50): Defense Drill - Position defenders and execute coordinated defense simulation"

# Relevant game context (Hint)
relevant_game_context: |
  FORTRESS DEFENSE PROJECT OVERVIEW:

  Fifteen citizens must unite to construct a fortress defense system.

  CONSTRUCTION CORPS (Agents 1-5) - Material Gathering
  - Starting Location: Oak Forest Region (388, 3)
  - Material Goals: 80x logs, 40x coal, 25x ironore, 40x sticks
  - Agents 1-3: Harvest Oak trees (aim for 28+ logs each)
  - Agent 4: Mine at (230, 40) for ironore and coal
  - Agent 5: Coordinate transfers to other teams

  ARMORY DIVISION (Agents 6-10) - Equipment Crafting
  - Starting Location: Mountain Forge (235, 45)
  - Equipment Goals: 4x heavy swords, 2x axes, 2x pickaxes, 40+ ironbar
  - Agent 9 receives ore + coal from Construction Corps
  - Agent 9 smelts minimum 40x ironbar
  - Agents 6-7 receive ironbar + logs for weapon crafting

  ARCHERY CORPS (Agents 11-12) - Ranged Weapons
  - Starting Location: Near Forest (390, 8)
  - Production Goals: 40x arrows, 2x wooden bows
  - Agent 12: Hunt Roosters/Bats for feathers (need 40+ feathers)
  - Agent 11: Receive 40 sticks from Construction Corps

  DEFENSE BATTALION (Agents 13-15) - Combat Force
  - Starting Location: Fortress Center (400, 10)
  - Equipment received from Armory
  - Execute coordinated mock battle in Phase 4

# Limitations
max_action_steps: 50

