# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Extended 12-agent grand polar relief expedition

task:
  name: "Frostveil Lifeline Convoy - Grand Polar Relief Expedition"
  description: "Twelve specialists rebuild the frozen supply line network, delivering multiple beacon staffs, medical kits, and spare tools across three checkpoints within 65 rounds."

# Task objectives
objectives:
  primary: "Deliver the reinforced convoy manifest (30 icelogs, 20 iron bars, three lightningstaff, three icestaff, medical rations) from Ridge Camp (232,148) through multiple checkpoints to the Ice Guardian Outpost (260,156) and beyond."
  secondary:
    - "Phase 1 (Rounds 1-12): Stage at Ridge Camp, assign four squads (Resource, Beacon, Escort, Medical)."
    - "Phase 2 (Rounds 13-28): Resource squad harvests 30 icelogs, mines 24 ironore + 24 coal, fishes 12 jellyfish, forages 12 bluelily."
    - "Phase 3 (Rounds 29-42): Beacon squad smelts 20 ironbar, crafts 4 pickaxe replacements, 6 staff blanks, upgrades three lightningstaff + three icestaff."
    - "Phase 4 (Rounds 43-52): Quartermaster consolidates all convoy items, verifies inventory."
    - "Phase 5 (Rounds 53-65): Escort squad guides convoy through five checkpoints, defeats roaming Ice Guardians, installs all beacon staffs."

# Relevant game context
relevant_game_context: |
  RIDGE CAMP PROTOCOL
  - Keep everyone within 6 tiles when staging; confirm roles in chat before splitting up.
  - Use harvest_resource target=iceoak or pine variants around (232-240,146-154) for icelogs.
  - Mine iron/coal veins along the ridge (x 228-238, y 140-150). Smelt only after 24 ore + 24 coal stockpiled.

  BEACON FABRICATION
  - Craft chain: craft_item skill=Crafting itemKey=staff → upgrade with lightningbead → lightningstaff.
  - Craft icestaff using icebead drops from ice mobs.
  - Lightning beads drop from coastal mimics near (224,359) if ridge mobs refuse.
  - Use transfer_items in front of witnesses; SignalRunner must confirm counts.

  CONVOY & ESCORTS
  - Designate Quartermaster as sole holder of icelogs, ironbar, crafted staffs, and medical stock.
  - Escort squad (Lead, ScoutSkier1, ScoutSkier2, SledgeGuard1, SledgeGuard2, PolarMedic) moves in diamond around Quartermaster.
  - If any escort drifts >5 tiles away, halt and regroup.
  - When mobs appear, Lead tags target in chat, all combatants attack.

  CHECKPOINT CALLS
  - Five checkpoints: (236,150), (240,150), (250,152), (259,151), (260,156).
  - At each waypoint, recite location, convoy HP status, item counts, and next heading.
  - Install beacons at (240,150), (250,152), (259,151) and outpost gates.

# Limitations
max_action_steps: 65

