# AgentWorld Multi-Agent Task Configuration

task:
  name: "Guild Headquarters Establishment - Streamlined Base Construction"
  description: "Six guild founders collaborate to build a functional headquarters with crafting stations, armory, and equipment for all members"

# Task objectives
objectives:
  primary: "Establish a functional guild headquarters over 50 rounds with specialized facilities and equipment for all 6 guild members"
  secondary:
    - "Phase 1 (Rounds 1-12): Foundation & Resources - Gather material stockpile for construction"
    - "Phase 2 (Rounds 13-24): Armory Construction - Craft weapons and armor for all members"
    - "Phase 3 (Rounds 25-36): Workshop Development - Create crafting stations and utility equipment"
    - "Phase 4 (Rounds 37-46): Member Outfitting - Produce specialized equipment for each guild role"
    - "Phase 5 (Rounds 47-50): Grand Opening - Test facilities and celebrate guild establishment"

# Relevant game context
relevant_game_context: |
  HQ PLAYBOOK
  - Six founders build a functional "headquarters" by crafting and organizing gear, not placing buildings. The project runs through five phases (Foundation, Armory, Workshops, Role Outfitting, Grand Opening) and hinges on role specialization: lumberjack gathers wood, miner handles ore, smith/fletcher/crafter craft, and the master coordinates.

  PHASE SNAPSHOT
  1. R1-12 Foundation: travel to (410,325), assign roles, and split up to gather ≥40 logs, ≥50 iron/coal, ≥15 gold, ≥60 feathers, ≥30 string plus food/gems. Return to HQ, transfer everything to GuildMaster, and verify the stockpile.
  2. R13-24 Armory: smith + miner smelt 50 iron bars and ~15 gold bars (grab extra coal if needed), forge 5 heavy swords, 3 axes, 3 pickaxes, 5 silver rings, 2 gold rings, then equip everyone.
  3. R25-36 Workshops: fletcher turns logs/feathers/string into bows and 50 arrows; crafter builds staffs/pendants/enhanced rings using beads/gems; master keeps distribution logs. Stockpiles of ammo, healing items, and utility tools should be recorded in chat.
  4. R37-46 Outfitting: tailor loadouts per role (e.g., lumberjack gets bow + axe, miner keeps pickaxe + heavy sword, crafter equips staff + pendant). Run verify_inventory after each redistribution and note coverage gaps to fill.
  5. R47-50 Grand Opening: run a mock drill (short combat or crafting test), confirm every role has primary/backup gear plus consumables, and announce HQ completion before calling complete().

  EXECUTION NOTES
  - If observe_environment is unavailable, sweep resource zones manually and rely on harvest_resource output plus verify_inventory counts.
  - Track inventories centrally: after every transfer, GuildMaster posts totals ("Iron 52, Gold 16, Feathers 65") so crafting plans stay accurate.
# Limitations
max_action_steps: 50

