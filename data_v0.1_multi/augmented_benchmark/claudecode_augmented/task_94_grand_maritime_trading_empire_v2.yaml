# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, adjusted targets

task:
  name: "Grand Maritime Trading Empire - Ocean Commerce & Fleet Operations"
  description: "Twenty agents establish a maritime trading empire including fishing fleets, merchant vessels, shipbuilding operations, and trade routes"

# Task objectives
objectives:
  primary: "Establish a fully operational maritime trading empire with 3 fishing fleets, 45+ trade goods, and active commerce routes within 65 rounds"
  secondary:
    - "Phase 1 (Rounds 1-16): Fleet Formation - Establish fishing operations and gather seafood (28+ fish)"
    - "Phase 2 (Rounds 17-32): Shipyard Construction - Gather materials and craft maritime equipment (18+ tools/weapons)"
    - "Phase 3 (Rounds 33-48): Trade Goods Production - Craft jewelry, weapons, and food for trade (28+ items)"
    - "Phase 4 (Rounds 49-65): Commerce Routes - Distribute goods and establish trading posts"

# Relevant game context (Hint)
relevant_game_context: |
  GRAND MARITIME TRADING EMPIRE OVERVIEW:

  Twenty seafaring agents must build the realm's greatest trading empire.

  FISHING FLEET DIVISION (Agents 1-5) - Seafood Operations
  - Starting Location: Coastal Region (580, 750)
  - Goals: 14x rawshrimp, 9x jellyfish, 5x crab
  - Total 28+ raw seafood items

  SHIPYARD CONSTRUCTION (Agents 6-10) - Maritime Equipment
  - Starting Location: Forest (380, 20) and Mountains (230, 40)
  - Goals: 28x logs, 18+ ironbar, 18+ maritime tools and weapons

  TRADE GOODS WORKSHOP (Agents 11-15) - Luxury Commerce
  - Goals: 5x jewelry, 12x cooked seafood, 3x magical staves
  - Total 28+ valuable trade items

  MERCHANT GUILD (Agents 16-20) - Commerce & Distribution
  - Starting Location: Central hub (400, 15)
  - Goals: Establish 3+ trading posts, distribute 45+ total items

  Trading Post Locations:
  - Northern Post: (235, 45) - Mountain region
  - Southern Post: (585, 752) - Coastal region
  - Western Post: (385, 25) - Forest region

# Limitations
max_action_steps: 65

