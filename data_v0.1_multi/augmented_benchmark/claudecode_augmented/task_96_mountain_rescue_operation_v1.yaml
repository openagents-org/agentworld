# AgentWorld Multi-Agent Task Configuration
# VARIANT: Easy version - reduced targets and more time

task:
  name: "Mountain Rescue Operation - Multi-Site Emergency Response (Easy)"
  description: "Eight agents coordinate a simplified mountain rescue spanning 2 regions, delivering supplies and establishing 2 rescue camps"

# Task objectives
objectives:
  primary: "Execute successful mountain rescue operation across 2 regions, delivering 60+ supplies and establishing 2 rescue camps within 60 rounds"
  secondary:
    - "Phase 1 (Rounds 1-15): Supply Gathering - Collect 60+ healing items and 30+ tools"
    - "Phase 2 (Rounds 16-30): Path Clearing - Clear routes and defeat blocking mobs"
    - "Phase 3 (Rounds 31-45): Camp Establishment - Set up 2 rescue camps with supplies"
    - "Phase 4 (Rounds 46-60): Rescue Completion - Coordinate final supply delivery"

# Relevant game context (Hint)
relevant_game_context: |
  MOUNTAIN RESCUE OPERATION (EASY MODE):

  Two rescue teams must coordinate across mountain regions to save stranded travelers.
  Requires supply gathering, route clearing, and establishing rescue camps.

  RESCUE TEAMS:

  SUPPLY CORPS (Agents 1-3) - Resource Gathering
  **Mission**: Gather 60+ healing items and survival supplies
  **Location**: Starting Base (400, 10)

  **Goals**:
  - 35x flask (healing)
  - 20x apple (food)
  - 10x cookedshrimp (premium healing)
  - 5x logs (firewood)

  PATH CLEARING TEAM (Agents 4-6) - Route Security
  **Mission**: Clear mountain paths of hostile creatures
  **Locations**: Multiple mountain regions

  **Targets**:
  - Defeat 3+ mountain mobs blocking paths
  - Clear route from (400,10) to (230,40)
  - Clear route from (230,40) to (260,156)

  CAMP CONSTRUCTION (Agents 7-8) - Rescue Stations
  **Mission**: Establish 2 rescue camps with supplies
  **Locations**:
  - Camp Alpha: (235, 42)
  - Camp Beta: (260, 154)

  **Each Camp Needs**:
  - 20+ healing items
  - 8+ food items
  - 2+ tools

  SUCCESS CRITERIA:
  1. Gather 60+ supply items
  2. Defeat 3+ blocking creatures
  3. Establish 2 rescue camps
  4. Deliver 20+ items to each camp
  5. Complete within 60 rounds

# Limitations
max_action_steps: 60

