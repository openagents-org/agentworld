# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Extended to 5 boss tiers with 6 warriors

task:
  name: "Elite Combat Battalion - Extended Five-Tier Combat Campaign"
  description: "Six combat specialists work together to defeat five bosses in sequence, from basic enemies to elite minibosses"

# Task objectives
objectives:
  primary: "Form an elite combat battalion of six warriors to defeat five enemies in progressive difficulty sequence"
  secondary: # checkpoints
    - "Coordinate six-warrior formation and combat preparation"
    - "Execute coordinated combat against five enemy types"
    - "Progress through increasing difficulty tiers of encounters"
    - "Complete entire combat campaign within 45 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  CAMPAIGN SUMMARY
  - Six warriors fight a five-tier gauntlet: Goblin → Skeleton → Ogre → Spectre → Ice Guardian. Each tier must be cleared in order within 45 rounds.
  - Roles: TankCommander soaks hits, DamageDealer1 & DamageDealer2 provide DPS, MagicArtillery provides magic damage, CombatMedic keeps HP above 50%, TacticalCoordinator calls targets and positioning.

  COMBAT LOOP
  1. Formation (R1-6): assemble within 5 tiles at (400,300), report HP/healing stocks, scout mobs array for nearby targets.
  2. Tier fights (R7-45): move_character to the reported coordinates, announce target instance ID, then all agents attack_entity/attack_mob the same ID on the coordinator's count. Heal between fights before advancing.
     • Goblin near the forest spawn (~350,250)
     • Skeleton around (~200,100)
     • Ogre at (238,48)
     • Spectre at (~230,30)
     • Ice Guardian at (259,151)
  3. After each kill post "Tier X clear – HP summary" and confirm everyone is alive before hunting the next enemy.

  EXECUTION RULES
  - Always cite the exact targetInstance from observation before attacking; never invent IDs.
  - Focus fire: no new targets until the current one dies. If two warriors drop below 30% HP, retreat, heal with flasks/apples, and re-engage.
  - CombatMedic calls out healing actions; all agents announce when HP crosses critical thresholds or when using items.

  COMPLETION CHECKLIST
  - Chat log shows five tier confirmations and final positions.
  - Ice Guardian must be defeated last; only then may TacticalCoordinator call complete() with a status summary including remaining HP and loot distribution.
# Limitations
max_action_steps: 45

