  - "Battalion successfully defeats Ogre (Tier 3 Enemy)"
  - "MagicArtillery provides effective magical support in all engagements"
  - "Battalion successfully defeats Spectre (Tier 4 Enemy)"
  - "CombatMedic successfully supports team throughout campaign"
  - "Battalion successfully defeats Ice Guardian (Tier 5 Elite Enemy)"
