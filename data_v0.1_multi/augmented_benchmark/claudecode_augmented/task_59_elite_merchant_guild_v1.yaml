# AgentWorld Multi-Agent Task Configuration

task:
  name: "Elite Merchant Guild - Simplified 5-Agent Trading Network"
  description: "Five specialist merchants establish a trading guild, each gathering unique resources and trading with peers to craft guild items"

# Task objectives
objectives:
  primary: "Establish a 5-member merchant guild where each specialist gathers unique resources, trades with peers, and collectively crafts 2x Golden items, 2x Staffs, and 1x Specialty weapon"
  secondary:
    - "Act 1 (Rounds 1-12): Specialization Phase - Each merchant gathers their specialty resources"
    - "Act 2 (Rounds 13-25): Trading Network Phase - Merchants trade resources peer-to-peer to complete recipes"
    - "Act 3 (Rounds 26-38): Crafting Excellence Phase - Each specialist crafts their signature items"
    - "Act 4 (Rounds 39-45): Guild Exhibition - Consolidate and showcase all masterpieces"

# Context and guidance for agents
relevant_game_context: |
  GUILD SNAPSHOT
  - Five merchants must gather their specialties, trade them at the guild hall (528,384), then craft the showcase set by Round 45: 2 golden items (sword, ring), 2 elemental staffs, and 1 iron weapon (heavy sword). Gathering is decentralized (mountains/forest/plains), while smelting and high-level crafting happen at the hub.

  ROLE CHECKLIST
  1. Gold_Baron mines 25 gold ore; Coal_Magnate mines 30 coal. All operate around (230–240, 38–42) and keep a running count in chat.
  2. Timber_Merchant collects 6 logs + 6 string in the western forest (~250,350).
  3. Master_Smelter and Guild_Master stay at the hall preparing inventories, hilts, and crafting plans.

  PHASE FLOW
  - Act 1 (R1-12) Specialization: each merchant focuses on their quota, announcing progress and verifying inventories.
  - Act 2 (R13-25) Trading: everyone marches to the hall using ≤32-tile moves, then transfers resources to Smelter (ores/logs) and Guild_Master (strings/beads/hilts) via transfer_items with verify_inventory confirmations.
  - Act 3 (R26-38) Crafting: Master_Smelter smelts 25 gold + 4 iron bars, while Guild_Master turns logs → sticks → staffs and upgrades them with the special beads.
  - Act 4 (R39-45) Exhibition: Guild_Master crafts the golden sword/ring, completes 2 staffs, and finalizes heavy sword. Everyone confirms holdings before the leader calls complete().

  EXECUTION NOTES
  - Keep the trade order disciplined: ores → Master_Smelter only; utility materials → Guild_Master second.
# Limitations
max_action_steps: 45

