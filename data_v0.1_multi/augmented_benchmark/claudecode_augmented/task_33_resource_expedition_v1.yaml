# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Only lumberjacking, gather 6 logs

task:
  name: "Resource Expedition - Lumber Collection"
  description: "Two agents work together to gather 6x logs from trees"

# Task objectives
objectives:
  primary: "Gather 6x logs through coordinated lumberjacking"
  secondary: # checkpoints
    - "Locate and harvest oak trees"
    - "Complete lumber collection within 15 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a simple lumber gathering expedition.

  OBJECTIVE: Gather logs efficiently through teamwork.

  MISSION REQUIREMENTS:
  - Navigate to tree areas
  - Harvest 6x logs from oak trees
  - Coordinate harvesting efforts

  TEAM COORDINATION:
  - Both agents have lumberjacking skills
  - Share tree locations
  - Avoid harvesting same trees

  LUMBERJACKING:
  🌲 Lumberjacking - logs:
    - harvest_resource on Oak Tree instances
    - Level required: 1+ (Lumberjacking skill)
    - Target: 6x logs total

  DO NOT use complete() until 6x logs are gathered!

# Limitations
max_action_steps: 15

