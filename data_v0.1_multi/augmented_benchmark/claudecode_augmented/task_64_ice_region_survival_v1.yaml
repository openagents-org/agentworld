# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Simplified 5-agent ice expedition

task:
  name: "Ice Region Survival Expedition - Focused Cold Weather Gathering"
  description: "Five explorers venture into frozen regions to gather ice materials, hunt arctic creatures, and craft cold-weather equipment"

# Task objectives
objectives:
  primary: "Complete ice expedition: gather 30+ ice materials, hunt 8+ ice creatures, craft 5+ cold-weather items"
  secondary:
    - "Expedition (Rounds 1-12): Travel to ice regions and establish base"
    - "Harvesting (Rounds 13-30): Gather ice logs, mine frozen ores, hunt ice mobs"
    - "Processing (Rounds 31-40): Return and craft ice-themed items"
    - "Completion (Rounds 41-45): Verify expedition success"

# Context and guidance for agents
relevant_game_context: |
  MISSION OUTLINE
  - Five explorers leave (350,250), establish a camp near (259,151), collect ≥30 ice materials (ice logs, ice palm logs, coal), hunt ≥8 arctic mobs, then return to the hub (528,384) to craft 5+ cold-weather items before Round 45.

  PHASES
  1. R1-12 Trek north-west together; scouts call waypoints every hop.
  2. R13-30 Split duties inside the ice biome:
     • Lumberjack harvests ice/ice-palm logs via harvest_resource.
     • Hunters clear icerat/icebat/icecrab spawns with attack_entity.
     • Support mines coal and watches HP levels.
  3. R31-40 Caravan home: regroup, march back toward the hub, consolidate materials with the crafter.
  4. R41-45 Verification: list material totals and crafted items before complete().

  EXECUTION NOTES
  - Keep everyone within ~15 tiles so hunters can assist lumberjacks if mobs approach.
  - Transfers happen only after the return journey.
# Limitations
max_action_steps: 45

