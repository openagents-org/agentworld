# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - 4 agents, defeat both bosses and collect treasure

task:
  name: "Ancient Ruins Exploration - Full Archaeological Expedition"
  description: "Four agents work together to explore ruins, defeat both guardians, and recover all treasures"

# Task objectives
objectives:
  primary: "Successfully defeat Golden Golem and Big Baby Spooder, then recover ancient treasures"
  secondary: # checkpoints
    - "Establish ruins exploration with full team coordination"
    - "Execute dual guardian combat operations"
    - "Complete full archaeological expedition within 45 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a full-scale archaeological expedition with expanded team and objectives.

  OBJECTIVE: Complete comprehensive ruins exploration with dual boss fights and treasure recovery.

  MISSION REQUIREMENTS:
  - Navigate to Ancient Ruins region (769-784, 657-676)
  - Defeat Golden Golem (Level 0) at (784, 676)
  - Defeat Big Baby Spooder (Level 45) at (769, 657)
  - Explore ruins for treasure chambers
  - Recover ancient artifacts from ruins

  TEAM COORDINATION:
  - Combat specialists handle the two guardians
  - Explorer identifies treasure locations
  - Support provides healing and magical assistance
  - Coordinate timing for sequential boss fights

  COMBAT KNOWLEDGE:
  🥇 Combat - Golden Golem:
    - Location: (784, 676)
    - May have special defensive properties

  🕷️ Combat - Big Baby Spooder:
    - Location: (769, 657)
    - Level 45 with web attacks and high mobility

  💎 Treasure Recovery:
    - Multiple hidden chambers in ruins
    - Search thoroughly after defeating guardians

  DO NOT use complete() until both bosses are defeated!

# Limitations
max_action_steps: 45

