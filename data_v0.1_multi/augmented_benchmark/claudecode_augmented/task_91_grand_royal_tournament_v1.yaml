# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Reduced bosses and crafting targets

task:
  name: "Grand Royal Tournament - Multi-Arena Championship Challenge"
  description: "Twelve agents form three specialized teams to compete in the tournament: Combat Arena (boss battles), Crafting Masters (equipment), and Resource Champions (gathering & feast preparation)"

# Task objectives
objectives:
  primary: "Successfully complete all three tournament challenges: defeat 2+ bosses, craft 4+ equipment items, gather rare resources and prepare a royal feast with 15+ food items"
  secondary:
    - "Phase 1 (Rounds 1-12): Team Formation & Initial Resource Gathering"
    - "Phase 2 (Rounds 13-30): Parallel Challenge Execution - Combat, Crafting, Gathering"
    - "Phase 3 (Rounds 31-45): Final Boss Battle & Grand Feast Celebration"
    - "Complete all three tournament challenges within 45 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  The Grand Royal Tournament requires TWELVE champions to work as THREE specialized teams:
  - COMBAT ARENA TEAM (4 agents): Defeat multiple bosses in battle
  - CRAFTING MASTERS TEAM (4 agents): Forge equipment
  - RESOURCE CHAMPIONS TEAM (4 agents): Gather rare resources & prepare royal feast

  CHALLENGE 1: COMBAT ARENA (Agents 1-4)
  - Defeat at least 2 different boss-level creatures
  - Target: Dark Wolf (1016, 682) and Mermaid (580, 755)
  - Execute synchronized combat with role specialization

  CHALLENGE 2: CRAFTING MASTERS (Agents 5-8)
  - Craft at least 4 items from different categories
  - Items: 1x Heavy Sword, 1x Golden Ring, 1x Silver Ring, 1x Axe
  - Mining, smelting, crafting pipeline

  CHALLENGE 3: RESOURCE CHAMPIONS (Agents 9-12)
  - Gather 6+ different resource types
  - Prepare 15+ food items for the feast
  - Cooked shrimp, chicken, beef, jellyfishsmoothie

  INTER-TEAM COORDINATION:
  - Combat Team → Others: Share boss drops
  - Crafting Team → Combat: Provide crafted weapons
  - Resource Team → Combat: Supply healing foods
  - All teams use global chat for status updates

# Limitations
max_action_steps: 45

