# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Simplified 6-agent dual-corridor evacuation

task:
  name: "Royal Evacuation Command - Core Corridor Defense"
  description: "Six officers evacuate civilians through two escape corridors, repairing one bridge and escorting convoys to safe zones within 38 rounds."

# Task objectives
objectives:
  primary: "Evacuate two civilian groups from (528,384) toward the northern mountains and southern desert while keeping supply wagons intact."
  secondary:
    - "Phase 1 (Rounds 1-10): Recon charts mobs and checkpoints on each corridor."
    - "Phase 2 (Rounds 11-20): Engineers repair Northbridge (510,320) using logs + ironbar."
    - "Phase 3 (Rounds 21-30): Support prepares two convoys with food and flasks."
    - "Phase 4 (Rounds 31-38): Escort teams move convoys, clearing ambushes."

# Relevant game context
relevant_game_context: |
  TEAM STRUCTURE
  - Recon: Agent 1 sweeps ahead using observe_environment radius=48, tags mob clusters.
  - Engineers: Agent 2 gathers 4 logs + 4 ironore/coal, smelts bars, repairs the bridge.
  - Support: Agent 3 collects food/medicine, assembles two supply bundles.
  - Escorts: Agents 4-6 attach to convoys (North/South). Each convoy needs at least one escort.

  CRITICAL DETAILS
  1. Resource plan:
     • 4 logs + 4 ironbar → structural supplies.
     • Convoy kit: 8 flasks, 8 food items per convoy.
  2. Movement rules:
     • Convoys pause every two moves for regroup checks.
     • If mobs spawn, escorts attack before resuming.
  3. Completion: complete() after both convoys check in and bridge is certified.

# Limitations
max_action_steps: 38

