# Success criteria for multi-agent task
success_criteria:
  - 'Two chokepoints are mined clear after braces are placed, with chat proof for each "Channel open" call.'
  - "Pump cell smelts 8 ironbar, crafts 2 pickaxes + 2 staff blanks, and upgrades 1 lightningstaff + 1 icestaff that remain planted at the locks."
  - "Provision cell secures 10 rawtuna, 10 clamobject, and 6 corn, and distributes food evenly using documented transfers."
  - "RaftPilot receives the manifest (bars, staffs, food) before departure and reports status at each lock with escort confirmations."
  - "Supply raft reaches the delta lock, pumps stay active, and complete() is triggered."
