# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Reduced objectives, more initial resources

task:
  name: "Mirefall Canal Restoration - Floodplain Logistics Grid"
  description: "Ten hydrologists reopen the Mirefall canal between the flooded farms (388,520) and the delta lock (460,580), clearing debris, installing pumps, and relaunching a supply raft in 55 rounds."

# Task objectives
objectives:
  primary: "Reopen the Mirefall canal by clearing two silt chokepoints, installing two pump cores, replenishing fish pens, and escorting the supply raft from the upper lock (388,520) to the delta lock (460,580)."
  secondary:
    - "Phase 1: Survey & role call — split into Dredge, Pump, Provision, and Escort cells; log the plan before leaving camp."
    - "Phase 2: Dredge cell mines 12 silt/rock tiles (use mine_resource) and fells 15 logs for braces; confirm braces installed before moving downstream."
    - "Phase 3: Pump cell smelts 8 ironbar, crafts 2 pickaxes, 2 staff blanks, then upgrades one lightningstaff and one icestaff to serve as pump cores."
    - "Phase 4: Provision cell fishes 10 rawtuna + 10 clamobject and forages 6 corn for the farmsteads; share food evenly via transfer_items."
    - "Phase 5: Escort cell keeps mobs off the work crews, then accompanies RaftPilot as the supply raft travels through all locks."

# Relevant game context (Hint)
relevant_game_context: |
  CANAL MAP
  - Locks at y=520, 550, 580. Each lock has a winch lever; two agents must stand nearby when RaftPilot passes.
  - Chokepoints at (392,528), (438,572). Dredge cell clears them in order; after each clearance, announce "Channel n open".

  DREDGE & PUMP DETAILS
  - Dredge team uses mine_resource with pickaxe equipped; after 6 mined tiles, pause to let BridgeWarden place braces.
  - Smelt ironbar at the temporary forge near (394,526). PumpSmith crafts pickaxe (Smithing) for replacements, then craft_item Crafting staff → lightningstaff/icestaff.

  PROVISIONS & RAFT
  - FishWard uses fish_resource at 388,520 (tuna) and 440,570 (clam). Foraging spots around 400,540 yield corn.
  - RaftPilot represents the supply raft inventory. Once pumps are online, transfer all finished goods to RaftPilot before the journey.

  SAFETY RULES
  - Use verify_inventory before and after any transfer.
  - If any agent drops below 60% HP, call "Canal hold" and regroup.
  - complete() only after raft arrival and pump status summary.

# Limitations
max_action_steps: 55

