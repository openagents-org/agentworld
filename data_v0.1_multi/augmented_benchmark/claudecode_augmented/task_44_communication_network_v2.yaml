# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Coordinate crafting through communication

task:
  name: "Communication Network - Coordinated Crafting Pipeline"
  description: "Three agents communicate to coordinate a stick and arrow production pipeline"

# Task objectives
objectives:
  primary: "Coordinate to produce 16x sticks and 12x arrows through communication"
  secondary: # checkpoints
    - "Establish communication for crafting pipeline"
    - "Complete coordinated crafting within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a communication-based crafting coordination scenario.

  OBJECTIVE: Use team communication to coordinate crafting pipeline.

  MISSION REQUIREMENTS:
  - Gatherer collects 4x logs
  - Processor makes 16x sticks from logs
  - Fletcher makes 12x arrows from sticks
  - Coordinate transfers via communication

  TEAM COORDINATION:
  - Announce when materials are ready
  - Request transfers via chat
  - Confirm receipt before crafting

  CRAFTING PIPELINE:
  🌲 Logs → Sticks → Arrows

  CRAFTING RECIPES:
  🪄 Fletching - stick:
    - 1x logs → 4x stick
  🏹 Fletching - arrow:
    - 1x stick → 4x arrow

  DO NOT use complete() until pipeline is complete!

# Limitations
max_action_steps: 25

