# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Both collectors are foragers, no fishing required

task:
  name: "Orchard Protection Mission - Berry and Peach Collection"
  description: "Three agents work together to gather berries and peaches from the orchard"

# Task objectives
objectives:
  primary: "Successfully protect collectors while they gather 4x blueberry and 3x peach"
  secondary: # checkpoints
    - "Establish effective team communication for threat alerts"
    - "Guardian successfully defends team from hostile wildlife"
    - "Complete orchard resource gathering within 20 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a simplified orchard protection scenario with only foraging tasks.

  OBJECTIVE: Successfully gather orchard fruits while protecting the team.

  MISSION REQUIREMENTS:
  - Collect 4x blueberry and 3x peach (no fishing required)
  - Keep all team members alive throughout the mission
  - Use teamwork to balance resource gathering with orchard security

  TEAM COORDINATION:
  - Establish communication protocols for wildlife detection
  - Both collectors focus on foraging tasks
  - Share information about fruit locations
  - Work together to ensure both safety and mission success

  GENERAL STRATEGY:
  - Both collectors are foragers for efficient fruit gathering
  - Guardian provides protection from wildlife
  - Use global chat for real-time coordination

  DO NOT use complete() until ALL objectives are achieved safely!

  GATHERING MECHANICS:
  🫐 Foraging - blueberry:
    - harvest_resource on blueberry instances to get blueberry
    - Level required: 1+ (Foraging skill)
    - Target: 4x blueberry total

  🍑 Foraging - peach:
    - harvest_resource on peach instances to get peach
    - Level required: 5+ (Foraging skill)
    - Target: 3x peach total

# Limitations
max_action_steps: 20

