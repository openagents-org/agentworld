  - "Hub 1 crafts 18+ sticks and 2+ wooden bows for export"
  - "Hub 2 catches 22+ rawshrimp and 9+ jellyfish"
  - "Hub 2 cooks 18+ cookedshrimp and 7+ jellyfishsmoothie"
