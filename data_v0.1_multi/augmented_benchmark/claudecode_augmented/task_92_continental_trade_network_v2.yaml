# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - More rounds, adjusted targets

task:
  name: "Continental Trade Network - Multi-City Commercial Empire"
  description: "Twelve agents establish a trade network spanning multiple regions, producing specialized goods in different cities and coordinating commerce"

# Task objectives
objectives:
  primary: "Establish a functioning continental trade network with 4 specialized trade hubs producing and exchanging goods across 55 rounds"
  secondary:
    - "Phase 1 (Rounds 1-14): Hub Establishment - Set up 4 specialized production centers"
    - "Phase 2 (Rounds 15-28): Initial Production - Each hub produces their specialty goods"
    - "Phase 3 (Rounds 29-42): Trade Route Activation - Coordinate inter-hub resource exchanges"
    - "Phase 4 (Rounds 43-55): Market Fulfillment - Complete trade orders and verify economic success"

# Relevant game context (Hint)
relevant_game_context: |
  Continental trade network with 4 specialized hubs coordinating production and exchanges.

  STRATEGY:
  - Rounds 1-14: Establish hubs, gather resources
  - Rounds 15-28: Produce specialty goods
  - Rounds 29-42: Execute inter-hub trades
  - Rounds 43-55: Verify completion

  PRODUCTION TARGETS:
  Hub 1 (380,20): 28 logs, 18 sticks, 2 bows
  Hub 2 (580,750): 18 cookedshrimp, 7 jellyfishsmoothie
  Hub 3 (230,40): 14 ironbar, 7 goldbar, 3 gold rings
  Hub 4 (235,45): 2 heavy swords, 2 axes, 18 arrows

  TRADES: Hub1→Hub4 (lumber), Hub3→Hub4 (iron), Hub2→All (food), Hub4→All (weapons)

  Use global chat to coordinate. Complete 5+ exchanges. Do NOT call complete() until all goals verified!

# Limitations
max_action_steps: 55

