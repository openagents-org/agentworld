# AgentWorld Multi-Agent Task Configuration

task:
  name: "Grand Jewelry Expedition - Extended 10-Agent Gemstone Empire"
  description: "Ten agents coordinate an extensive expedition involving mob hunting, gemstone gathering, ore mining, and large-scale jewelry crafting"

# Task objectives
objectives:
  primary: "Complete a 5-stage jewelry production expedition creating 3x Ruby Rings, 3x Emerald Pendants, 2x Topaz Rings, and 3x Beryl Pendants"
  secondary:
    - "Stage 1 (Rounds 1-15): Mob Hunting Brigade - Hunt specific mobs for gem drops"
    - "Stage 2 (Rounds 16-25): Mining Operations - Extract gold and special ores"
    - "Stage 3 (Rounds 26-40): Intermediate Crafting - Create base rings and gather materials"
    - "Stage 4 (Rounds 41-55): Sequential Jewelry Assembly - Craft all pendants and rings"
    - "Stage 5 (Rounds 56-60): Quality Control & Distribution - Verify and distribute jewelry"

# Context and guidance for agents
relevant_game_context: |
  EXPEDITION OVERVIEW
  - Ten specialists complete five stages in ~60 rounds to deliver: 3 rubyring, 3 emeraldpendant, 3 berylpendant, 2 topazring. Hunters gather gemstones, miners collect gold + coal + string, and jewelers craft everything at the mountain rendezvous (~230,38).

  STAGE SUMMARY
  1. R1-15 Mob hunting & foraging (Agents 1-4)
     • Ruby_Hunter_1 and Ruby_Hunter_2: chase lvl 15–20 mobs near (350,250) until 3 rubies drop.
     • Gem_Hunter: secure 3 emerald + 2 topaz; switch mob types if drops stall.
     • Combat_Support: forage 3 beryl, then assist kills and consolidate all gems via transfer_items.
  2. R16-25 Mining (Agents 5-6)
     • Gold_Miner extracts ≥8 gold ore; Coal_Miner gathers ≥10 coal and 6 string.
     • Rather than dragging ore to the hub, have Smelter travel toward the mines for pickup.
  3. R26-40 Transit & smelting
     • Smelter reaches the mines, smelts 8 goldbars → crafts 5 goldrings.
     • Jewelers (Agents 8-10) march from (528,384) toward the mines while Combat_Support carries the gems there.
  4. R41-55 Jewelry assembly at the mountain camp
     • Once all crafters are co-located, run a quick transfer log.
     • Jeweler_Rings crafts 3 rubyring + 2 topazring; Jeweler_Pendants crafts 3 emeraldpendant + 3 berylpendant.
  5. R56-60 Quality control
     • Each crafter verify_inventory and broadcast holdings; distribute finished pieces if desired.

  EXECUTION NOTES
  - Use ≤32-tile move_character hops, announcing coordinates at each checkpoint so the team can converge.
  - attack_entity handles combat; heal whenever HP < 60%.
  - Keep a shared checklist in chat ("Rubies 2/3, Gold ore 6/8 …") so jewelers know when to start walking.

  COMPLETION
  - Before complete(), list final inventory totals for all eleven jewelry pieces and note which agent carries each.
# Limitations
max_action_steps: 60

