# Success criteria for multi-agent task
success_criteria:
  - "Central Relay muster recorded with role assignments and verify_inventory snapshots before any travel."
  - "Resource sweep meets targets (15 goldore, 15 ironore, 12 willowlogs, 10 string, 8 bluelily, 8 corn) and totals are confirmed in chat."
  - "Craft queue produces 3 pylon bundles, 1 lightningstaff, 1 firestaff, 2 rings at the central forge with log evidence."
  - "North/Mid towers receive their assigned relics, remain guarded by 2+ agents, and SignalCaller confirms placements."
  - "Spectre is defeated by the Strike team, all agents regroup for the barrier sync, and CommandLead verifies relic placement before complete()."
