# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Reduced crafting targets, simplified objectives

task:
  name: "Stormspire Barrier Reboot - Continental Skyshield Reactivation"
  description: "Ten specialists relight the Stormspire barrier network by synchronizing two relay towers, charging them with crafted relics, and repelling one elite mob within 50 rounds."

# Task objectives
objectives:
  primary: "Craft the Storm Relic set (3 goldbar pylons, 1 lightningstaff, 1 firestaff, 2 rings), install them at the North/Mid towers ((320,120), (350,300)), and defeat the Spectre (230,30) to seal the grid."
  secondary:
    - "Phase 1: Muster at Central Relay (350,300), assign two tower squads (North, Mid) plus a roaming Strike pair; log the formation before splitting."
    - "Phase 2: Resource sweep — Mountain cell mines 15 goldore + 15 ironore, Coastal cell harvests 12 willowlogs + 10 string, Marsh cell gathers 8 bluelily + 8 corn."
    - "Phase 3: Forge & Alchemy — Smelt 8 goldbar + 8 ironbar, craft 3 pylons, 1 lightningstaff, 1 firestaff, 2 rings."
    - "Phase 4: Tower activation — Move in convoys to each tower, plant lightningstaff + ring at North, pylons + firestaff at Mid."
    - "Phase 5: Strike missions — Roaming pair eliminates Spectre (230,30), then all squads regroup at Mid tower for barrier sync before complete()."

# Relevant game context (Hint)
relevant_game_context: |
  STAGING & COMMS
  - Keep everyone within 4 tiles at (350,300) until roles are declared. Use call signs [NORTH], [MID], [STRIKE], [LOGI].
  - Before any team departs, broadcast verify_inventory results for tools and food.

  RESOURCE PATHING
  - Mountain cell operates near (238,48); harvest_resource for logs if pickaxe repairs needed. Mine gold/iron there.
  - Coastal cell collects willowlogs at (175,635) and string from shoreline plants. Marsh cell forages bluelily + corn around (400,520).

  CRAFTING QUEUE
  - Use the forge at (350,300) for all smelting/crafting to centralize verification.
  - Staff pipeline: craft_item Crafting staff for blanks, then use lightningbead/firebead to upgrade.

  TOWER INSTALLATION
  - Travel as convoys (minimum 3 agents). Upon arrival, plant relics by transferring required items to the designated tower captain.
  - Towers must stay staffed: at least two guardians remain within 3 tiles after placement until final sync.

  STRIKE PROTOCOL
  - Strike pair escorts by SignalCaller for heals. Before attacking Spectre, run HP>80% check.
  - After elite falls, everyone regroups at Mid tower for clockwise barrier sync before complete().

# Limitations
max_action_steps: 50

