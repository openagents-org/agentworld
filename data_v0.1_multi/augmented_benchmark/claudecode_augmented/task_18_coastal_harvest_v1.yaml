# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Pre-gathered resources, only need to collect a bit more

task:
  name: "Coastal Harvest Mission - Quick Coastal Gathering"
  description: "Three agents quickly complete a coastal harvest with some resources already gathered"

# Task objectives
objectives:
  primary: "Successfully gather 4x rawshrimp and 2x icelogs with starting resources"
  secondary: # checkpoints
    - "Establish effective team communication"
    - "Complete coastal resource gathering within 20 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a simplified cooperative coastal gathering scenario.

  OBJECTIVE: Complete the coastal harvest quickly with pre-gathered resources.

  CRITICAL: Some resources are already collected!
  - shrimp_fisher_agent starts with 2x rawshrimp
  - ice_logger_agent starts with 1x icelogs

  MISSION REQUIREMENTS:
  - Collect remaining 2x rawshrimp and 1x icelogs
  - Keep all team members alive
  - Use teamwork for efficient completion

  TEAM COORDINATION:
  - Coordinate movements for efficient resource gathering
  - Share information about resource locations
  - Work together to ensure mission success

  GATHERING MECHANICS:
  🎣 Fishing - rawshrimp:
    - harvest_resource on shrimp fishing spots to get rawshrimp
    - Level required: 1+ (Fishing skill)
    - Target: 4x rawshrimp total (already have 2x)

  ❄️ Lumberjacking - icelogs:
    - harvest_resource on ice oak tree instances to get icelogs
    - Level required: 10+ (Lumberjacking skill)
    - Target: 2x icelogs total (already have 1x)

# Limitations
max_action_steps: 20

