# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Extended 9-agent potion empire

task:
  name: "Alchemist Guild - Grand Potion Empire"
  description: "Nine alchemists gather rare herbs, hunt for ingredients, fish exotic seafood, and brew diverse potions and consumables"

# Task objectives
objectives:
  primary: "Brew complete potion collection: 15+ different consumables including healing, food, and specialty items"
  secondary:
    - "Gathering (Rounds 1-22): Collect herbs, hunt animals, fish for ingredients"
    - "Preparation (Rounds 23-38): Process and consolidate ingredients"
    - "Brewing (Rounds 39-55): Cook and craft all consumables"
    - "Guild Hall (Rounds 56-60): Display potion collection"

# Context and guidance for agents
relevant_game_context: |
  GUILD OVERVIEW
  - Nine alchemists must present ≥15 consumables (stews, cooked meats, seafood dishes, smoothies) by Round 60. Three herbalists forage vegetables/mushrooms, two hunters collect meat, two fishers gather seafood, and two Master Brewers at (528,384) handle all cooking.

  TIMELINE
  1. R1-22 Gathering: each squad works its region, announcing ingredient counts and healing whenever HP < 70%.
  2. R23-38 Delivery: all gatherers move toward the guild hall, then transfer ingredients to the brewers.
  3. R39-55 Brewing: the Brewers cook the menu—2x corn stew, 2x tomato stew, 3x cooked chicken, 2x cooked beef, 2x cooked shrimp, tuna sushi, 2x jellyfish smoothie.
  4. R56-60 Exhibition: list the finished dishes, confirm total ≥15.

  EXECUTION NOTES
  - Keep per-team checklists in chat so the brewers know when to begin cooking.
  - If certain ingredients refuse to drop, announce substitutions early.
# Limitations
max_action_steps: 60

