# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Extended 10-agent ice expedition with boss fight

task:
  name: "Ice Region Survival Expedition - Grand Arctic Conquest"
  description: "Ten explorers venture into frozen regions to gather ice materials, hunt arctic creatures, defeat ice boss, and craft cold-weather equipment"

# Task objectives
objectives:
  primary: "Complete ice expedition: gather 80+ ice materials, hunt 25+ ice creatures, defeat Ice Guardian boss, craft 12+ cold-weather items"
  secondary:
    - "Expedition (Rounds 1-15): Travel to ice regions and establish base"
    - "Harvesting (Rounds 16-40): Gather ice logs, mine frozen ores, hunt ice mobs"
    - "Boss Fight (Rounds 41-50): Defeat Ice Guardian"
    - "Processing (Rounds 51-58): Return and craft ice-themed items"
    - "Completion (Rounds 59-62): Verify expedition success"

# Context and guidance for agents
relevant_game_context: |
  MISSION OUTLINE
  - Ten explorers leave (350,250), establish a camp near (259,151), collect ≥80 ice materials, hunt ≥25 arctic mobs, defeat Ice Guardian boss, then return to the hub (528,384) to craft 12+ cold-weather items before Round 62.

  PHASES
  1. R1-15 Trek north-west together in formation.
  2. R16-40 Split duties inside the ice biome:
     • Lumberjacks harvest ice/ice-palm logs via harvest_resource.
     • Hunters clear icerat/icebat/icecrab/icegoblin spawns.
     • Miners extract coal/special drops.
  3. R41-50 Boss Fight: locate Ice Guardian, ensure all HP>90%, execute coordinated attack.
  4. R51-58 Caravan home: regroup, consolidate materials, craft items.
  5. R59-62 Verification: list totals before complete().

  EXECUTION NOTES
  - Keep everyone within ~15 tiles during boss fight for coordinated attacks.
  - Use attack_mob for combat with shared target calls.
# Limitations
max_action_steps: 62

