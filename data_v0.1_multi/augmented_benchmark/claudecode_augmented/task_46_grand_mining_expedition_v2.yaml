# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Mine and craft just 1 pickaxe

task:
  name: "Grand Mining Expedition - Pickaxe Production"
  description: "Three agents mine resources and craft 1x pickaxe"

# Task objectives
objectives:
  primary: "Mine iron ore and coal, smelt bars, craft 1x pickaxe"
  secondary: # checkpoints
    - "Coordinate mining-smelting-crafting pipeline"
    - "Complete pickaxe production within 30 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a focused mining and crafting scenario.

  OBJECTIVE: Produce one pickaxe through coordinated effort.

  MISSION REQUIREMENTS:
  - Mine 5x iron ore and 5x coal (need 5 iron bars for pickaxe)
  - Gather 1x logs for pickaxe handle
  - Smelt 5x iron bars
  - Craft 1x pickaxe

  TEAM COORDINATION:
  - Miner gathers iron ore and coal
  - Lumberjack gathers logs
  - Smith smelts and crafts pickaxe

  STARTING RESOURCES:
  - Miner has 2x ironore + 2x coal
  - Lumberjack has 1x logs (equipped axe)
  - Smith has smithinghammer equipped

  CRAFTING:
  🔥 Smelting - ironbar:
    - 1x ironore + 1x coal → 1x ironbar

  🔨 Smithing - pickaxe:
    - 5x ironbar + 1x logs → 1x pickaxe

  DO NOT use complete() until pickaxe is crafted!

# Limitations
max_action_steps: 30

