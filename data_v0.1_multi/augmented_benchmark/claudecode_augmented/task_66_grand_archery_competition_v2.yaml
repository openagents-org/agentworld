# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Extended 8-agent archery production with gold bows

task:
  name: "Grand Archery Competition - Ultimate Arsenal Production"
  description: "Eight archery specialists mass-produce arrows, craft multiple bow types, and prepare for grand competition"

# Task objectives
objectives:
  primary: "Produce archery arsenal: 80+ arrows, 8+ bows including golden bows"
  secondary:
    - "Materials (Rounds 1-18): Gather feathers, logs, strings, gold ore"
    - "Production (Rounds 19-40): Craft sticks, strings, base items, smelt gold"
    - "Assembly (Rounds 41-55): Mass arrow production, bow crafting"
    - "Competition (Rounds 56-60): Display complete archery arsenal"

# Context and guidance for agents
relevant_game_context: |
  COMPETITION OVERVIEW
  - Produce ≥80 arrows and ≥8 bows (including 2 golden bows) for the grand event by Round 60. Two hunters collect feathers, two lumberjacks harvest logs, one miner gets gold, and the hub trio converts everything.

  TIMELINE
  1. R1-18 Gathering: Feather teams hunt until 80+ feathers. Lumberjacks log for 20+ logs. Gold miner extracts 20+ gold ore + coal.
  2. R19-40 Delivery & Smelting: All gatherers march to hub. Transfer materials. Smelt gold bars.
  3. R41-55 Production: Arrow_Crafter turns logs → sticks → 80 arrows. Bow_Crafters create 6 wooden bows + 2 golden bows.
  4. R56-60 Verification: Publish final counts.

  EXECUTION NOTES
  - Keep a running group checklist ("Feathers 50/80", "Gold bars 8/10").
  - Golden bow requires gold bars + string + logs.
# Limitations
max_action_steps: 60

