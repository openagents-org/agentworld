# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Gather healing materials (blueberry) and coordinate health

task:
  name: "Medical Emergency - Healing Supply Gathering"
  description: "Three agents gather 6x blueberry for healing supplies and coordinate team health"

# Task objectives
objectives:
  primary: "Gather 6x blueberry as healing supplies and maintain team health"
  secondary: # checkpoints
    - "Coordinate foraging and health management"
    - "Complete medical operations within 22 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a medical supply gathering scenario.

  OBJECTIVE: Gather healing supplies and maintain team health.

  MISSION REQUIREMENTS:
  - Gather 6x blueberry for healing supplies
  - Share food resources between agents
  - Maintain all agents at healthy levels
  - Coordinate medical operations

  TEAM COORDINATION:
  - Foragers gather blueberry
  - Coordinator manages health distribution
  - Share resources as needed

  GATHERING:
  🫐 Foraging - blueberry:
    - harvest_resource on blueberry instances
    - Target: 6x blueberry total
    - Blueberry provides healing benefits

  DO NOT use complete() until objectives are achieved!

# Limitations
max_action_steps: 22

