# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - More initial resources, reduced targets

task:
  name: "The Great Migration - Castle Reclamation"
  description: "A convoy mission where 20 agents must escort a supply train of Settlers through a hostile Castle region to reclaim the Throne Room."

objectives:
  primary: "Escort all 8 Settlers and their supplies to the Castle Throne Room (X:712, Y:717) while neutralizing Ice Knight threats."
  secondary:
    - "Vanguard: Clear the path of Ice Knights (Defeat 2)"
    - "Settlers: Transport 120 Logs to the Throne Room (Do not drop or lose items)"
    - "Rear Guard: Protect the Settlers from flanking attacks"
    - "Team: Consolidate all 120 Logs with the Colony Governor (Settler_1) at the destination"
    - "Survival: Ensure no Settlers die during the transit"

relevant_game_context: |
  CONVOY OPERATIONS ORDER

  Mission: Reclaim the Frozen Fortress.
  Start Point: Outskirts (700, 700)
  End Point: Throne Room (712, 717)

  THREAT ASSESSMENT:
  - Region 7-7: Castle/Fortress
  - Hostiles: Ice Knights (Level 62). High Damage, Freeze attacks.
  - Risk: Settlers have minimal combat training. If they die, the mission fails.

  FORMATION STRATEGY:
  - Vanguard (Agents 1-6): Advance 3 tiles ahead of the main group. Aggro any mobs immediately.
  - Settlers (Agents 7-14): Move in a tight pack. STAY BEHIND VANGUARD.
  - Rear Guard (Agents 15-20): Watch the back. Ensure no stragglers.

  MOVEMENT DISCIPLINE:
  - Do not sprint. Move 1-2 tiles per turn and WAIT for formation to realign.
  - Use 'say' to confirm "Sector Clear" before advancing.
  - If an Ice Knight appears, Settlers must STOP and Vanguard must ENGAGE.

  SUPPLY MANAGEMENT:
  - Each Settler carries 15 Logs.
  - Total Cargo: 120 Logs.
  - Upon reaching (712, 717), transfer ALL Logs to Settler_Governor.

  TIME LIMIT: 50 Rounds. The cold is setting in. Move with purpose.

limitations:
  max_action_steps: 50

