# Success criteria
success_criteria:
  - "Each biome team announces core completion with ingredient counts and verify_inventory snapshot"
  - "Cores arrive at the obelisk in Earth → Flame → Tide → Gale → Ice → Shadow order"
  - "Lap start/end messages accompany every handoff"
  - "RelayCaptain never drops below 75% HP; ChantMedic documents any healing"
  - "All six cores rest at the obelisk simultaneously"
  - "No core or key ingredient remains in personal inventories when complete() is called"
  - "Mission completes in 62-65 rounds"
