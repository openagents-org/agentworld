# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Extended 12-agent hexa-biome convergence

task:
  name: "Elemental Relay Ritual - Grand Hexa-Biome Convergence"
  description: "Twelve adepts retrieve six elemental cores from distant biomes and perform a grand relay ritual at the Central Obelisk within 65 rounds."

# Task objectives
objectives:
  primary: "Deliver Earth, Flame, Tide, Gale, Ice, and Shadow cores to the Central Obelisk (500,300) and channel them in sequence."
  secondary:
    - "Phase 1 (Rounds 1-12): Forest team secures the Earth core."
    - "Phase 2 (Rounds 13-22): Desert team secures the Flame core."
    - "Phase 3 (Rounds 23-32): Coastal team secures the Tide core."
    - "Phase 4 (Rounds 33-42): Swamp team secures the Gale core."
    - "Phase 5 (Rounds 43-52): Ice team secures the Ice core."
    - "Phase 6 (Rounds 53-58): Shadow team secures the Shadow core."
    - "Phase 7 (Rounds 59-65): Central relay completes handoffs and seals obelisk."

# Relevant game context
relevant_game_context: |
  CORE RECIPES
  - Earth core: gather beryl (mining) + string, craft berylpendant.
  - Flame core: smelt goldbar, craft goldring for the core token.
  - Tide core: fish rawtuna, cook, pair with lightningbead for tidal focus.
  - Gale core: defeat swamp spectres for feather + bead, craft lightningstaff.
  - Ice core: harvest icelogs + icebeads, craft icestaff.
  - Shadow core: mine topaz + string, craft topazpendant.

  RITUAL PROTOCOL
  1. Biome teams (Agents 1-10) operate independently until cores are ready.
  2. RelayCaptain (Agent 11) stands at (500,300) with baton (any staff).
  3. ChantMedic (Agent 12) keeps RelayCaptain above 75% HP.
  4. Every core arrives in sequence; each team runs a clockwise lap before handoff.
  5. verify_inventory after each handoff.
  6. complete() after all six cores rest at the obelisk.

# Limitations
max_action_steps: 65

