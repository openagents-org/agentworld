# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Single chef with pre-cooked materials, very simple

task:
  name: "Cooperative Shrimp Cooking - Quick Seafood Preparation"
  description: "Two agents work together to prepare cooked shrimp through simple cooking"

# Task objectives
objectives:
  primary: "Prepare cooked shrimp through simple cooking operations"
  secondary: # checkpoints
    - "Execute successful cooking operations"
    - "Complete seafood cooking within 15 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a simple cooperative multi-agent seafood cooking scenario.

  OBJECTIVE: Cook the raw shrimp that seafood_chef_agent already has in inventory.

  CRITICAL: seafood_chef_agent ALREADY HAS 3x rawshrimp in inventory!

  TEAM COORDINATION:
  - Use global chat to coordinate
  - seafood_chef_agent should cook the shrimp immediately
  - assistant_agent can help gather more shrimp if needed

  COOKING RECIPE (CRITICAL - USE THIS EXACT COMMAND):
  🍤 Cooking Recipe - cookedshrimp:
    - Command: craft_item skill=Cooking itemKey=cookedshrimp
    - Materials: 1x rawshrimp → 1x cookedshrimp
    - Level required: 1 (Cooking skill)
    - seafood_chef_agent has Cooking skill and rawshrimp ready!

  SIMPLE STEPS:
  1. seafood_chef_agent should use: craft_item skill=Cooking itemKey=cookedshrimp
  2. This will convert 1 rawshrimp into 1 cookedshrimp
  3. Repeat to cook more shrimp
  4. Once at least 3 cookedshrimp exists, the team can complete()

  DO NOT use complete() until 3x cookedshrimp is in inventory!

# Limitations
max_action_steps: 15

# Agent configurations
agent_1:
  username: "assistant_agent"
  new_character: true

  location:
    x: 580
    y: 750

  skill_levels:
    fishing: 25
    strength: 25
    health: 25

  inventory_items:
    - item: "flask"
      count: 12
    - item: "apple"
      count: 18

  equipped_items:
    - item: "fishingrod"
      count: 1
      enchant: 0
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0

agent_2:
  username: "seafood_chef_agent"
  new_character: true

  location:
    x: 582
    y: 752

  skill_levels:
    cooking: 20
    fishing: 10
    strength: 20
    health: 25

  inventory_items:
    - item: "flask"
      count: 12
    - item: "apple"
      count: 18
    - item: "rawshrimp"
      count: 3

  equipped_items:
    - item: "leatherarmor"
      count: 1
      enchant: 0
    - item: "leatherboots"
      count: 1
      enchant: 0

# Success criteria for multi-agent task
success_criteria:
  - "seafood_chef_agent successfully cooks at least 3 shrimp"
  - "seafood_chef_agent successfully prepares cooked shrimp"
  - "All agents coordinate seafood operations effectively"
  - "Fresh seafood cooking completes within time limit"
