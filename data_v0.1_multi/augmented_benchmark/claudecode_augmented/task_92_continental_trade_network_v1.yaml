  - "Hub 1 crafts 15+ sticks and 2+ wooden bows for export"
  - "Hub 2 catches 18+ rawshrimp and 8+ jellyfish"
  - "Hub 2 cooks 15+ cookedshrimp and 6+ jellyfishsmoothie"
