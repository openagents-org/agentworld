# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Reduced production targets, more initial resources

task:
  name: "Continental Trade Network - Multi-City Commercial Empire"
  description: "Twelve agents establish a trade network spanning multiple regions, producing specialized goods in different cities and coordinating commerce"

# Task objectives
objectives:
  primary: "Establish a functioning continental trade network with 4 specialized trade hubs producing and exchanging goods across 45 rounds"
  secondary:
    - "Phase 1 (Rounds 1-10): Hub Establishment - Set up 4 specialized production centers"
    - "Phase 2 (Rounds 11-22): Initial Production - Each hub produces their specialty goods"
    - "Phase 3 (Rounds 23-35): Trade Route Activation - Coordinate inter-hub resource exchanges"
    - "Phase 4 (Rounds 36-45): Market Fulfillment - Complete trade orders and verify economic success"

# Relevant game context (Hint)
relevant_game_context: |
  Continental trade network with 4 specialized hubs coordinating production and exchanges.

  STRATEGY:
  - Rounds 1-10: Establish hubs, gather resources
  - Rounds 11-22: Produce specialty goods
  - Rounds 23-35: Execute inter-hub trades
  - Rounds 36-45: Verify completion

  PRODUCTION TARGETS:
  Hub 1 (380,20): 25 logs, 15 sticks, 2 bows
  Hub 2 (580,750): 15 cookedshrimp, 6 jellyfishsmoothie
  Hub 3 (230,40): 12 ironbar, 6 goldbar, 2 gold rings
  Hub 4 (235,45): 2 heavy swords, 1 axe, 15 arrows

  TRADES: Hub1→Hub4 (lumber), Hub3→Hub4 (iron), Hub2→All (food), Hub4→All (weapons)

  Use global chat to coordinate. Complete 5+ exchanges. Do NOT call complete() until all goals verified!

# Limitations
max_action_steps: 45

