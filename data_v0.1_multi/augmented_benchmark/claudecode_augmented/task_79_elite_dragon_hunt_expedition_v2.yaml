# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Extended 12-agent epic boss hunting campaign

task:
  name: "Elite Dragon Hunt Expedition - Grand Continental Boss Campaign"
  description: "Twelve elite warriors form a legendary expedition force to hunt bosses across 7 biomes, defeating multiple legendary beasts"

# Task objectives
objectives:
  primary: "Complete an epic boss hunting campaign where 12 agents travel across 7 biomes, defeat 6-7 bosses, and defeat two dragons"
  secondary:
    - "Phase 1 (Rounds 1-10): Equipment Preparation & Team Assembly"
    - "Phase 2 (Rounds 11-18): Forest Expedition - Hunt forest boss"
    - "Phase 3 (Rounds 19-26): Desert Campaign - Hunt desert boss"
    - "Phase 4 (Rounds 27-34): Mountain Assault - Hunt mountain boss"
    - "Phase 5 (Rounds 35-42): Ice Cavern - Hunt ice boss and gather materials"
    - "Phase 6 (Rounds 43-50): Volcanic Battleground - Hunt volcanic boss"
    - "Phase 7 (Rounds 51-58): First Dragon Hunt"
    - "Phase 8 (Rounds 59-65): Final Dragon Hunt - Ultimate Challenge"

# Relevant game context
relevant_game_context: |
  EXPEDITION STRUCTURE (~65 ROUNDS)
  - Twelve warriors run eight phases across seven biomes with multiple dragon encounters.
  - Phase 1: gather logs/ores, smelt ~20 iron bars, craft weapons, stock >=80 heals.
  - Phases 2-6: travel to each biome and defeat regional bosses.
  - Phases 7-8: hunt two legendary dragons.

  EXECUTION NOTES
  - Three tank squad, four DPS squad, two ranger squad, two support squad, one scout.
  - Tanks initiate attack_entity, DPS follows, supports heal/craft between fights.
  - Stay within 15 tiles during combat and heal to >=85% HP before engaging.
  - For dragons, everyone must be at 100% HP with >=10 heals each.
# Limitations
max_action_steps: 65

