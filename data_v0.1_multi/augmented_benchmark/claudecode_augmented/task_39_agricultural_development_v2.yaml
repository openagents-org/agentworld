# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Gather and process food, make cooked fish

task:
  name: "Agricultural Development - Food Processing"
  description: "Three agents gather ingredients and cook 4x cooked tuna"

# Task objectives
objectives:
  primary: "Catch raw tuna and cook 4x cooked tuna for food supply"
  secondary: # checkpoints
    - "Coordinate fishing and cooking operations"
    - "Complete food processing within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is an agricultural food processing scenario.

  OBJECTIVE: Establish food production with fishing and cooking.

  MISSION REQUIREMENTS:
  - Catch raw tuna from fishing spots
  - Cook 4x cooked tuna for food supply
  - Coordinate fishing and cooking

  TEAM COORDINATION:
  - Fishers catch tuna
  - Chef cooks the fish
  - Share resources efficiently

  RECIPES:
  🐟 Fishing - rawtuna:
    - harvest_resource on tuna fishing spots
    - Level required: 1+ (Fishing skill)

  🍳 Cooking - cookedtuna:
    - craft_item skill=Cooking itemKey=cookedtuna
    - Materials: 1x rawtuna → 1x cookedtuna
    - Target: 4x cookedtuna total

  DO NOT use complete() until objectives are achieved!

# Limitations
max_action_steps: 25

