# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Simplified 5-agent 4-phase dungeon expedition

task:
  name: "Progressive Dungeon Expedition - Core Adventure"
  description: "Five adventurers embark on a 4-phase dungeon expedition with equipment upgrades between exploration phases"

# Task objectives
objectives:
  primary: "Complete a 4-phase progressive dungeon expedition spanning 40 rounds with equipment upgrades"
  secondary:
    - "Phase 1 (Rounds 1-10): Initial Preparation - Gather basic materials and craft starting equipment"
    - "Phase 2 (Rounds 11-20): Dungeon Exploration - Scout dungeon and defeat low-level guardians"
    - "Phase 3 (Rounds 21-30): Equipment Enhancement - Gather materials and craft superior gear"
    - "Phase 4 (Rounds 31-40): Deep Dungeon - Explore deeper levels and defeat boss"

# Relevant game context
relevant_game_context: |
  CAMPAIGN STRUCTURE (40 ROUNDS)
  - Five adventurers must clear four sequential phases: prep gear -> dungeon exploration -> upgrades -> boss fight. Equipment and healing pools are upgraded between phases.

  PHASE CHEAT-SHEET
  1. R1-10 Preparation: gather 10 logs, 15 iron/coal, smelt 12 bars, craft starter weapons (heavy swords, axes) and amass 40+ heals.
  2. R11-20 Exploration: move to dungeon area (~200,100), scout with observe_environment, defeat low-level mobs, log loot/HP.
  3. R21-30 Enhancement: retreat to safe ground, gather extra materials, craft rings/arrows, restock heals to 60+.
  4. R31-40 Boss fight: push through to boss chamber, defeat the dungeon boss with coordinated attacks.

  EXECUTION NOTES
  - Always verify_inventory before/after crafting, transfers, or phase transitions.
  - Keep everyone within ~10 tiles during dungeon runs for coordinated healing.
# Limitations
max_action_steps: 40

