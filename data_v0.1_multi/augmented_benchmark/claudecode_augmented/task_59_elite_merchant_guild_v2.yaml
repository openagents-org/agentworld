# AgentWorld Multi-Agent Task Configuration

task:
  name: "Elite Merchant Guild - Extended 9-Agent Trading Empire"
  description: "Nine specialist merchants establish an extensive trading guild, each gathering unique resources and trading with peers to complete specialized collections and craft guild masterpieces"

# Task objectives
objectives:
  primary: "Establish a 9-member merchant guild where each specialist gathers unique resources, trades with peers, and collectively crafts 5x Golden items, 4x Staffs, and 3x Specialty weapons"
  secondary:
    - "Act 1 (Rounds 1-18): Specialization Phase - Each merchant gathers their specialty resources"
    - "Act 2 (Rounds 18-35): Trading Network Phase - Merchants trade resources peer-to-peer to complete recipes"
    - "Act 3 (Rounds 36-52): Crafting Excellence Phase - Each specialist crafts their signature items"
    - "Act 4 (Rounds 53-60): Guild Exhibition - Consolidate and showcase all masterpieces"

# Context and guidance for agents
relevant_game_context: |
  GUILD SNAPSHOT
  - Nine merchants must gather their specialties, trade them at the guild hall (528,384), then craft the showcase set by Round 60: 5 golden items (sword, bow, boots, ring, pendant), 4 elemental staffs, and 3 iron weapons (2x pickaxe + heavy sword). Gathering is decentralized (mountains/forest/plains), while smelting and high-level crafting happen at the hub.

  ROLE CHECKLIST
  1. Gold_Baron and Gold_Miner mine 60 gold ore together; Coal_Magnate mines 70 coal; Iron_Trader mines 10 iron ore. All operate around (230–240, 38–42) and keep a running count in chat.
  2. Timber_Merchant collects 10 logs + 12 string in the western forest (~250,350). Mystic_Collector forages/hunts for 4 regular beads plus lightning/fire/ice beads near (350,250).
  3. Master_Smelter, Jeweler, and Guild_Master stay at the hall preparing inventories, hilts, and crafting plans.

  PHASE FLOW
  - Act 1 (R1-18) Specialization: each merchant focuses on their quota, announcing progress and verifying inventories.
  - Act 2 (R18-35) Trading: everyone marches to the hall using ≤32-tile moves, then transfers resources to Smelter (ores/logs) and Guild_Master (strings/beads/hilts) via transfer_items with verify_inventory confirmations. Smelting of gold begins immediately.
  - Act 3 (R36-52) Crafting: Master_Smelter smelts all 60 gold + 10 iron bars, while Guild_Master turns logs → sticks → staffs and upgrades them with the special beads. Jeweler crafts golden pendant from gold bars.
  - Act 4 (R53-60) Exhibition: Guild_Master crafts the golden sword/bow/boots/ring, completes 4 staffs, and finalizes 2x pickaxe + heavy sword. Everyone confirms holdings before the leader calls complete().

  EXECUTION NOTES
  - Keep the trade order disciplined: ores → Master_Smelter only; utility materials → Guild_Master second. Use chat threads like "Gold 40/60", "Coal delivery next round" to avoid confusion.
  - Smelting 60 gold bars takes time: expect multiple rounds of repeated craft_item(Smelting, goldbar); post milestones every 10 bars so craft planning stays aligned.
# Limitations
max_action_steps: 60

