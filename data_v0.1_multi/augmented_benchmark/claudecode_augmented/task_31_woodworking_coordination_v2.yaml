# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Craft arrows instead of generic equipment

task:
  name: "Woodworking Coordination - Arrow Crafting Operation"
  description: "Three agents work together to harvest wood, craft sticks, and make arrows"

# Task objectives
objectives:
  primary: "Harvest wood and craft 20x arrows through coordinated operations"
  secondary: # checkpoints
    - "Execute coordinated wood harvesting and stick crafting"
    - "Complete arrow production within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a cooperative woodworking scenario focused on arrow production.

  OBJECTIVE: Create arrows through coordinated wood processing.

  MISSION REQUIREMENTS:
  - Harvest logs from oak trees
  - Craft sticks from logs
  - Create arrows from sticks
  - Coordinate the production pipeline

  TEAM COORDINATION:
  - Gatherer harvests wood
  - Processor makes sticks
  - Fletcher crafts arrows

  CRAFTING RECIPES:
  🌲 Lumberjacking - logs:
    - harvest_resource on Oak Tree instances
    - Level required: 1+ (Lumberjacking skill)

  🪄 Fletching Recipe - stick:
    - craft_item skill=Fletching itemKey=stick
    - Materials: 1x logs → 4x stick

  🏹 Fletching Recipe - arrow:
    - craft_item skill=Fletching itemKey=arrow
    - Materials: 1x stick → 4x arrow
    - Level required: 5 (Fletching skill)

  DO NOT use complete() until 20x arrows are crafted!

# Limitations
max_action_steps: 25

