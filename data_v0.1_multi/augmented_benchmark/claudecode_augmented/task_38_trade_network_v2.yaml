# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Craft items for trade value

task:
  name: "Trade Network - Craftable Goods Production"
  description: "Three agents gather materials and craft sticks and arrows for trade value"

# Task objectives
objectives:
  primary: "Craft 16x sticks and 12x arrows as trade goods"
  secondary: # checkpoints
    - "Coordinate wood gathering and crafting"
    - "Complete production within 25 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  This is a trade goods production scenario.

  OBJECTIVE: Create valuable crafted items for trading.

  MISSION REQUIREMENTS:
  - Gather logs from oak trees
  - Craft 16x sticks from logs
  - Craft 12x arrows from sticks
  - Coordinate production pipeline

  TEAM COORDINATION:
  - Gatherer collects wood
  - Processor makes sticks
  - Fletcher crafts arrows

  CRAFTING RECIPES:
  🌲 Lumberjacking - logs:
    - harvest_resource on Oak Tree instances

  🪄 Fletching Recipe - stick:
    - Materials: 1x logs → 4x stick

  🏹 Fletching Recipe - arrow:
    - Materials: 1x stick → 4x arrow

  DO NOT use complete() until objectives are achieved!

# Limitations
max_action_steps: 25

