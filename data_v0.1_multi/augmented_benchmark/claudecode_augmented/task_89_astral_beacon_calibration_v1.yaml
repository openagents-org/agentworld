# Success criteria for multi-agent task
success_criteria:
  - "All ten agents meet at Skywell Plateau, publish team assignments, and state the clockwise activation order."
  - "Forest team crafts a Beryl Pendant and guards the North pedestal with logs for fuel; proof via verify_inventory."
  - "Desert team crafts a Ruby Pendant and delivers it to the East pedestal with escorts."
  - "Frozen team produces a Lightning Staff and slots it at the South pedestal."
  - "Anchors oversee a successful clockwise synchronization (North → East → South) with relics left in place before complete()."
