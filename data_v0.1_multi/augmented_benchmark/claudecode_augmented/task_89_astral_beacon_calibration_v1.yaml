# AgentWorld Multi-Agent Task Configuration
# VARIANT: v1 - Reduced relics, more initial resources

task:
  name: "Astral Beacon Calibration - Celestial Signal Array"
  description: "Ten channelers gather reagents from four biomes to light the Astral Array around the Skywell Plateau (520,420), synchronizing three beacon rings within 50 rounds."

# Task objectives
objectives:
  primary: "Calibrate the Astral Array by crafting three attunement relics (Beryl Pendant, Ruby Pendant, Lightning Staff), installing them at the North/East/South pedestals, and running a full synchronization loop before Round 50."
  secondary:
    - "Phase 1: Reconvene at Skywell Plateau (520,420), assign three biome teams (Forest, Desert, Frozen) plus two Anchors, and note the rotation order."
    - "Phase 2: Forest team harvests logs, mines beryl, crafts a Beryl Pendant, and guards the North pedestal."
    - "Phase 3: Desert team cuts bloodwood, mines ruby, crafts a Ruby Pendant, and escorts the Ember core to the East pedestal."
    - "Phase 4: Frozen team defeats Ice Guardians for lightningbeads, crafts a Lightning Staff, then Anchors coordinate synchronization."

# Relevant game context (Hint)
relevant_game_context: |
  ARRAY GEOMETRY
  - Pedestals: North (520,430), East (540,420), South (520,400). Anchors (ArrayWarden & PulseCaller) stay at the plateau center to read resonance levels.
  - Each pedestal requires one relic plus two guardians within 3 tiles while syncing.

  BIOME RUNS
  - Forest (x: 300-320, y: 360-380): harvest_resource for logs, mine_resource for beryl, craft_item Crafting berylpendant (needs string).
  - Desert (x: 420-450, y: 640-660): harvest bloodwoodlogs, mine ruby nodes, craft_item Crafting rubypendant.
  - Frozen (x: 250-260, y: 150-160): defeat Ice Guardians for lightningbeads, craft_item Crafting staff then lightningstaff.

  TRANSFERS & DEADLOCK AVOIDANCE
  - Use transfer_items only when both parties stand still and have announced inventories.
  - If a team fails to find its gem within 8 rounds, ping Anchors for reroute.

  SYNC PROCEDURE
  1. Slot relic at North pedestal; Anchor records "North lit" with verify_inventory.
  2. Within 3 rounds, East pedestal team slots Ruby Pendant.
  3. Within 3 more rounds, South pedestal slots Lightning Staff. Everyone runs clockwise lap touching each pedestal.

# Limitations
max_action_steps: 50

