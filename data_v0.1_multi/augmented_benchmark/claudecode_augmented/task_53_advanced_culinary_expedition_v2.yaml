# AgentWorld Multi-Agent Task Configuration
# VARIANT: v2 - Extended 5-agent culinary expedition with more dishes

task:
  name: "Advanced Culinary Expedition - Five-Chef Gourmet Production"
  description: "Five agents embark on an extended culinary journey gathering diverse ingredients from multiple regions and crafting advanced food items through cooperation"

# Task objectives
objectives:
  primary: "Complete a comprehensive culinary expedition gathering ingredients across regions and producing multiple advanced food items"
  secondary: # checkpoints
    - "Execute multi-region ingredient gathering operations"
    - "Coordinate complex food preparation and cooking"
    - "Produce diverse food types: stews, cooked meats, and smoothies"
    - "Complete entire culinary operation within 55 rounds"

# Relevant game context (Hint)
relevant_game_context: |
  EXPEDITION SNAPSHOT
  - Five cooks roam the central farms → nearby forests → coastal area to gather ingredients and cook at least: 4 cooked meats (any mix), 1 tomato stew, 1 corn stew, and 2 jellyfish smoothies.

  SUGGESTED TIMELINE (≤55 ROUNDS)
  1. R1-15: ChefForager + AssistantForager sweep the farm belt (≈(260-300,160-200)) for tomatoes, corn, and mushrooms. Share coordinates and totals in chat.
  2. R16-30: HunterGatherer hunts low-level mobs near spawn for raw meats via attack_mob. FisherChef travels to coastal area (~580,750) for jellyfish and shrimp.
  3. R31-45: Everyone regroups at camp (~(400,350)), transfers all ingredients to MasterCook (transfer_items + verify_inventory).
  4. R46-55: MasterCook cooks the meats, then crafts tomato stew (tomato + mushroom + bowl), corn stew (corn + tomato + bowl), and jellyfish smoothies.

  EXECUTION RULES
  - If observe_environment is unavailable, rely on move_character hops (≤32 tiles) and harvest_resource/attack_mob/fish feedback to confirm success.
  - Log every gather/hunt/cook action in chat; mention when ingredients are scarce so plans can pivot.
  - MasterCook announces each finished dish so the team knows when minimum goals are met.

  COMPLETION CHECKLIST
  - Inventory proof (via verify_inventory) for ≥4 cooked meats, ≥1 tomato stew, ≥1 corn stew, and ≥2 jellyfish smoothies.
  - Final chat summary lists total dishes before anyone invokes complete().
# Limitations
max_action_steps: 55

