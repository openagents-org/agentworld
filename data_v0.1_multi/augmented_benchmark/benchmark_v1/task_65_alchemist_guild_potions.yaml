task:
  name: Alchemist Guild - Potion Brewing & Herb Mastery (Variant 1)
  description: Seven alchemists gather rare herbs, hunt for ingredients, and brew diverse potions and consumables
objectives:
  primary: 'Brew complete potion collection: 10+ different consumables including healing, food, and specialty items'
  secondary:
  - 'Gathering (Rounds 1-18): Collect herbs, hunt animals, fish for ingredients'
  - 'Preparation (Rounds 19-32): Process and consolidate ingredients'
  - 'Brewing (Rounds 33-47): Cook and craft all consumables'
  - 'Guild Hall (Rounds 48-51): Display potion collection'
relevant_game_context: |
  GUILD OVERVIEW
  - Seven alchemists must present ≥10 consumables (stews, cooked meats, seafood dishes, smoothie) by Round 51. Two herbalists forage vegetables/mushrooms, two hunters collect meat, two fishers gather tuna/shrimp/jellyfish, and the Master Brewer at (528,384) handles all cooking.

  TIMELINE
  1. R1-18 Gathering: each squad works its region (forest, plains, coast), announcing ingredient counts and healing whenever HP < 70%.
  2. R19-32 Delivery: all gatherers move toward the guild hall using ≤32-tile hops, then transfer ingredients to the Master Brewer (meat/veg/seafood captured separately). Both sides use verify_inventory after every transfer.
  3. R33-47 Brewing: the Master Brewer cooks the menu—corn & tomato stews, cooked chicken ×2, cooked shrimp ×2, cooked beef, tuna sushi, jellyfish smoothie—logging each completion. If bowls are missing, request them via chat so suppliers can fetch replacements.
  4. R48-51 Exhibition: list the finished dishes, confirm total ≥10, and deliver a final summary before complete().

  EXECUTION NOTES
  - Lacking observe_environment? Sweep the suggested coordinate bands manually and rely on harvest_resource/attack_entity results plus inventory counts.
  - Keep per-team checklists (“Veg 12/20”, “Fish 10/15”) in chat so the brewer knows when to begin cooking.
  - If certain ingredients refuse to drop, announce substitutions early (e.g., extra cooked chicken instead of beef) so the total dish count still clears the requirement.
max_action_steps: 59
