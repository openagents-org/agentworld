task:
  name: Grand Jewelry Expedition - Multi-Stage Gemstone Collection & Crafting (Variant 1)
  description: Eight agents coordinate a complex expedition involving mob hunting, gemstone gathering, ore mining, and sequential
    jewelry crafting
objectives:
  primary: Complete a 5-stage jewelry production expedition creating 3x Ruby Rings, 2x Emerald Pendants, 1x Topaz Ring, and
    2x Beryl Pendants
  secondary:
  - 'Stage 1 (Rounds 1-12): Mob Hunting Brigade - Hunt specific mobs for gem drops'
  - 'Stage 2 (Rounds 13-22): Mining Operations - Extract gold and special ores'
  - 'Stage 3 (Rounds 23-35): Intermediate Crafting - Create base rings and gather materials'
  - 'Stage 4 (Rounds 36-48): Sequential Jewelry Assembly - Craft all pendants and rings'
  - 'Stage 5 (Rounds 49-53): Quality Control & Distribution - Verify and distribute jewelry'
relevant_game_context: |
  EXPEDITION OVERVIEW
  - Eight specialists complete five stages in ~53 rounds to deliver: 2 rubyring, 2 emeraldpendant, 2 berylpendant, 1 topazring. Hunters gather gemstones, miners collect gold + coal + string, and jewelers craft everything at the mountain rendezvous (~230,38).

  STAGE SUMMARY
  1. R1-12 Mob hunting & foraging (Agents 1-3)
     • Ruby_Hunter: chase lvl 15–20 mobs near (350,250) until 2 rubies drop.
     • Gem_Hunter: secure 2 emerald + 1 topaz; switch mob types if drops stall.
     • Combat_Support: forage 2 beryl, then assist kills and consolidate all gems via transfer_items.
  2. R13-22 Mining (Agents 4-5)
     • Gold_Miner extracts ≥6 gold ore; Coal_Miner gathers ≥8 coal and 4 string.
     • Rather than dragging ore to the hub, have Smelter travel toward the mines for pickup.
  3. R23-35 Transit & smelting
     • Smelter reaches the mines, smelts 6 goldbars → crafts 3 goldrings.
     • Jewelers (Agents 7-8) march from (528,384) toward the mines while Combat_Support carries the gems there.
  4. R36-48 Jewelry assembly at the mountain camp
     • Once all crafters are co-located, run a quick transfer log (rings → Jeweler_Rings, strings → Jeweler_Pendants, gems delivered accordingly).
     • Jeweler_Rings crafts 2 rubyring + 1 topazring; Jeweler_Pendants crafts 2 emeraldpendant + 2 berylpendant.
  5. R49-53 Quality control
     • Each crafter verify_inventory and broadcast holdings; distribute finished pieces if desired, then summarize the expedition.

  EXECUTION NOTES
  - Use ≤32-tile move_character hops, announcing coordinates at each checkpoint so the team can converge if observe_environment isn’t callable.
  - attack_entity handles combat; heal whenever HP < 60%. Foraging relies on harvest_resource; if a target fails twice, move one tile and retry.
  - Keep a shared checklist in chat (“Rubies 2/2, Gold ore 5/6 …”) so jewelers know when to start walking.

  COMPLETION
  - Before complete(), list final inventory totals for all seven jewelry pieces and note which agent carries each. Only then should a coordinator submit the completion message summarizing all five stages.
