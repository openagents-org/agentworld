task:
  name: Elite Merchant Guild - Multi-Agent Trading & Specialization Network (Variant 1)
  description: Seven specialist merchants establish a trading guild, each gathering unique resources and trading with peers
    to complete specialized collections and craft guild masterpieces
objectives:
  primary: Establish a 7-member merchant guild where each specialist gathers unique resources, trades with peers, and collectively
    crafts 5x Golden items, 3x Staffs, and 2x Specialty weapons
  secondary:
  - 'Act 1 (Rounds 1-15): Specialization Phase - Each merchant gathers their specialty resources'
  - 'Act 2 (Rounds 16-30): Trading Network Phase - Merchants trade resources peer-to-peer to complete recipes'
  - 'Act 3 (Rounds 31-45): Crafting Excellence Phase - Each specialist crafts their signature items'
  - 'Act 4 (Rounds 46-53): Guild Exhibition - Consolidate and showcase all masterpieces'
relevant_game_context: |
  GUILD SNAPSHOT
  - Seven merchants must gather their specialties, trade them at the guild hall (528,384), then craft the showcase set by Round 53: 4 golden items (sword, bow, boots, ring), 3 elemental staffs, and 2 iron weapons (pickaxe + heavy sword). Gathering is decentralized (mountains/forest/plains), while smelting and high-level crafting happen at the hub.

  ROLE CHECKLIST
  1. Gold_Baron mines 47 gold ore; Coal_Magnate mines 54 coal; Iron_Trader mines 7 iron ore. All operate around (230–240, 38–42) and keep a running count in chat.
  2. Timber_Merchant collects 8 logs + 10 string in the western forest (~250,350). Mystic_Collector forages/hunts for 3 regular beads plus lightning/fire/ice beads near (350,250).
  3. Master_Smelter and Guild_Master stay at the hall preparing inventories, hilts, and crafting plans.

  PHASE FLOW
  - Act 1 (R1-15) Specialization: each merchant focuses on their quota, announcing progress and verifying inventories.
  - Act 2 (R16-30) Trading: everyone marches to the hall using ≤32-tile moves, then transfers resources to Smelter (ores/logs) and Guild_Master (strings/beads/hilts) via transfer_items with verify_inventory confirmations. Smelting of gold begins immediately even if not yet finished.
  - Act 3 (R31-45) Crafting: Master_Smelter smelts all 47 gold + 7 iron bars, while Guild_Master turns logs → sticks → staffs and upgrades them with the special beads. Finish intermediate items (gold rings, pickaxe, sword2) as soon as bars exist.
  - Act 4 (R46-53) Exhibition: Guild_Master crafts the golden sword/bow/boots/ring, completes lightning/fire/ice staffs, and finalizes pickaxe + heavy sword. Everyone confirms holdings before the leader calls complete().

  EXECUTION NOTES
  - If observe_environment is unavailable, sweep the specified coordinate bands and rely on harvest_resource feedback plus verify_inventory counts.
  - Keep the trade order disciplined: ores → Smelter first, utility materials → Guild_Master second. Use chat threads like “Gold 30/47”, “Coal delivery next round” to avoid confusion.
  - Smelting 47 bars takes time: expect multiple rounds of repeated craft_item(Smelting, goldbar); post milestones every 10 bars so craft planning stays aligned.
max_action_steps: 44
