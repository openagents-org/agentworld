task:
  name: Elemental Relay Ritual - Quad-Biome Convergence (Variant 1)
  description: Ten adepts retrieve four elemental cores from distant biomes and perform a timed relay ritual at the Central
    Obelisk within 52 rounds.
objectives:
  primary: Deliver Earth, Flame, Tide, and Gale cores to the Central Obelisk (500,300) and channel them clockwise without
    dropping control of any relay baton.
  secondary:
  - 'Phase 1: Forest team secures the Earth core in the western woods.'
  - 'Phase 2: Desert team secures the Flame core near the southern dunes.'
  - 'Phase 3: Coastal team secures the Tide core from eastern fishing shrines.'
  - 'Phase 4: Swamp team secures the Gale core from marsh spectres.'
  - 'Phase 5: Central relay completes a lap per core, then seals the obelisk.'
relevant_game_context: |
  CORE RECIPES
  - Earth core: gather beryl (mining) + string, craft_item Crafting berylpandant to symbolize stability.
  - Flame core: smelt goldbar (ironore+coal -> ironbar; combine to gold? use goldore) and attach to 4 bloodwoodlogs for heat shielding, craft_item Smithing goldring for the core token.
  - Tide core: fish rawtuna, cook into tuna sushi (campfire/cooking), pair with lightningbead drop from coastal mobs for tidal surge focus.
  - Gale core: defeat swamp spectres for feather + bead, craft_item Crafting staff, then upgrade to lightningstaff representing wind channeling.

  RITUAL PROTOCOL
  1. Biome teams (Agents 1-8) operate independently until their cores are ready; each team must post inventory snapshots before departing for the center.
  2. RelayCaptain (Agent 9) stands at (500,300) with baton (any staff). Gale core must arrive last; if the order is broken, restart lap countdown.
  3. ChantMedic (Agent 10) keeps RelayCaptain above 75% HP; if HP falls lower, ritual pauses until healed.
  4. Every time a core arrives, the delivering team runs a clockwise lap around the obelisk (touch N-E-S-W markers) before handing off via transfer_items.
  5. verify_inventory after each handoff and call out “Core X secured – baton state ok” to avoid confusion.
  6. complete() only after all four cores rest at the obelisk, lap summaries are logged, and no extra cores remain in personal inventories.
max_action_steps: 67
