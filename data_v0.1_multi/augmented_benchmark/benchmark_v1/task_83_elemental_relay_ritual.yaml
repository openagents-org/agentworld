success_criteria:
- Each biome team announces core completion with ingredient counts and a verify_inventory snapshot.
- Cores arrive at the obelisk in Earth → Flame → Tide → Gale order; lap start/end messages accompany every handoff.
- RelayCaptain never drops below 75% HP; ChantMedic documents any healing performed mid-ritual.
- All four cores rest at the obelisk simultaneously while agents form a 6-tile ring for the final chant.
- No core or key ingredient remains in personal inventories when complete() is called.
