task:
  name: Ice Region Survival Expedition - Cold Weather Resource Gathering (Variant 1)
  description: Eight explorers venture into frozen regions to gather ice materials, hunt arctic creatures, and craft cold-weather
    equipment
objectives:
  primary: 'Complete ice expedition: gather 50+ ice materials, hunt 15+ ice creatures, craft 8+ cold-weather items'
  secondary:
  - 'Expedition (Rounds 1-15): Travel to ice regions and establish base'
  - 'Harvesting (Rounds 16-35): Gather ice logs, mine frozen ores, hunt ice mobs'
  - 'Processing (Rounds 36-48): Return and craft ice-themed items'
  - 'Completion (Rounds 49-53): Verify expedition success'
relevant_game_context: |
  MISSION OUTLINE
  - Eight explorers leave (350,250), establish a camp near (259,151), collect ≥50 ice materials (ice logs, ice palm logs, coal, specials), hunt ≥15 arctic mobs, then return to the hub (528,384) to craft 8+ cold-weather items before Round 53.

  PHASES
  1. R1-15 Trek north-west together; scouts call waypoints every hop and mark safe clearings. Heal aggressively if cold damage ticks HP down.
  2. R16-35 Split duties inside the ice biome:
     • Lumberjacks harvest ice/ice-palm logs via harvest_resource, logging counts in chat.
     • Hunters clear icerat/icebat/icecrab/icegoblin spawns with attack_entity; confirm kills and loot with verify_inventory.
     • Support duo mines coal/special drops and watches HP levels.
  3. R36-48 Caravan home: regroup, march back toward the hub (≤32-tile moves), consolidate materials with the crafter, and craft tools/weapons/gear from the haul.
  4. R49-53 Verification: list material totals, crafted items, and survival status before complete().

  EXECUTION NOTES
  - If observe_environment isn’t callable, sweep the ice grid manually and rely on harvest/attack feedback; use sleep(1s) after long moves to avoid “too far” errors.
  - Keep everyone within ~15 tiles so hunters can assist lumberjacks if mobs approach.
  - Transfers happen only after the return journey; bundle materials per type (logs, coal, trophies) before handing them to Expedition_Crafter.
max_action_steps: 44
