task:
  name: Grand Harvest Festival - Cooperative Culinary & Decorative Preparation (Variant 1)
  description: Six agents coordinate to prepare for a grand festival by gathering ingredients, cooking dishes, crafting decorations,
    and delivering everything to the festival grounds
objectives:
  primary: 'Prepare and deliver a complete festival package: 6x cooked dishes, 4x decorative jewelry, 2x tools, and 50+ gathered
    resources to Central Festival Grounds'
  secondary:
  - 'Phase 1 (Rounds 1-15): Resource Gathering Spree - Collect ingredients from multiple biomes'
  - 'Phase 2 (Rounds 16-30): Culinary Production - Cook 5 different festival dishes'
  - 'Phase 3 (Rounds 31-42): Decorative Crafting - Create festival decorations and gifts'
  - 'Phase 4 (Rounds 43-50): Grand Festival Assembly - Deliver all items to festival grounds'
relevant_game_context: |
  FESTIVAL SNAPSHOT
  - In 50 rounds six agents must gather 50+ raw ingredients, cook 5 dishes (tomato stew, corn stew, cooked chicken, cooked shrimp, jellyfish smoothie), craft 3 jewelry gifts (beryl pendant, silver ring, topaz ring), and 2 tools (bucket, wooden bow), then deliver everything to the central grounds (528,384).

  ROLES & ROUTES
  - Foragers (Agents 1-2) sweep the western forest belt (~250,350) for tomatoes, corn, onions, mushrooms, fruit, beads/beryl; report totals every few items and walk east toward the hub once they hit ≈40 gathers.
  - Hunter-fisher (Agent 3) patrols the eastern coast (~900,400) fishing shrimp/jellyfish first, then hunts low-level birds for chicken meat, before trekking west to the hub.
  - Hub trio (Agents 4-6) stay near (528,384) ready to receive transfers: Agent 4 cooks, Agent 5 crafts jewelry, Agent 6 handles bucket/bow plus logistics.

  PHASE FLOW
  1. R1-15 Gather: field teams farm materials in parallel; hub logs progress and double-checks starting bowls/strings/hilts.
  2. R16-30 Deliver & Cook: all gatherers converge on the hub using ≤32-tile moves, transfer via transfer_items with verify_inventory confirmations, then Head_Chef cooks the five dishes back-to-back.
  3. R31-42 Craft Decor & Tools: Jeweler turns beryl+string into pendants and irons/gold into rings (mine/smelt on demand if bars are missing). Artisan crafts bucket (3 iron bars) and wooden bow (log+string) once materials arrive.
  4. R43-50 Assembly: everyone states their final inventory, loads items for delivery, and one agent summarizes totals before complete().

  EXECUTION TIPS
  - When observe_environment isn’t available, grid-search the coordinate bands and rely on harvest_resource/attack_entity results plus inventory checks for confirmation.
  - Keep a running checklist in chat ("Veg 30/50", "Seafood ready", "Jewelry 2/3"). Use transfer_items only within ~10 tiles and acknowledge both send/receive sides.
  - Optional ingredients (extra jellyfish/corn) are nice but not required; if something proves unobtainable, announce the substitution and prioritize the minimum deliverables above.
max_action_steps: 62
