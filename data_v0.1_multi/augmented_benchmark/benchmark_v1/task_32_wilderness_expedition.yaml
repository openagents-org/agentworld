task:
  name: Wilderness Expedition - Survival and Resource Collection (Variant 1)
  description: Three agents work together to survive dangerous wilderness areas, defeat wild creatures, and collect available
    resources
objectives:
  primary: Successfully navigate wilderness areas, defeat wild creatures, and gather available resources through team coordination
  secondary:
  - Establish wilderness survival coordination and area navigation
  - Execute safe combat against wild creatures and resource gathering
  - Complete wilderness expedition within 28 rounds
relevant_game_context: |
  This is a cooperative multi-agent wilderness survival expedition requiring teamwork and coordination.

  OBJECTIVE: Survive wilderness areas, defeat wild creatures, and gather available resources through teamwork.

  MISSION REQUIREMENTS:
  - Navigate wilderness areas and explore available locations
  - Defeat wild creatures like Wolves and Worker Ants in coordinated combat
  - Gather available resources using foraging and resource collection
  - Survive combat encounters and environmental challenges

  TEAM COORDINATION:
  - Use global chat to share creature locations and resource discoveries
  - Coordinate between combat, exploration, and resource gathering
  - Share resources and provide mutual support during encounters
  - Work together to navigate terrain and handle challenges safely

  GENERAL STRATEGY:
  - The team needs to explore areas and locate actual creatures and resources
  - Wild creatures like Wolves and Worker Ants require coordinated combat
  - Resources are gathered through foraging and harvest mechanics
  - Health management is important during extended expeditions
  - Balance combat engagement with resource gathering and exploration

  DO NOT use complete() until ALL objectives are achieved by the team!

  WILDERNESS SURVIVAL & COMBAT (CRITICAL KNOWLEDGE):
  🌲 Environmental Navigation:
    - Use observe_environment to scout areas and locate creatures/resources
    - Move carefully between regions to find optimal locations
    - Coordinate movement to maintain team formation
    - Plan routes efficiently to cover more ground

  🐺 Combat - Wild Creatures:
    - Use observe_environment to locate Wolves and Worker Ants in the area
    - Wolves are typically Level 55 creatures requiring coordinated combat
    - Worker Ants are Level 46 creatures, easier to defeat
    - Use appropriate weapons and magic for effective combat
    - Coordinate attacks to handle multiple creatures safely

  🍄 Foraging - Resource Materials:
    - harvest_resource on available resource instances in the area
    - Use available foraging mechanics to gather materials
    - Level required: 15+ (Foraging skill)
    - Focus on resources that actually exist in the game world

  💚 Health Management:
    - Maintain high health levels during expeditions
    - Use available food items (flask, apple) for sustenance
    - Stay close to teammates for mutual support
    - Plan rest periods between combat encounters

  ⚔️ Combat Strategy:
    - Use appropriate weapons and magic for creature types
    - Coordinate attacks to handle multiple enemies
    - Focus fire on one creature at a time for efficiency
    - Use fire magic and other abilities strategically
