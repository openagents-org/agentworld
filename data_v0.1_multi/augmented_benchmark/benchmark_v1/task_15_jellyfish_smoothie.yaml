task:
  name: Cooperative Jellyfish Smoothie - Exotic Beverage Creation (Variant 1)
  description: Three agents work together to create a jellyfish smoothie through advanced fishing, container crafting, and
    specialty cooking
objectives:
  primary: Create a 3x jellyfish smoothies through coordinated exotic fishing and specialty beverage preparation
  secondary:
  - Execute advanced fishing operations for exotic marine life
  - Coordinate specialized container crafting for beverage preparation
  - Complete exotic beverage creation within 25 rounds
relevant_game_context: |
  This is a cooperative multi-agent exotic beverage creation scenario requiring advanced skills.

  OBJECTIVE: Create a jellyfish smoothie through coordinated exotic fishing and specialty beverage preparation.

  TEAM COORDINATION:
  - Use global chat to share locations of exotic marine life and crafting materials
  - Coordinate between advanced fishing and specialized container crafting
  - Share exotic ingredients and beverage components for preparation
  - Work together to complete challenging exotic beverage creation

  GENERAL STRATEGY:
  - The team needs to catch exotic marine creatures (requires advanced fishing skills)
  - Someone needs to craft specialized containers for beverage preparation
  - Exotic beverage creation requires advanced cooking skills and unique ingredients
  - Coordinate advanced fishing with specialized crafting and cooking expertise
  - Balance exotic ingredient gathering with container preparation and beverage crafting

  DO NOT use complete() until ALL objectives are achieved by the team!

  CRAFTING RECIPES (CRITICAL KNOWLEDGE):
  🎣 Fishing - jellyfish:
    - harvest_resource on fishing spot instances to get jellyfish
    - Level required: 5+ (Fishing skill) - ADVANCED FISHING!
    - Tool required: Fishing pole

  🥣 Fletching Recipe - bowlsmall:
    - craft_item skill=Fletching itemKey=bowlsmall
    - Materials: 2x stick → 1x bowlsmall
    - Level required: 1 (Fletching skill)

  🪄 Fletching Recipe - stick:
    - craft_item skill=Fletching itemKey=stick
    - Materials: 1x logs → 4x stick
    - Level required: 1 (Fletching skill)

  🎐 Cooking Recipe - jellyfishsmoothie:
    - craft_item skill=Cooking itemKey=jellyfishsmoothie
    - Materials: 1x jellyfish + 1x bowlsmall → 1x jellyfishsmoothie
    - Level required: 10 (Cooking skill) - ADVANCED COOKING!
max_action_steps: 25
