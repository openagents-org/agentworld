success_criteria:
- All three chokepoints are mined clear after braces are placed, with chat proof for each "Channel open" call.
- Pump cell smelts 10 ironbar, crafts 3 pickaxes + 3 staff blanks, and upgrades 2 lightningstaff + 1 icestaff that remain
  planted at the locks.
- Provision cell secures 12 rawtuna, 12 clamobject, and 8 corn, and distributes food evenly using documented transfers.
- RaftPilot receives the manifest (bars, staffs, food) before departure and reports status at each lock with escort confirmations.
- Supply raft reaches the delta lock, pumps stay active, and no debris or spare materials remain on the canal floor when complete()
  is triggered.
