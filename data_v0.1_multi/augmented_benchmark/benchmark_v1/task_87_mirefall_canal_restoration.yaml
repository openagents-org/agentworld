task:
  name: Mirefall Canal Restoration - Floodplain Logistics Grid (Variant 1)
  description: Ten hydrologists reopen the Mirefall canal between the flooded farms (388,520) and the delta lock (460,580),
    clearing debris, installing pumps, and relaunching a supply raft in 55 rounds.
objectives:
  primary: Reopen the Mirefall canal by clearing three silt chokepoints, installing three pump cores, replenishing fish pens,
    and escorting the supply raft from the upper lock (388,520) to the delta lock (460,580).
  secondary:
  - 'Phase 1: Survey & role call — split into Dredge, Pump, Provision, and Escort cells; log the plan before leaving camp.'
  - 'Phase 2: Dredge cell mines 18 silt/rock tiles (use mine_resource) and fells 20 logs for braces; confirm braces installed
    before moving downstream.'
  - 'Phase 3: Pump cell smelts 10 ironbar, crafts 3 pickaxes, 3 staff blanks, then upgrades two lightningstaff and one icestaff
    to serve as pump cores.'
  - 'Phase 4: Provision cell fishes 12 rawtuna + 12 clamobject and forages 8 corn for the farmsteads; share food evenly via
    transfer_items.'
  - 'Phase 5: Escort cell keeps mobs off the work crews, then accompanies RaftPilot as the supply raft travels through all
    three locks, reporting checkpoint status at each gate.'
relevant_game_context: |
  CANAL MAP
  - Locks at y=520, 550, 580. Each lock has a winch lever; two agents must stand nearby to simulate crank duty when RaftPilot passes.
  - Chokepoints at (392,528), (410,552), (438,572). Dredge cell clears them in order; after each clearance, announce "Channel n open".

  DREDGE & PUMP DETAILS
  - Dredge team uses mine_resource with pickaxe equipped; after 6 mined tiles, pause to let BridgeWarden place braces (drop logs near the wall, describe in chat).
  - Smelt ironbar at the temporary forge near (394,526). PumpSmith crafts pickaxe (Smithing) for replacements, then craft_item Crafting staff → lightningstaff/icestaff once beads arrive from escort drops.
  - Escort fighters must prioritize mobs that drop lightning/ice beads (spectre, iceguardian, mimic). If RNG stalls, rotate teams further east but never leave the dredge area undefended.

  PROVISIONS & RAFT
  - FishWard uses fish_resource at 388,520 (tuna) and 440,570 (clam). Foraging spots around 400,540 yield corn. Split food between workers so nobody runs dry.
  - RaftPilot represents the supply raft inventory. Once pumps are online, Quarterdeck (Escort lead) transfers all finished goods (food, bars, staffs) into RaftPilot before the journey.
  - Raft checklist per lock: (1) announce position, (2) confirm escorts within 4 tiles, (3) verify pump active (lightning or ice staff planted), (4) move to next lock.

  SAFETY RULES
  - Use verify_inventory before and after any transfer. If a pump core is misplaced, halt movement until SignalFlag confirms beacon positions.
  - If any agent drops below 60% HP, call "Canal hold" and regroup; healing takes priority over progress to avoid wipe.
  - complete() only after raft arrival, pump status summary, and confirmation that no debris items remain on the canal floor (drop or transfer extras to RaftPilot first).
max_action_steps: 51
