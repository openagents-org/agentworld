success_criteria:
- 'Phase 1 completed: Team gathers 10+ logs and mines 15+ iron ore and coal'
- 'Phase 1: Team smelts 15 iron bars and crafts 3 Heavy Swords or Axes'
- 'Phase 1: All 10 agents assemble, roles confirmed, equipped and ready'
- 'Phase 2 completed: Forest boss (Treant/Troll Level 15-20) defeated'
- 'Phase 2: Scout successfully locates boss, team travels and coordinates attack'
- 'Phase 3 completed: Desert boss (Scorpion/Raider Level 20-25) defeated'
- 'Phase 3: Team successfully travels long distance (560+ tiles) to desert region'
- 'Phase 4 completed: Mountain boss (Ogre/Giant Level 25-30) defeated'
- 'Phase 4: Team handles difficult boss fight with healing and coordination'
- 'Phase 5 completed: Ice materials gathered (5+ Ice Oak logs, gems if available)'
- 'Phase 5: Equipment upgraded with additional crafted items (rings, pendants, or weapons)'
- 'Phase 6 completed: Team hunts 2-3 volcanic enemies in volcanic region'
- 'Phase 6: Team tests upgraded equipment and prepares for dragon'
- 'Phase 7 completed: DRAGON or LEGENDARY BEAST defeated (Forest Dragon Level 60+ or Hell Hound Level 50+)'
- 'Phase 7: Scout locates dragon, team executes coordinated assault'
- At least 4-5 bosses defeated total across all phases
- All 10 warriors survive expedition with HP > 0 (or at least 8/10 survive)
- Expedition spans 5+ different regions (Forest, Desert, Mountain, Ice, Volcanic)
- Team travels 1000+ total tiles across all phases
- Team uses chat extensively for coordination throughout 52 rounds
- Campaign takes 45-52 rounds (shows proper pacing and preparation)
- Elite Dragon Hunt Expedition successfully completed with legendary victory
