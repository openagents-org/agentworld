task:
  name: Elite Dragon Hunt Expedition - Multi-Region Boss Campaign (Variant 1)
  description: Ten elite warriors form an expedition force to hunt bosses across multiple biomes, culminating in an epic dragon
    battle
objectives:
  primary: Complete a multi-region boss hunting campaign where 10 agents travel across 5 different biomes, defeat 4-5 bosses,
    craft equipment between battles, and ultimately defeat a dragon or legendary beast
  secondary:
  - 'Phase 1: Equipment Preparation & Team Assembly (Gather materials, craft weapons)'
  - 'Phase 2: Forest Expedition (Travel to forest, hunt forest boss Level 15-20)'
  - 'Phase 3: Desert Campaign (Travel to desert, hunt desert boss Level 20-25)'
  - 'Phase 4: Mountain Assault (Travel to mountains, hunt mountain boss Level 25-30)'
  - 'Phase 5: Ice Cavern Preparation (Gather ice region materials, upgrade equipment)'
  - 'Phase 6: Volcanic Battleground (Travel to volcanic region, defeat volcanic enemies)'
  - 'Phase 7: Dragon Hunt Finale (Locate and defeat Forest Dragon Level 60+ or Hell Hound Level 50+)'
  - Complete campaign within 46 rounds with all warriors surviving
relevant_game_context: |
  EXPEDITION STRUCTURE (≈52 ROUNDS)
  - Run seven phases: prep → forest boss → desert boss → mountain boss → ice upgrades → volcanic skirmishes → dragon finale. Survival and coordination matter more than clearing every optional fight.

  KEY PRINCIPLES
  - Always verify_inventory for HP/items before and after each battle.
  - Tanks initiate attack_entity, DPS follows, supports heal/craft between fights, scout locates bosses via observe_environment.
  - Stay within 15 tiles during combat and heal to ≥85% HP before engaging any boss; for the dragon, everyone must be at 100% with ≥8 heals.

  PHASE SNAPSHOT
  1. R1-8 Prep: gather logs/ores, smelt ~15 iron bars, craft heavy swords/axes, stock ≥50 heals.
  2. R9-15 Forest: travel (~200,400), scout a L15-20 boss, defeat it, heal.
  3. R16-22 Desert: long trek to (~720,150), defeat a L20-25 boss, heal.
  4. R23-30 Mountain: head to (~238,48), beat a L25-30 boss (hardest mid-fight), recover fully.
  5. R31-37 Ice: gather ice logs/gems, craft rings/pendants, rebalance heals.
  6. R38-43 Volcanic: practice vs. fire mobs, optional mini-boss if team is healthy.
  7. R44-52 Dragon: scout for Forest Dragon or Hell Hound, regroup, run a full ready check, and execute the final coordinated assault.

  COMPLETION
  - Only call complete() after confirming at least three regional bosses plus the final dragon/hell hound are defeated, all agents survived, and a final chat log summarizes HP status and loot.
