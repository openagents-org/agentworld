task:
  name: Trade Network Operations - Commerce Coordination and Market Development (Variant 2 - Spread Locations)
  description: Three agents work together to establish trade networks, coordinate commercial activities, and develop profitable
    market operations
objectives:
  primary: Successfully establish trade networks, coordinate commercial activities, and develop profitable market operations
  secondary:
  - Establish trade coordination and commercial network development
  - Execute coordinated trading activities and market development procedures
  - Complete trade network operations within 58 rounds
relevant_game_context: |
  This is a cooperative multi-agent trade network scenario requiring commercial coordination and market development skills.

  OBJECTIVE: Establish trade networks, coordinate commercial activities, and develop profitable market operations.

  MISSION REQUIREMENTS:
  - Establish trade coordination operations in suitable commercial areas
  - Coordinate resource collection, item crafting, and market trading for team profit
  - Execute coordinated commercial activities using complementary trade roles
  - Develop profitable trade relationships and coordinate market strategies

  TEAM COORDINATION:
  - Use global chat for complex trade coordination and market status updates
  - Coordinate between resource gathering, crafting operations, and trading activities
  - Share commercial knowledge and provide support during trade negotiations
  - Work together to handle market challenges and coordinate trading opportunities

  GENERAL STRATEGY:
  - This requires resource management skills and commercial coordination
  - Each agent specializes in different trade roles for maximum team profitability
  - Trade operations require precise timing and coordinated resource management
  - Effective commercial coordination enhances team trading capabilities
  - Balance individual trade specialization with team profit objectives

  DO NOT use complete() until ALL objectives are achieved by the team!

  TRADE NETWORK OPERATIONS (CRITICAL KNOWLEDGE):
  📦 Resource Collection Specialization:
    - Use available gathering skills for team resource acquisition
    - Focus on efficient resource collection using lumberjacking, mining, and foraging
    - Coordinate resource gathering activities for maximum team efficiency
    - Provide resource collection support during team trading operations

  🔨 Crafting and Production Specialization:
    - Use available crafting abilities for team item production
    - Focus on creating valuable items for trade and market development
    - Coordinate crafting activities to maximize item value and trade potential
    - Provide crafted items for team trading operations

  💰 Trading and Commerce Specialization:
    - Use available trading opportunities for team profit generation
    - Focus on identifying profitable trade routes and market opportunities
    - Coordinate trading activities to maximize team commercial success
    - Provide market intelligence and trading expertise during operations

  🎯 Team Commercial Coordination:
    - Use observe_environment to locate trading opportunities and resource sources
    - Coordinate resource collection, crafting, and trading for maximum efficiency
    - Practice team commercial strategies using complementary trade roles
    - Execute coordinated trading operations and provide mutual commercial support

  🤝 Commercial Support Operations:
    - Coordinate trading abilities to support team members during market activities
    - Share commercial knowledge and coordinate trading techniques
    - Provide backup commercial support during challenging market conditions
    - Balance individual trade specialization with team profit objectives
max_action_steps: 58
