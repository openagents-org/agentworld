task:
  name: Frostveil Lifeline Convoy - Polar Relief Synchronization (Variant 2 - Spread Locations)
  description: Ten specialists rebuild the frozen supply line between Ridge Camp and the Ice Guardian Outpost, delivering
    beacon staffs, medical kits, and spare tools within 55 rounds.
objectives:
  primary: Deliver the reinforced convoy manifest (logs, iron bars, two lightningstaff, two icestaff, medical rations) from
    Ridge Camp (232,148) to the Ice Guardian Outpost (260,156) while keeping every agent accounted for.
  secondary:
  - 'Phase 1: Stage at Ridge Camp, assign three squads (Resource, Beacon, Escort) and broadcast the role map.'
  - 'Phase 2: Resource squad harvests 24 icelogs, mines 16 ironore + 16 coal, fishes 8 jellyfish, and forages 8 bluelily.'
  - 'Phase 3: Beacon squad smelts 12 ironbar, crafts 3 pickaxe replacements, 4 staff blanks, upgrades two lightningstaff +
    two icestaff from collected beads.'
  - 'Phase 4: Quartermaster consolidates all convoy items, verifies inventory snapshots, and declares the manifest complete.'
  - 'Phase 5: Escort squad guides the convoy through three checkpoints ((240,150), (250,152), (259,151)), defeats roaming
    Ice Guardians, and installs the beacon staffs at the outpost.'
relevant_game_context: |
  RIDGE CAMP PROTOCOL
  - Keep everyone within 6 tiles when staging; confirm roles in chat before splitting up. Always use verify_inventory when reporting gathered amounts.
  - Use harvest_resource target=iceoak or pine variants around (232-240,146-154) for icelogs. Resource squad should travel in pairs to avoid freeze damage.
  - Mine iron/coal veins along the ridge (x 228-238, y 140-150). run_smelter (smelt) only after 16 ore + 16 coal are stockpiled near the portable forge.

  BEACON FABRICATION
  - Craft chain: craft_item skill=Crafting itemKey=staff to make blanks → upgrade with craft_item skill=Crafting itemKey=lightningstaff using lightningbead drops → craft_item skill=Crafting itemKey=icestaff using icebead drops.
  - Lightning beads drop reliably from coastal mimics near (224,359) if ridge mobs refuse to drop them; send two agents if you need to detour.
  - Use transfer_items in front of witnesses; SignalRunner must confirm "Beacon count acknowledged" each time to avoid duplicate claims.

  CONVOY & ESCORTS
  - Designate Quartermaster as the only agent holding icelogs, ironbar, crafted staffs, and medical stock once Phase 4 begins. Everyone else keeps just tools/food.
  - Escort squad (Lead, ScoutSkier, SledgeGuard, PolarMedic) moves in a diamond around Quartermaster; if any escort drifts >5 tiles away, halt and regroup.
  - When mobs appear, Lead tags target in chat with mob ID, then all combatants use attack_mob on that ID. Loot distribution happens only after verify_inventory confirms open slots.

  CHECKPOINT CALLS
  - At each waypoint, recite: location, convoy HP status, item counts, and next heading. Install one lightningstaff at (240,150) and (250,152); install icestaff at (259,151) and the outpost gate (260,156).
  - Final delivery requires PolarMedic to hand over jellyfish + bluelily rations to outpost caretakers (role-played as chat confirmation). Only after beacon placements, ration transfer, and team photo (coordinates broadcast) may anyone complete().
