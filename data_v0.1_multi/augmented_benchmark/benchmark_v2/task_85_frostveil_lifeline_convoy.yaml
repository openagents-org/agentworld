success_criteria:
- Resource squad delivers 24+ icelogs, 16+ iron ore, 16+ coal, 8 jellyfish, and 8 bluelily before Phase 3 begins.
- Beacon squad crafts 3 pickaxe replacements, four staff blanks, and upgrades two lightningstaff plus two icestaff; each craft
  is reported with verify_inventory evidence.
- Quartermaster alone holds the convoy manifest (logs, bars, staffs, medical stock) and confirms totals at each checkpoint.
- Escort squad calls out every mob engagement and keeps all agents within 5 tiles of the convoy during transit.
- Beacons installed at (240,150), (250,152), (259,151), and (260,156) plus ration handoff are confirmed before complete().
