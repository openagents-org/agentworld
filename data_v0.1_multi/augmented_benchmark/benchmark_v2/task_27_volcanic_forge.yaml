task:
  name: Volcanic Forge Mastery - Extreme Heat Crafting (Variant 2 - Spread Locations)
  description: Three agents work together to establish operations in dangerous volcanic regions, harvest rare fire-resistant
    materials, and craft legendary equipment using volcanic forges
objectives:
  primary: Successfully establish volcanic forge operations, harvest rare volcanic materials, and craft a legendary fire-enchanted
    weapon
  secondary:
  - Establish extreme heat survival coordination and volcanic resource mapping
  - Execute safe volcanic material harvesting and forge operations
  - Complete legendary volcanic crafting within 49 rounds
relevant_game_context: |
  This is a cooperative multi-agent volcanic expedition requiring extreme environment survival and advanced crafting.

  OBJECTIVE: Master dangerous volcanic environments to create legendary fire-enchanted equipment using natural volcanic forges.

  MISSION REQUIREMENTS:
  - Navigate to Volcanic/Lava region (coordinates ≈150-250, 580-650, typical ~200, 600)
  - Survive extreme heat environmental damage and lava hazards
  - Harvest rare volcanic materials and fire-resistant resources
  - Utilize volcanic forges for legendary equipment crafting

  TEAM COORDINATION:
  - Use global chat to share safe routes through lava flows and volcanic entrances
  - Coordinate between heat survival, material gathering, and forge operations
  - Share heat-resistant equipment and provide mutual protection against fire damage
  - Work together to navigate dangerous volcanic terrain and lava chambers

  GENERAL STRATEGY:
  - The team needs to reach southwestern volcanic areas while managing heat damage
  - Volcanic regions contain the most dangerous environmental hazards in the game
  - Fire-based creatures and extreme heat require specialized survival tactics
  - Volcanic forges provide unique crafting opportunities unavailable elsewhere
  - Balance exploration with constant health management due to environmental damage

  DO NOT use complete() until ALL objectives are achieved by the team!

  VOLCANIC SURVIVAL & CRAFTING (CRITICAL KNOWLEDGE):
  🌋 Environmental Hazards:
    - Lava flows cause continuous fire damage to players
    - Volcanic caves have extreme heat that drains health rapidly
    - Use healing items constantly to counter environmental damage
    - Plan efficient routes to minimize exposure to lava hazards

  🔥 Fire Creature Combat:
    - Expect high-level fire-based creatures with fire immunity
    - Fire creatures resistant to fire attacks, use ice/water magic if available
    - Coordinate physical attacks and non-fire magic for effectiveness
    - Use ranged combat to avoid close contact with burning enemies

  ⛏️ Volcanic Mining:
    - harvest_resource on volcanic rock deposits for rare fire-resistant ores
    - Volcanic regions contain unique materials unavailable elsewhere
    - Advanced ore and rare material gathering opportunities
    - Mining operations require constant health management due to heat

  🔨 Volcanic Forge Crafting:
    - Volcanic forges allow creation of fire-enchanted equipment
    - Use craft_item with special volcanic materials for legendary items
    - Fire enchantments provide unique combat advantages
    - Volcanic crafting requires advanced smithing skills and rare materials

  🧪 Heat Survival Strategy:
    - Maintain maximum health levels through constant healing
    - Use ice-based equipment for heat resistance if available
    - Coordinate healing rotations among team members
    - Plan quick in-and-out operations to minimize heat exposure
max_action_steps: 49
