task:
  name: Weaponsmith Consortium - Complete Arsenal Production (Variant 2 - Spread Locations)
  description: 'Seven master weaponsmiths create a complete arsenal: 5+ swords, 3+ axes, 2+ bows, and specialty weapons through
    coordinated production'
objectives:
  primary: 'Forge complete weapon arsenal: 5 swords (including golden), 3 axes, 2 bows, 1 pickaxe for total of 11+ weapons'
  secondary:
  - 'Forge 1 (Rounds 1-15): Material Procurement - Mine ores, harvest lumber, gather components'
  - 'Forge 2 (Rounds 16-28): Bar Production - Smelt all metals at central forge'
  - 'Forge 3 (Rounds 29-45): Weapon Forging - Craft all weapon types'
  - 'Forge 4 (Rounds 46-52): Arsenal Completion - Final weapons and verification'
relevant_game_context: |
  ARSENAL PLAN
  - Seven smiths build an 11-piece arsenal (golden sword/bow, heavy swords, battle axes, wooden bow, pickaxe) by Round 52. Mountain miners supply ore, forest suppliers bring logs + string, and the central forge team smelts/crafts everything.

  FLOW
  1. R1-15 Procurement: Iron_Master (30 iron ore), Gold_Master (30 gold ore), Coal_Master (60 coal) mine around (230-240,40). Lumber_Jack harvests 12 logs near (250,350); String_Maker gathers 12 string. Forge team stays at (528,384) monitoring counts.
  2. R16-28 Transport & Consolidation: all gatherers travel toward the forge in ≤32-tile hops, transferring resources via transfer_items (ores/coal → Master_Forger, logs/string → Weaponsmith). When observe_environment is unavailable, rely on grid movement plus harvest confirmations.
  3. R29-45 Production: Master_Forger smelts ~30 iron + ~30 gold bars (announce milestones). Weaponsmith crafts in order: pickaxe, axes, wooden bow, heavy swords, golden sword, golden bow; ensure hilts/strings/logs are allocated before crafting each recipe.
  4. R46-52 Verification: verify_inventory shows every weapon, and the consortium announces “Arsenal complete” before calling complete().

  EXECUTION NOTES
  - Keep a shared progress log (“Gold 18/30”, “String 8/12”) so the forge can plan smelting batches.
  - If smelting lags, prioritize the bars required for non-gold weapons first so counts progress toward the objective.
  - Transfers only succeed within ~10 tiles; both parties must acknowledge receipt and run verify_inventory.
max_action_steps: 93
