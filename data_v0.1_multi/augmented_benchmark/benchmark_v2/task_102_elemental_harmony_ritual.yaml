task:
  name: Elemental Harmony Ritual - The Tri-Element Convergence (Variant 2 - Spread Locations)
  description: Twenty agents must coordinate to craft three types of elemental staffs and perform a synchronization ritual
    in the Magical Region.
objectives:
  primary: Craft 5 Fire Staffs, 5 Ice Staffs, and 5 Nature Staffs, then transfer them to the Ritual Team for the final ceremony.
  secondary:
  - 'Fire/Ice/Nature Teams: Harvest Logs from the Magical Forest'
  - 'All Teams: Process Logs into Sticks (Shafts)'
  - 'Fire Team: Craft 5 Fire Staffs using Fire Beads'
  - 'Ice Team: Craft 5 Ice Staffs using Ice Beads'
  - 'Nature Team: Craft 5 Nature Staffs using Nature Beads'
  - 'Ritual Team: Receive all 15 Staffs and equip them (distribute among members)'
  - 'Ritual Team: Demonstrate power by defeating 1 Ancient Wizard together'
relevant_game_context: "\U0001F52E RITUAL INSTRUCTIONS\n\nThe Grand Magus requires a convergence of Fire, Ice, and Nature.\n\
  You have arrived at the Magical Grove (Region 1-3) with the rare Elemental Beads, but you lack the staffs to house them.\n\
  \nSTEP 1: GATHERING & PROCESSING (Rounds 1-20)\n- Trees are abundant here. Use 'harvest_resource' on Oak Trees.\n- Recipe:\
  \ 1 Log = 4 Sticks (Shafts).\n- Staff Recipe: 5 Sticks + 1 Bead = 1 Elemental Staff.\n- EACH element team has 5 Beads. You\
  \ need 25 Sticks per team (approx 7 logs).\n- WARNING: Ancient Wizards roam here. They are neutral unless provoked, but\
  \ dangerous.\n\nSTEP 2: CRAFTING (Rounds 21-35)\n- Craft your respective staffs:\n  - Fire Team: 'firestaff' (Crafting Lvl\
  \ 35 req - You are buffed)\n  - Ice Team: 'icestaff' (Crafting Lvl 55 req - You are buffed)\n  - Nature Team: 'naturestaff'\
  \ (Crafting Lvl 20 req - You are buffed)\n- Note: You need a base 'staff' first? \n  - Checking recipes: 'firestaff' needs\
  \ 'staff' + 'firebead'. \n  - 'staff' needs 5 sticks + 1 'bead' (Magic Bead).\n  - WAIT: The recipe requires a base 'staff'\
  \ (Magic Staff) first!\n  - You have 'bead' (Magic Bead) in your inventory too!\n  - SO: Logs -> Sticks. Sticks + Magic\
  \ Bead -> Magic Staff. Magic Staff + Elemental Bead -> Elemental Staff.\n\nSTEP 3: THE CONVERGENCE (Rounds 36-50)\n- Transfer\
  \ ALL 15 final staffs to the Ritual Team.\n- Ritual Team members must equip the staffs.\n- Final Act: The Ritual Team must\
  \ defeat 1 Ancient Wizard to prove the staffs' power.\n\n\U0001F4CD LOCATION STRATEGY\n- Stay close (X:163, Y:339).\n- Protect\
  \ the crafters.\n"
