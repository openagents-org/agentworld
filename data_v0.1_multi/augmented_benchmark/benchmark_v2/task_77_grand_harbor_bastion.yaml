success_criteria:
- HarborMarshalEdda maintains the central stockpile and confirms via verify_inventory that resource quotas from Phase 1 were
  hit (≥60 logs, ≥40 feathers, ≥30 ironore, ≥30 coal, ≥20 palmlogs, ≥20 rawshrimp, ≥12 kelp).
- OreChiefSilas crafts 24 ironbar plus 4 pickaxe and 4 axe, announcing milestones in chat.
- BowmasterRen and ArtilleristNia produce 6 woodenbow and 60 arrows, then bundle them into four tower kits with logged transfers.
- All four tower coordinates (180,634 / 185,636 / 190,638 / 195,640) receive a complete kit and the assigned crew posts a
  chat confirmation with remaining ammo counts.
- CookHarper delivers ≥20 cookedshrimp to MedicDae, who confirms medical stock before the boss fight.
- Water Guardian or Mermaid is defeated via coordinated attack_entity calls, and all frontliners report post-fight HP.
- complete() is only called between Rounds 50-53 after HarborMarshalEdda summarizes tower integrity, ammo, meals, and guardian
  outcome.
