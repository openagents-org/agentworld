task:
  name: Grand Harbor Bastion - Coastal Defense Retrofit (Variant 2 - Spread Locations)
  description: Ten harbor specialists rebuild siege batteries, fortify the tidal wall, and repel an elite coastal boss within
    53 rounds
objectives:
  primary: Construct four functional ballista towers at the coastal harbor (175-197, 633-640) and survive the ensuing merfolk
    assault
  secondary:
  - 'Phase 1 (Rounds 1-12): Stockpile timber, ore, feathers, palmlogs, kelp, and seafood while establishing the harbor command
    post'
  - 'Phase 2 (Rounds 13-28): Smelt 24 iron bars, craft 6 ballista frames (woodenbow) + 60 arrows, build repair kits, cook
    20 meals'
  - 'Phase 3 (Rounds 29-40): Install four towers along the seawall, assign crews, and verify ammo and repair materials'
  - 'Phase 4 (Rounds 41-53): Trigger the defense drill, defeat the Water Guardian/Mermaid, heal up, and log the final readiness
    report'
relevant_game_context: |
  BASTION PLAN
  - Ten defenders must rebuild four ballista towers near (185,638) and survive the Water Guardian assault within 53 rounds. Work through four phases: gather → fabricate → install towers → run the defense drill.

  PHASE SUMMARY
  1. R1-12 Resource surge: timber team cuts ≥60 logs + ≥40 feathers, miners pull ≥30 ironore/coal, coastal team harvests ≥20 palmlogs + ≥12 kelp + ≥20 rawshrimp. Every trip ends with transfers to HarborMarshalEdda, who posts totals via verify_inventory.
  2. R13-28 Fabrication: smelt 24 iron bars, forge 4 pickaxes/axes, craft 6 woodenbow frames + 60 arrows, prepare 20 cookedshrimp, and stash repair palmlogs/kelp. HarborMarshal ensures the stockpile matches the checklist before deployment.
  3. R29-40 Tower install: for each seawall coordinate (180,634 up to 195,640) drop 1 woodenbow + 10 arrows + 2 iron bars + 5 logs + 1 tool, assign a crew, and announce “Tower X ready” with leftover ammo counts. Keep spare materials with the marshal for emergencies.
  4. R41-53 Defense drill: scout for the Water Guardian at (197,633), have escorts engage with attack_entity while ballista crews call support shots, then report HP and ammo status. Final readiness report must list tower health, remaining supplies, and guardian outcome before complete().

  EXECUTION NOTES
  - Keep move_character hops ≤32 tiles and stagger carts to avoid collisions; use sleep(2) if two players need the same tower tile.
  - Always run observe_environment before entering a new shoreline or mine and before triggering the boss.
  - Transfers require both sender and HarborMarshalEdda to confirm inventories; log all key counts in chat so everyone knows when quotas are met.
max_action_steps: 83
