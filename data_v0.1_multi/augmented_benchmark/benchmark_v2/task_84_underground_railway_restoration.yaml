success_criteria:
- Three blockages cleared with chat logs referencing tool usage and verify_inventory screenshots.
- Twelve ironbar produced, two replacement pickaxes crafted, and structural braces confirmed by TimberJack.
- Two lightningstaff and two firestaff beacons crafted, planted at specified hubs, and announced in order.
- Security team documents at least four hostile eliminations plus redistribution of any useful drops.
- QuarterCart inventory shows transfer from North Shaft → Mid Hub → South Exit with escorts present.
- All agents stand at South Exit to declare the tunnel safe before complete().
