task:
  name: Enchanted Jewelry Workshop - Gemstone Collection & Crafting (Variant 2 - Spread Locations)
  description: Six jewelry artisans gather rare gems, craft base jewelry, and create 15+ enchanted pieces
objectives:
  primary: 'Create complete jewelry collection: 15+ pieces including 5 rings, 5 pendants, 5 base items'
  secondary:
  - 'Gem Hunt (Rounds 1-15): Hunt mobs and forage for 20+ gemstones'
  - 'Metal Works (Rounds 16-30): Mine and smelt metals for base jewelry'
  - 'Crafting (Rounds 31-45): Create all jewelry pieces'
  - 'Exhibition (Rounds 46-50): Display complete collection'
relevant_game_context: |
  WORKSHOP SNAPSHOT
  - Six artisans must finish 15 jewelry pieces (5 rings, 5 pendants, 5 base pieces) by Round 50. Gem hunters operate near (350,250), foragers in the western forest, metalsmith mines in the mountains, and the Master Jeweler assembles everything at (528,384).

  GAME PLAN
  1. R1-15 Gem Hunt: Agents 1-2 farm goblins/skeletons for rubies/emeralds/topaz; Agents 3-4 forage beryl and string; Agent 5 mines gold/iron + coal. Report tallies every few drops and verify inventories before leaving the region.
  2. R16-30 Delivery & Smelting: all gatherers converge on the hub (≤32-tile hops), hand over materials via transfer_items (gems → Master Jeweler, ores → Metal_Artisan). Metal_Artisan smelts 8 gold bars and 10 iron bars during this window.
  3. R31-45 Crafting: Master Jeweler crafts base rings (gold/silver) then upgrades them with gemstones; pendants consume beryl/emerald/ruby + string. Log each craft (“Ruby ring 2/2”).
  4. R46-50 Exhibition: verify_inventory shows at least 15 finished pieces, list the set in chat, then call complete().

  EXECUTION NOTES
  - Without observe_environment, sweep the suggested coordinate grids manually; rely on harvest_resource or attack_entity outcomes plus verify_inventory counts.
  - Transfer only within ~10 tiles and require both sender/receiver confirmations (“Sent 3 rubies”, “Received 3 rubies – verified”).
  - If certain gems refuse to drop, communicate substitution plans early (e.g., craft extra silver rings) so the tally still hits 15.
max_action_steps: 79
